mance","s":"2026-05-29","e":"2026-08-30","st":"11:00","et":null,"u":"kunsthalgent","c":"New York","co":"","p":"https://www.instagram.com/p/DZo_leLjeeQ/","x":"With 𝗨𝗻𝘁𝗶𝘁­𝗹𝗲𝗱 (𝗽𝗹𝗼𝘁 𝗳𝗼𝗿 𝗱𝗶𝗮­𝗹𝗼­𝗴𝘂𝗲), New York/Berlin-based artist 𝗔𝘀𝗮𝗱 𝗥𝗮𝘇𝗮 @asaaddo transforms our hall church into a tennis court, not just to be looked at, but to be experienced firsthand. On-site tennis coaches will invite visitors to play a game. The meaning of the work lies in a sensory experience that goes beyond seeing and hearing; it is about feeling, smelling, and tasting, as well as the meditative, repetitive act of playing tennis.   With this installation, Asad Raza focuses on the participatory and performative aspects of art. He invites the audience to hit a ball with the tennis coaches on-site as a form of meditation. The competitive element of the game is deliberately ignored to serve as a counterweight to our performance-driven society. \n\nThe church, traditionally a place of one-way communication and higher authority, thus becomes a space for reciprocity, play, and relaxation. \n••••••••••••  𝗔𝘀𝗮𝗱 𝗥𝗮𝘇𝗮 — ‘𝗨𝗻𝘁𝗶𝘁­𝗹𝗲𝗱 (𝗽𝗹𝗼𝘁 𝗳𝗼𝗿 𝗱𝗶𝗮­𝗹𝗼­𝗴𝘂𝗲)’ 29.05.2026 — 30.08.2026 Weekends: 11:00 — 18:00\nEvery day during Gentse Feesten: 11:00 — 18:00\n\n📷 @michieldecleene","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-16","ld":-18,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Mercedes Llanos‘s artworks are currently on view at the Balice Hertling Gallery, as par...","k":"exhibition","s":"2026-06-25","e":"2026-08-30","st":null,"et":null,"u":"balicehertling","c":"New York","co":"","p":"https://www.instagram.com/p/DaA0S_XjCiz/","x":"Mercedes Llanos‘s artworks are currently on view at the Balice Hertling Gallery, as part of the exhibition “Entresueños”, until August 30th 2026.\n\nMercedes Llanos (b. 1992, Mar del Plata, Argentina) lives and works in New York, USA. Her first solo exhibition with Balice Hertling took place in 2022. Recent exhibitions include Amanita, New York (2024); Espacio Tacuarí, Buenos Aires (2023); and Balice Hertling, Paris (2025, 2022), among others.\n\nMercedes Llanos\nBed #4, red spiral signifies past trauma, 2026\nOil and graphite on canvas\n195.6 x 264.2 cm\n77 x 104 in\n\nMercedes Llanos\nBed #7, codependencia radioactive, 2026\nOil and graphite on canvas\n195.6 x 264.2 cm\n77 x 104 in\n\n@mercedesllanosart #balicehertling","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-25","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This summer, Sundays are for cinema. 🍿","k":"screening","s":"2026-07-05","e":"2026-08-30","st":null,"et":null,"u":"sharjahart","c":"Sharjah","co":"","p":"https://www.instagram.com/p/DZ7kh_OhFmw/","x":"This summer, Sundays are for cinema. 🍿\n\nJoin us at Sunday Cinema Club, a new weekly film programme featuring animated fantasies, sci-fi classics and works of Arab cinema.\n\nFrom magical journeys and lunar expeditions to stories of identity and belonging, each screening is accompanied by a talk or workshop that explores the film’s cinematic language or social background.\n\n🎬 Sunday Cinema Club\n📅 5 July–30 August 2026\n📍 Photography Gallery, Al Manakh, Sharjah\n\nFree admission. Discover the full programme and book your tickets through the link in our bio.\n\nهذا الصيف.. موعدنا مع السينما كل يوم أحد. 🍿\n\nانضموا إلينا في «نادي سينما الأحد»، وهو برنامج سينمائي أسبوعي جديد يقدّم لكم أفلام تحريك، وكلاسيكيات الخيال العلمي، وأفلاماً عربية مميزة.\n\nمن عوالم التحريك الساحرة ومغامرات الفضاء ورحلات القمر إلى حكايات الهوية والانتماء، يصاحب كل عرض نقاش أو ورشة تستكشف اللغة السينمائية للفيلم وخلفيته الاجتماعية.\n\n🎬نادي سينما الأحد\n📅 5 يوليو - 30 أغسطس 2026\n📍رواق الفوتوغراف، المناخ، الشارقة\n\nالدخول مجاني. استكشفوا البرنامج كاملاً واحجزوا تذاكركم عبر الرابط الموجود في الوصف.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-06-23","ld":12,"dl":"2026-08-30","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"~ UPCOMING EXHIBITION","k":"opening","s":"2026-07-05","e":"2026-08-30","st":"17:00","et":null,"u":"shimmer__shimmer","c":"Bangkok","co":"","p":"https://www.instagram.com/p/DaCdVZ-oYD4/","x":"~ UPCOMING EXHIBITION\n\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned with Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nCurated by Shimmer\nEloise Sweetman and Jason Hendrik Hansma\n\n5 July - 30 August, 2026\n\nOpening reception:\nSunday 5 July, 17:00 - 21:00\n\n_\n\nSTORAGE\n3rd Fl. 469 Phra Sumen Rd. Bangkok, Thailand\nopening hours:\n\n14:00 - 19:00, Thu-Sun","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-26","ld":9,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"All the works in this show are in precarious states of change. Unfinished is not the sa...","k":"other","s":"2026-07-05","e":"2026-08-30","st":"14:00","et":null,"u":"storage.bkk","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbaOp-mgq7x/","x":"All the works in this show are in precarious states of change. Unfinished is not the same as abandoned. Unfinished means we are bound into a relationship with change. “Be ahead of all parting, as if it had already happened,” Rilke told us. “The non-being inside you allows you to vibrate, in full resonance with your world. Use it for once.” That blue memory, the last hue to fade, that invitation to move.\n\n~\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned with Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nCurated by Shimmer @shimmer__shimmer  Eloise Sweetman and Jason Hendrik Hansma\n@eloise_sweetman @jason_hendrik_hansma \n5 July - 30 August, 2026\n\nผลงานทั้งหมดในนิทรรศการครั้งนี้ต่างตกอยู่ในสภาวะอันเปราะบางของการเปลี่ยนแปลง ความไม่เสร็จสิ้นมิใช่สิ่งเดียวกับการถูกละทิ้ง หากแต่ความไม่เสร็จสิ้นนั้นหมายถึงการที่พวกเราได้ผูกพันตนเองเข้ากับความสัมพันธ์แห่งความแปรเปลี่ยน “จงก้าวไปข้างหน้าก่อนการพรากจากทั้งปวง ราวกับว่ามันได้เกิดขึ้นแล้ว” Rainer Maria Rilke เคยบอกพวกเราไว้ “ความไม่มีตัวตนภายในตัวคุณ จะอนุญาตให้คุณได้สั่นสะเทือน และสะท้อนก้องอย่างเต็มเปี่ยมไปพร้อมกับโลกของคุณ จงใช้มันดูสักครั้ง” ความทรงจำสีฟ้าสีนั้น เฉดสีสุดท้ายที่จะเลือนหายไป และคำเชื้อเชิญให้พวกเราได้ออกเดินทางและเคลื่อนต่อไป\n\n~\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned \nwith Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nคิวเรท โดย Shimmer\nEloise Sweetman และ Jason Hendrik Hansma\n5 กรกฎาคม - 30 สิงหาคม 2569\n\nขอขอบคุณ Mondriaan Fonds, The Felix Gonzalez-Torres Foundation, Alejandra Rios and Mercedes Saenz (Mexico City), BQ (Berlin)\nนิทรรศการและกิจกรรมของ STORAGE ได้รับการสนับสนุนจากเงินอุดหนุนการพัฒนาและส่งเสริมศิลปะร่วมสมัย ประจำปีงบประมาณ พ.ศ. ๒๕๖๙ โดยสำนักงานศิลปวัฒนธรรมร่วมสมัย กระทรวงวัฒนธรรม\n\nรูปถ่าย: Atelier 247 \n_\nSTORAGE \nชั้น 3 บ้านเลขที่ 469 ถนนพระสุเมรุ กรุงเทพฯ\nเปิดทุกวันพฤหัสบดี - วันอาทิตย์\nเวลา: 14:00 - 19:00 น.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":-25,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"…continue from the previous post","k":"exhibition","s":"2026-07-05","e":"2026-08-30","st":"14:00","et":null,"u":"storage.bkk","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbIKmldAIOc/","x":"…continue from the previous post\n\nWe are not only concerned with Mia’s eyes themselves, but with the cyan ink, which relies on a negative trace to appear on the surface of the paper. That trace, that tired surface, here today, slowly gone tomorrow.\n\nGone tomorrow is deeply embedded in Jochen Lempert’s work. Presented here are two images, both featuring what appear to be two bicycles photographed 15 years apart. Small beetles cluster on a gear shifter; in the other image, a lepidopteran in flight centres itself in the frame. Seasonality shifts us into movement. As you might remember, the flight of a lepidopteran is an invitation for us, as children, to chase and leap up high. Schmetterling! ผีเสื้อ! Butterfly! With giggles that fall back into nature, and into that space at STORAGE too, where the windows are left open and Bangkok comes in: her bugs, her emeralds, rubies, sapphires, her polished beetles as lures for us to move outwards, over borders, into both memory and future.\n\n~\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned with Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nCurated by Shimmer Eloise Sweetman and Jason Hendrik Hansma\n5 July - 30 August, 2026\n\nSpecial thanks to Mondriaan Fonds, The Felix Gonzalez-Torres Foundation, Alejandra Rios and Mercedes Saenz (Mexico City), BQ, Berlin @bq_berlin \n\nSTORAGE programme is supported by the Office of Contemporary Art and Culture, Ministry of Culture (Fiscal Year 2026)\n\nPhoto: Atelier 247 \n_\nSTORAGE\n3rd Fl. 469 Phra Sumen Rd. Bangkok, Thailand\nopening hours: \n14:00 - 19:00, Thu-Sun\n\nสามารถอ่านภาษาไทยได้ที่คอมเมนต์ด้านล่าง\n\nJOCHEN LEMPERT\n“Ohne Titel” 2020\nSilver gelatin print\n29.7 x 23.3 cm\nEdition of 5\nCourtesy of BQ, Berlin\n\nJOCHEN LEMPERT “Ohne Titel (Harmonia, Hamburg, 2005)” 2005\nSilver gelatin print\n37.2 x 24.7 cm\nEdition of 5\nCourtesy of BQ, Berlin","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":-18,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"In response to the context of STORAGE, Bangkok, an art space in a former printing house...","k":"exhibition","s":"2026-07-05","e":"2026-08-30","st":"14:00","et":null,"u":"storage.bkk","c":"Berlin","co":"","p":"https://www.instagram.com/p/DapLMc7AEOo/","x":"In response to the context of STORAGE, Bangkok, an art space in a former printing house that specialised in Buddhist texts, the exhibition begins with “Untitled”, 1991 by Felix Gonzalez-Torres. This work enacts rhythm, multiplicity, and the dispersal of material into the world. We are drawn to the paper stack because of its shifting, changing mass, as well as Gonzalez-Torres’s instruction to choose a blue. He once said, “For me, if a beautiful memory could have a color, that color would be light blue.”\n\n~\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned with Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nCurated by Shimmer Eloise Sweetman and Jason Hendrik Hansma\n5 July - 30 August, 2026\n\nเพื่อตอบรับกับบริบทเฉพาะของ STORAGE พื้นที่ศิลปะซึ่งตั้งอยู่ในอาคารโรงพิมพ์เก่าที่ผลิตสิ่งพิมพ์ที่เกี่ยวข้องกับพุทธศาสนาเป็นส่วนใหญ่ นิทรรศการจึงเริ่มต้นด้วยผลงาน “Untitled”, 2534 โดย Felix Gonzalez-Torres ผลงานที่เผยให้เห็นจังหวะ การทวีคูณ และการกระจายตัวออกสู่โลกกว้าง สิ่งที่ดึงดูดพวกเราให้เข้าหากองกระดาษนี้ ไม่เพียงเป็นเพราะมวลที่เปลี่ยนแปลงและแปรผันอยู่ตลอดเวลา หากยังรวมถึงคำกำหนดของ Gonzalez-Torres ที่ระบุให้เราสามารถเลือกเฉดของสีฟ้าเองด้วย เขาเคยกล่าวไว้ว่า “สำหรับผม หากความทรงจำอันงดงามมีสีได้ สีนั้นก็คงเป็นสีฟ้าอ่อน”\n\n~\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned \nwith Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nคิวเรท โดย Shimmer\nEloise Sweetman และ Jason Hendrik Hansma\n5 กรกฎาคม - 30 สิงหาคม 2569\n\n——\n\nSpecial thanks to Mondriaan Fonds, The Felix Gonzalez-Torres Foundation @felixgonzaleztorres.foundation , Alejandra Rios and Mercedes Saenz (Mexico City), BQ (Berlin)\n\nSTORAGE programme is supported by the Office of Contemporary Art and Culture, Ministry of Culture (Fiscal Year 2026)\n\nPhoto: Atelier 247\n\n_\nSTORAGE\n3rd Fl. 469 Phra Sumen Rd. Bangkok, Thailand\nopening hours: \n14:00 - 19:00, Thu-Sun\n\nFELIX GONZALEZ-TORRES “Untitled” 1991\nPrint on paper, endless copies\n3 1/4 inches at ideal height x 11 x 8 1/2 inches (, original paper size)\nEdition of 1, 1 AP\nCourtesy of Collection of Alejandra Rios and Mercedes Saenz, Mexico City","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-11","ld":-6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Kunsthal Gent heads to 𝗞𝘂𝗻𝘀𝘁𝗲𝗻𝗳𝗲𝘀𝘁𝗶𝘃𝗮𝗹 𝗪𝗮𝘁𝗼𝘂 @kunstenfestivalwatou from 15 July to 30 A...","k":"screening","s":"2026-07-15","e":"2026-08-30","st":null,"et":null,"u":"kunsthalgent","c":"Dublin","co":"","p":"https://www.instagram.com/p/DaNFAK1DUzW/","x":"Kunsthal Gent heads to 𝗞𝘂𝗻𝘀𝘁𝗲𝗻𝗳𝗲𝘀𝘁𝗶𝘃𝗮𝗹 𝗪𝗮𝘁𝗼𝘂 @kunstenfestivalwatou from 15 July to 30 August! \n\nCurated by Danielle van Zuijlen @daniellevanzuijlen alongside @bart.lodewijks and @michaelvandebril this year’s edition is titled “Gemene Wegen” (Common Ways), inspired by a border road shared between Belgium and France: a pla­ce of dif­fe­ren­ce, con­flict and con­nec­ti­on at once. \n•••••••\n\n𝗪𝗵𝗮𝘁 𝘄𝗲 𝗮𝗿𝗲 𝗯𝗿𝗶𝗻𝗴𝗶𝗻𝗴 𝘁𝗼 𝘁𝗵𝗲 𝗳𝗲𝘀𝘁𝗶𝘃𝗮𝗹: \n• 𝗗𝗲𝘃𝗲𝗹𝗼𝗽𝗺𝗲𝗻𝘁 𝗽𝗿𝗼𝗴𝗿𝗮𝗺𝗺𝗲: Seasonal Neighbours @seasonalneighbours explores the relationship between residents and seasonal workers, while Volksdansen* reclaims Flemish folk dance traditions with a participatory “Harvest Festival.” With @sphinxcinema we are also supporting Marie Vanderauwera’s Cinema Watou, featuring low-stimulus film screenings every Sunday evening.\n\n• 𝗧𝗵𝗲 𝗣𝗶𝗿𝗮𝘁𝗲 𝗣𝗮𝘃𝗶𝗹𝗶𝗼𝗻: Together with @bepart_platform we present Nico Dockx’s artwork hosting events by S.M.A.K., @extra_city and collectives @m_a_n_o_e_u_v_r_e and Shif_t*, alongside local neighborhood activities. \n\n• 𝗙𝗲𝗮𝘁𝘂𝗿𝗲𝗱 𝗔𝗿𝘁𝗶𝘀𝘁𝘀: Discover works by Diego Herman, Şengül Özdemir, Elke Uitentuis, and De Ambulanten.\n\n• 𝗘𝗻𝗱𝗹𝗲𝘀𝘀 𝗘𝘅𝗵𝗶𝗯𝗶𝘁𝗶𝗼𝗻: Fiona Hallinan’s “Fragment Mediation” @fink_ (a long table made from a demolished Dublin church) travels to the Watou church. Jesse Jones’s “Syllabus” @jessepresleyjones is also present as a large flag and contract, inviting you to explore the work before the curtain returns to Kunsthal Gent. \n𝗘𝗹𝘀𝗲𝘄𝗵𝗲𝗿𝗲 𝗮𝘁 𝘁𝗵𝗲 𝗳𝗲𝘀𝘁𝗶𝘃𝗮𝗹: \nAt the Douviehoeve, we delve into ‘the commons’ and our relationship with the landscape. This location features work by Johan Grimonprez, Wim Cuyvers and Marjolijn Dijkman.  \n• Suzanne Treister showcases tarot cards exploring technology and power, alongside AIAI Poetry, an algorithm generating new language from forty years of Watou poets.\n\n• The fictional civilization of ANT Collective incorporates collection pieces from @smakgent , while @019ghent constructs a wheelchair-accessible ramp zigzagging through the landscape at De Lovie Castle. \n••• Visit the Watou website for more info","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-30","ld":15,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"AGNES PELOTON","k":"opening","s":"2026-07-18","e":"2026-08-30","st":"15:00","et":null,"u":"joanjonasbrothers","c":"Houston","co":"","p":"https://www.instagram.com/p/DaosldHCXPQ/","x":"AGNES PELOTON\nJuly 18-August 30, 2026\n@basketbooksandart \nHouston, Texas\n\nOpening Reception: \nJuly 18, 2026 \n3 PM-5 PM\n\n…In a “post-Peloton” era, why should we bother to listen to the spiritual fabric of energy when sheer survival feels more urgent?  The fact is that – in its fundamental ineffability – the mystical and the spiritual constitutes that which cannot be reduced to a data point. This metric-less stuff is vital to cultivate amid a dystopian, data-driven culture in which mass surveillance of the individual (from social behavior to bodily function) is deeply interwoven into the fabric of existence. The neurological frontier is upon us, and it is essential that, if able, we disconnect and dive deep into our own interiority. There are urgent lessons to be learned in that exploration – contemplation and psychedelia, spirituality and energetic transmission, cosmology and scale.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-11","ld":7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Jochem Mestriner is part of Wild Summer of Art 2026: The Treasure Hunt Edition, open no...","k":"exhibition","s":"2026-07-19","e":"2026-08-30","st":null,"et":null,"u":"diez.gallery","c":"Rotterdam","co":"Netherlands","p":"https://www.instagram.com/p/Da-M0xvsOMy/","x":"Jochem Mestriner is part of Wild Summer of Art 2026: The Treasure Hunt Edition, open now at Brutus in Rotterdam.\n\nCurated by Hajo Doorn and Cokkie Snoei, this year's edition gathers fifty Rotterdam based artists, each asked to show a side of their work that doesn't usually surface. \n\nThe show is on view until August 30.\n\n@jochem.mestriner\n@brutus.rotterdam\n@cokkiesnoei\n\nAd Hoc Hypothesis, 2024\nOil, oil stick, oil pastel, colour pencil and oil scrapings on canvas\n30 x 40 cm (11 3/4 x 15 3/4 in)","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-19","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"There is still time to experience 'Maria Lassnig and Edvard Munch. Flow of Paint = Flow...","k":"exhibition","s":"2026-07-25","e":"2026-08-30","st":null,"et":null,"u":"capitainpetzel","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbN_Dt3jFRW/","x":"There is still time to experience 'Maria Lassnig and Edvard Munch. Flow of Paint = Flow of Life' at the Hamburger Kunsthalle, on view through 30 August 2026.\n\nBringing together two artists who transformed the representation of the human body into a profound exploration of psychological and emotional experience, the exhibition places Lassnig’s groundbreaking concept of Körperbewusstseinsmalerei (body awareness painting) in dialogue with Edvard Munch’s deeply introspective practice. \n\nAcross generations, both artists developed a radically subjective visual language that continues to resonate today.\n\nImages: Installation views, 'Maria Lassnig and Edvard Munch. Flow of Paint = Flow of Life', Hamburger Kunsthalle, 2026, Ph: Fred Dott.\n\n#MariaLassnig #EdvardMunch #HamburgerKunsthalle #ContemporaryArt #Painting #Exhibition","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-25","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"Now open at @arnolfiniarts: Don't miss 'I'll Still Be Here When You Return' by Jameisha...","k":"screening","s":"2026-07-28","e":"2026-08-30","st":null,"et":null,"u":"filmvidumbrella","c":"","co":"UK","p":"https://www.instagram.com/p/DbVfx8LmiR9/","x":"Now open at @arnolfiniarts: Don't miss 'I'll Still Be Here When You Return' by Jameisha Prescod, one of six new moving image works commissioned as part of FVU New Takes, screening in Arnolfini's Dark Studio (Level 2) until 26 July ✨\n\n'I’ll Still Be Here When You Return' is a moving image work that explores the space between sleeping and wakefulness during a chronic illness flare-up. Inspired by the artist’s personal experience with illness and disability, this film questions the emotional impact of living under systems that place great importance on the ‘productive’ bodies whilst ignoring and even demonising the sick ones. @youlookokaytome\n\n📝 You can also pick up a copy of a newly commissioned text by @celestinefraser, reflecting on a journey through isolation, recovery, intimacy and relapse before arriving at the unexpected forms of connection and meaning that emerge from living ‘in between’.\n\n🎟 Free entry!\n📆 Until 30 August 2026\n🔗 Find out more on our website under 'What's On', link in bio!\n🎬 Not in Bristol? Watch and read for free on #FVUWatch, link in bio!\n\n--\n\nHave you watched or engaged with any of the works commissioned as part of FVU New Takes on FVU Watch? Fill out our Audience Survey to be in with a chance of winning a £50 Gift Card for Everyman Cinemas (UK-wide). Link in bio!\n\n'I'll Still Be Here When You Return' (2026) has been commissioned as part of FVU New Takes, an FVU initiative supported by @jerwood_foundation. FVU is supported using public funding by Arts Council England.\n\n#fvu #filmvidumbrella #filmandvideoumbrella #jameishaprescod #movingimage","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"To accompany our current feature on #FVUWatch, 'I'll Still Be Here When You Return' (20...","k":"exhibition","s":"2026-07-28","e":"2026-08-30","st":null,"et":null,"u":"filmvidumbrella","c":"","co":"UK","p":"https://www.instagram.com/p/DbLMSA0mnw8/","x":"To accompany our current feature on #FVUWatch, 'I'll Still Be Here When You Return' (2026) by Jameisha Prescod, you can read a newly commissioned text by writer, editor and filmmaker @celestinefraser ✨\n\n'I’ll Still Be Here When You Return' is a moving image work that explores the space between sleeping and wakefulness during a chronic illness flare-up. Inspired by the artist’s personal experience with illness and disability, this film questions the emotional impact of living under systems that place great importance on the ‘productive’ bodies whilst ignoring and even demonising the sick ones. Point cloud animations made from 3D scans of the artist’s bedroom during a post-surgery recovery period dissolve into one another while a deceivingly calm and meditative voice-over drifts between thoughts of pain, memory, isolation and mortality. @youlookokaytome\n\n📝 Celestine reflects on 'I'll Still Be Here When You Return' and a journey through isolation, recovery, intimacy and relapse; before arriving at the unexpected forms of connection and meaning that emerge from living ‘in between’. \n\n🔗 Read and watch for free via the link in bio!\n\n--\n\n'I’ll Still Be Here When You Return' (2026) will be on view at @arnolfiniarts from 28 July — 30 August 2026.\n\nHave you watched or engaged with any of the works commissioned as part of FVU New Takes on FVU Watch? Fill out our Audience Survey to be in with a chance of winning a £50 Gift Card for Everyman Cinemas (UK-wide). Link in bio!\n\n'I’ll Still Be Here When You Return' (2026) has been commissioned as part of FVU New Takes, an FVU initiative supported by @jerwood_foundation. FVU is supported using public funding by Arts Council England.\n\n#fvu #filmvidumbrella #filmandvideoumbrella #jameishaprescod #movingimage #celestinefraser","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"We inhabit an era where the swipe of a thumb has successfully collapsed the distance be...","k":"exhibition","s":"2026-07-30","e":"2026-08-30","st":null,"et":null,"u":"contemporarylynx","c":"Vilnius","co":"Lithuania","p":"https://www.instagram.com/p/DbaZo8BDsua/","x":"We inhabit an era where the swipe of a thumb has successfully collapsed the distance between historical tragedy and consumerist desire. What once seemed irreconcilable — intimacy and exposure, grief and distraction, the historical weight of a region and the frictionless speed of the algorithm — now coexist in a state of permanent, vibrating suspension. \n\nThis is the psychological and material terrain of the exhibition 'Gen Z. All at Once' held at @momuziejus in Vilnius until August 30 2026. \n\nRead more in the review by @rosanalukauskaite 👉 click the link in our bio!\n\n.\n\nPhotos: (1) Gen Z. All at Once, exhibition view at MO Museum Vilnius. Photo by Rytis Šeškaitis; (2) Works by Olga Krykun, exhibition view of 'Gen Z. All at Once' at MO Museum Vilnius. Photo by Rytis Šeškaitis; (3) Works by Helena Parys, exhibition view of 'Gen Z. All at Once' at MO Museum Vilnius. Photo by Rytis Šeškaitis; (4) Works by Katrīna Biksone, exhibition view of 'Gen Z. All at Once' at MO Museum Vilnius. Photo by Rytis Šeškaitis; (5) Nikola Balberčáková, r/ForeverAlone, 2024, exhibition view of “Gen Z. All at Once” at MO Museum Vilnius. Photo by Jonas Balsevičius.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"MADRID – Talia Chetrit’s Red, 2026 is included in Bunny, curated by Stella Bottai and p...","k":"exhibition","s":"2026-07-31","e":"2026-08-30","st":null,"et":null,"u":"hoffman.donahue","c":"Madrid","co":"","p":"https://www.instagram.com/p/DbdWEM-lLIX/","x":"MADRID – Talia Chetrit’s Red, 2026 is included in Bunny, curated by Stella Bottai and presented by the LOEWE Foundation on the occasion of PHotoEspaña 2026, at the Lázaro Galdiano Museum through August 30\n\nThe exhibition’s title, Bunny, reflects the sensibility of her images: raw, seductive, and playfully performative. In her work, the line between truth and fiction remains open to negotiation between artist and viewer. Photography becomes both medium and object, highlighted as a material condition through which images are layered, extended, and transformed. The works vary in scale: intimate black-and-white prints invite close observation, while large-format color photographs assert a physical presence and engage the viewer’s body.\n\nImages: Talia Chetrit, Bad Bunny, 2026. installation views, Museo Lázaro Galdiano, Madrid. Photography by Álvaro Tomé.\n\n#TaliaChetrit #Bunny #LOEWEFoundation #MuseoLázaroGaldiano @taliachetrit @stellabottai @loewefoundation @photoespana_ @museolazarogaldiano","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Jack O'Brien and Leyla Yenirce will be part of 'SOUND BIESENTHAL – Art Biesenthal 2026'...","k":"exhibition","s":"2026-08-01","e":"2026-08-30","st":null,"et":null,"u":"capitainpetzel","c":"Biesenthal","co":"Germany","p":"https://www.instagram.com/p/Dba5pyfDP69/","x":"Jack O'Brien and Leyla Yenirce will be part of 'SOUND BIESENTHAL – Art Biesenthal 2026', opening on Saturday, August 1, 2026, at Wehrmühle, Biesenthal, and running through August 30, 2026.\n\nAt the heart of the exhibition is sound–not only as a medium, but as a conceptual tool for exploring perception, space, memory, and social relations.\n\nCurated by Domenico Positano and Tjioe Meyer Hecken.\n\nImages: 1. Jack O’Brien, 'Interlude', 2025. Ph: GRAYSC; 2. Leyla Yenirce, 'Falsett', 2026. Courtesy the artist and Capitain Petzel. Ph: Robert Glowacki; 3-4. Posters © Art Biesenthal 2026.\n\n#soundbiesenthal #artbiesenthal #artbiesenthal2026 #groupexhibition #jackobrien #leylayernice","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"✨ It’s play time! For this summer’s UNIQLO Tate Play series, artist Lina Lapelytė has c...","k":"exhibition","s":"2026-07-25","e":"2026-08-31","st":null,"et":null,"u":"tate","c":"","co":"UK","p":"https://www.instagram.com/p/DbXv7kXiG6A/","x":"✨ It’s play time! For this summer’s UNIQLO Tate Play series, artist Lina Lapelytė has created a maze-like installation, transforming Tate Modern’s Turbine Hall into a stage of movement, sound and collaboration!  We joined Lina to talk about her newly opened installation, where art, music and improvisation meet in unexpected ways. Take a leap into Lina’s world of play today!\n \n✨ Uniqlo Tate Play: Lina Lapelytė: Serendipity Island\n🗓️ Daily, 25 July – 31 August 2026 📍 Tate Modern\n🎟️ Entry is free. No ticket needed, just drop in!\n \nIn partnership with @uniqloeurope","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-29","ld":-4,"dl":"2026-08-31","ds":"run closes","ap":false,"rel":false,"q":true},{"now":true,"t":"here’s multidisciplinary artist Alex Zhang Hungtai @lastlizard808 and guitarist Tashi D...","k":"performance","s":"2026-07-29","e":"2026-08-31","st":null,"et":null,"u":"roulette_intermedium","c":"New York","co":"","p":"https://www.instagram.com/p/DbYgIbTqh1E/","x":"here’s multidisciplinary artist Alex Zhang Hungtai @lastlizard808 and guitarist Tashi Dorji @tashidorjiiii at Roulette in 2023, experimenting with feedback and duration on saxophone and guitar 🌑🌑🌑.\n\non 9.13, the two return for the debut of a newly formed trio with composer, performer, and installation artist Raven Chacon @ravenchcn, presenting spontaneous compositions alongside expansive sonic exploration.\n\nopening the night, sound artist Leo Chang @listentoleochang performs on electronics with his custom-built feedback hat and amplified gong instrument in a work that reimagines the Korean folk practice of sangmonori.\n\ndon’t miss your chance to get discounted tickets through August 31 with code EARLYBIRDER at checkout. link in bio!","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-07-29","ld":0,"dl":"2026-08-31","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Selected images of #karenkilimnik installed at @lomexlasvegas on view through August 31","k":"exhibition","s":"2026-07-30","e":"2026-08-31","st":null,"et":null,"u":"lomexlasvegas","c":"Las Vegas","co":"","p":"https://www.instagram.com/p/DbbRTcblJI-/","x":"Selected images of #karenkilimnik installed at @lomexlasvegas on view through August 31\nPhotos @chasethepicture","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"𝐋𝐮𝐧𝐚 𝐌𝐚𝐡𝐨𝐮𝐱: 𝑾𝒉𝒆𝒓𝒆 𝑾𝒐𝒖𝒍𝒅 𝑰 𝑩𝒆?","k":"exhibition","s":"2026-06-19","e":"2026-09-05","st":null,"et":null,"u":"c_o_r_d_o_v_a_","c":"Barcelona","co":"","p":"https://www.instagram.com/p/DbL1VfzjCMd/","x":"𝐋𝐮𝐧𝐚 𝐌𝐚𝐡𝐨𝐮𝐱: 𝑾𝒉𝒆𝒓𝒆 𝑾𝒐𝒖𝒍𝒅 𝑰 𝑩𝒆?\nOn display from 19.06.2026 until 05.09.2026.\n\nLuna Mahoux es una artista, cineasta y curadora belga de origen etíope cuya práctica se desarrolla a través del cine, la fotografía y la instalación. Su obra explora narrativas afrodiaspóricas invisibilizadas mediante un diálogo entre archivos personales, imágenes vernáculas y la cultura pop de internet para deconstruir, recontextualizar y reinventar historias olvidadas, cuestionando los mecanismos de reapropiación de la identidad en un mundo saturado de imágenes.\n\n. ݁₊ ⊹ . ݁˖ . ݁˙⋆✮⋆｡𖦹°⭒˚｡\n\nLuna Mahoux is a Belgian artist, filmmaker, and curator of Ethiopian origin whose practice spans film, photography, and installation. Her work explores invisibilised Afro-diasporic narratives through a dialogue between personal archives, vernacular images, and internet pop culture, deconstructing, recontextualising, and reinventing forgotten histories while questioning the mechanisms of identity reappropriation in an image-saturated world.\n\n. ݁₊ ⊹ . ݁˖ . ݁˙⋆✮⋆｡𖦹°⭒˚｡\n\nLuna Mahoux és una artista, cineasta i comissària belga d'origen etíop la pràctica de la qual s'estén a través del cinema, la fotografia i la instal·lació. La seva obra explora narratives afrodiaspòriques invisibilitzades mitjançant un diàleg entre arxius personals, imatges vernacles i la cultura pop d'internet, deconstruint, recontextualitzant i reinventant històries oblidades, tot qüestionant els mecanismes de reapropiació de la identitat en un món saturat d'imatges.\n\nPhotos by Roberto Ruiz","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":-35,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Justin Ming Yong Sun in Eyes, 2023 scrap cotton, polyester, yarn and thread","k":"other","s":"2026-06-25","e":"2026-09-05","st":null,"et":null,"u":"patelbrowngallery","c":"","co":"Canada","p":"https://www.instagram.com/p/DbeDfnFkSKy/","x":"Justin Ming Yong Sun in Eyes, 2023 scrap cotton, polyester, yarn and thread\n\n⋆˚࿔ 🌞 ༄\n\nJustin Ming Yong is a visual artist who currently lives and works in Toronto, Canada. Yong explores modern abstractions of quiltmaking and improvised textile compositions that destabilize the fictional boundaries between traditional craft and contemporary art.\n\nApproaching quilting as a process of repetition, intuition, and material response, Justin Ming Yong’s enables the textiles to register labour, chance, and the shifting logic of the hand. In Sun In Eyes, layered appliqué builds outward from a central line, producing a sense of movement while revealing underlying colour through uneven strips and repetition. \n\n⋆˚࿔ 🌞 ༄\n\nSlip, Stitch | 25 June to 5 September  21 Wade Ave, Unit 2  Tuesday - Saturday | 10 - 6 \n\n⋆˚࿔ 🌞 ༄ ⋆˚࿔ 🌞 ༄ ⋆˚࿔ 🌞 ༄ ⋆˚࿔ 🌞 ༄ ⋆˚࿔ 🌞 ༄\n#JustinMingYong #TextileArts #Quilting #PatelBrown #ContemporaryArt","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-31","ld":-36,"dl":"2026-09-05","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Holly Chang","k":"exhibition","s":"2026-06-25","e":"2026-09-05","st":null,"et":null,"u":"patelbrowngallery","c":"","co":"Canada","p":"https://www.instagram.com/p/DbMQmulEU2n/","x":"Holly Chang\nA Thousand Cuts, from a Thousand Caterpillars, 2026\ncyanotypes toned with walnuts and black tea, quilting techniques, naturally dyed textiles\n\n₊˚ʚ 🐛 ₊˚✧ ﾟ.\n\nHolly Chang is an interdisciplinary artist based in Toronto, Canada, working across photography, ceramics, textiles, sculpture, natural dyeing, collage, and installation.  Drawing from found and discarded textiles, archives, and images, Chang repurposes materials to explore identity, hybridity, transformation, race, gender, ecology, history, and alternative ways of existing. \n\nIn Holly Chang’s works, the garden becomes a site for witnessing how life sustains life, as plants support emotional survival while continuing to nourish surrounding ecologies through cycles of growth, decay, and return to soil. Using gardening as a way to move through grief, Chang observes both cultivated and self-seeded plants, questioning hierarchies that privilege certain forms of life over others. \n\n₊˚ʚ 🐛 ₊˚✧ ﾟ.\n\nSlip, Stitch | 25 June to 5 September\n21 Wade Ave, Unit 2\nTuesday - Saturday | 10 - 6\n\n₊˚ʚ 🐛 ₊˚✧ ﾟ.🌱🌱₊˚ʚ 🐛 ₊˚✧ ﾟ.₊˚ʚ 🐛 ₊˚✧ ﾟ.🌱 🌱#HollyChang #Cyanotype #textileart #PatelBrown #ContemporaryArt","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":-29,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Ann Zhao’s “Spillover” is now on view through September 5, 2026.  Zhao’s title referenc...","k":"exhibition","s":"2026-07-12","e":"2026-09-05","st":null,"et":null,"u":"emptygallery.hk","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DarPg1dCXZ3/","x":"Ann Zhao’s “Spillover” is now on view through September 5, 2026.  Zhao’s title references a passage from Zhuangzi which classifies and ranks different modes of speech according to their ability to communicate the Dao. In this rarefied context, the term “spillover” refers to the indeterminacy of everyday speech in contrast to more fixed or formal modes—a self-renewing flexibility which allows plain words to keep pace with an underlying reality that is never static, but always dynamically changing.1 However, the term might refer equally to the chaotic breach of containment between one category and another—the inevitable pollution (or collateral damage) which occurs when the innate messiness of the subject spills over—as when the dissolution of a single relationship threatens the social coherence of a larger group or when illness or injury (the state of the body) compromise the supposed purity of an intellectual position.\n\nThe heart of Zhao’s exhibition consists of Ben Ming Nian (本命年), an installation of twenty-four photographs on the gallery’s 19th floor. Alternating between shadowy black & white and muted color, this sequence of images presents a selection of moments from the stream of Zhao’s daily existence. As always in her practice, self-disclosure and artistic identity operate along a fluid line of ambivalence, erasure, and potential reversibility. Despite being nominally diaristic, many of these images remain deeply inscrutable. More atmosphere than evidence, they furnish something like an emotional weather report of Zhao’s life with the twelve year curse.2\n 1 Chuang-Tzu, Chuang-Tzu: The Inner Chapters, trans. A.C. Graham, (Hackett Publishing, 2001), 26. \n2 本命年 Ben Ming Nian refers to the years that align with one’s personal Chinese zodiac, which occur every twelve years—one Zodiac cycle. One’s Ben Ming Nian is typically associated with misfortune and bad luck, due to the year corresponding with being in conflict with the corresponding Tai Sui 太岁general of the year. Tai Sui is a celestial deity in Chinese folk religion, and there are sixty Tai Sui generals, thus they rotate on a sixty-year cycle.\n Installation views by Felix S.C. Wong. \n@stupid_____idiot","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-12","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Nomenclature for the Time Being","k":"performance","s":"2026-05-21","e":"2026-09-06","st":null,"et":null,"u":"iamsandramujinga","c":"London","co":"","p":"https://www.instagram.com/p/DYMqkvZDW1k/","x":"Nomenclature for the Time Being\n21 May to 6 September 2026 \n\nThis exhibition gathers the work of Rebecca Bellantoni, Hannah Black, Maren Hassinger, Deborah-Joyce Holman, Marla-Sunshine Kellard-Jones, Atiéna R. Kilfa, Christine Kirubi, Kumbirai Makumbe, Zanele Muholi, Sandra Mujinga, Shenece Oretha, Ingrid Pollard and Ebun Sodipo – artists whose practices span sculpture, performance, writing, photography and video. Most of all, this is a sculpture show, with artists deploying rope, steel wire, leather, plastic, velvet, wood, concrete, petroleum, wax, glass, thread – always with an awareness of the body.\n\nCurated by Imani Mason Jordan @homopathic , Nomenclature for the Time Being borrows its title from the 2022 book-length poem by Dionne Brand. It proposes that shared sociopolitical realities or structural conditions might also generate certain shared material sensibilities. What emerges could be considered a kind of Black feminist materiality, one that understands objects as social and political actors. These are practices that do not try to represent the world, but actively reconfigure it.\n\nOne gallery in the exhibition has been designed by the artist duo repertoire to host a series of performances and other activations that will unfold over its duration. Additional research for Nomenclature for the Time Being has been provided by Nikita Sena Quarshie @dede.koko \n📷 Long Time Comin’ (still)\nDir. Dionne Brand, 1993","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-11","ld":10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Work by Sonia Gomes (@soniagomesarte) is included in \"Project a Black Planet: The Art a...","k":"exhibition","s":"2026-06-11","e":"2026-09-06","st":null,"et":null,"u":"pacegallery","c":"London","co":"","p":"https://www.instagram.com/p/DbWky_ymdwu/","x":"Work by Sonia Gomes (@soniagomesarte) is included in \"Project a Black Planet: The Art and Culture of Panafrica\" at Barbican Centre (@barbicancentre), the first major exhibition to celebrate the influence of Pan-Africanism on visual art and culture\n-\nThe exhibition features over 250 paintings, sculptures, installations, posters, journals, and films produced across Africa, Brazil, the Caribbean, North America, and Western Europe from the 1920s to the present.\n-\nProject a Black Planet: The Art and Culture of Panafrica\nthrough September 6\nArt Gallery, Barbican Centre\nLondon\n-\nLearn more about #SoniaGomes at the link in bio.\n-\nArtwork: Installation view: \"Project a Black Planet: The Art and Culture of Panafrica,\" June 11 – September 6, 2026 © Max Colson / Barbican Art Gallery\n\n#ContemporaryArt #BarbicanCentre","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":-47,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Thrilled my work is included in Nomenclature for a Time Being at @raven__row. It's up u...","k":"exhibition","s":"2026-06-20","e":"2026-09-06","st":null,"et":null,"u":"deborahjoyceholman","c":"London","co":"","p":"https://www.instagram.com/p/DZ0YUu7giSa/","x":"Thrilled my work is included in Nomenclature for a Time Being at @raven__row. It's up until 6 September.\n\nIn the exhibition text, curator Imani Mason Jordan @homopathic writes: 'In Deborah-Joyce Holman's Thicc and Slippery (2020), human teeth become a site of persistance, resisting abstraction even as they refuse identification. A small, dense sculpture in ink on human teeth, wire, aluminium and mirror, its scale is domestic, it's implications are not. Teeth and bones are what remain of bodies after death – individual, specific, hard to neutralise – raising immediate questions about ownership over one's own body, and what remains after classification. The title carries a Black vernacular charge: to be thicc and slippery is to be uncontainable, present in excess, impossible to hold. The mirror turns the gaze back, implicating whoever looks in the representational economy the work simultaneously refuses. Both works, [the nearby] Umemezi (State of Emergency) [by Zanele Muholi] and Thicc and Slippery, refuse erasure through the body's own material and language. Where Muholi amplifies the voice that calls out, Holman insists on the body that remains – ungovernable, unidentified, returned to the viewer's gaze. Together they ask not only who speaks, but who is seen, and who survives.'\n\nPicture 1: Installation view, Nomenclature for the Time Being, 2026, Raven Row. Photograph by Marcus J Leith\nPicture 2: Photo by Ramiro Chavez","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-20","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Elbląg","k":"exhibition","s":"2026-07-02","e":"2026-09-06","st":null,"et":null,"u":"stockholmartguide","c":"Elbląg","co":"Poland","p":"https://www.instagram.com/p/DakVIxkjHjh/","x":"Elbląg\n\n”Hairline”\nSolo exhibition by Angelika Puff\n\n2nd July - 6th September 2026\n\n@angelpuff_\n@galeriael\n\n”The exhibition’s title, ’Hairline’, refers both to the line of hair marking the beginning of the face and to a hairline crack, a delicate fracture, a barely perceptible trace of structural rupture. The exhibition unfolds within this space between connection and separation, rootedness and uprooting, intimacy and distance. It is a meditation on inheritance, memory, and the bonds that, even when strained or fractured, never disappear entirely.”\n-Emilia Orzechowska\n\nCurated by Emila Orzechowska @em_aku\n\nImages courtesy of artist \nPhotographer Paweł Sobczak @pawelsobcza\n\n@elblagmiasto\n\n#angelikapuff\n#galeriael\n#hairline","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-09","ld":-7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Cmentarna”","k":"exhibition","s":"2026-07-11","e":"2026-09-06","st":null,"et":null,"u":"angelpuff_","c":"Elbląg","co":"","p":"https://www.instagram.com/p/DapHP33gJNu/","x":"“Cmentarna”\n2024\noil, beetroot pigment on canvas \n30 x 40 cm \n\nFrom the exhibition Hairline, in @galeriael, curated by @em_aku \nOn view in Elbląg, until September 6, 2026. \n\nPhotos @pawelsobcza","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-11","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Performance Vinculum at the opening of my solo exhibition Hairline at @galeriael curate...","k":"performance","s":"2026-07-14","e":"2026-09-06","st":null,"et":null,"u":"angelpuff_","c":"Elbląg","co":"","p":"https://www.instagram.com/p/Daw4sHwAkFS/","x":"Performance Vinculum at the opening of my solo exhibition Hairline at @galeriael curated by @em_aku \n\nOn view in Elbląg until September 6, 2026.\n\nVideo by @pawelsobcza","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Cycle”","k":"exhibition","s":"2026-07-15","e":"2026-09-06","st":null,"et":null,"u":"angelpuff_","c":"Elbląg","co":"","p":"https://www.instagram.com/p/DazdRp6gN20/","x":"“Cycle”\n2025\noil, masking paste on canvas \n80 x 60 cm \n\nFrom the exhibition Hairline, in @galeriael, curated by @em_aku \nOn view in Elbląg, until September 6, 2026. \n\nPhotos @pawelsobcza","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"What if the whole planet became one machine?  This immersive exhibition constructs a se...","k":"exhibition","s":"2026-07-15","e":"2026-09-06","st":null,"et":null,"u":"madanivision","c":"New York","co":"","p":"https://www.instagram.com/p/Daz9pklBIND/","x":"What if the whole planet became one machine?  This immersive exhibition constructs a series of imagined futures for our planet, rooted in real technology and climate-based possibilities.  In Other Worlds is running until 6 September at the Barbican Centre (@barbicancentre).","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Swamp”","k":"exhibition","s":"2026-07-17","e":"2026-09-06","st":null,"et":null,"u":"angelpuff_","c":"Elbląg","co":"","p":"https://www.instagram.com/p/Da4g4g_AM0E/","x":"“Swamp”\n2024\noil, masking paste on canvas \n30 x 30 cm \n\nFrom the exhibition Hairline, in @galeriael, curated by @em_aku \nOn view in Elbląg, until September 6, 2026. \n\nPhotos @pawelsobcza","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-17","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Vines”","k":"exhibition","s":"2026-07-21","e":"2026-09-06","st":null,"et":null,"u":"angelpuff_","c":"Elbląg","co":"","p":"https://www.instagram.com/p/DbC-n4_AL-m/","x":"“Vines”\n2026\noil, masking paste on canvas \n90 x 90 cm \n\nFrom the exhibition Hairline, in @galeriael, curated by @em_aku \nOn view in Elbląg, until September 6, 2026. \n\nPhotos @pawelsobcza","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Nancy Lupo(@_nancy_lupa_)’s largest exhibition in the UK to date, ‘Several Chickens Lat...","k":"performance","s":"2026-07-23","e":"2026-09-06","st":null,"et":null,"u":"antennaspace","c":"London","co":"","p":"https://www.instagram.com/p/DbHzkRFD0EY/","x":"Nancy Lupo(@_nancy_lupa_)’s largest exhibition in the UK to date, ‘Several Chickens Later’, is currently on view at Spike Island (@spikeisland) with a corpus of newly commissioned sculptures that probe aspirations, ambiguities and material culture. In her work, which encompasses sculpture, video, writing, sound, drawing, painting, performance and architecturally specific installation, Lupo reflects on how collective fantasies and emotions become embedded in form. She often describes her work as being scripted or held together through a thin thread of narrative which she explores through writing that she publishes as zines, and soon, in her first novel, ‘Meow Meow Real Estate’.\n \nThe exhibition at Spike Island prolongs the reverie and the longing for domesticity. It refuses a reality-check, and loops back into wistful illusion. Although the mirage is tired, its feeble flame still somehow persists. Her works evoke the fragility of our endeavours, and the futility of our fantasies.\n\nCurated by Clémentine Proby (@clementineproby \n \n-\n \nNancy Lupo: ‘Several Chickens Later’ is open at Spike Island until 6 September 2026. It includes a work co-produced by Spike Island and the Nicoletta Fiorucci Foundation (London). With thanks to Raven Row (London). The exhibition is generously supported by Antenna Space.\n\nImages courtesy the artist and Spike Island (2026). Photography by Rob Haris\n \n#nancylupo #spikeisland","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Kate Hargrave’s (@katearmshargrave) ‘Birdwatchers’ (2026) in ‘Outside.’","k":"talk","s":"2026-07-27","e":"2026-09-06","st":null,"et":null,"u":"karmakarma9","c":"Thomaston","co":"United States","p":"https://www.instagram.com/p/DbTns36iaq4/","x":"Kate Hargrave’s (@katearmshargrave) ‘Birdwatchers’ (2026) in ‘Outside.’\n\nBased in Portland, Maine, Hargrave employs techniques from sixteenth- and seventeenth-century oil painting to give form to gossamer figures and their otherworldly environments. Informed by an image archive spanning from Early Renaissance religious icons to mid-twentieth-century kids’ books, Hargrave depicts her subjects in postures that communicate sensitivity and self-determination in equal measure.\n\nCurated by Matthew Higgs (@matthewhiggs2015), ‘Outside’ is on view through September 6 at 70 Main Street, Thomaston, Maine.\n\nAbove: (1, 4) Kate Hargrave, ‘Birdwatchers,’ 2026. Oil on birch panel, 30 × 30 in. (2) ‘Outside,’ installation view, Karma, Thomaston, Maine, 2026 (3, 5) ‘Birdwatchers’ in Hargrave’s Portland, Maine studio, 2026.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"‘There are four shifting tones that sound like an impression of music. Each one is diff...","k":"talk","s":"2026-07-28","e":"2026-09-06","st":"12:00","et":"18:00","u":"chisenhalegallery","c":"London","co":"","p":"https://www.instagram.com/p/DbWCHcLDP68/","x":"‘There are four shifting tones that sound like an impression of music. Each one is different, and each one is live. The algorithm I wrote for the sound installation operates on a similar principle as the cameras: that of randomness. It listens to local radio broadcasts around the Chisenhale Gallery building and takes pictures of them at random intervals. (...)\n\nIt’s very hard to describe, but I hope that listening to it can be a complex, nuanced experience that doesn’t necessarily need explanation. While all of the radios are tuned to the same source, the fact that each of the four algorithms is taking photographs of the sound at different points in time creates an experience of dislocation, as it stretches the live radio broadcast across time and space.’ – Jasper Marsalis in conversation with Tosia Leniarska, Curator.\n\nIn Jasper Marsalis’ Chisenhale Gallery commission, four electrostatic speakers process an FM radio signal in real time. A programme written by the artist takes images of the transmission frequencies and converts them back into sound, slowly interpolating between them. What is heard are the shifting static tones rendering the spatial aspects of transmission audible.\n\n‘Still Life’ remains on view until 6 September, open 12–6pm Wednesday–Sunday.\n\nPhoto: Mark Blower.\n\n@thatboiakathatboi\n#JasperMarsalis\n#StillLife\n#ChisenhaleGallery","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"A selection of paintings by William Hawkins is on view in ‘Outside.’","k":"exhibition","s":"2026-07-29","e":"2026-09-06","st":null,"et":null,"u":"karmakarma9","c":"Thomaston","co":"United States","p":"https://www.instagram.com/p/DbYzf8xCaVa/","x":"A selection of paintings by William Hawkins is on view in ‘Outside.’\n\nRaised on a farm in Kentucky, Hawkins learned to draw by copying illustrations from horse-auction announcements and calendar pictures. At twenty-one, he moved to Columbus, Ohio, where he began painting the expressionistic cityscapes and animals for which he is best known. Present in ‘Indian Landing’ (1985) and ‘Old Home’ (1980)—two large-scale paintings from Hawkins’s mature period—is the artist’s distinctive signature, which includes his name, birthplace, and birthdate, July 27, 1895.\n\nCurated by Matthew Higgs (@matthewhiggs2015), ‘Outside’ is on view through September 6 at 70 Main Street, Thomaston, Maine.\n\n(1, 4) ‘Outside,’ installation views, Karma, Thomaston, Maine, 2026 (2–3) William Hawkins, ‘Indian Landing,’ 1985. Enamel on board, 24 x 48 in (5–6) ‘Old Home,’ 1980. Enamel on board, 24 x 48 in. Courtesy Fleisher/Ollman","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Live on NTS Radio this Thursday morning: artist Jasper Marsalis, aka Slauson Malone 1, ...","k":"talk","s":"2026-07-30","e":"2026-09-06","st":"12:00","et":"18:00","u":"chisenhalegallery","c":"London","co":"","p":"https://www.instagram.com/p/DbYhHoWsEep/","x":"Live on NTS Radio this Thursday morning: artist Jasper Marsalis, aka Slauson Malone 1, presents a radio show he created as part of the public programme for his Chisenhale Gallery commission, ‘Still Life’. \n\nThe compositions Marsalis selected for NTS Radio celebrate the influence of Kaija Saariaho, Pauline Oliveros, and other electro-acoustic composers on his exhibition. \n\n‘To participate in Pauline Oliveros’ Tuning Meditation, you sing a tone, and the next person sings in unison, matching that tone. When you run out of breath, you select a new tone by listening to another person. I learned it from my bandmate, Nicky Wetherell: we’d start our rehearsals with this. It’s very inspiring to actualise participation without pedagogy and hierarchy. \n\nBut I noticed that it’s scary to be asked to participate in this meditation, where you don’t know what the outcome is going to be. You have to have trust in someone to participate. For the sound installation, I wanted to create a piece that could perform without fear.’ – Jasper Marsalis in conversation with Tosia Leniarska, Curator.\n\n📅 Thursday 30 July 2026 \n⏰ 10am–12pm\n🔗NTS.live\n\nThe radio show will be archived on NTS.live for future listening.\n\n‘Still Life’ is on view until 6 September, open 12–6pm Wednesday–Sunday.\n\n@thatboiakathatboi\n@nts_radio \n#JasperMarsalis\n#StillLife\n#ChisenhaleGallery","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Rather than placing the island itself at the centre of the story, the film follows an ...","k":"exhibition","s":"2026-07-30","e":"2026-09-06","st":null,"et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/Dbav4NDjB6k/","x":"“Rather than placing the island itself at the centre of the story, the film follows an ecosystem of unstable, submerged, and resurfacing volcanic matter, always on the verge of emergence and disappearance.” — Elisa Giardina Papa (@elisagiardinapapa)\n\nGiardina Papa’s solo exhibition ‘She Flickered In and Out of History’ is on view until 6 Sep\n\n🎟️ Book tickets online or on the door\n💸 £4 for Under 25s\n\nCredits: Elisa Giardina Papa, She Flickered In and Out of History, 2026. Installation view at Institute of Contemporary Arts, London. Photography by Rob Harris; Elisa Giardina Papa, She Flickered In and Out of History, 2026 [clip]. \n\n#SheFlickeredInandOutofHistory #ElisaGiardinaPapa #Exhibition #ICA #London","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-07-30","ld":0,"dl":"2026-09-06","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"New works by Ann Craven (@ann_craven) in ‘Outside.’","k":"exhibition","s":"2026-07-31","e":"2026-09-06","st":"18:00","et":null,"u":"karmakarma9","c":"Thomaston","co":"United States","p":"https://www.instagram.com/p/Dbd-K4xift5/","x":"New works by Ann Craven (@ann_craven) in ‘Outside.’\n\nWorking in New York and Maine, Craven makes self-reflexive paintings that comment on devotion, loss, and the immortalizing nature of her medium. Primarily using unabashedly high-key colors, she paints and repaints her subjects, including the vase of feathery pink peonies in her studio, featured in her large-scale ‘Moon (Silent, Gram’s peonies), 2026’ and ‘Gram’s Peonies (Quiet Moon, WS, 5-25-26, 6 PM), 2026.’\n\nCurated by Matthew Higgs (@matthewhiggs2015), ‘Outside’ is on view through September 6 at 70 Main Street, Thomaston, Maine.\n\nAbove: (1) Ann Craven, ‘Gram’s Peonies (Quiet Moon, WS, 5-25-26, 6 PM), 2026,’ 2026. Oil on canvas, 24 x 18 in. (2, 4) Craven working in her New York Studio, 2026 (3) ‘Outside,’ installation views, Karma, Thomaston, Maine, 2026","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"In ‘Still Life’ by Jasper Marsalis, a cinematic screen displays a randomised sequence o...","k":"talk","s":"2026-07-31","e":"2026-09-06","st":"12:00","et":"18:00","u":"chisenhalegallery","c":"London","co":"","p":"https://www.instagram.com/p/DbdzW2hgX1f/","x":"In ‘Still Life’ by Jasper Marsalis, a cinematic screen displays a randomised sequence of live feeds from unsecured Internet Protocol cameras in places of natural beauty around the world.\n\n‘I see myself predominantly as a painter, but I think that it’s the responsibility of artists to be engaged not only with historical mediums but also with whatever exists in their lifetime. Video has become omnipresent in our lives, and it’s a medium whose flatness is very closely related to painting. We take for granted that painting is a technology in its own right, just one that is no longer relevant. Canvas as a material, or cadmium, or horsehair: as a society, we don’t really relate to these materials anymore, giving painting a sort of prestigious quality that I’m deeply uninterested in. \n\nWhat I am interested in is how painting can abstract experience and give us a different way of relating to the world and ourselves. Historically, landscape painting was attempting to do that: I’m thinking of the fin de siècle, or the Hudson Valley School, and their efforts during Industrialisation to refocus people’s attention towards something other than anthropocentric progress.’ – Jasper Marsalis in conversation with Tosia Leniarska, Curator.\n\n‘Still Life’ is on view until 6 September, open 12–6pm Wednesday–Sunday.\n\n@thatboiakathatboi\n#JasperMarsalis\n#StillLife\n#ChisenhaleGallery","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"More details of our piece, “Boîte de luxure,” in @swissinstitute’s “Regift” show on vie...","k":"exhibition","s":"2026-07-31","e":"2026-09-06","st":null,"et":null,"u":"womens_history_museum","c":"Zurich","co":"","p":"https://www.instagram.com/p/Dbd4FDHFDuQ/","x":"More details of our piece, “Boîte de luxure,” in @swissinstitute’s “Regift” show on view at @lumawestbau until September 6\n\nFor the “Regift” show we created our own oversized candy box with faux candies and bon bins out of vintage clothing notions.\n\nAmong the connotations of such a gift (whether to yourself or another) are: Generosity, luxury, visuality, seduction and sentimentality.\n\nThe somatic and symbolic experience of consuming a box of chocolates can be likened to an almost microcosmic simulation — you as the eater in Godlike dominion of the cosmos, hand selecting bite sized momentary sensual experiences, escaping through the senses.\n\nOn the backside of this indulgence is emptiness and terminability of such an experience. \n\nWe became interested in the history of the chocolate box as a gift. Their beginnings can be traced to the Victorian era when chocolates were turned from a predominantly liquid form to a solid and more widely available to the public — albeit they were still an item of luxury for the wealthy. However, during the Industrial Revolution chocolate became a more widely available commodity and with advancements in mass production boxes of chocolates were able to be enjoyed by a broader audience. The Victorians deployed all the available decorative and manufacturing technologies at hand, making the empty box a part of the gift and beautiful enough to be kept once their contents were consumed. They became relics of resisting death through beauty.\n\nRichard Cadbury designed the first heart-shaped Valentine’s chocolate box in 1861. These, often reusable, containers soon became a popular symbol of love and enduring romance.\n\nIn addition, wrapping or packaging is connected to our study of clothing. Fashion is packaging for the body. Fashion pieces are similar to candy, the initial rush of desire, pursuit, consumption followed by the lifelessness of the wrappers once discarded.\n\nThe indulgence of food is simultaneously at odds with the thinness required to participate in Fashion as well as ideals of womanhood. There is forbiddance, yet the marketing of chocolate and candy is simultaneously hyper feminine in its coding.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"BREAKING NEWS: OPEN CALL is LIVE!","k":"exhibition","s":"2026-06-10","e":"2026-09-10","st":null,"et":null,"u":"business.inthefront","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DZaMesgglpF/","x":"BREAKING NEWS: OPEN CALL is LIVE! \nBusiness in the Front returns for a second time this year, and the open call is live right now! \n\nUNBELIEVABLE\n\nFor this edition, we are inviting artists, performers and designers to submit a work proposal under the theme of the UNBELIEVABLE. Both as an exclamation and as an adjective of disbelief, surprise, scepticism and flabbergast. \nWe are interested in the duality between a front of sensationalism, pretentiousness and acting larger than life, but with a back of scepticism, deception and being unreliable. We hope the topic tickles your curiosity as much as it tickles ours. If it does, we elaborate even further in the Google Form, where you can submit your work. You will find it in the link in bio. \n\nUNBELIEVABLE\n\nThis time, we are extending the open call time. \nAnd we are extending it a lot. Starting from today, June 10th and all the way until September 10th, you are able to submit your application through the link in bio. Visual artists, performers, filmmakers, musicians, writers, poets, puppets, clowns, con-men, gossipers, we would love to hear from you, if you’d like to participate in our exhibition. Follow the link in bio to our Google Form, where you can submit your work!\n\nOpen Call: from 10th of June to 10th of September\nDate of Exhibition: 10th of October\nLocation: Amsterdam\nContact: team.businessinthefront@gmail.com\nSubmission of Work: Google Form via link in bio \n\nUNBELIEVABLE \n\nWe are a small artist-and-student-led organisation, working on creating events in the grey area between exhibition and party. We wish to paint that grey area in bold yellow and welcome everyone into it. As a group we are extremely interested in dualities and extremes, the tight and the loose, contradictions and compliments, the inevitable and the avoidable, the exhibition and the party, facets and facades.\n\nUNBELIEVABLE\n\nWe look forward to hearing from you!","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-10","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"REPRISE is now open. Gallery hours 11-6 Wednesday to Saturday. Exhibition runs through ...","k":"exhibition","s":"2026-06-12","e":"2026-09-12","st":null,"et":null,"u":"georgerouy","c":"Basel","co":"","p":"https://www.instagram.com/p/DZetMl8jsa6/","x":"REPRISE is now open. Gallery hours 11-6 Wednesday to Saturday. Exhibition runs through 12 September @hannahbarrygallery","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-12","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"On view in Los Angeles—works by Paulina Peavy (@paulinapeavyofficial) in ‘Dictation fro...","k":"exhibition","s":"2026-07-28","e":"2026-09-12","st":null,"et":null,"u":"karmakarma9","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DbWIg8Niade/","x":"On view in Los Angeles—works by Paulina Peavy (@paulinapeavyofficial) in ‘Dictation from the Other Side.’\n\nIn 1932, Peavy attended a séance at the home of Ida L. Ewing in Santa Ana, California, where she claims to have met a spirit-slash-UFO from another world named Lacamo. From that moment forward, Peavy, a university-trained artist, painted with a brush that “moved on its own.” To channel Lacamo, she made elaborate masks that combine Surrealist touches with indigenous themes. Peavy’s artistic path centered around her convening with beings and forces beyond the visible plane to create her work.\n\nCurated by Laura Whitcomb, ‘Dictation from the Other Side’  is on view through September 12 at 7351 Santa Monica Boulevard.\n\nAbove: (1) Paulina Peavy, ‘Untitled,’ c. 1930-89. Oil and acrylic on canvas, 30⅛ × 24⅛ in. (2, 5) ‘Dictation from the Other Side,’ installation views, Karma, Los Angeles, 2026 (3) Peavy in her studio, 1939. Courtesy the Estate of Paulina Peavy and Andrew Edlin Gallery (4) ‘Untitled,’ c. 1938–89. Oil on board, 14 × 12 in. (6) Peavy holding masks. Photo: Sam Vandivert. Courtesy the Estate of Paulina Peavy and Andrew Edlin Gallery (7) ‘Golden Horn Spider,’ n.d. Mixed media, 7¼ × 8⅛ × ¾ in.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Urs Frei. A–Z","k":"opening","s":"2026-04-25","e":"2026-09-13","st":"18:30","et":null,"u":"kunstmuseumsg","c":"Zurich","co":"","p":"https://www.instagram.com/p/DWs5B87jCEJ/","x":"Urs Frei. A–Z\n25. April 2026 bis 13. September 2026, Kunstmuseum\n\n👉Vernissage: 24. April 2026, 18:30 Uhr\n\nDas Kunstmuseum St.Gallen präsentiert eine umfassende Retrospektive des Schweizer Künstlers Urs Frei (1958–2023), der in den 1990er-Jahren internationale Erfolge feierte. Seine radikalen Werke aus alltäglichen Bau- und Verpackungsmaterialien wie Holz, Metall, Karton und Kunststoff bewegen sich zwischen Malerei, Skulptur und Objekt. Das Œuvre von Urs Frei steht in einer Entwicklungslinie von Künstler*innen, die mit armen, provisorischen Materialien arbeiten – einer Haltung, die heute bei vielen jungen internationalen Positionen ein bemerkenswertes Revival erlebt. 📦\n\n//\n\nUrs Frei. A–Z\n25 April 2026 to 13 September 2026, Kunstmuseum St.Gallen\n\n👉Exhibition Opening: April 24, 2026, 6.30pm\n\nThe Kunstmuseum St.Gallen presents a major retrospective of the Swiss artist Urs Frei (1958–2023), who found international success in the 1990s. His radical works, made from everyday building and packaging materials such as wood, metal, cardboard, and plastic, move between painting, sculpture, and object. Urs Frei’s oeuvre stands in a lineage of artists working with humble, provisional materials— an approach that today is experiencing a notable revival among many young artists internationally. 📦\n\n#kunstmuseumsg #kunstmuseumstgallen #ursfrei #vernissage\n\n📸\nUrs Frei, Ohne Titel, 1990, Lackfarbe auf Stoff, Füllstoff, Schnur, 78 x 86 x 23 cm, Sammlung Luigi Archetti, Foto: Luigi Archetti","r":false,"b":null,"af":false,"so":false,"pd":"2026-04-04","ld":21,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"“SUPERFLEX: Rainbows, Sponges, Flies, and Spoons” is on view at the MAK Center at the S...","k":"exhibition","s":"2026-06-12","e":"2026-09-13","st":null,"et":null,"u":"makcenter","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DaQZW-Okiya/","x":"“SUPERFLEX: Rainbows, Sponges, Flies, and Spoons” is on view at the MAK Center at the Schindler House through September 13, 2026.\n\nDesigned by Austrian-American architect R.M. Schindler in 1922 as an experiment in communal living, the Schindler House reimagined domestic life by balancing shared spaces with independent studios for each resident. Playing off this history, the exhibition unfolds through distinct bodies of work, each occupying its own space, completely separate yet strangely connected.\n\nThroughout the house, domestic tableaux reinhabit Schindler's interiors, creating the uncanny impression of a home still in use. Within these lived settings, SUPERFLEX's subtle manipulations of familiar objects produce moments of humor and estrangement while exploring questions of infrastructure, ecological interdependence, and collective perception.\n\nFor the exhibition, UniFor contributes a selection of pieces, including Aldo Rossi’s iconic Museo chair, tables from the PRINCIPLES collection by OMA, and an Andromeda small table by LSM. Integrated throughout the interiors in close relation to SUPERFLEX’s works, these elements act as supports, spatial devices and points of connection. In dialogue with both the artworks and the architecture of the Schindler House, they create a subtle continuity between furniture, domestic space and exhibition display.\n\nPlease visit the link in our bio to book your visit.\n\n---\nImages: Installation view of “SUPERFLEX: Rainbows, Sponges, Flies, and Spoons,” MAK Center for Art and Architecture at the Schindler House, Friday, June 12, 2026 – Sunday, September 13, 2026. Photography by Joshua Schaedel.\n\n“SUPERFLEX: Rainbows, Sponges, Flies, and Spoons” is presented by the MAK Center in partnership with 1301PE (@1301pe). Support for the exhibition generously provided by David Johnson and a grant from the Danish Arts Foundation (@statenskunstfond). Special thanks to Brian Butler from 1301PE, Kukje Gallery (@kukjegallery), and von Bartha (@vonbartha). Generous in-kind support provided by UniFor (@unifor_official).","r":false,"b":"reserve","af":true,"so":false,"pd":"2026-07-01","ld":-19,"dl":"2026-09-13","ds":"run closes","ap":false,"rel":false,"q":true},{"now":true,"t":"On view @dom_artprojects in Dubai through September 13, 2026","k":"exhibition","s":"2026-06-17","e":"2026-09-13","st":null,"et":null,"u":"capsuleshanghai","c":"Dubai","co":"","p":"https://www.instagram.com/p/DZrTGpzkryL/","x":"On view @dom_artprojects in Dubai through September 13, 2026\n.\nMevlana Lipp participates in ‘Time That Grows Slowly’, a group exhibition curated by Alexander Burenkov @sashaburenkov \n.\nThe exhibition is inspired by ideas attuned to vegetal temporalities of being in the world, reflecting on philosophical reflections of time as growth rather than movement, and features works by cross-regional artists—many of whom have never been shown in Dubai before. \n.\nGrouped around site-specific installations attentive to care and interspecies communication, the exhibition engages ecological, feminist, philosophical, and postcolonial concerns.\n.\nParticipating artists: Maha Alasaker (Kuwait / UAE), Srijon Chowdhury (Bangladesh / USA), Odonchimeg Davaadorj (Mongolia / France), Patricia Domínguez (Chile), Kwama Frigaux (Ghana / France), Mevlana Lipp (Germany), Sulafa Mohammed (UAE), Tabita Rezaire (France / French Guiana), Shaima Shamsi (Saudi Arabia / Bahrain / UAE), Farah Soltani (Iran / UAE), Antoine Renard (France), Nadia Waheed (Saudi Arabia / Pakistan / USA) \n.\nPhotos © Maria Lashanova & Dom Art Projects\n.\n(L): Mevlana Lipp, Float, 2026, acrylic on canvas, 45 x 33 cm\n(R): Mevlana Lipp, Dune, 2026, acrylic on canvas, 60 x 45 cm","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-17","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Ants crawl up and down the walls of Fondation Beyeler (@fondationbeyeler). A robotic la...","k":"exhibition","s":"2026-07-27","e":"2026-09-13","st":null,"et":null,"u":"artdrunk","c":"Basel","co":"","p":"https://www.instagram.com/p/DbUGJsaBaL8/","x":"Ants crawl up and down the walls of Fondation Beyeler (@fondationbeyeler). A robotic larva swerves and squirms. And an artificial lung pumps and breathes life into the exhibition space.\n\nFilms, images, sounds, objects, living forms and machines coexist, composing a transitory space where boundaries blur and dissolve. This is the work of Pierre Huyghe, a mastermind who pushes the limits of perception. Stepping inside this exhibition, you are no longer just a visitor. You become an actor within it.\n\nMouna Mekouar (@mounamekouar), Curator at Fondation Beyeler, gives you the full tour.\n\nPierre Huyghe\nUntil September 13\nFondation Beyeler\nBasel🇨🇭","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Joyce Joumaa @joycejoumaa","k":"exhibition","s":"2026-07-28","e":"2026-09-13","st":null,"et":null,"u":"kwinstitutefcontemporaryart","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbVHSkPDcbX/","x":"Joyce Joumaa @joycejoumaa \n'Works of Centuries', 2026 \nPaper, matchboxes, poplar wood, resin paint, plexiglass\nVariable dimensions \n\n'Works of Centuries' by Joyce Joumaa (b. 1998, Beirut) begins with an epistolary gesture: in 2015, the British art historian and critic John Berger composed a posthumous letter to Marxist revolutionary Rosa Luxemburg. Centering on Berger’s letter, Joumaa’s work contrasts the different ways of experiencing time: Berger writes toward an absent future, while Luxemburg, in her letters from prison from 1918, focuses on the immediacy of birdsong outside her cell, grounding her in the present.\n\nThe installation proposes an alternative archive: neither linear nor fixed, but dispersed across time and geography. The letter, held in a frame, remains as if still in transit. Beside it, an open wooden frame gathers original Soviet match-boxes into a compact grid, where images of songbirds interlace histories of production, exchange, and ideology. \n\nSee this work at KW as part of the Kyiv Biennial @kyivbiennial exhibition, 'A Bird That Cannot Land' – on view until 13.09.26.\n\nVisit our website for more information 🔗 link in bio.\n__________\n\n#kwinstituteforcontemporaryart #kyivbiennial #joycejoumaa \n\nImages: Joyce Joumaa, 'Works of Centuries', 2026. Courtesy the artist. Installation view of the exhibition 'Kyiv Biennial – A Bird That Cannot Land' at KW Institute for Contemporary Art, Berlin 2026. Photos: Frank Sperling.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Dana Kavelina @dana.kavelina","k":"exhibition","s":"2026-07-30","e":"2026-09-13","st":null,"et":null,"u":"kwinstitutefcontemporaryart","c":"Berlin","co":"","p":"https://www.instagram.com/p/Dbav0wigYBs/","x":"Dana Kavelina @dana.kavelina\n'Grey Earth', 2026\nVideo, stop-motion animation\n\nThis stop-motion animation film by Dana Kavelina (b. 1995, Melitopol) intertwines war, extraction, and ecological exhaustion through the parallel journeys of two figures: a soldier positioned on the front line and a cow taken from an industrial dairy farm. Following an explosion, both characters experience a moment of suspended freedom – the cow breaks free from the truck transporting her toward slaughter, while the wounded soldier is straying through a grey zone, abandoned by his unit. \n\nThrough its handmade animation, the film proposes restoring the organic world with artificial materials, recreating in miniature the work of nature and destruction, compressing cycles of life, war, and extraction.\n\nSee this work at KW as part of the Kyiv Biennial @kyivbiennial exhibition, 'A Bird That Cannot Land' – on view until 13.09.26.\n\nVisit our website for more information 🔗 link in bio.\n\n__________\n\n#kwinstituteforcontemporaryart #kyivbiennial #danakavelina \n\nImages: Dana Kavelina, 'Grey Earth', video still, 2026. Courtesy the artist. Installation view of the exhibition 'Kyiv Biennial – A Bird That Cannot Land' at KW Institute for Contemporary Art, Berlin 2026. Photos: Frank Sperling.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"CONCORD, NH – Kyoko Idetsu is included in Montages, with Peter Cordova, on view at Oute...","k":"exhibition","s":"2026-07-30","e":"2026-09-19","st":null,"et":null,"u":"hoffman.donahue","c":"Concord","co":"","p":"https://www.instagram.com/p/DbavstOlIpM/","x":"CONCORD, NH – Kyoko Idetsu is included in Montages, with Peter Cordova, on view at Outer Space Arts through September 19.\n\nDrawing from everyday observations, personal anecdotes, and the rhythms of domestic life, Idetsu transforms fleeting experiences into vivid, layered narratives. Expressive figures and overlapping perspectives unfold across her compositions, bringing together private memory and the broader social conditions that shape daily life.\n\nOuter Space\n35 Pleasant Street, 2nd Floor\nConcord, New Hampshire\n\nPhotography by Morgan Karanasios.\n\n@outerspacearts @kyokoidetsu #KyokoIdetsu #OuterSpaceArts","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Tone in Tongue, a multi-venue international exhibition, will be on view July 11–Sept 20...","k":"exhibition","s":"2026-07-11","e":"2026-09-20","st":null,"et":null,"u":"letterformarchive","c":"","co":"Japan","p":"https://www.instagram.com/p/DaDyW77kzwg/","x":"Tone in Tongue, a multi-venue international exhibition, will be on view July 11–Sept 20, 2026 at Letterform Archive!⁠\n⁠\n⁠\nCulture, like a shadow, shifts over time. The Chinese idiom “如影随形” rú yǐng suí xíng (“as the shadow follows the form”) evokes this fluid, inseparable relationship. Tone in Tongue adopts this metaphor to explore East Asian visual culture, tracing how shared histories and aesthetic identities continue to resonate in contemporary design. Through the lens of graphic design, typography, and independent publishing, the exhibition highlights the tension and harmony between shared language and individual expression across the region. ⁠\n⁠\n⁠\nTone in Tongue, the exhibition title and a play on words, draws from the Hanzi character 同 tóng (together or in common) and is composed of the radicals 凡 fán (all) and 口 kǒu (mouth or gateway), symbolizing a shared language.⁠\n⁠\n⁠\nPresented in four, interconnected parts, Tone in Tongue features the work of designers and publications, including:⁠\n⁠\n⁠\n▶ Commissioned posters by international studios⁠\n⁠\n▶ Contributions from emerging practitioners selected through an open call⁠\n⁠\n▶ A curated collection of independent publications⁠\n⁠\n▶ A design magazine tour that traces evolving perspectives on East Asian graphic design over the past two decades featuring Design360° (China), GRAPHIC (South Korea), and idea magazine (Japan)⁠\n⁠\n⁠\nTone in Tongue is curated and organized by Mary Y. Yang and Zhongkai Li⁠\n⁠\n⁠\n📷: Zengyi Zhao, Sight Photography⁠\n⁠\n⁠\n#LetterformArchive #RadicalCharacters #ToneInTongue","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-26","ld":15,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"ON VIEW: Heinrich Dunst, Sophia Eisenhut, Simon Lehner","k":"exhibition","s":"2026-07-30","e":"2026-09-26","st":"12:00","et":"18:00","u":"kowberlin","c":"Berlin","co":"","p":"https://www.instagram.com/p/Dbao-9viSTH/","x":"ON VIEW: Heinrich Dunst, Sophia Eisenhut, Simon Lehner\nPARATEXT\nuntil 26.09.2026\n\nParatext refers to text types or text elements that accompany or supplement a text and influence its reception, whether through the author’s own actions or through external support for the author’s intentions.\n\nSwing by the gallery Wed–Sat, 12–6 pm, and immerse yourself in the artists' vastness.\n____\nImages:\nHeinrich Dunst, Sophia Eisenhut, Simon Lehner‚ 'PARATEXT' installation views at KOW, 2026, courtesy of the artists and KOW, Berlin. Photographer: Ladislav Zajac","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"BOOK LAUNCH⁠","k":"reading","s":"2026-07-30","e":"2026-09-27","st":"18:00","et":"20:00","u":"distanzverlag","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbVVPIjCHUB/","x":"BOOK LAUNCH⁠\n⁠\nOn the occasion of the publication of “Übersehen – Ein Berliner Koffer”, the book on the photography of Friedrich “Fide” Struck will be presented by producer Lily von Wild, graphic designer Antonia Steitz, and the son of the photographer Thomas Struck. ⁠\n⁠\nTHOMAS STRUCK⁠\n“Übersehen – Ein Berliner Koffer. Fotografien von Fide Struck 1928 – 1941”⁠\n⁠\nJuly 30, 2026, 6 – 8 pm⁠\n⁠\nWilly-Brandt-Haus @freundeskreis_wbh⁠\nStresemannstr. 28⁠\n10963 Berlin⁠\n⁠\nFree entry⁠\nID required ⁠\n⁠\nDon’t miss the exhibition at Willy-Brandt-Haus, open until September 27!⁠\n⁠\nFor more information about the book, visit our website. ⁠\n⁠\n#distanzverlag #distanzpublishing @freundeskreis_wbh @lilyvwild @antoniahannahsteitz","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Miks on näitusel „Kristi Kongi. Kromaatiline triiv“ nii palju treppe? Vaata videost, ku...","k":"exhibition","s":"2026-05-25","e":"2026-09-30","st":"01:00","et":null,"u":"kumukunstimuuseum","c":"Tallinn","co":"","p":"https://www.instagram.com/p/Da2Dl9jFY-l/","x":"Miks on näitusel „Kristi Kongi. Kromaatiline triiv“ nii palju treppe? Vaata videost, kuidas kunstnik nende tähendust avab.\n\nSeoses Kumu juubelisuvega on Kristi Kongi näitus ja muuseumi siseõu 25. maist kuni 30. septembrini avatud ka esmaspäevadel, kui ülejäänud muuseum on suletud. Igal esmaspäeval kell 15.00 toimub muuseumitöötaja lühitutvustus n
