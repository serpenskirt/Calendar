hao’s exhibition consists of Ben Ming Nian (本命年), an installation of twenty-four photographs on the gallery’s 19th floor. Alternating between shadowy black & white and muted color, this sequence of images presents a selection of moments from the stream of Zhao’s daily existence. As always in her practice, self-disclosure and artistic identity operate along a fluid line of ambivalence, erasure, and potential reversibility. Despite being nominally diaristic, many of these images remain deeply inscrutable. More atmosphere than evidence, they furnish something like an emotional weather report of Zhao’s life with the twelve year curse.2\n 1 Chuang-Tzu, Chuang-Tzu: The Inner Chapters, trans. A.C. Graham, (Hackett Publishing, 2001), 26. \n2 本命年 Ben Ming Nian refers to the years that align with one’s personal Chinese zodiac, which occur every twelve years—one Zodiac cycle. One’s Ben Ming Nian is typically associated with misfortune and bad luck, due to the year corresponding with being in conflict with the corresponding Tai Sui 太岁general of the year. Tai Sui is a celestial deity in Chinese folk religion, and there are sixty Tai Sui generals, thus they rotate on a sixty-year cycle.\n Installation views by Felix S.C. Wong. \n@stupid_____idiot","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-12","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Next at Glasshouse:⁠","k":"exhibition","s":"2026-08-08","e":"2026-09-05","st":"15:00","et":"17:00","u":"gertrudecontemporary","c":"Melbourne","co":"","p":"https://www.instagram.com/p/DbHVDuOGYE6/","x":"Next at Glasshouse:⁠\nRenee Cosgrave & Maia Kreisler⁠\nWaiho i te Toipoto (keep close together)⁠\n⁠\n8 August - 5 September 2026⁠\nGertrude Glasshouse⁠\n44 Glasshouse Road, Collingwood⁠\nWurundjeri Country⁠\n⁠\nOpening Event: Saturday 15 August, 3 – 5pm\n\nJoin us on Saturday 22 August at 12:30 for Kai and Kōrero (food and conversation) with Gertrude Studio Artist ⁠Renee Cosgrave and Maia Kreisler.\n⁠⁠\nAs an exhibition title, Waiho i te Toipoto evokes whānau and kinship, whakapapa and ancestral connection, community and collective care, belonging and the bonds that endure across distance and time. For these bodies of work, both concerned with whakapapa, memory, and relationships, they carry both a personal and collective meaning without being overly descriptive. Whakapapa is often translated as genealogy or family lineage. In simple terms, whakapapa is the story of where you come from and how you are connected. This collaborative exhibition brings into dialogue a wall painting by Gertrude Studio Artist Renee Cosgrave (Ngāti Tūwharetoa) and a series of recent works by Maia Kreisler (Ngāti Mutunga & Te Āti Awa), contextualised and expanded through an exhibition text by Emma Hislop (Kāi Tahu).⁠\n⁠\n–⁠\n⁠\nRenee Cosgrave is represented by @haydens.gallery, Naarm Melbourne.⁠\nMaia Kreisler is represented by @seasonaotearoa, Tāmaki Makaurau Auckland.⁠\n⁠\nGertrude Glasshouse is generously supported by Michael Schwarz and David Clouston.⁠\n⁠\nRenee Cosgrave, work in progress, 2026, oil on canvas. Copyright and courtesy the artist. Image: @reneecosgrave⁠\nMaia Kreisler, Upoko (detail), 2026 ceramic and silver oil paint. Copyright and courtesy the artist. Image: @maia_kreisler_⁠\n⁠\n#GertrudeGlasshouse #GertrudeStudioArtist #ReneeCosgrave #MaiaKreisler⁠","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":16,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Nomenclature for the Time Being","k":"performance","s":"2026-05-21","e":"2026-09-06","st":null,"et":null,"u":"iamsandramujinga","c":"London","co":"","p":"https://www.instagram.com/p/DYMqkvZDW1k/","x":"Nomenclature for the Time Being\n21 May to 6 September 2026 \n\nThis exhibition gathers the work of Rebecca Bellantoni, Hannah Black, Maren Hassinger, Deborah-Joyce Holman, Marla-Sunshine Kellard-Jones, Atiéna R. Kilfa, Christine Kirubi, Kumbirai Makumbe, Zanele Muholi, Sandra Mujinga, Shenece Oretha, Ingrid Pollard and Ebun Sodipo – artists whose practices span sculpture, performance, writing, photography and video. Most of all, this is a sculpture show, with artists deploying rope, steel wire, leather, plastic, velvet, wood, concrete, petroleum, wax, glass, thread – always with an awareness of the body.\n\nCurated by Imani Mason Jordan @homopathic , Nomenclature for the Time Being borrows its title from the 2022 book-length poem by Dionne Brand. It proposes that shared sociopolitical realities or structural conditions might also generate certain shared material sensibilities. What emerges could be considered a kind of Black feminist materiality, one that understands objects as social and political actors. These are practices that do not try to represent the world, but actively reconfigure it.\n\nOne gallery in the exhibition has been designed by the artist duo repertoire to host a series of performances and other activations that will unfold over its duration. Additional research for Nomenclature for the Time Being has been provided by Nikita Sena Quarshie @dede.koko \n📷 Long Time Comin’ (still)\nDir. Dionne Brand, 1993","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-11","ld":10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Work by Sonia Gomes (@soniagomesarte) is included in \"Project a Black Planet: The Art a...","k":"exhibition","s":"2026-06-11","e":"2026-09-06","st":null,"et":null,"u":"pacegallery","c":"London","co":"","p":"https://www.instagram.com/p/DbWky_ymdwu/","x":"Work by Sonia Gomes (@soniagomesarte) is included in \"Project a Black Planet: The Art and Culture of Panafrica\" at Barbican Centre (@barbicancentre), the first major exhibition to celebrate the influence of Pan-Africanism on visual art and culture\n-\nThe exhibition features over 250 paintings, sculptures, installations, posters, journals, and films produced across Africa, Brazil, the Caribbean, North America, and Western Europe from the 1920s to the present.\n-\nProject a Black Planet: The Art and Culture of Panafrica\nthrough September 6\nArt Gallery, Barbican Centre\nLondon\n-\nLearn more about #SoniaGomes at the link in bio.\n-\nArtwork: Installation view: \"Project a Black Planet: The Art and Culture of Panafrica,\" June 11 – September 6, 2026 © Max Colson / Barbican Art Gallery\n\n#ContemporaryArt #BarbicanCentre","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":-47,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"One month left to see 'Extrasensory'!","k":"exhibition","s":"2026-06-12","e":"2026-09-06","st":null,"et":null,"u":"kbhgeiger","c":"Vienna","co":"","p":"https://www.instagram.com/p/DbvWMXkNIA3/","x":"One month left to see 'Extrasensory'!\n\nChloe Wise’s most expansive film project to date, 'PsyFi*,' unfolds as a three-channel installation exploring how cultures across time have described encounters with the unknown, from angelic visions to accounts of non-human intelligence. The exhibition expands into a large-scale immersive environment shaped by belief, storytelling, and cultural imagery.\n \nWritten & Directed by: @chloewise_ \nProduction Company: @gummyfilms \nProducers: @rachelxwalden & @chloewise_ \nProduced by: @christopher_dagostino & @yoitsjanet \nDirector of Photography: @hunterzimny \nGaffer: @space_magic \nStills: @loganwhitephoto \nProduction Design: @chaspooley \nCostumes: @planet_noodle \nHair: @uhmmwhat \nSFX Makeup: @izzigalindo & @nina_carelli_ \nPost Producer & Colorist: @lu__de__ba \nEditors: @dustinwaldman, @ghostboats, @alphasixty, @modern.post \nOriginal Composition & Sound Design: @amortheworld \nSound Mix: @marcusdembinski.wavNo \n\nExtrasensory – Chloe Wise\nCurated by @samuel_leuenberger \n12 June – 6 September 2026 \n____\n#extrasensory #chloewise #samuelleuenberger #kbhg #kulturstiftungbaselhgeiger","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":-56,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Thrilled my work is included in Nomenclature for a Time Being at @raven__row. It's up u...","k":"exhibition","s":"2026-06-20","e":"2026-09-06","st":null,"et":null,"u":"deborahjoyceholman","c":"London","co":"","p":"https://www.instagram.com/p/DZ0YUu7giSa/","x":"Thrilled my work is included in Nomenclature for a Time Being at @raven__row. It's up until 6 September.\n\nIn the exhibition text, curator Imani Mason Jordan @homopathic writes: 'In Deborah-Joyce Holman's Thicc and Slippery (2020), human teeth become a site of persistance, resisting abstraction even as they refuse identification. A small, dense sculpture in ink on human teeth, wire, aluminium and mirror, its scale is domestic, it's implications are not. Teeth and bones are what remain of bodies after death – individual, specific, hard to neutralise – raising immediate questions about ownership over one's own body, and what remains after classification. The title carries a Black vernacular charge: to be thicc and slippery is to be uncontainable, present in excess, impossible to hold. The mirror turns the gaze back, implicating whoever looks in the representational economy the work simultaneously refuses. Both works, [the nearby] Umemezi (State of Emergency) [by Zanele Muholi] and Thicc and Slippery, refuse erasure through the body's own material and language. Where Muholi amplifies the voice that calls out, Holman insists on the body that remains – ungovernable, unidentified, returned to the viewer's gaze. Together they ask not only who speaks, but who is seen, and who survives.'\n\nPicture 1: Installation view, Nomenclature for the Time Being, 2026, Raven Row. Photograph by Marcus J Leith\nPicture 2: Photo by Ramiro Chavez","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-20","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Elbląg","k":"exhibition","s":"2026-07-02","e":"2026-09-06","st":null,"et":null,"u":"stockholmartguide","c":"Elbląg","co":"Poland","p":"https://www.instagram.com/p/DakVIxkjHjh/","x":"Elbląg\n\n”Hairline”\nSolo exhibition by Angelika Puff\n\n2nd July - 6th September 2026\n\n@angelpuff_\n@galeriael\n\n”The exhibition’s title, ’Hairline’, refers both to the line of hair marking the beginning of the face and to a hairline crack, a delicate fracture, a barely perceptible trace of structural rupture. The exhibition unfolds within this space between connection and separation, rootedness and uprooting, intimacy and distance. It is a meditation on inheritance, memory, and the bonds that, even when strained or fractured, never disappear entirely.”\n-Emilia Orzechowska\n\nCurated by Emila Orzechowska @em_aku\n\nImages courtesy of artist \nPhotographer Paweł Sobczak @pawelsobcza\n\n@elblagmiasto\n\n#angelikapuff\n#galeriael\n#hairline","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-09","ld":-7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Cmentarna”","k":"exhibition","s":"2026-07-11","e":"2026-09-06","st":null,"et":null,"u":"angelpuff_","c":"Elbląg","co":"","p":"https://www.instagram.com/p/DapHP33gJNu/","x":"“Cmentarna”\n2024\noil, beetroot pigment on canvas \n30 x 40 cm \n\nFrom the exhibition Hairline, in @galeriael, curated by @em_aku \nOn view in Elbląg, until September 6, 2026. \n\nPhotos @pawelsobcza","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-11","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Performance Vinculum at the opening of my solo exhibition Hairline at @galeriael curate...","k":"performance","s":"2026-07-14","e":"2026-09-06","st":null,"et":null,"u":"angelpuff_","c":"Elbląg","co":"","p":"https://www.instagram.com/p/Daw4sHwAkFS/","x":"Performance Vinculum at the opening of my solo exhibition Hairline at @galeriael curated by @em_aku \n\nOn view in Elbląg until September 6, 2026.\n\nVideo by @pawelsobcza","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Cycle”","k":"exhibition","s":"2026-07-15","e":"2026-09-06","st":null,"et":null,"u":"angelpuff_","c":"Elbląg","co":"","p":"https://www.instagram.com/p/DazdRp6gN20/","x":"“Cycle”\n2025\noil, masking paste on canvas \n80 x 60 cm \n\nFrom the exhibition Hairline, in @galeriael, curated by @em_aku \nOn view in Elbląg, until September 6, 2026. \n\nPhotos @pawelsobcza","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"What if the whole planet became one machine?  This immersive exhibition constructs a se...","k":"exhibition","s":"2026-07-15","e":"2026-09-06","st":null,"et":null,"u":"madanivision","c":"New York","co":"","p":"https://www.instagram.com/p/Daz9pklBIND/","x":"What if the whole planet became one machine?  This immersive exhibition constructs a series of imagined futures for our planet, rooted in real technology and climate-based possibilities.  In Other Worlds is running until 6 September at the Barbican Centre (@barbicancentre).","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Swamp”","k":"exhibition","s":"2026-07-17","e":"2026-09-06","st":null,"et":null,"u":"angelpuff_","c":"Elbląg","co":"","p":"https://www.instagram.com/p/Da4g4g_AM0E/","x":"“Swamp”\n2024\noil, masking paste on canvas \n30 x 30 cm \n\nFrom the exhibition Hairline, in @galeriael, curated by @em_aku \nOn view in Elbląg, until September 6, 2026. \n\nPhotos @pawelsobcza","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-17","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Vines”","k":"exhibition","s":"2026-07-21","e":"2026-09-06","st":null,"et":null,"u":"angelpuff_","c":"Elbląg","co":"","p":"https://www.instagram.com/p/DbC-n4_AL-m/","x":"“Vines”\n2026\noil, masking paste on canvas \n90 x 90 cm \n\nFrom the exhibition Hairline, in @galeriael, curated by @em_aku \nOn view in Elbląg, until September 6, 2026. \n\nPhotos @pawelsobcza","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Nancy Lupo(@_nancy_lupa_)’s largest exhibition in the UK to date, ‘Several Chickens Lat...","k":"performance","s":"2026-07-23","e":"2026-09-06","st":null,"et":null,"u":"antennaspace","c":"London","co":"","p":"https://www.instagram.com/p/DbHzkRFD0EY/","x":"Nancy Lupo(@_nancy_lupa_)’s largest exhibition in the UK to date, ‘Several Chickens Later’, is currently on view at Spike Island (@spikeisland) with a corpus of newly commissioned sculptures that probe aspirations, ambiguities and material culture. In her work, which encompasses sculpture, video, writing, sound, drawing, painting, performance and architecturally specific installation, Lupo reflects on how collective fantasies and emotions become embedded in form. She often describes her work as being scripted or held together through a thin thread of narrative which she explores through writing that she publishes as zines, and soon, in her first novel, ‘Meow Meow Real Estate’.\n \nThe exhibition at Spike Island prolongs the reverie and the longing for domesticity. It refuses a reality-check, and loops back into wistful illusion. Although the mirage is tired, its feeble flame still somehow persists. Her works evoke the fragility of our endeavours, and the futility of our fantasies.\n\nCurated by Clémentine Proby (@clementineproby \n \n-\n \nNancy Lupo: ‘Several Chickens Later’ is open at Spike Island until 6 September 2026. It includes a work co-produced by Spike Island and the Nicoletta Fiorucci Foundation (London). With thanks to Raven Row (London). The exhibition is generously supported by Antenna Space.\n\nImages courtesy the artist and Spike Island (2026). Photography by Rob Haris\n \n#nancylupo #spikeisland","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Kate Hargrave’s (@katearmshargrave) ‘Birdwatchers’ (2026) in ‘Outside.’","k":"talk","s":"2026-07-27","e":"2026-09-06","st":null,"et":null,"u":"karmakarma9","c":"Thomaston","co":"United States","p":"https://www.instagram.com/p/DbTns36iaq4/","x":"Kate Hargrave’s (@katearmshargrave) ‘Birdwatchers’ (2026) in ‘Outside.’\n\nBased in Portland, Maine, Hargrave employs techniques from sixteenth- and seventeenth-century oil painting to give form to gossamer figures and their otherworldly environments. Informed by an image archive spanning from Early Renaissance religious icons to mid-twentieth-century kids’ books, Hargrave depicts her subjects in postures that communicate sensitivity and self-determination in equal measure.\n\nCurated by Matthew Higgs (@matthewhiggs2015), ‘Outside’ is on view through September 6 at 70 Main Street, Thomaston, Maine.\n\nAbove: (1, 4) Kate Hargrave, ‘Birdwatchers,’ 2026. Oil on birch panel, 30 × 30 in. (2) ‘Outside,’ installation view, Karma, Thomaston, Maine, 2026 (3, 5) ‘Birdwatchers’ in Hargrave’s Portland, Maine studio, 2026.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"‘There are four shifting tones that sound like an impression of music. Each one is diff...","k":"talk","s":"2026-07-28","e":"2026-09-06","st":"12:00","et":"18:00","u":"chisenhalegallery","c":"London","co":"","p":"https://www.instagram.com/p/DbWCHcLDP68/","x":"‘There are four shifting tones that sound like an impression of music. Each one is different, and each one is live. The algorithm I wrote for the sound installation operates on a similar principle as the cameras: that of randomness. It listens to local radio broadcasts around the Chisenhale Gallery building and takes pictures of them at random intervals. (...)\n\nIt’s very hard to describe, but I hope that listening to it can be a complex, nuanced experience that doesn’t necessarily need explanation. While all of the radios are tuned to the same source, the fact that each of the four algorithms is taking photographs of the sound at different points in time creates an experience of dislocation, as it stretches the live radio broadcast across time and space.’ – Jasper Marsalis in conversation with Tosia Leniarska, Curator.\n\nIn Jasper Marsalis’ Chisenhale Gallery commission, four electrostatic speakers process an FM radio signal in real time. A programme written by the artist takes images of the transmission frequencies and converts them back into sound, slowly interpolating between them. What is heard are the shifting static tones rendering the spatial aspects of transmission audible.\n\n‘Still Life’ remains on view until 6 September, open 12–6pm Wednesday–Sunday.\n\nPhoto: Mark Blower.\n\n@thatboiakathatboi\n#JasperMarsalis\n#StillLife\n#ChisenhaleGallery","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"A selection of paintings by William Hawkins is on view in ‘Outside.’","k":"exhibition","s":"2026-07-29","e":"2026-09-06","st":null,"et":null,"u":"karmakarma9","c":"Thomaston","co":"United States","p":"https://www.instagram.com/p/DbYzf8xCaVa/","x":"A selection of paintings by William Hawkins is on view in ‘Outside.’\n\nRaised on a farm in Kentucky, Hawkins learned to draw by copying illustrations from horse-auction announcements and calendar pictures. At twenty-one, he moved to Columbus, Ohio, where he began painting the expressionistic cityscapes and animals for which he is best known. Present in ‘Indian Landing’ (1985) and ‘Old Home’ (1980)—two large-scale paintings from Hawkins’s mature period—is the artist’s distinctive signature, which includes his name, birthplace, and birthdate, July 27, 1895.\n\nCurated by Matthew Higgs (@matthewhiggs2015), ‘Outside’ is on view through September 6 at 70 Main Street, Thomaston, Maine.\n\n(1, 4) ‘Outside,’ installation views, Karma, Thomaston, Maine, 2026 (2–3) William Hawkins, ‘Indian Landing,’ 1985. Enamel on board, 24 x 48 in (5–6) ‘Old Home,’ 1980. Enamel on board, 24 x 48 in. Courtesy Fleisher/Ollman","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Live on NTS Radio this Thursday morning: artist Jasper Marsalis, aka Slauson Malone 1, ...","k":"talk","s":"2026-07-30","e":"2026-09-06","st":"12:00","et":"18:00","u":"chisenhalegallery","c":"London","co":"","p":"https://www.instagram.com/p/DbYhHoWsEep/","x":"Live on NTS Radio this Thursday morning: artist Jasper Marsalis, aka Slauson Malone 1, presents a radio show he created as part of the public programme for his Chisenhale Gallery commission, ‘Still Life’. \n\nThe compositions Marsalis selected for NTS Radio celebrate the influence of Kaija Saariaho, Pauline Oliveros, and other electro-acoustic composers on his exhibition. \n\n‘To participate in Pauline Oliveros’ Tuning Meditation, you sing a tone, and the next person sings in unison, matching that tone. When you run out of breath, you select a new tone by listening to another person. I learned it from my bandmate, Nicky Wetherell: we’d start our rehearsals with this. It’s very inspiring to actualise participation without pedagogy and hierarchy. \n\nBut I noticed that it’s scary to be asked to participate in this meditation, where you don’t know what the outcome is going to be. You have to have trust in someone to participate. For the sound installation, I wanted to create a piece that could perform without fear.’ – Jasper Marsalis in conversation with Tosia Leniarska, Curator.\n\n📅 Thursday 30 July 2026 \n⏰ 10am–12pm\n🔗NTS.live\n\nThe radio show will be archived on NTS.live for future listening.\n\n‘Still Life’ is on view until 6 September, open 12–6pm Wednesday–Sunday.\n\n@thatboiakathatboi\n@nts_radio \n#JasperMarsalis\n#StillLife\n#ChisenhaleGallery","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Rather than placing the island itself at the centre of the story, the film follows an ...","k":"exhibition","s":"2026-07-30","e":"2026-09-06","st":null,"et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/Dbav4NDjB6k/","x":"“Rather than placing the island itself at the centre of the story, the film follows an ecosystem of unstable, submerged, and resurfacing volcanic matter, always on the verge of emergence and disappearance.” — Elisa Giardina Papa (@elisagiardinapapa)\n\nGiardina Papa’s solo exhibition ‘She Flickered In and Out of History’ is on view until 6 Sep\n\n🎟️ Book tickets online or on the door\n💸 £4 for Under 25s\n\nCredits: Elisa Giardina Papa, She Flickered In and Out of History, 2026. Installation view at Institute of Contemporary Arts, London. Photography by Rob Harris; Elisa Giardina Papa, She Flickered In and Out of History, 2026 [clip]. \n\n#SheFlickeredInandOutofHistory #ElisaGiardinaPapa #Exhibition #ICA #London","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-07-30","ld":0,"dl":"2026-09-06","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"New works by Ann Craven (@ann_craven) in ‘Outside.’","k":"exhibition","s":"2026-07-31","e":"2026-09-06","st":"18:00","et":null,"u":"karmakarma9","c":"Thomaston","co":"United States","p":"https://www.instagram.com/p/Dbd-K4xift5/","x":"New works by Ann Craven (@ann_craven) in ‘Outside.’\n\nWorking in New York and Maine, Craven makes self-reflexive paintings that comment on devotion, loss, and the immortalizing nature of her medium. Primarily using unabashedly high-key colors, she paints and repaints her subjects, including the vase of feathery pink peonies in her studio, featured in her large-scale ‘Moon (Silent, Gram’s peonies), 2026’ and ‘Gram’s Peonies (Quiet Moon, WS, 5-25-26, 6 PM), 2026.’\n\nCurated by Matthew Higgs (@matthewhiggs2015), ‘Outside’ is on view through September 6 at 70 Main Street, Thomaston, Maine.\n\nAbove: (1) Ann Craven, ‘Gram’s Peonies (Quiet Moon, WS, 5-25-26, 6 PM), 2026,’ 2026. Oil on canvas, 24 x 18 in. (2, 4) Craven working in her New York Studio, 2026 (3) ‘Outside,’ installation views, Karma, Thomaston, Maine, 2026","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"In ‘Still Life’ by Jasper Marsalis, a cinematic screen displays a randomised sequence o...","k":"talk","s":"2026-07-31","e":"2026-09-06","st":"12:00","et":"18:00","u":"chisenhalegallery","c":"London","co":"","p":"https://www.instagram.com/p/DbdzW2hgX1f/","x":"In ‘Still Life’ by Jasper Marsalis, a cinematic screen displays a randomised sequence of live feeds from unsecured Internet Protocol cameras in places of natural beauty around the world.\n\n‘I see myself predominantly as a painter, but I think that it’s the responsibility of artists to be engaged not only with historical mediums but also with whatever exists in their lifetime. Video has become omnipresent in our lives, and it’s a medium whose flatness is very closely related to painting. We take for granted that painting is a technology in its own right, just one that is no longer relevant. Canvas as a material, or cadmium, or horsehair: as a society, we don’t really relate to these materials anymore, giving painting a sort of prestigious quality that I’m deeply uninterested in. \n\nWhat I am interested in is how painting can abstract experience and give us a different way of relating to the world and ourselves. Historically, landscape painting was attempting to do that: I’m thinking of the fin de siècle, or the Hudson Valley School, and their efforts during Industrialisation to refocus people’s attention towards something other than anthropocentric progress.’ – Jasper Marsalis in conversation with Tosia Leniarska, Curator.\n\n‘Still Life’ is on view until 6 September, open 12–6pm Wednesday–Sunday.\n\n@thatboiakathatboi\n#JasperMarsalis\n#StillLife\n#ChisenhaleGallery","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"More details of our piece, “Boîte de luxure,” in @swissinstitute’s “Regift” show on vie...","k":"exhibition","s":"2026-07-31","e":"2026-09-06","st":null,"et":null,"u":"womens_history_museum","c":"Zurich","co":"","p":"https://www.instagram.com/p/Dbd4FDHFDuQ/","x":"More details of our piece, “Boîte de luxure,” in @swissinstitute’s “Regift” show on view at @lumawestbau until September 6\n\nFor the “Regift” show we created our own oversized candy box with faux candies and bon bins out of vintage clothing notions.\n\nAmong the connotations of such a gift (whether to yourself or another) are: Generosity, luxury, visuality, seduction and sentimentality.\n\nThe somatic and symbolic experience of consuming a box of chocolates can be likened to an almost microcosmic simulation — you as the eater in Godlike dominion of the cosmos, hand selecting bite sized momentary sensual experiences, escaping through the senses.\n\nOn the backside of this indulgence is emptiness and terminability of such an experience. \n\nWe became interested in the history of the chocolate box as a gift. Their beginnings can be traced to the Victorian era when chocolates were turned from a predominantly liquid form to a solid and more widely available to the public — albeit they were still an item of luxury for the wealthy. However, during the Industrial Revolution chocolate became a more widely available commodity and with advancements in mass production boxes of chocolates were able to be enjoyed by a broader audience. The Victorians deployed all the available decorative and manufacturing technologies at hand, making the empty box a part of the gift and beautiful enough to be kept once their contents were consumed. They became relics of resisting death through beauty.\n\nRichard Cadbury designed the first heart-shaped Valentine’s chocolate box in 1861. These, often reusable, containers soon became a popular symbol of love and enduring romance.\n\nIn addition, wrapping or packaging is connected to our study of clothing. Fashion is packaging for the body. Fashion pieces are similar to candy, the initial rush of desire, pursuit, consumption followed by the lifelessness of the wrappers once discarded.\n\nThe indulgence of food is simultaneously at odds with the thinness required to participate in Fashion as well as ideals of womanhood. There is forbiddance, yet the marketing of chocolate and candy is simultaneously hyper feminine in its coding.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Even without knowing these are IP cameras you sense these images are not “made” in any...","k":"exhibition","s":"2026-07-31","e":"2026-09-06","st":"12:00","et":"18:00","u":"chisenhalegallery","c":"London","co":"","p":"https://www.instagram.com/p/Dbn_G7yDPPI/","x":"“Even without knowing these are IP cameras you sense these images are not “made” in any conventional sense, but tapped into. Modulated, not controlled. The conceptual apparatus matters, but it is not ultimately the point. Marsalis’s algorithm chooses which cameras to tap into and when, but what the cameras see is something unauthored, unauthorable.” \n\n– Phil Tarrant, ‘Jasper Marsalis “Still Life” Chisenhale Gallery / London’, Flash Art, 31 July 2026. \n\nJasper Marsalis’ Chisenhale commission ‘Still Life’ is on view until 6 September, open 12–6pm Wednesday–Sunday.\n\n@thatboiakathatboi\n@flashartmagazine\n@philtarrantphiltarrant\n#JasperMarsalis\n#StillLife\n#chisenhalegallery","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":-4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Works by Jacob Littlejohn (@jacobalittlejohn), Felipe Suzuki (@felipesuzuki), Philip Va...","k":"exhibition","s":"2026-08-05","e":"2026-09-06","st":null,"et":null,"u":"karmakarma9","c":"São Paulo","co":"","p":"https://www.instagram.com/p/Dbqr216lEQB/","x":"Works by Jacob Littlejohn (@jacobalittlejohn), Felipe Suzuki (@felipesuzuki), Philip Van Aver, and Gertrude Abercrombie (@gertrudeabercrombie), in ‘Outside.’\n\nBringing together work by nearly seventy artists across generations, ‘Outside’, as curator Matthew Higgs (@matthewhiggs2015) writes, “is as much a physical place (i.e. the world around us) as it is a psychological state (as evidenced by the mercurial sensibilities of so-called “outsider” art). It is in this liminal space—between what can be measured or depicted and that which remains unknowable—that ‘Outside’ seeks to operate.”\n\n‘Outside’ is on view through September 6 at 70 Main Street, Thomaston, Maine.\n\n(1) ‘Outside,’ installation view, Karma, Thomaston, Maine, 2026 (2–3) Jacob Littlejohn, ‘Lenticular clouds,’ 2026. Oil on canvas, 12 × 18⅛ × 1⅜ in. (4–5) Felipe Suzuki, ‘Untitled,’ 2026. Oil on canvas mounted on wood, 17¾ × 25⅝ in. Courtesy Galeria Simões de Assis São Paulo (@simoesdeassis_) (6–7) Philip Van Aver, ‘Night Landscape with Fighting Men,’ 1985. Gouache and ink on paper, 4 × 5½ in. Courtesy Hoffman Donahue (@hoffman.donahue) (8–9) Gertrude Abercrombie, ‘Three Trees and Three Clouds,’ 1938. Oil on Masonite, 3⅝ × 6 in.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Bodies dissolving into lush foliage, animals hiding within the paint. Cecily Brown (auj...","k":"exhibition","s":"2026-08-06","e":"2026-09-06","st":null,"et":null,"u":"artdrunk","c":"London","co":"","p":"https://www.instagram.com/p/DbrZ-kZTpVY/","x":"Bodies dissolving into lush foliage, animals hiding within the paint. Cecily Brown (aujourdhuirose) has spent years returning to the natural world as a kind of formal playground—where figures slip in and out of view.\n\nFor her first UK institutional solo show since 2005, Brown built a group of paintings around Serpentine’s (@serpentineuk) own backyard: Kensington Gardens, a park she’s visited since her student days in London. One grouping in particular takes inspiration from a jigsaw puzzle: a fallen log bridging a river. Through her characteristic process of repetition, she reworks the image across scales, palettes, and formats until the log barely resembles its origins. That evolution is the magic of Cecily Brown unfolding before your eyes.\n\nElsewhere in the show, her drawings and monotypes lift characters from Beatrix Potter and old Ladybird books, using animals less as illustration and more as a way to slip around the human subject entirely.\n\nThanks to Lizzie Carey-Thomas (@lizziect5), Director of Programme & Chief Curator at Serpentine for the tour!\n\nCecily Brown: Picture Making\nUntil September 6\nSerpentine\nLondon 🇬🇧","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Gigas 2, 2026","k":"exhibition","s":"2026-08-03","e":"2026-09-09","st":null,"et":null,"u":"kyleconiglio_","c":"","co":"","p":"https://www.instagram.com/p/Dblg059ohSK/","x":"Gigas 2, 2026\n11” x 14” oil on linen mounted on board\n\nPart of my show with @capsuleshanghai open through September 9th.\n\n “This otherwise amiable portrait is disrupted by a second, diminutive figure standing alone in the lower right corner. Although existing on drastically different scales of reality, the two figures are joined by their gaze, leaving it ambiguous whether the lonesome human is confronting or dreaming of the celestial face above. Domination need not be overtly violent; it often disguises itself as something affable and quotidian.”\n\nSpecial thanks to my model @_patrick_michael 🙏\n#devour #gigas #giant #giants colossu","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"BREAKING NEWS: OPEN CALL is LIVE!","k":"exhibition","s":"2026-06-10","e":"2026-09-10","st":null,"et":null,"u":"business.inthefront","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DZaMesgglpF/","x":"BREAKING NEWS: OPEN CALL is LIVE! \nBusiness in the Front returns for a second time this year, and the open call is live right now! \n\nUNBELIEVABLE\n\nFor this edition, we are inviting artists, performers and designers to submit a work proposal under the theme of the UNBELIEVABLE. Both as an exclamation and as an adjective of disbelief, surprise, scepticism and flabbergast. \nWe are interested in the duality between a front of sensationalism, pretentiousness and acting larger than life, but with a back of scepticism, deception and being unreliable. We hope the topic tickles your curiosity as much as it tickles ours. If it does, we elaborate even further in the Google Form, where you can submit your work. You will find it in the link in bio. \n\nUNBELIEVABLE\n\nThis time, we are extending the open call time. \nAnd we are extending it a lot. Starting from today, June 10th and all the way until September 10th, you are able to submit your application through the link in bio. Visual artists, performers, filmmakers, musicians, writers, poets, puppets, clowns, con-men, gossipers, we would love to hear from you, if you’d like to participate in our exhibition. Follow the link in bio to our Google Form, where you can submit your work!\n\nOpen Call: from 10th of June to 10th of September\nDate of Exhibition: 10th of October\nLocation: Amsterdam\nContact: team.businessinthefront@gmail.com\nSubmission of Work: Google Form via link in bio \n\nUNBELIEVABLE \n\nWe are a small artist-and-student-led organisation, working on creating events in the grey area between exhibition and party. We wish to paint that grey area in bold yellow and welcome everyone into it. As a group we are extremely interested in dualities and extremes, the tight and the loose, contradictions and compliments, the inevitable and the avoidable, the exhibition and the party, facets and facades.\n\nUNBELIEVABLE\n\nWe look forward to hearing from you!","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-10","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“If the Moon Had a Mouth It Would Swallow All the Fishes”, Stephen Felton","k":"exhibition","s":"2026-08-05","e":"2026-09-11","st":null,"et":null,"u":"florit_florit_gallery","c":"New York","co":"","p":"https://www.instagram.com/p/Dbp22uMtozM/","x":"“If the Moon Had a Mouth It Would Swallow All the Fishes”, Stephen Felton\n\nEN\r\nStephen Felton (Buffalo, New York, 1975) lives and works in New York.\n\r\nHe studied at the Massachusetts College of Art and the San Francisco Art Institute. His work has been presented internationally in solo exhibitions at Centre d’art Pasquart, FRAC Champagne-Ardenne, MAMCO, Le Confort Moderne and Villa du Parc. He has also participated in group exhibitions at Centre Pompidou-Metz, Artists Space and Paula Cooper Gallery, as well as at Frieze New York. \r\n\r\nHis work is held in public collections including Centre Pompidou, MAMCO and FRAC Champagne-Ardenne, and a monograph on his work is currently in preparation.\r\n\r\nOn view until September 11\n\n—-\r\nES\n\r\nStephen Felton (Buffalo, Nueva York, 1975) vive y trabaja en Nueva York.\r\n\r\nEstudió en el Massachusetts College of Art y en el San Francisco Art Institute. Su trabajo se ha presentado internacionalmente en exposiciones individuales en Centre d’art Pasquart, FRAC Champagne-Ardenne, MAMCO, Le Confort Moderne y Villa du Parc. También ha participado en exposiciones colectivas en Centre Pompidou-Metz, Artists Space y Paula Cooper Gallery, así como en Frieze New York. \r\n\r\nSu obra forma parte de colecciones públicas como Centre Pompidou, MAMCO y FRAC Champagne-Ardenne, y actualmente se prepara una monografía sobre su trabajo.\r\n\r\nHasta el 11 de septiembre\r\n\r\n\r\nIMAGE\r\nSTEPHEN FELTON\r\nVacant Light, 2026\r\nAcrylic on canvas\r\n167.64 x 203.2 cm\r\n\r\n\r\n@stephenfeltonstudio \r\nPhoto: @juan.david.cortes_studio\r\n\r\n@artpalmacontemporani\r\nAmb el suport de @conselldemca","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"REPRISE is now open. Gallery hours 11-6 Wednesday to Saturday. Exhibition runs through ...","k":"exhibition","s":"2026-06-12","e":"2026-09-12","st":null,"et":null,"u":"georgerouy","c":"Basel","co":"","p":"https://www.instagram.com/p/DZetMl8jsa6/","x":"REPRISE is now open. Gallery hours 11-6 Wednesday to Saturday. Exhibition runs through 12 September @hannahbarrygallery","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-12","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"On view in Los Angeles—works by Paulina Peavy (@paulinapeavyofficial) in ‘Dictation fro...","k":"exhibition","s":"2026-07-28","e":"2026-09-12","st":null,"et":null,"u":"karmakarma9","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DbWIg8Niade/","x":"On view in Los Angeles—works by Paulina Peavy (@paulinapeavyofficial) in ‘Dictation from the Other Side.’\n\nIn 1932, Peavy attended a séance at the home of Ida L. Ewing in Santa Ana, California, where she claims to have met a spirit-slash-UFO from another world named Lacamo. From that moment forward, Peavy, a university-trained artist, painted with a brush that “moved on its own.” To channel Lacamo, she made elaborate masks that combine Surrealist touches with indigenous themes. Peavy’s artistic path centered around her convening with beings and forces beyond the visible plane to create her work.\n\nCurated by Laura Whitcomb, ‘Dictation from the Other Side’  is on view through September 12 at 7351 Santa Monica Boulevard.\n\nAbove: (1) Paulina Peavy, ‘Untitled,’ c. 1930-89. Oil and acrylic on canvas, 30⅛ × 24⅛ in. (2, 5) ‘Dictation from the Other Side,’ installation views, Karma, Los Angeles, 2026 (3) Peavy in her studio, 1939. Courtesy the Estate of Paulina Peavy and Andrew Edlin Gallery (4) ‘Untitled,’ c. 1938–89. Oil on board, 14 × 12 in. (6) Peavy holding masks. Photo: Sam Vandivert. Courtesy the Estate of Paulina Peavy and Andrew Edlin Gallery (7) ‘Golden Horn Spider,’ n.d. Mixed media, 7¼ × 8⅛ × ¾ in.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"On view in Los Angeles—ceramics by Beatrice Wood in ‘Dictation from the Other Side.’","k":"exhibition","s":"2026-08-04","e":"2026-09-12","st":null,"et":null,"u":"karmakarma9","c":"New York","co":"","p":"https://www.instagram.com/p/DboS05eD0Ux/","x":"On view in Los Angeles—ceramics by Beatrice Wood in ‘Dictation from the Other Side.’\n\nFollowing careers as an actress and artist in New York’s Dada circle, Wood left the city for California in 1928. There, she enrolled in an adult education ceramics course at Hollywood High School to make a teapot to match a set of luster-glazed plates she had purchased in Holland. Her growing interest in ceramics led her to study with renowned potters Otto and Gertrud Natzler. In 1948, the artist settled in Ojai, where she established her studio and developed the iridescent luster glazes for which she is best known.\n\nWood later reflected, “I never meant to become a potter. It happened very accidentally… I could sell pottery because when I ran away from home I was without any money. And so I became a potter.”\n\nCurated by Laura Whitcomb, ‘Dictation from the Other Side’ is on view through September 12 at 7351 Santa Monica Boulevard.\n\nAbove: (1) ‘Dictation from the Other Side,’ installation view, Karma, Los Angeles, 2026 (2–5) Beatrice Wood, n.d. Earthenware with luster glaze: ‘Vessel with Faces’; ‘Squeeze Pot’; ‘Luster Chalice’; ‘Squeeze Pot’ (6) ‘Bright Gold Lustre Footed Bowl,’ c. 1990. Ceramic, 4 × 3¾ × 3¾ in. All works courtesy the Beatrice Wood Center for the Arts (@beatricewoodcenter) / Happy Valley Foundation (7) Beatrice Wood in her studio, 1968. Private Collection","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"At @karmakarma9 in Los Angeles, \"Dictation from the Other Side\" brings together artists...","k":"exhibition","s":"2026-08-06","e":"2026-09-12","st":null,"et":null,"u":"artsy","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DbtQCCDE1vx/","x":"At @karmakarma9 in Los Angeles, \"Dictation from the Other Side\" brings together artists across generations who worked in and extended the Surrealist tradition. Curated by Laura Whitcomb, the group exhibition explores authorship as shared, displaced, or received from beyond, with work from Gertrude Abercrombie, William S. Burroughs, Betye Saar, Harry Smith, and Unica Zürn, among others. On view through September 12. Discover the show on Artsy through our bio link.\n•⁠\n#LouiseJanin, Cosmogramme 1 Hands and Face, ca. 1953-70\n#GertrudeAbercrombie, Little Silo, 1953\n#LouiseJanin, Cosmogramme 2, ca. 1953-70","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Urs Frei. A–Z","k":"opening","s":"2026-04-25","e":"2026-09-13","st":"18:30","et":null,"u":"kunstmuseumsg","c":"Zurich","co":"","p":"https://www.instagram.com/p/DWs5B87jCEJ/","x":"Urs Frei. A–Z\n25. April 2026 bis 13. September 2026, Kunstmuseum\n\n👉Vernissage: 24. April 2026, 18:30 Uhr\n\nDas Kunstmuseum St.Gallen präsentiert eine umfassende Retrospektive des Schweizer Künstlers Urs Frei (1958–2023), der in den 1990er-Jahren internationale Erfolge feierte. Seine radikalen Werke aus alltäglichen Bau- und Verpackungsmaterialien wie Holz, Metall, Karton und Kunststoff bewegen sich zwischen Malerei, Skulptur und Objekt. Das Œuvre von Urs Frei steht in einer Entwicklungslinie von Künstler*innen, die mit armen, provisorischen Materialien arbeiten – einer Haltung, die heute bei vielen jungen internationalen Positionen ein bemerkenswertes Revival erlebt. 📦\n\n//\n\nUrs Frei. A–Z\n25 April 2026 to 13 September 2026, Kunstmuseum St.Gallen\n\n👉Exhibition Opening: April 24, 2026, 6.30pm\n\nThe Kunstmuseum St.Gallen presents a major retrospective of the Swiss artist Urs Frei (1958–2023), who found international success in the 1990s. His radical works, made from everyday building and packaging materials such as wood, metal, cardboard, and plastic, move between painting, sculpture, and object. Urs Frei’s oeuvre stands in a lineage of artists working with humble, provisional materials— an approach that today is experiencing a notable revival among many young artists internationally. 📦\n\n#kunstmuseumsg #kunstmuseumstgallen #ursfrei #vernissage\n\n📸\nUrs Frei, Ohne Titel, 1990, Lackfarbe auf Stoff, Füllstoff, Schnur, 78 x 86 x 23 cm, Sammlung Luigi Archetti, Foto: Luigi Archetti","r":false,"b":null,"af":false,"so":false,"pd":"2026-04-04","ld":21,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"“SUPERFLEX: Rainbows, Sponges, Flies, and Spoons” is on view at the MAK Center at the S...","k":"exhibition","s":"2026-06-12","e":"2026-09-13","st":null,"et":null,"u":"makcenter","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DaQZW-Okiya/","x":"“SUPERFLEX: Rainbows, Sponges, Flies, and Spoons” is on view at the MAK Center at the Schindler House through September 13, 2026.\n\nDesigned by Austrian-American architect R.M. Schindler in 1922 as an experiment in communal living, the Schindler House reimagined domestic life by balancing shared spaces with independent studios for each resident. Playing off this history, the exhibition unfolds through distinct bodies of work, each occupying its own space, completely separate yet strangely connected.\n\nThroughout the house, domestic tableaux reinhabit Schindler's interiors, creating the uncanny impression of a home still in use. Within these lived settings, SUPERFLEX's subtle manipulations of familiar objects produce moments of humor and estrangement while exploring questions of infrastructure, ecological interdependence, and collective perception.\n\nFor the exhibition, UniFor contributes a selection of pieces, including Aldo Rossi’s iconic Museo chair, tables from the PRINCIPLES collection by OMA, and an Andromeda small table by LSM. Integrated throughout the interiors in close relation to SUPERFLEX’s works, these elements act as supports, spatial devices and points of connection. In dialogue with both the artworks and the architecture of the Schindler House, they create a subtle continuity between furniture, domestic space and exhibition display.\n\nPlease visit the link in our bio to book your visit.\n\n---\nImages: Installation view of “SUPERFLEX: Rainbows, Sponges, Flies, and Spoons,” MAK Center for Art and Architecture at the Schindler House, Friday, June 12, 2026 – Sunday, September 13, 2026. Photography by Joshua Schaedel.\n\n“SUPERFLEX: Rainbows, Sponges, Flies, and Spoons” is presented by the MAK Center in partnership with 1301PE (@1301pe). Support for the exhibition generously provided by David Johnson and a grant from the Danish Arts Foundation (@statenskunstfond). Special thanks to Brian Butler from 1301PE, Kukje Gallery (@kukjegallery), and von Bartha (@vonbartha). Generous in-kind support provided by UniFor (@unifor_official).","r":false,"b":"reserve","af":true,"so":false,"pd":"2026-07-01","ld":-19,"dl":"2026-09-13","ds":"run closes","ap":false,"rel":false,"q":true},{"now":true,"t":"On view @dom_artprojects in Dubai through September 13, 2026","k":"exhibition","s":"2026-06-17","e":"2026-09-13","st":null,"et":null,"u":"capsuleshanghai","c":"Dubai","co":"","p":"https://www.instagram.com/p/DZrTGpzkryL/","x":"On view @dom_artprojects in Dubai through September 13, 2026\n.\nMevlana Lipp participates in ‘Time That Grows Slowly’, a group exhibition curated by Alexander Burenkov @sashaburenkov \n.\nThe exhibition is inspired by ideas attuned to vegetal temporalities of being in the world, reflecting on philosophical reflections of time as growth rather than movement, and features works by cross-regional artists—many of whom have never been shown in Dubai before. \n.\nGrouped around site-specific installations attentive to care and interspecies communication, the exhibition engages ecological, feminist, philosophical, and postcolonial concerns.\n.\nParticipating artists: Maha Alasaker (Kuwait / UAE), Srijon Chowdhury (Bangladesh / USA), Odonchimeg Davaadorj (Mongolia / France), Patricia Domínguez (Chile), Kwama Frigaux (Ghana / France), Mevlana Lipp (Germany), Sulafa Mohammed (UAE), Tabita Rezaire (France / French Guiana), Shaima Shamsi (Saudi Arabia / Bahrain / UAE), Farah Soltani (Iran / UAE), Antoine Renard (France), Nadia Waheed (Saudi Arabia / Pakistan / USA) \n.\nPhotos © Maria Lashanova & Dom Art Projects\n.\n(L): Mevlana Lipp, Float, 2026, acrylic on canvas, 45 x 33 cm\n(R): Mevlana Lipp, Dune, 2026, acrylic on canvas, 60 x 45 cm","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-17","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Vai, jūsuprāt, mākslas darbs spoguļo emocijas tā radīšanas brīdī?","k":"exhibition","s":"2026-07-02","e":"2026-09-13","st":null,"et":null,"u":"makslastelpa","c":"Riga","co":"","p":"https://www.instagram.com/p/Dbp5PQICVPZ/","x":"Vai, jūsuprāt, mākslas darbs spoguļo emocijas tā radīšanas brīdī?\n\nŠo jautājumu pie izstādes “KĀ TU ŠODIEN JŪTIES? Emociju pratība” soliņiem uzdevām izstādē pārstāvētajiem māksliniekiem.\n\nVideo sēriju sāk Anna Ceipe (@annaceipe), stāstot par savu darbu “Meža zemenes” un emocijām, kas pavadīja tā tapšanu.\n\n📍 Rīgas Laikmetīgās mākslas telpa\n🗓️ 2. jūlijs – 13. septembris\n\nIzstāde tapusi sadarbībā ar Arterritory (@arterritory_com), Veselīga Latvija (@veseligalatvija) un Ārstes Ilzes Aizsilnieces fondu (@aizsilnieces.fonds).\n\nKuratores: Daiga Rudzāte (@daigarudzate) un Una Meistere (@unameistere)\n\n_ENG_\n\nDo you think a work of art reflects the emotions experienced during its creation?\n\nWe asked this question to the artists featured in the exhibition “HOW ARE YOU TODAY? Emotional intelligence” at the exhibition's benches located throughout the city.\n\nThe series begins with Anna Ceipe (@annaceipe), who reflects on her work “Wild Strawberries” and the emotions that accompanied its creation.\n\n📍 Riga Contemporary Art Space\n🗓️ 2 July – 13 September\n\nThe exhibition was created in collaboration with Arterritory (@arterritory_com), Veselīga Latvija (@veseligalatvija), and the Dr Ilze Aizsilniece Foundation (@aizsilnieces.fonds).\n\nCurators: Daiga Rudzāte (@daigarudzate) and Una Meistere (@unameistere)","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":-34,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Kunsthalle Basel Short Cuts – just enough to keep you in the know.","k":"exhibition","s":"2026-07-03","e":"2026-09-13","st":null,"et":null,"u":"kunsthallebasel","c":"Basel","co":"","p":"https://www.instagram.com/p/DaVOUeViduQ/","x":"Kunsthalle Basel Short Cuts – just enough to keep you in the know.\n​\nJoin Desireé and Ananda from our Art Mediation team as they are set to take you on a storm chasing journey through Shuang Li’s (@shuangbot) “Alliance”.\n\nCome by and see for yourself. The show is on view until 13.09.2026! \n\nCredits: @studio_mati","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-03","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Ants crawl up and down the walls of Fondation Beyeler (@fondationbeyeler). A robotic la...","k":"exhibition","s":"2026-07-27","e":"2026-09-13","st":null,"et":null,"u":"artdrunk","c":"Basel","co":"","p":"https://www.instagram.com/p/DbUGJsaBaL8/","x":"Ants crawl up and down the walls of Fondation Beyeler (@fondationbeyeler). A robotic larva swerves and squirms. And an artificial lung pumps and breathes life into the exhibition space.\n\nFilms, images, sounds, objects, living forms and machines coexist, composing a transitory space where boundaries blur and dissolve. This is the work of Pierre Huyghe, a mastermind who pushes the limits of perception. Stepping inside this exhibition, you are no longer just a visitor. You become an actor within it.\n\nMouna Mekouar (@mounamekouar), Curator at Fondation Beyeler, gives you the full tour.\n\nPierre Huyghe\nUntil September 13\nFondation Beyeler\nBasel🇨🇭","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Joyce Joumaa @joycejoumaa","k":"exhibition","s":"2026-07-28","e":"2026-09-13","st":null,"et":null,"u":"kwinstitutefcontemporaryart","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbVHSkPDcbX/","x":"Joyce Joumaa @joycejoumaa \n'Works of Centuries', 2026 \nPaper, matchboxes, poplar wood, resin paint, plexiglass\nVariable dimensions \n\n'Works of Centuries' by Joyce Joumaa (b. 1998, Beirut) begins with an epistolary gesture: in 2015, the British art historian and critic John Berger composed a posthumous letter to Marxist revolutionary Rosa Luxemburg. Centering on Berger’s letter, Joumaa’s work contrasts the different ways of experiencing time: Berger writes toward an absent future, while Luxemburg, in her letters from prison from 1918, focuses on the immediacy of birdsong outside her cell, grounding her in the present.\n\nThe installation proposes an alternative archive: neither linear nor fixed, but dispersed across time and geography. The letter, held in a frame, remains as if still in transit. Beside it, an open wooden frame gathers original Soviet match-boxes into a compact grid, where images of songbirds interlace histories of production, exchange, and ideology. \n\nSee this work at KW as part of the Kyiv Biennial @kyivbiennial exhibition, 'A Bird That Cannot Land' – on view until 13.09.26.\n\nVisit our website for more information 🔗 link in bio.\n__________\n\n#kwinstituteforcontemporaryart #kyivbiennial #joycejoumaa \n\nImages: Joyce Joumaa, 'Works of Centuries', 2026. Courtesy the artist. Installation view of the exhibition 'Kyiv Biennial – A Bird That Cannot Land' at KW Institute for Contemporary Art, Berlin 2026. Photos: Frank Sperling.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Dana Kavelina @dana.kavelina","k":"exhibition","s":"2026-07-30","e":"2026-09-13","st":null,"et":null,"u":"kwinstitutefcontemporaryart","c":"Berlin","co":"","p":"https://www.instagram.com/p/Dbav0wigYBs/","x":"Dana Kavelina @dana.kavelina\n'Grey Earth', 2026\nVideo, stop-motion animation\n\nThis stop-motion animation film by Dana Kavelina (b. 1995, Melitopol) intertwines war, extraction, and ecological exhaustion through the parallel journeys of two figures: a soldier positioned on the front line and a cow taken from an industrial dairy farm. Following an explosion, both characters experience a moment of suspended freedom – the cow breaks free from the truck transporting her toward slaughter, while the wounded soldier is straying through a grey zone, abandoned by his unit. \n\nThrough its handmade animation, the film proposes restoring the organic world with artificial materials, recreating in miniature the work of nature and destruction, compressing cycles of life, war, and extraction.\n\nSee this work at KW as part of the Kyiv Biennial @kyivbiennial exhibition, 'A Bird That Cannot Land' – on view until 13.09.26.\n\nVisit our website for more information 🔗 link in bio.\n\n__________\n\n#kwinstituteforcontemporaryart #kyivbiennial #danakavelina \n\nImages: Dana Kavelina, 'Grey Earth', video still, 2026. Courtesy the artist. Installation view of the exhibition 'Kyiv Biennial – A Bird That Cannot Land' at KW Institute for Contemporary Art, Berlin 2026. Photos: Frank Sperling.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Get to know the artist Gulnur Mukazhanova @gulnurkia! 🪡","k":"exhibition","s":"2026-08-02","e":"2026-09-13","st":null,"et":null,"u":"kwinstitutefcontemporaryart","c":"Berlin","co":"","p":"https://www.instagram.com/p/Dbi7d16Icui/","x":"Get to know the artist Gulnur Mukazhanova @gulnurkia! 🪡\n\nThe site-specific installation “Material as Memory” by Gulnur Mukazhanova (b. 1984, Semipalatinsk), commissioned for the Kyiv Biennial @kyivbiennial at KW, unfolds as a charged intervention into architectural space. The work is lined with magenta-red velour fabric produced in the Soviet-era and now circulating in Uzbek and Kazakh textile markets. This material trajectory recalls longer histories of textile circulation across Central Asia, from Silk Road networks exchange to Soviet industrial standardization and contemporary post-Soviet trade routes across the Asia-Pacific. The fabric thus appears as an archive, holding within its fibers layered economies, ideologies, and migrations.\n\nSee this work at KW as part of the Kyiv Biennial exhibition, ‘A Bird That Cannot Land’, on view until 13.09.26.\n\n__________\n\n#kwinstituteforcontemporaryart #kyivbiennial #gulnurmukazhanova\n\nVideo: ‘Kyiv Biennial – A Bird That Cannot Land’, KW Institute for Contemporary Art, Berlin 2026. Filmed and edited by Henry Wein @henrykwein","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-02","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Get to know the artist Oleksiy Radynski @oleksiy.radynski!","k":"exhibition","s":"2026-08-04","e":"2026-09-13","st":null,"et":null,"u":"kwinstitutefcontemporaryart","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbnMsZRstEJ/","x":"Get to know the artist Oleksiy Radynski @oleksiy.radynski! \n\n“Where Russia Ends” by Oleksiy Radynski (b. 1984, Kyiv) is an essayistic road movie that investigates the often-overlooked histories of settler colonialism and environmental destruction in Russian-occupied Indigenous territories. The work emerges from the discovery of previously unknown archival film materials at the Science Film Studio in Kyiv in 2022, documenting a series of 1980s expeditions by Ukrainian filmmakers across Siberia and the Far North.\n\nSee this work at KW as part of the Kyiv Biennial @kyivbiennial exhibition, ‘A Bird That Cannot Land’, on view until 13.09.26.\n\n__________\n\n#kwinstituteforcontemporaryart #kyivbiennial #oleksiyradynski\n\nVideo: ‘Kyiv Biennial – A Bird That Cannot Land’, KW Institute for Contemporary Art, Berlin 2026. Filmed and edited by Henry Wein @henrykwein","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Neda Saeedi @neda_saeedi","k":"exhibition","s":"2026-08-05","e":"2026-09-13","st":null,"et":null,"u":"kwinstitutefcontemporaryart","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbpxGB7DWyM/","x":"Neda Saeedi @neda_saeedi \n'Abyssal Zone', 2026 \nGlass, metal rebars, 75 x 75 x 200 cm each\n\nIn 'Abyssal Zone' by Neda Saeedi (b. 1987, Tehran), glass volumes, suspended within an iron skeletal frame, hold fragmented bodily gestures: a hand, a bowed head, a partial embrace. The sculptural installation, commissioned for the Kyiv Biennial at KW, echoes the statue Mutter Heimat, a part of Berlin’s Soviet War Memorial at Treptower Park. Representing the homeland, sacrifice, loss, victory, and national defense, this allegorical monument presents the sorrowful figure of a mother hunched in grief. In the exhibition space, the monument dissolves into segments, as if memory itself could not sustain a whole image. The transparency of the glass refuses monumentality; it leaks, reflects, and fractures its surroundings.\n\nSee this work at KW as part of the Kyiv Biennial @kyivbiennial exhibition, 'A Bird That Cannot Land' – on view until 13.09.26.\n\nVisit our website for more information 🔗 link in bio.\n__________\n\n#kwinstituteforcontemporaryart #kyivbiennial #nedasaeedi \n\nImages: Neda Saeedi, 'Abyssal Zone', 2026. Courtesy the artist. Installation view of the exhibition 'Kyiv Biennial – A Bird That Cannot Land' at KW Institute for Contemporary Art, Berlin 2026. Photo: Frank Sperling.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Kunsthalle Basel Short Cuts – just enough to keep you in the know.","k":"exhibition","s":"2026-08-07","e":"2026-09-13","st":null,"et":null,"u":"kunsthallebasel","c":"Basel","co":"","p":"https://www.instagram.com/p/DbvPYUniLjH/","x":"Kunsthalle Basel Short Cuts – just enough to keep you in the know.\n​\nFollow Desireé and Ananda from our Art Mediation team into the calm before the storm as they get deeper into the meaning of Shuang Li’s (@shuangbot) “Alliance”.\n\nWe look forward to welcoming you. The show is on view until 13.09.2026! \n\nCredits: @studio__mati","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"🎟️ TICKET GIVEAWAY 🎟️⁠","k":"exhibition","s":"2026-08-11","e":"2026-09-13","st":null,"et":null,"u":"berlinartlink","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbcrbwjEwIY/","x":"🎟️ TICKET GIVEAWAY 🎟️⁠\n⁠\nPresented at KW, 'Kyiv Biennial – A Bird That Cannot Land' is an exhibition centered on how we experience belonging in times marked by war, uncertainty and estrangement. Featuring over 40 intergenerational and international artistic positions, post-Soviet Eastern Europe is linked with Central and Southwest Asia and the Mediterranean; the contemporary condition of exile being their unifying thread. ⁠\n⁠\nThe works featured, including those by artists Neda Saeedi, Flaka Haliti and Geta Brătescu, are shaped by lived experiences echoing rupture, migrant memories, their affective architectures, and the historical traces that persist both in bodies and in the spaces we inhabit.⁠\n⁠\nWe’re giving away 1 x 2 tickets to ‘A Bird That Cannot Land.’ To enter the giveaway, follow @berlinartlink and @kwinstitutefcontemporaryart on Instagram, like this post, and tag a friend in the comments. The winner will be drawn on Tuesday, August 11 and contacted via DM.⁠\n⁠\nTo read more about the exhibition, on view until September 13, go to the link in bio.⁠\n⁠\nImage 1: Neda Saeedi: ‘Abyssal Zone,’ 2026. Installation view of the exhibition ‘Kyiv Biennial – A Bird That Cannot Land’ at KW Institute for Contemporary Art, Berlin 2026 // Courtesy the artist, photo by Frank Sperling⁠\n⁠\nImage 2: Flaka Haliti: ‘I SHOUT, YOUR ECHO BOUNCE, WHAT AM I?,’ 2023. Installation view of the exhibition ‘Kyiv Biennial – A Bird That Cannot Land’ at KW Institute for Contemporary Art, Berlin 2026 // Courtesy Christine König Gallery, Vienna, Deborah Schamoni, Munich and the artist, photo by Frank Sperling⁠\n⁠\nImage 3: Geta Brătescu: ‘The Traveler,’ 1970. Installation view of the exhibition ‘Kyiv Biennial – A Bird That Cannot Land’ at KW Institute for Contemporary Art, Berlin 2026 // Courtesy Collection of the Museum of Modern Art in Warsaw, photo by Frank Sperling⁠\n⁠\n@kwinstitutefcontemporaryart @kyivbiennial @neda_saeedi @flakahaliti_ @getabratescu.apparitions @christinekoenigchapter3 @deborahschamoni @msnwarszawa⁠\n#ticketgiveaway #ticketraffle #biennial #intergenerational #kwinstituteforcontemporaryart","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-31","ld":11,"dl":"2026-09-13","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"CONCORD, NH – Kyoko Idetsu is included in Montages, with Peter Cordova, on view at Oute...","k":"exhibition","s":"2026-07-30","e":"2026-09-19","st":null,"et":null,"u":"hoffman.donahue","c":"Concord","co":"","p":"https://www.instagram.com/p/DbavstOlIpM/","x":"CONCORD, NH – Kyoko Idetsu is included in Montages, with Peter Cordova, on view at Outer Space Arts through September 19.\n\nDrawing from everyday observations, personal anecdotes, and the rhythms of domestic life, Idetsu transforms fleeting experiences into vivid, layered narratives. Expressive figures and overlapping perspectives unfold across her compositions, bringing together private memory and the broader social conditions that shape daily life.\n\nOuter Space\n35 Pleasant Street, 2nd Floor\nConcord, New Hampshire\n\nPhotography by Morgan Karanasios.\n\n@outerspacearts @kyokoidetsu #KyokoIdetsu #OuterSpaceArts","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Join us on 25 June from 7pm to celebrate the launch of ‘Lost Grace Discovered’ — a new ...","k":"exhibition","s":"2026-06-25","e":"2026-09-20","st":"19:00","et":null,"u":"formaartsmedia","c":"Sheffield","co":"","p":"https://www.instagram.com/p/DYmGwqWDElC/","x":"Join us on 25 June from 7pm to celebrate the launch of ‘Lost Grace Discovered’ — a new site-specific installation by Babeworld, developed during their year-long Unlimited Residency at FormaHQ ✨\n\nTransforming Forma’s Bermondsey Square gallery into an evocative 90s cinema, ‘Lost Grace Discovered’ explores cinematic and online spaces as sites of refuge, projection and collective solitude. \n\nThrough this immersive installation, Babeworld reflects on how experiences of loneliness, escapism and emotional withdrawal become entangled with neurodivergence and chronic illness, and how public spaces can enable moments of private retreat and collective intimacy.\n\n‘Lost Grace Discovered’ emerges from Babeworld’s upcoming moving image commission with Site Gallery, Sheffield. The exhibition and Babeworld’s residency with Forma have been realised through the generous support of our partners, Unlimited. \n\nWe’re really excited to celebrate this very special moment with Ash, Gabi and Ingrid, our friends, family and our neighbours here in Southwark — and warmly invite you to join us for the opening event on 25 June. RSVP 🔗 in bio\n\n📍 Forma, 15 Bermondsey Square, SE1 3FD\n✨ Launch event: 25 June 2026, from 7pm\n📅 Exhibition open 25 June – 20 September 2026, viewable 24/7\n\n📷 Babeworld, When The Sky Gets Bright (2026). Film still. © and courtesy of the artists. Commissioned by Site Gallery, Sheffield, with support from Forma.","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-05-21","ld":35,"dl":"2026-09-20","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Tone in Tongue, a multi-venue international exhibition, will be on view July 11–Sept 20...","k":"exhibition","s":"2026-07-11","e":"2026-09-20","st":null,"et":null,"u":"letterformarchive","c":"","co":"Japan","p":"https://www.instagram.com/p/DaDyW77kzwg/","x":"Tone in Tongue, a multi-venue international exhibition, will be on view July 11–Sept 20, 2026 at Letterform Archive!⁠\n⁠\n⁠\nCulture, like a shadow, shifts over time. The Chinese idiom “如影随形” rú yǐng suí xíng (“as the shadow follows the form”) evokes this fluid, inseparable relationship. Tone in Tongue adopts this metaphor to explore East Asian visual culture, tracing how shared histories and aesthetic identities continue to resonate in contemporary design. Through the lens of graphic design, typography, and independent publishing, the exhibition highlights the tension and harmony between shared language and individual expression across the region. ⁠\n⁠\n⁠\nTone in Tongue, the exhibition title and a play on words, draws from the Hanzi character 同 tóng (together or in common) and is composed of the radicals 凡 fán (all) and 口 kǒu (mouth or gateway), symbolizing a shared language.⁠\n⁠\n⁠\nPresented in four, interconnected parts, Tone in Tongue features the work of designers and publications, including:⁠\n⁠\n⁠\n▶ Commissioned posters by international studios⁠\n⁠\n▶ Contributions from emerging practitioners selected through an open call⁠\n⁠\n▶ A curated collection of independent publications⁠\n⁠\n▶ A design magazine tour that traces evolving perspectives on East Asian graphic design over the past two decades featuring Design360° (China), GRAPHIC (South Korea), and idea magazine (Japan)⁠\n⁠\n⁠\nTone in Tongue is curated and organized by Mary Y. Yang and Zhongkai Li⁠\n⁠\n⁠\n📷: Zengyi Zhao, Sight Photography⁠\n⁠\n⁠\n#LetterformArchive #RadicalCharacters #ToneInTongue","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-26","ld":15,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Featured on the wall of the Reading Room from now until September 20th are two out of t...","k":"reading","s":"2026-08-06","e":"2026-09-20","st":null,"et":null,"u":"letterformarchive","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbtmzdiII7_/","x":"Featured on the wall of the Reading Room from now until September 20th are two out of the four parts of Tone in Tongue, \"Common Tone\" & \"New Tone\".⁠\n⁠\n“Common Tone” includes commissioned posters by international studios, all using the risograph as a shared medium. The studios include Agata Yamaguchi (@agatayamaguchi_colle), collé inc., BOWYER (@bowyer_kr - Hwayoung Lee & Sangjoon Hwang), Can Yang (@solxus), Hyunsun You (@sun.you.kr), Jaemin Lee (@round.midnight), Kenichi Kuromaru (@kuromaru_kenichi), Kotaro Mitsuhashi (@kotaro_mitsuhashi), LAVA Amsterdam (@lava_amsterdam), LAVA Beijing (@lava_beijing), LOW sek-vai (@low.sekvai - Shuowei Lao), Meat Studio (@meat.studio), Ohara Daijiro (@daijiro_ohara), Ordinary People (@ordinarypeople.info), Related Department (@relateddept), Studio Pianpian He and Max Harvey (@infoandupdates), Sulki & Min (@sulki_and_min), Sun Yao 孙尧 (@sunyao.design), Synoptic Office (@synopticoffice - Caspar Lam & YuJune Park), Yuan Wang 王远 (@studioyuan_com), and Yuki Kameguchi & Ian Lynam (@ianlynam).⁠\n⁠\n“New Tone” gathers together contributions from emerging practitioners selected through an open call where the prompt was to respond to the exhibition’s central inquiry: What does it mean to share a “common language” in contemporary design? How might designers find resonance and solidarity as they engage with pressing cultural and social issues? The designers and artists in the show include Edinam Amewode, James H. Chae, Jingyu Feng, Hongshuang Fu 傅弘双, Hyning Gan, Xuanjie Huang, Arnon Karnkaeng, Wylie Kasai, Eugime Lee, Jane Lee, Yi Zhen Leong, Andy Li, Zhiyuan Li, Angela Lian, Will Liang, Sherry (Yuxuan) Lin, Irene Liu, Yi Mao, Thai Bao Nguyen, Jiaxi Pan, Desmond Pang, Tongji Philip Qian, Hongzhou Wan, Shuang Wu, Yi Wu, Priscilla Young, Jia Yu, Ivan Zhao, Xinran Zhou, and Nicole Zhu.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Artist Inaam Zafar’s artistic approach involves translating images of everyday objects ...","k":"exhibition","s":"2026-08-08","e":"2026-09-20","st":null,"et":null,"u":"sharjahart","c":"Lahore","co":"","p":"https://www.instagram.com/p/Dbxn8ySIHpl/","x":"Artist Inaam Zafar’s artistic approach involves translating images of everyday objects into abstract forms. \n\nIn ‘Mourners’ (2026), the human profile—bowed in faithful prostration or mourning—is suggested through visual stand-ins. \n\nThe artist derives the swan forms from planters near his home in Lahore. Their repeated presence suggests a gathering; the lowered heads evoking the moment of collective grief.\n\nFind this work in the exhibition ‘Laila Majid and Inaam Zafar: Body Quotidian,’ on view until 20 September 2026 at Al Mureijah Square. Free admission. Plan your visit through sharjahart.org\n\nImage: Inaam Zafar, Mourners, 2026. Commissioned by Sharjah Art Foundation. Photo: Shavanas Jamaluddin\n\nتنطوي المقاربة الفنية للفنان إنعام ظفر على تحويل صور الأشياء اليومية إلى محاكاة بصرية تؤسس لأشكال تجريدية.\n\nفي عمل «ندّابات» (2026)، تشير البدائل التصويرية إلى صورة جانبية لإنسان مطأطأ الرأس في تعبّد أو حداد. ويستمد الفنان أشكال البجع من أصص الزرع بالقرب من منزله في لاهور، في حين يوحي تعددها بالتآلف، وتستحضر رؤوسها المطأطئة لحظة حزن جماعية.\n\nشاهدوا هذا العمل ضمن معرض «ليلى ماجد وإنعام ظفر: تدابير الجسد»، المستمر حتى 20 سبتمبر 2026 في ساحة المريجة. الدخول مجاني. خططوا لزيارتكم عبر:  sharjahart.org\n\nالصورة: إنعام ظفر، ندّابات، 2026. بتكليف من مؤسسة الشارقة للفنون. تصوير: شانفاس جمال الدين","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"ON VIEW: Heinrich Dunst, Sophia Eisenhut, Simon Lehner","k":"exhibition","s":"2026-07-30","e":"2026-09-26","st":"12:00","et":"18:00","u":"kowberlin","c":"Berlin","co":"","p":"https://www.instagram.com/p/Dbao-9viSTH/","x":"ON VIEW: Heinrich Dunst, Sophia Eisenhut, Simon Lehner\nPARATEXT\nuntil 26.09.2026\n\nParatext refers to text types or text elements that accompany or supplement a text and influence its reception, whether through the author’s own actions or through external support for the author’s intentions.\n\nSwing by the gallery Wed–Sat, 12–6 pm, and immerse yourself in the artists' vastness.\n____\nImages:\nHeinrich Dunst, Sophia Eisenhut, Simon Lehner‚ 'PARATEXT' installation views at KOW, 2026, courtesy of the artists and KOW, Berlin. Photographer: Ladislav Zajac","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Swiss Institute’s 40th Anniversary","k":"exhibition","s":"2026-08-02","e":"2026-09-26","st":null,"et":null,"u":"balicehertling","c":"New York","co":"","p":"https://www.instagram.com/p/DbizYRsIv_-/","x":"Swiss Institute’s 40th Anniversary\nRegift at Luma Westbau until Sep 26, 2026\n\nLuma Westbau\nLöwenbräukunst\nLimmatstrasse 270\n8005 Zürich\n\nTo mark its 40th anniversary, Swiss Institute (SI) revisits Regift, the landmark 2009 exhibition originally organized at SI in New York by John Miller with Piper Marshall. Co-produced by SI and Luma Foundation, the anniversary edition is presented at Luma Westbau, bringing together original participants alongside an expanded selection of artists whose practices engage with questions of generosity, exchange, and value in contemporary contexts, with over 50 artists across two floors reflecting four decades of SI’s program and international networks.\n\nArtworks from the exhibition have been generously donated to SI and are available for purchase. Please see SI’s website for more information. Sales inquiries can be directed to regift@swissinstitute.net.\n\nArtwork: \nRafik Greiss, Talismans II, 2026\nGelatin silver print on found paper, wood, plexiglas\n68 x 52 x 7 cm (68 x 52 x 7 cm)\nCourtesy of the artist\n\n@rafikgreiss @swissinstitute @lumawestbau\n#balicehertling","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-02","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Rhea Dillon is currently included in the group exhibition Wo ich wohne at Haus am Walds...","k":"exhibition","s":"2026-07-13","e":"2026-09-27","st":null,"et":null,"u":"soft_opening","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DaujNaxjUgI/","x":"Rhea Dillon is currently included in the group exhibition Wo ich wohne at Haus am Waldsee, Berlin. Dillon’s All of our waste which we dumped on her and which she absorbed (2023) shows a merchandise cup filled with chewed candy, imprinted with the face of Hollywood child star Shirley Temple. Placed on the windowsill of the former daughter’s room and current office of the director, the work reflects on the internalisation of a white ideal of beauty, as described by Toni Morrison in her novel ‘The Bluest Eye’ (1970). The exhibition runs until 27 September.\n\nRhea Dillon\nAll of our waste which we dumped on her and which she absorbed., 2023\nMary Jane candy and glass\n6.8 × 9.5 × 9.5 cm","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-13","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"BOOK LAUNCH⁠","k":"reading","s":"2026-07-30","e":"2026-09-27","st":"18:00","et":"20:00","u":"distanzverlag","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbVVPIjCHUB/","x":"BOOK LAUNCH⁠\n⁠\nOn the occasion of the publication of “Übersehen – Ein Berliner Koffer”, the book on the photography of Friedrich “Fide” Struck will be presented by producer Lily von Wild, graphic designer Antonia Steitz, and the son of the photographer Thomas Struck. ⁠\n⁠\nTHOMAS STRUCK⁠\n“Übersehen – Ein Berliner Koffer. Fotografien von Fide Struck 1928 – 1941”⁠\n⁠\nJuly 30, 2026, 6 – 8 pm⁠\n⁠\nWilly-Brandt-Haus @freundeskreis_wbh⁠\nStresemannstr. 28⁠\n10963 Berlin⁠\n⁠\nFree entry⁠\nID required ⁠\n⁠\nDon’t miss the exhibition at Willy-Brandt-Haus, open until September 27!⁠\n⁠\nFor more information about the book, visit our website. ⁠\n⁠\n#distanzverlag #distanzpublishing @freundeskreis_wbh @lilyvwild @antoniahannahsteitz","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Sam Lipp is currently included in Horário Nobre at A MAIOR, a curatorial program set in...","k":"exhibition","s":"2026-07-30","e":"2026-09-27","st":null,"et":null,"u":"soft_opening","c":"London","co":"","p":"https://www.instagram.com/p/Dba2J8yjQBV/","x":"Sam Lipp is currently included in Horário Nobre at A MAIOR, a curatorial program set in a home furnishings and clothing store in Viseu, Portugal. The exhibition continues until 27 September.\n\nSam Lipp\nCopyrights of Man, 2024\nDigital video\n3 minutes 44 seconds","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"#onview","k":"exhibition","s":"2026-08-03","e":"2026-09-27","st":null,"et":null,"u":"liarummagallery","c":"","co":"","p":"https://www.instagram.com/p/DblifKnoP43/","x":"#onview \n\n “Para algunas caídas no existe la gravedad” is the first exhibition in Chile dedicated to the collaborations between Argentine artist David Lamelas and American artist Hildegarde Duane, two central figures in conceptual art and video art.\n\nThe exhibition brings together audiovisual works produced between the 1970s and the 1990s, in which the artists themselves perform, parody, and satirize authoritarian figures and media personalities within television settings.\n\nRead through the lens of memory and human rights, these works—never before considered from this perspective—offer a reflection on what persists after the fall of power: images, narratives, and modes of representation once thought to have been overcome continue to re-emerge and circulate through the media.\nIn dialogue with post-dictatorship processes, the exhibition explores the tensions between democracy and the media construction of truth.\n\nTime (1970–) is a participatory work by David Lamelas in which one person per minute announces the time in a continuous chain of transmission. Presented in various cities around the world since its creation, the work activates a collective experience of time through public participation. In its first realization in Chile, the piece highlights time as a shared condition that connects us and structures our life in common.\n\nCurated by Paula Solimano\n \n📍Museo de la Memoria y los Derechos Humanos (MMDH) | Santiago, Chile\n🗓️Through 27 September 2026\n\n#liarumma #liarummagallery #davidlamelas","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Can you guess what these instruments sound like?","k":"exhibition","s":"2026-08-06","e":"2026-09-27","st":null,"et":null,"u":"metmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/DbtNfhzEZGx/","x":"Can you guess what these instruments sound like?\n \nHere’s a sneak peek at what you’ll discover:\n \n🎹 A circular design that give musicians superhuman reach and range\n🎺 When ergonomics meets sculpture\n🎶 An orchestra of gongs\n🧤 A wearable instrument that lets you control synthesizers with a wave of your hand\n🎼 A mouth fiddle that’s among the oldest surviving folk instruments still played today\n \nSwip
