on. Alongside the exhibition, we are organising a book presentation and additional public events. More details will follow soon.\n\nWe look forward to welcoming you back after the summer.\n\nSusanne Khalil Yusef (1984) is a Palestinian artist based in the Netherlands. She creates vibrant, multidisciplinary installations that combine mural painting, video, ceramics, and participatory practices. While her colorful and playful work appears lighthearted, it critically explores themes of homeland and displacement, identity, and the social and geographical dynamics of power. Her practice seeks to keep memory alive and resist erasure.\n\nDina Zbeidy is an anthropologist based in the Netherlands. Her research focuses on nationalism, social movements, and refugees in the Middle East. She has worked at various human rights organisations in Palestine and the Netherlands.\n\nDesign by @kochi_studio \n\n#SusanneKhalilYusef #soloexhibition #thehague","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":38,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"M+ at Night returns this September!","k":"other","s":"2026-09-04","e":"2026-12-31","st":"22:30","et":null,"u":"mplusmuseum","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbdAHHDmiJr/","x":"M+ at Night returns this September! \n\nSeptember edition features:\nLive music from Yack Studio’s (@yackstudiohk), Novel Fergus (@novelfergus), SoWhat (@sowhat_are), LeShing (@_shing23), DJ CHUNCHUN618 (@chunchun618), and Wong Hin Yan (@wong_hin_yan) x Nelson Fung (@smallslow_butsteady) alongside Music and Play with Loisey (@loisey__).\n\nExplore Hong Kong’s street food with writer Lui Ka Chun (@lui_ka_chun) in ‘What is the Future of Siu Mai?’, try Oh My Ink’s AI Tattoo Try-On Photobooth for a commitment-free tattoo preview and photo keepsake, and round off the night with our guided tours. Your ticket also includes gallery access before 22:30, including ‘Design Ah! Experience the Wonder of Everyday D onze nieuwe tentoonstelling 𝘊𝘳𝘦𝘢𝘵𝘪𝘰𝘯 𝘔𝘺𝘵𝘩𝘴 ...","k":"other","s":"2026-09-04","e":null,"st":null,"et":null,"u":"nestruimte","c":"The Hague","co":"","p":"https://www.instagram.com/p/Da2agiqilru/","x":"Save the date! Op vrijdag 4 september opent onze nieuwe tentoonstelling 𝘊𝘳𝘦𝘢𝘵𝘪𝘰𝘯 𝘔𝘺𝘵𝘩𝘴 𝘢𝘯𝘥 𝘖𝘵𝘩𝘦𝘳 𝘉𝘦𝘨𝘪𝘯𝘯𝘪𝘯𝘨𝘴.\n\nAls antwoord op de existentiële vragen ‘𝘞𝘪𝘦 𝘻𝘪𝘫𝘯 𝘸𝘦 𝘦𝘯 𝘸𝘢𝘢𝘳𝘰𝘮 𝘻𝘪𝘫𝘯 𝘸𝘦 𝘩𝘪𝘦𝘳?’ hebben culturen overal ter wereld hun eigen oorsprongsverhalen gecreëerd en gedeeld. Ze vertellen iets over collective identiteit, een moreel kompas of een referentiekader dat mensen verbind. Maar neutraal zijn ze nooit: ze kunnen machtsverhoudingen legitimeren, een status quo in stand houden en andere verhalen onderdrukken.\n\nIn deze groepstentoonstelling onderzoeken we daarom juist de niet-dominante scheppingsverhalen: verhalen die via orale cultuur werden overgedragen of juist speculatieve, fictieve alternatieven. Wat kunnen we van deze verhalen leren over onze sociale werkelijkheid en mogelijke toekomst?","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":50,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Hello hello dear friends! We’re thrilled to tell you that on September 4th, we’ll be br...","k":"exhibition","s":"2026-09-04","e":null,"st":null,"et":null,"u":"ivory.offiziell","c":"","co":"","p":"https://www.instagram.com/p/DblJ_WcMtjx/","x":"Hello hello dear friends! We’re thrilled to tell you that on September 4th, we’ll be bringing the sound of our TrainStage to the Annex floor at Open Ground. If you were at our festival, you know what that means. If you weren’t: come find out. <3\n\nAlongside crew members Scherwin Hosseini, Bim and Januar, representing the deeper and darker end of IVORYs musical spectrum, we invited our dear friend and amazing selector Coco Cobra to complete the lineup. Get ready for a night moving between heavy bass steppers and spiraling techno.\n\nWe cannot wait to see you all again there! 🩷🌀\n\nvisuals + sound: @matildnz","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":32,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Out everywhere September 4: LIGHTHOUSE, the latest installment in Blank Forms’ comprehe...","k":"exhibition","s":"2026-09-04","e":null,"st":null,"et":null,"u":"blankforms_","c":"Folkestone","co":"","p":"https://www.instagram.com/p/DblaOfXlepb/","x":"Out everywhere September 4: LIGHTHOUSE, the latest installment in Blank Forms’ comprehensive reissue of the discography of The Shadow Ring.\n\nPre-order at the link in bio for first dibs on this 2xLP.\n\nRecorded in 1997, on The Shadow Ring’s return from their final American tour, Lighthouse captures the group at their most stripped-down and visionary. Graham Lambkin’s fractured texts conjure Folkestone’s haunted coastline—Vikings, the Morgawr, a fading Britain, the pull of the sea—under the sway of Alternative TV’s Vibing Up the Senile Man (Part One), the mechanical vernaculars of Robert Ashley, and the deflated humor of Dad’s Army and It Ain’t Half Hot Mum.\n\nOpening the trio’s famed final phase (documented across three releases on Scott Foust’s Swill Radio), Lighthouse finds The Shadow Ring turning away from the glare of the stage and the restlessness of the road. Retreating into the domestic seclusion of Coombe House, they work with field recording and kitchen-table musique concrète, attending closely to the internal structure of each track. Scott Foust, Karla Borecky, and Adris Hoyos—newly installed at Coombe House—all make guest appearances; the latter lends her voice and drums to the D-side, while her newly minted relationship with Graham Lambkin and move to Folkestone haunt the record’s themes. In the glow of Pebble Mill at One, Lambkin’s language grows increasingly elliptical, mapping ancient hills and seascapes while gazing outward across the Channel.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":32,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Olete oodatud näitusele avamisele järgmisel kolmapäpäeval, 5. augustil kl 17 Raegalerii...","k":"exhibition","s":"2026-09-05","e":null,"st":"17:00","et":null,"u":"raegalerii","c":"Kuressaare","co":"","p":"https://www.instagram.com/p/DbVExuhiKiL/","x":"Olete oodatud näitusele avamisele järgmisel kolmapäpäeval, 5. augustil kl 17 Raegaleriisse! ☀️\n\n**Ei talu karmi päikese kapriisi / Can’t Do Hard Sun Whim**\n\n🗓 5.08–5.09.2026\n📍 Kuressaare Raegalerii\n🕔 Avamine 5. augustil kell 17.00\n\nKureerinud Anu Vahtra ja Lieven Lahaye.\n\n“Ei talu karmi päikese kapriisi” toob kokku kunstnikud ja disainerid, kelle looming käsitleb valgust ja kulumist nii materiaalsete protsesside kui ka kontseptuaalsete seisunditena. Näitus uurib, kuidas materjalid, kehad ja kujutised aja, kokkupuute ning keskkonna mõjul muutuvad.\n\nPealkiri pärineb Duncan Smithi esseest *Australis*, kus tema nime tähtedest moodustub anagramm *Can’t Do Hard Sun Whim*.\n\nOsalevad: Junny Chun Au Yeung, Sophie Durand, Sandra Ernits, Kasia Fudakowski, Elisabeth Klement, Sandra Kosorotova, Lieven Lahaye, Katja Mater, Laura Pappa, Hanna Samoson, Mall Tomberg ja Anu Vahtra.\n\nPildil: Mall Tomberg, *Päike*, vaibakavand, 1963–1964, Eesti Tarbekunsti- ja Disainimuuseum.\n\nNäituse avamine on osa Merepäevade programmist.\n\nToetajad: Eesti Kultuurkapital, Mondriaan Fonds\n—\n\n**ENG**\n\n**Can’t Do Hard Sun Whim**\n\n📍 Kuressaare Raegalerii\n🗓 August 5 – September 5, 2026\n🕔 Opening: August 5, 17:00\n\nCurated by Lieven Lahaye and Anu Vahtra.\n\n*Can’t Do Hard Sun Whim* brings together artists and designers whose work explores light and wear as material processes and conceptual conditions. The exhibition examines how materials, bodies and images are transformed through time, contact and environmental conditions.\n\nThe title is drawn from Duncan Smith’s essay *Australis*, in which his name becomes the anagram *Can’t Do Hard Sun Whim*.\n\nParticipating artists: Junny Chun Au Yeung, Sophie Durand, Sandra Ernits, Kasia Fudakowski, Elisabeth Klement, Sandra Kosorotova, Lieven Lahaye, Katja Mater, Laura Pappa, Hanna Samoson, Mall Tomberg and Anu Vahtra.\n\nOpening as part of the Kuressaare Maritime Days programme.\n\n Supported by Estonian Cultural Endowment, Mondriaan Fonds","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":39,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"September 6th, 2026 - Performance","k":"performance","s":"2026-09-06","e":null,"st":"17:00","et":null,"u":"mode.exchange","c":"Tokyo","co":"","p":"https://www.instagram.com/p/DbxgTjjP-Hr/","x":"September 6th, 2026 - Performance\n\n∈Y∋\n\n80年代よりオルタナティブ・ロック・バンド、BOREDOMSの中心人物として、実験的なパフォーマンスを世界的に展開し、アンダーグラウンド・シーンにとどまらない影響力を示してきた。万物のエネルギーの交流を示すように、音とビジュアルが共鳴しあうインスタレーションやパフォーマンス、共感覚的なイメージを表現した作品も多数手がけている。近年はDJとして活躍するほか、テクニカルな実験によりオーディオ・ビジュアル体験を拡張する協働プロジェクト FINALBY( )を立ち上げ、パフォーマンス活動も行う。\n\n=\n\nPerformance\n\nLord Spikeheart @lord_spikeheart_777 \n∈Y∋ @eye.boredoms \n\nDate\nSeptember 6th, 2026\n\nTime\nDoors 5:00 pm\nStart 6:00 pm\n\nVenue\nWALL&WALL @wallandwalltokyo\nTokyo\n\nTicket\n¥7,000\n\nLaser VJ\nMES @mesmesmes8\n\nCo-presented by\nBar Nightingale\n\nチケットはプロフィールのリンクより販売中。\nTickets are available via link in bio🔗\n\nHand lettering by Sakura Kondo @sakurakondo","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-08","ld":29,"dl":"2026-09-06","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Katherine Bernhardt: models, musicians, Morocco, magic, mauve, monsters and magenta is ...","k":"exhibition","s":"2026-09-06","e":null,"st":null,"et":null,"u":"davidzwirner","c":"","co":"Korea","p":"https://www.instagram.com/p/DbV2QmtDRzA/","x":"Katherine Bernhardt: models, musicians, Morocco, magic, mauve, monsters and magenta is on view at the @Seongnam_ArtsCenter in Korea through Sunday, September 6. Following presentations at Gangneung Art Museum Sorol and the @Seoul_Arts_Center, this major retrospective brings together more than 120 original works spanning the artist's career—from paintings made in 1997 to new works created especially for the exhibition.\n\nFeaturing vibrant paintings that transform familiar images—from Pink Panther, Garfield, and E.T. to Nike sneakers, hamburgers, and Coca-Cola—through bold color and energetic brushwork, the exhibition also includes a recreation of @kbernhardt2014’s studio, inviting visitors into the environment where her paintings come to life. Learn more and plan your visit via the link in bio.\n—\n1/2/3/4/6: Installation views, Katherine Bernhardt: models, musicians, Morocco, magic, mauve, monsters and magenta, Seongnam Cultural Foundation, Seongnam, Korea, 2026. Photos by Choi Jae Woo\n5: Photo by Soy Lee, Yun Gyu Ham","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":40,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"this past january i went back to puerto rico for the first time in 7 years without the ...","k":"exhibition","s":"2026-09-06","e":null,"st":null,"et":null,"u":"andinamarieosorio","c":"New York","co":"","p":"https://www.instagram.com/p/DX49DybEXh4/","x":"this past january i went back to puerto rico for the first time in 7 years without the company of my family shepherding me around the island. i think of this work less as my homecoming and more of an investigation around who has the right to return. i focused on landscapes because i felt an ongoing tension between myself, native islanders, and the neo-colonialists that now occupy many parts of this land. my family no longer lives in puerto rico because of land theft and issues with land transference. \n\nthis time showed me so much. the sea presented a friend. green palm trees danced in the courtyard on día del los reyes. entangled mangroves taught me about form. and my collaborator, the caribbean sun, showed up as my ancestors in disguise. most importantly, this time taught me that this land does not belong to me, i belong to this land. \n\nkept thinking about sankofa and its meaning: “go back and get it.” this is one of many more returns back home, and i am so happy I borrowed a little piece of puerto rico to share with harlem. \n\nfade is now open to the public and closes on september 6th.","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-03","ld":126,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"\"Mistranslation\"","k":"other","s":"2026-09-06","e":null,"st":null,"et":null,"u":"lowgroundpressure","c":"Venice","co":"","p":"https://www.instagram.com/p/DbnFZwjF7xp/","x":"\"Mistranslation\"\nArtist: Natalia Mejía Murillo @namejiam\nCurated by: Matheew Carrillo M. @mattmarentes\nIn collaboration with EXCLAMA Protectos @exclama_\n📍Panorama, Panorama Venezia, Campiello San Zulian 602, Venice, Italy 30121 @panoramavenezia\n18.06-06.09.2026\n\nRead the complete text on lowgroundpressure.blog web platform (🔗 in stories).\n\n📸 courtesy the artist and the gallery;\n\n#contemporaryart #artisttoday #lowgroundpressure #arttoday #artist","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":33,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"“She is a painter whose intensity is unrivaled.… She is always pushing herself to new t...","k":"exhibition","s":"2026-09-06","e":null,"st":null,"et":null,"u":"davidzwirner","c":"London","co":"","p":"https://www.instagram.com/p/DblVTMKnZa-/","x":"“She is a painter whose intensity is unrivaled.… She is always pushing herself to new territory and breaking boundaries.” —Ben Luke via @TheArtNewspaper.Official\n\nWishing a happy birthday to Marlene Dumas! Born in Cape Town, South Africa #onthisday, Dumas’s work probes the complexities of identity and representation. Last year, the @MuseeLouvre acquired Liaisons, making her the first living female artist represented in the museum's permanent collection. Comprising nine monumental paintings created for the Porte des Lions atrium, the installation reflects her ongoing exploration of the human face as a site of history, emotion, and shared humanity.\n\n+ Dumas’s work is currently on view in Project a Black Planet: The Art and Culture of Panafrica at the @BarbicanCentre in London through Sunday, September 6. Visit the link in bio to learn more and reserve tickets.\n—\n1: Installation view, Marlene Dumas: Liaisons, Musée du Louvre, Paris, ongoing. Photo by Nicolas Bousser\n3/4: Marlene Dumas, Blue Bataille, 2025 (detail); Vermillion Heat, 2025 (detail)\n5: Installation view, Project a Black Planet: The Art and Culture of Panafrica, The Barbican Centre, 2026. Photo by Thomas Adank\n\n#MarleneDumas #ArtistBirthday","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-03","ld":34,"dl":"2026-09-06","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Design meets contemporary art 🔎","k":"exhibition","s":"2026-09-08","e":"2026-09-13","st":"11:00","et":null,"u":"lafayetteanticipations","c":"Paris","co":"","p":"https://www.instagram.com/p/DbTBY02jYiE/","x":"Design meets contemporary art 🔎\n\nThis September, as part of @ParisDesignWeek 2026, discover ‘Life of Forms’, an exhibition presented by @LafayetteAnticipations, @artsalula, @designspacealula & AFALULA (@horizonalula) curated by @clement_delepine and @arnaud__morand.\n\nBringing together works from the Collection Lafayette Anticipations (The Moulin Family Endowement Fund) and new creations developed through AlUla’s Design Residency Programme, ‘Life of Forms’ explores the shared territories between contemporary art and design.\n\nMore than a dialogue between disciplines, the exhibition unfolds as a landscape of materials, gestures and narratives - a space where forms reveal new ways of inhabiting and imagining the world.\n\n📍 Lafayette Anticipations l 9 rue du Plâtre, Paris 4\n🆓 Free admission for all\n\n🗓️ 8-13 September\n🕚 Opening hours:\n• Tuesday to Saturday: 11am – 7pm\n• Sunday: 11am – 6pm\n\n💡Curatorial team : @clement_delepine ; @arnaud__morand assisted by @ali.alghazzawi, @studiomarant et @audreychazal.\n\n🖌️ Participating artists & designers: a_l_t_i_n__s_t_u_d_i_o ; @aseelaoa; @xavierantin ; @bahrainidanish ; @meriembennani ; Camille Blatrix ; Katinka Bock ; Etienne Bossut ; Ève Gabriel Chabanon (@macaronic_cheese) ; @gaellechoisne ; @raphael.emine ; Matthew Angelo Harrison ;  @paul.ledron ; @paul.marchesseau ; @ori_orisun\n ; @mathieu_mercier_studio ; Lydia Ourahmane @emogirl4 ; @studiorawmaterial ; @studiothusthat ; @markus_schinwald\n\n🖍️ Graphic design by @40mustaqel \n___________________⁣⁣\n#ParisDesignWeek #Design #ContemporaryArts\n\nQuand les formes deviennent des façons de penser 🔎\n\nEn septembre, à l’occasion de la @ParisDesignWeek 2026, découvrez ‘Vie des Formes’, une exposition présentée par @LafayetteAnticipations, @artsalula, @designspacealula & AFALULA (@horizonalula) sous le commissariat de @clement_delepine et d’@arnaud__morand.\n\nRéunissant des œuvres de la Collection Lafayette Anticipations (Fonds de dotation Famille Moulin) et de nouvelles créations développées dans le cadre du programme de résidence en design d’AlUla, ‘Vie des Formes’ explore les territoires communs entre art contemporain et design.\n\nPlus qu’un dialogue entre disciplines, l’exposit","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":43,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Based in London is British-Chinese artist Tim Zha, aka Organ Tapes. Shaped by a private...","k":"other","s":"2026-09-08","e":"2026-09-13","st":null,"et":null,"u":"unsafeandsounds","c":"London","co":"","p":"https://www.instagram.com/p/DbqTaELDZdQ/","x":"Based in London is British-Chinese artist Tim Zha, aka Organ Tapes. Shaped by a private narrative, his songs resemble blueprints of emotional states, bringing the artist and his emotions to the foreground. An influential artist’s artist, Zha has produced for Triad God, among others, and played a significant role in shaping the aesthetics of the post-internet underground. His eclectic, diary-like numbers combine bedroom pop, Chinese city folk, 1980s indie, slacker rock, and cloud rap. Running through them is Zha’s Auto-Tuned voice, which, rather than creating distance, produces a peculiar sense of intimacy.\n\n𓇢 ORGAN TAPES, 11. September, Vienna, AT\n\nTo find out more about the second wave of artists for this year's edition, read the @strumandiodine article via link in bio!\n\n𓇢\nUNSAFE+SOUNDS 2026\n04+08–13 September, Vienna / AT\n“The level sunlight still warms walls”\n\n𓇢  \nSingle Tickets & Festival Passes now available!","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-05","ld":34,"dl":"2026-09-13","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Whoah, what a great last few days we had! We will be having a SUMMERBREAK where we will...","k":"exhibition","s":"2026-09-09","e":null,"st":"14:00","et":null,"u":"nieuwevide","c":"Haarlem","co":"","p":"https://www.instagram.com/p/DbdVOTvjPJg/","x":"Whoah, what a great last few days we had! We will be having a SUMMERBREAK where we will be regrouping, organizing after summer events and resting our bodies in the meantime. \n\n✨The @artivistlibrary at Nieuwe Vide will still be open Tuesday to Thursday from 14:00 to 17:00 for you to work on your own projects, to read, to join the Taalcafé or the Community café. Check their instagram or nieuwevide.com/agenda for the programme. \n\n✨@jongfemcollectief will continue their Voku’s (people’s kitchen) and movienights at Nieuwe Vide. Check their instagram for their activities! \n\n✨We are BACK with a @tekenorleaveit Open Draw on the 9th of September (every other Wednesday) as well as Soephoek at 13:00 (every Wednesday from then on!) \n\n✨AND with a brand new exhibition on the 10th of October. \n\nSign up for our newsletter via the link in our bio and see you after the summer! ☀️\n\nNL: \nWhoah, wat een geweldige afgelopen dagen! We nemen een ZOMERPAUZE om op adem te komen, evenementen voor na de zomer te plannen en ons lichaam rust te gunnen.\n\n✨De @artivistlibrary in Nieuwe Vide blijft van dinsdag tot en met donderdag (14:00 – 17:00 uur) open. Je kunt er terecht om aan eigen projecten te werken, te lezen of aan te sluiten bij het Taalcafé of het Community-café. Bekijk hun Instagram of nieuwevide.com/agenda voor het programma.\n\n✨@jongfemcollectief gaat door met hun Voku’s (volkskeuken) en filmavonden bij Nieuwe Vide. Check hun Instagram voor de activiteiten!\n\n✨We zijn weer TERUG met een @tekenorleaveit Open Draw op 9 september (elke twee weken op woensdag) en met Soephoek om 13:00 uur (vanaf dan elke woensdag!).\n\n✨ÉN met een gloednieuwe expositie op 10 oktober. \n\nMeld je aan voor onze nieuwsbrief via de link in onze bio; tot na de zomer! ☀️","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-31","ld":40,"dl":"2026-09-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"We’re excited to announce “A Bug’s Life” by Arash Nassiri, the first institutional solo...","k":"exhibition","s":"2026-09-09","e":null,"st":null,"et":null,"u":"fluentumcollection","c":"Berlin","co":"","p":"https://www.instagram.com/p/Dbc1ZC1tiAJ/","x":"We’re excited to announce “A Bug’s Life” by Arash Nassiri, the first institutional solo exhibition by the Berlin-based artist in Germany.\n\nThe eponymous film at its center offers a surreal journey through an opulent Beverly Hills mansion, from the point of view of a wooden insect. As it moves through the palatial interior amid echoing conversations, Nassiri frames the home as a site of aspiration and erasure, where personal and architectural histories intersect.\n\n“A Bug’s Life” opens on September 9, on the occasion of Berlin Art Week. More to come soon!\n\n@arash.nassiri @raoulklooker @nikkkamikkka @berlinartweek","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":40,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"moniquemeloche is happy to announce the acquisition of Antonius-Tín Bui’s “and you, all...","k":"exhibition","s":"2026-09-09","e":"2027-03-07","st":null,"et":null,"u":"moniquemeloche","c":"Chicago","co":"","p":"https://www.instagram.com/p/Dbn1h0hicsy/","x":"moniquemeloche is happy to announce the acquisition of Antonius-Tín Bui’s “and you, all future tense, leak through” 2023 into Northwestern University’s Block Museum of Art collection! 💜 This is the first artwork of Bui’s in the Block’s collection. \n\nThis work will be featured in an upcoming exhibition, ‘The Block Collects’ September 9, 2026 — March 7, 2027. \n\n@buimonster \n@nublockmuseum","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":36,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"“Abandon the search for Truth; settle for a good fantasy.” - Fran Lebowitz⁠","k":"exhibition","s":"2026-09-10","e":null,"st":"18:00","et":"20:00","u":"luhringaugustine","c":"New York","co":"","p":"https://www.instagram.com/p/DbTISnXEq2L/","x":"“Abandon the search for Truth; settle for a good fantasy.” - Fran Lebowitz⁠\n⁠\nLuhring Augustine is delighted to announce an exhibition entitled “settle for a good fantasy,” showcasing the work of four photographers, Janice Guy, Joe Mama-Nitzberg, Shaun Pierson, and David Seidner. The exhibition will open at our Chelsea gallery on Thursday, September 10 from 6–8pm. ⁠\n⁠\nOther than Pierson, who was included in “Tiptoeing through the Kitchen: Recent Photography” (April 2024), this will be the first presentation of these artist’s works at Luhring Augustine. ⁠\n⁠\nSharing an approach to portraiture that rejects notions of idealization, these artists embrace strategies of patchworking in which the “puzzle pieces” will not, and should not, fit together seamlessly. Eschewing the classical approach of emphasizing a cohesive ideal, they each weave a picture of their subjects from disparate sources of information to create nuanced and multi-faceted impressions. For these artists, the imperfect and the unresolved are paramount: fracturing, then reintegration becomes a pathway towards image-building, slippages erode archetypal portrayals, and questions dominate over answers.⁠\n⁠\nLearn more at the link in our bio.⁠\n–⁠\n#settleforagoodfantasy @JaniceGuyNYC @Shaun_Pierson @JoeMamaNitzberg #DavidSeidner #LuhringAugustine⁠\n⁠\nPhoto: Shaun Pierson, “Untitled (Strawberry on Lace),” 2026, Archival pigment print.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":45,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Save the Date!","k":"opening","s":"2026-09-10","e":"2026-10-17","st":"18:00","et":"22:00","u":"capitainpetzel","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbLk0BvDMIX/","x":"Save the Date!\n\nCapitain Petzel is pleased to announce Austin Martin White's second solo exhibition with the gallery, coinciding with Berlin Art Week.\n\nAustin Martin White\n'T̶h̶e̶ ̶l̶i̶e̶,̶ ̶t̶h̶e̶ ̶l̶a̶r̶p̶ ̶a̶n̶d̶ the lusophile'\n10 September – 17 October 2026\nOpening reception: 10 September, 6–10 PM\n\nImage: © Austin Martin White\n\n#austinmartinwhite #capitainpetzel #berlinartweek #berlinart","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":48,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🗓️ SAVE THE DATE","k":"exhibition","s":"2026-09-10","e":null,"st":null,"et":null,"u":"travesiacuatro","c":"Madrid","co":"","p":"https://www.instagram.com/p/Dbdpw0fDDSV/","x":"🗓️ SAVE THE DATE \n\n❗️Travesía Cuatro tiene el placer de anunciar \"Bajo el Mango\", una exposición individual de Vivian Suter, organizada en colaboración con GAGA Ciudad de México (@la_houseofgaga). La muestra se inaugurará el 10 de septiembre en Travesía Cuatro Madrid, coincidiendo con Apertura Gallery Weekend (@arte_madrid).\n\n—\n\n❗️Travesía Cuatro is pleased to announce \"Bajo el Mango\", a Vivian Suter’s solo exhibition, organized in collaboration with GAGA Mexico City (@la_houseofgaga). The show will open on September 10 at Travesía Cuatro Madrid, as part of Apertura Gallery Weekend (@arte_madrid).\n\n📸 \n1) Vivian Suter, “Untitled”, n.d. Photograph by Flavio Karrer. \n2)Portrait of the artist. Photograph by Flavio Karrer.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":41,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Unbelievably excited to be in this magical show organized by @laurenwittels + @sashahel...","k":"exhibition","s":"2026-09-10","e":null,"st":null,"et":null,"u":"shaun_pierson","c":"New York","co":"","p":"https://www.instagram.com/p/DbBj1keRQbY/","x":"Unbelievably excited to be in this magical show organized by @laurenwittels + @sashahelinski \n\n“settle for a good fantasy” opens on September 10 and includes myself, Janice Guy, Joe Mama-Nitzberg, and David Seidner. \n\nMark your calendars now! \n\n“Untitled (Strawberry on Lace)”, 2026\n8x10 archival pigment print in 20x24 artist frame \nEdition of 3 + 2AP","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-20","ld":52,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"I had such a wonderful time in Mexico City showing the people I made a series of work a...","k":"exhibition","s":"2026-09-10","e":null,"st":null,"et":null,"u":"mgutierreznyc","c":"New York","co":"","p":"https://www.instagram.com/p/DbtBYzcnDQ9/","x":"I had such a wonderful time in Mexico City showing the people I made a series of work about some prints for them of the series and a couple pieces I made as gifts for them.  So much love came out of all that pain and struggle. There's really nothing more rewarding to me than when my work is part of this kind of solidarity.  So so grateful. \n\nI will be exhibiting this series at @textileartscenter opening September 10th, and explaining the work, the people in the work, the movement @fnls2006 in Mexico behind it,  and their living struggle.  I hope you can make it if you are in New York. \n\nThis work is made possible only through my collaboration with sociologist @jasminhristov and her years long working relationship with @fnls2006 and her willingness to allow me to participate in her dialogue with them and of course for the @fnls2006 themselves for placing their trust in me to make this work. \n\n#textileartscenter #textileart #politicalart #artopenings #brooklynart","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":35,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"\"Gene's Presents \"Truckload of Art\" at Forms\"","k":"exhibition","s":"2026-09-12","e":null,"st":null,"et":null,"u":"lowgroundpressure","c":"","co":"","p":"https://www.instagram.com/p/DbsTuVoF8FW/","x":"\"Gene's Presents \"Truckload of Art\" at Forms\"\nArtists: Joshua Abelow @joshuaabelow @freddybiz\nCurated by: Keith J. Varadi @genes_dispensary\n📍Gene's Dispensary at Forms, 11627 Klinger Street, Hamtramck, MI 48212 @genes_dispensary @forrrrrrrms\n11.07-12.09.2026\n\nRead the complete text on lowgroundpressure.blog web platform (🔗 in stories) and find the exhibition on the offseen map (@offseen_official).\n\n📸 Alivia Zivich @aliviaz, courtesy the artist and the gallery;\n\n#contemporaryart #artisttoday #lowgroundpressure #arttoday #artist","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":37,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"📷 Jesse Glazzard’s (@jesse_glazzard) new exhibition, The Sound of Dirt and Beauty, pres...","k":"fair","s":"2026-09-12","e":"2026-09-20","st":null,"et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/DbnDw7tIMzP/","x":"📷 Jesse Glazzard’s (@jesse_glazzard) new exhibition, The Sound of Dirt and Beauty, presented as part of GLUE 2026, reimagines the idea of family through photography, intimacy and the living archive. \n\nBringing together previously unseen archival photographs with newly commissioned portraits from London and Manchester, the exhibition reframes the family album as something lived rather than idealised. In doing so, Glazzard proposes an expanded notion of family grounded in care, pain, vulnerability and enduring everyday love, rooted in the experiences of working-class and low-income communities, while shaped on the fringes of queer culture. \n\nThe Sound of Dirt and Beauty also marks the launch of Glazzard's new photobook of the same name, published by Self Publish, Be Happy (@selfpublishbehappy) and MACK (@mack_publishing).\n\n📍 Open 12–20 September\n🎟️ Free entry 12 & 13 Sep, £5 from 14 Sep\n🔗 Find out more @icalondon\n\nGLUE is the ICA's annual book fair, returning this September with more than 90 publishers for a weekend celebrating independent and artist publishing. Discover the full programme at ica.art.\n\nImages: Jesse Glazzard, Sink, 2021. All images courtesy of the artist and Self Publish, Be Happy.\n\n#JesseGlazzard #TheSoundOfDirtAndBeauty #GLUE2026 #SelfPublishBeHappy #MACK #ICALondon #ContemporaryPhotography #Photography #Exhibition","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":39,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"📣📣 SAVE THE DATE 📣","k":"other","s":"2026-09-12","e":null,"st":null,"et":null,"u":"beachsessions_rockaway","c":"","co":"","p":"https://www.instagram.com/p/DZqHa4zuRUf/","x":"📣📣 SAVE THE DATE 📣\nBeach Sessions 2026\nwith a new work by Alexa West @alaxawast \n\nSaturday, September 12 2026\nOn the sand at Rockaway Beach\n\nDrawing on the charged minimalism of the monolith in 2001: A Space Odyssey, West’s new work heightens the beach’s voyeuristic conditions before resisting them, oscillating between exposure and concealment, intimacy and distance. At once feral and precise, her choreography builds and erodes in real time, proposing the body as both image and force within a landscape that behaves like time itself.\n\nDigital flyer design: @c_allumabbott","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-16","ld":88,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"On September 13th, JVP Houston and Houston DSA will host a reading group on Molly Craba...","k":"reading","s":"2026-09-13","e":null,"st":"15:00","et":"17:00","u":"jvphouston","c":"Houston","co":"","p":"https://www.instagram.com/p/DbT7KukPRb2/","x":"On September 13th, JVP Houston and Houston DSA will host a reading group on Molly Crabapple’s new book Here Where We Live Is Our Country, a popular history of the Jewish Bund, a secular, anti-Zionist labor movement in Eastern Europe at the turn of the 20th Century. Join us to share your thoughts on the work and discuss how Bundist analysis resonates with the contemporary Jewish left and what lessons this story offers to socialist, anti-imperialist struggles today.\n\nOur conversation will be graciously hosted by Basket Books + Art. If you’d like to purchase a copy of Here Where We Live Is Our Country, we suggest visiting Basket where you’ll receive a 10% discount on the book if you mention the JVP/DSA reading group.\n\nWHAT: Here Where We Live Is Our Country reading group discussion\nWHEN: Sunday September 13th, 3-5pm\nWHERE: Basket Books + Art, 115 Hyde Park Blvd\n\nPlease RSVP at bit.ly/jvphouston-readinggroup (select the month September from the dropdown menu). \n\nLooking forward to seeing you there for an insightful and generative discussion!","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-27","ld":48,"dl":"2026-09-13","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"OPENING TODAY: ANNA EHRENSTEIN & HIWA K at @kwinstitutefcontemporaryart KYIV BIENNIAL —...","k":"performance","s":"2026-09-13","e":null,"st":"19:00","et":null,"u":"kowberlin","c":"Berlin","co":"","p":"https://www.instagram.com/p/DZZ5E1Rl7-B/","x":"OPENING TODAY: ANNA EHRENSTEIN & HIWA K at @kwinstitutefcontemporaryart KYIV BIENNIAL — A Bird That Cannot Land\n11.06–13.09.2026\n\nThe Kyiv Biennial is a nomadic, international project that interweaves artistic, political, and social issues. A Bird That Cannot Land, its chapter at KW, takes shape as an extensive live and discursive program and a large-scale exhibition spanning the entire building, contributing to the biennial’s reflections through contemporary art, sound, and exchange. \n\nPUBLIC PROGRAMME:\n\nFRIDAY, JUN 12 at 7 PM\n@hiwakhiwa \nFROM HERE TO THERE: PRACTICE, DISTANCE AND SELF-POSITIONING\nTalk with Julia Ciamafiejeva and Farahnaz Sharifi\nModerated by Azar Mahmoudian \n\nThe panel brings together artists and authors to reflect on personal experiences of resettlement and the continuation of artistic practice across changing contexts. Rather than approaching the topic abstractly, the discussion centres on lived experience: how relocation is perceived, processed, and translated into creative work.\n\nSUNDAY, JUN 14 at 6 PM\n@annaehrenstein \nTHE CLOUD IS STILL BALKANIZED\nPerformance with Yara Mekawei\n\nDuring the Kyiv Biennial, Anna Ehrenstein will host a hybrid lecture-performance combining video, sound, and hypnotic techniques with Yara Mekawei. Building on The 'Balkanization of the Cloud' (2022), one of Ehrenstein’s earlier works, the performance reflects on how nation-state logics continue to reassert themselves within supposedly borderless digital infrastructures.\n\nKW Curatorial Team:\nSofie Krogh Christensen (Curator)\nLinda Franken (Assistant Curator)\nRadia Soukni (Exhibition Assistant)\n\nIf you are in Berlin, join us for the public events at KW Institute for Contemporary Art with Hiwa K and Anna Ehrenstein.\n____\nImages:\n1) Lesia Vasylchenko, Night Without Shadows and Light Without Rippling of Waves, 2025, courtesy the artist and KW Institute for Contemporary Art.\n\n2) Hiwa K, Julia Ciamafiejeva & Farahnaz Sharifi, courtesy the artists and KW Institute for Contemporary Art.\n\n3) Ehrenstein, Katragjini & Mizarahi, 2022, Nationstate As Instagram Influencer, video still, courtesy the artists and KW Institute for Contemporary Art, and KOW, Berlin.","r":false,"b":null,"af":true,"so":false,"pd":"2026-06-10","ld":95,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Bei unserer Ausstellungstour mit Kuratorin Sofie Krogh Christensen (@skchris_ ) und Ass...","k":"exhibition","s":"2026-09-13","e":null,"st":null,"et":null,"u":"berlinbiennale","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbD3kzliNja/","x":"Bei unserer Ausstellungstour mit Kuratorin Sofie Krogh Christensen (@skchris_ ) und Assistenzkuratorin Linda Franken (@lin__d.a) durch die KW Institute for Contemporary Art haben wir als Team der Berlin Biennale ganz besondere Einblicke in die künstlerischen Positionen der Kyiv Biennial gewonnen. Ein erstes Highlight ist die Arbeit 1991 (2026) von Aykan Safoğlu. Auf den folgenden Slides findet ihr einige unserer Lieblingswerke.\n\nAt the exhibition tour with curator Sofie Krogh Christensen and assistant curator Linda Franken, the Berlin Biennale team got insights into the artistic positions of the Kyiv Biennial at KW Institute for Contemporary Art. A first highlight is the work 1991 (2026) by Aykan Safoğlu. You can find some of our favourite works on the following slides.\n\nKyiv Biennial – A Bird That Cannot Land\n11.06.–13.09.26\n@kwinstitutefcontemporaryart @kyivbiennial \n\nBild / Image: Aykan Safoğlu, 1991, 2026. Courtesy der Künstler / the artist. Installationsansicht / Installation view, Kyiv Biennial – A Bird That Cannot Land, KW Institute for Contemporary Art, Berlin 2026. Foto / photo: Frank Sperling\n\nMona Hatoum, Misbah, 2006–07\n\nCredits: Courtesy Mona Hatoum Foundation. Installationsansicht / Installation view, Kyiv Biennial – A Bird That Cannot Land, KW Institute for Contemporary Art, Berlin 2026\n\nGulnur Mukazhanova, Material as Memory, 2026\n\nCredits: Courtesy die Künstlerin / the artist. Installationsansicht / Installation view, Kyiv Biennial – A Bird That Cannot Land, KW Institute for Contemporary Art, Berlin 2026. Foto / photo: Frank Sperling\n\nLesia Vasylchenko, Night Without Shadows and Light Without Rippling of Waves, 2025\n\nCredits: Courtesy die Künstlerin / the artist. Installationsansicht / Installation view, Kyiv Biennial – A Bird That Cannot Land, KW Institute for Contemporary Art, Berlin 2026. Foto / photo: Frank Sperling\n\nSaodat Ismailova, As We Fade, 2024\n\nCredits: Courtesy die Künstlerin / the artist. Installationsansicht / Installation view, Kyiv Biennial – A Bird That Cannot Land, KW Institute for Contemporary Art, Berlin 2026\n\nHito Steyerl & Philipp Goll, Trassniki, 2026\n\nCredits: Courtesy die Künstler*innen / the artists. Installationsansic","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":54,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Submissions for our 2027 exhibition season are open! 🖼️","k":"exhibition","s":"2026-09-13","e":null,"st":null,"et":null,"u":"lhucalubbock","c":"Lubbock","co":"","p":"https://www.instagram.com/p/DZC7zvOlskh/","x":"Submissions for our 2027 exhibition season are open! 🖼️\n\nPlease visit the link in our bio for submission details, full guidelines, and requirements. \n\nGet your proposal in by September 13, 2026! ✨","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-01","ld":104,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Here is a look at some inspiration from the Martin Parr archive for the MPF Members’ Ph...","k":"other","s":"2026-09-13","e":null,"st":null,"et":null,"u":"martinparrstudio","c":"Miami","co":"","p":"https://www.instagram.com/p/DbxeDCkjJPQ/","x":"Here is a look at some inspiration from the Martin Parr archive for the MPF Members’ Photo Competition 2026 📸 \n\nTHE BRIEF / Street Fashion 🕶️\nDEADLINE / 13 SEPT 2026 👀\n\nThese images were taken during an extraordinary burst of activity and travel (even for Martin), during the mid-to-late nineties, while he was developing some of his key works, including Common Sense and Small World.\n\nOur Members’ Photo Awards this year will be judged by @NiallMcDiarmid via a live zoom event on the evening of 25 SEPT. All members are welcome k":"performance","s":"2026-09-13","e":null,"st":null,"et":null,"u":"autoitalialondon","c":"London","co":"","p":"https://www.instagram.com/p/DbtEQs5DF04/","x":"Applications are now open for Art/Work Association (A/WA) 2027, Auto Italia’s annual programme supporting early-career creatives to develop and deliver public events.\n\nWhether your practice is rooted in visual art, performance, music, film, writing, design, socially engaged practice or spans multiple disciplines, we welcome applications from creatives interested in bringing people together through public programming.\n\nWe’re looking for proposals that:\n- encourage participation, discussion, shared learning or experimentation;\n- respond to contemporary social, political, cultural or artistic conversations;\n- are accessible, achievable and designed for a single public event; and\n- can be delivered in Auto Italia’s gallery space within a 2-hour timeframe.\n\nSelected applicants will receive:\n- a £300 fee per event to cover artist fees;\n- curatorial and practical support;\n- promotion through Auto Italia’s channels; and\n- the opportunity to deliver a public event as part of the 2027 programme.\n\nHow to apply: Complete the online application form via the link in our bio.\n\nApplications close at 11.59pm on Sunday 13 September 2026.\n\nImage 1: ‘From the Same Night - DIY Ephemera Toolkit’ with artist Reuben Brown, A/WA June 2026.\nImage 2: ‘how to cannibalise the dead’ with  Izdihar Afyouni, A/WA May 2026. Credit: ‘2024’, 240 x 140 cm, oil and blood on linen, 2024.\nImage 3: ‘The Feminist Texts We Can’t Read: How Non-Translation Silences East Asian Movements’ with Soo Hyun Lee and Riley Tu, A/WA August 2026. Credit: Riley Tu, ‘Quantised Bits of Light till It Added to a Whole’, 2024.\nImage 4: Global Talent Immigration Performance with Betül Aksu, A/WA May 2026.\nImage 5: ‘I hv done brain check they say not much’ with Carmen Hutchins, A/WA June 2026.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08- tev) | N.Y. Premiere\n\n🎥 MY WIFE CRIES (Angela Schanelec) | U.S. Premiere\n\n🎥 NOWHERE TO LAY MY EYES (Hong Sangsoo) | N.A. Premiere\n\n🎥 ONCE UPON A TIME IN HARLEM (William Greaves and David Greaves) | N.Y. Premiere\n\n🎥 POSSIBLE LOVE (Lee Chang-dong) | U.S. Premiere\n\n🎥 ROSE (Markus Schleinzer) | N.Y. Premiere\n\n🎥 TENDER LOVING CARE (Mike Leigh) | N.Y. Premiere\n\n🎥 THE UNKNOWN (Arthur Harari) | N.Y. Premiere\n\nSecure pre-sale access with Passes or by becoming an @FilmLinc Member at filmlinc.org/passes\n\nSingle 🎟️ on sale September 15 at noon ET.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":41,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"We are thrilled to announce our fall exhibition, “Zine* Together.” Please join us on Th...","k":"opening","s":"2026-09-17","e":null,"st":"17:00","et":"20:00","u":"asiaartarchiveinamerica","c":"New York","co":"","p":"https://www.instagram.com/p/DbYUeI2OSnP/","x":"We are thrilled to announce our fall exhibition, “Zine* Together.” Please join us on Thursday, September 17th from 5-8pm for the opening reception.\n\nZine* Together is the first exhibition of its kind to examine Asian American zines not only as objects, but as actions—creative, collective, and relational. Drawing from AAAinA’s Reading Room collection, this exhibition highlights collaboratively produced zines from 2010 to the present, alongside newly commissioned projects and prompts that trace zine-making as a mode of shared authorship and community building.\n\nZine* Together, itself a collaborative project, is organized by Claire Kim (@mediumrareclaire), Susanna Chang (@soup.sanna), Sarula Bao (@bao___haus), Michelle Yee (@michelleyeephd), Elizabeth Chung, Mary Y. Yang (@marukie) (@openrehearsal), Chen Luo (@chenluo_101), and Tasnima Tanzim (@an_amateurartist).\n\nFor more information and to RSVP, please follow the link in our bio.","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-29","ld":50,"dl":"2026-09-17","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"BOOK FAIR","k":"workshop","s":"2026-09-17","e":"2026-09-20","st":null,"et":null,"u":"rietveldacademie","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/Da3BQ34jAPp/","x":"BOOK FAIR\n\nThe different GRA publishing initiatives and hubs are coming together to join the first edition of 'Dear Books,', a new Amsterdam book fair taking place from 17 - 20 September 2026. \n\nAt the table you will find a selection of publications by PUB Sandberg, Rietveld Journal, Graphic Design department, Public and Project Rietveld and BB (Bookbinding Workshop).\n\nWe look forward to be part of this new BBBBBook community and hope to see you there!!!!!\n\n-- \n@bbbbgrabb \n@pub_sandberg \n@rietveld.journal\n@rietveldgraphicdesign","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":63,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"COMING TO FORMAHQ THIS SEPTEMBER!✨","k":"performance","s":"2026-09-17","e":"2026-09-19","st":null,"et":null,"u":"formaartsmedia","c":"London","co":"","p":"https://www.instagram.com/p/DbdskgLDFOp/","x":"COMING TO FORMAHQ THIS SEPTEMBER!✨\n\nThis September, FormaHQ hosts two presentations spanning moving image, performance, photography, film and sculpture…\n\nFirst up, we are pleased to announce: \n\n🥊 Bruno\n📅 17–19 September\n📍 FormaHQ\n\nJoin us for Bruno, a solo presentation by London-based artist James Jordan Johnson. \n\nMarking the culmination of Johnson’s year-long residency at FormaHQ, supported by New Contemporaries, the three-day presentation brings together new works and material explorations developed over the last 12 months. These include sculptural works that incorporate found objects and organic matter gathered on journeys through South London, which will be displayed alongside new photography and moving-image works.\n\nAcross Bruno, journeys, objects and images become ways of thinking through memorialisation and memory. Johnson continues his exploration of the metaphysics of witnessing, considering how slowness and opacity might produce alternative readings within Blackness and the everyday. \n\nThe title refers to the British boxer Frank Bruno, the colour brown and dusk as a visual register: a threshold at which forms become less fixed and other ways of seeing might emerge.\n\nMore from our September programme will be announced soon! \n\nImages\nJames Jordan Johnson, Crawl, 2025. Film Still. © and Courtesy the artist\n\nJames Jordan Johnson, Studio Portrait in FormaHQ. Photo: Rita Silva.","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-31","ld":48,"dl":"2026-09-19","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Meet Kyulim Kim (@qlim_), whose work and research asks how spaces that are experienced ...","k":"other","s":"2026-09-17","e":"2026-09-20","st":null,"et":null,"u":"unfair_amsterdam","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DazzqTLjNhs/","x":"Meet Kyulim Kim (@qlim_), whose work and research asks how spaces that are experienced and represented as fixed could be uncovered as fluid through the use of audio-visual technologies. ⁠\n⁠\nWithin her practice, there has been a continuous interest in the spatiality produced through the process of relocating places, focusing on investigating the movement of matter that resists transportation or retains an inseparable connection to places. Building on this, and in an attempt to capture the invisible, her more recent work has looked at the structures and processes through which images are made and lost.⁠\n⁠\nDon’t miss the opportunity to view this solo presentation at UNFAIR26!⁠\n⁠\n🗓️ 17 – 20 September⁠\n📍Gashouder Westergasfabriek (Klönneplein 1, 1014 DD Amsterdam)⁠\n🔗 More info: unfair.nl/artists/","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":64,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🎞️ We're excited to welcome Juliette Binoche for a Q&A on 18 September to celebrate the...","k":"performance","s":"2026-09-18","e":null,"st":"19:00","et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/DboDwHLlFKm/","x":"🎞️ We're excited to welcome Juliette Binoche for a Q&A on 18 September to celebrate the UK premiere of her directorial debut, In-I In Motion.\n\nFollowing her acclaimed collaboration with British choreographer Akram Khan on the performance 'In-I' –  staged over 100 times worldwide – Binoche turns the camera on their extraordinary creative journey. From first rehearsals to the final performance, this intimate documentary captures the trust, discipline and artistic risk behind a remarkable collaboration.\n\n🎟️ Limited spaces – book now at ica.art\n📍 Fri 18 Sep, 7pm\n\n#JulietteBinoche #UKPremiere #InIInMotion #Cinema #ICA","r":false,"b":"limited","af":true,"so":false,"pd":"2026-08-04","ld":45,"dl":"2026-08-04","ds":"capacity","ap":false,"rel":false,"q":false},{"now":false,"t":"Opening this September: Simone Fattal “Des villes au fond d’un lac” - Musée d’Art Moder...","k":"exhibition","s":"2026-09-18","e":"2027-01-24","st":null,"et":null,"u":"balicehertling","c":"Paris","co":"","p":"https://www.instagram.com/p/DanglF_iERb/","x":"Opening this September: Simone Fattal “Des villes au fond d’un lac” - Musée d’Art Moderne de la Ville de Paris.\n\nOpening on 18 September 2026, this major retrospective spans more than fifty years of Simone Fattal's artistic practice. Born in Syria and raised in Lebanon, Fattal studied in Paris before spending many years in exile in the United States. She now lives and works between Paris, Lebanon, and the United States.\n\nThe exhibition follows the evolution of her practice, from her early landscape paintings of the 1970s, through the decisive shift to sculpture after a ten-year hiatus from making art, to her collages, photographs, and works on paper, culminating in her return to painting in recent years.\n\nOn view 18 September 2026 – 24 January 2027. #SimoneFattal @museedartmodernedeparis","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-10","ld":70,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Follow Taryn Simon, who is now on Instagram at @tarynsimonprojects, and learn about her...","k":"exhibition","s":"2026-09-18","e":null,"st":null,"et":null,"u":"gagosian","c":"New York","co":"","p":"https://www.instagram.com/p/Dbvsmpaxc_p/","x":"Follow Taryn Simon, who is now on Instagram at @tarynsimonprojects, and learn about her upcoming exhibition “Father Country I Do Love You,” opening September 18 at the Guggenheim New York (@guggenheim).\n\nThe project brings together never-before-seen photographs, text, videos, and sculptures by the artist around a sweeping narrative that spirals through the entirety of Frank Lloyd Wright’s iconic rotunda. Visitors choose their own pathways through the whirlwind Simon has assembled.\n__________\n#TarynSimon #Gagosian\nTaryn Simon, “One little room on fire,” 2026 (details) © 2026 Taryn Simon","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":42,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"@kinomural announces its 2026 headliner: @extraweg!  He created the title sequence for ...","k":"screening","s":"2026-09-18","e":"2026-09-19","st":null,"et":null,"u":"contemporarylynx","c":"Wrocław","co":"","p":"https://www.instagram.com/p/DbqdPaRMMD9/","x":"@kinomural announces its 2026 headliner: @extraweg!  He created the title sequence for the acclaimed series ‘Severance’, while his surreal 3D animations have quietly taken over the internet, gallery spaces and our phone screens. His collaborations include The Beatles, Gorillaz and Valentino — and now Extraweg (Oliver Latta) is coming to Poland for this year’s Kinomural, taking place in Wrocław on 18–19 September. \nAt the festival, the artist will present ‘Human Patterns’ — a curated programme exploring his distinctive visual universe, where the human body becomes a site of experimentation, metaphor and endless repetition. Over two evenings, Extraweg will transform an entire wall in Nadodrze, presenting a different selection of works each night. \nWhile each work explores a different subject, Extraweg’s practice is united by a fascination with the patterns we create as individuals and as societies. Some are beautiful, others absurd or unsettling, but all invite us to reflect on how we live together. \n📍 Kinomural, Wrocław 📅 18–19 September\n\nPaid partnership.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":44,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"WILLIAM KENTRIDGE","k":"exhibition","s":"2026-09-18","e":null,"st":null,"et":null,"u":"liarummagallery","c":"Brussels","co":"","p":"https://www.instagram.com/p/DbgaXbfoUYS/","x":"WILLIAM KENTRIDGE\nI am not me, the horse is not mine\nOpening on 18 September 2026\nBozar | Brussels\n\nWilliam Kentridge will take over one of Bozar’s major exhibition spaces, create site-specific works, and curate a rich, multidisciplinary programme. This is by no means the first time we have welcomed Kentridge to Brussels. He has a long-standing connection with the city, where he premiered his first opera (Faustus in Africa! 1995), and where Bozar presented his first solo exhibition in Europe in 1998.\n\nWilliam Kentridge began his artistic career at the height of the political struggle against the apartheid regime in his native South Africa. His work bears witness to a profound commitment – at once social, political and poetic – that continues to shape his artistic practice to this day.\n\n📷 William Kentridge, Tightrope of Our Hope, 2023. Charcoal, coloured pencil, digital print, collage and Indian ink on paper. Courtesy Kentridge Studio © William Kentridge\n\n#liarumma #liarummagallery #WilliamKentridge \n @williamkentridgestudio @bozarbrussels","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":48,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"He acted as a middleman, witnessing events great and small, collecting evidence for som...","k":"exhibition","s":"2026-09-18","e":null,"st":null,"et":null,"u":"guggenheim","c":"New York","co":"","p":"https://www.instagram.com/p/DblUI64irAY/","x":"He acted as a middleman, witnessing events great and small, collecting evidence for someone else to slot into the bigger picture. Everything he touched ricocheted to the outer boundaries of nations and lives he’d never know.\n\n“Father Country I Do Love You” traces the life of an unnamed federal agent through 42 chapters. In this labyrinth of stories, Taryn Simon (@tarynsimonprojects) uncovers the ripple effects of her protagonist’s actions and inactions.\n\nStep into the whirlwind when “Taryn Simon | Father Country I Do Love You” opens on September 18.\n\nGet your tickets now.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-03","ld":46,"dl":"2026-09-18","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Opening September 19","k":"exhibition","s":"2026-09-19","e":null,"st":"16:00","et":"19:00","u":"cara_the_org","c":"New York","co":"","p":"https://www.instagram.com/p/DbVzn9BuBhR/","x":"Opening September 19\n𝘑𝘰𝘩𝘢𝘯𝘯𝘢 𝘏𝘦𝘥𝘷𝘢: 𝘎𝘳𝘢𝘷𝘪𝘵𝘺, 𝘔𝘺 / 𝘍𝘢𝘷𝘰𝘳𝘪𝘵𝘦 𝘌𝘯𝘦𝘮𝘺\n\n𝘎𝘳𝘢𝘷𝘪𝘵𝘺, 𝘔𝘺 / 𝘍𝘢𝘷𝘰𝘳𝘪𝘵𝘦 𝘌𝘯𝘦𝘮𝘺 is Johanna Hedva’s (@bighedva) first institutional exhibition in New York. Devoted to deviant forms of knowledge, Hedva’s practice moves between sculpture, installation, video, writing, and sound. \n\nTime functions as a primary material in the exhibition—from a mouthblown glass vessel that slowly drains black goo until it is empty, to a new 20-foot robotic sculpture that spins and tangles ribbon. Works take shape through duration: leaking, sagging, knotting, and giving way. Together they compose an erotics of gravity, asking what beauty becomes when decay is not resisted but allowed to run its course.\n\nSave the date for the opening celebration on Saturday, September 19 from 4–7pm! \n\n𝘎𝘳𝘢𝘷𝘪𝘵𝘺, 𝘔𝘺 / 𝘍𝘢𝘷𝘰𝘳𝘪𝘵𝘦 𝘌𝘯𝘦𝘮𝘺 is curated by Pablo José Ramírez (@pablojoseramirez).\n\n——\n\nGraphic: The Rodina (@therodina)","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":53,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Saturday, 19.09.2026","k":"exhibition","s":"2026-09-19","e":null,"st":"22:00","et":null,"u":"openground.club","c":"","co":"","p":"https://www.instagram.com/p/DbbLbdNFzDv/","x":"Saturday, 19.09.2026\nStart: 22:00\n\nFreifeld:\nTouching Bass at Open Ground\nErrol\nViola Klein\nShy One\nJosey Rebelle\n\nAnnex:\nSequence at Open Ground\nDanyon\nMexem (live)\nRosa\nKøkø\n\nAdmission 20 € / before 23:00 15 €\n\nOpen Ground\nAlte Freiheit 25\n42103 Wuppertal","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":51,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Catherine Nichols (@catherinenichols567) on curating, place and collective imagination.","k":"other","s":"2026-09-19","e":"2026-12-13","st":null,"et":null,"u":"arterritory_com","c":"Berlin","co":"","p":"https://www.instagram.com/p/DavPR00jPmj/","x":"Catherine Nichols (@catherinenichols567) on curating, place and collective imagination.\n\nAustralian-born and Berlin-based, Catherine Nichols is an arts and literary scholar, curator and writer working at the intersection of contemporary art, cultural history and interdisciplinary research.\n\nHer major projects include exhibitions at Hamburger Bahnhof – Nationalgalerie der Gegenwart, the long-term programme “Beuys 2021”, and “Manifesta 14” in Prishtina in 2022 – a biennial unfolding across 25 locations in the city that consolidated Nichols’s understanding of the curator not as a singular author, but as a “creative mediator”.\n\nShe is currently a curator at Hamburger Bahnhof (@hamburger_bahnhof) and is preparing the 18th Lyon Biennale of Contemporary Art, “Passer d’un rêve à l’autre / To Pass from One Dream to Another”, which will run from 19 September to 13 December 2026.\n\nNichols came to Riga during Riga Art Week 2026 (@rigaartweek) as one of the international guests of the VV Foundation Visitors Programme (@vvfoundationlv), which introduces invited art professionals to Latvia’s contemporary art scene through encounters with artists, museums, galleries and artist-run spaces.\n\n-\n\nTo read more, visit us here: arterritory.com","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-13","ld":68,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Really looking forward to this one: Steffani Jemison’s new exhibition Augur opens soon ...","k":"reading","s":"2026-09-20","e":null,"st":"18:00","et":null,"u":"hey.hans","c":"Münster","co":"","p":"https://www.instagram.com/p/DY2A0RYof-j/","x":"Really looking forward to this one: Steffani Jemison’s new exhibition Augur opens soon at @westfaelischerkunstverein. What I love about her work is how it moves between sound, movement, sculpture, drawing, and video, but still feels very grounded and present. The show is about ideas of escape, resistance, listening, and finding ways to move through difficult spaces…not in an abstract way, but in a very physical, human one.\n\nAt the center is this poetic idea of “reading” signs in the world around us, especially through birds, voices, and movement. There’s something quiet but powerful in the way Jemison turns those gestures into a whole exhibition that you can move through.\n\nSteffani Jemison: Augur\nWestfälischer Kunstverein, Münster\n27.6.–20.9.2026\nOpening: Fri, 26 June, 6 pm\n\nPress tour: Thu, 25 June, 11 am (or by appointment)\n\nPerformance Flight Theater: Sun, 6 September, tbd\nRothenburg 30, 48143 Münster, Germany\n\nCurator: @theresaroessler \nAssistant Curator: Vivien Kämpf\nProject Assistant: Ellen Feldmann\n\nChloé Magdelaine / @chloemgde \n\n#SteffaniJemison","r":false,"b":null,"af":true,"so":false,"pd":"2026-05-27","ld":116,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Dit najaar: 𝐒𝐢𝐠𝐦𝐚𝐫 𝐏𝐨𝐥𝐤𝐞 – 𝐇𝐞𝐭 𝐰𝐞𝐭𝐞𝐧 𝐯𝐚𝐧 𝐝𝐞 𝐤𝐥𝐞𝐮𝐫𝐞𝐧","k":"exhibition","s":"2026-09-20","e":null,"st":null,"et":null,"u":"de_pont_museum","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DYPCHMskwno/","x":"Dit najaar: 𝐒𝐢𝐠𝐦𝐚𝐫 𝐏𝐨𝐥𝐤𝐞 – 𝐇𝐞𝐭 𝐰𝐞𝐭𝐞𝐧 𝐯𝐚𝐧 𝐝𝐞 𝐤𝐥𝐞𝐮𝐫𝐞𝐧 \n\nVanaf 20 september 2026 presenteert De Pont Museum de eerste grote tentoonstelling in Nederland van Sigmar Polke sinds zijn retrospectief in het Stedelijk Museum in 1992.\n\nMet meer dan vijftig werken uit de jaren tachtig tot en met de late jaren 2000 staat Polkes experimentele omgang met kleur, pigment en onconventionele schildersmaterialen centraal. 🎨\n\nVan kleurproeven en lakschilderijen tot monumentale ensembles uit Nederlandse museale collecties: de tentoonstelling laat zien hoe Polke de schilderkunst steeds opnieuw bevroeg en uitvond.\n\nNoteer in je agenda!\n\n----\n\nThis autumn: 𝐒𝐢𝐠𝐦𝐚𝐫 𝐏𝐨𝐥𝐤𝐞 – 𝐓𝐡𝐞 𝐊𝐧𝐨𝐰𝐥𝐞𝐝𝐠𝐞 𝐨𝐟 𝐂𝐨𝐥𝐨𝐮𝐫𝐬\n\nFrom 20 September 2026, De Pont Museum presents the first major exhibition in the Netherlands devoted to Sigmar Polke since his retrospective at the Stedelijk Museum in 1992.\n\nBringing together more than fifty works from the 1980s through to the late 2000s, the exhibition focuses on Polke’s experimental approach to colour, pigment and unconventional painting materials. 🎨\n\nFrom colour experiments and lacquer paintings to monumental ensembles from Dutch museum collections, it reveals how Polke continually questioned and reinvented painting.\n\nA joint exhibition by De Pont Museum and Anna Polke Foundation @annapolkestiftung . Curators: Kathrin Barutzki (Anna Polke Foundation), Martijn van Nieuwenhuyzen and Maria Schnyder (De Pont Museum). This exhibition is part of the project Sigmar Polke: Athanor NOW @athanor_now, organized by the Anna Polke Foundation and financially supported by the Thomas and Doris Ammann Foundation, Zurich.\n\nImage 1: Sigmar Polke, Lapis Lazuli II (1994). Picture: David Huguenin. Collection Carré d’Art - Musée d’art contemporain, Nîmes. © The Estate of Sigmar Polke, Cologne / Pictoright Amsterdam 2026\n\nImage 2-4: Sigmar Polke, Hermes Trismegistos I-IV (1995). Pictures: Antoine van Kaam. Collection De Pont Museum, Tilburg NL. © The Estate of Sigmar Polke, Cologne / Pictoright Amsterdam 2026\n\n#SigmarPolke #DePontMuseum #HetWetenVanDeKleuren #AthanorNOW #ContemporaryArt #HedendaagseKunst #Kunst #Art #Paintings","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-12","ld":131,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"In her Bushwick studio, K8 Hardy invites us in to revisit decades of using herself as m...","k":"exhibition","s":"2026-09-20","e":"2027-05-02","st":null,"et":null,"u":"higherpicturesgeneration","c":"New York","co":"","p":"https://www.instagram.com/p/DbT8OtlhXlc/","x":"In her Bushwick studio, K8 Hardy invites us in to revisit decades of using herself as material. Long before Instagram and selfies were daily practice, Hardy was already experimenting with documenting her looks and different versions of herself. “I love to ruin something nice.” That instinct runs through everything Hardy makes—work shaped by DIY, underground culture, punk, and an anti-fashion philosophy.\n\nWatch the full video: Inside How K8 Hardy Fashions Herself: Watch how the artist contrives to “ruin” beautiful things. Link in our bio & on the MoMA website.\n\nK8 Hardy will also be featured in an upcoming exhibition at MoMA - Taking Back Our Space Photographic Perspectives on view from September 20, 2026 through May 2, 2027 \n\n& keep an eye out for her upcoming book with MACK @mack_publishing","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":55,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"✦ Save the Date ✦","k":"exhibition","s":"2026-09-22","e":null,"st":"18:00","et":"21:00","u":"movingimagenyc","c":"New York","co":"","p":"https://www.instagram.com/p/DbtCqvCxrQu/","x":"✦ Save the Date ✦ \n\nResponsive Signals 📍 New York City \n\nJoin Museum of the Moving Image and Art on Tezos during Armory Week for an evening of artist talks, demonstrations, and interactive installations exploring machine memory, gesture, obsolete code, and whales. \n\nFeaturing: \n\n• @jonaslund and @yoshisodeoka discussing Terms of Agreement 🐳, their commission currently on view on MoMI’s Schlosser Media Wall \n\n• @n1ckfg premiering a new interactive work created in Telidon/NAPLPS, an early vector-graphics format developed for networked communication \n\n• @the.poet.engineer presenting two interactive works exploring gesture, coding, and machine memory, followed by a conversation and demonstration of her practice \n\n🗓 September 22, 6–9 PM ET \n📍 Museum of the Moving Image, Astoria, New York \n\nResponsive Signals is the second of two events organized by @movingimagenyc and @TezosFoundation as part of their annual partnership. \n\nFree with RSVP. Link in bio.","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-08-06","ld":47,"dl":"2026-09-22","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Algorithmic instigator Rian Treanor opens the first night of @ctmfestival × ICA this Se...","k":"performance","s":"2026-09-24","e":null,"st":"19:00","et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/DbgU-IuliRm/","x":"Algorithmic instigator Rian Treanor opens the first night of @ctmfestival × ICA this September.\n\nIn partnership with Rotherham Sight & Sound, a local charity for blind and deaf people, Treanor will work with bespoke digital synthesisers designed over four years of collaboration, specifically for the visually impaired residents who had no previous musical experience. \n\nThe lineup also sees former Battles frontman Tyondai Braxton present a new body of work that’s years in the making.\n\n🗓️ Thu 24 Sep, 7pm\n🎫 Tickets via ica.art or dice.fm\n\nBerlin's @ctmfestival returns to the ICA with two nights of artists working across experimental composition, electronics, punk and performance. From intricate new works and A/V mutations to fractured club music, the programme maps some of the most adventurous approaches to contemporary sound.\n\n#CTM #ICA #LiveMusic #London #ExperimentalMusic","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-01","ld":54,"dl":"2026-09-24","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Opening September 24, 2026—“Arthur Jafa: I Am Tony”","k":"exhibition","s":"2026-09-24","e":null,"st":null,"et":null,"u":"newmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/DbTMADQmGhu/","x":"Opening September 24, 2026—“Arthur Jafa: I Am Tony”\n\nThe largest museum survey exhibition to date of the work of Arthur Jafa (@anamibia) will span two floors of the newly expanded New Museum to encompass the full breadth of the artist’s practice. Alongside the premiere of new work, \"I Am Tony\" will feature Jafa’s most celebrated films, including \"Love is the Message, The Message is Death\" (2016) and the Golden Lion-winning \"The White Album\" (2019), as well as recent paintings, large-scale video and film installations, and a range of sculptural and photographic objects.\n\nPreorder the catalog co-published by the New Museum and @phaidonpress now using the link in bio 🔗\n—\nArthur Jafa, Monster, 1988, printed 2017. Courtesy the artist and Gladstone","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":59,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Partnering with Rotherham Sight & Sound, a charity for blind and deaf people, algorithm...","k":"other","s":"2026-09-24","e":null,"st":null,"et":null,"u":"ctmfestival","c":"","co":"","p":"https://www.instagram.com/p/DbpjSQ7sM7f/","x":"Partnering with Rotherham Sight & Sound, a charity for blind and deaf people, algorithmic agitator Rian Treanor developed bespoke digital synthesisers over four years of collaboration, designing them specifically for the visually impaired residents with no previous musical experience. This collaborative framework subverts standard timing structures, reframing lack of cultural conditioning as purely instinctual noise, metallic raggas swivelling in volatile frictions. Traditional ideas of accessibility are dismantled as community-led experimentation rebuilds them into a vehicle of destabilizing futureshock.\n\nRian and Rotherham Sight & Sound join @tyondaibraxton on 24 September for the first of two @ctmfestival × @icalondon 2026 nights, pairing meticulous avant-garde worlds with hyper-regional sonic archaeology. Tickets and full event lineup via @ctmfestival biolink 👁️👂\n\nVisual: @vojdvojd \n\nKindly supported by @goetheinstitut_london.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-05","ld":50,"dl":"2026-09-24","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"🔊 The second CTM Festival × ICA 2026 night welcomes Alpha Maid (@alpha_maid).","k":"performance","s":"2026-09-25","e":null,"st":"19:30","et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/DbyUyfqIGgL/","x":"🔊 The second CTM Festival × ICA 2026 night welcomes Alpha Maid (@alpha_maid).\n\nSlicing between shifting indie-punk landscapes, dub currents rooted in her Jamaican heritage, hazy emo textures and the grit of experimental noise, Alpha Maid’s sound explores the spaces between the familiar and the unknown. Inspired by a growing fascination with particle physics, her work is informed by the vast, unseen realms of possibility – the worlds that exist beyond what we can currently perceive.\n\nJoining the lineup are Europa (@europa.in.flames) and Cyst (Iglooghost + Daisy*) (@cyst02).\n\n🎟 Tickets at ica.art or dice.fm\n📅 Fri 25 Sep, 7:30pm\n\nBerlin’s @ctmfestival returns to the ICA for two nights of boundary-pushing artists working across experimental composition, electronics, punk and performance. Expect intricate new works, audiovisual mutations and fractured club sounds from some of the most adventurous voices in contemporary music.\n\n#CTMFestival #CTM #ICALondon #AlphaMaid
