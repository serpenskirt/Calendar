me long/well enough, you probably know that for the past 1/4 of a century, I’ve equally haunted underground malls around the 🌐, that I’ve casually trotted global art fair booths. Perhaps dividing my time 50/50, although as an artist I have found inspiration within the former rather than the latter, privileging mundanely banal inspirations over pontifical art canons and the hammering rule of the art market. \n\nOver the past 15 years, today marks my 4th visit to Shenzhen, which is known to be the birthplace of 山寨, the Robin Hood-inspired grassroots culture of technological, industrial, branding hacking & reverse-engineered creative process known in the West as « Shanzhai ». That exact same cultural trademark I’ve been auramaxxing my art/design career with for the past 20 years 😉\n\nWithin the true spirit of a ‘Situationist Drift’, I might just have found my holy grail on the first day : One single booth reducing all that knowledge I’ve accumulated over the years into a tight, perfect 🖼️! \nI wished this image had been shot by Andreas Gurksy, but alas, no, it was shot by me, a trained-eye perhaps, but forever an amateur photographer…\n\nAnd when it comes to my own conceptual & sculptural art practice, running an independent gallery program drains all my attention to the point that I don’t really have the indulgent luxury of time for creation anymore… However, if I ever felt the urge to do so, this would be the one and only image on my moodboard right now. You can bet on that. 📌\n\n#itemidem \n#shenzhen #shanzhai #山寨 #huaqiangbei","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Textile Arts Center’s Work in Progress (TAC WIP) is a window into the studio practice o...","k":"talk","s":"2026-07-31","e":null,"st":null,"et":null,"u":"textileartscenter","c":"New York","co":"","p":"https://www.instagram.com/p/Da4ADlBlXeQ/","x":"Textile Arts Center’s Work in Progress (TAC WIP) is a window into the studio practice of contemporary artists and designers that engages the public in a dialogue with the field of textiles.⁠\n\nFor one month, WIP residents develop and showcase their work and practice in TAC’s Brooklyn studio, located in Gowanus, a neighborhood with a thriving arts community. \n\nThe residency is fully subsidized for selected participants. Residents receive a personal studio space and 24hr access to the Brooklyn studio, on top of a 30% adult classes discount, while being part of a community space inspired by a love and dedication for textiles. \n\nAs part of the program, WIP residents host an event, lecture, or workshop that relates to their practice for the community.\n\nPerks\n•Studio space, roughly 7 x 6 ft \n•Promotion through TAC social media\n•24hr access to the Brooklyn studio\n•30% off TAC Classes\n\nLearn more and apply with the link in bio🔗\n\nAll applications must be submitted digitally through Slideroom by July 31st, 2026\n\n1. Details of WIP alumni @elisevazelakis \n2. WIP Alumni @alejandraodzr \n3. WIP Alumni @jasminenarkita \n4. WIP Alumni @tidmarsh.studio \n\nphotos via Textile Art Centers Website","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-17","ld":14,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Join co-directors @jordanamedia & @_marshall.h_ this Friday evening for a screening of ...","k":"screening","s":"2026-07-31","e":null,"st":null,"et":null,"u":"fullbellyfilm","c":"","co":"","p":"https://www.instagram.com/p/DbYiL_igHOs/","x":"Join co-directors @jordanamedia & @_marshall.h_ this Friday evening for a screening of Barriga Llena, Corazón Contento (Full Belly, Happy Heart) in the Green-Wood Cemetery, as part of @rooftopfilms NY Non-Fiction program!\n\nGrateful to @fenixbygloriasheart for sharing their story and to @uniondocs for supporting this film!\n\nLink to 🎟️ in our Bio or at rooftopfilms.com","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":2,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Reception photos from the @boscenterforarts group show at Mills Gallery, curated by @me...","k":"exhibition","s":"2026-05-16","e":"2026-08-01","st":null,"et":null,"u":"markanthony.hm","c":"Boston","co":"","p":"https://www.instagram.com/p/DYaX8cogdc-/","x":"Reception photos from the @boscenterforarts group show at Mills Gallery, curated by @meclinaart . On view until August 1.\n\nPaz Server (v.25.12), 2025\nServilleta bordada, web server, amplifier, speaker, wire cable, USB Wi-Fi Adapter\n\nPaz Server is an intergenerational, autonomous network for the Hernandez-Paz family archive. A web server is stitched to a servilleta bordada made by Eugenia “Mama Genia” Paz to create a trans-local database between Boston, MA, and Colima, Mexico. Instead of relying on the “Big Tech cloud,” the archive is stored in a vernacular cloud, co-stewarded by the current sysadmin, Mark HM—Mama Genia’s great-grandchild. \n\nOral histories from women in the Hernandez-Paz family, who co-steward the network, play through a speaker stitched to the servilleta—broadcast directly from the server. The network, or kin LAN/dscape, questions what we share, how we are accessed, and what it means “to serve”—challenging its history of gendered, class-based labor through an autonomous circuit that spans generations and borders.\n\n📷 @kat_concep","r":true,"b":null,"af":false,"so":false,"pd":"2026-05-16","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"One of my favourite in our current show! @latitudegallery_newyork @fkialmostforgot","k":"talk","s":"2026-06-24","e":"2026-08-01","st":"12:00","et":"18:00","u":"cucumber_and_shrimp","c":"New York","co":"","p":"https://www.instagram.com/p/Da0zle2K7aU/","x":"One of my favourite in our current show! @latitudegallery_newyork @fkialmostforgot \n\nTianshu Zhang\nPrayer, 2026\nOil on panel\n60 x 48 in\n152.4 x 121.9 cm\n(TZ11)\n\n𝕋𝕙𝕖 𝕆𝕧𝕖𝕣𝕤𝕝𝕖𝕡𝕥 𝕄𝕒𝕪𝕗𝕝𝕪:\n\n🤓Curator: Shuang Cai (@fkialmostforgot )\n🕒 On view June 24 – August 1, 2026\n📍5 Lispenard St, New York, NY 10013\n⏳ Hours: Tue–Sat, 12–6pm\n\nFor general inquiries, please email info@latitudegallery.nyc or text us via dm/ WhatsApp +1 3125082615\n\n#tianshuzhang #newyorkgallery #latitudegallery","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":-21,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"On view at the gallery!","k":"exhibition","s":"2026-07-03","e":"2026-08-01","st":null,"et":null,"u":"kraupatuskanyzeidler","c":"Berlin","co":"","p":"https://www.instagram.com/p/Da2kk9sDBe9/","x":"On view at the gallery! \n\nInscape\nKraupa-Tuskany Zeidler, Berlin (DE) \n03.07.2026–01.08.2026\n\nALINE SCHWIBBE (b. 1988, lives and works in Berlin) draws from fragmented memories and elusive dreamscapes to evoke narratives that are cyclical, refusing chronological legibility and linear resolution. Schwibbe’s works are multi-layered: photographs or film stills are printed onto plush velvet, then worked over with oil pastel and spray lacquer, while the velvet’s nap is disrupted to reveal the fabric’s materiality. This layering strengthens the illusion of depth and suggests that parts have been concealed to remain inaccessible to the viewer, just as memory itself resists full retrieval, surfacing only in fragments. In Weathers (2025) Schwibbe layers drawings and lacquer applied through lace as a stencil to partially cover the underlying image of a window, keeping the viewer in the dark of the implied interior. Schwibbe’s works in the exhibition show spaces that are void of human subjects. The traces of their inhabitants, such as a flickering light in Brutal Darling (2025) or the empty bed and closed gate in The Chain Night (2024), remain static while the overlaid drawings, restless and almost violent, appear like spectres mediating between realms.\n\nAline Schwibbe\nThe Chain Night, 2024\nsublimation print, oil pastel, pastel, spray lacquer, plush velvet\n195 x 280 cm\n76 3/4 x 110 1/4 in\nunique\n \n#inscape #kraupatuskanyzeidler\n\nexhibition view, Inscape, Kraupa-Tuskany Zeidler, Berlin \nPhoto: Marjorie Brunet Plaza\n\n@lymphdrainage @erzu.lie @gala.lillian @antlakomsk @antonianannt @phinemitph @klaudiaschifferle @alineschwibbe\n\nOn view at the gallery! \n\nInscape\nKraupa-Tuskany Zeidler, Berlin (DE) \n03.07.2026–01.08.2026\n\nJOSEPHINE ROTHÄUSER’s (b. 2001, lives and works in Berlin) multi-media textile works o.T. (2025) and Die Hand (2026) emerge through the ongoing cycles of destruction and reconstruction that take place within a material search for satisfaction. Through willful interventions and constant repair, a body-adjacent practice emerges, inscribed with traces of process and references to spatial and temporal conditions. Drapings, gravity, and tension connect the works to","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":-13,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Jordan Halsall⁠","k":"talk","s":"2026-07-04","e":"2026-08-01","st":"15:00","et":null,"u":"gertrudecontemporary","c":"Melbourne","co":"","p":"https://www.instagram.com/p/Da1oAtinG5Z/","x":"Jordan Halsall⁠\nForce Feeder⁠\n⁠\n4 July – 1 August 2026⁠\nGertrude Glasshouse⁠\n44 Glasshouse Road, Collingwood⁠\nWurundjeri Country⁠\n⁠\nArtist talk: Jordan Halsall in conversation with Brigid Moriarty⁠\nSaturday 1 August, 3pm. ⁠\n⁠\nA force feeder is a mechanical device used in tablet compression machines, more commonly known as a pill press. Unlike gravity feeding, force feeding uses rotating paddles to ensure powder flows evenly and precisely into the machine’s compression zone.⁠\n⁠\nThe regulatory landscape governing manufacturing equipment bears a surreptitious shadow – a network of distributed, largely unseen DIY producers working with everyday materials and accessible, commodified technology to bypass the systems designed to suppress them. The popularisation of distributed manufacturing models has influenced virtually every aspect of the production sector, including contemporary artistic practice.⁠\n⁠\nForce Feeder is an installation of sculptures and paintings by Jordan Halsall, assembled into something like a clandestine laboratory. Made using utilitarian objects and methods of fabrication, outsourced production and traditional oil painting, the artworks respond to Halsall’s ongoing research into decentralised production paradigms and their at once nefarious and transformative potentialities.⁠\n⁠\n–⁠\n⁠\n@jordanhalsall is an artist based in Naarm Melbourne. His research is centred on dissonant ideologies, disruptive practices and technological change, journeying through optimisation, growth and notions of exit. Halsall’s artworks are shaped by an interest in bridging connections between the contemporary artist, prosumer and built environment.⁠\n⁠\nGertrude Glasshouse is generously supported by Michael Schwarz and David Clouston.⁠\n⁠\nJordan Halsall, installation views, Force Feeder, Gertrude Glasshouse, Naarm Melbourne, 2026, image courtesy and © the artist, photographs: Christian Capurro⁠\n⁠\n#GertrudeGlasshouse #GertrudeStudioArtist #JordanHalsall @brigie.moriarty⁠\n⁠","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":-12,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"There’re two weeks left to see 𝘙𝘢𝘳𝘢, a group exhibition curated by Blake Oetting, featu...","k":"exhibition","s":"2026-07-21","e":"2026-08-01","st":"11:00","et":"18:00","u":"dddd.pictures","c":"New York","co":"","p":"https://www.instagram.com/p/DbD2RFsjlzv/","x":"There’re two weeks left to see 𝘙𝘢𝘳𝘢, a group exhibition curated by Blake Oetting, featuring Sylvano Bussotti, Vijay Masharani, Benjamin Patterson, Lisa Alvarado, Alexa West, Alison Nguyen, Raffaela Naldi Rossano, Éliane Radigue, Hanne Darboven, Iris Touliatou, Noah Barker, and Steffani Jemison.\n\nThe exhibition will run through August 1st!\n\nD. D. D. D. is open Tuesday through Friday 11-6pm for the summer 🌞\n\nFor questions or inquiries DM or email us at contact@dddd.pictures","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"It’s a shoe, but it’s also a magazine clipping, a suspended light, and a maze of cardbo...","k":"exhibition","s":"2026-07-21","e":"2026-08-01","st":null,"et":null,"u":"flashartmagazine","c":"London","co":"","p":"https://www.instagram.com/p/DbDN1Y7iOc2/","x":"It’s a shoe, but it’s also a magazine clipping, a suspended light, and a maze of cardboard. Ian Waelder’s practice is a collection of objects much like the ones that would make up an archive in a museum. In tracking the origins and arrangements of his works, writer Sonja Teszler discovers how the artist’s familial diaspora, skateboarding, and Andy Kaufman have shaped his work. \n \nHit the link in the bio to read “Archives as Footnotes,” @ianwaelder by @tulipankocso from 355 Summer 2026. \n\nWaelder’s work is currently on view in the group exhibition “10161055,” at Ellen de Bruijne PROJECTS, Amsterdam through August 1, 2026. \n\nWaelder's solo show \"insert\" is on view at @stuartshavemodernart, London, through August 15, 2026.\n  \n#IanWaelder \n#SonjaTeszler \n#FlashArt355  \n#FlashArtMagazine","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"D. D. D. D. is pleased to share that 𝘙𝘢𝘳𝘢, our current group exhibition curated by Blak...","k":"exhibition","s":"2026-07-22","e":"2026-08-01","st":"11:00","et":"18:00","u":"dddd.pictures","c":"New York","co":"","p":"https://www.instagram.com/p/DbGXhk_EYev/","x":"D. D. D. D. is pleased to share that 𝘙𝘢𝘳𝘢, our current group exhibition curated by Blake Oetting, has been reviewed in @friezeofficial by Theadora Walsh. The exhibition is on view until August 1st at D. D. D. D. Link to the full article in our bio!\n\nTheadora Walsh is an art critic and poet living in New York. Her work has appeared in The Los Angeles Review of Books, ArtReview, BOMB Magazine, Artforum, The Brooklyn Rail, and elsewhere.\n\nD. D. D. D. is open Tuesday through Saturday 11-6pm as part of our summer hours. \n\nFor questions or inquiries DM or email us at contact@dddd.pictures\n\nFeatured:\n\nSlide 1\n𝙍𝙖𝙛𝙛𝙖𝙚𝙡𝙖 𝙉𝙖𝙡𝙙𝙞 𝙍𝙤𝙨𝙨𝙖𝙣𝙤 | 𝘚𝘤𝘰𝘳𝘦 𝘧𝘰𝘳 𝘛𝘦𝘯𝘵𝘢𝘤𝘶𝘭𝘢𝘳 𝘉𝘦𝘥 \"𝘙𝘦𝘴𝘵𝘢 𝘴𝘦 𝘪𝘰 𝘳𝘦𝘴𝘵𝘰 - 𝘗𝘢𝘳𝘵𝘰 𝘴𝘦 𝘵𝘶 𝘗𝘢𝘳𝘵𝘪\" (detail), 2025\nInk on paper, sea water, sand, plastic sheets, and aluminum frame\n29 x 25 cm\n\nSlide 3\n𝙑𝙞𝙟𝙖𝙮 𝙈𝙖𝙨𝙝𝙖𝙧𝙖𝙣𝙞 | 𝘋𝘦𝘭𝘪𝘳𝘪𝘶𝘮 𝘣𝘢𝘤𝘬𝘴𝘭𝘪𝘥𝘦, 2023\nGraphite, colored pencil, and pen on paper\n24.4 × 32.3 × 1.4 in\n\n@theadora.tm @pat_mustang","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Climate Migration and Sovereignty beyond the state","k":"exhibition","s":"2026-07-23","e":"2026-08-01","st":"18:30","et":null,"u":"realrvw","c":"New York","co":"","p":"https://www.instagram.com/p/Da0mp-AiIeT/","x":"Climate Migration and Sovereignty beyond the state\n\nThursday, July 23rd, at 6:30pm: Join @realreview at the @van_alen for a talk by Keller Easterling (Real Review #3 and #11) and moderated by @noah_gotlib (Real Review #17 and curator of ‘Crumbling Land’, on display at @citygroupnyc until August 1st). RSVP at link in bio or tally.so/r/lb1Meo\n\nFrom vast populations traversing continents to communities moving uphill, climate migration is an inflection point which will produce new forms of urbanity, political economy, and sovereignty. Join Keller and Noah to hear about how climate migration will transform property, sovereignty, and urbanization in North America and beyond. \n\nKeller Easterling is an architect, writer, and the Enid Storm Dwyer Professor of Architecture at Yale University. Her books include Medium Design: Knowing How To Work on the World (Verso, 2021), Extrastatecraft: The Power of Infrastructure Space (Verso, 2014), and Subtraction (Sternberg, 2014), which considers building removal or how to put the development machine into reverse.\n\nNoah Gotlib is a designer and researcher studying climate migration practices in the United States and Canada. An exhibition of his work on the topic, Crumbling Land, is on display at the Citygroup gallery in New York. Learn more about Crumbling Land in Real Review 17 at real-review.org\n\nVan Alen Institute\n303 Bond St, Brooklyn, NY 11231 USA","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-15","ld":8,"dl":"2026-08-01","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"ArtCrush Auction Picks: JAMIE TISCH","k":"other","s":"2026-07-31","e":"2026-08-01","st":"12:00","et":null,"u":"aspenartmuseum","c":"Aspen","co":"United States","p":"https://www.instagram.com/p/DbbjCF7Gk7l/","x":"ArtCrush Auction Picks: JAMIE TISCH \n\nFrom George Condo’s “psychological cubism” to Helen Marten’s J.D. Salinger-inspired horse, Jamie Tisch’s auction picks inspire a closer look. \n\nThe Live Auction will take place at this year’s ArtCrush Gala on July 31, 2026. Telephone and absentee bidding available. \n\n🔗 Tap the link in our bio to explore a curated selection of exceptional works by world-renowned artists, including painting, sculpture, works on paper, and a design section organized in collaboration with Aspen-based architect Sarah Broughton, FAIA and Design Miami. Bidding for the online auction is live now through August 1, at 12 PM MT.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Lifting the Veil,” an exhibition of works by James Turrell, closes this Saturday, Augu...","k":"exhibition","s":"2026-08-01","e":null,"st":null,"et":null,"u":"gagosian","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbZHuhykWRe/","x":"“Lifting the Veil,” an exhibition of works by James Turrell, closes this Saturday, August 1, at Gagosian, Hong Kong. The show surveys the artist’s practice of shaping light and perception with holograms, prints, and three “Glasswork” pieces, along with site plans, photographs, and models of Skyspaces and Turrell’s magnum opus, “Roden Crater.”\n\n“Lifting the Veil” functions as a survey not through chronology alone, but through states of perception—charting how light, space, and consciousness converge across different formats and decades. To learn more, follow the link in our bio.\n__________\n#JamesTurrell #Gagosian\n(1) James Turrell, “Patmos,” 2024; (3) James Turrell, “Roden Crater Site Plan,” 1983 (detail); (2,4) Installation views, “James Turrell: Lifting the Veil,” Gagosian, Hong Kong, May 28–August 1, 2026. Artwork © James Turrell; Photos: (1,2,4) Ringo Cheung; (3) Thomas Lannes (@lannes.thomas)","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":3,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Opening this Friday at Dia Beacon (@diaartfoundation), \"Richard Tuttle: Half-Light\" fea...","k":"exhibition","s":"2026-08-01","e":null,"st":"14:00","et":null,"u":"pacegallery","c":"Beacon","co":"United States","p":"https://www.instagram.com/p/DbYtv76mZ3V/","x":"Opening this Friday at Dia Beacon (@diaartfoundation), \"Richard Tuttle: Half-Light\" features two of Tuttle's materially light, conceptually rich series—Good Idea (2025) and 18 × 24 (2022–23), previously exhibited at #PaceNewYork.\n-\nOn Saturday, August 1, Dia curator and co–department head Matilde Guidelli-Guidi (@salina2203) and curatorial assistant Liv Cuniberti (@livcuniberti) will lead a tour of the exhibition from 1 to 2 PM.\n-\nRichard Tuttle: Half-Light\nopens July 31\nDia Beacon, New York\n-\n\"Half-Light\" runs concurrently with exhibitions of work by #AgnesMartin and #LeeUfan at Dia Beacon.\n-\nLearn more about Tuttle's idiosyncratic practice at the link in bio.\n-\nArtwork: Installation view: \"Richard Tuttle: 18 × 24,\" Pace Gallery, New York, 2023. © Richard Tuttle. Photo: Robyn Caspare.\n\n#RichardTuttle #ContemporaryArt","r":false,"b":null,"af":false,"so":false,"pd": stall Photos: Erin Bergmann.⁠\n⁠\nArtworks:⁠\nSarah Blaustein⁠\nGreen Opener, 2025⁠\nInk and acrylic on canvas⁠\n40 x 90 inches⁠\n⁠\nElizabeth Hazan⁠\nField #187, 2025⁠\nOil and pastel on canvas⁠\n24 x 20 inches⁠\n⁠\nCooper Cox ⁠\nBefore it Settles, 2026⁠\nOil on linen⁠\n30 x 40 inches⁠\n76 x 101 cm⁠\n⁠\n⁠\n⁠\n⁠\n⁠","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Aspen Art Fair is officially open! Come find us in Room 124 with a group presentation o...","k":"fair","s":"2026-08-01","e":null,"st":"11:00","et":null,"u":"hesse_flatow","c":"Aspen","co":"United States","p":"https://www.instagram.com/p/Dba2tcpnaNL/","x":"Aspen Art Fair is officially open! Come find us in Room 124 with a group presentation of works by Bix Archer, Sarah Blaustein, Michael Childress, Cooper Cox, Elizabeth Hazan, James Morse, and Jonathan Ryan.⁠\n⁠\n@aspenartfair_org will be on view through Saturday August 1 with the following hours:⁠\n⁠\nThursday, July 30, 11am - 6pm⁠\nFriday, July 31, 11am - 6pm⁠\nSaturday, August 1, 11am - 4pm⁠\n⁠\nImages: Michael Childress, “Pink Picture”, 2025. Acrylic and wax on wood, 21 1/2 x 22 inches (54 x 55 cm). Sarah Blaustein, “Green Opener”, 2025. Ink and acrylic on canvas, 40 x 90 inches (101 x 228 cm). Bix Archer, “Dogwood Bleed”, 2026. Oil on canvas, 36 x 48 inches (91 x 121 cm). Courtesy of the artists and HESSE FLATOW, New York. Photo: Jenny Gorman.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Jessica Wilson is included in “SOUND BIESENTHAL”, opening next Saturday August 1 at Weh...","k":"exhibition","s":"2026-08-01","e":null,"st":null,"et":null,"u":"diez.gallery","c":"Biesenthal","co":"Germany","p":"https://www.instagram.com/p/DbNfuCksHQU/","x":"Jessica Wilson is included in “SOUND BIESENTHAL”, opening next Saturday August 1 at Wehrmuehle, Biesenthal. The exhibition is curated by Domenico Positano.\n\nCentral to the exhibition is sound itself — not only as a medium, but as a conceptual tool through which questions of perception, space, memory, and social relations are explored.\n\n@feel__more #jessicawilson\n@dodopositano \n@artbiesenthal @wehrmuehle\n\nSiren, 2026\nmetal, found siren horns, sound\n18 minutes 24 seconds","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-25","ld":7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Final Day & Artist Talk⁠","k":"talk","s":"2026-08-01","e":null,"st":"15:00","et":null,"u":"gertrudecontemporary","c":"Melbourne","co":"","p":"https://www.instagram.com/p/DbMh_WtGdNX/","x":"Final Day & Artist Talk⁠\n⁠\nJordan Halsall⁠\nForce Feeder⁠\n⁠\nJoin us on August 1 at 3pm for a conversation about the exhibition between artist Jordan Halsall and Curator Brigid Moriarty.⁠\n⁠\nUntil 1 August 2026⁠\nGertrude Glasshouse⁠\n44 Glasshouse Road, Collingwood⁠\nWurundjeri Country⁠\n⁠\nA force feeder is a mechanical device used in tablet compression machines, more commonly known as a pill press. Unlike gravity feeding, force feeding uses rotating paddles to ensure powder flows evenly and precisely into the machine’s compression zone.⁠\n⁠\nThe regulatory landscape governing manufacturing equipment bears a surreptitious shadow – a network of distributed, largely unseen DIY producers working with everyday materials and accessible, commodified technology to bypass the systems designed to suppress them. The popularisation of distributed manufacturing models has influenced virtually every aspect of the production sector, including contemporary artistic practice. ⁠\n⁠\nForce Feeder is an installation of sculpture and paintings by Jordan Halsall, assembled into something like a clandestine laboratory. Made using utilitarian objects and methods of fabrication, outsourced production and traditional oil painting, the artworks respond to Halsall’s ongoing research into decentralised production paradigms and their at once nefarious and transformative potentialities.⁠\n⁠\nGertrude Glasshouse is generously supported by Michael Schwarz and David Clouston.⁠\n⁠\nJordan Halsall, Force Feeder, installation view, Gertrude Glasshouse, Naarm, Melbourne 2026, image courtesy and © the artist, photograph: Christian Capurro, Machiko Abe⁠\n⁠\n@jordanhalsall @brigiemoriarty⁠\n⁠\n#GertrudeStudioArtist #gertrudeglasshouse","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-25","ld":7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Halfway to the weekend, but who’s counting? (Us… we’re counting…👀)","k":"exhibition","s":"2026-08-01","e":null,"st":null,"et":null,"u":"lhucalubbock","c":"Lubbock","co":"","p":"https://www.instagram.com/p/DbY97oplqTg/","x":"Halfway to the weekend, but who’s counting? (Us… we’re counting…👀) \n\nIf you haven’t seen either of these galleries yet, this week is your chance! “Expand” by @hillerbrand_magsamen and “Between Boy and Clown” have been such a colorful addition to our galleries this summer. 💙☁️🤡🎪\n\nStretch your legs and visit us on your next lunch break or stop through town during travels! \n\nWe’re open Tuesday-Saturday from 11 a.m. - 5 p.m. ✨🫶","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":3,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Join us tomorrow for the launch and signing of Keith Mayerson’s (@keithmayerson) ‘My Am...","k":"exhibition","s":"2026-08-01","e":null,"st":"10:00","et":"00:00","u":"aspenartmuseum","c":"Aspen","co":"","p":"https://www.instagram.com/p/DbePzpbn_rB/","x":"Join us tomorrow for the launch and signing of Keith Mayerson’s (@keithmayerson) ‘My American Dream: Rocky Mountain High’ at the Aspen Art Museum. \n\nPublished on the occasion of Mayerson’s recent solo exhibition at the Aspen Art Museum, the catalogue includes texts by AAM director Nicola Lees, co-curators Daniel Merritt and Simone Krug, and the artist.\n\nSaturday, August 1\n10–12 am\n@aspenartmuseum.\n\nPlease note this event is exclusive to museum members at the Contemporaries level and above. Registration is required.","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-31","ld":1,"dl":"2026-08-01","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"This Saturday, Aug. 1, at 6:30 p.m., join us for the New York premiere of THE PROJECTIO...","k":"launch","s":"2026-08-01","e":null,"st":"06:30","et":null,"u":"movingimagenyc","c":"New York","co":"","p":"https://www.instagram.com/p/Dbd5Ef2IF0_/","x":"This Saturday, Aug. 1, at 6:30 p.m., join us for the New York premiere of THE PROJECTIONIST, the latest film from maverick indie director  Alexandre Rockwell (In the Soup) with Rockwell joined by actors Vondie Curtis-Hall, Kasi Lemmons, Karyn Parsons, Kevin Corrigan, and David Proval, and cinematographer Sam Motamedi — all in person! \n \nThe film unfolds like a B-movie film noir, its grimy world poetically captured in grainy black-and-white and populated by the expressive faces of its world-weary characters. Part of our ongoing series Art & Craft and moderated by programmer David Schwartz. \n\nGet tickets: https://movingimage.org/event/the-projectionist/","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-31","ld":1,"dl":"2026-08-01","ds":"event start","ap":false,"rel":true,"q":false},{"now":true,"t":"Hold Everything Dear – John Berger and Cinema: A multi-venue Film Comment: Live series ...","k":"screening","s":"2026-08-01","e":null,"st":null,"et":null,"u":"filmcommentmagazine","c":"New York","co":"","p":"https://www.instagram.com/p/DbdiWlgjR0l/","x":"Hold Everything Dear – John Berger and Cinema: A multi-venue Film Comment: Live series celebrating the writer’s centennial is coming to the Museum of the Moving Image (@movingimagenyc). ⁠\n⁠\nAt a moment when the faculty of vision has been exploited, standardized, and wedded to atrocity like never before, Film Comment (@filmcommentmagazine) will shine a light on a lesser-known dimension of his work and legacy: its affinity with cinema. ⁠\n⁠\nJohn Berger’s rarely seen television documentary Germinal is a testament to the Marxist art critic, broadcaster, and author’s lifelong commitment to experimenting with narrative form—whether literary, cinematic, or televisual—to find new ways of building solidarity with the struggles of the oppressed. Years later, in an essay titled Miners, Berger would put into words what his Germinal articulates with the poetic force of the moving image: “I can’t tell you what art does and how it does it, but I know that often art has judged the judges, pleased revenge to the innocent, and shown to the future what the past has suffered, so that it has never been forgotten.”⁠\n⁠\nFollowing the screening, join us for an audio-visual lecture by filmmaker and writer Brett Story (@brettpstory). Building on her forthcoming feature film about John Berger, Story charts Berger’s twin commitments to art and socialism against the backdrop of the Cold War and decline of empire. Followed by audience Q&A. ⁠\n⁠\nGerminal + Reality Is All We Have (An Audio-Visual Lecture by Brett Story) will be at MOMI on Saturday, August 1. Secure your spot and explore the full program on Film Comment’s website today.","r":false,"b":"reserve","af":true,"so":false,"pd":"2026-07-31","ld":1,"dl":"2026-08-01","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"From the preview, to opening day, and a delightful cocktail party at our friends Sharon...","k":"fair","s":"2026-08-01","e":null,"st":"11:00","et":null,"u":"moniquemeloche","c":"Aspen","co":"United States","p":"https://www.instagram.com/p/DbdiZcnCTLR/","x":"From the preview, to opening day, and a delightful cocktail party at our friends Sharon and John Hoffman’s home to the hustle and bustle of the fair, we are having a wonderful time here at the Aspen Art Fair! 🍾🪩🥂\n\nThe Fair is open through Saturday, August 1. Come by our booth!💜🏔️\n\nRemaining Dates: \n\nBooth B14 \nFriday, July 31: 11 am-6 pm \nSaturday, August 1: 11 am-4 pm","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The movie is over, the night is not. ⁠","k":"exhibition","s":"2026-08-01","e":null,"st":"17:00","et":null,"u":"metrograph","c":"New York","co":"","p":"https://www.instagram.com/p/DbeBbYeoG-M/","x":"The movie is over, the night is not. ⁠\n⁠\nThe Metrograph Commissary opens at 5pm.\n\nGrab dinner after your film with friends and keep the night going. Open this weekend 5pm to late.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":1,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"A wonderful visit from Ngozi Onwurah! ✨ The new restoration of her radically ahead-of-i...","k":"screening","s":"2026-08-01","e":null,"st":"19:00","et":null,"u":"criterioncollection","c":"","co":"","p":"https://www.instagram.com/p/DbdmUUkAABL/","x":"A wonderful visit from Ngozi Onwurah! ✨ The new restoration of her radically ahead-of-its-time Afrofuturist classic WELCOME II THE TERRORDOME (1995) opens today at @bamfilmbrooklyn with the writer-director in attendance for Q&As after the 7pm screenings tonight and tomorrow (8/1). The Criterion edition of WELCOME II THE TERRORDOME enters the collection in October!\n\nNgozi's Picks (more to come. . .):\nBLACK GIRL \nMISSISSIPPI MASALA\nDOUBLE INDEMNITY\nDO THE RIGHT THING","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-31","ld":1,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"some of my favourite work for the AIAIAI x OKLOU collab @aiaiai.audio @oklou_ . I made ...","k":"launch","s":"2026-08-01","e":null,"st":null,"et":null,"u":"dominiq.xyz","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbdYmBlCt7H/","x":"some of my favourite work for the AIAIAI x OKLOU collab @aiaiai.audio @oklou_ . I made the visuals to feel like a signal half tuned in, something between feeling awake and feeling asleep. packaging a shared curiosity around memory and family histories. Artworks inspired by Caribbean breeze blocks, found objects, and a Las Vegas karaoke bar invite us into sites of personal meaning.  Alongside work by the Fellows, the exhibition includes artworks curated by the Fellows from Abrons Visual Artist AIRspace Residency alumni Baseera Khan (2016–17), Elliott Jerome Brown Jr. (2019–20), and Park McArthur (2013–14), who serve as Fellowship mentors.\n\n#abronsartscenter \n#MeganMiAiLee\n#AliRosaSalas\n@abronsartscenter @meg.miai @prdiva09","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-10","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Opening Friday, July 10, 6–9 PM","k":"exhibition","s":"2026-07-10","e":"2026-08-02","st":"18:00","et":"21:00","u":"oolongallery","c":"New York","co":"","p":"https://www.instagram.com/p/Dak-aWIxiZC/","x":"Opening Friday, July 10, 6–9 PM\n\nMichael Colletta\nTea-soaked madeleine\nJuly 10–August 2, 2026\nOolong Gallery\n4 Cortlandt Alley, New York\n\nThe artist will be present from Encinitas, California.\n\nMichael Colletta’s paintings are rooted in the ordinary events that accumulate into a life: gatherings of family, childhood play on suburban streets, garage-band concerts, the watering of plants, the umbrellaing of a beloved, and the solace of remembered places. Echoing the exhibition’s title, Tea-soaked Madeleine, these works arise from a mysterious transformation of memory into universally intimate micro-monuments. Working from memory and invention as much as observation, Colletta pares away incidental detail to arrive at images that feel at once personal and archetypal. His recurring figures and motifs function less as portraits of specific individuals than as a means to convey affection, longing, wonder, and belonging.\n\nColletta’s paintings possess a quiet emotional gravity. Their simplified forms, carefully orchestrated color relationships, and luminous spaces create a world where everyday experience takes on an almost mythic dimension. Colletta reminds us that profound meaning is often found not in extraordinary events, but in the moments that linger in memory long after they have passed, acquiring a significance greater than the events themselves.\n\n—Larry Groff\n\nMarcel Proust viewed involuntary memory as containing the “essence of the past,” claiming that it was lacking from voluntary memory. When the protagonist of Proust’s novel eats a tea-soaked madeleine, a long-forgotten childhood memory of eating tea-soaked madeleine with his aunt is restored to him. From this memory, he then proceeds to recall the childhood home he was in, and even the town itself. This becomes a theme throughout In Search of Lost Time, with sensations reminding the narrator of previous experiences. Proust dubbed these “involuntary memories”.\n\nThe exhibition title underscores how painter Michael Colletta works from memory in the studio, allowing gesture and mark-making to reshape the experience of everyday life.\n\nMichael Colletta received his MFA degree from Yale University in 1987.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-09","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"gallery II indoor scenes, joy of living by Michael Colletta","k":"talk","s":"2026-07-10","e":"2026-08-02","st":"10:00","et":"18:00","u":"oolongallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbD_jAvjiym/","x":"gallery II indoor scenes, joy of living by Michael Colletta\n\nOolong Gallery presents \n\nMichael Colletta\nTea-soaked madeleine\nJuly 10–August 2, 2026\n\n4 Cortlandt Alley NYC\nbetween White & Franklin\nMon-Sat 10-6pm\n\nADA and collector elevator access at 368 Broadway upon request by SHRINE gallery.\n\nSlides:\n\nMichael Colletta\nPlayers, 2026\nOil on canvas, artist frame\n24 x 18 in\n\nMichael Colletta\nDancer, 2023\nOil on canvas, artist frame\n50 x 48 in\n\nMichael Colletta\nRehearsal, 2004-2010\nOil on canvas, artist frame\n48 trup Madsen reflects on the authority of Knudsen’s paintings: \n\n“Knudsen’s painting distinguishes itself from much new painting of his generation by maintaining elements of the self-reflexivity that has characterized the medium since the 1980s. We know that Knudsen’s paintings know that they are paintings because of the stark difference between an E and a spiral and the thick layers of oil and wax, these dense, clotted abstractions. The juxtaposition of different modalities of image-making points to the nature of the image itself, to the structures that support it: both literally, in the form of the canvas and the stretcher-bar, and in the expanded sense of painting’s history and what remains of its authority.”\n\nThe bilingual publication (DK/EN) is available in print at O—Overgaden’s bookshop (DKK50), while a free digital copy is available on our website.\n\nOpening hours:\nTuesday, Wednesday: 1–6pm\nThursday: 1–8pm\nFriday: 1–6pm\nSaturday, Sunday: 11am–6pm\n\n@mortenknudsen_mk\nPhotos by @david_stjernholm","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-25","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"~ NOW ON SHOW ~ coyote: “Upstairs”","k":"exhibition","s":"2026-07-26","e":"2026-08-02","st":"13:00","et":"18:00","u":"overgaden_","c":"Copenhagen","co":"","p":"https://www.instagram.com/p/DbP6TlGjOe9/","x":"~ NOW ON SHOW ~ coyote: “Upstairs”\n\n“Upstairs” is open for one more week—through 2 August!\n\nFor the publication accompanying their exhibition, coyote interviewed six collaborators including curators Klara Li Scheutz & Sif Lindblad (All all all). Here’s an excerpt from their conversation: \n\ncoyote: \n“In terms of the future, what are your expectations for coyote?”\n\nKlara Li Scheutz & Sif Lindblad:\n“Great expectations. We see a grand future. We think we see an uncompromising future. You will influence how we organize ourselves in the art scene in general. We feel you already did that. You’ll take more and more space with that type of work. And this is not necessarily in a matter of size—but also that. That’s our expectation.”\n\nThe bilingual publication (DK/EN) is available in print at O—Overgaden’s bookshop (DKK50), while a free digital copy is available on our website.\n\nOpening hours:\nTuesday, Wednesday: 1–6pm\nThursday: 1–8pm\nFriday: 1–6pm\nSaturday, Sunday: 11am–6pm\n\n@coyote2017_\n@klara.li.scheutz \n@siflindblad \n\nPhotos by @david_stjernholm","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-26","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Touch, feel, and explore.","k":"exhibition","s":"2026-07-27","e":"2026-08-02","st":null,"et":null,"u":"guggenheim","c":"New York","co":"","p":"https://www.instagram.com/p/DbTVNf6jDcN/","x":"Touch, feel, and explore.\n\nIn the final week of \"Carol Bove\", spend time in the Tactile Library, an interactive space designed to deepen your experience of the exhibition through texture, material, and form.\n\nDon't miss your chance to experience \"Carol Bove\" before it closes August 2.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"【香港七月Party Guide · 7月28日 - 8月2日❤️‍🔥】","k":"other","s":"2026-07-28","e":"2026-08-02","st":null,"et":null,"u":"mandos.app","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbVeR7tGsaS/","x":"【香港七月Party Guide · 7月28日 - 8月2日❤️‍🔥】\n\nDownload MANDOS 就可以睇到每個月所有活動嘅所有門票價錢和場地詳情🌟，仲可以一站式\n係App入面買埋飛🤩🎫\n\n快啲Download MANDOS以獲取最新活動資訊啦👊🏻🔥～\n\n【Hong Kong July Party Guide (July 28th - August 2nd)❤️‍🔥】\n\nDownload MANDOS to see all the events, ticket prices, and venue details for each month🌟, and even buy tickets through the app🤩🎫\n\nDownload MANDOS now for the latest event information👊🏻🔥～\n\n-\nDownload MANDOS\nPlan your nightlife route tonight 🍊\n\n#MANDOS #HKNightlife #HKpartyguide","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-28","ld":0,"dl":"2026-08-02","ds":"run closes","a  unseen, untranslated, or protected.\n\nSee it before it closes, and claim the accompanying process-image NFT for free, powered by @objktcom.\n\nPhotos by @markkingismarkings","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The New Museum’s Artist-in-Residence Alison Kuo (@kuoskies) invites families with child...","k":"performance","s":"2026-08-02","e":null,"st":null,"et":null,"u":"newmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/DbWuR9_hOAj/","x":"The New Museum’s Artist-in-Residence Alison Kuo (@kuoskies) invites families with children to visit the New Museum on Sunday, August 2 for a ✨free✨ Family Day experience!\n \nVisitors are invited to make their own paper doll inspired by the elaborate costumes used in Cantonese Opera and learn about Kuo’s new performance work that draws on the 400-year-old traditions of this artform. Additional activations include a Chinese ribbon dancing workshop with dancer and educator, Ling Tang (@ling.dance) and a storytime with Rohan Zhou-Lee (@diaryofafirebird ) of Blasian Bookfair (@blasianmarch.)  \n \nPlease register in advance to secure your spot via the link in bio! 🔗 Registration is capped to two adults and four children under 18.","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-28","ld":5,"dl":"2026-08-02","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"Did you know there’s a hidden mural inside the Guggenheim? 👀","k":"exhibition","s":"2026-08-02","e":"2026-08-02","st":null,"et":null,"u":"guggenheim","c":"New York","co":"","p":"https://www.instagram.com/p/DbdnPbwHcwn/","x":"Did you know there’s a hidden mural inside the Guggenheim? 👀\n\nInstalled in 1967, Joan Miró and Josep Llorens Artigas’s \"Alicia\", has spent decades concealed behind a false wall along the museum’s spiral ramp. For the first time in 23 years, the 190-tile ceramic mural has been revealed as part of \"Carol Bove.\"\n\nRather than fully unveiling the work, Bove frames a glimpse of \"Alicia\" through a diamond-shaped opening, inviting visitors to encounter the mural as a moment of discovery within Frank Lloyd Wright’s “temple of spirit.” \n\nAfter meticulous conservation, the mural’s vibrant colors, glazed surfaces, and details have been restored for a new generation to experience.\n\nIt's the final weekend to experience \"Carol Bove\" before it closes Sunday, August 2. \n\nFor a rare opportunity to view \"Alicia\" when it's fully visible, visit the museum Saturday, August 8, or Sunday, August 9. \n\nImages: (1) Will Ragozzino, (2-3) David Heald.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":2,"dl":null,"ds":null,"ap":true,"rel":false,"q":false},{"now":true,"t":"In this Egyptian sci-fi adventure, an accidental launch leads to the Moon!","k":"screening","s":"2026-08-02","e":null,"st":"15:00","et":null,"u":"sharjahart","c":"Sharjah","co":"","p":"https://www.instagram.com/p/DbdWcTZIJ6b/","x":"In this Egyptian sci-fi adventure, an accidental launch leads to the Moon!\n\nThis weekend, watch ‘Journey to the Moon’ (1959), which follows a trio who unexpectedly find themselves on the Moon, where they meet a mysterious man and his companions. Filled with humour and adventure, the film offers a charming glimpse into Arab science fiction cinema.\n\nAfter the screening, discuss how the film explores notions of scientific progress, ethics and social commentary. The conversation will be led by Mohammed Mamdouh, Assistant Professor of Film and New Media Design, American University of Sharjah.\n\n🍿 ‘Journey to the Moon’ (1959)\n💬 Arabic with English subtitles\n📅 2 August 2026 | 🕒 3:00 pm\n🎬 Film screening + talk\n📍 Photography Gallery, Al Manakh, Sharjah\n\nFree admission. Book your tickets now through the link in our bio.\n\nImage: Poster of ‘Journey to The Moon’ (1959), directed by Hamada Abdelwahab.\n\nفي فيلم الخيال العلمي المصري هذا، تنطلق مركبة فضائية عن طريق الخطأ، لتبدأ مغامرة نحو القمر.\n\nشاهدوا هذا الأسبوع فيلم «رحلة إلى القمر» (1959)، الذي يتتبع ثلاثة رجال يجدون أنفسهم، على نحو غير متوقع، فوق سطح القمر، حيث يلتقون رجلاً غامضاً ورفيقاته. يجمع الفيلم بين الفكاهة والمغامرة، ويقدم لمحة طريفة عن بدايات سينما الخيال العلمي العربية.\n\nبعد العرض، شاركونا حواراً حول ما يطرحه الفيلم من تصورات عن التقدم العلمي والأخلاق والنقد الاجتماعي، يديره د. محمد ممدوح، الأستاذ المساعد في تصميم الأفلام والوسائط الجديدة في الجامعة الأميركية في الشارقة.\n\n🍿 رحلة إلى القمر (1959)\n💬 بالعربية مع ترجمة إلى الإنجليزية\n📅  2 أغسطس 2026 | 🕒 3:00 مساءً\n🎬 عرض فيلم وحوار\n📍 رواق الفوتوغراف، المناخ، الشارقة\n\nالدخول مجاني. احجزوا تذاكركم الآن عبر الرابط الموجود في الوصف.\n\nالصورة: ملصق فيلم «رحلة إلى القمر» (1959)، إخراج حمادة عبد الوهاب.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-31","ld":2,"dl":"2026-08-02","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"There are 5 more days to see Michael Asher at MOCA Grand Avenue in Los Angeles. The exh...","k":"exhibition","s":"2026-08-02","e":null,"st":null,"et":null,"u":"artistsspace","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DbYnUSioDA-/","x":"There are 5 more days to see Michael Asher at MOCA Grand Avenue in Los Angeles. The exhibition closes on Sunday, August 2nd. \n\nArtists Space was thrilled to collaborate with The Museum of Contemporary Art, Los Angeles, and José Luis Blondet, Senior Curator, with Emilia Nicholson-Fajardo, Curatorial Assistant. \n\nOver a career spanning six decades, Michael Asher (1943–2012) played a pivotal role in developing conceptual art through site-specific interventions that made their surrounding context the active content of his work. Asher’s interrogations of these sites reveal the many ways art can critique and make visible the often unseen social, economic, and institutional structures that underpin the subjects it addresses.\n\nImages:\nInstallation views of Michael Asher, February 24-August 2, 2026 at MOCA Grand Avenue. Courtesy of The Museum of Contemporary Art (MOCA). Photos by Jeff McLane.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Plan your next visit and explore what's new in our galleries. General admission is free...","k":"other","s":"2026-08-02","e":null,"st":null,"et":null,"u":"asianartmuseum","c":"San Francisco","co":"","p":"https://www.instagram.com/p/DbeNIGvCW6B/","x":"Plan your next visit and explore what's new in our galleries. General admission is free this Sunday, August 2.\n\n🪵 Kim Minwook: On Carving, Bending, and Binding Wood\n🍽️ Al-An deSouza: Table Settings\n🏔️ Mountains of the Mind: A Chinese Landscape Journey\n🎶 A Sound Work by Lala Rukh: Subh-e-Umeed\n🌧️ FX Harsono: Writing in the Rain\n🎭 One Hundred Plays of the Noh Theater by Tsukioka Kogyo\n\nVisit the link in our bio for more information.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This August, join us for a month filled with incredible live performances, musical work...","k":"performance","s":"2026-08-02","e":null,"st":null,"et":null,"u":"asianartmuseum","c":"San Francisco","co":"","p":"https://www.instagram.com/p/DbTmgv1idzT/","x":"This August, join us for a month filled with incredible live performances, musical workshops, and so much more! 🎼\n\nSunday, August 2 | Free First Sunday 🎨\nEnjoy free general admission to our collection galleries, drop-in art making activities, and family-friendly storytelling.\n\nSunday, August 9 | Performance: Sixth Station Trio 🎻\n@sixthstationtrio is back! Enjoy music from your favorite Studio Ghibli films arranged for violin, cello, and piano.\n\nSunday, August 16 | Guzheng Performance with Malina Mei 🎶\nHear the ancient strings of a traditional Chinese zither.\n\nSunday, August 23 | Drop-In A Capella with @acahub.music 🎤\nCome for the harmony, stay for the community in this casual, no-stress singing workshop.\n\nVisit the link in our bio to see the full schedule.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Comment APP to be notified when the Art Prof app is released! BUT…","k":"exhibition","s":"2026-08-02","e":null,"st":null,"et":null,"u":"art.prof","c":"New York","co":"","p":"https://www.instagram.com/p/DbcQPartS4m/","x":"Comment APP to be notified when the Art Prof app is released! BUT…\n\n…the app is already available for Art Club members, for $27 a year, 84% off. \n\nThis is the last time you can join Art Club to get our app at this rate, if you wait until the public release you’ll pay $19 per month. \n\nArt Club enrollment opens this Sunday! We have a limited number of spots, and several artists have already been accepted. Apply now so the doors don’t close on you. \n==\nWe will have an app guide page eventually, but for now here are some FAQ:\n\n1)Will content I post inside the app be added to a database, used for AI training, used by a third party apps, and used in marketing and promotional materials?\n\nNo, the app does not use anything you post in the app to train AI models, for third-party providers, is not added to databases, and is not used in marketing or promotional materials for Studio.\n\n2)Why use technology that goes against creativity and originality?\n\nOur app does not generate images, or try to create its own original artworks. \n\nThe app is basically a search engine and educational structure.\n\nWith over free 2500 videos and over free 900 website pages, our audience has been struggling to find the info they need in all that content.\n\nThe app provides accessibility as many artists cannot afford Art Club.\n\n3) Does the app do web searches or reference other sites?\n\nNo, the app is trained only our content; it does not do web searches, unless I have manually entered a specific site.\n\nWe have spent hours on the app, and I have worked to manually add specific things and fix items that are not correct","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":2,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"𝒕𝒆𝒋𝒊𝒆𝒏𝒅𝒐 𝒂 𝒔𝒂𝒏 𝒃𝒆𝒏𝒊𝒕𝒐 -","k":"other","s":"2026-08-02","e":null,"st":"15:00","et":"18:00","u":"gmtc.nyc","c":"New York","co":"","p":"https://www.instagram.com/p/DbbX6PHnOZO/","x":"𝒕𝒆𝒋𝒊𝒆𝒏𝒅𝒐 𝒂 𝒔𝒂𝒏 𝒃𝒆𝒏𝒊𝒕𝒐 - \n\n𝖆𝖈𝖙𝖎𝖔𝖓 4: 𝖇𝖆𝖎𝖑𝖆𝖓𝖉𝖔 𝖆 𝖘𝖆𝖓 𝖇𝖊𝖓𝖎𝖙𝖔 (𝖉𝖆𝖓𝖈𝖎𝖓𝖌 𝖜𝖎𝖙𝖍 𝖘𝖆𝖓 𝖇𝖊𝖓𝖎𝖙𝖔)\n\naugust 2, sunday, 3-6pm\nrsvp link in bio \n\nconnected remotely with campo refinería, cabimas, 𝐦𝐚𝐫í𝐚 𝐞𝐥𝐞𝐧𝐚’s cousin 𝐦𝐢𝐠𝐮𝐞𝐥 will interview one of the drummers 𝐬𝐞𝐛𝐚𝐬𝐭𝐢𝐚𝐧 𝐥𝐚 𝐩𝐞𝐫𝐥𝐚, who participates in the celebration of san benito.\n\nthrough a pre-recorded conversation and demonstration, they will introduce the basic drum rhythms, or golpes, and explain how people walk, dance, and move with the drums during the procession.\n\n🪘🪇 participants at gmtc will then respond to the rhythms and practice some of these movements together.\n\nafterward, we will attempt to call 𝐦𝐢𝐠𝐮𝐞𝐥 to ask questions and share our dancing. however, a live connection cannot be guaranteed due to the frequent power outages cabimas has experienced since 2019.\n\ngraphic by @binvin.hrs\nvideos by @fragmentario_\n\nspecial thanks to the artist’s family in cabimas for making this happen 🙏","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-30","ld":3,"dl":"2026-08-02","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"ON THE GO: “THE RIGHT TO PLAY”","k":"exhibition","s":"2026-08-02","e":null,"st":null,"et":null,"u":"fotografiskcenter","c":"Copenhagen","co":"","p":"https://www.instagram.com/p/DY9rSTDCAWC/","x":"ON THE GO: “THE RIGHT TO PLAY”\n\nExperience Fotografisk Center’s current online exhibition “The Right To Play” by Lee-Ann Olwage / @leeannolwage  on our digital exhibition platform ON THE GO. Link in the bio\n\nExhibition period 25.05-02.08.2026\n\nThe South African visual artist Lee-Ann Olwage’s (1986) project The Right to Play unfolds as both a poetic visual narrative and a political act. Through collaborative storytelling, Olwage challenges the structures that historically have limited girls’ freedom, education, and self-definition. Rather than portraying young girls as passive motives, she constructs images that centre their imagination and possibility. The project asks a simple but radical question: “What do girls dream of?” In doing so, it shifts the focus away from survival alone and towards the right to aspiration, play, and self-determination.\n\n…\n\nClick on to our website to see the works and read more about the exhibition. \nhttps://on-the-go.net/ \n\nImage: Lee-Ann Olwage","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-30","ld":64,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This Sunday, August 2 | Gallery Sinclair and Saint James Libations welcome you to TABLE...","k":"exhibition","s":"2026-08-02","e":null,"st":null,"et":null,"u":"gallerysinclairnyc","c":"New York","co":"","p":"https://www.instagram.com/p/DbZFcbhCWI-/","x":"This Sunday, August 2 | Gallery Sinclair and Saint James Libations welcome you to TABLE MANNERS\n\nAn intimate dinner series rooted in the tradition of Black supper clubs that sparked real change. We’re continuing that legacy with gatherings built to make the art world more transparent, accessible, and a little easier to belong to.\n\nOver five courses and curated wine pairings, we will invite an artist to share about their work and answer all of your questions about the art world, spicy or not. This is for collectors who want deeper connections, the almost-collectors who want guidance, the artists who want to kiki in good company, and anyone who’s ever walked into a gallery and felt like they didn’t belong.\n\nOur first dinner welcomes photographer Andina Marie Osorio to the table. A series of limited edition prints will be available to start or grow your collection. \n\nForget your manners, bring your questions, leave with new ideas | $85 four-course dinner, Ticket in bio\n\nLike the conversation, dinner is meant to be shared.  Saint James Libations’ four-course dinner is a shared journey through the flavors of the African and Caribbean diaspora, where each dish tells a story of memory, migration, and modern Brooklyn.\n\nCreated by Chef Camari Mick—Food & Wine’s Best New Chef of 2024, four-time James Beard semifinalist, and Forbes 30 Under 30—the menu is served tapas-style, encouraging conversation, connection, and discovery around the table. Thoughtfully paired with curated wines, each course reflects the spirit of Saint James: rooted in culture, crafted with intention, and designed to make everyone feel at home. Built for sharing. Made to pair.\n\nAndina Marie Osorio (b. Bronx, NY) is a lens-based artist based in Brooklyn, New York. Osorio’s practice explores the intersections of memory, identity, queer affect, migration, and Black femme sexual politics through assemblage, portraiture and archival work centered on the familial and queer experience.\n\nAndina will lead a tour of her exhibition “you’re just a bee charmer” currently on view at SINCLAIR. A series of limited edition prints will be available to start or grow your collection.\n\nSee you on Sunday!!","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-29","ld":4,"dl":"2026-08-02","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Spending the summer holidays in Berlin and looking for a creative family activity in ou...","k":"workshop","s":"2026-08-02","e":null,"st":null,"et":null,"u":"hausamwaldsee","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbdHzGlCHuF/","x":"Spending the summer holidays in Berlin and looking for a creative family activity in our garden? Children, families, and anyone interested are invited to attend our Drop-In Workshops and create their own pictures of Haus am Waldsee. Admission is free. Drop in at any time during the session and get creative!\n\nA House – Many Images 🏡\nDrop-In Workshops in August:\n\nSun, 2.8.2026, 2.30 – 5.30 pm\nSun, 16.8.2026, 2.30 – 5.30 pm\nSun, 30.8.2026, 2.30 – 5.30 pm\n\nMore dates via hausamwaldsee.de/en/events (link in bio)\n\nIhr verbringt die Sommerferien in Berlin und sucht nach einer kreativen Aktivität für die ganze Familie? Zu unseren Drop-In-Workshops sind Kinder, Familien und alle Interessierten eingeladen, eigene Bilder des Haus am Waldsee zu gestalten. Die Teilnahme ist kostenlos. Kommt innerhalb des Zeitfensters jederzeit vorbei und werdet kreativ!\n\nEin Haus – viele Bilder 🏡\nDrop-In-Workshops im August: \n\nSo, 2.8.2026, 14.30 – 17.30 Uhr\nSo, 16.8.2026, 14.30 – 17.30 Uhr\nSo, 30.8.2026, 14.30 – 17.30 Uhr\n\nMehr Termine unter hausamwaldsee.de/veranstaltungen (Link in der Bio)\n\nImage / Bild: Family workshop at / Familienworkshop im Haus am Waldsee, Photo / Foto: Maximilian Koppernock","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Auf unseren Polaroid Zine-Workshop im @kuenstlerinnenhaus_dortmund folgt im August ein ...","k":"workshop","s":"2026-08-02","e":null,"st":"10:00","et":null,"u":"kulturrucksackdortmund","c":"Dortmund","co":"","p":"https://www.instagram.com/p/DaQEwyGig11/","x":"Auf unseren Polaroid Zine-Workshop im @kuenstlerinnenhaus_dortmund folgt im August ein weiterer - Diesmal geht es um das Schöne im Unperfekten. Ein Workshop mit Künstlerin @denise_ritter_gegenort \n\n🗓️🕒 Datum & Uhrzeit\n01.08. und 02.08.2026\n10:00-15:00 Uhr\n\n⚠️ Der Kurs beginnt am Samstag, dem 01. August. Wir empfehlen die Teilnahme an beiden Tagen, Samstag und Sonntag!\n\nBitte bringt Verpflegung für die Mittagspause mit \n\n📍 Wo\nKünstler*innenhaus Dortmund\nSunderweg 1\n44147 Dortmund\n\n📩 Anmeldung\nDenise Ritter\nritter@gegenort.com\n0151 - 23073374\n\nGefördert durch den Kulturrucksack NRW und das Kulturbüro Dortmund\n\n#kulturellebildung #kreativindortmund #kulturrucksacknrw #kunstindortmund #kulturrucksackdortmund #jugendkultur #fotoworkshopdortmund #kulturindortmund","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-01","ld":32,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This Sunday, @a24 and MoMI celebrate the enduring legacy of Anthony Bourdain with a pai...","k":"screening","s":"2026-08-02","e":null,"st":null,"et":null,"u":"movingimagenyc","c":"New York","co":"","p":"https://www.instagram.com/p/DbbQ1-lHJwL/","x":"This Sunday, @a24 and MoMI celebrate the enduring legacy of Anthony Bourdain with a pair of food-centric films praised by Bourdain himself, RATATOUILLE and TAMPOPO—followed by a special advance screening of Matt Johnson’s new biopic, TONY.\n \nWe’re proud to present the first public screening of the film in Queens, the borough Bourdain championed as “an enchanted wonderland, an international crossroads, a stewpot of neighborhoods filled with the languages, cultures, traditions, and flavors of many lands.”\n \nTickets on sale now, click the link in our bio.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-30","ld":3,"dl":"2026-08-02","ds":"event start","ap":false,"rel":true,"q":false},{"now":true,"t":"Berlin Atonal and silent green are proud to present HTRK for their exclusive Berlin sho...","k":"other","s":"2026-08-02","e":null,"st":"19:00","et":null,"u":"berlinatonal","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbVzVU4sm9g/","x":"Berlin Atonal and silent green are proud to present HTRK for their exclusive Berlin show of 2026, with support from Loraine James. \nSunday 2 August at silent green Kuppelhalle.  \n19:00.\nLast tickets via RA - link in bio.\n\nHTRK [‘hate rock’], the Australian duo of Jonnine Standish and Nigel Yang, have an uncanny ability to elevate musical mood to a singular, smouldering supremacy.\n\nTheir songs are often coded as fantasies, venturing deeper into the heady expanses of dub dream and memory. They make music that channels not just the heaviness and beauty of the world, but the surreal humour and inexplicable serendipity of it too, cataloguing desire, intimacy and spirit like few others. \nHTRK’s albums have been released by labels including Fire, Blast First Petite, Boomkat Editions and Ghostly International. For their most recent full-length, Rhinestones, they founded their own imprint, N&J Blueberries. \nSupport comes from Loraine James, one of the most singular voices in UK electronic music, whose sound draws Hyperdub into unexpected territory. Her latest album, Detached From The Rest Of You, is her sharpest turn yet - glitch-laced, direct, and unmistakably her own. \nFew artists move this fluidly between worlds, jazz, ambient, noise, pop, without ever losing the thread of who they are. James doesn’t so much cross genres as dissolve them, creating something that feels entirely her own each time. It’s rare to hear an artist this far into a catalogue still sound like they’re discovering new ground.\n\n@psychic9to5club @setfiretoloraine @silent.green","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-28","ld":5,"dl":"2026-08-02","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"FAMILY & FRIENDS DAY | FIMO SOUVENIR MAKING","k":"workshop","s":"2026-08-02","e":null,"st":"11:00","et":null,"u":"kbhgeiger","c":"Vienna","co":"","p":"https://www.instagram.com/p/DbduWdSNrte/","x":"FAMILY & FRIENDS DAY | FIMO SOUVENIR MAKING\n2 August | 11 am - 6 pm\n\nFor Family & Friends Day, visitors of all ages are invited to create small souvenirs from modeling clay. This open workshop encourages creativity and offers space for shared making and personal mementos inspired by the exhibition.\n\nParticipation is free of charge. No registration required. For children aged 6 and above.\n\nExtrasensory – Chloe Wise\nCurated by Samuel Leuenberger\n12 June – 6 September 2026\n\n____\n#extrasensory #chloewise #samuelleuenberger #kbhg #kulturstiftungbaselhgeiger","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-31","ld":2,"dl":"2026-08-02","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"The web installation of Jordan Lord’s work ‘Make America Sleep Again’ is now live on th...","k":"exhibition","s":"2026-07-03","e":"2026-08-03","st":null,"et":null,"u":"luxmovingimage","c":"London","co":"","p":"https://www.instagram.com/p/DaVHd4gjQuR/","x":"The web installation of Jordan Lord’s work ‘Make America Sleep Again’ is now live on the LUX website, from 3 July to 3 August 2026.\n\nThe project brings together 12 advertisements broadcast on Fox News between 2018 and the present, promoting miracle cures, pain relief and forms of care. Lord first encountered these commercials in their grandmother’s bedroom, as well as in gyms and waiting rooms.\n\nThe installation pairs the advertisements and artist-written open captions with a series of audio files and transcripts that describe every sound, image and editing decision observed in the commercials, alongside an analysis of their audiovisual strategies.\n\nMany of the products marketed as “natural” rely on viewers identifying with their spokespeople, using familiarity and trust as persuasive tools. Through close attention to these advertisements, Lord traces how they both anticipated and reflected the rise of the Make America Healthy Again (MAHA) movement which has led to the dismantling of public health infrastructure in the United States.\n\nFollow the link in bio to view the installation.\n\nMake America Sleep Again (2026) was presented as part of Jordan Lord’s solo exhibition ‘Narrative Warfare’ at LUX, from 11 April to 31 May 2026.\n\n@jrd_lord @abbypsun\n\nImage: ‘Make America Sleep Again’, Jordan Lord, 2026. Courtesy of the artist.\n\nImage Description: On a black background, a white man in a suit, captioned “Mike Huckabee, 2016 Presidential Candidate” stands before a blurred American flag. To his right, a large caption reads “Get your free bottle now!” beside a bottle labelled “Relaxium Sleep.” A banner across the bottom reads “TryRelaxium.com, 800-638-5217” Below the frame, a subtitle reads: “’cause once you do, you’ll be a customer for life,”\n\nVideo description: Screen recording of a cursor scrolling through multiple white pages of black text. The text is numbered and arranged in small paragraphs, with the occasional link underlined in blue.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-03","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Last days to see SoiL Thornton’s work in the group exhibition Beyond the Manosphere – M...","k":"exhibition","s":"2026-07-31","e":"2026-08-03","st":null,"et":null,"u":"galerie_neu","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbdFlk3DJP7/","x":"Last days to see SoiL Thornton’s work in the group exhibition Beyond the Manosphere – Masculinities Today at Stedelijk Museum, Amsterdam\n\nSoiL Thornton’s Husband Chair is modelled after (and takes its name from the American English term for) the chairs that some department stores provide for husbands or male partners wanting to take a seat while their spouses try on clothing. In Thornton‘s version, the husband chair is a site-specific inflatable made to such dimensions that it obstructs one of the entrances to the exhibition. Its height is derived from the size of the exhibition‘s curator. The work opens up questions about access and the assumption of gendered roles in everyday life.\n\ncurated by Melanie Bühler\n\nSoiL Thornton\n„Husband“ chair (Stdlk), 2026\nbrown vinyl, d-rings, blower tube, Quiet Box blower\n\n#SoiLThornton #StedelijkMuseum #galerieneu","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":true,"rel":true,"q":false},{"now":true,"t":"~ LAST CHANCE to see Morten Knudsen’s “STICKY EYES (paintings, collages, drawings, and ...","k":"exhibition","s":"2026-08-01","e":"2026-08-03","st":"11:00","et":null,"u":"overgaden_","c":"Copenhagen","co":"","p":"https://www.instagram.com/p
