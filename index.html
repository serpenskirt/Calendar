 Falión (live) Berlin debut & Palmistry (live) — 23:...","k":"other","s":"2026-08-08","e":null,"st":"23:00","et":null,"u":"club8ing","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbxGsVNsGd6/","x":"Tonight, Saturday, August 08, Harto Falión (live) Berlin debut & Palmistry (live) — 23:00 till the morning @ Salon Opera Berlin\n\nProudly presenting two unique & legendary voices of the underground — Harto Falión & Palmistry, brought together for a special night at Berlin’s Salon Opera.\n\nJoin us for an intimate evening of contemporary experimental music and deep listening.\n\nFeaturing supportive sets from Yale and bod [包家巷], right before Aliar will bring our bodies to the morning sunlight.\n\n@palmistry_globe (live)\n@harto_falion (live)\n@baojiaxiang \n@yale____________ \n@aliarliarliar \n\nTicket link in bio or www.club8.ing\n\nChausseestraße 131A, 10115","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-08","ld":0,"dl":"2026-08-08","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Aske Thiberg","k":"performance","s":"2026-08-08","e":null,"st":"18:30","et":null,"u":"emmelines.biz","c":"","co":"","p":"https://www.instagram.com/p/DbmJiIQJnRI/","x":"Aske Thiberg\nStray Hairs\nAugust 8, 2026\nDoors 6:30pm, Performance 7pm","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-03","ld":5,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"📣 Announcing our global representation of the Constantin Brancusi Estate.","k":"exhibition","s":"2026-05-18","e":"2026-08-09","st":null,"et":null,"u":"pacegallery","c":"New York","co":"","p":"https://www.instagram.com/p/DYfT9IPmcq9/","x":"📣 Announcing our global representation of the Constantin Brancusi Estate. \n-\nRegarded as one of the most important figures of 20th-century sculpture and a pioneer of Modernism, #ConstantinBrancusi is known for his rigorous inquiries into the material and conceptual possibilities of elemental forms in space.\n-\nWorking in concentrated series across decades of his career, he created iconic, impactful sculptures that have inspired generations of artists, from his contemporaries in the School of Paris to the Minimalists and beyond. Brancusi’s 1917 work “Danaïde,” from the collection of the late media mogul S.I. Newhouse, goes on the auction block at @christiesinc in New York later today. Our representation of the Estate was reported in @artnet by @katyakazakina, as well as @artnews.\n-\nOur first major exhibition of the sculptor's work, curated by Dr. Jérôme Neutres, will be held at #PaceLondon this fall. Ahead of our show, a major survey of Brancusi’s work at the Neue Nationalgalerie (@neuenationalgalerie) in Berlin, produced in collaboration with the Centre Pompidou (@centrepompidou), is on view through August 9, 2026.\n-\nFollow the link in bio to read more.\n\n#ConstantinBrancusi #PaceGallery #ModernArt #Sculpture","r":true,"b":null,"af":false,"so":false,"pd":"2026-05-18","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"‘My aim was to create an imaginary landscape as a way of reading our times.’","k":"reading","s":"2026-05-28","e":"2026-08-09","st":null,"et":null,"u":"mplusmuseum","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DY1oaGtBYrU/","x":"‘My aim was to create an imaginary landscape as a way of reading our times.’\n\r\nWorld-renowned contemporary artist Lee Bul recently joined M+ Artistic Director and Chief Curator Doryun Chong for an interview about her artistic practice and exhibition ‘Lee Bul: From 1998 to Now’.\n\r\nThis survey exhibition at M+ brings together pivotal series like ‘Mon grand récit’ and over 200 installations, drawings, and maquettes developed at various points in Lee’s career, revealing their intertwining themes. It offers visitors a rare glimpse into the artist’s process of conceptualising and realising her artworks.\n\r\nThe exhibition is on view at M+ until 9 August 2026. 🔗 See link in bio for more information.\n\n「我希望能創造一片想像的空間，作為解讀我們時代的方式。」\n\r\n全球知名的當代藝術家李昢近日與 M+藝術總監及總策展人鄭道鍊分享其創作歷程，並介紹個展「李昢：一九九八年至今的創作」。\n\r\n今次於 M+的回顧展匯集了《我的宏大敘事（Mon grand récit）》等代表作，展出逾200件出自李昢藝術生涯不同階段的裝置、草圖與模型，揭示作品間的主題交織，讓觀眾一窺這位藝術家如何構思並實現她的創作。\n\r\n此展覽由即日起至2026年8月9日M+展出。🔗 更多展覽詳情，歡迎瀏覽帳號簡介。\n\n#MPlus博物館 #MPlusMuseum #MPlusLeeBul #MPlus李昢 #LeeBul","r":true,"b":null,"af":false,"so":false,"pd":"2026-05-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"The second room of @janivaellis's \"Geneva\" feels like entering something one perhaps sh...","k":"exhibition","s":"2026-07-19","e":"2026-08-09","st":null,"et":null,"u":"kunsthallebasel","c":"Basel","co":"","p":"https://www.instagram.com/p/Da-CD6dig7L/","x":"The second room of @janivaellis's \"Geneva\" feels like entering something one perhaps shouldn't have access to.\n\nThe distance from previously possible narratives becomes harder to maintain, and the atmosphere condenses into a different kind of contiguity. In \"Do I Move You,\" bodies appear intertwined at a scale that resists easy orientation. Eroticism unfolds not as a scene but as a condition where desire, exposure, and observation stay entangled, as if a gaze were already built into the image. Ecstasy doesn't simply discharge. It converges again into chaos, a paradoxical order that recurs throughout the exhibition.\n\nThis carries into the curved painting \"May Day,\" where movement, crowds, and conflict expand and converge like a cinematic montage. Figures and forces interweave so densely that it's hard to tell where one ends and the other begins, echoing a struggle that still shapes Western self-understanding.\n\nThe exhibition is on view until 09.08.2026. We look forward to welcoming you!\n\nCredits: @whoisnicolasgysin @philipp_haenger_foto","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-19","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Kunsthalle Basel Short Cuts – just enough to keep you in the know.","k":"exhibition","s":"2026-07-25","e":"2026-08-09","st":null,"et":null,"u":"kunsthallebasel","c":"Basel","co":"","p":"https://www.instagram.com/p/DbN34OoDahR/","x":"Kunsthalle Basel Short Cuts – just enough to keep you in the know.\n​\nFollow Desireé and Ananda from our Art Mediation team as they explore the many layers that define Janiva Ellis' (@janivaellis) exhibition \"Geneva\".\n\nVisit us! The show is only on view until 09.08.2026!\n\nCredits: @studio__mati","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-25","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"⏰ Two weeks left to catch ‘Lee Bul: From 1998 to Now’ at M+!","k":"exhibition","s":"2026-07-27","e":"2026-08-09","st":null,"et":null,"u":"mplusmuseum","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbSt9hlmnrR/","x":"⏰ Two weeks left to catch ‘Lee Bul: From 1998 to Now’ at M+!\n\nIt’s your last chance to step into the visionary world of Lee Bul, one of the most prominent contemporary artists to emerge from Asia in recent decades. Journey through immersive architectural installations reflecting on modernism and failed utopias, encounter the groundbreaking ‘Cyborg’ sculptures that first brought her international acclaim, and go behind the scenes with drawings, sketches, and maquettes revealing her creative process.\n\n👥 Join our free guided tours, running daily (Tuesday–Sunday), included with your M+ ticket, a great way to explore the stories behind the works.\n\nThe exhibition is generously supported by Lead Sponsor HSBC, The Ritz-Carlton, Hong Kong, M+ Lee Bul Friends Circle, and the Korea Foundation.\n\n️ 🗓️ On view until 9 August 2026 \n📍 West Gallery, L2 \n\n⏰ 倒數兩星期！「李昢：一九九八年至今的創作」於M+的展期即將結束。 \n\n把握最後機會，走進李昢的創作世界。李昢是近數十年來亞洲最具代表性的當代藝術家之一。你可在展覽中穿梭於大型沉浸式建築裝置之間，感受藝術家對現代主義及烏托邦幻滅下的反思；欣賞令她揚名國際的《賽博格》系列雕塑；亦可透過素描草圖及模型，深入了解其創作過程與思考軌跡。 \n\n👥 逢星期二至日設有免費公眾導賞，持M+門票即可參加。立即把握機會，了解李昢的作品及其背後故事。 \n\n本展覽獲首席贊助滙豐、香港麗思卡爾頓酒店、M+李昢藝友會及韓國國際交流財團慷慨支持。 \n\n🗓️ 展期至2026年8月9日 \n📍 二樓西展廳 \n\n📸 Installation view of ‘Lee Bul: From 1998 to Now,’ 2026. 「李昢：一九九八年至今的創作」展覽現場，2026年 [1,3,4,6] Photo: Lok Cheng, M+, Hong Kong. 攝影：鄭樂天，M+，香港 [2] Photo: Michelle Wong, M+, Hong Kong. 攝影：黃穎欣，M+，香港 [5] Photo: Wilson Lam, M+, Hong Kong. 攝影：林煒然，M+，香港\n \n#MPlusMuseum #MPlus #LeeBul #Exhibition #OpenToArt @hsbc_hk","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-07-27","ld":0,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Don’t miss your final chance to see @anickayi_studio’s aerobes take flight at New Museu...","k":"other","s":"2026-07-29","e":"2026-08-09","st":"15:00","et":"18:00","u":"newmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/DbYnoarBFOG/","x":"Don’t miss your final chance to see @anickayi_studio’s aerobes take flight at New Museum through August 9, 2026. 🪼✨🗓️\n \nYi’s “In Love with the World” takes flight:\n \n🗓️ Tuesday: 11am–2pm, 3–6pm\n🗓️ Wednesday: 11am–2pm, 3–6pm\n🗓️ Thursday: 11am–2pm, 3–6pm, 7–9pm\n🗓️ Friday: 11am–2pm, 3–6pm\n🗓️ Saturday: 11am–2pm, 3–6pm\n🗓️ Sunday: 11am–2pm, 3–6pm\n \nPlan your visit and get tickets today with the link in bio 🔗","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-07-29","ld":0,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Just a little Saturday morning cleanse for your feed 🪄 ✨ 😌","k":"exhibition","s":"2026-08-01","e":"2026-08-09","st":null,"et":null,"u":"artbasel","c":"Basel","co":"","p":"https://www.instagram.com/p/DbgARywkms0/","x":"Just a little Saturday morning cleanse for your feed 🪄 ✨ 😌 \n\nNow on view at @parkavearmory is Céleste Boursier Mougenot's 'Clinamen', a vibrant installation of three pools of water filled with ceramic bowls. As they float around and collide into one another, the bowls create melodious chiming sounds that echo throughout the space. \n\nExperience this work for just one more week—'Clinamen' closes August 9.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"LAST CHANCE | There's only a few days left to experience the full exhibition \"New Human...","k":"exhibition","s":"2026-08-02","e":"2026-08-09","st":null,"et":null,"u":"newmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/Dbin954DW4e/","x":"LAST CHANCE | There's only a few days left to experience the full exhibition \"New Humans: Memories of the Future.\" 🤖\n\nThe critically acclaimed exhibition is on view through August 9 and features work by artists, filmmakers, architects, and writers exploring how technological developments have inspired evolving definitions of what it means to be “human.”\n\nFor tickets, click the link in bio 🔗\n\n—\n\n📸: Exhibition view: \"New Humans: Memories of the Future,\" 2026. New Museum, New York. Courtesy New Museum. Photo: Dario Lasagni","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-08-02","ld":0,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"【香港八月Party Guide · 8月3日 - 9日❤️‍🔥】","k":"other","s":"2026-08-03","e":"2026-08-09","st":null,"et":null,"u":"mandos.app","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/Dbk6XKrmlDm/","x":"【香港八月Party Guide · 8月3日 - 9日❤️‍🔥】\n\nDownload MANDOS 就可以睇到每個月所有活動嘅所有門票價錢和場地詳情🌟，仲可以一站式\n係App入面買埋飛🤩🎫\n\n快啲Download MANDOS以獲取最新活動資訊啦👊🏻🔥～\n\n【Hong Kong August Party Guide (August 3rd - 9th)❤️‍🔥】\n\nDownload MANDOS to see all the events, ticket prices, and venue details for each month🌟, and even buy tickets through the app🤩🎫\n\nDownload MANDOS now for the latest event information👊🏻🔥～\n\n-\nDownload MANDOS\nPlan your nightlife route tonight 🍊\n\n#MANDOS #HKNightlife #HKpartyguide","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-03","ld":0,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Who controls the controller? 🤔 The original drawings from pop artist Hariton Pushwagner...","k":"exhibition","s":"2026-08-04","e":"2026-08-09","st":null,"et":null,"u":"newmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/Dbn7mrBEZLR/","x":"Who controls the controller? 🤔 The original drawings from pop artist Hariton Pushwagner's graphic novel \"Soft City\" (1969–75) are on view at New Museum through August 9, 2026. \n\nAn underground classic out of print for many years, \"Soft City\" recounts an average day in a metropolis run by the corporation Soft Inc. 🏙️💼 Pushwagner’s drawings depict the city as a totalizing structure, with walls and windows occupying the entire page, leaving little to no negative space. With its menacing conformity, \"Soft City\" reflects the alienating homogenization effected by consumerism, advertising, and surveillance technologies, which transform individuals into machines designed to sleep, eat, work, and shop. \n\nThis week is your last chance to experience Pushwagner's full \"Soft City\" graphic novel on view through August 9 as part of the exhibition \"New Humans: Memories of the Future\". 🤖 Plan your visit and grab a copy of the newly reprinted \"Soft City\" at the New Museum Store","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"We would like to inform you that “In Absence and in Presence: Works from the Sharjah Ar...","k":"exhibition","s":"2026-08-06","e":"2026-08-09","st":null,"et":null,"u":"aranyaartcenter","c":"Guangzhou","co":"","p":"https://www.instagram.com/p/Dbr4SWWkjsY/","x":"We would like to inform you that “In Absence and in Presence: Works from the Sharjah Art Foundation Collection” at Aranya Art Center Guangzhou will close earlier than originally scheduled, with the final day of the exhibition being August 6, 2026 due to the venue’s renovation works.\n\nWe look forward to welcoming you back to Aranya Art Center Guangzhou for future exhibitions, public programs, and new cultural experiences.\n\n📷\nInstallation view, \"In Absence and in Presence: Works from the Sharjah Art Foundation Collection,\" Aranya ArtCenter Guangzhou. Photography Liu Xiangli\n\n#aranya\n#aranyaartcenter\n#aranyaartcenterguangzhou\n#shariahart\n#sharjahartfoundation","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":true,"rel":false,"q":false},{"now":true,"t":"This week’s featured film:","k":"screening","s":"2026-08-06","e":"2026-08-09","st":"12:00","et":"17:00","u":"carpenter_center_harvard","c":"Cambridge","co":"","p":"https://www.instagram.com/p/Dbqy74IHEcr/","x":"This week’s featured film: \n\nBarbara T. Smith, Outside Chance (1975)\nAugust 6–9\n\nIn this landmark performance, Barbara T. Smith collaborated with computer scientist Richard Rubenstein to generate 3,000 unique computer-produced snowflake prints. Transporting the prints to the twenty-first floor of a Las Vegas hotel, Smith released them into the air, transforming data, chance, and technology into a fleeting public event.\n\n\"Desiring some levity in my life, I created this piece in collaboration with Richard Rubinstein, a friend and computer scientist. We made 3000 computer-generated snowflakes each different as snowflakes are. They had from 3 to 8 points and were printed by the PDP10 computer on white sprocketed gate folded paper. I secured permission to do the piece from the Plaza Hotel in Las Vegas. I arrived wearing a blonde wig, dark glasses, a 1930’s dress, heels, a black silk coat, bead purse, a white fox fur piece around my neck and carrying a suitcase. I rode the elevator to the 21st floor, went to room 2173, opened the bags on the bed, took out the prints, stepped out to the window balcony and began scattering the flakes like snow to the ground. Some fell directly down, others blew up high in the sky, causing it to snow on the desert.\"\nBarbara T. Smith\n\nPrimary Information published I Am Abandoned, which documents Barbara T. Smith’s visionary 1976 performance featuring a real-time conversation between two of the earliest psychoanalytic computer programs, alongside performance documentation, Smith’s reflections on the work, and an afterword by scholar and artist Mashinka Firunts Hakopian. Available now in the Carpenter Center Bookshop!\n\n🔗 Link in bio for exhibition details and full screening schedule.\n\nOpen Thursday–Sunday, 12–5 pm through August 16.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"We are excited to announce our first CABIN Residency Open House hosted in Potsdam, New ...","k":"exhibition","s":"2026-08-07","e":"2026-08-09","st":null,"et":null,"u":"cabin.ny","c":"New York","co":"","p":"https://www.instagram.com/p/DaicAh4gNUK/","x":"We are excited to announce our first CABIN Residency Open House hosted in Potsdam, New York over the weekend of August 7-9. \n\nThe weekend celebrates the closing of our summer residency session, featuring an exhibition of works by the 23 artists who have been living and working with us in Potsdam over the past two months as well as open studios, nature walks and a seated dinner and closing party. \n\nWe hope this weekend offers an opportunity to see our campus and discover our plans for the future. If you’d like to join us, please contact Lawrence@cabinberlin.com for the full program, accommodation details, and further information.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-08","ld":30,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"🎬 The Final Film Festival (@tff_festival) begins next Friday at the ICA, 7 – 9 August.","k":"screening","s":"2026-08-07","e":"2026-08-09","st":null,"et":null,"u":"icalondon","c":"London","co":"United Kingdom","p":"https://www.instagram.com/p/DbdOZ3Tlvrn/","x":"🎬 The Final Film Festival (@tff_festival) begins next Friday at the ICA, 7 – 9 August.\n\nFriday’s programme:\n\n⛺ UK Premiere: Camping du Lac \nA surreal lakeside fable of a stranded traveller, a mythical beast, and the blurred edges of memory and fiction. Followed by a Q&A.\n\n🔥 Personal Problems\nA radical improvisational “meta-soap opera” exploring Black life in 1970s Harlem.\n\n🎞 Richard Heslop: A Collection of Short Films\nFour experimental shorts from 1984–1992, introduced by archivist Nicole Atkinson.\n\n🎟 Tickets @icalondon link in bio\n📍 ICA Cinema, 7 – 9 August\n\n#TheFinalFilmFestival #FilmFestival #CampingDuLac #PersonalProblems #RichardHeslop #ICA #Cinema #London","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-31","ld":7,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Tomorrow is the final day to view “Never could be any other way — anagnorisis” at #Pace...","k":"exhibition","s":"2026-08-07","e":"2026-08-09","st":null,"et":null,"u":"pacegallery","c":"London","co":"","p":"https://www.instagram.com/p/DbttLJWFIei/","x":"Tomorrow is the final day to view “Never could be any other way — anagnorisis” at #PaceLondon, featuring new paintings and sculptures by Kenjiro Okazaki (@kenjirookazaki).\n-\nCentral to Okazaki’s practice is the concept of zōkei (plastic arts): the making of form from substance. In an interview with Whitewall (@whietwall.art), he explains: “The artist’s task resembles that of an archaeologist: to read and interpret how these realized forms came into being. This holds true for both painting and sculpture.”\n-\nVisit our gallery at 5 Hanover Square through tomorrow, August 7, to see “Never could be any other way — anagnorisis.”\n-\nArtwork: Installation views: “Kenjiro Okazaki: Never could be any other way — anagnorisis,” June 5-August 7, 2026, London, United Kingdom.\n\n#KenjiroOkazaki #PaceGallery #ContemporaryArt","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":1,"dl":null,"ds":null,"ap":true,"rel":false,"q":false},{"now":true,"t":"The Final Film Festival (@tff_festival) begins tomorrow 🎞️","k":"other","s":"2026-08-07","e":"2026-08-09","st":null,"et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/DbtH2valRGc/","x":"The Final Film Festival (@tff_festival) begins tomorrow 🎞️ \n\nHighlights include Bill Gunn's long-overlooked Personal Problems, a rare programme of Richard Heslop shorts, the UK premieres of Women as Lovers and Drinking and Driving, filmmaker Q&As, and much more.\n\n🔗 Discover the full programme and book tickets via the link in bio\n🗓️ The Final Film Festival runs 7 - 9 August \n\n#TheFinalFilmFestival #FilmFestival #PersonalProblems #RichardHeslop #UKPremiere","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-06","ld":1,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"🎬 The Final Film Festival weekend highlights ✨ UK premieres, a 4K restoration and a cul...","k":"screening","s":"2026-08-07","e":"2026-08-09","st":null,"et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/Dbk8kEHlFye/","x":"🎬 The Final Film Festival weekend highlights ✨ UK premieres, a 4K restoration and a cult British rarity...\n\nSaturday opens with Herostratus (1967) – the first film screened at the ICA Cinema on The Mall in 1968 – introduced by Siren Screen (@siren.screen), followed by the UK premiere of You Sorta Know It's Gonna End (2025), a mixtape of shorts by Canadian filmmakers Kalil Haddad and Ryan Steel, with a Q&A.\n\nSunday brings the UK premiere of the 4K restoration of Leos Carax's Pola X, his 1999 adaptation of Melville's Pierre; or, The Ambiguities, and the UK premiere of Patrick Wang's A. Rimbaud (2026), on the life of the French poet, with a Q&A to follow.\n\n🎟️ Tickets via the link in bio\n📅 7 – 9 August\n\n@tff_festival #ICALondon #UKPremiere #LeosCarax #PolaX #PatrickWang #Herostratus #IndependentCinema","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-03","ld":4,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Alison Knowles (1933–2025) broke ground in her approach to the live, performative poten...","k":"performance","s":"2026-08-07","e":"2026-08-09","st":"11:00","et":null,"u":"spine.nyc","c":"New York","co":"","p":"https://www.instagram.com/p/Dbtdf47lNXU/","x":"Alison Knowles (1933–2025) broke ground in her approach to the live, performative potential of non-living materials. As a founding member of the Fluxus group in the late ‘60s, she carried forward the invention of the Event Score—short, simple instructions functioning as performance prompt (eg. “Make a Salad”). Her later Event Threads (begun c. 2000s) seem to translate this logic into sculptural form. \n\nThese hanging, vertical assemblages “thread” together a non-linear timeline from found materials collected over years of walking the streets of New York. Their quiet, talismanic compositions carry remnants from past unscripted activities in a bricolage manner. Much like her early approach to collaborating with technology (eg. programming a printer to self-generate lines of poetry), with this work Knowles understands the city itself as a collaborator; one with its own locus of intelligence.\n\n“Found Gloves In Line” (2018) marks the artist’s final Event Thread. \n\nIt’s the last chance to see this work in “Wetware” at @rainraingallery. Visit us today and tomorrow, 11am–6pm. 110 Lafayette St, 2nd floor\n\nBig thanks to @james_fuentes_llc and @alisonknowlesofficial estate 🤍\n\nFinal slides: other Event Threads on view in “by Alison Knowles: A Retrospective (1960-2022)” touring @bampfa @museumwiesbaden @mamcsaintetienne @nikolajkunsthal @nyugrey","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":1,"dl":null,"ds":null,"ap":true,"rel":true,"q":false},{"now":true,"t":"Today and tomorrow are the final days left to visit Once More Encore: The First Year of...","k":"screening","s":"2026-08-07","e":"2026-08-09","st":null,"et":null,"u":"bennysvide0","c":"New York","co":"","p":"https://www.instagram.com/p/DbtECPlEU2U/","x":"Today and tomorrow are the final days left to visit Once More Encore: The First Year of Benny’s Video Remixed at Kiang Malingue, New York, on view until Friday, August 7 at 50 Eldridge Street. @kiangmalingue \n\nNick Relph\nYour Plastic Gravity Protolith, 2022 \nUnique photogram in frame \n29 1/2 × 19 1/2 inches\nCourtesy of the artist and @gordonrobichaux \n\nWorking with found silk screens leftover from a printing facility, Relph excavates overlaid patterns embedded within meshes intended for reproduction onto light-sensitive colored-paper as a direct index. Like making a palimpsest in the darkroom, Relph’s process reveals fragmented architecture of image reproduction, bringing attention to its contingent material conditions in the expanded field in place of capture via a click of the shutter.\n\n#NickRelph @relphz","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":1,"dl":null,"ds":null,"ap":true,"rel":false,"q":false},{"now":true,"t":"Rediscovering Singapore with some doodles ✏️","k":"other","s":"2026-08-08","e":"2026-08-09","st":null,"et":null,"u":"singaporeartmuseum","c":"Singapore","co":"","p":"https://www.instagram.com/p/DbxmV75Tld9/","x":"Rediscovering Singapore with some doodles ✏️\n\nExplore the rhythms of our Central Business District with 𝘔𝘰𝘮𝘦𝘯𝘵𝘢𝘳𝘺 𝘗𝘶𝘭𝘴𝘦𝘴 and check out these artworks by local artists this National Day!\n\nOn top of this, enjoy free admission on 8-9 Aug at SAM to celebrate! \n\nFind out more via the link in our bio.\n\n#SingaporeArtMuseum #MomentaryPulses #TheEverydayMuseum #NDP2026 #sg61","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Kuni 9. augustini näeb Kumu 5. korruse kaasaegse kunsti galeriis rahvusvahelist grupinä...","k":"workshop","s":"2026-08-08","e":"2026-08-09","st":"13:00","et":null,"u":"kumukunstimuuseum","c":"Tallinn","co":"","p":"https://www.instagram.com/p/DbkZx4jkSUw/","x":"Kuni 9. augustini näeb Kumu 5. korruse kaasaegse kunsti galeriis rahvusvahelist grupinäitust „Galatea triumf. Kunst tehisaru ajastul“. \n\nLaupäeval, 8. augustil tähistame näitust lõpuprogrammiga, mille raames on kavas järgmised üritused:\nKell 13.00–14.00 Anders Härmi kuraatorituur, inglise keeles\nKell 14.30–15.30 Anders Härmi kuraatorituur, eesti keeles\nKell 13.00–16.00 Avatud videomängu töötuba: Papertronics Micro Game Lab, inglise keeles\n\nTöötuba toimub koostöös Eesti Rahvusraamatukogu alla kuuluva videomängude muuseumiga LVLup!. Töötuba juhendab intermeedia kunstnik ning LVLup! eestvedaja Camille Laurelli.\n\n/\n\nUntil 9 August, the international group exhibition “Triumph of Galatea: Art in the Age of Artificial Intelligence” is on view in the Contemporary Art Gallery on the 5th floor of Kumu.\n\nOn Saturday, 8 August, we will celebrate the exhibition with a special finissage programme featuring the following events:\n13:00–14:00 Curator’s Tour of the exhibition, Anders Härm, in English\n14:30–15:30 Curator’s Tour of the exhibition, Anders Härm, in Estonian\n13:00–16:00 Drop-In Video Game Workshop: Papertronics Micro Game Lab, in English\n\nThe workshop takes place in collaboration with the Video Game Museum LVLup! under the Estonian National Library. The workshop is led by intermedia artist and head of LVLup! Camille Laurelli.\n\n@lvlupmuseum @camillelaurelli  #kumu #kumuartmuseum #kumuexhibition #galateatriumf #triumphofgalatea","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":5,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"🎵 Experience your favorite film and game scores live! 🎻🎹","k":"concert","s":"2026-08-09","e":null,"st":null,"et":null,"u":"asianartmuseum","c":"San Francisco","co":"","p":"https://www.instagram.com/p/DbbP1DBDT6y/","x":"🎵 Experience your favorite film and game scores live! 🎻🎹\n\nJoin us for an enchanting afternoon of chamber music with @sixthstationtrio. Featuring stunning violin, cello, and piano arrangements of beloved cinematic masterpieces and iconic video game themes, this is a concert you won't want to miss!\n\nWhether you're a fan of animation scores, gaming soundtracks, or just looking for a gorgeous afternoon of music, let the melodies transport you on Sunday, August 9.\n\nLink in bio for more information.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Having relocated to France in 1982, Iosseliani wasted no time in showing the world he h...","k":"exhibition","s":"2026-08-09","e":null,"st":null,"et":null,"u":"metrograph","c":"New York","co":"","p":"https://www.instagram.com/p/Dbtu0VvE1Pv/","x":"Having relocated to France in 1982, Iosseliani wasted no time in showing the world he hadn’t left his singular gifts behind upon leaving Georgia, taking home the Special Jury Prize at the 41st Venice International Film Festival for this puckish panoramic comedy about dizzying reversals of fortune and everyday acts of larceny, petty and otherwise.⁠\n⁠\nFAVORITES OF THE MOON (1984) plays this Sunday at Metrograph as part of our our series Otar Iosseliani: Fables of Modern Life. ⁠\n⁠\nFollowing on Asia Society’s premiere presentations of Iosseliani’s Georgian trilogy this July, we are presenting the most extensive retrospective of the director's work to appear in New York in a dog’s age, and a precious opportunity to discover—or revisit—a delightful and sui generis artist, tender, trenchant, and terribly funny.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":3,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Do you remember life before smartphones? 🤳 Judith Hopf’s sculptural series “Phone Users...","k":"exhibition","s":"2026-08-09","e":null,"st":null,"et":null,"u":"newmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/Dbyd3iyBRsy/","x":"Do you remember life before smartphones? 🤳 Judith Hopf’s sculptural series “Phone Users” (2021-22) comically dramatizes the physical dynamic between person and device, making the gesture of staring at our phone literally concrete. However virtual the worlds in our computers and cellphones may be, the objects themselves are, nonetheless, as earthly as our own bodies.\n \nTake a selfie with Hopf’s work on view at New Museum before the exhibition “New Humans: Memories of the Future” closes on August 9 🤖\n \n—\n \n📸: Judith Hopf, “Phone User 5,” 2021-2022. Installation view: “New Humans: Memories of the Future,” 2026. Video: Mason Wilson","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"There are only a few days left to experience the “Hall of Robots” gallery in the exhibi...","k":"exhibition","s":"2026-08-09","e":null,"st":null,"et":null,"u":"newmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/DbrEJGMh9SC/","x":"There are only a few days left to experience the “Hall of Robots” gallery in the exhibition “New Humans: Memories of the Future” at the New Museum. From E.T. to a Glass Man to a Xenomorph, there’s plenty to see in the pink-carpeted gallery. 🤖\n \nThe “Hall of Robots” will be on view through Sunday August 9. Get tickets using the link in bio 🔗","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-05","ld":4,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"There’s still time to experience @celesteboursiermougenot’s ‘clinamen,’ a @nytimes Crit...","k":"exhibition","s":"2026-08-09","e":null,"st":null,"et":null,"u":"paulacoopergallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbwAH3bIPU-/","x":"There’s still time to experience @celesteboursiermougenot’s ‘clinamen,’ a @nytimes Critic’s Pick. On view through Sunday, August 9 at The Park Avenue Armory, this is the largest presentation to date of Boursier-Mougenot’s acclaimed ongoing installation, which has captivated audiences at venues around the world.\n\nFor tickets and more information, visit @parkavearmory \n#CélesteBoursierMougenot #PaulaCooperGallery\n__\nInstallation view, ‘Céleste Boursier-Mougenot: clinamen’, Park Avenue Armory, June 10–August 9, 2026. © Céleste Boursier-Mougenot/ADAGP. Courtesy Park Avenue Armory. Photo: Nicholas Knight","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-07","ld":2,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"🎞️ Join us this Sunday for the final screening in The Afterlives of Sugar series, curat...","k":"screening","s":"2026-08-09","e":null,"st":"15:00","et":null,"u":"ibraazlondon","c":"London","co":"","p":"https://www.instagram.com/p/DbklgeYOd1q/","x":"🎞️ Join us this Sunday for the final screening in The Afterlives of Sugar series, curated with Cinelogue (@cinelogue). Sugar Island (dir. Johanné Gómez Terrero @johannegomezterrero, 2024) will screen in our Minassa on Sun 9 Aug at 3pm.\n\n🎟️🔗 Reserve your free ticket on our website via the link in bio.\n\nSet in a Dominican-Haitian batey community surrounded by sugarcane fields, Sugar Island (2024) follows Makenya, a teenager whose unwanted pregnancy forces a sudden confrontation with adulthood. As mechanisation threatens the livelihoods of sugar workers and her family faces displacement, Makenya travels to a parallel dimension where she is faced with evidence of Hispaniola’s colonial and revolutionary history. Blending social realism with Afrofuturist gestures, the film envisions ancestral memory as a foundation for collective resistance. \n\nAs the contemporary anchor of The Afterlives of Sugar, Sugar Island harnesses fictive and documentary modes to examine labour precarity in the Dominican Republic. Director Johanné Gómez Terrero connects the historical violence of sugar production to statelessness and anti-Haitian racism under these conditions.\n\nSugar Island is part of Cinelogue's program Material Fabulations: Afro-Indigenous Film Directors from Latin America, curated by Will Furtado, Editor-in-Chief of C& América Latina (@contemporaryand.americalatina).\n\n#Ibraaz #IbraazLondon #Film","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-03","ld":6,"dl":"2026-08-09","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"🎞️ Sugar Island (dir. Johanné Gómez Terrero @johannegomezterrero, 2024) screens this Su...","k":"screening","s":"2026-08-09","e":null,"st":"15:00","et":null,"u":"ibraazlondon","c":"London","co":"","p":"https://www.instagram.com/p/Dbu8CJojqoP/","x":"🎞️ Sugar Island (dir. Johanné Gómez Terrero @johannegomezterrero, 2024) screens this Sun 9 Aug in our Minassa from 3pm, closing the Afterlives of Sugar programme curated with Cinelogue (@cinelogue).\n\n🎟️🔗 Reserve your free ticket on our website via the link in bio.\n\nSet in a Dominican-Haitian batey community surrounded by sugarcane fields, Sugar Island (2024) follows Makenya, a teenager whose unwanted pregnancy forces a sudden confrontation with adulthood. As mechanisation threatens the livelihoods of sugar workers and her family faces displacement, Makenya travels to a parallel dimension where she is faced with evidence of Hispaniola’s colonial and revolutionary history. Blending social realism with Afrofuturist gestures, the film envisions ancestral memory as a foundation for collective resistance. \n\nSugar Island is part of Cinelogue's program Material Fabulations: Afro-Indigenous Film Directors from Latin America, curated by Will Furtado, Editor-in-Chief of C& América Latina (@contemporaryand.americalatina).\n\n#Ibraaz #IbraazLondon #Film","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-07","ld":2,"dl":"2026-08-09","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"Erfahren Sie mehr über das umfassende Werk des Schweizer Künstlers Urs Frei. 🧹","k":"exhibition","s":"2026-08-09","e":null,"st":"13:00","et":null,"u":"kunstmuseumsg","c":"Zurich","co":"","p":"https://www.instagram.com/p/Dbke4qEOhmN/","x":"Erfahren Sie mehr über das umfassende Werk des Schweizer Künstlers Urs Frei. 🧹\n\n👉🏼 Nehmen Sie teil an der öffentlichen Führung durch die Ausstellung im Kunstmuseum am 9. August 2026 um 13 Uhr.\n\n//\n\nLearn more about the comprehensive work of Swiss artist Urs Frei. 🧹\n\n👉🏼 Join the public guided tour through the exhibition at the Kunstmuseum on 9 August 2026 at 1pm.\n\n#kunstmuseum #kunstmuseumsg #stadtpark #fuehrung #ursfrei\n\n📸 Daniel Ammann","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"In ‘2001: A Space Odyssey’, a journey into space becomes a voyage into humanity’s deepe...","k":"screening","s":"2026-08-09","e":null,"st":"15:00","et":null,"u":"sharjahart","c":"Sharjah","co":"","p":"https://www.instagram.com/p/DbnktV_IGSU/","x":"In ‘2001: A Space Odyssey’, a journey into space becomes a voyage into humanity’s deepest mysteries.\n\nStanley Kubrick’s 1968 masterpiece explores human evolution—from its prehistoric origins to a future shaped by space exploration and technology. With its visionary storytelling and pioneering special effects, the film remains a landmark in science fiction cinema.\n\nFollowing the screening, join a conversation exploring Nietzschean philosophy, AI and the future of humanity with filmmaker Bentley Brown, Assistant Professor, American University of Sharjah.\n\n🍿 ‘2001: A Space Odyssey’ (1968)\n💬 English with Arabic subtitles\n📅 9 August 2026 | 🕒 3:00 pm\n🎬 Film screening + talk\n📍 Photography Gallery, Al Manakh, Sharjah\n\nFree admission. Book your tickets now through the link in our bio.\n\nفي «2001: أوديسة الفضاء»، تتحول رحلة فضائية إلى بحث في أعمق أسرار الوجود الإنساني.\n\nيستكشف فيلم ستانلي كوبريك، الذي أُنتج عام 1968، تطور الإنسان منذ بداياته في عصور ما قبل التاريخ، وصولاً إلى مستقبل تصوغه استكشافات الفضاء والتكنولوجيا. وبفضل سرده البصري الاستشرافي ومؤثراته الخاصة الرائدة، لا يزال الفيلم واحداً من أبرز الأعمال في تاريخ سينما الخيال العلمي.\nبعد العرض، انضموا إلى حوار يتناول فلسفة نيتشه والذكاء الاصطناعي ومستقبل البشرية، مع المخرج بنتلي براون، الأستاذ المساعد في الجامعة الأميركية في الشارقة.\n\n🍿 2001: أوديسة الفضاء (1968)\n💬 بالإنجليزية مع ترجمة إلى العربية\n📅  9 أغسطس 2026 | 🕒 3:00 مساءً\n🎬 عرض فيلم وحوار\n📍 رواق الفوتوغراف، المناخ، الشارقة\n\nالدخول مجاني. احجزوا تذاكركم الآن عبر الرابط الموجود في الوصف.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-04","ld":5,"dl":"2026-08-09","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"RR’s workshops Considering food scraps next Sunday with @the__land encourages participa...","k":"workshop","s":"2026-08-09","e":null,"st":null,"et":null,"u":"reparatieremise","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbtHIQdCPWt/","x":"RR’s workshops Considering food scraps next Sunday with @the__land encourages participants to reevaluate what we typically consider to be the “unusable” parts of plants (even though they are, in fact, edible) through the concept of ‘root to fruit’ cooking 🍽️🤍 cultural norms, convenience culture, and the ‘beigification’ of cooking have encouraged us to either forget or consider it too difficult to be creative with what we cook and how. for people living in cities, who typically have less access to composting, any part of the plant that is not used in cooking is then thrown away to rot in a landfill. \n\nas food decomposes without oxygen, it produces methane which traps about 80 times more heat than CO2 over a twenty year period. so! how can we throw away less food (in general, but especially when we don’t have access to a composting system)? 🐌🥔🌽 In this workshop we will use commonly found dutch vegetables that are often only partially used, such as radishes, carrots, beets, leek and fennel, to create a meal using the entirety of the plants to create a simple, delicious and waste free meal. Participants do not need to bring anything except maybe a small tupperware in the chance that there are leftovers to take home :)","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":3,"dl":null,"ds":null,"ap":false,"rel":true,"q":true},{"now":true,"t":"River Lin (@riverlin1984)’s weeklong intervention ‘My Body is a Para Site’ kicks off to...","k":"performance","s":"2026-08-09","e":null,"st":"16:45","et":null,"u":"parasite.hk","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbiZ31pPBb3/","x":"River Lin (@riverlin1984)’s weeklong intervention ‘My Body is a Para Site’ kicks off tomorrow! Join us on Sunday 9 Aug for the final performance, followed by an artist sharing. \n\n🗓️Sun 9 Aug 2026 \n🕓4pm: Performance\n🕓4:45pm: Artist sharing\n📍Para Site, Quarry Bay\n\nThis chapter marks a pivotal shift in Lin’s ongoing ‘My Body is…’ series: after taking over museums, a library and a university, ‘My Body is a Para Site’ breaks through institutional walls for the first time, traversing across the city.\n\nLin will trace how his practice shifted from unsettling the choreography of institutional spaces—their routines and established agendas—to that of everyday life in public space, through the agency of the body. This sharing dives into the stakes: who is allowed where, and how bodies transform space. Join us to explore an institution as a presence rather than a physical site—wherever we stand and gather.\n\nThe artist sharing will be moderated by Celia Ho (@celiahooo) and Jessie Kwok (@jessie__kwok), co-curators of the programme Elsewhere in Me, and will be conducted in English.\n\n🔗Free and welcome to all of you—registration required via the link in bio!\n\n-\n\n林人中的一週現場介入《我的身體是一個藝術空間》將於星期一正式展開！我們誠邀大家於8月9日（星期日）參與最後一場展演及藝術家分享。\n\n🗓️2026年8月9日（星期日）\n🕓下午4時：展演\n🕓下午4時45分：藝術家分享\n📍Para Site藝術空間（鰂魚涌）\n\n《我的身體是一個藝術空間》標誌着林人中的行為展演系列《我的身體是……》一次關鍵轉向。在相繼進佔博物館、圖書館及大學之後，本作首次跨越機構空間的界限，遊走於城市之中。\n\n林人中將梳理其創作如何運用身體的能動性來擾動空間的編排、慣性與預設意圖，以及如何把焦點從機構運作轉向至公共日常生活。我們會深入探討其中的挑戰和角力：誰有權利進入特定場所？身體可怎樣重塑空間？誠邀觀眾一同思考機構在實體空間以外的可能性——凡是有人在場、相遇之處，皆可成為其現場。\n\n是次分享由《此身彼岸》策展人何思穎及郭芷凝主持，以英語進行。\n\n🔗免費開放，歡迎公眾報名參與——連結置於bio！\n\n-\n\nImage: Key visual of River Lin 'My Body is a Para Site’ Performance & Artist Sharing. Photo: Archi Chang | 圖片：林人中《我的身體是一個藝術空間》展演及藝術家分享主視覺。攝影：張修齊\n\n#ParaSite #ParaSite30 #Performance #Art #ContemporaryArt","r":false,"b":"register","af":true,"so":false,"pd":"2026-08-02","ld":7,"dl":"2026-08-09","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"𝒕𝒆𝒋𝒊𝒆𝒏𝒅𝒐 𝒂 𝒔𝒂𝒏 𝒃𝒆𝒏𝒊𝒕𝒐-","k":"other","s":"2026-08-09","e":null,"st":"15:00","et":"18:00","u":"gmtc.nyc","c":"New York","co":"","p":"https://www.instagram.com/p/DboYRnDHL5K/","x":"𝒕𝒆𝒋𝒊𝒆𝒏𝒅𝒐 𝒂 𝒔𝒂𝒏 𝒃𝒆𝒏𝒊𝒕𝒐-\n 𝖆𝖈𝖙𝖎𝖔𝖓 5: 𝖋𝖑𝖔𝖜𝖊𝖗𝖘 𝖋𝖔𝖗 𝖘𝖆𝖓 𝖇𝖊𝖓𝖎𝖙𝖔\n\naugust 9, sunday, 3-6pm \nrsvp link in bio \n\nwhile rum is one of the most memorable offerings made during san benito processions, flowers are also offered to him. at gmtc, flowers will be transformed into shapes using the same algae gel used to make the rum yarn and forms. \n\n💐 we will provide flowers, and visitors are invited to join in the making and bring a flower if they would also like to offer.\n\ngraphic by @binvin.hrs\nvideos by @fragmentario_","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-08-04","ld":5,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Get one last look at “American Folk Art: Revisiting the Collection of Abby Aldrich Rock...","k":"exhibition","s":"2026-08-09","e":null,"st":null,"et":null,"u":"themuseumofmodernart","c":"New York","co":"","p":"https://www.instagram.com/p/DbqS1qeD5zy/","x":"Get one last look at “American Folk Art: Revisiting the Collection of Abby Aldrich Rockefeller” before it closes on August 9th! \n\nMorris Hirshfield is proof that it’s never too late to become an artist. After retiring from a long career in textile and shoe manufacturing, Hirshfield began making paintings at the age of sixty-five. His stylized paintings quickly drew attention from the art world, and he was the subject of a 1943 exhibition at MoMA. \n\n🐯 “Tiger” is on view now in our third-floor galleries as part of “American Folk Art: Revisiting the Collection of Abby Aldrich Rockefeller.” \n\nCatch this work alongside gems of American folk art before the exhibition closes on August 9! \n\n—\nMorris Hirshfield. “Tiger.” 1940. Abby Aldrich Rockefeller Fund. © 2026 Robert and Gail Rentzer for Estate of Morris Hirshfield / Artists Rights Society (ARS), NY","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"Free Second Sundays August is just around the corner! Join us on Sunday, August 9, for ...","k":"other","s":"2026-08-09","e":null,"st":null,"et":null,"u":"whitneymuseum","c":"New York","co":"","p":"https://www.instagram.com/p/DblL7jXleVh/","x":"Free Second Sundays August is just around the corner! Join us on Sunday, August 9, for a full day of free programming including:\n\n🎟️ Free admission all day\n📚 Storytime with @libreria_barco_de_papel\n🏙️ All Ages Artmaking: Skyline Sketches\n💡 Tours and talks in English and Spanish\n✏️ All Ages Artmaking: Drawing what matters most\n\nLink in bio to read more and reserve your free tickets.\n—\n¡El Segundo Domingo Gratis de agosto está a la vuelta de la esquina! Acompáñanos el domingo 9 de agosto para disfrutar de un día entero de actividades gratuitas, que incluyen:\n \n🎟️ Entrada gratuita todo el día\n📚 Hora del cuento con @libreria_barco_de_papel\n🏙️ Arte para todas las edades: Bocetos del horizonte\n💡 Recorridos y charlas en inglés y español\n✏️ Arte para todas las edades: Dibujando lo que más importa\n \nVisita el enlace en la bio para leer más y reservar tus boletos gratuitos.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-03","ld":6,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":true},{"now":true,"t":"Until 10 August, the entire Sonic Acts webshop will be available with reduced prices, i...","k":"other","s":"2026-07-09","e":"2026-08-10","st":null,"et":null,"u":"reimagineeurope","c":"","co":"","p":"https://www.instagram.com/p/Dak1K5XDSe7/","x":"Until 10 August, the entire Sonic Acts webshop will be available with reduced prices, including books, magazines, sonic releases, and merch. Many titles – including titles accompanying projects from recent years through the Re-imagine Europe programme – are available at their lowest prices to date, while some publications and releases are down to their final copies. \n\nLink on their profile 🖇️","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-09","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Aviva Silverman and Emily Shinada’s “Is terraforming reincarnation?” (2015) resembles a...","k":"other","s":"2026-08-07","e":"2026-08-10","st":"11:00","et":null,"u":"spine.nyc","c":"New York","co":"","p":"https://www.instagram.com/p/DblJt8CETcj/","x":"Aviva Silverman and Emily Shinada’s “Is terraforming reincarnation?” (2015) resembles an observation tower in miniature. The object’s thin vertical apertures invite you to peer into its hollow chamber. Inside, a mirrored interior multiplies a desertified sun symbol and lone cowboy figure. The effect is both concave and convex; zoetrope and kaleidoscope.\n\nWhere an icon like the cowboy travels through images like a Trojan horse—injecting myths of manifest destiny, conquest, and protection into the body that beholds it—the work tests the ways complex narratives proliferate like code, lodging themselves in reality through the very act of looking.\n\nThis is the final week to see Wetware at @rainraingallery! Closing this Friday, August 7. Visit us Tue–Fri, 11am–6pm or DM to make an appointment 🌞","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":4,"dl":null,"ds":null,"ap":true,"rel":false,"q":false},{"now":true,"t":"𒀭We’re honoured to have commissioned graphic designer and academic Can Yang @solxus to ...","k":"exhibition","s":"2026-08-10","e":null,"st":null,"et":null,"u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/Da219QXiggz/","x":"⠀\n𒀭We’re honoured to have commissioned graphic designer and academic Can Yang @solxus to create the visual identity for zero material (^з^)-☆\n\nCan’s research explores how visual systems construct, circulate and destabilise meaning across post-digital and translingual conditions — with close attention to the cultural and political dynamics of image production.\n\nHer design for zero material is a direct response to the programme’s manifesto. The identity is built from the everyday: notes, text messages, manifestos circulated by email, open calls saved, printed and shared.\n\nIn doing so, the design makes visible the hidden labour of organising a programme — drawing attention to the ordinary tools, formats and infrastructures through which cultural production comes into being.\n⠀\n⠀\n⚑ Apply to the open call: Kakilang is commissioning one artist with a conceptual or visual arts practice to develop a new body of work. The artist will receive £2,500 and a production budget. Open call deadline is 10 August 2026. \n⠀⠀\n☛ For full details, visit the link in bio:\nwww.kakilang.org.uk/2026-open-call-zero-material\n⠀\n⠀\n#zeromaterial #canyang @can.grafik","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":25,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"⚑ Open Call: Kakilang is commissioning one ESEA artist with a conceptual or visual arts...","k":"talk","s":"2026-08-10","e":null,"st":null,"et":null,"u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/Daf-B2Kjn9b/","x":"⠀\n⚑ Open Call: Kakilang is commissioning one ESEA artist with a conceptual or visual arts practice to develop a new body of work, with a public presentation in spring 2027. \n⠀\n𒀭zero material manifesto: \nIn an age of scarcity and excess, what forms of art making remain relevant? zero material recognises that each material, whether tangible or intangible, carries its own agency that awaits to be exercised creatively — informed by diasporic experience, it proposes unorthodox approaches like hacking, smuggling and piggybacking as artistic practice.\n⠀\n❥ Artist fee: £2,500 + production budget \n⛸︎ Open call deadline: 10 August 2026 \n⠀\n☛ For full details, visit the link in bio:\nwww.kakilang.org.uk/2026-open-call-zero-material\n⠀\n❛ Programme developed by Liang-Jung Chen @chen_liangjung \n❛ Visual identity designed by Can Yang @can.grafik \n⠀\n✤ With thanks to Rhine Bernardino @rhineandshine for joining the selection panel","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-07","ld":34,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"𒀭 Introducing our zero material open call selection panel: Chen Liang-Jung","k":"talk","s":"2026-08-10","e":null,"st":null,"et":null,"u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/DbYpuA_jsp9/","x":"𒀭 Introducing our zero material open call selection panel: Chen Liang-Jung\n\n@chen_liangjung is an artist and researcher interested in how artefacts and interface can be observed, redirected and reconfigured as creative material. Her practice creates intervention in the infrastructures that quietly shape everyday life.\n\nIn her project UK Indefinite Leave to Remain Application Fee (2025), Liang-Jung smuggles her own immigration process as artwork — treating bureaucratic experience and administrative labour as artistic media.\n\n⚑ zero material is the perfect opportunity for an artist with a conceptual or visual arts practice looking to develop a new body of work alongside a public presentation in Spring 2027.\n\n❥ Artist fee: £2,500 + production budget \n⛸︎ Open call deadline: 10 August 2026 \n⠀⠀\n☛ For full details, visit the link in bio\n⠀\n#zeromaterial #chenliangjung","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":12,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"𒀭Our Artistic Director Howl Yuan will be part of our zero material programme selection ...","k":"performance","s":"2026-08-10","e":null,"st":null,"et":null,"u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/DbI-Tmtq62m/","x":"𒀭Our Artistic Director Howl Yuan will be part of our zero material programme selection panel!\n\nHowl Yuan 原承伯 @howlyuan is a performance maker and cultural organiser. Working across live, site-responsive performance, installation and participatory practice, he creates intimate experiences that invite audiences to navigate memory, migration and belonging through walking, objects, conversation and shared encounters.\n\nThe image above is from [Waiting Between…], a constructed visual work using debris washed ashore to symbolise the experience of waiting as a condition of life on a border island. Rather than representing borders as sites of movement or transition, it explores the suspended temporality of a place shaped by stillness, repetition, and the slow passage of time.\n\n⚑ zero material is the perfect opportunity for an artist with a conceptual or visual arts practice looking to develop a new body of work alongside a public presentation in Spring 2027.\n\n❥ Artist fee: £2,500 + production budget \n⛸︎ Open call deadline: 10 August 2026 \n⠀⠀\n☛ For full details, visit the link in bio\n⠀\n#zeromaterial #howlyuan","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":18,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Abasement 89","k":"other","s":"2026-08-10","e":null,"st":"19:00","et":null,"u":"abasement_nyc","c":"New York","co":"","p":"https://www.instagram.com/p/DbnxwvmslEF/","x":"Abasement 89\n\nFree ENTRY!\nMonday August 10, 2026. \nDoors at 7pm. \n• Jon Catler\n• DIETRICHS \n• Michael R. Bernstein\n• NEPENTHAUS\n• DJ: DJ Joe P\n• Visuals: Scott Kiernan\n• Projections: Bradley Eros\n\nIn the basement of @artistsspace . \n11 Cortlandt Alley, New Yok 10013 . \n\nFlyer by @joefrivaldi\n\n#abasement #artistsspace #experimantalmusic #undergroundmusic #freelivemusic","r":false,"b":"doors","af":true,"so":false,"pd":"2026-08-04","ld":6,"dl":"2026-08-10","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Faith Icecold (b. 1989) treats the image itself as a sedimentary material. In “Wetware”...","k":"other","s":"2026-08-04","e":"2026-08-11","st":"11:00","et":null,"u":"spine.nyc","c":"New York","co":"","p":"https://www.instagram.com/p/DbnsrNnEb8X/","x":"Faith Icecold (b. 1989) treats the image itself as a sedimentary material. In “Wetware” the artist’s new jacquard works are interlace virtual and material processes: \n\nPhotographed work surfaces (“Howardena’s Spray Booth” and “Art Students League Table”) form the abstracted, textured fields on top of which smaller, found-photo vignettes float. Their untethered layers move in a parallel flow: of data and of paint, both now dried down. Icecold then reproduced these collage-composites via jacquard loom. \n\nAs the digital file is re‑embodied in woven thread, its colors are compressed through the limits of the yarn palette. Icecold’s material is transformed by the physical conditions of its transmission. \n\nIt’s the FINAL WEEK to see these works at @rainraingallery. Visit us today through Friday, 11am–6pm or DM to make an appointment. 110 Lafayette St, 2nd floor 🩵","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":true,"rel":true,"q":false},{"now":true,"t":"Please join us TODAY for the final day of \"Splash\". We are open 12 - 6PM.  AND at 7PM w...","k":"screening","s":"2026-08-08","e":"2026-08-11","st":"12:00","et":"18:00","u":"hesse_flatow","c":"New York","co":"","p":"https://www.instagram.com/p/DbyScLWm_p_/","x":"Please join us TODAY for the final day of \"Splash\". We are open 12 - 6PM.  AND at 7PM we will be having a special screening of \"Panoramic View - Portrait of the Artist Francine Tint\". ⁠\n⁠\n ⁠A sharp-witted and uncompromising New York painter who’s been creating brilliant work since the 1970s finally earns the recognition she was long denied by the male-dominated world of Abstract Expressionism.⁠ ⁠ Francine Tint is a New York-based painter whose career spans over five decades. Known for her powerful commitment to postwar American abstraction, Tint creates works that combine bold, intuitive gesture with a distinctive and often unexpected sense of color. Ranging in scale from intimate compositions to monumental canvases nearly 20 feet in width, her paintings channel an immediate and emotionally resonant energy through sweeping, layered brushwork, at times lyrical and fluid, at others raw and rapid. She has developed a visual language that brings together the expansive chromatics of Color Field painting with the gestural force of Abstract Expressionism.⁠ ⁠⁠ Pola Rapaport is a New York-based writer, director, and editor. Multi-award and grant winning filmmaker. Founder of Blinding Light, Inc. film production company with her husband, DP Wolfgang Held, ASC. Guggenheim, NYFA & Yaddo Fellow and Emmy nominee. On faculty at NYU Film. ⁠ ⁠ Saturday, August 8, 2026⁠ 7PM: Screening ⁠ 730PM: Q&A with film director Pola Rapaport⁠ ⁠\n⁠ ⁠\nHESSE FLATOW EAST⁠ 68 Schellinger Road⁠ Amagansett, NY 11397⁠ ⁠ ⁠Please bring your own blankets and chairs. ⁠","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":0,"dl":null,"ds":null,"ap":true,"rel":false,"q":false},{"now":true,"t":"It is the FINAL DAY to catch \"Splash\", a group exhibition presented at HESSE FLATOW EAS...","k":"exhibition","s":"2026-08-08","e":"2026-08-11","st":"12:00","et":"18:00","u":"hesse_flatow","c":"New York","co":"","p":"https://www.instagram.com/p/DbyB0zQG4I-/","x":"It is the FINAL DAY to catch \"Splash\", a group exhibition presented at HESSE FLATOW EAST, Amagansett, in collaboration with Night Gallery.⁠ The gallery will be open today 12-6pm.⁠\n⁠\nThe artists presented in \"Splash\" come from Long Island and beyond, from New York, Los Angeles, San Francisco, and Atlanta, with distinct practices that share a commitment to the possibilities of non-representational form. The works on view span a range of approaches to abstraction: gestural and geometric, luminous and dense, intimate and expansive. What unites them is not a shared style or medium but a shared reckoning with color, surface, and mark as primary languages, and with the question of what abstraction can hold. In bringing these visions together at HESSE FLATOW EAST—a space that once served as Donald Baechler’s studio—the exhibition situates contemporary abstraction within a lineage it neither defers to nor escapes, proposing instead a living conversation across generations, geographies, and identities.⁠\n⁠\nImage: sonia louise davis, \"emergence: past + present= future\" 2024 Merino, alpaca/wool blend, acrylic/wool blend, recycled cotton, wool, acrylic, and polyester yarns. 48 x48 x 2 inches 50 1/4 x 50 1/4 inches framed. Photo: Jenny Gorman.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":0,"dl":null,"ds":null,"ap":true,"rel":true,"q":false},{"now":true,"t":"We are delighted to celebrate our two-person exhibition \"Ladder / Chain\" with the next ...","k":"talk","s":"2026-08-11","e":null,"st":"18:30","et":null,"u":"hesse_flatow","c":"Tokyo","co":"","p":"https://www.instagram.com/p/DbilExlFs54/","x":"We are delighted to celebrate our two-person exhibition \"Ladder / Chain\" with the next iteration of our \"In Conversation\" series, featuring the artists Juyon Lee and Emma Safir with Sculpture Center Curatorial Fellow Sharon Liu on Tuesday, August 11 at 6:30pm.⁠\n⁠\nWe hope to see you there!⁠\nRVSP to info@hesseflatow.com⁠\n⁠\nSharon X. Liu is a curator based in New York. Her practice investigates inter-Asian connections shaped by border-crossing dialogues. Recent projects include Translation in the Expanded Field, Tokyo (2025); Open Admissions: Michael Rakowitz and Early Amherst College Collections, Mead Art Museum (2025); and Laborious Hands, Amherst College Library (2024–25). Sharon holds a BA in Art History and Mathematics from Wellesley College, an MA in East Asian Studies from Yale University, conducted research at Tokyo University of the Arts, and publishes essays in Artforum China and Ocula. She is currently the 2025 Asymmetry Curatorial Fellow at SculptureCenter.⁠\n⁠\n@juyon_⁠\n@grem.jpg⁠\n@sharonxyza","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-02","ld":9,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"CT DSA is proud to announce our endorsement of Justin Farmer for State Representative i...","k":"other","s":"2026-08-11","e":null,"st":null,"et":null,"u":"ct.dsa","c":"New Haven","co":"","p":"https://www.instagram.com/p/DZc-t0OxTgw/","x":"CT DSA is proud to announce our endorsement of Justin Farmer for State Representative in the 92nd House District, in the Democratic Primary on August 11th!\n\nWe’re proud to endorse Justin, a founding member of CT DSA and fighter for the multiracial working class who has struggled alongside us to bring change both in the streets and through his extensive history in elected office.\n\nJustin grew up in Newhall in southern Hamden, on land contaminated by decades of industrial pollution. He has since built a career in brownfield remediation, fighting to make polluters clean up their mess, and organizing the Six Lakes Park Coalition to turn a former powder farm into a public park. When he knocked on his first campaign doors in 2017, he was wearing noise-canceling headphones to manage his Tourette’s Syndrome.\n\nAs a Hamden Legislative Councilor, Justin led the fight to abolish prison gerrymandering in Connecticut and was a driving force behind the state’s Right to Counsel law, guaranteeing legal representation to tenants facing eviction. He has stood with immigrant communities, marched with Black Lives Matter New Haven, and built a block of socialist legislators and organizers who share his vision that a better world is possible.\n\nThe 92nd District — covering Westville, Edgewood, Amity, Dwight, West River, and the Hill — has had the same representative for 42 years. Justin Farmer is running to change that.\nLet’s send Justin Farmer, a proud Democratic Socialist, to the Connecticut State House! 🌹","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-11","ld":61,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Join us next Tuesday from 6:30–7:30pm at ISCP for Artists at Work with Saemundur Thor i...","k":"performance","s":"2026-08-11","e":null,"st":"18:30","et":"19:30","u":"iscp_nyc","c":"New York","co":"","p":"https://www.instagram.com/p/DboeuLUiQYi/","x":"Join us next Tuesday from 6:30–7:30pm at ISCP for Artists at Work with Saemundur Thor in conversation with Brianna Leatherbury. \n\nThey will speak about Thor’s exploration of institutional systems that shape and often fail us, the intersection of financial anxiety and desire, as well as the development of his new project, the ‘Social Bank,‘ an artist-run financial service established in Amsterdam that provides interest-free loans. \n\nAbout the speakers 🗣️\n\nSaemundur Thor is an Icelandic artist based between Reykjavik and Amsterdam. He works across a broad spectrum of visual culture, including film, finance, fashion and mass media. His practice seeks to intervene in the public imagination and operate as an active agent in society. Thor has exhibited work at de Appel, Amsterdam; Reykjavik Art Museum, Reykjavik; Goethe Institut, Beijing, and ICA, Singapore among others.\n\nBrianna Leatherbury’s practice shuffles spaces of productivity to create dissonant and abstract systems. Working across sculpture, performance, and site, they seek an intimate connection from the work’s interaction with spatial constructs. Their sculptures explore the material and historic definitions of “resources,” identifying and exaggerating their expressions within our present-day industries. Leatherbury has exhibited work at the 15th Kaunas Biennale, Lithuania; Jan Kaps, Denmark; 15th Gwangju Biennale, Korea; CAPC, France; Brunette Coleman, United Kingdom; and The Hartwig Foundation, The Netherlands.\n\n📍1040 Metropolitan Ave, Brooklyn\n\nImage: Saemundur Thor, ‘Social Bank,’ 2025, project at de Appel, Amsterdam. Photo by Nikola Lamburov","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-04","ld":7,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Polizeibericht Überfall (Accident), Ernö Metzner, 1928, 16mm, 21 mins","k":"screening","s":"2026-08-11","e":null,"st":"19:00","et":null,"u":"lightindustry","c":"New York","co":"","p":"https://www.instagram.com/p/DbtMEyNIAFE/","x":"Polizeibericht Überfall (Accident), Ernö Metzner, 1928, 16mm, 21 mins\n+\nBrothers (Brüder), Werner Hochbaum, 1929, 78 mins\nTuesday, August 11, 2026, 7pm\nLight Industry, 361 Stagg Street, Suite 407, Brooklyn\n\nThough the Weimar era represents one of the more familiar and beloved avenues of repertory cinema, many of its side streets, exceptional in their own right, remain under-explored by today’s rep rats. This evening slips down two such alleys. We first learned of Brothers, the debut feature by Werner Hochbaum, from its inclusion in the series Annette Michelson organized as part of the ICA Boston’s 1992 exhibition Montage and Modern Life, where it screened alongside Sergei Eisenstein’s October and King Vidor’s The Crowd, among others. And indeed you will find, in Brothers’s overall design, an illustration of how the Soviet revolution in editing first expanded to Europe and beyond. But there is still more to this film, whose central drama is the Hamburg dockworkers’ strike of 1896-97, and in which a nonprofessional cast of dockworkers starred. As a movie produced with the support of both unions and the Social Democratic Party, it’s a revealing experiment in filmmaking underwritten by working-class institutions—the film was often shown at labor meetings following its initial release, a catalyst for members to reflect on their own circumstances. Perhaps more memorable than Brothers’s montage are its compositions: of a harbor half-frozen, a fist clenched, a face enervated by illness. So much of the film’s power resides, unexpectedly, in its moments of stillness and stasis.\n\nOpening the double bill is Ernö Metzner’s Polizeibericht Überfall, another important silent film to emerge from the German left of the 1920s (Metzner cut his teeth making propaganda films for the SDP). Here is a weird tale of a man who stumbles upon a coin that, unbeknownst to him, brings its owner ill fortune. What follows is a parade of ignominy, a fable about the curse money casts upon human affairs, which culminates in an extended sequence of hallucinatory anamorphic distortion...\n\nFull announcement: light industry.org/uberfall-brothers","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-06","ld":5,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"𝟭 𝗞𝗲𝘆𝘄𝗼𝗿𝗱, 𝟮 𝗤𝘂𝗲𝘀𝘁𝗶𝗼𝗻𝘀, 𝟯 𝗣𝗲𝗼𝗽𝗹𝗲, 𝟰 𝗠𝗶𝗻𝘂𝘁𝗲𝘀","k":"exhibition","s":"2026-08-11","e":null,"st":"16:30","et":null,"u":"qlim_","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbtD5MWCEW5/","x":"𝟭 𝗞𝗲𝘆𝘄𝗼𝗿𝗱, 𝟮 𝗤𝘂𝗲𝘀𝘁𝗶𝗼𝗻𝘀, 𝟯 𝗣𝗲𝗼𝗽𝗹𝗲, 𝟰 𝗠𝗶𝗻𝘂𝘁𝗲𝘀\n𝙄𝙢𝙥𝙧𝙤𝙫𝙞𝙨𝙖𝙩𝙞𝙤𝙣, 𝙋𝙖𝙧𝙖𝙡𝙡𝙖𝙭, 𝙁𝙧𝙖𝙜𝙢𝙚𝙣𝙩\n\nTuesday, August 11, 2026\n16:30-17:45\nBuurtsalon Jeltje, Grote Zaal\nEerste Helmersstraat 106-N\n1054 EG Amsterdam\n\n𝟭 𝗞𝗲𝘆𝘄𝗼𝗿𝗱, 𝟮 𝗤𝘂𝗲𝘀𝘁𝗶𝗼𝗻𝘀, 𝟯 𝗣𝗲𝗼𝗽𝗹𝗲, 𝟰 𝗠𝗶𝗻𝘂𝘁𝗲𝘀 is a series of public conversations on keywords drawn from time-based practices. Organized by artists Min Oh and Kyulim Kim, the series opens a dialogue across July and August by inviting a different artist each week, creating a space where distinct practices, disciplines, and ways of thinking encounter one another.\n\nThe format is straightforward:\n – 1 keyword: each participant introduces one keyword in 4 minutes.\n – 2 questions: each participant asks one question to each of the other two speakers.\n – 3 people: each session features Min Oh, Kyulim Kim, and a weekly guest.\n – 4 minutes: every question-and-answer exchange is limited to four minutes.\n – After 36 minutes, the conversation opens to the audience.\n\nMin Oh explores the superposition of heterogeneous genres, media, and roles, as well as how time is perceived, consumed, or generated in that encounter. @min___oh___ \n\nKyulim Kim investigates damage, loss, restoration, and movement through imaging technologies that reveal what usually remains unseen. @qlim_\n\nGuest: Fransisca Angela explores personal narratives and intergenerational perspectives, using fragments as a language to weave together multiple voices, temporalities, and living histories. @fransiscangela\n\nAugust guests:\nAugust 4 Pam Virada @_pamvirada\nAugust 11 Fransisca Angela @fransiscangela\nAugust 18 Luis Lecea Romera @luislecea","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"In a world like ours, there are countless final girls. Shaking, alive, and resourceful.","k":"performance","s":"2026-08-11","e":null,"st":null,"et":null,"u":"creightonbaxter","c":"","co":"","p":"https://www.instagram.com/p/DbgR14xlAnC/","x":"In a world like ours, there are countless final girls. Shaking, alive, and resourceful. \n\nI’ll be activating the draft of a new performance on August 11th at @humanresourcesla for Final Girl Infinity Portal curated by @standarized_sext \n\nThe event will feature performances and video works by: Jasmine Nyende, Liz Lee, Young Joon Kwak, Marcelline Mandeng Nken, and myself \n\nHope to see you there <3","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"A lifelong New Yorker, Bettina (1927–2021) gleans the city as an unpredictable processo...","k":"other","s":"2026-08-05","e":"2026-08-12","st":"11:00","et":null,"u":"spine.nyc","c":"New York","co":"","p":"https://www.instagram.com/p/DbqG4HzkV6g/","x":"A lifelong New Yorker, Bettina (1927–2021) gleans the city as an unpredictable processor, much like the human brain. In her “Phenomenological New York” photographs (1972-1977), the grid—architecture’s most insistent claim to order—is liquefied by its own reflective facades.\n\nBettina’s rigorous, system‑driven practice was informed by personal studies in mathematics, physics, and mysticism as well as her Orthodox Jewish upbringing. Hers was a process of pattern recognition, looking for the unseen structures guiding everyday life—what she described as “noumenological research.” \n\nThere’s a beautiful and intelligent text on Bettina’s work in the new issue of @muttartreview by @ceciliabien along with a small portfolio of her work. Get yourself a copy!\n\nAnd it’s the FINAL WEEK to see Bettina’s works in “Wetware” at @rainraingallery. Visit us today through Friday, 11am–6pm or DM to make an appointment. 110 Lafayette St, 2nd floor \n\nThanks to @ulrik.nyc @bettina_estate 🖤","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":0,"dl":null,"ds":null,"ap":true,"rel":true,"q":false},{"now":true,"t":"Now Showing, August 6–12","k":"screening","s":"2026-08-06","e":"2026-08-12","st":"06:30","et":null,"u":"movingimagenyc","c":"New York","co":"","p":"https://www.instagram.com/p/DbqvFJunIdh/","x":"Now Showing, August 6–12\n  \nSCREENINGS: \n \nAmadeus (70mm)* \nFRIDAY AT 6:30 \nSUNDAY AT 3:00 with producer Paul Zaentz \n \nNight of the Creeps – 40th Anniversary \nFRIDAY AT 7:00 \n \n∞ Infinity Day: Short Films about Math \nSATURDAY AT 11:30 • FREE WITH RSVP • FAMILY FRIENDLY \n \nFirst Man (Dolby Atmos) \nSATURDAY AT 12:30  \n \nCatVideoFest 2026  \nSATURDAY AND SUNDAY AT 1:00 • FAMILY FRIENDLY \n \n2001: A Space Odyssey (70mm) \nSATURDAY AT 4:00  \n \nHenson Fan Appreciation Day: A Salute to Henson Fans (But Mostly ToughPigs)* \nSUNDAY AT 12:30 \n \n \nPROGRAMS: \n \nMoMI LAB   THURSDAY, 2:00–6:00 • FREE \nFRIDAY, 2:00–8:00 • FREE \nSATURDAY AND SUNDAY, 11:00–6:00 • FREE \n \nJim Henson Exhibition Guided Tours \nTHURSDAY AT 4:00 \nSATURDAY AT 3:00 \n \nYoga in the Courtyard with The Yoga Room \nSATURDAY AT 9:45 • FREE WITH RSVP \n \n∞ Infinity Day: Parallel Universes Explained!  \nScreening + discussion with Niccolo Bigagli \nSATURDAY AT 3:00 • FREE WITH RSVP \n \n∞ Infinity Day: Communicating Infinity in Manhood, curated by @dallasgol...","k":"other","s":"2026-07-24","e":"2026-08-14","st":null,"et":null,"u":"justincayd","c":"Minneapolis","co":"","p":"https://www.instagram.com/p/DbLs_n_u1jq/","x":"ANATOMY OF A WALKER CINEMA TRAILER — Once Upon a Time in Manhood, curated by @dallasgoldtooth. \n\nDesigning and editing Moving Image trailers is always a pleasure, but this one, man—this one required something next level. Without Justin’s medulla oblongata, Justin could not have regulated heart rate, blood pressure, or breathing necessary for construction. \n\nThe sheer variety of films raised my personal expectations for what this trailer could (and should) be. Melodramatic emotions, musical cues. Big-time booms; felt deeply during cinema playback. And, of course, the 80s/90s era movie-trailer voice, provided by my friend and collaborator of twenty years, Rhett Romsaas. \n\nThe series runs through August 14 ➝ walkerart.org for tickets\n\nTrailer Voiceover:\n@rhettending \n\nMoving Image Team:\n@pablo_oto \n@ppppatriicia \n@makenzieflom \n@laflammmme \n\nSeries Identity:\n@_brianhuddleston \n\nDesign Director:\n@marklifeofthemind \n\nAssociate Director of Marketing: \n@_laurahhhhhhhh \n\n#walkerartcenter #walkercinema #dallasgoldtooth #premierepro @walkerartcenter","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-07-24","ld":0,"dl":"2026-08-14","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Untitled (Figure and Sunset) 2026 / watercolor and oil on linen over artist made panel ...","k":"talk","s":"2026-07-27","e":"2026-08-14","st":null,"et":null,"u":"manicbixidreamgirl","c":"New York","co":"","p":"https://www.instagram.com/p/DbTId-ZOoIE/","x":"Untitled (Figure and Sunset) 2026 / watercolor and oil on linen over artist made panel / 6x7\n\non view in the project room at @hesse_flatow until August 14th ☀️\n\nphoto by Jenny Gorman","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Safir’s plush, wall-mounted panels similarly precipitate image as object, yet her visua...","k":"exhibition","s":"2026-07-30","e":"2026-08-14","st":"11:00","et":null,"u":"hesse_flatow","c":"New York","co":"","p":"https://www.instagram.com/p/DbbDQiokpdd/","x":"Safir’s plush, wall-mounted panels similarly precipitate image as object, yet her visuals arrest on obstructed thresholds that separate interior and exterior worlds, often capturing reflections bouncing against curtained windows or the obfuscatory patterning of privacy glass. Photographs taken during her travels are layered with scans of fabric and lace casts or analog rubbings of domestic, baroque fixtures before being printed on silk. As part of her ongoing investigations into histories of “women’s work” and the decorative, Safir meets this digital collaging or stitching together with a literal stitch. Her upholstered panels are adorned with pewter elements, beaded appliqués, pleating, smocking, and other forms of fabric manipulation.⁠\n⁠\n\"Ladder/Chain\": Juyon Lee and Emma Safir is on view at the gallery's Tribeca location through August 14. Summer hours are Monday-Friday, 11am-6pm.⁠\n⁠\nImage: Emma Safir, \"Black Eyed Susans\", 2026. Digitally printed silk, pewter, mirrored glass beads, reflective thread, neoprene, flashe paint, 20 x 28 x 1 1/2 inches (50 x 71 x 3 cm). Courtesy of the artist and HESSE FLATOW. Photo: ©Jenny Gorman.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"⁠Our project room presentation of new paintings by our 2026 summer residents, Bix Arche...","k":"talk","s":"2026-07-31","e":"2026-08-14","st":"11:00","et":null,"u":"hesse_flatow","c":"New York","co":"","p":"https://www.instagram.com/p/DbduWiHE4SU/","x":"⁠Our project room presentation of new paintings by our 2026 summer residents, Bix Archer and Mason Owens, is on view at the gallery's Tribeca location through August 14. Summer hours are Monday-Friday 11am-6pm.⁠\n⁠\nBix Archer approaches painting as a process of rendering experience beyond vision. Dwelling in spaces of encounter between the known and unknown, from bedrooms and driveways to suburban forests and public beaches, Archer allows the process of en plein air painting to guide her into new spaces and to see familiar ones differently. Rather than painting as an act of fixing something into place, Archer commits herself to observation, embracing the instability of the world and its constant transformation. Through painting, she argues for a perceptual mode that centers around disruption, dissolution, and a kind of queer side-eye. ⁠During her visit to Amagansett she observed the world around her including Lee Krasner's gravesite. ⁠\n⁠\nImages:⁠\nBix Archer (b. 1997)⁠\nLee's Stone, 2026⁠\nOil on artist made wood panel⁠\n8 x 10 inches⁠\n⁠\nBix Archer (b. 1997)⁠\nGrove Street Tangle, 2026⁠\nOil on artist made wood panel⁠\n10⅛ x 8⅛ inches⁠\n⁠\nBix Archer, \"Midday Rosebush\", 2026. ⁠\nOil on artist made wood panel, ⁠\n9¼ x 12 inches. ⁠\n⁠\nBix Archer, \"Evening Rosebush\", ⁠\n2026. Oil on artist made wood panel, ⁠\n9 x 10¼ inches. ⁠\n⁠\nCourtesy of the artist and HESSE FLATOW. Photo: Jenny Gorman.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"another painting of the rosebush, done in the sunlight from the other side, after some ...","k":"other","s":"2026-08-03","e":"2026-08-14","st":null,"et":null,"u":"manicbixidreamgirl","c":"New York","co":"","p":"https://www.instagram.com/p/DblMxgRDupx/","x":"another painting of the rosebush, done in the sunlight from the other side, after some time had passed and arrow-tipped buds had begun to emerge\n\nmy two-person show with @mason_owenss continues in the project room at @hesse_flatow through August 14th\n\nMidday Rosebush / oil on wood / 9.25”x12”\n documentation by Jenny Gorman","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“In Parabolic Traces – scrolling around held hands, 3D scanned I, two held hands appear...","k":"exhibition","s":"2026-08-04","e":"2026-08-14","st":"11:00","et":null,"u":"hesse_flatow","c":"New York","co":"","p":"https://www.instagram.com/p/DbnuqL9FYxJ/","x":"“In Parabolic Traces – scrolling around held hands, 3D scanned I, two held hands appear simultaneously truncated and collaged. The work considers the hand as a nodal part of the body for human connection. When Lee visited her grandmother, whom she calls umni (an endearing term the artist uses in a Korean dialect), in the winter of 2025, she 3D scanned their hands held together on a mobile device. Considering the hand's invisibility in screen-based communication, Lee's photo-based glass work draws attention to a sense of embodied longing. Woven into the screenshots of the held hands are splices of a photograph of a sunset—a marker of curving time stretched in visible light—experienced and captured by the artist herself in Brooklyn, New York.\nRevealing how the hands are literally merged and visually melted into one another, the 3D scan outlines multiples of the held hands like a continuing landscape. The glitched scan becomes a flattened translation of a connection that feels inseparable, yet remains physically distant.”\n⁠\n\"Ladder / Chain\": Juyon Lee and Emma Safir is on view at the gallery's Tribeca location through August 14. Summer hours are Monday-Friday, 11am-6pm.⁠\n⁠\nImage: Juyon Lee, \"Parabolic Traces - scrolling around held hands 3D scanned I\", 2026. Decals of hand-woven photographs in fused glass, custom brass mount, Glass: 25 3/4 x 10 1/2 x 1/8 inches (65 x 26 x 3.1 cm). Courtesy of the artist and HESSE FLATOW. Photo: Jenny Gorman.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"✂️✂️⁠","k":"exhibition
