8","ld":8,"dl":"2026-08-16","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Hypha Studios × Frieze London 2026 · Open Call","k":"exhibition","s":"2026-08-16","e":null,"st":"18:00","et":null,"u":"opencallpalette","c":"London","co":"","p":"https://www.instagram.com/p/Dbvx7kulevN/","x":"Hypha Studios × Frieze London 2026 · Open Call\nFree exhibition space · Central London, UK\nCollectives & curators · UK-based · Free to apply\n\nWhat you get:\nFree gallery space in Central London · ~4 weeks, October–November 2026\nMultiple Hypha Galleries locations, size varies by proposal\nCoincides with Frieze London 2026\n⚠️ In exchange: organise public-facing events (workshops, talks, or similar)\n\nWho it’s for:\nCollectives or curators proposing group exhibitions\nPriority given to those who cannot otherwise afford exhibition or studio space\nAll disciplines and mediums\n⚠️ Must have right to live and work in the UK\n⚠️ No Ltd Companies supported\n❌ Not for individual solo exhibitions - group projects only\n\nKey conditions:\nMinimum 4 days/week use of space required\nSpaces are unfurnished units - no wifi, no equipment provided\nSpace may be shared with another creative depending on size/schedule\nVisible from the street - practice will be publicly observable\nBuilding owner can reclaim space with 4 weeks’ notice (rare, but disclosed upfront)\n\nTo apply:\nOnline form at hyphastudios.com/frieze-2026-open-call\nPortfolio (PDF, max 4 pages, max 2MB)\nCV/relevant document (PDF, max 2MB)\nProject proposal + public event plan (max 100 words each)\n⚠️ Applications reviewed on a rolling basis - apply early\n\n💡 Palette’s take: Hypha Studios is a UK charity providing free workspace to artists in exchange for public programming. This call is specifically timed to Frieze London - one of the art world’s busiest weeks - and applicants are asked to think about how their public events might reach collector audiences. The spaces are genuinely raw: empty units, no wifi, visible from the street. This is about access and visibility during a high-traffic moment, not a polished white cube\n\n📍 Multiple Hypha Galleries, Central London, UK\nExhibition: October–November 2026\n⏰ Deadline: August 16, 2026 · 6:00 PM\n\n🔗 hyphastudios.com/frieze-2026-open-call\n\n#palette_exhibition #palette_europe #palette_curatorial #palette_free #palette_london","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":9,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"We’re excited to announce Don’t Sell Grandma’s House, an immersive exhibition presented...","k":"opening","s":"2026-08-16","e":"2026-09-06","st":"19:00","et":"21:00","u":"iamwhaffle","c":"","co":"","p":"https://www.instagram.com/p/DbwMWWlDyrs/","x":"We’re excited to announce Don’t Sell Grandma’s House, an immersive exhibition presented by W.A.S.+.\nW.A.S. (Tashawn “Whaffle” Davis, Andre “Uncut” Gray, and Sola Olosunde) is a collective dedicated to preserving Black history and culture through art, photography, design, installation, and archival practice. W.A.S.+ expands that mission through collaborations with artists, collectors, and cultural partners.\nDon’t Sell Grandma’s House explores Black interior design, media, culture, and memory through the recreation of a fully immersive 1960s–1970s basement. More than a nostalgic recreation, the installation examines how Black homes became spaces of identity, creativity, connection, and community. It also reflects on the importance of preserving these environments, along with the stories, objects, and memories they hold.\nThe exhibition features a selection of archival objects from the collection of StorageBased, the archival practice of Denzel Simmons, further deepening the historical narratives that underpin the exhibition.\n\nJoin us for the opening reception on Sunday, August 16, from 7–9 PM at @gallerysinclairnyc . The exhibition will remain on view through September 6. Throughout the exhibition, we’ll host artist talks, lectures, community archiving sessions, photoshoots, and other public programs. A full schedule will be announced soon.\nAdmission is free, but RSVP is required: https://luma.com/eooe04t7\nWe hope to see you there.","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-08-07","ld":9,"dl":"2026-09-06","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Helena Uambembes Installation „How to Make a Mud Cake“, die erstmals im vergangenen Jah...","k":"exhibition","s":"2026-08-16","e":null,"st":null,"et":null,"u":"berlinbiennale","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbBRnY8iLr0/","x":"Helena Uambembes Installation „How to Make a Mud Cake“, die erstmals im vergangenen Jahr im Rahmen der 13. Berlin Biennale präsentiert wurde, ist aktuell in der Gruppenausstellung „Mémoires voyageuses“ im Kunsthaus Baselland zu sehen. In ihrem Video verbindet Uambembe ein Kinderspiel mit einem Kochtutorial und schlüpft in die Rolle einer Social-Media-Köchin, um sich dem anhaltenden Trauma des Kolonialismus zu stellen.\n\nHelena Uambembe’s installation “How to Make a Mud Cake”, first presented on the occasion of last year’s 13th Berlin Biennale, is part of the current group show “Mémoires voyageuses” at Kunsthaus Baselland. The video conflates a children’s game with an online cooking tutorial, as the artist assumes the persona of a social media chef to tackle the lingering trauma of colonialism.\n\nMémoires voyageuses\n22.05.–16.08.2026\n@kunsthausbaselland @uambembe \n\nCredit: Helena Uambembe, How To Make a Mud Cake, 2021/2026; May contain traces of… , 2025. Courtesy of the artist and Jahmek Contemporary, Ausstellungsansicht / Installation view Kunsthaus Baselland 2026. Foto / Photo: Gina Folly © Kunsthaus Baselland\n\nAls spielerischer und zugleich bissiger Kommentar zu Themen wie Verlust und Abrechnung verweist die Arbeit darauf, dass Trauma mehr ist als die Bürde Einzelner – es kann in den Boden einsickern und eine ganze Kultur durchziehen. Vervollständigt wird das Video durch eine Serie Küchentücher, die mit Warnhinweisen bedruckt sind. Hier ist ein direkter Humor am Werk, hinter dem sich jedoch eine tiefergreifende Wahrheit verbirgt. \n\nA playful but biting commentary on loss and reckoning, the work suggests that trauma is more than one person’s burden, that it can seep into the soil and permeate a culture. The video is rounded out with a series of ink prints on kitchen rags, listing out package warnings. Their humor is immediate, but their truth registers more deeply.\n\nCredit: Helena Uambembe, How To Make a Mud Cake, 2021/2025, Installationsansicht / installation view, 13. Berlin Biennale, Ehemaliges Gerichtsgebäude / Former Courthouse Lehrter Straße, 2025. © Helena Uambembe; Foto / photo: Marvin Systermans","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-20","ld":27,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Did you know that in the Netherlands, around a quarter (!) of all food is wasted every ...","k":"workshop","s":"2026-08-16","e":null,"st":null,"et":null,"u":"reparatieremise","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbVnE0NIvQ4/","x":"Did you know that in the Netherlands, around a quarter (!) of all food is wasted every year? This happens throughout the entire food chain, from production to consumption 🐌🍽️ In Amsterdam alone, households generate around 60 million kg’s of organic waste (fruit and vegetable scraps, food leftovers, and garden waste) every year 🍴🌽\n\nThat’s why we’re so excited for our next RR workshop: Considering Food Scraps with @the__land, hosted at de Pannenlikker’s kitchen space @wwp_tetterode.\n\nIn this workshop we will use commonly found dutch vegetables that are often only partially used, such as radishes, carrots, beets, leek and fennel, to create a meal using the entirety of the plants to create a simple, delicious and waste free meal. Participants do not need to bring anything except maybe a small tupperware in the chance that there are leftovers to take home :)  \n\n🍽️ Sunday, 16 August\n🐌 Pannenlikker Studio, Tetterode\n🌽 Registration opens on 6 August via the link in our bio.","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-30","ld":17,"dl":"2026-08-16","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Our video installation Tour Life opened the 30th of May 2026 at Fotografisk Center’s Br...","k":"exhibition","s":"2026-08-16","e":null,"st":null,"et":null,"u":"nellibabetti","c":"Berlin","co":"","p":"https://www.instagram.com/p/DZpH4mNAHBp/","x":"Our video installation Tour Life opened the 30th of May 2026 at Fotografisk Center’s Breaking platform. \n\n31.05 – 16.08.2026\nTour Life\nFotografisk Center, Copenhagen\n\nTour Life, 2026, Freja Sofie Kirk and Nellie Lindquist\n3’30” loop, HD video with sound, curtains\nScore: Oliver Nehammer @crunchy_influencer \nSound mix: Severin Black @severinblack \n\nThanks to Platzhirsch Event, whose stage brought us on a roadtrip in search of the backend of collective feeling. Driving super fast from Berlin to Düsseldorf hunting their hydraulic stage to make a work together was like a little tour in itself\n\nTour Life will stay open through summer, go see this special work, lastly thank you @fotografiskcenter for having us <3","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-16","ld":61,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Am Sonntag, 16. August, laden wir zum Workshop „Kreative Raumforschung“ ein.","k":"workshop","s":"2026-08-16","e":null,"st":null,"et":null,"u":"kunsthalleosnabrueck","c":"Osnabrück","co":"","p":"https://www.instagram.com/p/DbfmegtoQ-b/","x":"Am Sonntag, 16. August, laden wir zum Workshop „Kreative Raumforschung“ ein. \n\nGemeinsam mit Eva Lause (@evalause.art) vom Vermittlungsteam der Kunsthalle Osnabrück wird der neue Raum im Innenhof erkundet, den die Künstlerin Julia Miorin (@julia.miorin) im Rahmen von „Raumordnung“ gestaltet hat. Skulpturen aus feinen Stahl-Linien deuten dort Räume und Plätze an. Sie lassen sich bewegen und immer wieder neu zusammenstellen. \n\nIm Workshop wird diese Anordnung mit unterschiedlichen Materialien verändert. So entstehen neue Strukturen. Im Mittelpunkt steht die Frage: Wie machen wir uns Raum zu eigen? Und wie lässt er sich aktiv umgestalten? Eine Zeichenübung und ein gemeinsames Nachgespräch halten die gemachten Erfahrungen fest.\n \nAnmelden kannst du dich bis zum 9. August per Mail an veranstaltung.kunsthalle@osnabrueck.de\n \nFür Menschen ab 8 Jahren. Eintritt frei.\n\n//\n\nOn Sunday 16 August, we invite you to join us for the workshop „Kreative Raumforschung“.\n\nTogether with Eva Lause from Kunsthalle Osnabrück’s education team, we will explore the new space in the inner courtyard, which the artist Julia Miorin has designed as part of our annual theme „Spatial Orders“. Sculptures made of fine steel lines suggest spaces and areas there. They can be moved and rearranged in ever-changing ways.\n\nIn the workshop, this arrangement will be altered using different materials, creating new structures. The focus is on the question: How do we make a space our own? And how can it be actively reshaped? A drawing exercise and a group discussion afterwards will help us reflect on the experiences we’ve had.\n\nYou can register by 9 August by emailing veranstaltung.kunsthalle@osnabrueck.de\n\nFor people aged 8 and over. Free entry.\n\n📸: Eva Lause","r":false,"b":"register","af":true,"so":false,"pd":"2026-08-01","ld":15,"dl":"2026-08-09","ds":"stated","ap":false,"rel":false,"q":false},{"now":false,"t":"Lost (existentially speaking) in the supermarket🧃Wes Anderson art designer Josef Brandl...","k":"other","s":"2026-08-16","e":null,"st":null,"et":null,"u":"germanfilmoffice","c":"","co":"","p":"https://www.instagram.com/p/DbvPZoripa6/","x":"Lost (existentially speaking) in the supermarket🧃Wes Anderson art designer Josef Brandl @josef.brandl brings his sarcastic vision of alienation to @filmlinc's #ScaryMoviesXIV with directorial debut SUPERBUHEI. August 16 with Brandl in attendance. Tickets at the link in bio.\n\nRecovering alcoholic Jesse works the bar in a monocultural suburban supermarket, where the daily drab gets the better of him. Whether from relapse or insanity, he soon begins to suspect that he has an evil twin who hopes to take control of his life. What ensues is a bitterly dry horror-comedy that prods at anxiety and loneliness with the blunt end of a hammer.\n\nSCARY MOVIES XIV runs August 12–20 at Film at Lincoln Center.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-07","ld":9,"dl":"2026-08-16","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Guess who’s RR workshop sign up opens this Thursday? 🐌🌽🥔 @the__land (co-founded by Jess...","k":"workshop","s":"2026-08-16","e":null,"st":null,"et":null,"u":"reparatieremise","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DblRR0WCL10/","x":"Guess who’s RR workshop sign up opens this Thursday? 🐌🌽🥔 @the__land (co-founded by Jessie Breslau + Elise de Jong) is an agricultural and social experiment that weaves together agroecological and community building practices between zuidoostbeemster and amsterdam 🔆🍴\n\nthe majority of food that they grow on their 1400m2 plot is not sold, but used in the workshops, dinners, and events in and near amsterdam 💚 they believe in building relationships through and around food and feel that those bonds strengthen with every possible tactility 🌽🐌🍽️\n\nTheir RR workshop Considering food scraps is Sunday August 16th at Pannenlikker Studio, @wwp_tetterode, sign up opens via link in bio 👒","r":false,"b":"register","af":true,"so":false,"pd":"2026-08-03","ld":13,"dl":"2026-08-16","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"APF JURY NEWS","k":"performance","s":"2026-08-16","e":null,"st":null,"et":null,"u":"antwerpposterfestival","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbtJ3NrjZMH/","x":"APF rn more and plan your visit via the link in bio.\n\nOrganized by the @DiaArtFoundation and curated by Jessica Morgan and Min Sun Jeon (@minsunj), this major presentation brings together key bodies of work produced between the 1960s and 1970s. Renowned for his light sculptures made from industrial fluorescent lamps in standard colors and formats, Flavin transformed exhibition spaces into immersive environments that activate their surrounding architecture while challenging conventional ideas of what art can be.\n\n+ Concurrently on view at the @VenetFoundation, Dan Flavin: Simple Fluorescent Lamps features 14 works spanning 1963–1990 and highlights the artist’s enduring exploration of light, color, and space through the commercially available fluorescent lamps that became his signature medium.\n—\nInstallation views, Dan Flavin: Light, Color, and Space, MALBA, Buenos Aires, 2026. Photos by Santiago Orti","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Ian Miyamura's \"saturation exercise\" brings together seven pairs of \"fraternal painting...","k":"talk","s":"2026-08-17","e":null,"st":null,"et":null,"u":"momaps1","c":"New York","co":"","p":"https://www.instagram.com/p/DbxtO0Gm80k/","x":"Ian Miyamura's \"saturation exercise\" brings together seven pairs of \"fraternal paintings\": abutting panels of nongestural, flat color that appear perfectly doubled, until you look again.\n\nThe treatment recalls modernist geometric abstraction such as de Stijl, or the squares on a chessboard. The subtle gradation in color between pairs shifts the overall value, lightness or darkness, and creates a sequential crescendo, or decay, in surface color.\n\nTake a closer look and do it soon: Greater New York closes on Aug 17. \n—\nIan Miyamura (@man_ur_iam_iya) \"saturation exercise,\" 2026. oil on linen over panel.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":9,"dl":null,"ds":nu n us off-site at The Nickel Cinema for a one-off double bill screening of Harun Faro...","k":"screening","s":"2026-08-19","e":null,"st":"18:00","et":"21:00","u":"chisenhalegallery","c":"London","co":"","p":"https://www.instagram.com/p/DbqhRX4jPIR/","x":"Join us off-site at The Nickel Cinema for a one-off double bill screening of Harun Farocki’s 1997 essay film ‘Still Life’ and Dan Graham’s 1984 no wave documentary ‘Rock My Religion’. \n\nThe pairing examines how mediating cultural technologies shape collective attention, desire and belief. Graham's documentary traces rock 'n' roll's roots in religious ecstatic ritual, framing the concert as a secularised rite of mass spectacle, while Farocki's essay film reveals how the visual grammar of Dutch still-life painting was absorbed into photographic advertising's construction of desire. \n\n📅 Wednesday 19 August 2026 \n⏰ 6–9pm\n📍 The Nickel Cinema, 117-119 Clerkenwell Road\n\nBook your place now using the link in our bio. No one will be turned away for lack of funds; please contact us at mail@chisenhale.org.uk for access to discounted tickets.\n\nImage credit: Harun Farocki, Still Life, 1997. Film still. Courtesy of The Farocki Institute.\n\n@thatboiakathatboi \n@thenickelcinema \n#JasperMarsalis\n#StillLife\n#ChisenhaleGallery","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-05","ld":14,"dl":"2026-08-19","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Our Lost & Found: Cine(ma)s Latinoamericanos Re-Unidos series returns on Wednesday, Aug...","k":"launch","s":"2026-08-19","e":null,"st":null,"et":null,"u":"cinematropical","c":"New York","co":"","p":"https://www.instagram.com/p/DbbQ2b0FtEE/","x":"Our Lost & Found: Cine(ma)s Latinoamericanos Re-Unidos series returns on Wednesday, August 19 with the New York premiere of FUTURE FUTURE / FUTURO FUTURO, the visionary new feature by acclaimed Brazilian filmmaker Davi Pretto.\n\nSet in a haunting near-future Brazil where artificial intelligence has triggered a mysterious neurological crisis, FUTURE FUTURE follows a man adrift in a world of collapsing memory, deepening inequality, and technological control. \n\nBlending science fiction with political allegory, Pretto crafts a formally daring and hypnotic vision of a society on the brink.\n\n🎟️ Tickets and more information available at the link in bio.\n\n#FutureFuture #FuturoFuturo #DaviPretto #BrazilianCinema #AnthologyFilmArchives #NYCPremiere #CinemaTropical #LatinAmericanCinema","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-30","ld":20,"dl":"2026-08-19","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"𝓞𝓟𝓔𝓝 𝓒𝓐𝓛𝓛 ࣪ ˖₊˚⊹⋆ ౨ৎ ⋆. ࿐࿔ (ENG below)","k":"exhibition","s":"2026-08-20","e":"2026-09-06","st":"10:00","et":null,"u":"angelpuff_","c":"Elbląg","co":"","p":"https://www.instagram.com/p/DauQUTKAAI6/","x":"𝓞𝓟𝓔𝓝 𝓒𝓐𝓛𝓛 ࣪ ˖₊˚⊹⋆ ౨ৎ ⋆. ࿐࿔ (ENG below)\n\nSerdecznie zapraszam Cię do podzielenia się swoją historią i/lub przekazania kosmyka włosów. Włosy zostaną doczepione do instalacji, a fragmenty listów zostaną przeczytane podczas audycji @_carewaves_ we współpracy z @kingamolinska w Radio Kapitał 20.08.26 o godzinie 10:00.\n\nListy do audycji zbieram do 16.08.26. Sam projekt jest jednak otwarty i bezterminowy, listy i kosmyki włosów można przekazywać również po tej dacie.\n\nList i/lub kosmyk włosów możesz zostawić bezpośrednio w galerii, wrzucając je prosto do „Skrzynki na listy” lub przesłać do mnie @angelpuff_ lub do @kingamolinska. \n\nENG ˖₊˚⊹⋆ ౨ৎ ⋆. ࿐࿔ \n\nYou are warmly invited to share your story and/or offer a lock of your hair. The hair will be attached to the installation, and excerpts from the letters will be read during the @_carewaves_ radio in collab with @kingamolinska broadcast on Radio Kapitał on 20 August 2026 at 10:00 AM.\n\nI am collecting letters for the broadcast until 16 August 2026. However, the project itself remains open and ongoing, letters and locks of hair can also be contributed after this date.\n\nYou can leave your letter and/or lock of hair directly at the gallery by placing them in the “Mailbox” or send them to me @angelpuff_ or to @kingamolinska.\n\nCentrum Sztuki Galeria EL\nul. Kuśnierska 6\n82-300 Elbląg\nPoland\n\n˖₊˚⊹⋆ ౨ৎ ⋆. ࿐࿔ \n\nHairline, on view at @galeriael in Elbląg until September 6, 2026.\nCurated by @em_aku \n\n“Bird Cage”\n2025\nmetal, hair\n325 x 200 x 151 cm \n\n“Mail Box”\n2025\nmetal\n119 x 58 x 58 cm \n\nPhotos @pawelsobcza","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-13","ld":38,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"POST Nijmegen is looking for new hosts!","k":"exhibition","s":"2026-08-20","e":null,"st":null,"et":null,"u":"platform_post","c":"Nijmegen","co":"Netherlands","p":"https://www.instagram.com/p/Da4vK-8DDMq/","x":"POST Nijmegen is looking for new hosts!\n\nStarting 20 August, we're looking for volunteers to host our current exhibition Claiming The City: A Squatters' Allegory, and future exhibitions.\n\nSpend your late-summer days in an art space, chat with visitors, meet new people, and help welcome everyone to the exhibition. For now, we're at the Paraplufabriek, and from October we'll move to the NYMA Watertower.\n\nInterested? Swipe for more information!","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-17","ld":34,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"We’re proud to be hosting @pridephotoaward for a residency at the FUTURES Hub in Amster...","k":"performance","s":"2026-08-20","e":null,"st":null,"et":null,"u":"futuresphotography","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbYWJBLjFoe/","x":"We’re proud to be hosting @pridephotoaward for a residency at the FUTURES Hub in Amsterdam. As part of this collaboration, we’re excited to welcome @aconstantbecoming to the Hub, where they will be developing their project “*ME(MORIES)*”.\n\nDeLovie Kwagala (aka Papa De) is the first openly non-binary queer photographer from Uganda. An award winning visual artist and film maker, their art is a defiant stance against the colonial gaze, aiming to dismantle stereotypes around beauty, gender identity, and the fetishisation or victimisation of Black and queer bodies. Through self-taught, multi-disciplinary visual storytelling, Papa De documents and archives African queer youth, exploring themes of identity, belonging, migration, displacement, and climate justice.\n\n“*ME(MORIES)* re-examines pre-colonial history through the lens of a family archive dating back to\nthe 1970s. Centering on the Gomesi; the iconic traditional dress of Ugandan women from the\nBuganda Kingdom and beyond, the project explores the garment’s evolution into a definitive symbol of honourable womanhood. Through this visual investigation, *ME(MORIES)* interrogates the\ncomplexities of collective memory, gender performance, and the nuanced, often detached,\nattachment to colonial legacies.” - @aconstantbecoming \n\nWant to see more? Stop by the FUTURES Hub on 20 August for an Open Studio with @aconstantbecoming \n\nFor more info, link in bio ⁠","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":22,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🎨 On Fri 21 Aug from 1pm, join illuminator and illustrator Ayesha Gamiet (@ayesha_illum...","k":"workshop","s":"2026-08-21","e":null,"st":"13:00","et":null,"u":"ibraazlondon","c":"London","co":"","p":"https://www.instagram.com/p/DbqQEhLqVf5/","x":"🎨 On Fri 21 Aug from 1pm, join illuminator and illustrator Ayesha Gamiet (@ayesha_illuminates) for a workshop for aspiring young artists ages 10 and up. Using her knowledge of traditional Islamic illumination, she will introduce children to the fantastical flowers that adorn the pages of these rich and vivid manuscripts.\n\n🌸🎟️ IMPORTANT: To take part, send an email to rsvp@burleyfisherbooks.com with the names of everyone interested and two or three sentences on why you’d like to join. Bookings will be open until 11th August or until the workshop is full. We will confirm your space by 14th August. \n\nThis event is free and open to all skill levels, but spaces are limited. Children participating in this workshop must be 10+ and accompanied by an adult, with no more than two young people per accompanying adult.\n\nTelling Stories is a programme of events by Ibraaz and Burley Fisher Books (@burleyfisher) which focuses on storytelling in all its forms.\n\n📷 — Ayesha Gamiet\n\n#IbraazLondon #Ibraaz #Workshop","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-08-05","ld":16,"dl":"2026-08-21","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"𝗣𝗔𝗚𝗘𝗔𝗡𝗧 𝗔𝗧 𝗠𝗼𝗠𝗔?!? Starting next week…𝙵𝚘𝚛 𝚝𝚑𝚎 𝚖𝚘𝚗𝚝𝚑 𝚘𝚏 𝙰𝚞𝚐𝚞𝚜𝚝, 𝙿𝚊𝚐𝚎𝚊𝚗𝚝 𝚠𝚒𝚕𝚕 𝚋𝚎 𝚒𝚗 𝙼𝙸𝙳𝚃𝙾...","k":"performance","s":"2026-08-21","e":null,"st":"14:00","et":null,"u":"pageantpageantpageant","c":"New York","co":"","p":"https://www.instagram.com/p/DbveI31kdz8/","x":"𝗣𝗔𝗚𝗘𝗔𝗡𝗧 𝗔𝗧 𝗠𝗼𝗠𝗔?!? Starting next week…𝙵𝚘𝚛 𝚝𝚑𝚎 𝚖𝚘𝚗𝚝𝚑 𝚘𝚏 𝙰𝚞𝚐𝚞𝚜𝚝, 𝙿𝚊𝚐𝚎𝚊𝚗𝚝 𝚠𝚒𝚕𝚕 𝚋𝚎 𝚒𝚗 𝙼𝙸𝙳𝚃𝙾𝚆𝙽 𝙼𝙰𝙽𝙷𝙰𝚃𝚃𝙰𝙽 𝚊𝚜 𝚙𝚊𝚛𝚝 𝚘𝚏 𝚝𝚑𝚎 𝙺𝚛𝚊𝚟𝚒𝚜 𝚂𝚝𝚞𝚍𝚒𝚘 𝚁𝚎𝚜𝚒𝚍𝚎𝚗𝚌𝚢 @themuseumofmodernart \n\nJoin us for two major events…a daylong performance marathon on AUGUST 21st inviting viewers to drop in and experience a lineup of 25 X 10 minute works performed by Pageant and other veterans of its Brooklyn space. And a talk with Pageant Founders and Curator McClain Groff on AUGUST 30th at 2pm.\n\nUPDATE: Marathon seats are sold out but there will be walk-up standing room and a standby line, entry with a museum ticket! \n\nTHANK YOU MARTHA, LUIZA, LIZZIE, MONICA, PAUL, MAY, FRANCES <3","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-07","ld":14,"dl":"2026-08-21","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"🐍 Emilija Škarnulytė: Arrow of Time","k":"opening","s":"2026-08-21","e":"2026-11-08","st":"18:00","et":null,"u":"kunstmuseumsg","c":"Zurich","co":"","p":"https://www.instagram.com/p/DblDLKlM8vX/","x":"🐍 Emilija Škarnulytė: Arrow of Time\n21. August bis 8. November 2026, Lokremise\n\n👉🏼 Vernissage: 21. August 2026, 18 Uhr\n\nEmilija Škarnulytė verwandelt die Lokremise in eine immersive Landschaft aus Film, Licht und skulpturalen Interventionen. Die Ausstellung schafft einen Erfahrungsraum, in dem Wissenschaft, Fiktion und Kunst miteinander verschmelzen – zwischen kosmischer Weite, technologischer Gegenwart und einer Zukunft, die zugleich verheissungsvoll und beunruhigend erscheint.\n \n//\n\n🐍 Emilija Škarnulytė: Arrow of Time\n21 August to 8 November 2026 at Lokremise\n\n👉🏼 Exhibition Opening: 21 August 2026, 6pm\n\nEmilija Škarnulytė transforms the Lokremise into an immersive, otherworldly landscape using film, light, and sculpture. The exhibition creates an experiential space in which science, fiction, and art intertwine against a vast cosmic backdrop, locating viewers somewhere between the technological present and a future that appears both promising and unsettling.\n\n#kunstmuseumsg #kunstmuseum #lokremise #emilijaskarnulyte #vernissage\n\n📸 Emilija Škarnulytė, Arrow of Time, Film Still, 2024, Courtesy the artist","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":17,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":false,"t":"Winner of the Viewpoints Award at the Tribeca Festival, Lucía Garibaldi’s dazzling feat...","k":"screening","s":"2026-08-21","e":null,"st":"19:00","et":null,"u":"cinematropical","c":"New York","co":"","p":"https://www.instagram.com/p/DbluJIGFiLu/","x":"Winner of the Viewpoints Award at the Tribeca Festival, Lucía Garibaldi’s dazzling feature A BRIGHT FUTURE / UN FUTURO BRILLANTE comes to New York for a special edition of Las Premieres at Museum of the Moving Image.\n\nSet in a haunting world where youth has become a coveted commodity, Garibaldi's bold and visually arresting sci-fi drama follows an 18-year-old girl who begins to question the mysterious fate awaiting her beyond the borders of her isolated community. \n\nWinner of the Sundance World Cinema Dramatic Directing Award for THE SHARKS, Garibaldi confirms herself as one of South America's most exciting filmmakers of her generation.\n\nQ&A with director Lucía Garibaldi following the screening\n\nFriday, August 21, 7pm\nMuseum of the Moving Image, Astoria, New York City\n\n🎟️ Tickets at the link in bio.\n\n#ABrightFuture #LuciaGaribaldi #LasPremieres #uruguay #CinemaTropical #UruguayanCinema #unfuturobrillante #LatinAmericanCinema #SciFi #TribecaFestival","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-03","ld":18,"dl":"2026-08-21","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"American experimental composer Stephen O’Malley @stephenomalley74 announces Avaeken, tw...","k":"exhibition","s":"2026-08-21","e":null,"st":"21:13","et":null,"u":"daisrecords","c":"New York","co":"","p":"https://www.instagram.com/p/DbDyIXOmyhU/","x":"American experimental composer Stephen O’Malley @stephenomalley74 announces Avaeken, two sides of immense, immersive, self-annihilating music, in collaboration with artist @banks_violette_616 - out August 21st. Listen to “21:13 (take 4)” now streaming, and preorder the album in gorgeous silver foil packaging. Link in bio. \n\nAvaeken preserves site-specific work: O’Malley installed Avaeken as part of Wish You Were Here, the exhibition by renowned American artist Banks Violette, underscoring the tension between presence and absence, life and loss. O’Malley and Violette have developed a distinct language of sound, space, and sculpture over the past two decades, reverberating the walls of world-class institutions from The Guggenheim and Centre Pompidou to prominent galleries such as Maureen Paley in London, Gladstone Gallery in NYC, and Antwerp’s TICK TACK, the brutalist space where Wish You Were Here unfolded in early 2026. Emerging now as an LP, Avaeken presents power and phenomena: low-frequency vibrations, deep oscillations, and phase cancellations that translate as innately effective in any environment. Violette’s visual expression — the impossibility of locating yourself within the loss of a friend and the broader decay of culture — now fills the LP sleeve and feels inextricable from O’Malley’s sound, both still without resolution.\n\nPhoto by Iris Delafortry","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":31,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Leaving the office early or looking for something to do on Fridays? 😎💼 Take advantage o...","k":"other","s":"2026-08-21","e":null,"st":null,"et":null,"u":"newmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/DZ5vXOtT5Ca/","x":"Leaving the office early or looking for something to do on Fridays? 😎💼 Take advantage of our Summer Fridays $10 ticket through Friday August 21.\n \nBook your tickets now using the link in bio 🔗","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-06-22","ld":60,"dl":"2026-08-21","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"The excitement is building.","k":"other","s":"2026-08-21","e":null,"st":null,"et":null,"u":"welcometocampmiasma","c":"New York","co":"","p":"https://www.instagram.com/p/Dbvqb8fFP_M/","x":"The excitement is building. \n\nGet your CAMP MIASMA tickets → campmiasmafilm.com\n\nNow playing in New York and Los Angeles. Everywhere August 21.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-07","ld":14,"dl":"2026-08-21","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Kiss your inhibitions goodbye.","k":"exhibition","s":"2026-08-21","e":null,"st":null,"et":null,"u":"welcometocampmiasma","c":"New York","co":"","p":"https://www.instagram.com/p/DbtIXopTAzM/","x":"Kiss your inhibitions goodbye.\n\nStarring Hannah Einbinder and Gillian Anderson, CAMP MIASMA opens in select theaters tonight. \n\nEverywhere August 21.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":15,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":false,"t":"SOON.","k":"exhibition","s":"2026-08-21","e":null,"st":null,"et":null,"u":"welcometocampmiasma","c":"New York","co":"","p":"https://www.instagram.com/p/DblQ5DgAlpJ/","x":"SOON.\n\nTEENAGE SEX AND DEATH AT CAMP MIASMA opens this Friday in New York and Los Angeles. Nationwide August 21. \n\nA MUBI Release.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":18,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"EIGHT CUBIC METERS","k":"exhibition","s":"2026-08-21","e":"2026-09-17","st":null,"et":null,"u":"rietveldacademie","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/Dbvj7xcjR1a/","x":"EIGHT CUBIC METERS\n\nOpening on 21 August: Eight Cubic Meters by Claudia Sanchez: A bow is a bow es un lazo.\n\nHow do objects acquire meaning? Are they shaped by function, ritual, labour, desire, or by the cultural narratives we repeatedly attach to them? Can we consciously re-signify a signifier? \n\nTaking the bow as its point of departure, this project considers how an ordinary object becomes loaded with meaning and gender connotations. Before becoming a feminine ornament adorning hair and clothing, it existed as a practical knot: a utilitarian form used to fasten, secure and hold. Yet over time, this simple gesture became culturally charged with ideas of beauty, delicacy, innocence, obedience and femininity. \n\nExhibition from 21 August until 17 September\n🎈Finissage: Thursday 17 September, 17.30h\n\n--\n@iamliabermudez","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":14,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Vytautas Katkus' debut feature The Visitor makes its UK premiere as part of Off-Circuit...","k":"screening","s":"2026-08-21","e":null,"st":null,"et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/Dbxdxc2m8bJ/","x":"Vytautas Katkus' debut feature The Visitor makes its UK premiere as part of Off-Circuit on 21 August 🎞️\n\nThirty-year-old Danielius returns to his hometown to sell his parents’ flat, but the visit lasts longer than expected. With nowhere to rush, he tries to reconnect, with the people and the town that no longer feels like his own.\n\n🎬 Further screenings from 22 August\n✨ Book now via the link in bio\n\nPart of Off-Circuit – a continuing series bringing landmark films from this generation of filmmakers to the big screen.\n\n@vytautask #VytautasKatkus #TheVisitor #OffCircuit #ICA #Cinema","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":13,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"𝗖𝗢𝗠𝗜𝗡𝗚 𝗨𝗣:  𝗡𝗘𝗫𝗧 𝗘𝗫𝗛𝗜𝗕𝗜𝗧𝗜𝗢𝗡 >>>","k":"exhibition","s":"2026-08-22","e":"2026-11-22","st":"16:00","et":null,"u":"kunstplatformlink","c":"Tilburg","co":"","p":"https://www.instagram.com/p/DbXgWGuM1sy/","x":"𝗖𝗢𝗠𝗜𝗡𝗚 𝗨𝗣:  𝗡𝗘𝗫𝗧 𝗘𝗫𝗛𝗜𝗕𝗜𝗧𝗜𝗢𝗡 >>>\n\nMemory keeps changing its mind and truth loses its value.\n\nSometimes I make things bigger just to see when they stop feeling familiar, sometimes I make art just because the pain makes me feel alive.\n\nYou are losing your mind\n\nDid I ask you?\n\nWe ended up making this exhibition together.\n\n𝙋𝙡𝙖𝙮𝙞𝙣𝙜 𝙬𝙞𝙩𝙝 𝘿𝙚𝙖𝙙 𝙏𝙝𝙞𝙣𝙜𝙨\nFolkert de Jong, Elle van Baaren, Max Onink\nOpening 22 August, 16:00\nOn view until 22 November\nLINK / Fratersteeg 1 / Zwolle\n\ndesign: @ellevanbaaren","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":24,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Now Open—‘Christian Marclay: The Clock’ at Los Angeles County Museum of Art, California","k":"screening","s":"2026-08-22","e":"2026-08-23","st":null,"et":null,"u":"paulacoopergallery","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DbTM6DzjnOX/","x":"Now Open—‘Christian Marclay: The Clock’ at Los Angeles County Museum of Art, California\n\nReturning to Los Angeles for the first time since 2015, Christian Marclay’s ‘The Clock’ is a 24-hour single-channel montage constructed from thousands of moments of cinema and television history depicting the passage of time, excerpted and edited together to create a functioning timepiece synchronized to local time wherever it is shown. ‘The Clock’ is on view until August 23 and LACMA will host a 24-Hour screening on Saturday, August 22. \n\nLearn more @lacma \n#ChristianMarclay #PaulaCooperGallery\n_\n[1] Christian Marclay, ‘The Clock’ (still), 2010, Single-channel video with sound, 24 hours © Christian Marclay. Courtesy Paula Cooper Gallery, New York and White Cube, London.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":26,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Playing with dead things","k":"exhibition","s":"2026-08-22","e":null,"st":null,"et":null,"u":"max_onink","c":"Tilburg","co":"","p":"https://www.instagram.com/p/Dak3ZpLIpoU/","x":"Playing with dead things \nopening 22 Aug at @kunstplatformlink with @folkert.dejong & @ellevanbaaren","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-09","ld":44,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"M+ Cinema is thrilled to co-present the fourth edition of the ASEAN Film Festival, orga...","k":"screening","s":"2026-08-22","e":"2026-08-30","st":null,"et":null,"u":"mplusmuseum","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbnTq5Qmlac/","x":"M+ Cinema is thrilled to co-present the fourth edition of the ASEAN Film Festival, organised by the Hong Kong-ASEAN Foundation (@hkaseanfoundation). This August, we are bringing you a unique selection celebrating the vital role of music and sound in Southeast Asian cinema—from restored classics to contemporary films.\n\n✨ Highlights include:\n\n➡️ Usmar Ismail’s ‘After the Curfew’ (1954), a poignant exploration of the psychological and political complexities of early post-colonial Indonesia and the first Indonesian film internationally restored, screened at Cannes in 2012.\n \n➡️ Douglas Seok’s ‘Turn Left Turn Right’ (2016), a ‘concept album’ on screen following a young woman’s quiet dreams of music, dance, and fantasy in Phnom Penh. \n \n➡️ Martika Ramirez Escobar’s Sundance award-winning ‘Leonor Will Never Die’ (2022), a vibrant love letter to the golden age of Philippine cinema. \n \n➡️ ‘New Frequencies: Short Films of Youth and Whimsy’, spotlighting the boundless creativity of emerging ASEAN filmmakers across seven new works that push the limits of innovative storytelling through music and sound design. \n \n➡️ Post-screening talks with filmmakers will accompany select screenings throughout the festival, offering audiences a deeper look into the stories behind the films. \n...and so much more! \n \n🗓️ Mark your calendar: 22–30 August 2026 \n🎟️ Free public registration is now open.\n\n🔗 Learn more via link in bio. \n \nM+戲院很高興與香港–東盟協會（@hkaseanfoundation）攜手呈獻第四屆東盟電影節。今年八月，我們精選了一系列來自東南亞的修復經典與當代電影作品，聚焦配樂與聲音設計如何塑造電影敘事。\n\n✨ 電影節亮點： \n\n➡️ 危斯馬伊士美執導的《戒嚴夜》（1954），細膩刻劃印尼後殖民時代初期複雜的政治與心理面貌，是首部獲得國際修復的印尼電影，曾於2012年在康城影展放映。 \n\n➡️ 石德鉉執導的《向左走向右走》（2016），恍如一張躍動於銀幕上的概念專輯，透過如夢境般的敘事風格，講述一位年輕女子在金邊抱着關於音樂與舞蹈的夢想。 \n\n➡️ 瑪蒂卡拉米雷斯艾斯高巴的《蕾奧諾的電影不死夢》（2022）是辛丹斯電影節得獎作品，以充滿創意與幽默的方式，向菲律賓電影黃金時代致敬。\n\n➡️「奇思妙想：新晉導演短篇輯」集合七部東盟地區新晉導演的短片作品，透過配樂與聲音設計探索創新的敘事手法。\n\n➡️ 部分放映場次設有映後談，讓觀眾與電影人近距離交流，深入了解作品背後的創作故事。 \n……還有更多精彩節目，敬請期待！\n\n🗓️ 2026年8月22日至30日\n🎟 公眾免費門票登記現已開放。\n\n🔗 點擊帳號簡介連結了解更多。 \n\n#MPlusMuseum #MPlus博物館 #ASEANFilmFestival #東盟電影節","r":false,"b":"register","af":true,"so":false,"pd":"2026-08-04","ld":18,"dl":"2026-08-30","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"‘Unsubscribe All!’","k":"talk","s":"2026-08-23","e":null,"st":"10:30","et":null,"u":"parasite.hk","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbncToWP-da/","x":"‘Unsubscribe All!’\nPara Site’s 8th International Conference\n🗓️Sun 23 Aug 2026, 10:30am–6pm\n📍Wang Gungwu Lecture Hall, Graduate House, The University of Hong Kong\n🧠Free and open to the public, register via link in bio!\n\nIf the future feels unchangeable, how can alternate worlds open up to other possibilities?\n\n🚀Over one full day, join 10 international artists, thinkers, and creatives as they unpack how speculative practices are reshaping our technologically mediated present. Together, we’ll question the promises of digital systems. Unsubscribe from any and all versions of the future and reimagine our relationships to the technologies that surround and shape us.\n\n🧑🏻‍🎤Featuring conversations with:\nStanley Qiufan Chen\nIris Long (@xingru_longiris)\nBahar Noorizadeh (@baharnoorizadeh)\nClara Che Wei Peh (@claralikesart)\nSophie Penkethman-Young (@sophiep_y)\nCharis Poon (@lessandslowandother)\nWinnie Soon (@siusoon)\nZiyang Wu (@ziyang_wu_art)\nGünseli Yalcinkaya (@gunseliiiiii)\nLiam Young (@liam_y)\n\nThe conference is structured in two parts: \n💡The morning session explores how practitioners and digital subcultures actively intervene in and reshape cultural realities woven into technological advancement. \n💡The afternoon session turns to questions of access, agency, and collective action across the Asia-Pacific, highlighting open-source cultures and collaborative networks that cultivate more equitable ecosystems.\n\nA day of friction, absurdity, and radical reimagination, where dominant narratives are dislodged, and a multitude of ways to inhabit the present unfold – for all who imagine living with—and through—technology.\n\nWe look forward to having you with us!\n\n[Chinese translation and image credit in the comment]\n\n#ParaSite #ParaSite30 #Conference #Technology #Art","r":false,"b":"register","af":true,"so":false,"pd":"2026-08-04","ld":19,"dl":"2026-08-23","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"🪩 寶島夜總會 強勢動感回歸 🇹🇼","k":"other","s":"2026-08-23","e":null,"st":"15:00","et":null,"u":"formosa.extravaganza","c":"New York","co":"","p":"https://www.instagram.com/p/Da6ExQ3BVE6/","x":"🪩 寶島夜總會 強勢動感回歸 🇹🇼\n⚡️FORMOSA EXTRAVAGANZA we so backkkk 🔥 8/23/2026 3PM-9PM 🔥🔥\n\n抓住今年夏天尾巴，紐約最盛大、最動感的臺灣人派對回來啦！🎟️ 早鳥票限量搶購中\n\n由 #紐約驕傲遊行台灣隊 🏳️‍🌈 和 #紐約金曲時光機 📀 共同舉辦的「寶島夜總會」被紐約臺灣人們敲碗敲不停，這次在夏天的尾聲將帶來夏日感最強的頂樓夕陽派對\n\n#寶島夜總會 集結 FORMOSA EXTRAVAGANZA 🇹🇼\n\n抓住今年夏天尾巴，紐約最盛大、最動感的臺灣人派對回來啦！NYC’s largest, most extravagant Taiwanese dance party you’ve been asking for is backkkk!\n\n🗓️ 日期 Date: Aug 23, 2026\n⏰ 時間 Time: 3PM - 9PM\n📍 地點 Venue: The Crown (50 Bowery 21st Floor, New York, NY 10013) in Chinatown\n🎟️ 購票連結請查主頁 Tickets link in bio\n\nPresented by @taiwanpride.nyc @gm_timemachine @eddie_eddwell @shawn_haohsiangli 聯合主辦","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-25","ld":29,"dl":"2026-08-23","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Introducing DJ @dj_eddie_nyc","k":"other","s":"2026-08-23","e":null,"st":"15:00","et":null,"u":"formosa.extravaganza","c":"New York","co":"","p":"https://www.instagram.com/p/DbwzwEwjop3/","x":"Introducing DJ @dj_eddie_nyc\n\n這是DJ EDDIE，先給我一個尖叫聲！！！\n\n來自新竹的「風城囡仔」DJ EDDIE，擁有超過十年的深厚 DJ 經歷，曾參與無數藝人合作與大型品牌活動。2024 年移居紐約後，他創立了以全中文經典歌曲為主題的音樂品牌——「金曲時光機」。創立《金曲時光機》的初心，是希望讓每一位在異鄉奮鬥的朋友，能透過熟悉的旋律拋開煩惱，大聲合唱那些陪伴我們成長的歌。然後的然後：金曲時光機今年要2週年啦，活動時間、地點會在寶島夜總會後公布，所以請大家先來寶島夜總會好好的玩，一起抓住夏天的尾巴，然後在二週年有個完美的2026，哩供厚母厚！？\n\n—\n\n🪩 寶島夜總會 FORMOSA EXTRAVAGANZA 🇹🇼\n\n抓住今年夏天尾巴，紐約最盛大、最動感的臺灣人派對回來啦！NYC’s largest, most extravagant Taiwanese dance party you’ve been asking for is backkkk!\n\n🗓️ 日期 Date: Aug 23, 2026\n⏰ 時間 Time: 3PM - 9PM\n📍 地點 Venue: The Crown (50 Bowery 21st Floor, New York, NY 10013) in Chinatown\n🎟️ 購票連結請查主頁 Tickets link in bio\n\nPresented by @taiwanpride.nyc @gm_timemachine @dj_eddie_nyc @shawn_haohsiangli 聯合主辦","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-08","ld":15,"dl":"2026-08-23","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Introducing DJ Kevin @h707743","k":"other","s":"2026-08-23","e":null,"st":"15:00","et":null,"u":"formosa.extravaganza","c":"New York","co":"","p":"https://www.instagram.com/p/DbrotsGDnBH/","x":"Introducing DJ Kevin @h707743\n\nKevin 過去只是個平凡的上班族，直到有一次飛往西班牙參加朋友的婚禮，意外在舞池中被強大的音樂能量擊中，正式開啟了他的電音之旅。看著台上控場的 DJ，他發現 DJ 不只能分享好音樂，更是全場情緒的掌控者，便暗下決心：有一天我也要站在台上面對大家。從拜師學藝到經過無數場活動的洗禮，如今的 Kevin 已能駕馭從他最愛的電子音樂到經典中文流行曲等多元風格，用獨特的音樂品味感染台下每一個人，帶領大家一起沉浸在音樂的魅力中。\n\nKevin used to be an ordinary office worker—until a trip to Spain for a friend’s wedding changed everything. Hit by the contagious energy of the dance floor, his electronic music journey officially began. Watching the DJ command the crowd, he realized that a DJ does more than just play songs; they control the emotional heartbeat of the entire room. Inspired, he decided to learn the craft, determined to perform on stage one day. After honing his skills across various events, Kevin now seamlessly navigates everything from his beloved electronic beats to popular Mandarin hits, sharing his passion and bringing the audience along for an unforgettable musical ride.\n\n—\n\n🪩 寶島夜總會 FORMOSA EXTRAVAGANZA 🇹🇼\n\n抓住今年夏天尾巴，紐約最盛大、最動感的臺灣人派對回來啦！NYC’s largest, most extravagant Taiwanese dance party you’ve been asking for is backkkk!\n\n🗓️ 日期 Date: Aug 23, 2026\n⏰ 時間 Time: 3PM - 9PM\n📍 地點 Venue: The Crown (50 Bowery 21st Floor, New York, NY 10013) in Chinatown\n🎟️ 購票連結請查主頁 Tickets link in bio\n\nPresented by @taiwanpride.nyc @gm_timemachine @eddie_eddwell @shawn_haohsiangli 聯合主辦","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-06","ld":17,"dl":"2026-08-23","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Introducing DJ @iamartela","k":"other","s":"2026-08-23","e":null,"st":"15:00","et":null,"u":"formosa.extravaganza","c":"New York","co":"","p":"https://www.instagram.com/p/DbmJmqjjjjB/","x":"Introducing DJ @iamartela\n\nArtela is a Taiwanese DJ, producer, published songwriter with BMG, and classical pianist based between New York and London. Known for blending hypnotic grooves, driving rhythms, and melodic storytelling, she has performed across North America and Europe, including London‘s iconic Ministry of Sound, sharing lineups with artists such as KRYDER, Corey James, and Earl the Kid.\n\nArtela 是一位來自台灣、活躍於紐約與倫敦的 DJ、音樂製作人、BMG 簽約詞曲創作者，以及古典鋼琴家。 她以融合 hypnotic grooves、強勁律動與細膩旋律見長，曾於北美與歐洲多地演出，包括倫敦傳奇夜店 and get £5 exhibition tickets","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-05","ld":18,"dl":"2026-08-23","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"🎞️🌞 Cool off from the summer heat by joining us on Sun 16 and Sun 23 Aug for Tides of T...","k":"screening","s":"2026-08-23","e":null,"st":null,"et":null,"u":"ibraazlondon","c":"London","co":"","p":"https://www.instagram.com/p/DbvegXdCO6z/","x":"🎞️🌞 Cool off from the summer heat by joining us on Sun 16 and Sun 23 Aug for Tides of Tenderness — two specially selected films screening in our Minassa space. \n\n🎟️ Free tickets and more info on our website via the link in bio.\n\n🌊 Tides of Tenderness pairs Payal Kapadia’s (@payalkapadiafilm) acclaimed fiction feature debut, All We Imagine as Light (@allweimagineaslightfilm), with Férid Boughedir’s sun-drenched coming-of-age comedy A Summer in La Goulette. Set respectively in Mumbai and the Tunisian seaside town of La Goulette, both films explore female friendship and the pursuits of desire and freedom against the backdrop of coastal life.\n\nSun 16 Aug — All We Imagine as Light (dir. Payal Kapadia, 2024). Payal Kapadia's fiction feature debut is a sweeping and luminous portrait of female friendship against the heady atmosphere of modern Mumbai. \n\nSun 23 Aug —A Summer in La Goulette (dir. Férid Boughedir).\nMeriem, Gigi, and Tina are the central figures in this sun-drenched coming-of-age film, set amid the sea air of La Goulette. The three friends make a pact that this summer will mark the start of their journey into desire and sensuality, challenging familial and communal order.\n\n#Ibraaz #IbraazLondon","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-07","ld":16,"dl":"2026-08-23","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Provocative artworks exploring romance and rivalry, the personal and the political, and...","k":"exhibition","s":"2026-08-23","e":null,"st":null,"et":null,"u":"lacma","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DbvuTqUHIdv/","x":"Provocative artworks exploring romance and rivalry, the personal and the political, and the monotony and mystery of daily life ↑\n\nFor more than 50 years, Eileen Cowin has blurred the distinction between nonfiction and fiction. “Between Panic and Paradise” highlights the artist’s work with experimental photographic processes, Polaroids, inkjet prints, and videos\n\nOpens August 23 | More info at the 🔗 in bio","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":16,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"2026 Para Site Workshops for Arts Professionals","k":"workshop","s":"2026-08-24","e":"2026-08-30","st":null,"et":null,"u":"parasite.hk","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbsijagPJd_/","x":"2026 Para Site Workshops for Arts Professionals\n📅24–30 August 2026 \n📍Hong Kong\n\nThe 9th edition of our Workshops for Arts Professionals runs alongside the International Conference, ‘Unsubscribe All!’. This year, we’re diving into where contemporary art meets technology – beyond inevitability narratives, towards alternative methodologies for artistic production, collaboration, and knowledge exchange.\n\n🌐Rather than treating tech as a ‘black box’, we approach it as socially embedded infrastructure shaping our environments, languages, and communities. With a regional focus on Asia-Pacific, the programme tackles resource sharing, cross-disciplinary collaboration, and equitable access.\n\n🧠Over 7 intensive days of workshops, site visits, lectures, and discussions, participants will engage with an incredible lineup of facilitators:\n🎙️Winnie Soon (@siusoon) & Mara Karagianni – collaborative publishing + queer coding\n🎙️Clara Che Wei Peh (@claralikesart) – emerging tech in Southeast Asian art ecosystems\n🎙️Sophie Penkethman-Young (@sophiep_y) – digital museum culture\n🎙️Ashley Lee Wong (@ashley.lee.wong) – cultural economies of art and tech\n🎙️Ziyang Wu (@ziyang_wu_art) – AI and worlding strategies\n🎙️Günseli Yalcinkaya (@gunseliiiiii) – online culture and digital myth-making\n\n✨ Congratulations to the 2026 participant cohort:\nFranco Brobio (@frunkkun), Jeremy Chen (@dragonhawaiichen), John Chow Ho Fung (@john0829), Guo Cheng (@cheng.guo), Erfan Ghiasi, Danny Hartanto Kristiawan (@__d.nn), Ana Marinkovic (@anksyee), Iacopo Prinetti (@iacprinetti), Crassula Shang (@crassula.shang), Lua Vollaard (@fangedluamena), canvaswan (@canvaswan), Ailsa Wong (@ailsa.ww), and Hui Ye (@huiyeist).\n\nThis workshop is a closed‑door gathering for intensive collaboration – stay tuned to our social media for insights and highlights!\n\n🔗 Link in bio for full details\n\n#ParaSite #ParaSite30 #Workshop #Technology #Art\n\n[Chinese translation and image credit in the comment]","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":18,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Inter-Waves is coming to Edinburgh Fringe @edfringe Join us if you’re in town 🌊","k":"exhibition","s":"2026-08-25","e":null,"st":"13:00","et":"15:00","u":"kakilangarts","c":"Edinburgh","co":"United Kingdom","p":"https://www.instagram.com/p/DbGNbiTDrI7/","x":"Inter-Waves is coming to Edinburgh Fringe @edfringe Join us if you’re in town 🌊\n⠀\nIn collaboration with New Earth Theatre @newearththeatre, With Spice @with_spice_oommoo, ESEA Creatives Scotland @eseacreatives, Hannah Low @hannahlow_ (with support from National Theatre of Scotland) and Dance Base @dancebase — this Edinburgh edition is a two-hour session of sharings from our partners, followed by an open exchange for inspiration, resources and support.\n⠀\n🗓️ Tuesday 25 August, 1-3pm\n📍 Dance Base, Edinburgh\n🎟️ Free — spaces limited, sign up via Eventbrite link in bio","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-22","ld":34,"dl":"2026-08-25","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Recap: The Power of Play⁠","k":"workshop Everything » and Claudia Rankine’s « Triage », the project approaches collapse not as failure but as a generative condition for artistic and collective invention, seeking new forms of coherence capable of holding collapse.\nOrganized by the Racial Imaginary Institute (TRII) in collaboration with the DAAD Artists-in-Berlin Program and Friche la Bella de Mai.\nSupported by Terra Foundation, MacArthur Foundation, Marsha Garces Williams, Swell Foundation, Opportunity Fund, and Choisir la cause des femmes","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-31","ld":28,"dl":"2026-08-28","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Me and my bestie pulling up to the box office for FLC's upcoming series Bibliomania: A ...","k":"screening","s":"2026-08-28","e":"2026-09-03","st":"18:30","et":null,"u":"filmlinc","c":"New York","co":"","p":"https://www.instagram.com/p/DbrHBSRlFCj/","x":"Me and my bestie pulling up to the box office for FLC's upcoming series Bibliomania: A Preface to CHRONOVISOR.\n\n🎟️ are now on sale for our 15-film repertory series taking place from August 28-September 3! 🎟️: filmlinc.org/bibliomania\n\nA New Directors/New Films 2026 selection, CHRONOVISOR is Kevin Walker and Jack Auen’s utterly unique debut feature. Presented in the lead-up to the film’s theatrical release, Bibliomania gathers films that find suspense, jokes, terror, revelation, strange pleasures, and formal invention in acts that might, at first glance, seem almost impossible to dramatize.\n\nThe schedule is as follows:\n\n- CHRONOVISOR (2026) | opens September 4 with Kevin Walker and Jack Auen in person\n\n- BALL OF FIRE (1941) on 35mm 🎞️ | August 30 at 3pm and August 31 at 1pm\n\n- CURSE OF THE DEMON (1957) on 35mm 🎞️ | August 28 at 4pm and September 3 at 6pm (intro by Kevin Walker and Jack Auen)\n\n- THE CHANGELING (1980) | August 29 at 6:30pm (intro by Kevin Walker) and September 1 at 3:45pm\n\n- THE NAME OF THE ROSE (1986) | North American Premiere of 4 t 28 til January 31 2027 the @museumrietberg is presenting the exhibition \"Red: Masterpieces of Chinese Lacquerware\".\n\nDelicate lines, intense colours, shimmery surfaces: the Chinese lacquerware objects shown in this exhibition speak to a form of art refined and developed over centuries. Carved lacquers featuring as many as 150 layers of lacquer, objects with delicate mother-of-pearl inlays or artworks using the intriguing kuancai technique, revealing a quiet poetry that astonishes the viewer.\n\nWith its rich formal language and symbols, such lacquerwares offer insight into Chinese culture and beliefs. Favoured motifs in Chinese art such as dragons, bats, and winter plum blossom convey good wishes and tidings of joy understood in China without a need for words. The lacquerware displayed here are more than a feast for the eyes, inviting visitors on a journey through the history of Chinese culture.\n\nIn collaboration with LWL Museum of Art and Culture, Münster\n\nDate: August 28 2026 until January 31 2027\n\nLocation: Museum Rietberg, Gablerstrasse 15, 8002 ZURICH\n\n#museumrietberg #chineselacquerware #zurich","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":32,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Our new poster for the 4K restoration of Idrissa Ouedraogo’s classic of West African ci...","k":"exhibition","s":"2026-08-28","e":null,"st":null,"et":null,"u":"filmmovement","c":"","co":"","p":"https://www.instagram.com/p/DbTPE-juCcu/","x":"Our new poster for the 4K restoration of Idrissa Ouedraogo’s classic of West African cinema, SAMBA TRAORÉ, opening August 28 at @filmlinc before expanding!\n\nPoster designed by @la_moutique.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":32,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🎟️ are now on sale for the great Burkinabé director Idrissa Ouédraogo's SAMBA TRAORÉ, w...","k":"exhibition","s":"2026-08-28","e":null,"st":null,"et":null,"u":"filmlinc","c":"New York","co":"","p":"https://www.instagram.com/p/DbY8mprFBe8/","x":"🎟️ are now on sale for the great Burkinabé director Idrissa Ouédraogo's SAMBA TRAORÉ, winner of the Silver Bear at the 1993 Berlinale! Newly restored in 4K, the film remains one of the decisive works of African cinema.\n\nSAMBA TRAORÉ opens at FLC on August 28! 🎟️: filmlinc.org/samba\n\nOuédraogo’s fifth feature begins with a botched service-station robbery and follows its lone survivor home, where a suitcase of stolen cash begins to look, at least from a distance, like providence. Back in his village, Samba (Bakary Sangaré) buys cattle, opens a bar with a childhood friend, marries the woman he once loved (Mariam Kaba) and becomes a father figure to her young son, even as rumor and conscience gradually expose the shaky terms of his new life. Ouédraogo, who in the 1990s began drawing his humanist realism in closer contact to genre stylism, deploys the film’s thriller shape to examine what guilt does to a man once his material life begins to flourish, and how a community comes to share, profit from, and finally question the lie on which that prosperity rests.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":30,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Lust auf Sampler, Synthesizer und Drumcomputer? Melde dich an für einen spannenden Soun...","k":"workshop","s":"2026-08-28","e":null,"st":null,"et":null,"u":"kulturrucksackdortmund","c":"Dortmund","co":"","p":"https://www.instagram.com/p/DbIgj9-Cjla/","x":"Lust auf Sampler, Synthesizer und Drumcomputer? Melde dich an für einen spannenden Sound- und Videoworkshop mit @sascha_wundes im @kuenstlerinnenhaus_dortmund -Vorkenntnisse brauchst du nicht, nur Lust zu experimentieren!\n\n🗓️🕒 Datum & Uhrzeit\n24.08-28.08.2026\nTäglich von 11-17 Uhr\n\nSowie 5 Termine im September, von 11-16 Uhr. Am 04.10.2026 werden wir nach gemeinsamer Absprache im mex-Keller performen. \n\n📍 Wo\nKünstler*innenhaus Dortmund\nSunderweg 1\n44147 Dortmund\n\n📩 Anmeldung\nSascha Wundes\nworkshop@saschawundes.de\n0162-4003311\n\nFoto: (c) Sascha Wundes\n\nGefördert durch den Kulturrucksack NRW und das Kulturbüro Dortmund\n\n#kulturellebildung #kreativindortmund #kulturrucksacknrw #soundexperiments #kuenstlerhausdortmund #kulturrucksackdortmund #kreativindortmund #multimediaworkshop #kulturindortmund","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":36,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"« Fall after fall, we imagine. »","k":"exhibition","s":"2026-08-28","e":null,"st":null,"et":null,"u":"daad_artists","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbdoPtTDGV0/","x":"« Fall after fall, we imagine. » \n\nJoin us for UNWORLDING at Friche la Belle de Mai in Marseille!\n\n✨ Exhibition Opening on August 28, 2026\n🎤 Festival from September 3 to 5, 2026\n💛 Free admission, register online now to save a seat\n\nUnworlding. A site for conversation, collapse, collision, creation, and community—an exhibition and series of public events bringing together artists and writers to reimagine structures and relationships amid social and institutional breakdown. Inspired by Jack Halberstam’s forthcoming book « Anarchitecture After Everything » and Claudia Rankine’s « Triage », the project approaches collapse not as failure but as a generative condition for artistic and collective invention, seeking new forms of coherence capable of holding collapse.\n\nOrganized by the Racial Imaginary Institute (TRII) in collaboration with the DAAD Artists-in-Berlin Program and Friche la Belle de Mai.\n\nSupported by Terra Foundation, MacArthur Foundation @macfound Marsha Garces Williams, Swell Foundation, Opportunity Fund, Choisir la cause des femmes, Radio Grenouille\n\nDesign: @studiopandan","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-31","ld":28,"dl":"2026-08-28","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"\"Woven Memory\"","k":"other","s":"2026-08-28","e":null,"st":null,"et":null,"u":"lowgroundpressure","c":"Budapest","co":"","p":"https://www.instagram.com/p/DbulclFlxHL/","x":"\"Woven Memory\"\nArtist: Sonia Navarro @sonianavarro.estudio\nCurated by: Marcella Koczkás, Ani Molnár @marcella_koczkas @ani.molnar.ani\n📍am projects, Bródy Sándor u. 22, Budapest @amprojects_budapest\n05.06-28.08.2026\n\nRead the complete text on lowgroundpressure.blog web platform (🔗 in stories).\n\n📸 Mátyás Gyuricza @mattgyuricza, courtesy the artist and the gallery;\n\n#contemporaryart #artisttoday #lowgroundpressure #arttoday #artist","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":21,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"First look at the official poster for the new 4K restoration of DER FAN, opening August...","k":"exhibition","s":"2026-08-28","e":null,"st":null,"et":null,"u":"posteritati","c":"","co":"","p":"https://www.instagram.com/p/DbtaGNtx3Xr/","x":"First look at the official poster for the new 4K restoration of DER FAN, opening August 28 at @metrograph via @funcityeditions \n\nPoster design by @lukeinsect and further layout by @scottsaslow \n\nLuke Insect: “I wanted to give the artwork a New Wave feel, echoing the music and styling of the pop singer ‘R’ who is the object of our anti-heroine’s affection and obsession, and also reflect the excellent soundtrack to the film itself by Rheingold. I researched rare German Post-Punk and New Wave vinyl single sleeves, utilising fonts from that era (the early 80s). I also wanted the artwork to have a kind of cold, industrial feel so stripped back the colour scheme to a duotone of black, white and red.”","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":22,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Pause estivale 🔔","k":"exhibition","s":"2026-08-28","e":null,"st":null,"et":null,"u":"lafayetteanticipations","c":"Paris","co":"","p":"https://www.instagram.com/p/DbkpD0VNpI2/","x":"Pause estivale 🔔\n\nLa Fondation s’offre une pause estivale du 3 au 28 août inclus.\n\nRendez-vous à la rentrée pour la @ParisDesignWeek avec ‘Vie des Formes’, une exposition pensée avec @artsalula, @designspacealula et l’Agence Française pour le développement d’AlUla (AFALULA) du 8 au 13 septembre. Puis, laissez-vous surprendre par notre Festival Échelle Humaine avec @festivaldautomne, du 17 au 20 septembre.\n\nEnfin, le mois d’octobre regorge de surprises avec les expositions de Yu Nishimura, dont les peintures traversées de paysages marins et de présences fugaces explorent la frontière entre réel et imaginaire, d’Hélène Fauquet, qui compose des ensembles sculpturaux sensibles autour de la mémoire, des coquillages et de la notion de cadre, ainsi que de @MungoThomson, dont les installations interrogent notre perception du temps, des images et des technologies du quotidien.\n\nÀ bientôt pour une rentrée riche en découvertes !\n\n-\n\nSummer Break 🔔\n\nThe Fondation is taking a summer break from 3 to 28 August included. We look forward to seeing you in September for u for @ParisDesignWeek with “Life of Forms”, an exhibition conceived in collaboration with @artsalula, @designspacealula and AFALULA, from 8 to 13 September. Then, be amazed by our Festival Échelle Humaine with @festivaldautomne, from 17 to 20 September.\n\nOctober is packed with surprises, featuring exhibitions by Yu Nishimura, whose paintings - imbued with seascapes and fleeting presences - explore the boundary between reality and the imagination; by Hélène Fauquet, who creates evocative sculptural installations centred on memory, seashells and the concept of framing, and by @MungoThomson, whose installations challenge our perception of time, images and everyday technologies.\n\nSee you soon for a new season full of discoveries!\n___________________⁣⁣\n#LafayetteAnticipations #ContemporaryArt #Paris","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":25,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"\"Night Ruins,\" Nigel Cooke's (@nigelcookestudio) first solo exhibition in Tokyo, opens ...","k":"exhibition","s":"2026-08-28","e":"2026-10-10","st":null,"et":null,"u":"pacegallery","c":"Venice","co":"","p":"https://www.instagram.com/p/Dbtd_LbGyv3/","x":"\"Night Ruins,\" Nigel Cooke's (@nigelcookestudio) first solo exhibition in Tokyo, opens later this month at our #AzabudaiHills gallery.\n-\nSpotlighting a selection small-scale works created during his residency at Fondazione Querini Stampalia (@fondazionequerinistampalia), \"Night Ruins\" builds on Cooke's ongoing exhibition \"Bad Habits\" in Venice.\n-\nIn Cooke’s words, “This sequence of works offer alternatives on a core set of my concerns, but also of the spaces created in the larger paintings in 'Bad Habits'—tributaries that run from a source, fragments that break from a whole.\"\n-\nNigel Cooke: Night Ruins\nAugust 28 – October 10\nAzabudai Hills, Tokyo\n-\nLearn more about the exhibition at the link in bio.\n-\nArtwork: Nigel Cooke, \"The Island,\" 2026 © Nigel Cooke\n#NigelCooke #PaceGallery #Painting #ContemporaryArt","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":22,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"David Blandy's 2025 FVU-commissioned film 'Commons' screens at @braziersinternationalfi...","k":"screening","s":"2026-08-28","e":null,"st":null,"et":null,"u":"filmvidumbrella","c":"","co":"UK","p":"https://www.instagram.com/p/DboEPm3GgFV/","x":"David Blandy's 2025 FVU-commissioned film 'Commons' screens at @braziersinternationalfilmfest as part of the programme 'Unfolding Archives' on Friday 28 August 🎬\n\n'Commons' draws on the collections of objects and specimens at The Amelia Scott, Tunbridge Wells and The Beaney, Canterbury. This expansive work combines archive film with three dimensional scans and newly captured footage of ancient rocks and woodland: common land preserved for all. @david_blandy_\n\nThis collage of samples reveals a series of stories told by multiple voices; like the Pilgrims of Chaucer’s Tales, the non-human subjects and objects tell each other chronicles of their experience, over years or millennia, deliberately decentring human existence. Inspired by the natural world and notions of resistance, characters are brought together on a pilgrimage across deep time, each speaking from their own subjectivity. ✨\n\n📆 Friday 28 August\n📍 Braziers International Film Festival, Oxfordshire \n🎟 Entry (without pass) £8. Day and weekend passes for the festival are available.\n🔗 Find out more on our website under 'What's On', link in bio!\n\n👀 Not able to make it? 'Commons' features for free on #FVUWatch, visit the link in bio to watch!\n\n--\n\nCommons was commissioned as part of The Open Road by The Amelia Scott, Tunbridge Wells, as part of the Kent and Medway Museum Partnership National Portfolio Organisation, and Film and Video Umbrella. Supported using public funding by Arts Council England.\n\n#filmandvideoumbrella #fvu #flamin #filmlondon #theamelia #theameliascott #forma #formahq #cementfields #threerivers #davidblandy #amaalsaid #samwilliams #movingimage","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":24,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Sacatar Institute · 2027 Open Call","k":"exhibition","s":"2026-08-28","e":null,"st":null,"et":null,"u":"opencallpalette","c":"","co":"Brazil","p":"https://www.instagram.com/p/DbtDrNqFVSr/","x":"Sacatar Institute · 2027 Open Call\n8-week residency · Itaparica, Bahia, Brazil\nAll disciplines · International · $25 application fee\n\nWhat you get:\nPrivate bedroom with attached bathroom\nThree daily meals (except Saturday evenings, Sundays, Brazilian holidays)\nIndividual studio suited to your discipline\nWeekly laundry service\nRound-trip airport transfer (Salvador - Itaparica)\nLogistical support connecting you to Itaparica and Salvador’s art scene\nOfficial Letter of Support to help secure outside travel/project grants\n⚠️ Airfare, stipend, and materials not covered\n⚠️ One French artist may receive additional support (airfare + stipend) via Villa Fatumbi partnership\n\nFormat:\n5 sessions per year · ~8 weeks each · 6-8 artists per session\nAll Fellows arrive and depart together\nFirst week: structured orientation and tours\nFinal week: Open Studios (informal - not a premiere or formal exhibition)\nNo obligation to produce a finished work\n\nWho it’s for:\nIndividual artists of all disciplines and nationalities · no group proposals\nNo age limit (past Fellows ranged 21–83)\n❌ Former Sacatar Fellows not eligible for this call\n⚠️ Must attend alone - no family, partners, or pets (except guide dogs)\n\n💡 Palette’s take: Founded in 2001 on a 9,000m² oceanfront property in the Bay of All Saints, Sacatar is a genuinely low-tech, community-oriented residency - each session guarantees at least four different disciplines among the cohort. The emphasis is explicitly on process over output: no requirement to present finished work. The setting is remote and communal by design; artists should arrive prepared for shared meals, unreliable wifi, and daily proximity to the property’s wildlife\n\n📍 Itaparica Island, Bahia, Brazil\nSessions: throughout 2027\n⏰ Deadline: August 28, 2026\n\n🔗 sacatar.org/en/fellowships/\n\n#palette_residency #palette_latinamerica #palette_alldisciplines #palette_community palette_process","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":22,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"NEW ON OUR SHELVES⁠","k":"launch","s":"2026-08-29","e":null,"st":"18:00","et":null,"u":"distanzverlag","c":"Frankfurt","co":"","p":"https://www.instagram.com/p/Dbvqmd2iPRv/","x":"NEW ON OUR SHELVES⁠\n⁠\n“KI&” grapples with discourses around Al technologies in the perspectives of art, design, and the humanities: the anthology collects essays, short writings, works of art, and aesthetic ncy · Open Call 2027","k":"performance","s":"2026-08-31","e":null,"st":null,"et":null,"u":"opencallpalette","c":"Monterrey","co":"","p":"https://www.instagram.com/p/DbqxnN6Gv9t/","x":"MORA Residency · Open Call 2027\n3-month residency · Monterrey, Mexico\nEmerging artists · International · Free to apply\n\nWhat you get:\nWorkspace adapted to your practice\nMentorship from local artists, curators, and cultural agents\nConnection to Monterrey’s creative ecosystem\nParticipation in local exhibitions, talks, open studios, and events\nℹ️ Studio & programme provided (accommodation & travel are self-funded)\n\nWho it’s for:\nArtists of any discipline: painting, sculpture, installation, performance, mixed media, photography, new media\nAges 21-35 · emerging or mid-emerging practice\n⚠️ International artists only - must not be Mexican and must be living outside Mexico\nWorking knowledge of English or Spanish (basic communication sufficient)\n\nTo apply:\nSingle PDF: portfolio (or website link)\nArtist statement (max 200 words)\nShort bio or CV (max 1 page)\nProject proposal (max 1 page)\nSelect preferred period: Spring 2027 or Autumn 2027\nVia moraresidency.com\n\n💡 Palette’s take: MORA is an independent artist residency founded by @danyest and @anzaandres in San Pedro Garza García, part of the Monterrey metropolitan area - close to the Sierra Madre Oriental. Past residents have exhibited at institutions including the Museo Metropolitano de Monterrey and Casa de la Cultura San Pedro. The programme is explicitly reserved for artists based outside Mexico, positioning itself as a cultural exchange platform rather than a local production space\n\n📍 San Pedro Garza García, Monterrey, Mexico\nResidency periods: Spring 2027 · Autumn 2027\n⏰ Deadline: August 31, 2026\n\n🔗 moraresidency.com\n\n#palette_residency #palette_latinamerica #palette_emerging #palette_alldisciplines #palette_exchange","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":26,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"*Please turn your phone landscape and turn up the sound* —— This is a snippet, one day,...","k":"exhibition","s":"2026-08-31","e":null,"st":null,"et":null,"u":"edatkinsdiet","c":"Seoul","co":"","p":"https://www.instagram.com/p/DbVQvGqoZo3/","x":"*Please turn your phone landscape and turn up the sound* —— This is a snippet, one day, from a new film called 'Passive Mech'. I've made lots of new photographic things — timelapses, frottages, reliefs — for a show at Gladstone's new spot in Seoul. The show's called '1 day in space', and it opens on August 31st. Please come and say hello if you're around; I don't really know anyone in Seoul x —— \"In '1 day in space', Ed Atkins presents a series of expanded photographic works that mobilise the medium’s technologies, formal strategies, and temporal concerns to allegorise creaturely life.\" @gladstone.gallery","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":34,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Have you ever wanted to build a tower of 3D digital letters, then knock it over? This i...","k":"workshop","s":"2026-09-01","e":null,"st":"17:00","et":null,"u":"letterformarchive","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbnuqOEEwY2/","x":"Have you ever wanted to build a tower of 3D digital letters, then knock it over? This is the class for you.⁠\n⁠\nBlender Typography with Rob Stenson⁠\nTue, Sep 1 – Tue, Sep 22, 2026⁠\n5:00pm–8:00pm PT (10:00am–1:00pm AEST)⁠\nPublic Workshop - Online via Zoom⁠\n4 sessions, 3 hours each⁠\n⁠\nThis class will focus on building and animating typography in three dimensions using the open-source program Blender and the open-source Blender extension ST2, which brings native high-quality — and cutting-edge — typography to the Blender ecosystem. Blender can be a daunting program to learn, and when you do set out to learn it, most of what you’ll find online has absolutely nothing to do with typography. Which is why this class exists: to lead you on a tour of this powerful 3D program, always with an eye on how it can be used as a tool in your typographic toolkit. ⁠\n⁠\nTap this image from the link in our bio to reserve your spot!⁠\n⁠\n#TypeDesign #TypeClasses #GraphicDesignLearning #ExtendedLearning #OnlineLearning  #calligraphy#lettering ⁠#typography #graphicdesign #script #handlettering #graphicarts #calligraphicarts#publicationdesign ⁠\n⁠","r":false,"b":"reserve","af":true,"so":false,"pd":"2026-08-04","ld":28,"dl":"2026-09-01","ds":"event start","ap":false,"rel":false,"q":true},{"now":false,"t":"📣 Applications are now CLOSED for Young Climate Prize Cycle 03!","k":"exhibition","s":"2026-09-01","e":null,"st":null,"et":null,"u":"youngclimateprize","c":"","co":"Netherlands","p":"https://www.instagram.com/p/DaQao0akTW6/","x":"📣 Applications are now CLOSED for Young Climate Prize Cycle 03!\n\nThis year, 490 extraordinary young climate leaders from 85 countries shared their inspiring projects with us and applied to join the Cycle 03 cohort, participate in our Design Academy, and receive mentorship from some of the world’s leading architects, designers, and innovators.\n\nThank you to everyone who applied and to everyone who amplified the open call 🐋\n\nWe can’t wait to review applications and meet the next Young Climate Prize cohort!\n\n⏱️ The review process is already underway. Shortlisted applicants will be contacted before September 1, 2026.\n\n🌍 The Cycle 03 cohort will be announced September 10, 2026.\n\nIn the meantime, visit the link in our bio to learn more about the Young Climate Prize, explore past cohorts, and discover other ways to get involved and Change Tomorrow 🔗\n\nThe Young Climate Prize is an accelerator created by @theworldaround to support global leaders under the age of 25 who are working on the front lines of the climate crisis through mentorship and intergenerational collaboration. The Design Academy is supported by a grant from @obelfoundation and facilitated by our academic partner @aaschool .  The Official Design Partner of Young Climate Prize is @millerknoll.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-01","ld":62,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Paradise Rains is here. It’s a song about buying back my childhood farm with my husband...","k":"screening","s":"2026-09-01","e":null,"st":null,"et":null,"u":"eartheater","c":"","co":"","p":"https://www.instagram.com/p/DYSBH2Vjmna/","x":"Paradise Rains is here. It’s a song about buying back my childhood farm with my husband and conceiving our baby the day we first went back to set foot on the property. So many memories, good and bad, were resuscitated, and calloused tensions dissolved by the showers of deep love with my new little family. My mother sold the farm 20 years earlier when I was 15. My brother reminded me that when we packed up and left I said “I’m going to get it back one day” — I remember the inexplicable sadness I felt and how I didn’t even believe my mantra but it made me feel better to say it anyway. Fast forward two decades to me opening realty.com for the first time and within 15 mins of me scrolling my farm glazed across the palm of my hand. I choked and thought I was hallucinating. I looked over to Will in the drivers seat and stuttered that my old farm was for sale and he immediately said “we’re getting it babe” without even looking at it and I knew he was serious. We were already driving to Pennsylvania to visit family so it’s like it was already in motion and we were just finding out. The next day we went to the property. A few weeks later I went to a birth center where they looked inside me and saw a little bean — they can clearly measure how old the embryo was and the midwife said “looks like you conceived on September 1st” — the day we went and looked at the farm. I told my mom and she gasped and said “I got pregnant with your big brother when I first saw the farm and decided to buy it 40 years earlier!” There’s something in the water💧The video comes out Friday because I want you guys to have a moment with just the music first.","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-13","ld":111,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"\"Haruspex,\" a solo exhibition of new paintings by Kraków-based artist Krzysztof Grzybac...","k":"opening","s":"2026-09-03","e":"2026-10-03","st":"18:00","et":"20:00","u":"pacegallery","c":"Warsaw","co":"Poland","p":"https://www.instagram.com/p/DbYZPm2jqkQ/","x":"\"Haruspex,\" a solo exhibition of new paintings by Kraków-based artist Krzysztof Grzybacz (@krzysztofgrzybacz), opens soon at #PaceLondon.\n-\nMarking Grzybacz's first solo exhibition in the UK, the presentation will feature new work that explores the body as a construct, how it holds memories of past selves, and how those selves remain visible as we age.\n-\nKrzysztof Grzybacz: Haruspex\nSeptember 3 – October 3\nOpening reception:\nThursday, September 3, 6 – 8 PM\n5 Hanover Square, London\n-\nFollow the link in bio to learn more about the exhibition.\n-\nArtwork: Krzysztof Grzybacz, \"Torso,\" 2026 © Krzysztof Grzybacz\n\n#KrzysztofGrzybacz #PaceLondon #ContemporaryArt #Painting","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":36,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"On 3 Sep, Smugglers Way (@smugglersway) presents its first-ever label showcase at the I...","k":"performance","s":"2026-09-03","e":null,"st":"19:30","et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/DbwGRXPm_-Q/","x":"On 3 Sep, Smugglers Way (@smugglersway) presents its first-ever label showcase at the ICA in partnership with Eat Your Own Ears (@eatyourownears).\n\nHeadlining the night is the debut live performance from Ela Minus (@elaminus) & Nick León (@nicknoexit), celebrating their collaborative EP qué les pasó an  mis amigos? Born from years of mutual admiration and an i
