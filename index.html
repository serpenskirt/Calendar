utional collections including the Brooklyn Museum, New York; Castello di Rivoli, Turin; and the Uffizi Galleries, Florence. Continue reading in Artsy Editorial through our bio link 🤳","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Our workshop turns into a stage!","k":"performance","s":"2026-08-06","e":null,"st":null,"et":null,"u":"kunsthallebasel","c":"Basel","co":"","p":"https://www.instagram.com/p/DbkkEbWDhyZ/","x":"Our workshop turns into a stage! \n\nJoin us for balmy summer evenings in the Kunsthalle Basel yard, as part of the \"Werkstatt Sessions\", featuring live sound performances.\n\nThurs, 06.08.2026\n7–10 p.m.\n“Werkstatt Sessions” with free entry to our current exhibitions\n\n8–9 p.m.\nSound performance by WAT TAKLAEW (@iheartgecko)\n\nBYOB: bring your picnic blanket, favourite drinks and snacks, and settle into the laid-back atmosphere.\n\nPowered by Kraft E.L.S (@kraft_e.l.s._ag) \n\nCredits: @iheartgecko","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":3,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Everyone wants everything to happen at once but in the first of our 1 Granary Summer Sc...","k":"other","s":"2026-08-06","e":null,"st":null,"et":null,"u":"1granary","c":"","co":"","p":"https://www.instagram.com/p/DbqQMd1MLnO/","x":"Everyone wants everything to happen at once but in the first of our 1 Granary Summer School conversations,  @ceciliebahnsen argues the opposite: build slowly, and build with people who grow with you. In part one of the series, she walks us through why she waited five years before launching, how a business plan taught her to pace herself, why the factory that sewed her first dresses still makes them today, and when to hire. “I am building a brand for the long run,” she says, “so it’s also okay that it doesn’t all happen tomorrow.” Head to the link in bio for the full article.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":1,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Fondazione Prada Film Fund 2026","k":"screening","s":"2026-08-06","e":null,"st":null,"et":null,"u":"opencallpalette","c":"Milan","co":"","p":"https://www.instagram.com/p/DbgJ0RAld1U/","x":"Fondazione Prada Film Fund 2026\nIndependent film production grant · Milan, Italy\nProduction companies only · International · Free to apply\n\nGrant amounts:\nDevelopment: €15,000 - €80,000\nProduction: €30,000 - €250,000\nPost-production: €15,000 - €100,000\nTotal annual fund: €1.5 million · 12–14 films selected\n\nWho it’s for:\nRegistered production companies only - individual directors/producers cannot apply\nIndependent producers not controlled by broadcasters or distributors\nApplicant must cover at least 20% of total project costs\nMust have produced at least 2 feature films premiered at a listed major international festival (Cannes, Venice, Berlinale, Sundance, TIFF, and others - full list on website)\nNo geographic, genre, theme, or language restrictions on the project itself\n❌ Applications accepted only in English\n\nEligible projects:\nFeature films, minimum 65 minutes · any genre including documentary\n\nDevelopment: min. 20% of total budget + 70% of development budget already secured\nProduction: min. 50% of total budget already secured\nPost-production: min. 80% secured · completion within 6 months of application\nOverhead costs capped at 10% of total budget\n\nTo apply:\nDocumentation varies by stage: synopsis, treatment/script, pitch deck, moodboard, detailed budget, financial plan, director/producer CVs\nDeadline: August 6, 2026 (production stage) · September 10, 2026 (development/post-production)\n\n💡 Palette’s take: A well-funded initiative from Fondazione Prada extending its two-decade commitment to cinema. The eligibility bar is high - the festival premiere requirement effectively limits applicants to production companies with an established international track record, not first-time producers. Selected films must credit Fondazione Prada prominently in opening and closing credits and grant Milan’s Cinema Godard the right to host the first public screening\n\nResults: February 2027\n⏰ Deadline: August 6, 2026 (production) · September 10, 2026 (development/post-production)\n\n🔗 fondazioneprada.org/film-fund\n\n#palette_grant #palette_funded #palette_europe #palette_cinema #palette_established","r":false,"b":"register","af":true,"so":false,"pd":"2026-08-01","ld":5,"dl":"2026-08-06","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"Tonight Thursday August 6, 7pm ET!","k":"talk","s":"2026-08-06","e":null,"st":"19:00","et":null,"u":"microscope_gallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbtLzi7x0Ej/","x":"Tonight Thursday August 6, 7pm ET!\nArtist Talk: Faith Holland\nIn conversation with Brian Belott\nIn-Person and Live-Streamed\n\nImage: Faith Holland, “Green (Before the Word),” 2026, Single-channel video, 1 hour 39 minutes 59 seconds\n\n#faithholland #artisttalk #brianbelott #aiscribble #microscopegallery","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Tomorrow Thursday August 6, 7pm ET","k":"talk","s":"2026-08-06","e":null,"st":"19:00","et":null,"u":"microscope_gallery","c":"New York","co":"","p":"https://www.instagram.com/p/Dbq5dLHzo6g/","x":"Tomorrow Thursday August 6, 7pm ET\nArtist Talk: Faith Holland\nIn conversation with Brian Belott\nIn-Person and Live-Streamed\n\nMicroscope is very pleased to present a conversation between artists Faith Holland and Brian Belott as the first event in our new location. The discussion is taking place in connection with Holland’s current solo exhibition at the gallery “Scribble Scrabble Slop,” featuring new works in video, sculpture and digital art for which the artist attempted to train various AI models to draw like a child by feeding them databases of her child’s earliest drawings.\n\nThe talk will address questions posed by the works on view, such as why can’t AI scribble like a child and whether there are better AI training methods than those that involve the indiscriminate scanning of everything available, often leading to the technology’s inability to distinguish actual source material from AI-generated ones and resulting in a cycle of ever-increasing proliferation of AI slop.\n\nThe conversation will also touch upon Rhoda Kellogg’s philosophy and work on child art, which Holland references in her new video “The Twenty Basic Scribbles,” as well as Kellogg’s vast collection of children’s art of which Belott has been a longtime archivist.\n\nThe event will take place in-person at the gallery and will also be live-streamed on the event page on our website at 7pm ET on August 6th. Admission is free.\n\n[Image: From Holland’s series of custom-trained AI drawings (detail)]\n\n#faithholland #artisttalk #brianbelott #ai #microscopegallery","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-05","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Thursday August 6, 7pm ET","k":"talk","s":"2026-08-06","e":null,"st":"19:00","et":null,"u":"microscope_gallery","c":"New York","co":"","p":"https://www.instagram.com/p/DboktKWHXyg/","x":"Thursday August 6, 7pm ET\nArtist Talk: Faith Holland\nIn conversation with Brian Belott\nIn-Person and Live-Streamed\n\nMicroscope is very pleased to present a conversation between artists Faith Holland and Brian Belott as the first event in our new location. The discussion is taking place in connection with Holland’s current solo exhibition at the gallery “Scribble Scrabble Slop,” featuring new works in video, sculpture and digital art for which the artist attempted to train various AI models to draw like a child by feeding them databases of her child’s earliest drawings.\n\nThe talk will address questions posed by the works on view, such as why can’t AI scribble like a child and whether there are better AI training methods than those that involve the indiscriminate scanning of everything available, often leading to the technology’s inability to distinguish actual source material from AI-generated ones and resulting in a cycle of ever-increasing proliferation of AI slop.\n\nThe conversation will also touch upon Rhoda Kellogg’s philosophy and work on child art, which Holland references in her new video “The Twenty Basic Scribbles,” as well as Kellogg’s vast collection of children’s art of which Belott has been a longtime archivist.\n\nThe event will take place in-person at the gallery and will also be live-streamed on this page at 7pm ET on August 6th. Admission is free.\n\nImages:\n1. Faith Holland “Black pen picture by (1).jpg,” 2026, pigment print on archival paper from custom-trained AI model, 7 x 10 1/2 inches\n2. Drawing from the Rhoda Kellogg Child Art Collection\n3. Faith Holland (left) and Brian Belott (right)\n\n#faithholland #artisttalk #AIscribbles #brianbelott #microscopegallery","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-04","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"On Andy Warhol’s birthday today, take a look at how our Conservation team prepared Warh...","k":"exhibition","s":"2026-08-06","e":null,"st":null,"et":null,"u":"whitneymuseum","c":"New York","co":"","p":"https://www.instagram.com/p/Dbs6Pv0BSEz/","x":"On Andy Warhol’s birthday today, take a look at how our Conservation team prepared Warhol’s Ethel Scull 36 Times for exhibition in 2019’s Andy Warhol—From A to B and Back Again.\n\nWhile the work looks like one giant canvas, it’s actually 36 individual smaller ones that need to be carefully mounted together. For this project, all 36 of the portraits were removed from their cleats and mounted on a unified strainer.\n\nThe painting—Warhol’s first portrait commission—is on view now in our seventh floor exhibition “Untitled” (America).\n\n#warholfoundation\n—\nAndy Warhol, Ethel Scull 36 Times, 1963. Acrylic and screenprint on canvas, thirty-six parts, 80 × 144 in. (203.2 × 365.8 cm). Whitney Museum of American Art, New York; jointly owned by the Whitney Museum of American Art and The Metropolitan Museum of Art; Gift of Ethel Redner Scull 86.61a-jj. © 2026 The Andy Warhol Foundation for the Visual Arts, Inc. / Licensed by Artists Rights Society (ARS), New York. Used with permission of @warholfoundation","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Kiang Malingue is pleased to present at its New York space, Once More Encore: The First...","k":"exhibition","s":"2026-06-25","e":"2026-08-07","st":null,"et":null,"u":"kiangmalingue","c":"New York","co":"","p":"https://www.instagram.com/p/DZe0OhcMptF/","x":"Kiang Malingue is pleased to present at its New York space, Once More Encore: The First Year of Benny's Video Remixed, an exhibition by Benny's Video, a curatorial project of artist Craig Jun Li, on view from June 25 to August 7, 2026.\n\nDubbed as a “nomadic curatorial project for freaks and lovers,” from May 2025 to April 2026, Benny’s Video was sited at a 130-square foot artist studio sublet in Bushwick, Brooklyn, and presented nine exhibitions. The scale of the location led to exhibitions consisting of two to seven artists. In parallel to connective interests across its program, several artists presented works in multiple exhibitions, creating a chainlink effect.\n\nImage: Altered polaroids depicting a bouquet at 𝘈 𝘎𝘢𝘮𝘶𝘵, 𝘉𝘦𝘯𝘯𝘺’𝘴 𝘝𝘪𝘥𝘦𝘰, scratched plexiglass from a failed frame job used as a work surface, abandoned matboard, razor blade, from Craig Jun Li studio.\n\n#KiangMalingue #NewYork #hkny #2026","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-12","ld":13,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Work on view","k":"exhibition","s":"2026-07-15","e":"2026-08-07","st":null,"et":null,"u":"rainraingallery","c":"New York","co":"","p":"https://www.instagram.com/p/Da0YLJLFgbh/","x":"Work on view\n\nKhia Hong 횽기하\nLest We Perish of the Truth, 2026\nSite specific installation: Mirror, acrylic sheet, glass, glass slide, light bulb, styrofoam, paper, tape, window frame, PVC, plastic wrap, almond oil, Vaseline\n35 × 35 × 16 inches\n#khiahong\n\n𝙒𝙚𝙩𝙬𝙖𝙧𝙚, curated by 𝗦𝗽𝗶𝗻𝗲, continues through August 7 at RAINRAIN. @spine.nyc \n\n📷: @new_document_ \n\n#RAINRAIN","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Work on view","k":"exhibition","s":"2026-07-22","e":"2026-08-07","st":null,"et":null,"u":"rainraingallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbGVhOflm8c/","x":"Work on view\n\nAlison Knowles \nFound Gloves In Line, 2018 \nFound gloves and leather string with loop \n77 × 7 inches\n#AlisonKnowles\nCourtesy the Estate of Alison Knowles and James Fuentes Gallery, New York. \n\n𝙒𝙚𝙩𝙬𝙖𝙧𝙚, curated by 𝗦𝗽𝗶𝗻𝗲, continues through August 7 at RAINRAIN. @spine.nyc \n\n📷: @new_document_ \n\n#RAINRAIN","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"I Thought It Belonged to Me","k":"exhibition","s":"2026-07-24","e":"2026-08-07","st":null,"et":null,"u":"virtualtai","c":"","co":"","p":"https://www.instagram.com/p/DbLkIH4Fb1H/","x":"I Thought It Belonged to Me\noil on canvas \n78 x 45 inch \n\nRevisited Balzac’s The Unknown Masterpiece and discovered Wharton’s The House of the Dead Hand while making this painting for The Vandals at @gladstone.gallery curated by Julian Ehrlich and Alissa Bennet. On view through Aug 7","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Work on view","k":"exhibition","s":"2026-07-27","e":"2026-08-07","st":null,"et":null,"u":"rainraingallery","c":"Milan","co":"","p":"https://www.instagram.com/p/DbUL784lBmn/","x":"Work on view\n\nAviva Silverman\nDrifters, 2026\nRosaries, resin\n11 ¾ × 7 ¾ × ¾ inches\nCourtesy the artist and VEDA, Milano.\n#avivasilverman\n\n𝙒𝙚𝙩𝙬𝙖𝙧𝙚, curated by 𝗦𝗽𝗶𝗻𝗲, continues through August 7. @spine.nyc \n\n📷: @new_document_ \n\n#RAINRAIN","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"On view now at Kiang Malingue New York, Once More Encore: The First Year of Benny’s Vid...","k":"screening","s":"2026-07-28","e":"2026-08-07","st":null,"et":null,"u":"kiangmalingue","c":"New York","co":"","p":"https://www.instagram.com/p/DbUpSCrFEwH/","x":"On view now at Kiang Malingue New York, Once More Encore: The First Year of Benny’s Video Remixed, an exhibition by Benny’s Video, a curatorial project of Craig Jun Li.\n\nBy foregrounding the structure of display and production, and redirecting looking towards the periphery, artworks serve as placeholders to address conditions where “other things happen.” In reorienting the perception of an object or an image, a spatial openness points outwards, hinged, as Li describes, “between recognition and imagination.” Through seriality and repetition, the acts of cutting and voiding out reveal internal structures, social systems, and private and public gathering spaces, in shelter and in intimacy: pairs of Alan Ruiz’s window frames slotted with glass and one-way mirror sliced at 45 degrees, Gwenn Thomas’s trio of box-like wooden sculptures that invite light into their softly painted interiors, Dean Sameshima’s photographic diptych shot from both sides of rough-hewn deep red gloryhole partitions as stereoscopic viewing, and Joy Episalla’s to-scale photographs of turned-off television screens that reflect and chronicle hotel rooms in the moments before check-out.\n\nPlan your visit through August 7, 2026, at 50 Eldridge Street, New York.\n\nImages:\n1) Alan Ruiz, WS-E3-2, 2019. Aluminum, glass, hardware, rubber, dimensions variable \n2) Alan Ruiz, WS-E3-1, WS-E3-1A, 2019. Aluminum, glass, one-way mirror, hardware, rubber, dimensions variable \n3) Installation view\n4-6) Gwenn Thomas, Standard Candles, 2017-2021. Wood and acrylic paint, 20 ½ x 18 ½ x 14 ¼ in each. Courtesy of the artist and EXILE\n7) Installation view\n8) Dean Sameshima, Erdbeermund, 2023. Archival inkjet print, 23 5/8 x 16 1/2 in each. Courtesy of the artist and Soft Opening\n9-10) Joy Episalla, TV 1 (Naples), 2005 and TV 6 (Buffalo), 2006. Chromogenic print mounted to plexiglas and wood frame, 14 ¼ x 16 ½ in and 20 x 23 in\n11) Installation view\n\n#KiangMalingue #hkny #2026","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"LIVE STREAM MARATHON: we are going live daily through Aug 7!","k":"other","s":"2026-07-31","e":"2026-08-07","st":"20:00","et":null,"u":"art.prof","c":"New York","co":"","p":"https://www.instagram.com/p/DbcUk7SNuQO/","x":"LIVE STREAM MARATHON: we are going live daily through Aug 7! \n\nFirst stream will be Fri July 31 @ 8pm EST. Comment and tell me if you’ll be there! \n\nXoxo Prof Liru","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Work on view","k":"exhibition","s":"2026-07-31","e":"2026-08-07","st":null,"et":null,"u":"rainraingallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbdXA1alKDC/","x":"Work on view\n\nRafael Sánchez\nFrom the series, The Honey Jar, 2003\nNine photographs\nEach: 10 × 9 inches\nCourtesy the artist and Martos gallery, New York.\n@allupinit_123 \n\n𝙒𝙚𝙩𝙬𝙖𝙧𝙚, curated by 𝗦𝗽𝗶𝗻𝗲, continues through August 7. @spine.nyc \n\n📷: @new_document_ \n\n#RAINRAIN","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This is the FINAL week to visit Once More Encore: The First Year of Benny’s Video R Residency, exploring how artists engage with the resources, infrastructure, and opportunities available to them. They also reflect on what it means to live and work together in a residency—learning from one another, sharing everyday life, and creating a space for exchange.\nThe conversation naturally raises broader questions: What can still inspire a younger generation about art? And what can art offer us today?\nThe Residency is also a concept that demonstrates an ideal form of adaptive reuse for a building that is more than 500 years old. It explores how a place like Willebadessen can be made sexy through art and what art means for us as a society.\n\nThe conversation is in English.\n\n🔗 Link in Bio!\n\nAvailable on Spotify, Apple Podcasts and Amazon Music. \n\n#one. #passageresidency","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"BEVERLY HILLS — Join us tonight, August 7 from 5-8 PM, for cocktails in the courtyard a...","k":"exhibition","s":"2026-08-07","e":null,"st":"17:00","et":"20:00","u":"hoffman.donahue","c":"","co":"","p":"https://www.instagram.com/p/DbvVjYElocn/","x":"BEVERLY HILLS — Join us tonight, August 7 from 5-8 PM, for cocktails in the courtyard and a special presentation of works from Hoffman Donahue, Marc Selwyn Fine Art, and Nonaka-Hill, accompanied by Persian bites from Mameg.\n\nThe presentation includes works by Elana Bowsher, Susan Cianciolo, Rafael Delacruz, Lynn Hershman Leeson, Caitlin MacQueen, Andy Robert, alongside objects from the Perfect Nothing Catalog.\n\nFriday, August 7, 5–8 PM\n417 N Camden Drive\nBeverly Hills, CA 90210\n\nThe presentation will remain on view Saturday, August 8, from 11 AM–6 PM.\n\nImage: Rafael Delacruz, Stair Writing Civic, 2025. Oyster shell, acrylic, oil, wood block print on canvas. 75 x 85 inches (190.50 x 215.90 cm).\n\n@marcselwynfineart @nonakahillgallery @mameg_la @theperfectnothingcatalog @elanabowsher @5th_dimensional_plain_ @lynn.l.leeson @winter_caitlin @theperfectnothingcatalog","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"BEVERLY HILLS — Join us Friday, August 7 from 5-8 PM, for cocktails in the courtyard an...","k":"exhibition","s":"2026-08-07","e":null,"st":"17:00","et":"20:00","u":"hoffman.donahue","c":"","co":"","p":"https://www.instagram.com/p/DbqRUmtlpWA/","x":"BEVERLY HILLS — Join us Friday, August 7 from 5-8 PM, for cocktails in the courtyard and a special presentation of works from Hoffman Donahue, Marc Selwyn Fine Art, and Nonaka-Hill, accompanied by Persian bites from Mameg – including objects from the Perfect Nothing Catalog.\n\nFriday, August 7, 5–8 PM\n417 N Camden Drive\nBeverly Hills, CA 90210\n\nThe presentation will remain on view Saturday, August 8, from 11 AM–6 PM.\n\nImage: The Perfect Nothing Catalog, Medium box (angel), 2025. Mixed metals and various stones on found objects. 5 x 3 x 4 inches (12.70 x 7.62 x 10.16 cm).\n\n@marcselwynfineart @nonakahillgallery @mameg_la @theperfectnothingcatalog","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This Friday, Warm Up brings global bass, hard drum, and ethereal sounds to the stage. G...","k":"other","s":"2026-08-07","e":null,"st":null,"et":null,"u":"momaps1","c":"New York","co":"","p":"https://www.instagram.com/p/DbqmjQnDBmP/","x":"This Friday, Warm Up brings global bass, hard drum, and ethereal sounds to the stage. Grab your tickets now to experience four artists tracing the outer edges of the global underground right in our courtyard. \n\nBADSISTA (@badsista_)\nThe São Paulo DJ and producer fuses house, bass, and baile funk into a global sound born in Brazil's peripheries. His debut album Gueto Elegance is the stage at the center of the whole world he built from the ground up.\n\nTOCCORORO (@toccororo)\nThe high-energy Cuban-Spanish DJ and curator runs guaracha into raptor house into aleteo into hardstyle. A standout of Spain's queer club scene and far, far beyond.\n\nToxe (@_toxe_)\nThe Gothenburg producer and DJ bends hard drums and unusual melodies into a brightly frenetic, potent sound that has led her to produce runway soundtracks for fashion houses Acne, Burberry, and Dior.\n\nnguyendowsXP (@_n_x_p)\nThe shapeshifting NYC producer and DJ slips between a gauzy, ethereal expanse and frenetic, kinetic shrapnel. A member of Saigon's Nhạc Gãy collective.\n\n—\n📸: @marissaalper","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-05","ld":2,"dl":"2026-08-07","ds":"run closes","ap":false,"rel":true,"q":false},{"now":true,"t":"Opening this Friday, August 7, the group exhibition ‘everybody’ at Georg Kolbe Museum i...","k":"exhibition","s":"2026-08-07","e":null,"st":null,"et":null,"u":"berlinartlink","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbkWUkQnadq/","x":"Opening this Friday, August 7, the group exhibition ‘everybody’ at Georg Kolbe Museum is an attempt to rethink the body, imagining it within utopian contexts. Bringing together works by the likes of Pauline Boudry and Renate Lorenz, EVA & ADELE, Carolyn Lazard and Monilola Olayemi Ilupeju, the exhibition is a space for vulnerability, connectedness and, above all, autonomy. Within the context of the museum, works sit beside Georg Kolbe’s modern sculptures in the museum garden. Kolbe’s pieces depict a normative, often heroic and idealised body which are countered by the exhibition’s resistant and expansive conceptions.⁠\n⁠\nRead more about events happening across Berlin this week at the link in bio. ⁠\n⁠\nImage: EVA & ADELE: ‘Biographische Skulptur No. 33,’ 2020 // © EVA & ADELE, Berlin, VG Bildkunst, Bonn, photo by Bernd Borchardt⁠\n⁠\n@georgkolbemuseum @pauline_yavor @evaandadele @insicknessandstudy @monilola⁠\n#thisweek #body #corporeality #utopia #autonomy","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Maggie Cheung delivered one of the best performances of her career in Stanley Kwan’s l...","k":"exhibition","s":"2026-08-07","e":null,"st":null,"et":null,"u":"filmmovement","c":"New York","co":"","p":"https://www.instagram.com/p/Dbqe51tx2L6/","x":"“Maggie Cheung delivered one of the best performances of her career in Stanley Kwan’s lush, definitive and boldly conceived biopic.” (@thefilmstage)\n\nReturning to theaters for its 35th Anniversary, the 4k restoration of Stanley Kwan’s CENTER STAGE opens in NYC at @filmforumnyc this Friday, August 7 with Kwan in-person for Q+As.\n\nTickets available via our link in bio.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-05","ld":2,"dl":"2026-08-07","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Happy August FFAT!☀️","k":"exhibition","s":"2026-08-07","e":null,"st":null,"et":null,"u":"firstfridayarttraillbk","c":"","co":"","p":"https://www.instagram.com/p/DbvgSdfDt-A/","x":"Happy August FFAT!☀️ \n\nIt’s another sunny day in West Texas and we’re looking forward to seeing our art community come together! 💛 \n\nWe’ve got a couple new exhibits up in our @lhucalubbock galleries from artists @kristykristinek & @franbound and head over to @casp_lbk for pretty neat installation exhibit you’ll want to have a seat in. 🪑 \n\nStay hydrated, support local art, grab some sweet treats and have a blast! We’re looking forward to seeing everyone later tonight! ✨🫶","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Immerse yourself in Liz Glynn’s ‘Open House’ at Storm King Art Center. This weekend, jo...","k":"performance","s":"2026-08-07","e":null,"st":"18:30","et":null,"u":"paulacoopergallery","c":"New York","co":"","p":"https://www.instagram.com/p/Dbn5aQHOtGF/","x":"Immerse yourself in Liz Glynn’s ‘Open House’ at Storm King Art Center. This weekend, join Glynn for performances and an artist talk on the occasion of her installation. \n\nOn Friday, August 7 & Saturday, August 8 at 6:30 PM, Glynn and dancers will activate ‘Open House’ with ‘Folly (1-2-3)’, a deconstructed waltz slowly decaying in the landscape and gesturing toward new construction. Viewers are welcome to wander through the durational performance as the sun sets.\n\nOn August 8 at 4 PM, Glynn and assistant curator Adela Goldsmith will be in conversation about the work.\n\nTo learn more and RSVP, visit @stormkingartcenter \n\n#LizGlynn @lzglynn #PaulaCooperGallery\n__\nInstallation view of Liz Glynn, ‘Open House’ (detail) at Storm King Art Center, Mountainville, NY, 2026. Photo by Jess Glass","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-08-04","ld":3,"dl":"2026-08-07","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"This weekend at PS21, experience the U.S. premiere of Walid Raad’s ‘Two Drops per Heart...","k":"performance","s":"2026-08-07","e":null,"st":"19:30","et":null,"u":"paulacoopergallery","c":"New York","co":"","p":"https://www.instagram.com/p/Dbl0BjhO_zo/","x":"This weekend at PS21, experience the U.S. premiere of Walid Raad’s ‘Two Drops per Heartbeat’, a captivating performance where the artist imagines and narrates a series of encounters with enigmatic artifacts. \n\nJuxtaposing his own works with objects from Madrid’s Thyssen-Bornemisza National Museum, Raad unravels their histories and peculiarities—only to find ever more intricate stories concealed within.\n\nPerformances will take place on Friday, August 7 & Saturday, August 8 at 7:30 PM. For more information, visit @ps21chatham \n\n#WalidRaad #PaulaCooperGallery\n_\nPerformance view, ‘Walid Raad: Two Drops per Heartbeat’. Walid Raad. Cotton Under My Feet, Museo Nacional Thyssen-Bornemisza, Madrid, Spain, 2021. Photo: Moritz Bernoully | TBA21 | © Walid Raad. Courtesy the artist, Sfeir-Semler Gallery, Beirut/ Hamburg; Paula Cooper Gallery, New York.","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-03","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Today we’re featuring a text by MOST’s own co-editor-in-chief, Katie Zazenski @kathryn....","k":"exhibition","s":"2026-08-07","e":null,"st":null,"et":null,"u":"mostmagazine__","c":"Vienna","co":"","p":"https://www.instagram.com/p/DbvEYGdDGeX/","x":"Today we’re featuring a text by MOST’s own co-editor-in-chief, Katie Zazenski @kathryn.zazenski . In the end of May, Zazenski spent a long weekend in Vienna as a field reporter for the 2026 Independent Space Index Festival @independentspaceindex\n\nZazenski writes, “…this time in Vienna showed me that for all that unites us (the ‘independent’ community), there are stark differences among us yet. And what I found myself asking over the course of the weekend, through the 30+ projects I visited out of the 68 on view, was what is an independent space in Vienna, and what is gained and what is lost through naming oneself as independent in the broader (European continent) context? While struck by a few specific works during my time at the festival, I found myself less concerned with evaluating individual exhibitions than with understanding the conditions that shape this community, and trying to stretch and revise my expectations for what we call independent.”\n\nRead the full report on our website, mostmagazine.org\n💫\n\n#mostmagazine #independentspaceindex #vienna #artculturepolitics","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"🍿 🕺 In our new episode of The Concessions Counter, LATE FAME director and former Artist...","k":"other","s":"2026-08-07","e":null,"st":null,"et":null,"u":"filmlinc","c":"New York","co":"","p":"https://www.instagram.com/p/Dbq3iaIqdC2/","x":"🍿 🕺 In our new episode of The Concessions Counter, LATE FAME director and former Artistic Director of @thenyff Kent Jones joins us behind the counter in the lobby of the Walter Reade Theater to reflect on his NYFF memories, the enduring legacy of the Julie Andrews-starring family hit MARY POPPINS (1964), and more.\n\nView the full conversation at youtube.com/filmlinc\n\nSee LATE FAME at Film at Lincoln Center beginning this Friday. Get tickets at filmlinc.org/fame","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-05","ld":2,"dl":"2026-08-07","ds":"run closes","ap":false,"rel":true,"q":false},{"now":true,"t":"Sold out in a New York minute ⭐️ Willem Dafoe, Edmund Donovan, and Kent Jones will be j...","k":"exhibition","s":"2026-08-07","e":null,"st":null,"et":null,"u":"magnoliapics","c":"New York","co":"","p":"https://www.instagram.com/p/DbqxpUDmnDX/","x":"Sold out in a New York minute ⭐️ Willem Dafoe, Edmund Donovan, and Kent Jones will be joined by very special guests at @filmforumnyc and @filmlinc to talk #LateFame this weekend. \n\nLATE FAME opens in NYC this Friday. Opening in LA and other cities starting next Friday. \n\n🎟️ latefamemovie.com","r":false,"b":null,"af":false,"so":true,"pd":"2026-08-05","ld":2,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"“Wetware” CLOSES TODAY at @rainraingallery! Visit us before 6pm at 110 Lafayette St, 2n...","k":"screening","s":"2026-08-07","e":null,"st":"18:00","et":null,"u":"spine.nyc","c":"Cleveland","co":"","p":"https://www.instagram.com/p/Dbv2WbeFO39/","x":"“Wetware” CLOSES TODAY at @rainraingallery! Visit us before 6pm at 110 Lafayette St, 2nd floor 🐠\n\nThese are stills from Tishan Hsu’s first video work, “Folds of Oil” (2005), a 19-min recording of a custom software he made in collaboration with programmer Sam Jackson. Its fluctuating topographies contend with the flattening logic of the digital. Planes of grass, fur, oil, skin, scale, and water warp and fold in tandem with a soundtrack that similarly mixes roaring, breathing, bleating, beeping, chirping, and sirens with an intense ASMR effect. Consciousness cannot be located neatly inside or outside a living subject as defined by the false threshold of the skin. Instead the body appears as a membrane, one with the screen.\n\nHsu (b. 1951) has long explored the interplay between flesh and interface, anticipating the ontological questions that shape our present. Skipping back three decades, Hsu’s painting, “New Portable” (1988) postures as a mechanical interface—its use unknown. A single stainless steel grip bar studs the center like the rung of a swimming pool ladder or a massive post-surgery staple. At either end, a scratched-in texture resembles hair, with darkened voids (orifices? dead screens?) floating at either end.\n\n“Folds of Oil” will appear in Hsu’s career-spanning exhibition opening at @mocacleveland later this month, alongside his most recent video work “emergent mesh” (2025).","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"We warmly invite you to the exhibition opening Paries, A temporary habitat for an archi...","k":"exhibition","s":"2026-08-07","e":null,"st":"18:00","et":"22:00","u":"airberlinalexanderplatz","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbdfWS3CNjQ/","x":"We warmly invite you to the exhibition opening Paries, A temporary habitat for an archive in transit !\n\nOpening: 07 August 25, 6–10 PM at Uq-Bar-A-Ba, Schwedenstr. 16\n13357 Berlin\n\nWhat happens when an archive is understood not as a place of preservation, but as one temporary condition within the continuous metabolism of matter?\n\nParies brings together fifty-four numbered fragments collected from Teufelsberg. Guided by the ecological logic of Parietaria, the wall pellitory, a plant that thrives where architecture slowly returns to geology, the project understands rubble not as the end of a building’s life, but as the beginning of new relationships.\n\nNeither exhibition nor archive in the conventional sense, Paries is a temporary habitat where fragments, bodies, attention and sound enter into new relationships before continuing their journeys elsewhere.\n\nArtist:\nGiuseppe Licari","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Subtle superstition of innocence unfolds around the quiet violence of ideas that have b...","k":"exhibition","s":"2026-08-07","e":null,"st":"18:00","et":null,"u":"maria_dont_carey","c":"Kraków","co":"","p":"https://www.instagram.com/p/DbiWpNeiFGX/","x":"Subtle superstition of innocence unfolds around the quiet violence of ideas that have become so familiar they appear natural. Innocence, purity, motherhood, femininity, and care are often presented as timeless values, yet they are shaped by cultural narratives, religious symbolism, and political interests. The exhibition asks what remains when these inherited ideals begin to fracture.\nThe works examine the bodies onto which these expectations are projected. Who is permitted to decide over a body, and who benefits from restricting that autonomy? Rather than offering fixed answers, the exhibition exposes the mechanisms through which control is aestheticized, moralized, and quietly normalized. Recurring symbols - such as the swan, long associated with purity, grace, and idealized femininity, or the color pink, historically redefined as a marker of gender - are displaced from their familiar meanings. Their transformation reveals that what is often perceived as natural is, in fact, constructed, rehearsed, and maintained. Once these symbols are unsettled, they begin to speak of loss, resistance, and the possibility of change rather than innocence itself.\nThe title suggests that innocence functions less as a state than as a superstition: a fragile belief sustained through repetition. It promises protection while demanding conformity, disguising systems of exclusion and control beneath \nthe language of morality and care.\nSubtle superstition of innocence invites viewers to look beyond appearances and to question the myths that continue to shape ideas of gender, reproduction, and belonging. The exhibition is questioning what has long been accepted as norm and asks for a change that should have happened already long time ago and states out that it’s about time to put the patriarchy to the graveyard of the past.\n\nExhibition opening: 07.08.2026, 18:00\n\nGaleria Piana\nDługa 15, 31-147, Kraków\n\nthe exhibition takes place within the framework of the abroad atelier scholarship and artist residency of the cultural department of the province styria","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-02","ld":5,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Ceramic 47 (@ceramicfortyseven) is a contemporary ceramic studio in Athens run by Faye ...","k":"other","s":"2026-08-07","e":null,"st":null,"et":null,"u":"wedirectory","c":"Athens","co":"","p":"https://www.instagram.com/p/Dbvj3vojdMt/","x":"Ceramic 47 (@ceramicfortyseven) is a contemporary ceramic studio in Athens run by Faye Papargyropoulou, a ceramic artist working with deformation and irregular forms. Her work moves away from ideas of perfection, instead building sculptures that feel fragile, uncertain and human.\n\nToday we feature works from two of her projects: “What Remains”, which explores memory through a porcelain-coated sponge (fragile, protective, like wrapping something precious) with ceramic beads spilling from its rupture, and “From Fragility to Stability”, imagining a dance between two figures – one translucent, one rooted – where neither can stand without the other.\n\n→ Project of the week on WeDirectory\n\n_\nProduct photos: @koukousas_apostolis \nArtist portrait by: @koustenisnikos","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"The Free Friday Nights August lineup is here! Join us all month for music, dancing, and...","k":"concert","s":"2026-08-07","e":"2026-08-07","st":null,"et":null,"u":"whitneymuseum","c":"New York","co":"","p":"https://www.instagram.com/p/Dbn7rQRlV5d/","x":"The Free Friday Nights August lineup is here! Join us all month for music, dancing, and great art—all for free.\n\nAugust 7\n@publicrecordsnyc: @florelaurentienne_\n\nAugust 14\nDJ Sets: @kristine_barilli and @cruzcvaldez\n\nAugust 21\n@aileyextension Line Dance class with @pilinanice\n✨ Last chance to see the 2026 #WhitneyBiennial! ✨\n\nAugust 28\nDJ Set: @sunnaay\n\nAugust 7, 14, 21, 28\nFFN After Party: @papijuicebk at @littleislandnyc\n\n🔗 in bio for more info and to reserve free tickets.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-04","ld":3,"dl":"2026-08-07","ds":"event start","ap":true,"rel":false,"q":true},{"now":true,"t":"Set times for tomorrow","k":"other","s":"2026-08-07","e":null,"st":null,"et":null,"u":"blue____void","c":"","co":"","p":"https://www.instagram.com/p/DbrxF1qJMsp/","x":"Set times for tomorrow\n\nTicket link in bio, not heaps left","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-06","ld":1,"dl":"2026-08-07","ds":"run closes","ap":false,"rel":true,"q":false},{"now":true,"t":"𝐏𝐀𝐆𝐄𝐀𝐍𝐓 𝐓𝐀𝐊𝐄 𝐎𝐕𝐄𝐑?!?!?","k":"other","s":"2026-08-07","e":null,"st":null,"et":null,"u":"pageantpageantpageant","c":"Sydney","co":"","p":"https://www.instagram.com/p/DbqcfPcgH-z/","x":"𝐏𝐀𝐆𝐄𝐀𝐍𝐓 𝐓𝐀𝐊𝐄 𝐎𝐕𝐄𝐑?!?!?\nColor Theory presents SOUND RESTORER, a month-long series of live performances and sonic explorations at Pageant.\n\nJoin us this Friday, August 7 as we kick things off with Karaoke Night. Free entry.\n\nUpcoming Events:::::::\n\nFri 8/7 — Karaoke Night (Free)\nWed 8/12 — ROHANA • Laenz • Axine M\nThu 8/13 — Sydney Spann • STEMLINES • mhm,mhm\nFri 8/14 — Palabra Cecilia (SATB Vocal Ensemble) • Bob The Fisherman • MAYSUN\nThu 8/20 — Wet Currency (Mekko Harjo & NY Graffiti) • Sound Restorer (Johnny D & richmcd)\nSat 8/22 — Kfeelz • Eden Aurelius • Arushi Jain (DJ) • Mariposa • Albert\n\n🎟️ Tickets available through the link in our bio.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-05","ld":2,"dl":"2026-08-07","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Two days left to visit Once More Encore: The First Year of Benny’s Video Remixed at Kia...","k":"exhibition","s":"2026-08-07","e":null,"st":null,"et":null,"u":"bennysvide0","c":"New York","co":"","p":"https://www.instagram.com/p/DbrOzrAGat6/","x":"Two days left to visit Once More Encore: The First Year of Benny’s Video Remixed at Kiang Malingue, New York, on view until Friday, August 7 at 50 Eldridge Street. @kiangmalingue \n\nGrant Mooney\nEutectic c. (ii), 2023\nSpecialized jewelers vise, insulation, solder, cast mistletoe, silver, steel, bronze\n6 3/8 x 4 1/2 x 6 3/8 inch. (16.2 x 11.4 x 16.2 cm)\nCourtesy of the artist and @miguelabreugallery \n\nZoe Leonard\nDisplay VIII , 1991/2025\ngelatin silver print\n33 1/4 x 23 1/4 in.\nCourtesy of the artist and @maxwellgrahamgallery \n\n#GrantMooney @lilxl #ZoeLeonard","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Joy Episalla, foldtogram (chromo fl 2), 2026","k":"exhibition","s":"2026-08-07","e":null,"st":null,"et":null,"u":"bennysvide0","c":"New York","co":"","p":"https://www.instagram.com/p/DbqxbrhkXaQ/","x":"Joy Episalla, foldtogram (chromo fl 2), 2026\nLight sensitive chromogenic emulsion coated object, 33 x  25 x 10  inches\n\nJoy Episalla’s works are featured in Once More Encore: The First Year of Benny’s Video Remixed at Kiang Malingue, New York, on view until Friday, August 7 at 50 Eldridge Street. @kiangmalingue \n\nThe floor sculpture “foldtogram” in its name spins off of a word play on “photogram”, a process by which photographic materials are tasked to hold an image without a camera. In this instance, a large printed photograph of the gallery floor has been treated as sculptural materials beyond the bond of its standardized format. Heating, folding, bending, cracking… Episalla addresses the photograph as an expanded planar surface, pushing the photo paper to take on a new volume, the surface of which distorts the original image into a series of pockets pooling and refracting light, conjuring a sense of alchemical liquidity. Via this new architecture given to the original print, Episalla presents a floating image in situ wrestling against its rectangular constraint, pulling our gaze towards a new dimension.\n\n#JoyEpisalla @jepisalla","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Joy Episalla, TV 6 (Buffalo), 2006","k":"screening","s":"2026-08-07","e":null,"st":null,"et":null,"u":"bennysvide0","c":"New York","co":"","p":"https://www.instagram.com/p/DbqwwUPker6/","x":"Joy Episalla, TV 6 (Buffalo), 2006\nchromogenic print mounted to plexiglas + wood frame, 20 x 23 x 2 inches\n\nTV 1 (Naples), 2005\nchromogenic print mounted to plexiglas + wood frame, 14.25 x 16.5 × 2 inches\n\nJoy Episalla’s works are featured in Once More Encore: The First Year of Benny’s Video Remixed at Kiang Malingue, New York, on view until Friday, August 7 at 50 Eldridge Street. @kiangmalingue \n\nEpisalla has two “TV” works on view. This series operates off of a direct logic: the last glimpse of a hotel TV before checking out, shot on a 35 mm film camera at an angle to avoid reflection. Afterwards, she perspective-corrects the image back into the size and ratio of the original box TV. These works are all framed in a deep shadow box, holding the printed image mounted to the back of a sheet of non-glaring plexiglass. Episalla’s TV works turn the surface of display into an indexical portal towards an intimate yet estranged space. Oscillating between legibility and mystery, these devices for circulating images beyond borders have been repositioned as a lens directed at the artist’s own traces and absences. The only additional evidence we are left with are the titles, by which she simply names the city each monitor was encountered in. Episalla’s TVs amplify a signal: there’s always another picture behind the picture in front of you. Our daily lives are not distanced from broadcast news. We are right in front of it.\n\n#JoyEpisalla @jepisalla","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"#DavidNelson, Hole #19, 1999","k":"exhibition","s":"2026-08-07","e":null,"st":null,"et":null,"u":"helmet_lung","c":"New York","co":"","p":"https://www.instagram.com/p/DbtUul1mvce/","x":"#DavidNelson, Hole #19, 1999\nResin, dirt, roots, rocks, 10 x 16 x 10 in. (variable)\n\nA grouping of David’s hole sculptures are on view at Kiang Malingue, New York in Once More Encore: The First Year of Benny’s Video Remixed. Closing this Friday, August 7. @kiangmalingue \n\nOver the last year or so I got to exhibit this one in particular on multiple occasions. Until recently it has only been shown under standard fluorescent lights @bennysvide0 & @lower_cavity \n\nIn the sun at Kiang Malingue it becomes a kaleidoscope into the landscape, like a pond on a sunny day. What continues to excite me the most about David’s works is that he was able to treat every material like a camera, a lens. The photographic thinking in his practice seeps through everything and teaches us new ways to think about time, life and all the exposures within. His touch makes a brief contact eternally alive. Keeping a secret forever.\n\nFrom his interview with Nick Debs @nardebs1 in 2000:\n\nNick: What about the holes?\nDavid: I guess with the holes, it's like starting with the notion of a surface, of breaking a surface, and then encountering whatever it is when you get below, all the rocks and roots and stuff like that. And navigating through that space, but without really knowing what to expect.\n\nDavid: Digging holes is something kids do all the time. And when I first started doing it, I would go in the garden and do it at night because I was too embarrassed, l'm a 38 year old man with his arm in the ground. We become ashamed of things we did as little kids, a kind of mystery that was magical. I feel when I dig them it's very private and I want to get lost in it. So I wear earphones and play music really loud and try to distance all those hundreds of windows that surround my garden.\nWhen I did those holes out in Montauk I went off-season so I could avoid people, and this woman came up to me on the beach, there were very few people on the beach, and she said \"What are you doing?\" and I had my arm all the way in the ground, and like a little kid, I said \"Nothing\" and she said, \"You're digging a hole.\" and I said \"Yeah.\"\nNick: What a witch.\nDavid: Yeah, go away! It's private.\n\nThank you @barrypaddock","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"See you this Friday at Ni tan roto, ni tan entero, the final exhibition of our Internat...","k":"exhibition","s":"2026-08-07","e":null,"st":"17:00","et":"23:00","u":"radio28cs","c":"Mexico City","co":"","p":"https://www.instagram.com/p/DbrZqpPxzGR/","x":"See you this Friday at Ni tan roto, ni tan entero, the final exhibition of our International Program — July–August 2026.\n\nFriday, August 7 · 5–11 pm\nDolores 54, Centro, Mexico City\n\nCurated by Janila Castañeda (@janila_castaneda).","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Shireen Taweel's pacing seven circles is open at Gertrude Contemporary until 8 August 2...","k":"exhibition","s":"2026-06-13","e":"2026-08-08","st":null,"et":null,"u":"gertrudecontemporary","c":"Sydney","co":"","p":"https://www.instagram.com/p/Dayg6DbGUnb/","x":"Shireen Taweel's pacing seven circles is open at Gertrude Contemporary until 8 August 2026.⁠\n⁠\n13 June - 8 August 2026⁠\n21-31 High Street, Preston South⁠\nWurundjeri Country⁠\n⁠\npacing seven circles looks at the mobility of sanctuary, in which relocation, adaptation and repurposing form a process of sacred place making. Existing outside of the representation of past and future, the installation as sacred space sits in a temporal geography of existence and fabulation. pacing seven circles assembly of geometry, is the architectural infrastructure of a future oriented ritual. Draped in a fabric of blazing red pigment, it is unclear and fragile, although resilient in its radiating magnitude. Sculptural forms settle in the circles of fabric. The pierced copper forms are dislocating temporal markers of time, faith and science. Resonating with abstraction and vibration the pulse of the installation is of one who finds sanctuary in the unacquainted landscape.⁠\n⁠\n–⁠\n⁠\nShireen Taweel is represented by @stationgalleryaustralia, Naarm Melbourne and Sydney.⁠\n⁠\nThis project is supported by Creative Australia's Visual Arts and Crafts Strategy (VACS) Major Commissioning Projects fund.⁠\n⁠\npacing seven circles is an iterative exhibition presented with the trig point at @mosmanart, Sydney (2026) and Dunedin Public Art Gallery, Aotearoa New Zealand (2027).⁠\n⁠\n-⁠\n⁠\nShireen Taweel, pacing seven circles, 2026, installation view, Gertrude Contemporary, Naarm Melbourne, image courtesy of the artist and STATION, Naarm Melbourne and Sydney © the artist, photograph: Christian Capurro⁠\n⁠\n@shireen_taweel","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":-31,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Upcoming Exhibition: Asako Ujita: ‘Good Night’ from 18 June to 8 August 2026.","k":"screening","s":"2026-06-18","e":"2026-08-08","st":null,"et":null,"u":"luxmovingimage","c":"London","co":"","p":"https://www.instagram.com/p/DZKjU4kjRk0/","x":"Upcoming Exhibition: Asako Ujita: ‘Good Night’ from 18 June to 8 August 2026.\n\nLUX is delighted to present the first solo exhibition by artist and filmmaker Asako Ujita, featuring her new film ‘Good Night’.\n\n‘Good Night’ is a phrase spoken to a child before sleep, and to the dead before parting. Ujita’s film sits in this space where endings and beginnings overlap.\n\nMade during Ujita’s pregnancy with her first son, ‘Good Night’ journeys to southern Taiwan where her great-grandfather had lived during the Japanese occupation. Known to her through a single postcard, he becomes an invisible guide through lakes, forests, caves and country roads.\n\nHolding a tension between the landscape’s beauty and the colonial violence it contains, Ujita surfaces what the land holds and what it refuses to reveal.\n\nThe exhibition will be accompanied by a screening event programmed by Emma Bouraba responding to the exhibition. The film will be available with open captions by Carefuffle.\n\nFurther details are to be announced via the LUX website.\n\nDesign by Bernice Wong\n\n@asako_ut @b_erniceart @carefuffle","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-04","ld":14,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"UPCOMING: HEINRICH DUNST, SOPHIA EISENHUT, SIMON LEHNER","k":"exhibition","s":"2026-07-10","e":"2026-08-08","st":"18:00","et":null,"u":"kowberlin","c":"Berlin","co":"","p":"https://www.instagram.com/p/DaU5z-qsyyC/","x":"UPCOMING: HEINRICH DUNST, SOPHIA EISENHUT, SIMON LEHNER \nPARATEXT\nJUL 10—AUG 08\n\nJOIN US FOR AN EXHIBITION WALK-THROUGH WITH THE ARTISTS AT KOW ON FRIDAY, JULY 10TH AT 6 PM.\n\nThe opening starts at 4 pm with ice popsicles and drinks. \n\nWe are excited to spend a nice summer day together!\n\nYours always,\nKOW\n\n#heinrichdunst @sophiamagdalenaanna @simon_lehner","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-03","ld":7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Currently on view in New York in “The Vandals” at Gladstone organized by Alissa Bennett...","k":"exhibition","s":"2026-07-14","e":"2026-08-08","st":null,"et":null,"u":"broooooooooooooook","c":"New York","co":"","p":"https://www.instagram.com/p/DayCEKXlqdX/","x":"Currently on view in New York in “The Vandals” at Gladstone organized by Alissa Bennett and Julian Ehrlich. “The subtle tilt of your head while you were sitting on the floor” pictured here with Robert H. Colescott’s “Masked Lady.” Show runs through August 8.\n\n@gladstone.gallery \n@arnoldfriend6 @jsphere 💚","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Join us for the final week to view salt, Priyageetha Dia’s first solo exhibition in Aus...","k":"exhibition","s":"2026-08-01","e":"2026-08-08","st":null,"et":null,"u":"gertrudecontemporary","c":"Madrid","co":"","p":"https://www.instagram.com/p/DbejjudEwwL/","x":"Join us for the final week to view salt, Priyageetha Dia’s first solo exhibition in Australia. ⁠\n⁠\nUntil 8 August 2026⁠\nGertrude Contemporary⁠\n21-31 High Street, Preston South⁠\nWurundjeri Country⁠\n⁠\nAs a mineral compound, salt (NaCl) precedes human history and has long been implicated in the structures of trade and labour. It has shaped, scarred and sustained life across this planet in ways that continue to unfold. Salt preserves, extending the life of organic matter beyond its natural limit, while also corroding, gradually compromising whatever it encounters over time. Salt also plays a crucial role in the human body, present in blood, tears and sweat. Any account of salt should therefore contend with its simultaneous presence in geological formation, economic structure and bodily process, none of which can be understood in isolation from the others.⁠\n⁠\nIt is within this refusal – of the partition between ecological, corporeal, and technological analysis – that Priyageetha Dia’s new solo exhibition locates itself. As an artist working between Singapore and The Netherlands, Priyageetha approaches salt not simply as a material, but as a connective agent through which the entanglements of colonial history, diasporic experience and extractivist regimes across Southeast Asia and the broader Asia-Pacific region can be traced.⁠\n⁠\n– ⁠\n⁠\nPriyageetha Dia (b. 1992, Singapore) is an interdisciplinary artist working across time-based media and installation. salt is Priyageetha’s first solo exhibition in Australia.⁠\n⁠\n She is represented by @the_ryder_projects, Madrid.⁠\n⁠\n–⁠\n⁠\nPriyageetha Dia, salt, 2026, installation view, Gertrude Contemporary, Naarm Melbourne, images courtesy of the artist and The Ryder Projects, Madrid © the artist, photographs: Machiko Abe / Christian Capurro⁠\n⁠\n@priyageetha.dia @brigie.moriarty⁠\n⁠\n#GertrudeContemporary #PriyageethaDia #salt #Exhibition⁠","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Only two more weekends to catch “Splash\", a group exhibition presented at HESSE FLATOW ...","k":"talk","s":"2026-08-01","e":"2026-08-08","st":null,"et":null,"u":"hesse_flatow","c":"New York","co":"","p":"https://www.instagram.com/p/DbgBaRZj71l/","x":"Only two more weekends to catch “Splash\", a group exhibition presented at HESSE FLATOW EAST, Amagansett, in collaboration with Night Gallery. The exhibition is open today and tomorrow 12-6 or by appointment through August 8.⁠\n⁠\n\"Splash\" brings twenty-two artists working in abstraction together on Long Island, a place whose relationship to the history of American abstract painting is as deep as the paint itself. In the wake of local legacies, this exhibition asks what it means to be an abstract artist now: who inherits that legacy, who extends it, and on whose terms. Legendary painter Lee Krasner's work, made in the same light and landscape that surrounds Amagansett, remains a touchstone not only for the region but for the ongoing project of abstraction itself: rigorous, sensory, and persistently alive.⁠\n⁠\nImages: Installation View, \"Splash\", 2026. Courtesy of the artist and HESSE FLATOW, New York. Photo: Gary Mamay.\n\nArtworks\n\nAndrea Marie Breiling (b. 1979)\nHeatwave, 2026\nMixed media on raw canvas\n82 1/2 x 36 inches\n\nAng Ziqi Zhang (b. 1994)\nSupertonic, 2025\nOil on panel\n23 1/8 x 46 inches\n58 x 116 cm\n\nCarrie Rudd (b. 1994)\nSIBLING ORDER, 2026\nOil on canvas\n51 x 66 inches","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Keltie Ferris is featured in \"Splash\", a group exhibition presented at HESSE FLATOW EAS...","k":"exhibition","s":"2026-08-02","e":"2026-08-08","st":null,"et":null,"u":"hesse_flatow","c":"New York","co":"","p":"https://www.instagram.com/p/DbivWzbk8xL/","x":"Keltie Ferris is featured in \"Splash\", a group exhibition presented at HESSE FLATOW EAST, Amagansett, in collaboration with Night Gallery.⁠ The exhibition is open Saturdays and Sundays 12-6 or by appointment through August 8.⁠\n⁠\nKeltie Ferris's compositions channel the catalytic potential of medium and physical technique into expressions of physicality, energy, and change. Hand-painted pattern fields, bursts of spray paint and oil pastel, raised outlines, and pixelated backgrounds nod to a⁠ wide range of visual lineages, including natural motifs, ancient craftwork, Abstract Expressionism, and contemporary digital images. In his large-scale paintings, thick areas of medium are built up, then alternately swiped, blurred, and removed with a variety of tools.⁠\n⁠\nImage: Keltie Ferris, \"Atomic Mood\", 2020. Oil and acrylic on canvas in artist's frame, 53 x 53 inches - framed (134.6 x 134.6 cm - framed). Courtesy of the artist and Sikkema Malloy Jenkins. Photo: Jason Wyche.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-02","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Join us for the final week of Shireen Taweel’s solo exhibition pacing seven circles. ⁠","k":"exhibition","s":"2026-08-02","e":"2026-08-08","st":null,"et":null,"u":"gertrudecontemporary","c":"Sydney","co":"","p":"https://www.instagram.com/p/DbhIWqwE9O-/","x":"Join us for the final week of Shireen Taweel’s solo exhibition pacing seven circles. ⁠\n⁠\nUntil 8 August 2026⁠\nGertrude Contemporary⁠\n21-31 High Street, Preston South⁠\nWurundjeri Country⁠\n⁠\n⁠\npacing seven circles looks at the mobility of sanctuary, in which relocation, adaptation and repurposing form a process of sacred place making. Existing outside of the representation of past and future, the installation as sacred space sits in a temporal geography of existence and fabulation. pacing seven circles assembly of geometry, is the architectural infrastructure of a future oriented ritual. Draped in a fabric of blazing red pigment, it is unclear and fragile, although resilient in its radiating magnitude. Sculptural forms settle in the circles of fabric. The pierced copper forms are dislocating temporal markers of time, faith and science. Resonating with abstraction and vibration the pulse of the installation is of one who finds sanctuary in the unacquainted landscape.⁠\n⁠\n–⁠\n⁠\nShireen Taweel is represented by @stationgalleryaustralia, Naarm Melbourne and Sydney.⁠\n⁠\nThis project is supported by Creative Australia's Visual Arts and Crafts Strategy (VACS) Major Commissioning Projects fund.⁠\n⁠\npacing seven circles is an iterative exhibition presented with the trig point at @mosmanart, Sydney (2026) and Dunedin Public Art Gallery, Aotearoa New Zealand (2027).⁠\n⁠\n-⁠\n⁠\nShireen Taweel, pacing seven circles, 2026, installation view, Gertrude Contemporary, Naarm Melbourne, image courtesy of the artist and STATION, Naarm Melbourne and Sydney © the artist, photograph: Christian Capurro⁠ / Machiko Abe⁠\n⁠\n@shireen_taweel⁠\n⁠\n#GertrudeContemporary #ShireenTaweel #pacingsevencircles #Exhibition","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-02","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"‘Good Night’ is a phrase spoken to a child before sleep, and to the dead before parting...","k":"screening","s":"2026-08-05","e":"2026-08-08","st":"12:00","et":"17:00","u":"luxmovingimage","c":"London","co":"","p":"https://www.instagram.com/p/Dbp-4aIjdFq/","x":"‘Good Night’ is a phrase spoken to a child before sleep, and to the dead before parting. Ujita’s film rests in this threshold — where endings and beginnings fold into one another.\n\nThis is the final week to experience Asako Ujita: ‘Good Night’ at LUX. Open Thursday to Saturday, 12–5pm, closing 8 August.\n\nMassive thanks to our wonderful collaborators: Emma Bouraba for programming the screening, Flora Yin-Wong for a generous conversation, Bernice Wong for design, and Carefuffle for the creative captions, and to all our staff and external collaborators who supported the production.\n\n@asako_ut \n@emmabouraba\n@floraytw\n@b_erniceart\n@carefuffle\n\nImage: Installation of Asako Ujita: Good Night at LUX, London, 2026. Photography by Rob Harris.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Join us for our first stock sale ever, with all items $100 and under!","k":"other","s":"2026-08-07","e":"2026-08-08","st":"12:00","et":"19:00","u":"thegrotesquearchive","c":"New York","co":"","p":"https://www.instagram.com/p/Dblx9LRuP9x/","x":"Join us for our first stock sale ever, with all items $100 and under! \n\nShop heavily discounted mens + womenswear in a separate unit of our building:\n\nAugust 7th - 8th from 12-7pm\n139 Fulton St. #210\n\nShowroom at 605 will be operating as usual 12 - 7, no items available in store will be discounted.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Sofia Sinibaldi, Hinge (Hot and Cold), 2024","k":"exhibition","s":"2026-08-07","e":"2026-08-08","st":null,"et":null,"u":"bennysvide0","c":"New York","co":"","p":"https://www.instagram.com/p/Dbg8sy2Gf4r/","x":"Sofia Sinibaldi, Hinge (Hot and Cold), 2024 \nPigment-based inkjet on tissue paper, acrylic medium, backboard, aluminum frame, and acrylic glass\n42 ⅝ x 32 in; 108.3 x 81.3 cm\n\nThere is only one last week left to visit Once More Encore: The First Year of Benny’s Video Remixed, on view at Kiang Malingue, New York until Friday, August 7, at 50 Eldridge Street. @kiangmalingue\n\n#SofiaSinibaldi @sofiasinibaldi","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":6,"dl":null,"ds":null,"ap":true,"rel":false,"q":false},{"now":true,"t":"On August 8, join a series of programs around “Liz Glynn: Open House,” beginning with a...","k":"performance","s":"2026-08-08","e":null,"st":"18:30","et":null,"u":"stormkingartcenter","c":"New York","co":"","p":"https://www.instagram.com/p/DbRabbejQXG/","x":"On August 8, join a series of programs around “Liz Glynn: Open House,” beginning with a conversation with the artist at 4PM. Learn more about the history of the project, Glynn’s process, and the work’s first installation outdoors. \n\nFollowing the talk, Members are invited on an exclusive tour of the work with Assistant Curator Adela Goldsmith—become a Storm King Member to attend. \n\nStarting at 6:30PM a public performance will activate the installation. \"Folly (1-2-3)\" is a deconstructed waltz slowly decaying in the landscape and gestures toward new construction. Audiences are welcome to wander through the durational performance as the sun sets. An additional performance of \"Folly (1-2-3)\" will take place on August 7.","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-26","ld":13,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"🔊🔊🔊 Exhibition Extended 🔊🔊🔊","k":"exhibition","s":"2026-08-08","e":null,"st":"18:00","et":"21:00","u":"gallerysinclairnyc","c":"New York","co":"","p":"https://www.instagram.com/p/Daz4Cc9EQ61/","x":"🔊🔊🔊 Exhibition Extended 🔊🔊🔊\n\nWe are pleased to announce that Andina Marie Osorio’s exhibition “you’re just a bee charmer” has been extended and will be on view until Saturday August 8th. \n\nThe show features eight photographs—five candid family moments and three formal portraits—which have all been transformed through a collaborative process with a honeybee colony in New Haven, CT. Depicting a range of intimate events including holiday meals and loving embraces on slipcovered sofas, the ubiquity of these images disguise the exhaustive labor performed by women to orchestrate the moment.\n\nAs bees tear at the image, they create new forms that call into question the delicacy between precious nostalgia and physical erasure. Once a record of family life, the photographs are now quiet and deformed, unsettling the traditional understanding of archival record. \n\nWe are excited to spend more time with this work and will be announcing public programs soon. See the show, Thursday-Saturday from 6-9pm and Sundays 3-6pm.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":24,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Introducing Assembly—the cultural and educational layer of Fuser. A community of educat...","k":"launch","s":"2026-08-08","e":null,"st":null,"et":null,"u":"fuserstudio","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/Da3ZdxinT9y/","x":"Introducing Assembly—the cultural and educational layer of Fuser. A community of educators and creative practitioners, and contributors who teach, learn, and shape where this goes next.\n\nJoin us Saturday, Aug 8 in LA for a launch party and happy hour with DJ @olivekimoto \n\nLink in bio to RSVP.","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-16","ld":23,"dl":"2026-08-08","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"🦞 It’s finally for realll 🦞","k":"screening","s":"2026-08-08","e":null,"st":null,"et":null,"u":"female.boyfriends","c":"London","co":"","p":"https://www.instagram.com/p/DacqbAWjHQM/","x":"🦞 It’s finally for realll 🦞\nOn 8 August, we’re bringing together some of the hottest and most talented FLINTA* queer artists from London, Amsterdam, and Paris, alongside amazing local FLINTA* talent. 🐬\nFor one night only, we’re taking over an iconic location at MAS Antwerp with Mas darling for 10 hours of dancing, flirting, arm wrestling, and celebrating building community together.\nWe’ve never been this excited to celebrate FLINTA* Pride after a day of protest in Antwerp. 🦑\nBring your lovers. Bring your friends & allies. Bring your crushes & your exes. This one is going to be spicyyyy 🐡, and you do not want to miss it. \nKeep an eye on our page 👀 there are plenty of surprise announcements still to come.\n‼️Last year’s edition sold out‼️, so don’t wait last minute to get your ticket. We work with a pay-what-you-can system to keep the party affordable and accessible for everyone.\nLink in bio. 🎟️🎟️🎟️\n\n<33 @bringulda for the seahorses\n<33 @yasmine.d88 for all your help behind the screens","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-06","ld":33,"dl":"2026-08-08","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"we’re back at MAS Antwerp to celebrate trans and dyke pride this summer! 💗💗💗","k":"other","s":"2026-08-08","e":null,"st":null,"et":null,"u":"female.boyfriends","c":"Antwerp","co":"","p":"https://www.instagram.com/p/DZ-JlXLsfvu/","x":"we’re back at MAS Antwerp to celebrate trans and dyke pride this summer! 💗💗💗\n\non Saturday 8 August, we’re welcoming you to MAS for a FLINTA* pride clubnight, 10 hours of dancing and lots of surprises.\n \nwe can’t wait to share the iconic lineup we’ve prepared for you with national and international flinta artists.\n\nwe are a vital part of the queer community and are so often underrepresented, we’re so grateful to MAS for making space again for us to come together, connect, build community, and dance our asses off with friends and allies after a full day of protest.\n\n 🗓️🗓️🗓️mark #TypographyBooks #DesignTours #CollectionsTours ⁠\n⁠","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":true},{"now":true,"t":"“The current presentation is [...] an amuse bouche of Oldenburg’s career. [...] Yet it’...","k":"exhibition","s":"2026-08-08","e":null,"st":null,"et":null,"u":"paulacoopergallery","c":"New York","co":"","p":"https://www.instagram.com/p/Dbqv3t0oDDF/","x":"“The current presentation is [...] an amuse bouche of Oldenburg’s career. [...] Yet it’s enough to get the flavor of Oldenburg’s humor, the psychoanalytic precision with which he dismantled modern life’s anxieties and desires, and the serious unseriousness with which he rebuilt them.”—Max Lakin for The New York Times\n\nThe exhibition ‘Claes Oldenburg & Coosje van Bruggen: Lever House’ closes on Saturday, August 8. Reviewed in January 2025 by Max Lakin for @nytimes, the presentation features monumental indoor and outdoor works alongside tabletop sculptures and works on paper.\n\nLearn more at the link in our bio and @leverhouseartcollection \n\n#ClaesOldenburg #CoosjevanBruggen\n_\nInstallation view, ‘Claes Oldenburg & Coosje van Bruggen: Lever House’. © Claes Oldenburg and Coosje van Bruggen. Courtesy of the Estate of Claes Oldenburg & Coosje van Bruggen and Paula Cooper Gallery, New York. Photo: Timothy Schenck","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":3,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Today’s feature is a review of Anna Hulačová’s solo exhibition, “The Land of Plenty”, c...","k":"exhibition","s":"2026-08-08","e":null,"st":null,"et":null,"u":"mostmagazine__","c":"","co":"","p":"https://www.instagram.com/p/DbxOhkTDKr1/","x":"Today’s feature is a review of Anna Hulačová’s solo exhibition, “The Land of Plenty”, curated by Stanisław Małecki at the Center of Polish Sculpture in Orońsko. “Entangled, but Never Fully Contained” by Maximilian Lehner\n\nLehner writes, “The Land of Plenty” avoids nostalgia for either socialist collectivism or neoliberal capitalism. The former sought to secure abundance through central planning, regulation, and the radical reorganization of land ownership; the latter promises efficiency through market mechanisms and global supply chains. Both systems, however, rely on forms of labor and environmental exploitation that largely remain invisible to those who ultimately benefit. Hulačová does not propose an alternative model. Instead, she materializes these entanglements in sculptures where mechanical components morph into plant organs, bodies become hives, and landscapes appear simultaneously cultivated and grown as a result of the co-evolution with humans and technology. And, it is this refusal to uphold such categorization that makes “The Land of Plenty” so compelling.\n\n...The question is not whether humans or technology shapes nature, but how we choose to live with the consequences of having done and continuing to do so...\n\nRead the full text on our website, mostmagazine.org\n\n#mostmagazine #annahulacova #oronsko #maximilianlehner","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Saturday, 08.08.2026","k":"exhibition","s":"2026-08-08","e":null,"st":"22:00","et":null,"u":"openground.club","c":"","co":"","p":"https://www.instagram.com/p/DZ75i_dl6df/","x":"Saturday, 08.08.2026\nStart: 22:00\n\nFreifeld:\nDoo & Pin at Open Ground\nDJ Frog\nSnPLO\nXDB\n\nAnnex:\nDelirium Essen at Open Ground\nV.Dietz\nCynthia Matisse\nFlotze\n\nAdmission 20 € / before 23:00 15 €\n\nTrack: SnPLO - Pin-3 D\n\nOpen Ground\nAlte Freiheit 25\n42103 Wuppertal","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-23","ld":46,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Veel selle nädala lõpuni on võimalik külastada Kumu 5. korruse kaasaegse kunsti galerii...","k":"exhibition","s":"2026-08-08","e":null,"st":null,"et":null,"u":"kumukunstimuuseum","c":"Tallinn","co":"","p":"https://www.instagram.com/p/DbpqSBnD20o/","x":"Veel selle nädala lõpuni on võimalik külastada Kumu 5. korruse kaasaegse kunsti galeriis näitust „Galatea triumf. Kunst tehisaru ajastul“.\n\n📟  Pygmalioni müüdile viitava pealkirjaga rahvusvaheline grupinäitus vaatleb inimkogemuse muutumist ja arengut kultuuris ja ühiskonnas seoses uute tehnoloogiate pealetungiga. \n\nLaupäeval, 8. augustil tähistame näitust mitmekülgse lõpuprogrammiga. \n\n/\n\nYou can visit the exhibition “Triumph of Galatea: Art in the Age of Artificial Intelligence” in Kumu's 5th-floor contemporary art gallery until the end of this week.\n\nWith a title that references the myth of Pygmalion, the international group exhibition  examines the transformation and development of human experience in culture and society in relation to the onslaught of new technologies. \n\nOn Saturday, August 8, we will mark the exhibition's closing with a finissage.\n\n#kumu #kumuartmuseum #kumuexhibition #galateatriumf #triumphofgalatea","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":3,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Tropical Glitch - Talk |  In & Out: On the Necessity of Media, Collaboration, and Platf...","k":"other","s":"2026-08-08","e":null,"st":"15:30","et":null,"u":"musicproject_mp","c":"Bangkok","co":"","p":"https://www.instagram.com/p/DbkRObSOTGn/","x":"Tropical Glitch - Talk |  In & Out: On the Necessity of Media, Collaboration, and Platforms feat. Suphakarn Varinpramote and Chalermpol Soongsak\nSaturday 8 August 2026, 15:30 - 17:30\nMUSIC PROJECT, BANGKOK CITYCITY GALLERY\n\nConducted in Thai with live English translation\nFree Admission\n\nMedia doesn’t just report on a scene—it shapes its survival. This session aims to unpack the underlying infrastructure of contemporary media focusing on sound and music. From local collaboration and international case studies to the critical realities of creative labor and governmental support, the conversation will explore larger aspects of how independent platforms work and build resilience in an era of constantly shifting attention.\n\nPresented as part of MUSIC PROJECT, Tropical Glitch is a talk program traversing practices and knowledges related to sound that seeks to stretch and shake understandings of the sonic domain by working with practitioners across disciplines, drawing from the distinct interests of its contributors, including social workers, independent researchers, artists, academics, critics, curators, promoters, and writers. It approaches these gatherings as vessels for dialogue and ever-shifting discourses, or even as sites capable of producing a future glitch — a temporary interruption where alternative narratives and modes of thought emerge and refuse to conform. Curated by Kantida Busaba.\n\n#SuphakarnVarinpramote #ChalermpolSoongsak\n#TropicalGlitch #MusicProject #BangkokCityCityGallery","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":5,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Next Saturday in Bangkok! JPBS joins the Rising Star lineup at Starnest Music Festival ...","k":"other","s":"2026-08-08","e":null,"st":"20:30","et":null,"u":"bangkokcitycity","c":"Bangkok","co":"","p":"https://www.instagram.com/p/Dbj_mT9gaAM/","x":"Next Saturday in Bangkok! JPBS joins the Rising Star lineup at Starnest Music Festival 2026 alongside KIKI, The Darkest Romance, and Vega.\n\nSaturday, 8 August 2026, 20:30–21:10\nJJ Mall, Bangkok \nTickets: https://www.ihaveticket.com/.../Starnest-Music-Festival-2026\n\n#JPBS #Starnest2026","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-03","ld":5,"dl":"2026-08-08","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Join us for the opening of Vantage Point 13 on 8 August at the Photography Gallery, the...","k":"opening","s":"2026-08-08","e":null,"st":"16:00","et":null,"u":"sharjahart","c":"Sharjah","co":"","p":"ht
