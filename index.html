<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this, mobile Safari assumes a ~980px desktop page and scales the
     whole thing down: the 640px content column ends up centred in an imaginary
     wide page with dead space either side. The file used to be published to a
     host that supplied its own skeleton; GitHub Pages serves it raw, so the
     document has to be complete. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Upcoming art and film events from the Instagram accounts you follow.">
<title>What's On — events from the accounts you follow</title>
<style>
:root{
  --paper:#FAF8F4; --card:#FFFFFF; --ink:#191811; --muted:#6B6658;
  --rule:#E2DDD1; --going:#1B4D3E; --going-ink:#FFFFFF; --shadow:rgba(25,24,17,.07);
  --book:#A8410E;
  --gut:16px;
  --serif:"Iowan Old Style","Charter","Bitstream Charter","Georgia",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Roboto","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#14130F; --card:#1E1D18; --ink:#F0EDE4; --muted:#9A9484;
         --rule:#312F27; --going:#4E9E7E; --going-ink:#0B0A07; --shadow:rgba(0,0,0,.4);
         --book:#E8834A; }
}
:root[data-theme="dark"]{
  --paper:#14130F; --card:#1E1D18; --ink:#F0EDE4; --muted:#9A9484;
  --rule:#312F27; --going:#4E9E7E; --going-ink:#0B0A07; --shadow:rgba(0,0,0,.4);
  --book:#E8834A;
}
:root[data-theme="light"]{
  --paper:#FAF8F4; --card:#FFFFFF; --ink:#191811; --muted:#6B6658;
  --rule:#E2DDD1; --going:#1B4D3E; --going-ink:#FFFFFF; --shadow:rgba(25,24,17,.07);
  --book:#A8410E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-text-size-adjust:100%;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:0 0 96px}
/* Narrow phones: reclaim the side gutters. At true device width every pixel
   of column counts, and 10px still reads as a margin. */
@media (max-width:430px){
  :root{ --gut:10px; }
  .head-in,.bar-row,.chips{ padding-left:var(--gut); padding-right:var(--gut); }
  .title{ padding:14px var(--gut) 8px; }
  .daybar{ padding-left:var(--gut); padding-right:var(--gut); }
  .grid,.dows{ padding-left:8px; padding-right:8px; }
  .panel .search{ margin-left:var(--gut); margin-right:var(--gut);
                  width:calc(100% - var(--gut)*2); }
  .dayhead{ padding-left:var(--gut); padding-right:var(--gut); }
  .note{ margin-left:var(--gut); margin-right:var(--gut); }
  h1{ font-size:21px; }
  .ttl{ font-size:16.5px; }
}

header{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule)}
.title{padding:16px 16px 10px}
.bar-row{display:flex;gap:8px;align-items:center;padding:8px 16px}
.filt{flex:0 0 auto;display:flex;align-items:center;gap:6px;max-width:52%;
  padding:7px 11px;font:inherit;font-size:13px;color:var(--ink);background:var(--card);
  border:1px solid var(--rule);border-radius:8px;cursor:pointer}
.filt .car{transition:transform .15s ease;color:var(--muted);font-size:15px;line-height:1}
.filt[aria-expanded="true"] .car{transform:rotate(90deg)}
.filt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filt.on .car{color:var(--paper)}
.filt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filt:focus-visible{outline:2px solid var(--going);outline-offset:1px}
.panel{padding:2px 0 10px;border-top:1px solid var(--rule)}
.panel .search{margin:10px 16px 0;width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){ .filt .car{transition:none} }
h1{font-family:var(--serif);font-size:23px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.search{width:100%;padding:10px 12px;font:inherit;font-size:16px;
  color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:9px}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--going);outline-offset:1px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 16px 10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 11px;font-size:12.5px;border-radius:999px;
  border:1px solid var(--rule);background:var(--card);color:var(--muted);
  cursor:pointer;white-space:nowrap;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-right:5px;vertical-align:1px}

.views{display:flex;gap:0;margin-left:auto}
.vb{flex:0 0 auto;min-width:62px;padding:7px;font:inherit;font-size:13px;color:var(--muted);
  background:var(--card);border:1px solid var(--rule);cursor:pointer}
.vb:first-child{border-radius:8px 0 0 8px}
.vb:last-child{border-radius:0 8px 8px 0;border-left:0}
.vb[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vb:focus-visible{outline:2px solid var(--going);outline-offset:1px}

.monthnav{display:flex;align-items:center;justify-content:center;gap:14px;
  padding:14px 16px 8px}
.mlab{font-family:var(--serif);font-size:18px;font-weight:600;min-width:150px;
  text-align:center}
.mb{width:36px;height:36px;font-size:21px;line-height:1;color:var(--ink);
  background:var(--card);border:1px solid var(--rule);border-radius:9px;cursor:pointer}
.mb:focus-visible{outline:2px solid var(--going);outline-offset:1px}
.dows{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 12px 4px;
  font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:.06em}
.dows b{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 12px 4px}
.cell{aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;gap:3px;padding:5px 2px 0;background:var(--card);
  border:1px solid var(--rule);border-radius:8px;font:inherit;font-size:13px;
  color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.cell.pad{background:transparent;border-color:transparent;color:var(--muted);
  opacity:.35;cursor:default}
.cell.today{border-color:var(--going);font-weight:700}
.cell[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cell:disabled{cursor:default}
.pips{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:6px}
.pip{width:5px;height:5px;border-radius:50%}
.run-u{width:14px;height:2px;border-radius:2px;background:var(--rule)}
.cell[aria-pressed="true"] .run-u{background:var(--paper);opacity:.5}
.dayhead{padding:14px 16px 2px;font-family:var(--serif);font-size:17px;font-weight:600}
.dayhead .c{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--muted);
  margin-left:8px}

.daybar{position:sticky;top:47px;z-index:5;display:flex;align-items:baseline;gap:9px;
  padding:16px 16px 7px;background:var(--paper);font-size:12px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.daybar .n{font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);
  font-weight:600;font-variant-numeric:tabular-nums}
.daybar.soon .n{color:var(--going)}

.ev{position:relative;background:var(--card);border:1px solid var(--rule);
  border-radius:11px;margin:0 var(--gut) 9px;padding:12px 13px 12px 16px;
  box-shadow:0 1px 2px var(--shadow)}
.ev::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;
  border-radius:0 3px 3px 0;background:var(--kc,#95a5a6)}
.ev.going{border-color:var(--going)}
.line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:11.5px;color:var(--muted)}
.kind{color:var(--kc);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.time{font-variant-numeric:tabular-nums}
.run{border:1px solid var(--rule);border-radius:4px;padding:0 5px;font-size:10.5px}
.ttl{font-family:var(--serif);font-size:17px;line-height:1.32;margin:5px 0 0;
  text-wrap:balance;font-weight:500}
.line2{margin-top:5px;font-size:12.5px;color:var(--muted);
  display:flex;gap:7px;flex-wrap:wrap}
.line2 b{font-weight:600;color:var(--ink)}
.bk{border:1px solid var(--book);color:var(--book);border-radius:4px;
  padding:0 5px;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em}
.ev.act{border-color:var(--book)}
.ev.act::after{content:"";position:absolute;right:0;top:12px;bottom:12px;width:3px;
  border-radius:3px 0 0 3px;background:var(--book)}
.gone{opacity:.5}
.lead{font-variant-numeric:tabular-nums}
.cap{display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--rule);
  font-size:13.5px;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.ev.open .cap{display:block}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:8px;font:inherit;font-size:13px;border-radius:8px;
  border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.btn.go[aria-pressed="true"]{background:var(--going);border-color:var(--going);
  color:var(--going-ink);font-weight:600}
.btn:focus-visible{outline:2px solid var(--going);outline-offset:1px}
a.btn{text-decoration:none;text-align:center}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--card);border-top:1px solid var(--rule);
  padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  display:none;gap:11px;align-items:center}
.bar.on{display:flex}
.bar span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar button{margin-left:auto;padding:10px 17px;font:inherit;font-size:14px;
  font-weight:600;border:0;border-radius:8px;background:var(--going);
  color:var(--going-ink);cursor:pointer}
.empty{padding:52px 24px;text-align:center;color:var(--muted);font-size:14px}
.note{padding:16px;margin:4px 16px 0;font-size:12px;color:var(--muted);
  border-top:1px solid var(--rule);line-height:1.5}
@media (prefers-reduced-motion:no-preference){
  .ev{transition:border-color .12s ease}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="title">
    <h1>What&rsquo;s On</h1>
    <div class="sub" id="sub">279 events ahead</div>
  </div>
  <header>
    <div class="bar-row">
      <button class="filt" id="filtBtn" type="button" aria-expanded="false"
              aria-controls="filters">
        <span id="filtTxt">Filter</span><span class="car" aria-hidden="true">&rsaquo;</span>
      </button>
      <div class="views">
        <button class="vb" id="vMonth" type="button" aria-pressed="true">Month</button>
        <button class="vb" id="vList" type="button" aria-pressed="false">List</button>
        <button class="vb" id="vBook" type="button" aria-pressed="false">Book</button>
      </div>
    </div>
    <div class="panel" id="filters" hidden>
      <input class="search" id="q" type="search" placeholder="Search title, space, city&hellip;"
             autocomplete="off" aria-label="Search events">

      <div class="chips" id="kindChips"></div>
    </div>
  </header>
  <section id="cal" hidden>
    <div class="monthnav">
      <button class="mb" id="prev" type="button" aria-label="Previous month">&lsaquo;</button>
      <span class="mlab" id="mlab"></span>
      <button class="mb" id="next" type="button" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="dows"><b>S</b><b>M</b><b>T</b><b>W</b><b>T</b><b>F</b><b>S</b></div>
    <div class="grid" id="grid"></div>
    <div class="dayhead" id="dayhead"></div>
  </section>
  <main id="list"></main>
  <p class="note">Marks are kept only while this page is open — export before you
     close it. Every event links back to the original post.</p>
</div>

<div class="bar" id="bar">
  <span id="barTxt"></span>
  <button id="exp" type="button">Export to calendar</button>
</div>

<script>
const DATA = {"events":[{"now":true,"t":"The web installation of Jordan Lord’s work ‘Make America Sleep Again’ is now live on th...","k":"exhibition","s":"2026-07-03","e":"2026-08-03","st":null,"et":null,"u":"luxmovingimage","c":"London","co":"","p":"https://www.instagram.com/p/DaVHd4gjQuR/","x":"The web installation of Jordan Lord’s work ‘Make America Sleep Again’ is now live on the LUX website, from 3 July to 3 August 2026.\n\nThe project brings together 12 advertisements broadcast on Fox News between 2018 and the present, promoting miracle cures, pain relief and forms of care. Lord first encountered these commercials in their grandmother’s bedroom, as well as in gyms and waiting rooms.\n\nThe installation pairs the advertisements and artist-written open captions with a series of audio files and transcripts that describe every sound, image and editing decision observed in the commercials, alongside an analysis of their audiovisual strategies.\n\nMany of the products marketed as “natural” rely on viewers identifying with their spokespeople, using familiarity and trust as persuasive tools. Through close attention to these advertisements, Lord traces how they both anticipated and reflected the rise of the Make America Healthy Again (MAHA) movement which has led to the dismantling of public health infrastructure in the United States.\n\nFollow the link in bio to view the installation.\n\nMake America Sleep Again (2026) was presented as part of Jordan Lord’s solo exhibition ‘Narrative Warfare’ at LUX, from 11 April to 31 May 2026.\n\n@jrd_lord @abbypsun\n\nImage: ‘Make America Sleep Again’, Jordan Lord, 2026. Courtesy of the artist.\n\nImage Description: On a black background, a white man in a suit, captioned “Mike Huckabee, 2016 Presidential Candidate” stands before a blurred American flag. To his right, a large caption reads “Get your free bottle now!” beside a bottle labelled “Relaxium Sleep.” A banner across the bottom reads “TryRelaxium.com, 800-638-5217” Below the frame, a subtitle reads: “’cause once you do, you’ll be a customer for life,”\n\nVideo description: Screen recording of a cursor scrolling through multiple white pages of black text. The text is numbered and arranged in small paragraphs, with the occasional link underlined in blue.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-03","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Last days to see SoiL Thornton’s work in the group exhibition Beyond the Manosphere – M...","k":"exhibition","s":"2026-07-31","e":"2026-08-03","st":null,"et":null,"u":"galerie_neu","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbdFlk3DJP7/","x":"Last days to see SoiL Thornton’s work in the group exhibition Beyond the Manosphere – Masculinities Today at Stedelijk Museum, Amsterdam\n\nSoiL Thornton’s Husband Chair is modelled after (and takes its name from the American English term for) the chairs that some department stores provide for husbands or male partners wanting to take a seat while their spouses try on clothing. In Thornton‘s version, the husband chair is a site-specific inflatable made to such dimensions that it obstructs one of the entrances to the exhibition. Its height is derived from the size of the exhibition‘s curator. The work opens up questions about access and the assumption of gendered roles in everyday life.\n\ncurated by Melanie Bühler\n\nSoiL Thornton\n„Husband“ chair (Stdlk), 2026\nbrown vinyl, d-rings, blower tube, Quiet Box blower\n\n#SoiLThornton #StedelijkMuseum #galerieneu","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":true,"rel":true,"q":false},{"now":true,"t":"~ LAST CHANCE to see Morten Knudsen’s “STICKY EYES (paintings, collages, drawings, and ...","k":"exhibition","s":"2026-08-01","e":"2026-08-03","st":"11:00","et":null,"u":"overgaden_","c":"Copenhagen","co":"","p":"https://www.instagram.com/p/DbcyTF5jPeI/","x":"~ LAST CHANCE to see Morten Knudsen’s “STICKY EYES (paintings, collages, drawings, and monuments)” ~ \n\nThis weekend marks the final days of Morten Knudsen’s solo show “STICKY EYES (paintings, collages, drawings, and monuments)” at O—Overgaden. If you haven’t stopped by yet—or want to see the show one more time—now is the moment!\n\nEntry to O—Overgaden is, as always, free.\n\nOpening hours during the weekend: \nSaturday, Sunday: 11am–6pm\n\n@mortenknudsen_mk\nImages by @david_stjernholm","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":1,"dl":null,"ds":null,"ap":true,"rel":true,"q":false},{"now":true,"t":"🖊️ <to be continued> #6 film without a camera","k":"exhibition","s":"2026-08-03","e":null,"st":"23:59","et":null,"u":"wysiwygcinema","c":"The Hague","co":"","p":"https://www.instagram.com/p/DacllWyNz6K/","x":"🖊️ <to be continued> #6 film without a camera\n\n<to be continued> invites artists and filmmakers to come together and discuss unfinished film projects in an informal, moderated setting. By exchanging thoughts and perspectives, participants gain valuable feedback to further develop their works. Through an open call, makers can submit a work-in-progress along with questions they wish to explore with fellow participants, audiences, and professionals.\n\nEdition 6 welcomes artists who make work without a camera — animating through drawing or collaging, generating visuals through code or algorithmic processes, using game engines to capture a reality, or simply pushing the limit of what an actual camera is (or is not).\n\nSubmit your work-in-progress and save the date for <to be continued>, hosted by wysiwyg and Flora Filmtheater.\n\nDeadline: 3 August 2026, 23:59 (CEST)\nEvent: Sunday 13 September 2026, Flora Filmtheater \n⁉️ Before submitting, make sure you’re available to attend physically on Sunday 13 September","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-06","ld":28,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Extended until august 4","k":"exhibition","s":"20 \nDocumentation by Comb\n\nThe exhibition is kindly supported by @statenskunstfond and Vanløse Lokaludvalg","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"@ctstategateway is honored to be hosting Maya Perry @mmmaya_ as our Artist in Residence...","k":"screening","s":"2026-07-06","e":"2026-08-06","st":"12:00","et":"15:00","u":"ctstategatewaygallery","c":"New Haven","co":"","p":"https://www.instagram.com/p/DaS6HWeHMFO/","x":"@ctstategateway is honored to be hosting Maya Perry @mmmaya_ as our Artist in Residence from July 6-August 6, 2026. \n\nMaya Perry spent her formative years as a drummer/singer in the experimental duo “Laila” and lives as a painter/performer. Her goal is to create sources of light where the internal and external can exist simultaneously and forgotten, repressed, and/or present experiences can come to the surface. She centers moments of contemplation, repetition, passivity and rest. Her practice oscillates from mediums and techniques such as painting to 16mm film to stop-motion animation, writing, sound, and performance. She is recently incorporating themes of looping, record-making and recording into her practice and wishes to highlight the Nurodivergent perspective in relation to time, space and experience. Maya recently graduated from the Yale University MFA program\nin Painting/Printmaking and has performed/exhibited internationally. \n\nJoin us, Thursday, July 23 + 30, 12:00-3:00pm for two FREE animation workshops. Maya will instruct participants on basics of stop motion and slide painting. No experience needed, light snacks provided. Please RSVP noe.jimenez@ctstate.edu\n\n2/4- Excerpt from animated film “Why Look at Animals?”(2023)\n\n1/4- “Mothing” Pastel on Paper (2023)","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-02","ld":4,"dl":"2026-08-06","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Work on view","k":"exhibition", et":null,"u":"art.prof","c":"New York","co":"","p":"https://www.instagram.com/p/DbcUk7SNuQO/","x":"LIVE STREAM MARATHON: we are going live daily through Aug 7! \n\nFirst stream will be Fri July 31 @ 8pm EST. Comment and tell me if you’ll be there! \n\nXoxo Prof Liru","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Work on view","k":"exhibition","s":"2026-07-31","e":"2026-08-07","st":null,"et":null,"u":"rainraingallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbdXA1alKDC/","x":"Work on view\n\nRafael Sánchez\nFrom the series, The Honey Jar, 2003\nNine photographs\nEach: 10 × 9 inches\nCourtesy the artist and Martos gallery, New York.\n@allupinit_123 \n\n𝙒𝙚𝙩𝙬𝙖𝙧𝙚, curated by 𝗦𝗽𝗶𝗻𝗲, continues through August 7. @spine.nyc \n\n📷: @new_document_ \n\n#RAINRAIN","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Shireen Taweel's pacing seven circles is open at Gertrude Contemporary until 8 August 2...","k":"exhibition","s":"2026-06-13","e":"2026-08-08","st":null,"et":null,"u":"gertrudecontemporary","c":"Sydney","co":"","p":"https://www.instagram.com/p/Dayg6DbGUnb/","x":"Shireen Taweel's pacing seven circles is open at Gertrude Contemporary until 8 August 2026.⁠\n⁠\n13 June - 8 August 2026⁠\n21-31 High Street, Preston South⁠\nWurundjeri Country⁠\n⁠\npacing seven circles looks at the mobility of sanctuary, in which relocation, adaptation and repurposing form a process of sacred place making. Existing outside of the representation of past and future, the installation as sacred space sits in a temporal geography of existence and fabulation. pacing seven circles assembly of geometry, is the architectural infrastructure of a future oriented ritual. Draped in a fabric of blazing red pigment, it is unclear and fragile, although resilient in its radiating magnitude. Sculptural forms settle in the circles of fabric. The pierced copper forms are dislocating temporal markers of time, faith and science. Resonating with abstraction and vibration the pulse of the installation is of one who finds sanctuary in the unacquainted landscape.⁠\n⁠\n–⁠\n⁠\nShireen Taweel is represented by @stationgalleryaustralia, Naarm Melbourne and Sydney.⁠\n⁠\nThis project is supported by Creative Australia's Visual Arts and Crafts Strategy (VACS) Major Commissioning Projects fund.⁠\n⁠\npacing seven circles is an iterative exhibition presented with the trig point at @mosmanart, Sydney (2026) and Dunedin Public Art Gallery, Aotearoa New Zealand (2027).⁠\n⁠\n-⁠\n⁠\nShireen Taweel, pacing seven circles, 2026, installation view, Gertrude Contemporary, Naarm Melbourne, image courtesy of the artist and STATION, Naarm Melbourne and Sydney © the artist, photograph: Christian Capurro⁠\n⁠\n@shireen_taweel","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":-31,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"UPCOMING: HEINRICH DUNST, SOPHIA EISENHUT, SIMON LEHNER","k":"exhibition","s":"2026-07-10","e":"2026-08-08","st":"18:00","et":null,"u":"kowberlin","c":"Berlin","co":"","p":"https://www.instagram.com/p/DaU5z-qsyyC/","x":"UPCOMING: HEINRICH DUNST, SOPHIA EISENHUT, SIMON LEHNER \nPARATEXT\nJUL 10—AUG 08\n\nJOIN US FOR AN EXHIBITION WALK-THROUGH WITH THE ARTISTS AT KOW ON FRIDAY, JULY 10TH AT 6 PM.\n\nThe opening starts at 4 pm with ice popsicles and drinks. \n\nWe are excited to spend a nice summer day together!\n\nYours always,\nKOW\n\n#heinrichdunst @sophiamagdalenaanna @simon_lehner","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-03","ld":7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Join us for the final week to view salt, Priyageetha Dia’s first solo exhibition in Aus...","k":"exhibition","s":"2026-08-01","e":"2026-08-08","st":null,"et":null,"u":"gertrudecontemporary","c":"Madrid","co":"","p":"https://www.instagram.com/p/DbejjudEwwL/","x":"Join us for the final week to view salt, Priyageetha Dia’s first solo exhibition in Australia. ⁠\n⁠\nUntil 8 August 2026⁠\nGertrude Contemporary⁠\n21-31 High Street, Preston South⁠\nWurundjeri Country⁠\n⁠\nAs a mineral compound, salt (NaCl) precedes human history and has long been implicated in the structures of trade and labour. It has shaped, scarred and sustained life across this planet in ways that continue to unfold. Salt preserves, extending the life of organic matter beyond its natural limit, while also corroding, gradually compromising whatever it encounters over time. Salt also plays a crucial role in the human body, present in blood, tears and sweat. Any account of salt should therefore contend with its simultaneous presence in geological formation, economic structure and bodily process, none of which can be understood in isolation from the others.⁠\n⁠\nIt is within this refusal – of the partition between ecological, corporeal, and technological analysis – that Priyageetha Dia’s new solo exhibition locates itself. As an artist working between Singapore and The Netherlands, Priyageetha approaches salt not simply as a material, but as a connective agent through which the entanglements of colonial history, diasporic experience and extractivist regimes across Southeast Asia and the broader Asia-Pacific region can be traced.⁠\n⁠\n– ⁠\n⁠\nPriyageetha Dia (b. 1992, Singapore) is an interdisciplinary artist working across time-based media and installation. salt is Priyageetha’s first solo exhibition in Australia.⁠\n⁠\n She is represented by @the_ryder_projects, Madrid.⁠\n⁠\n–⁠\n⁠\nPriyageetha Dia, salt, 2026, installation view, Gertrude Contemporary, Naarm Melbourne, images courtesy of the artist and The Ryder Projects, Madrid © the artist, photographs: Machiko Abe / Christian Capurro⁠\n⁠\n@priyageetha.dia @brigie.moriarty⁠\n⁠\n#GertrudeContemporary #PriyageethaDia #salt #Exhibition⁠","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"📣 Announcing our global representation of the Constantin Brancusi Estate.","k":"exhibition","s":"2026-05-18","e":"2026-08-09","st":null,"et":null,"u":"pacegallery","c":"New York","co":"","p":"https://www.instagram.com/p/DYfT9IPmcq9/","x":"📣 Announcing our global representation of the Constantin Brancusi Estate. \n-\nRegarded as one of the most important figures of 20th-century sculpture and a pioneer of Modernism, #ConstantinBrancusi is known for his rigorous inquiries into the material and conceptual possibilities of elemental forms in space.\n-\nWorking in concentrated series across decades of his career, he created iconic, impactful sculptures that have inspired generations of artists, from his contemporaries in the School of Paris to the Minimalists and beyond. Brancusi’s 1917 work “Danaïde,” from the collection of the late media mogul S.I. Newhouse, goes on the auction block at @christiesinc in New York later today. Our representation of the Estate was reported in @artnet by @katyakazakina, as well as @artnews.\n-\nOur first major exhibition of the sculptor's work, curated by Dr. Jérôme Neutres, will be held at #PaceLondon this fall. Ahead of our show, a major survey of Brancusi’s work at the Neue Nationalgalerie (@neuenationalgalerie) in Berlin, produced in collaboration with the Centre Pompidou (@centrepompidou), is on view through August 9, 2026.\n-\nFollow the link in bio to read more.\n\n#ConstantinBrancusi #PaceGallery #ModernArt #Sculpture","r":true,"b":null,"af":false,"so":false,"pd":"2026-05-18","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The second room of @janivaellis's \"Geneva\" feels like entering something one perhaps sh...","k":"exhibition","s":"2026-07-19","e":"2026-08-09","st":null,"et":null,"u":"kunsthallebasel","c":"Geneva","co":"","p":"https://www.instagram.com/p/Da-CD6dig7L/","x":"The second room of @janivaellis's \"Geneva\" feels like entering something one perhaps shouldn't have access to.\n\nThe distance from previously possible narratives becomes harder to maintain, and the atmosphere condenses into a different kind of contiguity. In \"Do I Move You,\" bodies appear intertwined at a scale that resists easy orientation. Eroticism unfolds not as a scene but as a condition where desire, exposure, and observation stay entangled, as if a gaze were already built into the image. Ecstasy doesn't simply discharge. It converges again into chaos, a paradoxical order that recurs throughout the exhibition.\n\nThis carries into the curved painting \"May Day,\" where movement, crowds, and conflict expand and converge like a cinematic montage. Figures and forces interweave so densely that it's hard to tell where one ends and the other begins, echoing a struggle that still shapes Western self-understanding.\n\nThe exhibition is on view until 09.08.2026. We look forward to welcoming you!\n\nCredits: @whoisnicolasgysin @philipp_haenger_foto","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-19","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Kunsthalle Basel Short Cuts – just enough to keep you in the know.","k":"exhibition","s":"2026-07-25","e":"2026-08-09","st":null,"et":null,"u":"kunsthallebasel","c":"Basel","co":"","p":"https://www.instagram.com/p/DbN34OoDahR/","x":"Kunsthalle Basel Short Cuts – just enough to keep you in the know.\n​\nFollow Desireé and Ananda from our Art Mediation team as they explore the many layers that define Janiva Ellis' (@janivaellis) exhibition \"Geneva\".\n\nVisit us! The show is only on view until 09.08.2026!\n\nCredits: @studio__mati","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-25","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Don’t miss your final chance to see @anickayi_studio’s aerobes take flight at New Museu...","k":"other","s":"2026-07-29","e":"2026-08-09","st":"15:00","et":"18:00","u":"newmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/DbYnoarBFOG/","x":"Don’t miss your final chance to see @anickayi_studio’s aerobes take flight at New Museum through August 9, 2026. 🪼✨🗓️\n \nYi’s “In Love with the World” takes flight:\n \n🗓️ Tuesday: 11am–2pm, 3–6pm\n🗓️ Wednesday: 11am–2pm, 3–6pm\n🗓️ Thursday: 11am–2pm, 3–6pm, 7–9pm\n🗓️ Friday: 11am–2pm, 3–6pm\n🗓️ Saturday: 11am–2pm, 3–6pm\n🗓️ Sunday: 11am–2pm, 3–6pm\n \nPlan your visit and get tickets today with the link in bio 🔗","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-07-29","ld":0,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Artists on Artists: Anicka Yi (@anickayi_studio) explores the exhibition “Paul Thek: Dr...","k":"exhibition","s":"2026-06-04","e":"2026-08-14","st":null,"et":null,"u":"pacegallery","c":"New York","co":"","p":"https://www.instagram.com/p/DZK36ykAgf3/","x":"Artists on Artists: Anicka Yi (@anickayi_studio) explores the exhibition “Paul Thek: Dream of Vanishing”—now on view at #PaceNewYork—with what psychologists call a “lantern consciousness,\" inviting open association and reflection. \n- \nIn Thek’s vivid paintings, visceral sculptures, and intimate notebook pages, Yi finds a kindred spirit, one whose artistic concerns have echoes in her own practice: “I feel a deep kinship here.” \n- \n⭐️ Paul Thek: Dream of Vanishing \n🗓️ Through August 14 \n🗺️ 540 West 25th Street \n- \nTap the link in bio to view the full film. \n\n#AnickaYi #PaulThek #ContemporaryArt #PaceGallery","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"ANATOMY OF A WALKER CINEMA TRAILER — Once Upon a Time in Manhood, curated by @dallasgol...","k":"other","s":"2026-07-24","e":"2026-08-14","st":null,"et":null,"u":"justincayd","c":"Minneapolis","co":"","p":"https://www.instagram.com/p/DbLs_n_u1jq/","x":"ANATOMY OF A WALKER CINEMA TRAILER — Once Upon a Time in Manhood, curated by @dallasgoldtooth. \n\nDesigning and editing Moving Image trailers is always a pleasure, but this one, man—this one required something next level. Without Justin’s medulla oblongata, Justin could not have regulated heart rate, blood pressure, or breathing necessary for construction. \n\nThe sheer variety of films raised my personal expectations for what this trailer could (and should) be. Melodramatic emotions, musical cues. Big-time booms; felt deeply during cinema playback. And, of course, the 80s/90s era movie-trailer voice, provided by my friend and collaborator of twenty years, Rhett Romsaas. \n\nThe series runs through August 14 ➝ walkerart.org for tickets\n\nTrailer Voiceover:\n@rhettending \n\nMoving Image Team:\n@pablo_oto \n@ppppatriicia \n@makenzieflom \n@laflammmme \n\nSeries Identity:\n@_brianhuddleston \n\nDesign Director:\n@marklifeofthemind \n\nAssociate Director of Marketing: \n@_laurahhhhhhhh \n\n#walkerartcenter #walkercinema #dallasgoldtooth #premierepro @walkerartcenter","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-07-24","ld":0,"dl":"2026-08-14","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Untitled (Figure and Sunset) 2026 / watercolor and oil on linen over artist made panel ...","k":"talk","s":"2026-07-27","e":"2026-08-14","st":null,"et":null,"u":"manicbixidreamgirl","c":"New York","co":"","p":"https://www.instagram.com/p/DbTId-ZOoIE/","x":"Untitled (Figure and Sunset) 2026 / watercolor and oil on linen over artist made panel / 6x7\n\non view in the project room at @hesse_flatow until August 14th ☀️\n\nphoto by Jenny Gorman","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Safir’s plush, wall-mounted panels similarly precipitate image as object, yet her visua...","k":"exhibition","s":"2026-07-30","e":"2026-08-14","st":"11:00","et":null,"u":"hesse_flatow","c":"New York","co":"","p":"https://www.instagram.com/p/DbbDQiokpdd/","x":"Safir’s plush, wall-mounted panels similarly precipitate image as object, yet her visuals arrest on obstructed thresholds that separate interior and exterior worlds, often capturing reflections bouncing against curtained windows or the obfuscatory patterning of privacy glass. Photographs taken during her travels are layered with scans of fabric and lace casts or analog rubbings of domestic, baroque fixtures before being printed on silk. As part of her ongoing investigations into histories of “women’s work” and the decorative, Safir meets this digital collaging or stitching together with a literal stitch. Her upholstered panels are adorned with pewter elements, beaded appliqués, pleating, smocking, and other forms of fabric manipulation.⁠\n⁠\n\"Ladder/Chain\": Juyon Lee and Emma Safir is on view at the gallery's Tribeca location through August 14. Summer hours are Monday-Friday, 11am-6pm.⁠\n⁠\nImage: Emma Safir, \"Black Eyed Susans\", 2026. Digitally printed silk, pewter, mirrored glass beads, reflective thread, neoprene, flashe paint, 20 x 28 x 1 1/2 inches (50 x 71 x 3 cm). Courtesy of the artist and HESSE FLATOW. Photo: ©Jenny Gorman.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"⁠Our project room presentation of new paintings by our 2026 summer residents, Bix Arche...","k":"talk","s":"2026-07-31","e":"2026-08-14","st":"11:00","et":null,"u":"hesse_flatow","c":"New York","co":"","p":"https://www.instagram.com/p/DbduWiHE4SU/","x":"⁠Our project room presentation of new paintings by our 2026 summer residents, Bix Archer and Mason Owens, is on view at the gallery's Tribeca location through August 14. Summer hours are Monday-Friday 11am-6pm.⁠\n⁠\nBix Archer approaches painting as a process of rendering experience beyond vision. Dwelling in spaces of encounter between the known and unknown, from bedrooms and driveways to suburban forests and public beaches, Archer allows the process of en plein air painting to guide her into new spaces and to see familiar ones differently. Rather than painting as an act of fixing something into place, Archer commits herself to observation, embracing the instability of the world and its constant transformation. Through painting, she argues for a perceptual mode that centers around disruption, dissolution, and a kind of queer side-eye. ⁠During her visit to Amagansett she observed the world around her including Lee Krasner's gravesite. ⁠\n⁠\nImages:⁠\nBix Archer (b. 1997)⁠\nLee's Stone, 2026⁠\nOil on artist made wood panel⁠\n8 x 10 inches⁠\n⁠\nBix Archer (b. 1997)⁠\nGrove Street Tangle, 2026⁠\nOil on artist made wood panel⁠\n10⅛ x 8⅛ inches⁠\n⁠\nBix Archer, \"Midday Rosebush\", 2026. ⁠\nOil on artist made wood panel, ⁠\n9¼ x 12 inches. ⁠\n⁠\nBix Archer, \"Evening Rosebush\", ⁠\n2026. Oil on artist made wood panel, ⁠\n9 x 10¼ inches. ⁠\n⁠\nCourtesy of the artist and HESSE FLATOW. Photo: Jenny Gorman.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Opening Friday, June 12 from 6-8pm, Artists Space presents Everything Must Be Returned,...","k":"exhibition","s":"2026-06-12","e":"2026-08-15","st":"18:00","et":"20:00","u":"artistsspace","c":"New York","co":"","p":"https://www.instagram.com/p/DY0LiIpiU4g/","x":"Opening Friday, June 12 from 6-8pm, Artists Space presents Everything Must Be Returned, the first New York institutional solo exhibition by multidisciplinary artist Shani Strand (b. 1995). Through her work, Strand weaves culturally inscribed materials and practices to examine how the visible—objects, architectures, and social performances—operate as a metonym for the invisible: ghosts, infrastructure, and history. For Artists Space, Strand has produced an immersive installation including a newly commissioned film and sculptures that gather materials that bear the residue of historical encounter and entanglement.\n\nThe show runs from June 12 - August 15. \n\nImages:\nShani Strand, Duppy (Don’t Wait for Karma), 2024\n\nShani Strand, R.I.P. He Deserves It, 2026\n\nShani Strand, R.I.P. He Deserves It, 2026","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-26","ld":17,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"If you are in London, join us to celebrate Ian Waelder's solo exhibition, insert, at Mo...","k":"exhibition","s":"2026-07-16","e":"2026-08-15","st":"20:00","et":null,"u":"diez.gallery","c":"London","co":"United Kingdom","p":"https://www.instagram.com/p/Da2emHyMhMT/","x":"If you are in London, join us to celebrate Ian Waelder's solo exhibition, insert, at Modern Art. \n\nThe opening is tonight from 6 to 8pm, and the exhibition remains on view until August 15th.\n\n@ianwaelder\n@stuartshavemodernart\n\nParallel (Lurking), 2026\nPlotter print on canvas with oil paint and acrylic paint, marker, covered with a layer of raw linen with stains of oil, detergent, glue, marker, pencil, glued tissue paper, and air-dry porcelain\n\n245 x 195 cm (96 1/2 x 76 3/4 in)\n\nPhoto: Modern Art\nCourtesy the artist, diez, Amsterdam and Modern Art\n© Ian Waelder","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"If you’re in London! I’m opening today a solo show at Modern Art @stuartshavemodernart ...","k":"exhibition","s":"2026-07-16","e":"2026-08-15","st":null,"et":null,"u":"ianwaelder","c":"London","co":"","p":"https://www.instagram.com/p/Da2h7jcje-U/","x":"If you’re in London! I’m opening today a solo show at Modern Art @stuartshavemodernart in Bennet Street, together with the group show with works by Kate Mosher Hall, Hanna Hur and Beaux Mendes. Very happy if you visit. The exhibitions will be on view until August 15th. Massive thank you for all the help and support to Stuart, Rob, Clément, Kirk & install team, Ashley & each member of the team at the gallery, & Diego/diez 🫶","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"space in between","k":"talk","s":"2026-07-24","e":"2026-08-15","st":null,"et":null,"u":"one_artcollection","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbK1_DgsvBs/","x":"space in between \none.voice x Ian Waelder \nIn the new episode of one.voice, Fabian is in conversation with artist @ianwaelder. \nIan‘s artistic practice explores memory and trace by connecting archival histories, language, and personal biography. Working across photography, sculpture, sound, and installation, he uses everyday materials to reflect on what remains undocumented and to question the conditions and politics of memory formation.\nWe discuss several of his exhibitions, his relationship to his own biography, the construction of spaces within spaces, and exhibitions that function differently depending on the time of day. We also talk about the struggles of being a young artist, both during art school and in the years that follow.\n\nIan‘s show “insert” is on view at @stuartshavemodernart until August 15. \n\nThe conversation is in English.\n\n🔗 Link in Bio!\n\nAvailable on Spotify, Apple Podcasts and Amazon Music. \n\nPhoto by @eikewalkenhorst \n\n#one. #ianwaelder","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"Our group exhibition Love and Friendship is now on view in NYC, Monday to Friday, throu...","k":"exhibition","s":"2026-07-29","e":"2026-08-15","st":null,"et":null,"u":"afternoonprojects","c":"New York","co":"","p":"https://www.instagram.com/p/DbZDKgyJ5Nr/","x":"Our group exhibition Love and Friendship is now on view in NYC, Monday to Friday, through August 15th. Dm us to schedule an appointment. We would love to see you! \n\nPictured:\n\nHelen Shu\n\nBubbles, 2025\rMixed media collage on linen\r9” x 12”\n\n#HelenShu\n#afternoonprojects\n@uhsneleh","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Ian Waelder’s solo exhibition insert is on view at Modern Art in London until August 15...","k":"exhibition","s":"2026-07-31","e":"2026-08-15","st":null,"et":null,"u":"diez.gallery","c":"London","co":"United Kingdom","p":"https://www.instagram.com/p/Dbd1ZnTjIel/","x":"Ian Waelder’s solo exhibition insert is on view at Modern Art in London until August 15, do not miss if you visit this Summer!\n\nConceived as a site-responsive environment, this presentation is centered on three large-scale works first encountered from behind. Together, they form a dividing wall and makeshift corridor bisecting the space, a passage that acts much like an insert in a book, a separate, partial layer interrupting the whole.\n\nThis show is composed by his latest works to date, made during his last term at the Stiftung Laurenz-Haus one-year residency in Basel\n\n@ianwaelder @stuartshavemodernart @information_art","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"THE EARTH BENEATH OUR FEET","k":"talk","s":"2026-05-01","e":"2026-08-16","st":"15:00","et":null,"u":"fotografiskcenter","c":"Copenhagen","co":"","p":"https://www.instagram.com/p/DXjx6YACKf2/","x":"THE EARTH BENEATH OUR FEET\n \nEXHIBITION PERIOD\n1 May – 16 August 2026\n \nThe exhibition ”The Earth Beneath Our Feet” explores humanity’s relationship and connection to Danish landscape and nature. The exhibition brings together works by Christina Capetillo/ @christinasofiacapetillo, one of Denmark’s most prominent visual artists within the field of landscape photography, and the award-winning photographers Mathias Svold/ @mathiassvold and Ulrik Hasemann/ @ulrik_hasemann . The exhibition presents works relating to the coast and the water – the sea and the fjords – and the wide-open spaces as well as to the forest and the denser landscapes with thickets and lush vegetation.\n \nThe exhibition is supported by the Danish Arts Foundation, the Augustinus Foundation, the Grosserer L. F. Foghts Fond and Politiken-Fonden.\n \nEVENT PROGRAMME\nIn connection with the exhibition an artist talk will be held in collaboration with Art Matter Festival on June 2 from 4.30-5.15pm featuring Christina Capetillo, Mathias Svold and Ulrik Hasemann where you can learn more about the exhibition and the works. Thursday 7 May and 13 August from 5-5.30pm guided exhibition tours will take place. The tours will be held in Danish and participation is free after paid entrance to the exhibition. \n \nFor further information and opening hours please visit www.fotografiskcenter.dk\n\nImage credit: Christina Capetillo","r":false,"b":null,"af":false,"so":false,"pd":"2026-04-25","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Nest is de hele zomer open tot en met 16 augustus. Check hier het programma en de link ...","k":"exhibition","s":"2026-06-05","e":"2026-08-16","st":"12:00","et":null,"u":"nestruimte","c":"The Hague","co":"","p":"https://www.instagram.com/p/DZMmDGSAuvn/","x":"🥵\n\nNest is de hele zomer open tot en met 16 augustus. Check hier het programma en de link in onze bio voor meer info.\n\nNest is open op: Do/Vr: 12:00 – 19:00 Za: 13:00 – 20:00 Zo: 13:00 – 18:00\n\nEN\n\nNest will be open the entire summer, until August 16th. Check our public programmer here and through the link in our bio!\n\nNest is open on: Thu/Fri: 12:00 – 19:00 Sat: 13:00 – 20:00 Sun: 13:00 – 18:00","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-05","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"𝘈𝘬𝘪𝘯𝘴𝘢𝘯𝘺𝘢 𝘒𝘢𝘮𝘣𝘰𝘯: 𝘚𝘰𝘶𝘭 𝘚𝘦𝘴𝘴𝘪𝘰𝘯𝘴 is the first survey exhibition in New York dedicated to...","k":"workshop","s":"2026-06-16","e":"2026-08-16","st":"12:00","et":"18:00","u":"sculpturecenter","c":"New York","co":"","p":"https://www.instagram.com/p/DZpu_odEZhw/","x":"𝘈𝘬𝘪𝘯𝘴𝘢𝘯𝘺𝘢 𝘒𝘢𝘮𝘣𝘰𝘯: 𝘚𝘰𝘶𝘭 𝘚𝘦𝘴𝘴𝘪𝘰𝘯𝘴 is the first survey exhibition in New York dedicated to artist, educator, and organizer Akinsanya Kambon. ⁠\n⁠\nAt SculptureCenter, over ninety of the artist's intricately crafted ceramics are on view, organized into seven “sessions” that each consider recurring themes in his practice. ⁠\n⁠\nPre-colonial and Primordial Time explores African philosophies, cosmologies, and spiritual practices; Thrones of Resistance features kings, queens, priests, and priestesses (Obas, Pharaohs, and Mais) who led their people through adversity, particularly during early colonial encounters; The Middle Passage addresses the forced displacement and transatlantic transportation of enslaved Africans; Captivity and Oppression depicts the violence and dehumanization of slavery in the United States; Rebellion and Uprising highlights the artist’s depictions of revolt and defiance; War and Imperialism reflect the artist’s critiques of imperial power, informed by his experience of combat; and Reverence and Remembrance focuses on spiritual practices of the African diaspora.⁠\n⁠\nThis two-venue exhibition continues at the Center for Art, Research and Alliances (CARA), where Kambon’s expansive practice is foregrounded through a selection of works on paper, paintings, wall plaques, and archival materials that surface stories of oppression, resistance, and spirituality.⁠\n⁠\n𝘚𝘰𝘶𝘭 𝘚𝘦𝘴𝘴𝘪𝘰𝘯𝘴 is on view until Aug 16, 2026. This weekend, SculptureCenter will be open on Juneteenth (6/19) from 12–6pm! While CARA will be closed in observance of the federal holiday, they reopen Saturday (6/20) to host Black Study in Action: Education for Liberation with Sojourners for Justice Press. The public workshop is the first of three planned in dialogue with 𝘚𝘰𝘶𝘭 𝘚𝘦𝘴𝘴𝘪𝘰𝘯𝘴. RSVP encouraged. ⁠\n⁠\nMore info through the 🔗 in our bio.⁠\n⁠","r":true,"b":"rsvp","af":true,"so":false,"pd":"2026-06-16","ld":0,"dl":"2026-08-16","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"In Hsu Che-Yu's 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔, a dialogue between a performer and a scriptwriter unfol...","k":"exhibition","s":"2026-06-28","e":"2026-08-16","st":null,"et":null,"u":"queenswaytelevision","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DaIrhizEhC5/","x":"In Hsu Che-Yu's 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔, a dialogue between a performer and a scriptwriter unfolds across the video, referencing two historical events at a Taiwanese zoo.\n\n3D-scanned imagery of the zoo and its taxidermy studio accompanies the conversation, with the performer appearing across different scenes with various gestures.\n\nLearn about how the work explores the relationship between ‘gestures’ and ‘horrors’ by catching the video at Queensway Television, on view from now till 16 Aug 2026, opens daily from morning till night.\n\n@hsu__che_yu","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The simplest gestures often carry the heaviest trauma.","k":"exhibition","s":"2026-07-06","e":"2026-08-16","st":null,"et":null,"u":"queenswaytelevision","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/Dac1uQbSNzo/","x":"The simplest gestures often carry the heaviest trauma. \n\nFollow the conversation in Hsu Che-Yu's 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔 to learn about how the artist explores the relationship between ‘gestures’ and ‘horrors’, by referencing two historical events at a Taiwanese zoo that happened during the World War II. \n\nWatch the work now at Queensway Television, on view daily from morning till night until 16 Aug 2026.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Just a few weeks after opening, Salad Days: Primary Information continues to offer a we...","k":"screening","s":"2026-07-07","e":"2026-08-16","st":"12:00","et":"17:00","u":"carpenter_center_harvard","c":"Cambridge","co":"","p":"https://www.instagram.com/p/DafzM1GnOpf/","x":"Just a few weeks after opening, Salad Days: Primary Information continues to offer a welcoming place to escape the heat, slow down, and explore.\n\nBrowse artist books, settle into the reading room, and catch our film of the week in an exhibition that transforms the gallery into a space for reading, gathering, and discovery.\n\nOpen Thursday–Sunday, 12–5 pm\nOn view through August 16\n\n🔗 Link in bio for exhibition details, upcoming public programs, and the full screening schedule.\n\nInstallation images by Mel Taing.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Opening Saturday, July 18, 2:00–6:00 PM","k":"exhibition","s":"2026-07-18","e":"2026-08-16","st":"14:00","et":"18:00","u":"ptolemy.world","c":"Glendale","co":"","p":"https://www.instagram.com/p/DaxlJNgDr9S/","x":"Opening Saturday, July 18, 2:00–6:00 PM\n\n“Paragon Park Observatory”\n\nA group exhibition featuring over 35 artists based in New York.\n\nThe exhibition will be on view from July 18–August 16. More information will be announced soon; please contact info@ptolemy.world for any inquiries.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Hsu Che-Yu's 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔 continues to be on view at Queensway Television. Referencin...","k":"exhibition","s":"2026-07-21","e":"2026-08-16","st":null,"et":null,"u":"queenswaytelevision","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbDoeyVEtc3/","x":"Hsu Che-Yu's 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔 continues to be on view at Queensway Television. Referencing two historical events at a Taiwanese zoo that happened during World War II, the work follows a dialogue between a scriptwriter and a performer.\n\nRendered primarily via 3D-scanned imagery, the scenes constructed are simultaneously staged and real, recreating actual sites of the zoo and the taxidermy studio in an uncanny manner accompanied by the conversation between the scriptwriter and the performer. \n\nLook into the spaces between what we perceive and what we are led to believe within the video work 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔 now at Queensway Television, on view daily from morning to night until 16 Aug 2026.\n\n@hsu__che_yu","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This week, our John R. & Barbara Robinson Family Director, Kate McNamara, recommends: T...","k":"exhibition","s":"2026-07-21","e":"2026-08-16","st":"12:00","et":"17:00","u":"carpenter_center_harvard","c":"Cambridge","co":"","p":"https://www.instagram.com/p/DbEBdNanB_G/","x":"This week, our John R. & Barbara Robinson Family Director, Kate McNamara, recommends: Tom Burr: Torrington Project, edited by Blake Oetting.\n\nTom Burr: Torrington Project documents the artist's three-year occupation of a repurposed nineteenth-century factory in Torrington, Connecticut, where Burr transformed the building into a \"living archive\"—part studio, part exhibition, part gathering space. Bringing together more than ninety works spanning his career alongside performances, conversations, and collaborations with fellow artists, the project challenged conventional distinctions between art and architecture, exhibition and production, memory and making. Richly illustrated with photographs, archival materials, and newly commissioned essays, the publication extends the life of the project beyond its physical site.\n\n\"Tom Burr has long been an artist whose work I return to for the way it thoughtfully weaves together architecture, institutional critique, queer histories, and lived experience. What I love most about Torrington Project is that it isn't simply a publication documenting an exhibition—it becomes an extension of the project itself, asking how artworks continue to evolve through place, community, and time. It's especially meaningful to see an essay by our own David Joselit, art historian and Chair of Harvard's Department of Art, Film, and Visual Studies, whose writing offers another thoughtful entry point into Burr's expansive practice.\" — Kate McNamara\n\nBrowse Kate's selection, along with hundreds of artist books and publications from Primary Information, during Salad Days at the Carpenter Center.\n\nSalad Days: Primary Information is on view through August 16.\nOpen Thursday–Sunday, 12–5pm","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"As part of Fotografisk Center’s current exhibition The Earth Beneath Our Feet, you can ...","k":"exhibition","s":"2026-07-23","e":"2026-08-16","st":null,"et":null,"u":"fotografiskcenter","c":"Copenhagen","co":"","p":"https://www.instagram.com/p/DbI_axXCAEc/","x":"As part of Fotografisk Center’s current exhibition The Earth Beneath Our Feet, you can experience a collection of works by Christina Capetillo from several different series, spanning the years 1999 to 2026. For more than 25 years the contemporary landscape has been her area of research, understood as the overriding cultural condition, the new nature and the human-made landscape that has emerged as nature and the resources of the Earth have become increasingly depleted and taken over by human activity, intervention and changes.\r\n\r\nCapitillo’s book An Everchanging Monument is currently for sale at Fotografisk Center’s bookshop. \r\n\r\nThe exhibition runs until August 16, 2026.\n\nImage credit: @christinasofiacapetillo \n\n#photobooks #contemporayart #contemporaryphotography #naturephotography #natureandculture","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Free admission!","k":"exhibition","s":"2026-07-29","e":"2026-08-16","st":null,"et":null,"u":"fotografiskcenter","c":"Copenhagen","co":"","p":"https://www.instagram.com/p/DbVz88WiM2g/","x":"Free admission!\r\n\r\nAt Fotografisk Center we offer free admission on the last Wednesday of each month. This means on July 29 you may experience the current exhibition The Earth Beneath Our Feet free of charge. \r\n\r\nThe exhibition is bringing together works by Christina Capetillo, one of Denmark’s most influential visual artists within landscape photography, and Mathias Svold and Ulrik Hasemann, award-winning photographers who, over several years, together created the works Kystland (Coastal Land) (2019) and Gennem Øjetræet (Through the Eye Tree) (2023).\r\n\r\nThe exhibition runs until August 16, 2026.\r\n\r\nPlease note: free admission does not apply during exhibition changes, as Fotografisk Center will be closed to the public. \r\n\r\nInstallation images: Troels Jeppe\r\n\nWorks by: @christinasofiacapetillo @mathiassvold @ulrik_hasemann \n\n#fotografiskcenter #copenhagen🇩🇰 #artphotographer #contemporaryart #landscape","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Final few weeks to see Rae-Yen Song 宋瑞渊's exhibition •~𝘛𝘜𝘈~• 大眼 •~𝘔𝘈𝘒~• at @glasgowtram...","k":"exhibition","s":"2026-07-31","e":"2026-08-16","st":null,"et":null,"u":"filmvidumbrella","c":"Warsaw","co":"","p":"https://www.instagram.com/p/DbdONPUD3Fu/","x":"Final few weeks to see Rae-Yen Song 宋瑞渊's exhibition •~𝘛𝘜𝘈~• 大眼 •~𝘔𝘈𝘒~• at @glasgowtramway ✨\n\n•~𝘛𝘜𝘈~• 大眼 •~𝘔𝘈𝘒~• is an ambitious new multimedia exhibition transforming Tramway’s vast gallery space into a sub-aquatic world shaped according to the ancestral logics of the Song family, which serves simultaneously as spectacle, memorial and refuge. Film and Video Umbrella commissioned eight new digital animations for the exhibition titled •~𝘨𝘩𝘰𝘴𝘵𝘴~• (𝘴𝘰𝘯𝘨~𝘹𝘪𝘢𝘯). @raeyensong\n\n🎟 Free entry\n📆 Until 16 August 2026\n🔗 Find out more on our website under 'What's On', link in bio!\n\n--\n\nA Tramway co-commission with @fact_liverpool and Film and Video Umbrella with support from @uofglasgow and @creativefstone. Funders @creativescotland, @aceagrams, @henrymoorefdn_grants.\n\n📸 Keith Hunter\n\n#FVU #filmvidumbrella #filmandvideoumbrella #artistsmovingimage #raeyensong","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"LE PARTI IMAGINAIRE @gdl_525","k":"performance","s":"2026-07-31","e":"2026-08-16","st":"17:00","et":"20:00","u":"sophieserber","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbXnMs3oMM9/","x":"LE PARTI IMAGINAIRE @gdl_525 \nJuly 31 - August 16 2026\nopening Friday July 31st, 5-8 pm\nOn appointment until August 16th\n\nT.A DÉCOR\nWERNER DELMONT\nCHRIS KORDA\nDAN MITCHELL\nKEN OKIISHI\nPAT SCULL\nSOPHIE SERBER\n\n\"Animation might be considered as the transformation of static, two dimensional images or objects into motion, the illusion of life or abstract rhythm, the exploitation of the possibilities of such process - fantasy, making the impossible imaginable.\n\nLE PARTI IMAGINAIRE brings together works by T.A Décor with Jette Loona Hermanis and Eric Lotraine, Werner von Delmont, Chris Korda, Ken Okiishi, Dan Mitchell, Pat Scull, Sophie Serber that occupy the televisual and its physical manifestation – performance television, magazines, software, film, pornography, music, and fiction - tracing the remodeling and (re)animation of society as an entertainment complex. The work presented adopts the forms of mass media entertainment – its images, personae, rhythms, fantasies, vulgarities, technologies, and modes of circulation, staging their occupation of the world at large. The exhibition considers the exploded conditions of selfhood and subjectivity, their ongoing negotiations and precipitation in today's networked image regime.\n\nThe exhibition is made possible with the support of Amsterdam Fonds voor de Kunst, Cultuurfonds, Mondriaan Fonds and Gemeente Amsterdam. With the technical support of Alex Walker, Brian Mckenna, Pablo Bongcam Rezzonico, Viktor Eichler. Thanks to the artists, Michael Stevenson & Goswell Road.\"","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Untitled (Fall), archival pigment print, 24 x 84 inches, 2023","k":"exhibition","s":"2026-07-23","e":"2026-08-17","st":null,"et":null,"u":"buckellison","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbJDQb4lZEl/","x":"Untitled (Fall), archival pigment print, 24 x 84 inches, 2023\n\n\"Untitled (Fall) depicts cut melons, transferware plates, Florentine greeting cards, spilled tea, and images of a boy at Eton College's Fourth of June celebration. An explicit pipeline for imperial administration, Eton's education was designed to produce a ruling class confident in its right to govern — at home and abroad — and its boater hat traveled with it. Hong Kong schools established under British rule adopted the hat directly.\"\n\nFeatured in \"Every Good Boy Does Fine\" at @mplusmgallery in Hong Kong, two-person show with @kayodeojo, open through August 17","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Untitled (Winter), archival pigment print, 24 x 84 inches, 2023","k":"exhibition","s":"2026-07-27","e":"2026-08-17","st":null,"et":null,"u":"buckellison","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DbTWf_ulQn1/","x":"Untitled (Winter), archival pigment print, 24 x 84 inches, 2023\n\n\"Untitled (Winter) depicts tulip petals, black ribbon, two travel alarm clocks set to the time zones of Los Angeles and Boston, hotel stationery, a pair of porcelain ducks, and printouts from John Singleton Copley's A Boy with a Flying Squirrel (1765). The painting shows Copley's half-brother with a pet flying squirrel, a common symbol of refinement, but Ellison was more interested in the silk: in late colonial American portraiture, fabric was far more expensive than the paintings themselves, and enormous attention to detail in a sitter's clothing telegraphed their prosperity. Ellison uses tulip petals to mimic the sitter's pink silk lapel.\"\n\nFeatured in \"Every Good Boy Does Fine\" at @mplusmgallery in Hong Kong, two-person show with @kayodeojo, open through August 17","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"An anti-monument to the Confederacy comes home.","k":"exhibition","s":"2026-06-05","e":"2026-08-18","st":"21:00","et":null,"u":"icavcu","c":"Richmond","co":"","p":"https://www.instagram.com/p/DYnNDGqGH5H/","x":"An anti-monument to the Confederacy comes home.\n\nThis summer, “Abigail DeVille (@victoriouspurple): Deo Vindice (Orion’s Cabinet)” will travel from the acclaimed @moca MONUMENTS exhibition to be shown here in Richmond at the ICA.\n\nIn early April 1865, fleeing Confederate officials in Richmond, VA, ordered the city burned to prevent its munitions and railway foundry from falling into Union hands, reducing the Confederate capital to ruins. DeVille’s immersive installation meditates on the fall of Richmond at the end of the Civil War. \nInspired by photographs taken in the aftermath of the fire, DeVille constructs clusters of colonial-style curio cabinets—charred, skeletal, and lashed together by monument-restoration scaffolding wrapped in singed fabric. \n\nThe myth of the Lost Cause minimizes the centrality of maintaining slavery to the South’s secession, positing a softer picture of rebellion in the face of tyranny. \n\nDeVille exposes the irony at the heart of this narrative. Cabinets like these are intended to shield heirlooms from dust and decay. Likewise, Lost Cause ideology has attempted to protect a distorted historical memory from the corrections of modern scholarship. Just as the burned cabinets have lost their protective utility, the Confederacy’s claim of defending its people is betrayed by its own leaders setting the city ablaze.\n\nThe cabinet clusters trace the principal stars of the constellation Orion, drawing a parallel between the mythological hunter’s drive to dominate and the Confederacy’s drive to preserve white supremacy. In both cases, their will to power drove them to ruin.\n\nDeo Vindice will open on June 5 and be on view until August 18. Join us for the opening on June 5 from 5 to 9 PM. To  learn more and to RSVP click the link in bio. The ICA is free and open to the public. \n\nThe Richmond debut of Deo Vindice (Orion’s Cabinet) is curated by Amber Esseiva, Senior Curator and Director of Curatorial Affairs at the ICA with research support by Kennedy Jones, Curatorial Assistant\n\nPhoto:\nInstallation view of MONUMENTS, October 23, 2025–May 3, 2026, at The Geffen Contemporary at MOCA. (Photograph by Fredrik Nilsen; courtesy of MOCA and The Brick)","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-05-21","ld":15,"dl":"2026-08-18","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Abigail DeVille: Deo Vindice (Orion’s Cabinet) on view until August 18th at the ICA ❤️","k":"exhibition","s":"2026-07-10","e":"2026-08-18","st":null,"et":null,"u":"amberesseiva","c":"Richmond","co":"","p":"https://www.instagram.com/p/Danz5g2iXtz/","x":"Abigail DeVille: Deo Vindice (Orion’s Cabinet) on view until August 18th at the ICA ❤️\n\n📸 David Hale","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-10","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"‘I react to what’s happening around me, or within me. I’m just living in the world of t...","k":"exhibition","s":"2026-07-13","e":"2026-08-23","st":null,"et":null,"u":"differentclass.be","c":"Antwerp","co":"","p":"https://www.instagram.com/p/Daue-PAsphM/","x":"‘I react to what’s happening around me, or within me. I’m just living in the world of today, creating constantly’\n\n@yaqine.raw uses photography, text, and drawing to capture her intimate present. Like flipping through pages of a personal diary; fast, intuitive, and honest.\n\nAs part of this year’s .tiff selection, the yearly platform for emerging voices in photography at @fomuantwerp, Yaqine invites you to look closely at the world of today through the work of ten photographers. On view now at @fomuantwerp until 23.08.2026.\n\nFree for @differentclass.be members.\nVideo by @marianamachaado 😘 ⠀ \n\n#tiff2026 #FOMU #BelgianPhotography #YaqineHamzaoui","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-13","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"IN CONVERSATION WITH","k":"talk","s":"2026-03-04","e":"2026-08-24","st":null,"et":null,"u":"projets.media","c":"Paris","co":"","p":"https://www.instagram.com/p/DWmGotyDaev/","x":"IN CONVERSATION WITH \n↘ Emma Lavigne (@emmalavigne_)\n\nDirectrice générale de la Collection Pinault (@boursedecommerce), Emma Lavigne présente l’exposition « Clair-obscur », réunissant une centaine d’œuvres qui interrogent, à partir de l’héritage du chiaroscuro, les enjeux du temps présent.\n\nSous le dôme de la Rotonde, Camata (2024) de Pierre Huyghe déploie un rituel funéraire filmé dans le désert d’Atacama. Laura Lamiel investit, quant à elle, les vingt-quatre vitrines du Passage.\nLes galeries accueillent des accrochages monographiques consacrés à Sigmar Polke, James Lee Byars et Victor Man, ainsi que des sections thématiques — brouillard, incandescence, ombre — qui mettent en dialogue des artistes modernes et contemporains de la Collection Pinault parmi lesquels Bill Viola, Bruce Nauman, Alina Szapocznikow, Yves Tanguy, Alberto Giacometti, Germaine Richier et Wolfgang Tillmans.\n\n•\n\nDirector of the Pinault Collection (@boursedecommerce), Emma Lavigne presents the exhibition “Clair-obscur”, bringing together around one hundred works that, drawing on the legacy of chiaroscuro, explore the issues of our present time.\nBeneath the dome of the Rotunda, Camata (2024) by Pierre Huyghe unfolds a funerary ritual filmed in the Atacama Desert. Meanwhile, Laura Lamiel takes over the twenty-four display cases of the Passage.\nThe galleries host monographic presentations dedicated to Sigmar Polke, James Lee Byars, and Victor Man, alongside thematic sections — fog, incandescence, shadow — that create dialogues between modern and contemporary artists from the Pinault Collection, including Bill Viola, Bruce Nauman, Alina Szapocznikow, Yves Tanguy, Alberto Giacometti, Germaine Richier, and Wolfgang Tillmans.\n\n📍 Bourse de Commerce — Pinault Collection \n2 rue de Viarmes, Paris 1er\n📆04.03.26 — 24.08.26\n\n@anaelpigeat\n@boursedecommerce \n@projets.media\n\nPRODUCTION & RÉALISATION\n@marcbeyneysonier\n@helloangels\n@cha_simon\ngongau\n@lucie.jpg\n@emma.brisot\n@instant.prod\n\n#ClaireObscur #PinaultCollection #BoursedeCommerce","r":false,"b":null,"af":false,"so":false,"pd":"2026-04-01","ld":-28,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"𝑳𝒆𝒔𝒔 𝑻𝒂𝒔𝒕𝒆, 𝑴𝒐𝒓𝒆 𝑺𝒑𝒊𝒓𝒊𝒕, an experimental exhibition of the work of long standing member...","k":"opening","s":"2026-07-24","e":"2026-08-24","st":"18:00","et":"21:00","u":"s_o_p_h_i_e_","c":"New York","co":"","p":"https://www.instagram.com/p/DbGVY_YEblj/","x":"𝑳𝒆𝒔𝒔 𝑻𝒂𝒔𝒕𝒆, 𝑴𝒐𝒓𝒆 𝑺𝒑𝒊𝒓𝒊𝒕, an experimental exhibition of the work of long standing members of Rubylith Darkroom, opens this Friday! I’m so proud of the work that’s gone into this show and what the exhibition reveals. How seven members share more than a darkroom; they share a curiosity about what photography becomes when they move beyond the expected and traditional, and start making decisions from the gut. \n \nFeaturing the work of:\nSara Danniu Beck \nZoe Elefterin\nTyler Guillen\nOlivia Harrison\nFran Kula\nSophie Schwartz\nCalli Westra\n\nThank you Calli, Fran, Lily, Olivia, Oz, Ruby, and Walker, and Zoe for putting this together !\n\nAnd shout out to Robert Frank ❤️\n\nJuly 24 - August 24, 2026\n130 Palmetto Street, Ground Floor, Brooklyn, NY\n(Follow the driveway on the left side of the building)\nOpening reception: Friday, July 24 from 6-9 pm\nOpen hours: Sundays 1-4 pm and by appointment (via DM or email rubylith@godspeedarts.org)","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Warm Up starts next Friday, July 24. Join us to ring in summer the only way we know how.","k":"other","s":"2026-07-24","e":"2026-08-28","st":null,"et":null,"u":"momaps1","c":"New York","co":"","p":"https://www.instagram.com/p/Da5mitVkszu/","x":"Warm Up starts next Friday, July 24. Join us to ring in summer the only way we know how. \n\nThe full lineup is now revealed, with @teedeejayyy closing out the season. Tickets are available for all dates. You know where to find us b2b Fridays, 4–10 p.m. through August 28.\n\n📸: @j.arbaje, @ryanmuir, @marissaalper","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-17","ld":7,"dl":"2026-08-28","ds":"run closes","ap":false,"rel":false,"q":true},{"now":true,"t":"The first Warm Up of the season starts tonight. It's sure to bring the heat.","k":"other","s":"2026-07-24","e":"2026-08-28","st":null,"et":null,"u":"momaps1","c":"New York","co":"","p":"https://www.instagram.com/p/DbLfYgfD4Bp/","x":"The first Warm Up of the season starts tonight. It's sure to bring the heat. \n\nThe lucky first 100 people in the courtyard will get an exclusive Warm Up 2026 fan. After that, you're on your own, thermally.\n\nSwing by Fridays through August 28, 4–10 p.m.\n\nGrab your tickets now at the link in bio, before prices go up at the door.","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-07-24","ld":0,"dl":"2026-08-28","ds":"run closes","ap":false,"rel":false,"q":true},{"now":true,"t":"Empty Gallery is pleased to present our first solo show with Shanghai based artist Ann ...","k":"opening","s":"2026-07-04","e":"2026-08-29","st":"18:00","et":"20:00","u":"emptygallery.hk","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DaFWO0UpPVY/","x":"Empty Gallery is pleased to present our first solo show with Shanghai based artist Ann Zhao. Both intimate meditation and trenchant diagnosis, Zhao’s exhibition attempts to grapple with what might be called the use and abuse of art for life.  Opening reception: Saturday, July 4, 6–8PM with a performance by MAI Mai at 7PM  Ann Zhao | Spillover July 4 - August 29, 2026","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-27","ld":7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Soldier Study, 2026","k":"exhibition","s":"2026-07-22","e":"2026-08-29","st":null,"et":null,"u":"beforehouses","c":"New York","co":"","p":"https://www.instagram.com/p/DbGn3oTzlON/","x":"Soldier Study, 2026\nInk on tracing paper\n13 x 17 inches \nThis work is included in the group exhibition Total Eclipse organized by @dezyemeseye open by appointment through August 29th \n\nCourtesy of Interrobang","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"„Clair de lune“ (Moonlight) is a series of sculptures realized by Éric Baudelaire in co...","k":"screening","s":"2026-07-22","e":"2026-08-29","st":null,"et":null,"u":"ccaberlin","c":"Paris","co":"","p":"https://www.instagram.com/p/DbGR-bwG4uV/","x":"„Clair de lune“ (Moonlight) is a series of sculptures realized by Éric Baudelaire in collaboration with Crystal Lau Chang, Kadiatou Diakhité, Mèï Jendoubi, Jade Ebara Ossebi, Iris Fontanella, and Astrid Plouchart, all students from the National Institute for Blind Youth in Paris. Conceived site-specifically for the ground floor of CCA Berlin the sculptures mark a step into an unfamiliar medium for the artist. Twice a month for the past year, he met the students at the school to create forms together, guided by a simple rule—to make something they consider beautiful. Each work begins as a 15 × 15 cm sculpture made by a pupil from plasticine, toy pieces, jewelry, and other found objects. These were then 3D-scanned, enlarged, carved in cherry wood, and hand-finished at the workshop of Lafayette Anticipations. The sculptures each bear a plaque with their titles in Braille. They are made to be touched.\n\nIn this collaborative, open-ended process, a new relationship takes hold, different from the one between filmmaker, filmed subjects, and audience. Watching the children’s lives unfold on the high-resolution screens, one becomes conscious of how documentary film sees—its logic of capture and comprehension, its always incomplete access to reality. The sculptures, meanwhile, bear another kind of presence, redirecting our attention to the textures of what we hold in common and what holds us in the common. These imaginary terrains, as expressions of beauty and survival, invite us to experience form through touch, and to reconsider the receptivity of being in this world. Through them, perhaps, we could feel our way toward a blurred, irreducible sociality of the senses, as darkness settles in. (Text: @nanxi.southwest )\n\nThe exhibition by Éric Baudelaire runs until 29 Aug 2026! We look forward to welcoming you! \n\nThe series „Clair de Lune“ has been realized with the support of @lafayetteanticipations 🥰 Production and woodwork: Olivier Magnier and Raphaël Raynaud\n\nThe exhibition is supported by Stiftung Kunstfonds; and Trampoline, Association in support of the French art scene, Paris.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"FORTHCOMING_","k":"exhibition","s":"2026-07-25","e":"2026-08-29","st":null,"et":null,"u":"galleryvacancy","c":"Shanghai","co":"","p":"https://www.instagram.com/p/DbF24kYERF1/","x":"FORTHCOMING_\n\nGallery Vacancy is pleased to present The Stillness of Life, a solo exhibition by Natalia González Martín, on view from July 25 to August 29, 2026.\n\n“Still life negates the whole process of constructing and asserting human beings as the primary focus of  depiction.”\n\n  Norman Bryson, Looking at the Overlooked: Four Essays on Still Life Painting\n\nNatalia González Martín often takes art history as a starting point. In this new body of work, she brings still life, a genre historically placed below narrative painting, to the foreground. By shifting attention away from the exceptional and toward the unassuming, this body of work brings the eventless into focus. Charles Sterling distinguished between “megalography,” the depiction of great or elevated subjects, and “rhopography,” the representation of trivial or seemingly insignificant things. Norman Bryson later takes up and develops this distinction, understanding rhopography as a mode of attention directed toward the material basis of life that conventional ideas of importance routinely overlook.\n\nFor this exhibition, González Martín borrows elements from historical still-life compositions. Yet unlike conventional still lifes, these works do not fully remove the human presence.\n\n📷 @tomcarterldn \n．\n@natalia.gonzalez.martin #nataliagonzalezmartin #thestillnessoflife #galleryvacancy","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":3,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Rita Ackermann & Harmony Korine","k":"exhibition","s":"2026-07-31","e":"2026-08-29","st":null,"et":null,"u":"americanartcatalogues","c":"Paris","co":"","p":"https://www.instagram.com/p/DbdadTqkb62/","x":"Rita Ackermann & Harmony Korine\nSAINT DAINT, 2026\nGraphite and Conté à Paris pencil on paper\n22 ½ × 30 inches (57.2 × 76.2 cm)\n\nOn view through August 29th, 2026\n\nSummer Hours:\nTuesday - Friday \n12 to 6p.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"[Upcoming]","k":"opening","s":"2026-07-31","e":"2026-08-29","st":"17:00","et":"18:00","u":"a_lounge_contemporary","c":"Seoul","co":"","p":"https://www.instagram.com/p/DbNFkojkqdv/","x":"[Upcoming]\n\n에이라운지는 2026년 7월 31일부터 8월 29일까지 황선영 개인전 《Susurrus》를 개최합니다. ‘Susurrus’는 보이지 않지만 분명히 존재하는 비가시적 영역의 목소리에 대한 이야기입니다(작가노트). 작가는 시선 밖에 남겨진 존재들의 내면과 목소리를 섬세한 회화적 언어로 풀어내며, 잊힌 존재를 향한 애도와 존중의 시선을 제안합니다. \n\n*오프닝 리셉션은 7월 31일 오후 5시부터 6시까지 갤러리에서 진행됩니다.\n\nA-Lounge Contemporary is pleased to present 𝘚𝘶𝘴𝘶𝘳𝘳𝘶𝘴, a solo exhibition by Hwang Sunyoung, on view from July 31 to August 29, 2026. 𝘚𝘶𝘴𝘶𝘳𝘳𝘶𝘴 explores an unseen realm that remains invisible yet undeniably present (Artist’s statement). Through delicate painterly gestures, the exhibition gives form to the inner worlds and voices of those who exist beyond the reach of our gaze, inviting viewers to reflect on remembrance, mourning, and quiet acts of recognition. \n\n*Join us for opening reception on July 31th, 5-6 PM.\n\n——————\n\nArtworks\n- 𝘊𝘰𝘶𝘯𝘵𝘪𝘯𝘨 𝘊𝘶𝘳𝘳𝘦𝘯𝘵𝘴, 2026, Oil on canvas, 180 × 150 cm (detail)\n- 𝘚𝘶𝘴𝘶𝘳𝘳𝘶𝘴, 2026, Oil on canvas, 132 × 112 cm (detail)\n- 𝘚𝘵𝘪𝘭𝘭 𝘋𝘳𝘦𝘢𝘮 𝘈𝘣𝘰𝘶𝘵 𝘚𝘸𝘪𝘮𝘮𝘪𝘯𝘨 𝘈𝘭𝘭 𝘛𝘩𝘳𝘰𝘶𝘨𝘩 𝘵𝘩𝘦 𝘕𝘪𝘨𝘩𝘵, 2026, Oil on canvas, 180 × 210 cm (detail)\n\n——————\n\n황선영 Hwang Sunyoung\n𝙎𝙪𝙨𝙪𝙧𝙧𝙪𝙨\n2026. 7. 31. - 8. 29.\n\nA——L\n서울 종로구 백석동 1가길 45\nTUE - SAT\n11:00 - 18:00","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-25","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The Studio, 2026, Oil on Linen, 109 x 207 inches","k":"other","s":"2026-05-18","e":"2026-08-30","st":null,"et":null,"u":"salman.toor","c":"Stockholm","co":"","p":"https://www.instagram.com/p/DYfbQfKlQuy/","x":"The Studio, 2026, Oil on Linen, 109 x 207 inches\n\nHonored to have this work in ‘House of Nisaba: New Stories of Painting’ curated by @hendrik_folkerts 🙏✨ @modernamuseet , Stockholm with some amazing artists. Show runs through Aug 30 ⭐️ Special thanks to @luhringaugustine @johnson_montenegro for all the support 👏🏽","r":true,"b":null,"af":false,"so":false,"pd":"2026-05-18","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"With 𝗨𝗻𝘁𝗶𝘁­𝗹𝗲𝗱 (𝗽𝗹𝗼𝘁 𝗳𝗼𝗿 𝗱𝗶𝗮­𝗹𝗼­𝗴𝘂𝗲), New York/Berlin-based artist 𝗔𝘀𝗮𝗱 𝗥𝗮𝘇𝗮 @asaaddo t...","k":"perfor
