we’ve simply created the conditions for it to speak.\n\nMessage From the Mud is on view now @stormkingartcenter until November 9th, 2026.\n\nA big thank you to Nora Lawrence, Adela Goldsmith, and the entire team at Storm King for realizing this project.\n\nPhoto by Jason Lowrie & Matt Borkowski/BFA.com\n\n1: Algae-chic at the installation site\n2: Winogradsky columns emerging from the archaeological dig site\n3-4: Leading a grounding meditation session\n5: Some important members of the team that made Message From the Mud possible - Peter Pak, Adela Goldsmith, and Nora Lawrence","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-09","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The Online Marketplace of Ideas (2026) is an expansive survey of Internet culture. Toda...","k":"exhibition","s":"2026-05-04","e":"2026-11-22","st":null,"et":null,"u":"joshuacitarella","c":"Venice","co":"","p":"https://www.instagram.com/p/DZaMttPAHm0/","x":"The Online Marketplace of Ideas (2026) is an expansive survey of Internet culture. Today, alt-media has become quantitatively larger than legacy publications. As a result, any consensus or “mainstream” has fragmented into a chaotic digital landscape. With few exceptions, all items exhibited as part of the bazaar were selected and purchased online without the knowledge of their creators. Shown together, these objects convey the cultural and political incoherence of the present moment: infinite consumer choices with limited or no political agency.\n\nCreated by @joshuacitarella & @newmodels_io ( @cbcb2000 & @lilinternet ) with spatial design by @sub.global the installation includes more than 400 pieces of creator merch (t-shirts, hats, and other drop-ship basics), printed matter (books, journals, zines), and ephemera (nicotine pouches, Modafinil blister packs, mewing gum, etc), plus a few artworks (@sden023 @tibor.dieters @jennnital & @felstead.daniel Brad Troemel and others).\n\nThe exhibition is part of “Strange Rules,” curated by @matdryhurst @holly_herndon and @hansulrichobrist with @adrianarispoli_curator for @berggruendiedo | Venice, Italy. (May 4 - Nov 22, 2026)\n\nPhotography by @stemattea special thanks to sub (@bilbelingham Giulia Domenicioni Christopher Blohm @niklas.bildstein.zaar ) @666ultracorpo999 Maria Cecilia Belis and Elena Estratti. Thank you to the @do.not.research & NEW MODELS communities for inspiring and authoring many of these items.","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-10","ld":-37,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Lydia Ourahmane will present a solo exhibition, ‘5 Works’, at the Nicoletta Fiorucci Fo...","k":"exhibition","s":"2026-05-05","e":"2026-11-22","st":"16:00","et":"20:00","u":"nicolettafioruccifoundation","c":"Venice","co":"","p":"https://www.instagram.com/p/DWliuHtjtbJ/","x":"Lydia Ourahmane will present a solo exhibition, ‘5 Works’, at the Nicoletta Fiorucci Foundation in Venice from 5 May to 22 November 2026, curated by Polly Staple. The exhibition will coincide with the 61st International Art Exhibition – La Biennale di Venezia.\n \nOurahmane’s new commission follows a residency at the Nicoletta Fiorucci Foundation in Venice. ‘5 Works’ is the direct result of negotiations, transactions and exchanges specific to historic sites and activist associations in Venice.\n \nOurahmane’s practice is focused on the real politics of daily life as much as exploring how art itself is valued and produced, distributed and displayed. We are living in a new world order in which waste collapses into sublime abstraction for many but remains a brutal reality for others. This requires a shift in perspective. What then is the form for our present moment? At what point does art insert itself into reality? In ‘5 Works’, matter is always negotiating its terms.\n \nLydia Ourahmane ‘5 Works’\n5 May – 22 November 2026\nOpening: Monday 4 May, 4-8pm\n \nNicoletta Fiorucci Foundation\nDorsoduro 2829\nVenice, Italy\n \n@nicoletta_fiorucci_london @emogirl4 @polly.staple @vittoria.totale @giorgiomastinu","r":false,"b":null,"af":false,"so":false,"pd":"2026-04-01","ld":34,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"’Things to Come’ by Maja Malou Lyse opens to the public tomorrow ★","k":"exhibition","s":"2026-05-09","e":"2026-11-22","st":null,"et":null,"u":"danishpavilion","c":"Venice","co":"","p":"https://www.instagram.com/p/DYFAz6_jHsk/","x":"’Things to Come’ by Maja Malou Lyse opens to the public tomorrow ★\n\nIn the exhibition, @habitual_body_monitoring2 draws on science and technology to stage the looming fertility crisis and a surprising study showing how erotic imagery can affect not only human senses but our very biology—questioning the power of the image and its significance for us as a species in an entirely new way.\n\nThe exhibition is curated by @the_chus_martinez and developed in collaboration with the architects @commonaccounts and the art collective @dis.\n\nExperience 'Things to Come' at @labiennale from May 9th to November 22nd 2026.\n\nPhotos: Ugo Carmeni.","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-08","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The Silence of the Mole","k":"exhibition","s":"2026-05-09","e":"2026-11-22","st":null,"et":null,"u":"sssitdownnn","c":"Venice","co":"","p":"https://www.instagram.com/p/DYeFcELjGbu/","x":"The Silence of the Mole\n\nJakub Jansa, Selmeci Kocka Jusko\n@jakub.jansa @selmecikockajusko\n\nCurated by Peter Sit @sssitdownnn\n\nCzech and Slovak Pavilion\n61st International Art Exhibition\nLa Biennale di Venezia @labiennale\n\nMay 9 – November 22, 2026\n\nCommissioner – Michal Novotný @michail_novotny \nVisual Identity – Jan Brož @imageneered\nExhibition views – Jan Kolský @jankolsky\n\nOrganized by: NGP @ngprague\nIn collaboration with: SNG sng_gallery\nSupported by: Ministry of Culture of the Czech Republic @minusterstvokultury,\nMinistry of Culture of the Slovak Republic ministerstvo_kultury.sk\nPartner of the pavilion: J&T Banka\n@jtbanka_cz @jtbanka_art","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-18","ld":-9,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Our Artist at the Venice Biennale 2026","k":"other","s":"2026-05-09","e":"2026-11-22","st":null,"et":null,"u":"kodlcontemporary","c":"Venice","co":"","p":"https://www.instagram.com/p/DX9lIT1iGWo/","x":"Our Artist at the Venice Biennale 2026\n\nJakub Jansa – The Silence of the Mole\n\nCzech and Slovak Pavilion at the 61st Venice Biennale\n\nWe are pleased to announce that Jakub Jansa, represented by KodlContemporary, is participating in this year’s Venice Art Biennale. Together with the Slovak artistic duo Selmeci Kocka Jusko (Alex Selmeci and Tomáš Kocka Jusko), he presents the contemporary Czech and Slovak art scene in the national pavilion.\n\nCurated by Peter Sit @sssitdownnn , the project forms a cohesive whole that reaches beyond the Central European context\n\n9 May - 22 November 2026","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-05","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"We handed a camera to the curator of the French Pavilion at the Venice Biennale. This i...","k":"exhibition","s":"2026-07-21","e":"2026-11-22","st":null,"et":null,"u":"artdrunk","c":"Venice","co":"","p":"https://www.instagram.com/p/DbEpX4vjQjP/","x":"We handed a camera to the curator of the French Pavilion at the Venice Biennale. This is Myriam Ben Salah's (@myriambensalah) POV of Yto Barrada's (@ytobarrada) exhibition. Let us know in the comments what you think of this new format! \n\n\"Comme Saturne\" emerges through a process of experimentation rooted in association and constraint: one word evokes another, a technique opens the door to a myth, a color refers to a material history, and an error becomes a gesture. Watch on to discover more. \n\nYto Barrada: \"Comme Saturne\"\nCurated by Myriam Ben Salah\nUntil November 22\nGiardini della Biennale\nVenice 🇮🇹","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Amid this frenetic early twentieth-century referencing, his style morphs while heavily...","k":"exhibition","s":"2026-07-28","e":"2026-11-22","st":null,"et":null,"u":"flashartmagazine","c":"Venice","co":"","p":"https://www.instagram.com/p/DbVlzCDI-GP/","x":"“Amid this frenetic early twentieth-century referencing, his style morphs while heavily alluding to classical mythology. In this way, Kantarovsky becomes a kind of necromancer of artistic movements, conjuring and reconjuring the past into contemporary compositions, refusing to let them fade to time.” \n \nHit the link in the bio to read Sanya Kantarovsky “Basic Failure” at Istituto Veneto di Scienze, Lettere ed Arti, Palazzo Loredan, Venice, reviewed by @annalisejune. \n \nKantarovsky’s show “Basic Failure” is currently on view at Istituto Veneto di Scienze, Lettere ed Arti, Palazzo Loredan, Venice until November 22, 2026. \n \n#SanyaKantarovsky \n#AnnaliseJuneKamegawa \n#FlashArt355 \n#FlashArtMagazine","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Koch Gallery ’Stars in My Pocket’, Sculptural Installation, Sperm containers and mixed ...","k":"exhibition","s":"2026-07-28","e":"2026-11-22","st":null,"et":null,"u":"danishpavilion","c":"Venice","co":"","p":"https://www.instagram.com/p/DbVcb2ejD55/","x":"Koch Gallery ’Stars in My Pocket’, Sculptural Installation, Sperm containers and mixed media.\n\nIn the Koch Gallery, one can encounter a series of containers used for the transportation of sperm. Images of sperm-racing encounters are attached to the transportation containers, which have been placed in wall niches in the room almost in the manner of religious relics.\n\nExperience THINGS TO COME at @labiennale until November 22nd.\n\n@habitual_body_monitoring2 , @the_chus_martinez, @dis, @commonaccounts\n\n📷 Ugo Carmeni\n\n#labiennale #danishartsfoundation","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Rose Salane’s film “Mercurial New York,” pursues a near rite of passage for American ar...","k":"talk","s":"2026-07-30","e":"2026-11-22","st":null,"et":null,"u":"flashartmagazine","c":"New York","co":"","p":"https://www.instagram.com/p/DbaWaS_iIre/","x":"Rose Salane’s film “Mercurial New York,” pursues a near rite of passage for American artists: create a picture of New York, capturing its capricious, yet hopeful energy through the lens of the current generation. In conversation with Chiara Siravo, the artist talks the creation of the work for the Venice Biennale following Koyo Kouoh’s passing, philosopher and anthropologist Ernesto de Martino’s conception of loss, and the proximity of her work to Duchamp’s \n“Box in a Valise.” \n \nHit the link in the bio to read, “Mercurial New York,” a conversation between @rose.salane and @chiara_clarke from 355 Summer 2026. \n \nSalane’s film “Mercurial New York” is currently on view in the Arsenale at the 61st Venice Biennale, “In Minor Keys,” through November 22, 2026. \n \n#FlorentinaHolzinger \n#JeanetteBisschops \n#FlashArt355 \n#FlashArtMagazine","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"A week and a half ago, the exhibition Sonsbeek 2026: I Don’t Need a Backyard, I Share a...","k":"exhibition","s":"2026-07-15","e":"2026-12-20","st":"11:00","et":null,"u":"platform_post","c":"Arnhem","co":"","p":"https://www.instagram.com/p/Da0MrL3Cd-R/","x":"A week and a half ago, the exhibition Sonsbeek 2026: I Don’t Need a Backyard, I Share a Park opened at POST Arnhem.\n\nTogether with Sonsbeek director @orlandomaaike , curators Christina Li and @miragad, and our own team, we celebrated the opening of POST as a partner venue for Sonsbeek 2026 @sonsbeek_artprojects \n\nThe evening concluded with a late-night opening of the exhibition, featuring works by Korakrit Arunonandchai and Forensic Architecture. The exhibition remains on view until 20 December.\n\nPlease note that our opening hours have changed. We are now open Tuesday to Sunday, from 11:00 AM to 6:00 PM.\n\nPhoto's by @djangovanardenne","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"‘To go on is hard sometimes’","k":"exhibition","s":"2026-07-14","e":"2027-01-03","st":null,"et":null,"u":"differentclass.be","c":"Antwerp","co":"","p":"https://www.instagram.com/p/DaxCf07sM3R/","x":"‘To go on is hard sometimes’\n\nArt historian @rosaweis takes us inside @mhkamuseum in Antwerp. She explores the museum’s new collection presentation: Doorgaan (Ongoing).\n\nFor Rosa, being at M HKA is also deeply personal; it’s the exact place where her lifelong fascination with contemporary art began as a seven-year-old.\n\nWhat is your earliest memory of a museum visit? Let us know in the comments below! 👇\n\n✨ Doorgaan (Ongoing) is on view until 03.01.2027 at M HKA.\n\n#differentclass #mhka #contemporaryart #antwerp #belgianart","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Guggenheim Pop: 1960 to Now” traces the enduring influence of the Pop art movement thr...","k":"exhibition","s":"2026-07-14","e":"2027-01-10","st":null,"et":null,"u":"artnews","c":"New York","co":"","p":"https://www.instagram.com/p/DayY3pHirGr/","x":"“Guggenheim Pop: 1960 to Now” traces the enduring influence of the Pop art movement through a selection of landmark works from the 1960s to today, featuring artists including Andy Warhol, Roy Lichtenstein, Maurizio Cattelan, and Alex Da Corte.⁠\n⁠\nBringing historical and contemporary perspectives into conversation, the exhibition shows how Pop continues to push and redefine the boundaries of art.⁠\n⁠\nFollow ARTnews for more exhibition coverage, and visit \"Guggenheim Pop: 1960 to Now,\" on view through January 10, 2027.⁠","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"#HaimSteinbach","k":"opening","s":"2026-07-27","e":"2027-01-10","st":null,"et":null,"u":"liarummagallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbTbyMECPW5/","x":"#HaimSteinbach\n\nChambres d’Amis turns 40\n📍S.M.A.K. Ghent, 2026\n🗓️Until 10 January 2027\n📷Haim Steinbach, Opening night, Chambres d’Amis turns 40, S.M.A.K. Ghent, 2026. Photo Martin Corlazzoli\n\nTerminal Piece\n📍Museum moderner Kunst Stiftung Ludwig Wien, Vienna, Austria\n🗓️ Until 7 February 2027\n📷 Haim Steinbach, Terminal Piece\n\nIdentity, Culture, and Community: Stories from the Collection of the Jewish Museum and Pruzan Family Center for Learning\n📍The Jewish Museum, New York, NY, USA\n🗓️ Ongoing\n📷 Installation view of “Identity, Culture, and Community: Stories from the Collection of the Jewish Museum.” Photo: Kris Graves/The Jewish Museum. \n\n700 Years of Art\n📍Städel Museum, Frankfurt, Germany\n🗓️ Ongoing\n📷 Städel Museum, Frankfurt am Main, Eigentum des Städelschen Museums-Vereins e.V. ©️ Haim Steinbach\n\n#liarumma #liarummagallery #exhibition #contemporaryart","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The exhibition 'In the Very Bowels of Changes: Surrealism and Antifascism', held until ...","k":"exhibition","s":"2026-07-30","e":"2027-01-10","st":null,"et":null,"u":"contemporarylynx","c":"Warsaw","co":"","p":"https://www.instagram.com/p/DbbG9vjlZz5/","x":"The exhibition 'In the Very Bowels of Changes: Surrealism and Antifascism', held until 10 January 2027 at @msnwarszawa, offers a distinct perspective on Surrealism. Instead of highlighting avant-garde aesthetics, it explores the movement as political imagination and examines artists’ responses to fascism, war and violence. \n\nAlthough the exhibition covers events up to the 1960s and 1970s, its relevance to current political tensions, conflicts and threats to democracy is clear. Many Surrealist goals remain relevant and, in many ways, unrealised. The exhibition serves not only as a historical account but also as a timely reflection on contemporary challenges.\n\nRead more in the interview by @kulajula 👉 click the link in our bio!\n.\n\nPhotos: Opening of the exhibition “In the Very Bowels of Changes: Surrealism and Antifascism” at the Museum of Modern Art in Warsaw. Photo by Alicja Szulc.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🖊️ <to be continued> #6 film without a camera","k":"exhibition","s":"2026-08-03","e":null,"st":"23:59","et":null,"u":"wysiwygcinema","c":"The Hague","co":"","p":"https://www.instagram.com/p/DacllWyNz6K/","x":"🖊️ <to be continued> #6 film without a camera\n\n<to be continued> invites artists and filmmakers to come together and discuss unfinished film projects in an informal, moderated setting. By exchanging thoughts and perspectives, participants gain valuable feedback to further develop their works. Through an open call, makers can submit a work-in-progress along with questions they wish to explore with fellow participants, audiences, and professionals.\n\nEdition 6 welcomes artists who make work without a camera — animating through drawing or collaging, generating visuals through code or algorithmic processes, using game engines to capture a reality, or simply pushing the limit of what an actual camera is (or is not).\n\nSubmit your work-in-progress and save the date for <to be continued>, hosted by wysiwyg and Flora Filmtheater.\n\nDeadline: 3 August 2026, 23:59 (CEST)\nEvent: Sunday 13 September 2026, Flora Filmtheater \n⁉️ Before submitting, make sure you’re available to attend physically on Sunday 13 September","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-06","ld":28,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Sadly, we are saying farewell to our Development Director, Jamison Driskill, as he step...","k":"other","s":"2026-08-04","e":null,"st":"04:30","et":null,"u":"lhucalubbock","c":"Lubbock","co":"","p":"https://www.instagram.com/p/Dbd0t8JFtU5/","x":"Sadly, we are saying farewell to our Development Director, Jamison Driskill, as he steps into a pivotal role as Managing Director for Santa Fe Playhouse. Nonetheless, we are proud to see him take this next big step Westward!\n\nJamison’s approachable, kind, and memorable energy will be missed dearly! We know he will bring amazing things to our friends in Santa Fe and wish him all the best as he embarks on this journey.\n\nPlease join us to say congrats and farewell to Jamison on Tuesday, August 4th from 4:30 - 6:00 p.m. in the LHUCA Galleries. 🤎","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Meet Mickey Palima @mickey_palima — your K-Pop Dance workshop leader ٩(˃̶͈̀௰˂̶͈́)و","k":"performance","s":"2026-08-04","e":"2026-08-06","st":"18:00","et":"20:00","u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/Da5cWajqXlt/","x":"Meet Mickey Palima @mickey_palima — your K-Pop Dance workshop leader ٩(˃̶͈̀௰˂̶͈́)و\n⠀\nBorn in the Philippines, Mickey trained in traditional folk dance before moving to the UK to study contemporary, ballet and jazz. He holds an MA in Dance Performance from Trinity Laban. \n⠀\nA lifelong K-Pop fan, Mickey’s workshops are high-energy and focus on musicality, clarity of movement and body rhythm — breaking down the details that make K-Pop choreography so exciting to dance. Open to young people between the ages of 12 and 16 — sign up now!\n\n🗓️ 4–6 August, 6–8pm\n📍 Wac Arts, Camden @wacarts \n🎟️ Free — link in bio","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-17","ld":18,"dl":"2026-08-06","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Sidney Meyers’s The Quiet One + Herbert Marshall’s Tinker","k":"screening","s":"2026-08-04","e":null,"st":"20:30","et":null,"u":"lightindustry","c":"New York","co":"","p":"https://www.instagram.com/p/DbYFYagEbBN/","x":"Sidney Meyers’s The Quiet One + Herbert Marshall’s Tinker\nTuesday, August 4, 2026 at 7pm\nLight Industry, 361 Stagg Street, Suite 407, Brooklyn\n\n7pm\nThe Quiet One, Sidney Meyers, 1948, 16mm, 65 mins\n\n8:30pm\nTinker, Herbert Marshall, 1949, 16mm, 69 mins\n\nA foundational work of American independent cinema, and a noted influence on directors like Charles Burnett and Billy Woodberry, Sidney Meyers’s The Quiet One helped inaugurate a realist idiom for film in the US. It’s an intimate study of an impoverished and neglected Harlem youth (Donald Thompson) who is sent upstate to attend the Wiltwyck School for Boys, a progressive center for the treatment of “juvenile delinquents.” Though shot on a shoestring, the moody docufiction brought together a remarkable array of mid-century talents. The project had been inspired by Helen Levitt, Janice Loeb, and James Agee’s film In the Street and, for The Quiet One, Levitt and Loeb provided cinematography, while Agee penned the dialogue. Their fellow WPA alum Sidney Meyers, who directed, would go on to helm the mondo Los Angeles classic The Savage Eye. Upon its release, The Quiet One was immediately and widely celebrated; “a new group of local film-makers has fashioned a genuine masterpiece,” the New York Times’s reviewer declared, comparing it to “those stark film dramas which we have had from Italy since the war.” Even Tallulah Bankhead was an admirer. At a preview screening, the star turned to a surprised Meyers and blurted: “It doesn't matter if you never direct another film. This is your epitaph. You can die now.”\n\nThe early British independent feature Tinker, from the same period, likewise mingles documentary and fiction in the service of an outsider’s coming-of-age tale. In this case it’s a young Traveler (Derek Smith) who abandons his family’s itinerant existence to live at a residential training center in Durham for prospective coal miners. Also parallel to The Quiet One is the use of nonprofessional actors. “This film has no stars,” Tinker explains in its opening titles. “Unknown people largely play their real life parts in their real surroundings.”\n\nFull announcement: lightindustry.org/thequietone","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-29","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Do, 6.8.2026, 19 Uhr","k":"reading","s":"2026-08-06","e":null,"st":"19:00","et":null,"u":"kestner_gesellschaft","c":"Hannover","co":"","p":"https://www.instagram.com/p/DbanNuPjBCJ/","x":"Do, 6.8.2026, 19 Uhr\nBook-Launch: Anna K.E. — If You Smell Like A Garlic I Will Love You Even More \nmit Anna K.E. & Alexander Wilmschen\n\nDie Kestner Gesellschaft freut sich, das neue Künstler:innenbuch von Anna K.E. vorzustellen: „If You Smell Like A Garlic I Will Love You Even More“, erschienen im DISTANZ Verlag anlässlich der Ausstellungen „Dolorem Ipsum“ (2024) in der Kestner Gesellschaft und „For Our Parents“ (2024/25) im Haus Esters, Kunstmuseen Krefeld.\n\nAnna K.E. und Kurator Alexander Wilmschen blicken in einem gemeinsamen Video-Call auf die Ausstellungen zurück und sprechen über die Publikation. Diese widmet sich Anna K.E.s vielgestaltiger Praxis, die sich keinem einzelnen Medium zuordnen lässt, und versammelt Textbeiträge von Estelle Hoy, Sylvia Martin, Alexander Wilmschen sowie der Künstlerin selbst.\n\n Im Anschluss an den Book-Launch kann die Publikation vor Ort (38 Euro) erworben werden. Wein und Backwaren werden gereicht.\n\nAnna K.E. — „If You Smell Like A Garlic I Will Love You Even More“ ist im Buchladen der Kestner Gesellschaft erhältlich.\n___\nThu, 6.8.2026, 7 pm\nBook-Launch: Anna K.E. — If You Smell Like A Garlic I Will Love You Even More \nWith Anna K.E. & Alexander Wilmschen\n\nKestner Gesellschaft is pleased to present the new artist’s book by Anna K.E., “If You Smell Like A Garlic I Will Love You Even More”, published by DISTANZ Verlag on the occasion of the exhibitions “Dolorem Ipsum” (2024) at Kestner Gesellschaft and ”For Our Parents” (2024/25) at Haus Esters, Kunstmuseen Krefeld.\n\nIn a video call, Anna K.E. and curator Alexander Wilmschen will reflect on the exhibitions and discuss the publication. Dedicated to Anna K.E. ‚s multifaceted practice, which resists categorization within a single medium, the book brings together texts by Estelle Hoy, Sylvia Martin, Alexander Wilmschen, and the artist herself.\n\nFollowing the book launch, the publication will be available for purchase on site. Wine and pastries will be served.\n\nAnna K.E. — If You Smell Like A Garlic I Will Love You Even More is available (38 Euro) from the Kestner Gesellschaft Bookshop.\n\nFoto / Photo: DISTANZ Verlag; Dirk Rose","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-30","ld":7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Join us to celebrate the book launch for Happy Baby by JJ Pálka Johnson, featuring a pl...","k":"reading","s":"2026-08-06","e":null,"st":"19:30","et":null,"u":"montezpress","c":"London","co":"United Kingdom","p":"https://www.instagram.com/p/DbTPMHvDCEz/","x":"Join us to celebrate the book launch for Happy Baby by JJ Pálka Johnson, featuring a play reading performed by Daisy Bevan, Helen Pearson, EM Williams and Leo Wan and directed by Jess Edwards at FormaHQ 140 Great Dover St, London, SE1 4GW, Thursday 6 August, doors at 7:30pm for a prompt 8pm start. \n\n ‘Unflinching and tender, Happy Baby confronts the barriers queer people face in becoming parents. Full of grief and rapture, fury and sass, JJ’s writing sparkles with theory and experience: love, pain, sex, friendship.’ – Izabella Scott, author of The Bed Trick\n\n \nDaisy Bevan is a London based actor. Who was most recently in Lena Dunham’s Too Much.\n \nEM Williams (They/Them) is a nonbinary theatremaker & activist from the midlands. Credits include: After The Act (New Diorama/Traverse Theatre), BodyJob (Criptic Arts - Bristol Old Vic), Sherlock Holmes and The Poison Wood (Watermill Theatre), My Brilliant Friend (National Theatre), Captain Corelli’s Mandolin (Rose Kingston & West End), Dream (RSC).\n\nHelen Pearson is an actor who has worked extensively in theatre – repertory, the London fringe and the West End – as well as in film and television. She is best known for playing Frankie in Hollyoaks for 15 years. TV includes: Emmerdale, Eastenders, Attachments, Inspector Morse. Theatre includes: Book of Will, Calendar Girls and Blood Brothers.\n\nJess Edwards is a director and writer represented by Curtis Brown. Recent directing: Are You Watching? (Royal Court); Elephant (Bush Theatre / Menier); Conversations After Sex (Park); Hotter/Fitter (Soho). Jess is also a visiting lecturer at LAMDA, NSCD, Central, and Oxford University. Writing: Private View (Soho Theatre), published by Bloomsbury.\n \nLeo Wan theatre includes: Man and Boy, The Great Wave (National Theatre); The Mirror and the Light, As You Like It, The Taming of the Shrew (RSC); Chariots of Fire, The Good Person of Szechwan, Rock/Paper Scissors (Sheffield Theatres); Macbeth (ETT); Miss Julie (Chester Storyhouse). TV includes: Big Mood (Channel 4); Bridgerton (Netflix); Crashing (Big Talk).","r":false,"b":"doors","af":true,"so":false,"pd":"2026-07-27","ld":10,"dl":"2026-08-06","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"ACID + INTERNATIONAL WESTERNS","k":"screening","s":"2026-08-06","e":"2026-08-31","st":null,"et":null,"u":"anthologyfilmarchives","c":"New York","co":"","p":"https://www.instagram.com/p/DbJGGLzEcVI/","x":"ACID + INTERNATIONAL WESTERNS\nAugust 6 – 31\n\nFollowing the final screenings of \"Experimental Westerns, Part 1: Avant-Garde Westerns,\" taking place through this Sunday, we'll shift our focus to films made in a more conventional narrative-fictional mode, but that are nonetheless formally radical, politically subversive, concertedly revisionist in their approach to the genre, or just flat-out bizarre.\n\nMore international in scope (but looking beyond the more celebrated and often-screened realm of the Spaghetti Western), the August selection encompasses Acid Westerns (such as Monte Hellman’s RIDE IN THE WHIRLWIND, George Englund’s ZACHARIAH, Roland Klick’s DEADLOCK, and Jim Jarmusch’s DEAD MAN), feminist Westerns, Black Westerns, Indigenous Westerns, Osterns, Goulash Westerns, and much more. These films demonstrate the degree to which the Western has proven fruitful even to filmmakers motivated by a desire to question and subvert its foundational myths.\n\nSee our website for full program details.\n\nThis project is supported in part by the National Endowment for the Arts.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":14,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":false,"t":"Join us on August 6 for “Counter-Occupation,” an evening of performance and conversatio...","k":"performance","s":"2026-08-06","e":null,"st":null,"et":null,"u":"asiaartarchiveinamerica","c":"Singapore","co":"","p":"https://www.instagram.com/p/DbEN3eZCRaQ/","x":"Join us on August 6 for “Counter-Occupation,” an evening of performance and conversation with artists Herdimas Anggara (@herdimas.anggara) and Chia Amisola. This program is presented in conjunction with “Prototypes for Alternative Power,” an online exhibition curated by Celine Wong Katzman (@rojakgirl) for the Singapore Art Museum.⁠\n⁠\nFollowing presentations by Anggara and Amisola, the artists will join Celine in conversation to address issues around occupation, improvisation, and resistance across technological and social infrastructures. Please note that RS \nAls reactie op het Leidse erfgoed van Oriëntaalse kennisproductie, reflecteert de tentoonstelling op de manieren waarop ‘het Oosten’ is verzameld, bestudeerd en esthetisch gewaardeerd. Ook laat het zien hoe hedendaagse Oost-Aziatische kunstpraktijken in Europa worden ontvangen.\n\n🇬🇧A new exhibition is coming to TROEF! Join us August 7th at the opening of To Orient before Sunset, from 17:30\n\nIn this exhibition, curator Augustina Cai brings together artistic research projects by Andong Zheng, Dakota Guo and the duo Lou Kim and Jiyoung Yim.\n\nTo Orient before Sunset is anchored in archaeology, botanical taxonomy and cartography. The exhibition questions how modern knowledge systems turn situated relations into fixed categories, rendering them into knowable and governable entities.\n\nResponding to Leiden’s heritage of Oriental knowledge production, the exhibition reflects on the ways ‘the Orient’ has been collected, studied and aesthetically appreciated. It also points to how contemporary East Asian artistic practices are received in Europe.\n\n🌄To Orient before Sunset: Digging, Naming, Mapping is on show from August 7th to September 27th, every Friday, Saturday and Sunday. More info is available on our Instagram page and website.\n\nCurated by Augustina Cai @augustina.cai\n\nParticipating artists:\n🌐 Dakota Guo (@kotaiwas___)\n🌐 Andong Zheng (@andongzheng)\n🌐 Lou Kim (@loulou.zip) & Jiyoung Yim (@jiji.the.busy)\n\nThis exhibition is part of TROEF’s In Shared Air series. Supported by taxpayers, @pictoright, @cultuurfonds, @gemeenteleiden, @mondriaanfonds\n\n#artopening #contemporaryart #leiden #hedendaagsekunst","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":16,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Introducing the Camp Miasma Playset™, a collector’s nightmare brought to life. Featurin...","k":"other","s":"2026-08-07","e":null,"st":null,"et":null,"u":"welcometocampmiasma","c":"","co":"","p":"https://www.instagram. ram.com/p/DbVpQDOCMhk/","x":"\"A deadpan gem.\"\n—Sheri Linden, The Hollywood Reporter\n\nWatch the trailer for OLMO, the warmly funny and deeply affecting new film from acclaimed Mexican filmmaker Fernando Eimbcke.\n\nSet in 1979 New Mexico, this tender coming-of-age story follows a Mexican American teenager navigating family, identity, and the uncertain path to adulthood.\n\nOpening Friday, August 7 at @quadcinema in New York and @laemmletheatres in Los Angeles, before expanding to more cities.\n\n#OlmoFilm #FernandoEimbcke #MexicanCinema #LatinoCinema #Olmo @greenwichentertainment","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"We are excited to announce our first CABIN Residency Open House hosted in Potsdam, New ...","k":"exhibition","s":"2026-08-07","e":"2026-08-09","st":null,"et":null,"u":"cabin.ny","c":"New York","co":"","p":"https://www.instagram.com/p/DaicAh4gNUK/","x":"We are excited to announce our first CABIN Residency Open House hosted in Potsdam, New York over the weekend of August 7-9. \n\nThe weekend celebrates the closing of our summer residency session, featuring an exhibition of works by the 23 artists who have been living and working with us in Potsdam over the past two months as well as open studios, nature walks and a seated dinner and closing party. \n\nWe hope this weekend offers an opportunity to see our campus and discover our plans for the future. If you’d like to join us, please contact Lawrence@cabinberlin.com for the full program, accommodation details, and further information.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-08","ld":30,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🎬 The Final Film Festival (@tff_festival) begins next Friday at the ICA, 7 – 9 August.","k":"screening","s":"2026-08-07","e":"2026-08-09","st":null,"et":null,"u":"icalondon","c":"London","co":"United Kingdom","p":"https://www.instagram.com/p/DbdOZ3Tlvrn/","x":"🎬 The Final Film Festival (@tff_festival) begins next Friday at the ICA, 7 – 9 August.\n\nFriday’s programme:\n\n⛺ UK Premiere: Camping du Lac \nA surreal lakeside fable of a stranded traveller, a mythical beast, and the blurred edges of memory and fiction. Followed by a Q&A.\n\n🔥 Personal Problems\nA radical improvisational “meta-soap opera” exploring Black life in 1970s Harlem.\n\n🎞 Richard Heslop: A Collection of Short Films\nFour experimental shorts from 1984–1992, introduced by archivist Nicole Atkinson.\n\n🎟 Tickets @icalondon link in bio\n📍 ICA Cinema, 7 – 9 August\n\n#TheFinalFilmFestival #FilmFestival #CampingDuLac #PersonalProblems #RichardHeslop #ICA #Cinema #London","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-31","ld":7,"dl":"2026-08-09","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Our new exhibition “Reframing the Slasher: Teenage Sex and Death at Camp Miasma” is now...","k":"exhibition","s":"2026-08-07","e":"2026-11-08","st":null,"et":null,"u":"movingimagenyc","c":"New York","co":"","p":"https://www.instagram.com/p/DbbhYUCQtw4/","x":"Our new exhibition “Reframing the Slasher: Teenage Sex and Death at Camp Miasma” is now open! It features material related to Jane Schoenbrun’s acclaimed new horror comedy, pairing screen-used props from the fictional Camp Miasma franchise—VHS tapes, posters, merchandise, and a costume—with a series of movie posters selected by the director. \n\nFree admission. On view through November 8 at @movingimagenyc, presented by @mubi \n\nTeenage Sex and Death at Camp Miasma is in theaters August 7.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":8,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"The idea of wind has surfaced a few times in the imageries we have made throughout the ...","k":"exhibition","s":"2026-08-08","e":"2026-10-09","st":"13:30","et":null,"u":"infoandupdates","c":"Montreal","co":"","p":"https://www.instagram.com/p/DbYa4cjDmXa/","x":"The idea of wind has surfaced a few times in the imageries we have made throughout the years. In 2020, for the exhibition identity of “Study of Things” at Guangdong Times Museum, we depicted wind as a current of air weaving through curtains as it crossed a house from one windowsill to another. Hopefully, the viewer would almost feel the summer breeze just by looking at the image. In many residential towers across Southern China, apartments are oriented to capture prevailing winds, allowing natural ventilation to soften the region’s scorching summers. Wind is always present, yet we rarely take notice, unless exaggerated. Instead, we perceive it through the movement of other things. We look to objects around us to confirm its presence.\n\nThe air-conditioning unit is an emblematic feature of these parts of China (the South). When we first visited Shenzhen’s Nantou Old City’s space in May 2026, one of the first things that caught our attention was how the heat pump motors of two air-conditioning units disrupted the otherwise pristine wall of the temple that would become one of the exhibition venue for the fifth iteration of the award. Because we wanted this edition of the visual identity to reflect the physicality of the site, we decided to incorporate the same elements that define the built environment of the Nantou district: tiled façades, air-conditioning units, and suspended structures. As we all experience increasingly warmer summers, the act of “temperature conditioning”has become a recurring theme across contemporary art and design. A notable example is the recent Tromarama’s “Turn On #2”, presented as July’s Midnight Moment in Times Square.\n\nAWARD360° BEST 100 EXHIBITION\nOpening: August 8, 13:30\nPublic Opening: August 8 – October 9 (Closed on Mondays; open as usual during public holidays.)\nVenue: No.83 & RE-Gallery, Nantou City, Nanshan District, Shenzhen\nExhibition Design: Studio Pianpian He and Max Harvey and the design360 team \n@infoandupdates @aoaooooooooo_ @design360magazine \n3D modeling: @seagull_wzz and Feng Junjie\n\n#深圳 #广东","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Next at Glasshouse:⁠","k":"exhibition","s":"2026-08-08","e":"2026-09-05","st":"15:00","et":"17:00","u":"gertrudecontemporary","c":"Melbourne","co":"","p":"https://www.instagram.com/p/DbHVDuOGYE6/","x":"Next at Glasshouse:⁠\nRenee Cosgrave & Maia Kreisler⁠\nWaiho i te Toipoto (keep close together)⁠\n⁠\n8 August - 5 September 2026⁠\nGertrude Glasshouse⁠\n44 Glasshouse Road, Collingwood⁠\nWurundjeri Country⁠\n⁠\nOpening Event: Saturday 15 August, 3 – 5pm\n\nJoin us on Saturday 22 August at 12:30 for Kai and Kōrero (food and conversation) with Gertrude Studio Artist ⁠Renee Cosgrave and Maia Kreisler.\n⁠⁠\nAs an exhibition title, Waiho i te Toipoto evokes whānau and kinship, whakapapa and ancestral connection, community and collective care, belonging and the bonds that endure across distance and time. For these bodies of work, both concerned with whakapapa, memory, and relationships, they carry both a personal and collective meaning without being overly descriptive. Whakapapa is often translated as genealogy or family lineage. In simple terms, whakapapa is the story of where you come from and how you are connected. This collaborative exhibition brings into dialogue a wall painting by Gertrude Studio Artist Renee Cosgrave (Ngāti Tūwharetoa) and a series of recent works by Maia Kreisler (Ngāti Mutunga & Te Āti Awa), contextualised and expanded through an exhibition text by Emma Hislop (Kāi Tahu).⁠\n⁠\n–⁠\n⁠\nRenee Cosgrave is represented by @haydens.gallery, Naarm Melbourne.⁠\nMaia Kreisler is represented by @seasonaotearoa, Tāmaki Makaurau Auckland.⁠\n⁠\nGertrude Glasshouse is generously supported by Michael Schwarz and David Clouston.⁠\n⁠\nRenee Cosgrave, work in progress, 2026, oil on canvas. Copyright and courtesy the artist. Image: @reneecosgrave⁠\nMaia Kreisler, Upoko (detail), 2026 ceramic and silver oil paint. Copyright and courtesy the artist. Image: @maia_kreisler_⁠\n⁠\n#GertrudeGlasshouse #GertrudeStudioArtist #ReneeCosgrave #MaiaKreisler⁠","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":16,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🔊🔊🔊 Exhibition Extended 🔊🔊🔊","k":"exhibition","s":"2026-08-08","e":null,"st":"18:00","et":"21:00","u":"gallerysinclairnyc","c":"New York","co":"","p":"https://www.instagram.com/p/Daz4Cc9EQ61/","x":"🔊🔊🔊 Exhibition Extended 🔊🔊🔊\n\nWe are pleased to announce that Andina Marie Osorio’s exhibition “you’re just a bee charmer” has been extended and will be on view until Saturday August 8th. \n\nThe show features eight photographs—five candid family moments and three formal portraits—which have all been transformed through a collaborative process with a honeybee colony in New Haven, CT. Depicting a range of intimate events including holiday meals and loving embraces on slipcovered sofas, the ubiquity of these images disguise the exhaustive labor performed by women to orchestrate the moment.\n\nAs bees tear at the image, they create new forms that call into question the delicacy between precious nostalgia and physical erasure. Once a record of family life, the photographs are now quiet and deformed, unsettling the traditional understanding of archival record. \n\nWe are excited to spend more time with this work and will be announcing public programs soon. See the show, Thursday-Saturday from 6-9pm and Sundays 3-6pm.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":24,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"On August 8, join a series of programs around “Liz Glynn: Open House,” beginning with a...","k":"performance","s":"2026-08-08","e":null,"st":"18:30","et":null,"u":"stormkingartcenter","c":"New York","co":"","p":"https://www.instagram.com/p/DbRabbejQXG/","x":"On August 8, join a series of programs around “Liz Glynn: Open House,” beginning with a conversation with the artist at 4PM. Learn more about the history of the project, Glynn’s process, and the work’s first installation outdoors. \n\nFollowing the talk, Members are invited on an exclusive tour of the work with Assistant Curator Adela Goldsmith—become a Storm King Member to attend. \n\nStarting at 6:30PM a public performance will activate the installation. \"Folly (1-2-3)\" is a deconstructed waltz slowly decaying in the landscape and gestures toward new construction. Audiences are welcome to wander through the durational performance as the sun sets. An additional performance of \"Folly (1-2-3)\" will take place on August 7.","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-26","ld":13,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Opening on 8 August 2026, Vantage Point 13 presents newly commissioned works that refle...","k":"exhibition","s":"2026-08-08","e":"2026-11-29","st":null,"et":null,"u":"sharjahart","c":"Sharjah","co":"","p":"https://www.instagram.com/p/DbA_BF7INAH/","x":"Opening on 8 August 2026, Vantage Point 13 presents newly commissioned works that reflect on the evolving possibilities of documentary photography.\n\nDeveloped in close collaboration with six artists, the exhibition considers documentary photography as a field shaped through continuous observation, negotiation and interpretation. \n\nFeaturing works by Adam Rouhana, Guanyu Xu, Latifa AlBokhari, Luisa Dörr, Maheder Haileselassie and Sathish Kumar, the 13th edition of the open-call photography exhibition will be on view at our Photography Gallery—Vantage Point’s new permanent home. \n\nThe exhibition is curated by Sara Al Mheiri, Assistant Curator, and Osemudiamen Ekore, Curatorial Assistant, Sharjah Art Foundation.\n\n📍 Gallery 2, Photography Gallery, Al Manakh, Sharjah\n🗓️ 8 August–29 November 2026\n\nBook now through our link in the bio.\n\nImage: Luisa Dörr, Zoila and Iuzkani, Teuchitlán, Jalisco, Mexico, 2024. From ‘Escaramuzas’, 2024–ongoing. Image courtesy of the artist \n\nيُفتتح معرض «الشارقة، وجهة نظر 13» في 8 أغسطس 2026، مقدماً أعمالاً جديدة أُنتجت بتكليف من مؤسسة الشارقة للفنون، وتستكشف إمكانيات التصوير الفوتوغرافي الوثائقي وتطوره الدائم.\n\nطُوّر المعرض بالتعاون مع ستة فنانين يقاربون التصوير الوثائقي باعتباره مجالاً متحولاً، لا تحدده حقائق ثابتة، وإنما بصيرة متواصلة لا تتوقف.\n\nيضم المعرض أعمالاً لكل من آدم روحانا، غوانيو شو، لطيفة البخاري، لويزا دور، ماهيدر هايليسيلاسي، وساتيش كومار، وتُقام نسخته الثالثة عشرة في رواق الفوتوغراف، المقر الدائم الجديد لمعرض «الشارقة، وجهة نظر».\n\nيقيّم المعرض كلٌّ من سارة المهيري، وأوسيموديمن إيكوري، القيّمين المساعدين في مؤسسة الشارقة للفنون.\n\n📍  رواق الفوتوغراف، المناخ، الشارقة\n🗓️ 8 أغسطس - 29 نوفمبر 2026\n\nاحجزوا الآن عبر الرابط الموجود في الوصف.\n\nالصورة: \nلويزا دور، زويلا وإيوزكاني، تيوتشيتلان، خاليسكو، المكسيك، 2024. من “فريق إسكاراموزاس\"، 2024-لتاريخه. الصورة بإذن من الفنانة","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-20","ld":19,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Introducing Assembly—the cultural and educational layer of Fuser. A community of educat...","k":"launch","s":"2026-08-08","e":null,"st":null,"et":null,"u":"fuserstudio","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/Da3ZdxinT9y/","x":"Introducing Assembly—the cultural and educational layer of Fuser. A community of educators and creative practitioners, and contributors who teach, learn, and shape where this goes next.\n\nJoin us Saturday, Aug 8 in LA for a launch party and happy hour with DJ @olivekimoto \n\nLink in bio to RSVP.","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-16","ld":23,"dl":"2026-08-08","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"🦞 It’s finally for realll 🦞","k":"screening","s":"2026-08-08","e":null,"st":null,"et":null,"u":"female.boyfriends","c":"London","co":"","p":"https://www.instagram.com/p/DacqbAWjHQM/","x":"🦞 It’s finally for realll 🦞\nOn 8 August, we’re bringing together some of the hottest and most talented FLINTA* queer artists from London, Amsterdam, and Paris, alongside amazing local FLINTA* talent. 🐬\nFor one night only, we’re taking over an iconic location at MAS Antwerp with Mas darling for 10 hours of dancing, flirting, arm wrestling, and celebrating building community together.\nWe’ve never been this excited to celebrate FLINTA* Pride after a day of protest in Antwerp. 🦑\nBring your lovers. Bring your friends & allies. Bring your crushes & your exes. This one is going to be spicyyyy 🐡, and you do not want to miss it. \nKeep an eye on our page 👀 there are plenty of surprise announcements still to come.\n‼️Last year’s edition sold out‼️, so don’t wait last minute to get your ticket. We work with a pay-what-you-can system to keep the party affordable and accessible for everyone.\nLink in bio. 🎟️🎟️🎟️\n\n<33 @bringulda for the seahorses\n<33 @yasmine.d88 for all your help behind the screens","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-06","ld":33,"dl":"2026-08-08","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"we’re back at MAS Antwerp to celebrate trans and dyke pride this summer! 💗💗💗","k":"other","s":"2026-08-08","e":null,"st":null,"et":null,"u":"female.boyfriends","c":"Antwerp","co":"","p":"https://www.instagram.com/p/DZ-JlXLsfvu/","x":"we’re back at MAS Antwerp to celebrate trans and dyke pride this summer! 💗💗💗\n\non Saturday 8 August, we’re welcoming you to MAS for a FLINTA* pride clubnight, 10 hours of dancing and lots of surprises.\n \nwe can’t wait to share the iconic lineup we’ve prepared for you with national and international flinta artists.\n\nwe are a vital part of the queer community and are so often underrepresented, we’re so grateful to MAS for making space again for us to come together, connect, build community, and dance our asses off with friends and allies after a full day of protest.\n\n 🗓️🗓️🗓️mark your calendars: \ntickets go online next week, on 1 July.\n\n 💗u, see u very soon\n\nthank you @bringulda for the seahorse designsssss","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-06-24","ld":45,"dl":"2026-08-08","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"🎵 Experience your favorite film and game scores live! 🎻🎹","k":"concert","s":"2026-08-09","e":null,"st":null,"et":null,"u":"asianartmuseum","c":"San Francisco","co":"","p":"https://www.instagram.com/p/DbbP1DBDT6y/","x":"🎵 Experience your favorite film and game scores live! 🎻🎹\n\nJoin us for an enchanting afternoon of chamber music with @sixthstationtrio. Featuring stunning violin, cello, and piano arrangements of beloved cinematic masterpieces and iconic video game themes, this is a concert you won't want to miss!\n\nWhether you're a fan of animation scores, gaming soundtracks, or just looking for a gorgeous afternoon of music, let the melodies transport you on Sunday, August 9.\n\nLink in bio for more information.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"𒀭We’re honoured to have commissioned graphic designer and academic Can Yang @solxus to ...","k":"exhibition","s":"2026-08-10","e":null,"st":null,"et":null,"u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/Da219QXiggz/","x":"⠀\n𒀭We’re honoured to have commissioned graphic designer and academic Can Yang @solxus to create the visual identity for zero material (^з^)-☆\n\nCan’s research explores how visual systems construct, circulate and destabilise meaning across post-digital and translingual conditions — with close attention to the cultural and political dynamics of image production.\n\nHer design for zero material is a direct response to the programme’s manifesto. The identity is built from the everyday: notes, text messages, manifestos circulated by email, open calls saved, printed and shared.\n\nIn doing so, the design makes visible the hidden labour of organising a programme — drawing attention to the ordinary tools, formats and infrastructures through which cultural production comes into being.\n⠀\n⠀\n⚑ Apply to the open call: Kakilang is commissioning one artist with a conceptual or visual arts practice to develop a new body of work. The artist will receive £2,500 and a production budget. Open call deadline is 10 August 2026. \n⠀⠀\n☛ For full details, visit the link in bio:\nwww.kakilang.org.uk/2026-open-call-zero-material\n⠀\n⠀\n#zeromaterial #canyang @can.grafik","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":25,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"⚑ Open Call: Kakilang is commissioning one ESEA artist with a conceptual or visual arts...","k":"talk","s":"2026-08-10","e":null,"st":null,"et":null,"u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/Daf-B2Kjn9b/","x":"⠀\n⚑ Open Call: Kakilang is commissioning one ESEA artist with a conceptual or visual arts practice to develop a new body of work, with a public presentation in spring 2027. \n⠀\n𒀭zero material manifesto: \nIn an age of scarcity and excess, what forms of art making remain relevant? zero material recognises that each material, whether tangible or intangible, carries its own agency that awaits to be exercised creatively — informed by diasporic experience, it proposes unorthodox approaches like hacking, smuggling and piggybacking as artistic practice.\n⠀\n❥ Artist fee: £2,500 + production budget \n⛸︎ Open call deadline: 10 August 2026 \n⠀\n☛ For full details, visit the link in bio:\nwww.kakilang.org.uk/2026-open-call-zero-material\n⠀\n❛ Programme developed by Liang-Jung Chen @chen_liangjung \n❛ Visual identity designed by Can Yang @can.grafik \n⠀\n✤ With thanks to Rhine Bernardino @rhineandshine for joining the selection panel","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-07","ld":34,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"𒀭 Introducing our zero material open call selection panel: Chen Liang-Jung","k":"talk","s":"2026-08-10","e":null,"st":null,"et":null,"u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/DbYpuA_jsp9/","x":"𒀭 Introducing our zero material open call selection panel: Chen Liang-Jung\n\n@chen_liangjung is an artist and researcher interested in how artefacts and interface can be observed, redirected and reconfigured as creative material. Her practice creates intervention in the infrastructures that quietly shape everyday life.\n\nIn her project UK Indefinite Leave to Remain Application Fee (2025), Liang-Jung smuggles her own immigration process as artwork — treating bureaucratic experience and administrative labour as artistic media.\n\n⚑ zero material is the perfect opportunity for an artist with a conceptual or visual arts practice looking to develop a new body of work alongside a public presentation in Spring 2027.\n\n❥ Artist fee: £2,500 + production budget \n⛸︎ Open call deadline: 10 August 2026 \n⠀⠀\n☛ For full details, visit the link in bio\n⠀\n#zeromaterial #chenliangjung","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":12,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"𒀭Our Artistic Director Howl Yuan will be part of our zero material programme selection ...","k":"performance","s":"2026-08-10","e":null,"st":null,"et":null,"u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/DbI-Tmtq62m/","x":"𒀭Our Artistic Director Howl Yuan will be part of our zero material programme selection panel!\n\nHowl Yuan 原承伯 @howlyuan is a performance maker and cultural organiser. Working across live, site-responsive performance, installation and participatory practice, he creates intimate experiences that invite audiences to navigate memory, migration and belonging through walking, objects, conversation and shared encounters.\n\nThe image above is from [Waiting Between…], a constructed visual work using debris washed ashore to symbolise the experience of waiting as a condition of life on a border island. Rather than representing borders as sites of movement or transition, it explores the suspended temporality of a place shaped by stillness, repetition, and the slow passage of time.\n\n⚑ zero material is the perfect opportunity for an artist with a conceptual or visual arts practice looking to develop a new body of work alongside a public presentation in Spring 2027.\n\n❥ Artist fee: £2,500 + production budget \n⛸︎ Open call deadline: 10 August 2026 \n⠀⠀\n☛ For full details, visit the link in bio\n⠀\n#zeromaterial #howlyuan","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":18,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🎟️ TICKET GIVEAWAY 🎟️⁠","k":"exhibition","s":"2026-08-11","e":"2026-09-13","st":null,"et":null,"u":"berlinartlink","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbcrbwjEwIY/","x":"🎟️ TICKET GIVEAWAY 🎟️⁠\n⁠\nPresented at KW, 'Kyiv Biennial – A Bird That Cannot Land' is an exhibition centered on how we experience belonging in times marked by war, uncertainty and estrangement. Featuring over 40 intergenerational and international artistic positions, post-Soviet Eastern Europe is linked with Central and Southwest Asia and the Mediterranean; the contemporary condition of exile being their unifying thread. ⁠\n⁠\nThe works featured, including those by artists Neda Saeedi, Flaka Haliti and Geta Brătescu, are shaped by lived experiences echoing rupture, migrant memories, their affective architectures, and the historical traces that persist both in bodies and in the spaces we inhabit.⁠\n⁠\nWe’re giving away 1 x 2 tickets to ‘A Bird That Cannot Land.’ To enter the giveaway, follow @berlinartlink and @kwinstitutefcontemporaryart on Instagram, like this post, and tag a friend in the comments. The winner will be drawn on Tuesday, August 11 and contacted via DM.⁠\n⁠\nTo read more about the exhibition, on view until September 13, go to the link in bio.⁠\n⁠\nImage 1: Neda Saeedi: ‘Abyssal Zone,’ 2026. Installation view of the exhibition ‘Kyiv Biennial – A Bird That Cannot Land’ at KW Institute for Contemporary Art, Berlin 2026 // Courtesy the artist, photo by Frank Sperling⁠\n⁠\nImage 2: Flaka Haliti: ‘I SHOUT, YOUR ECHO BOUNCE, WHAT AM I?,’ 2023. Installation view of the exhibition ‘Kyiv Biennial – A Bird That Cannot Land’ at KW Institute for Contemporary Art, Berlin 2026 // Courtesy Christine König Gallery, Vienna, Deborah Schamoni, Munich and the artist, photo by Frank Sperling⁠\n⁠\nImage 3: Geta Brătescu: ‘The Traveler,’ 1970. Installation view of the exhibition ‘Kyiv Biennial – A Bird That Cannot Land’ at KW Institute for Contemporary Art, Berlin 2026 // Courtesy Collection of the Museum of Modern Art in Warsaw, photo by Frank Sperling⁠\n⁠\n@kwinstitutefcontemporaryart @kyivbiennial @neda_saeedi @flakahaliti_ @getabratescu.apparitions @christinekoenigchapter3 @deborahschamoni @msnwarszawa⁠\n#ticketgiveaway #ticketraffle #biennial #intergenerational #kwinstituteforcontemporaryart","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-31","ld":11,"dl":"2026-09-13","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Book Now: Join us on Wednesday 12th August, 6:30–8:30pm for ‘The Feminist Texts We Can’...","k":"reading","s":"2026-08-12","e":null,"st":"18:30","et":"20:30","u":"autoitalialondon","c":"London","co":"","p":"https://www.instagram.com/p/Da5YVBdjFl2/","x":"Book Now: Join us on Wednesday 12th August, 6:30–8:30pm for ‘The Feminist Texts We Can’t Read: How Non-Translation Silences East Asian Movements’, a reading and discussion group with artists Soo Hyun Lee and Riley Tu.\n\nThis session explores East Asian feminist thought that remains largely unavailable to English-speaking audiences.\n\nDrawing on key texts from Japan and South Korea, the session asks how translation shapes the circulation of feminist knowledge, and what is lost when influential writing remains untranslated. Through excerpts from works by Ueno Chizuko, Jinsook Kim and Soo Hyun Lee, participants will consider how colonial histories, linguistic hierarchies and publishing structures shape which feminist ideas, histories and political struggles become visible in global conversations.\n\nThe session also introduces feminist organising in South Korea following the 2016 Gangnam Station murder, including the sticky-note memorials that transformed public space into a site of collective testimony and protest.\n\nAlongside these texts and case studies, participants will examine the geopolitics of translating both fiction and non-fiction, exploring how different forms of writing carry cultural, political and emotional meaning across languages. Together, these materials offer insight into feminist resistance in East Asian contexts while opening broader questions about translation, visibility and transnational solidarity.\n\nStructured as a collective reading and discussion, the event invites participants to read, reflect and exchange ideas. No prior knowledge is required. All reading materials will be provided and introduced during the session.\n\nThis event is free to attend and will take place at Auto Italia. To register, follow the link in our bio.\n\n@riileytu\n@todayisoohyun\n\nImage 1: Soo Hyun Lee, ‘My Soft Hands Became a Sword One Day’, 2025 \nImage 2: Riley Tu, ‘Quantised Bits of Light till It Added to a Whole’, 2024","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-17","ld":26,"dl":"2026-08-12","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"🌊 As part of the programme that accompanies Elisa Giardina Papa’s solo exhibition, scho...","k":"screening","s":"2026-08-12","e":null,"st":"18:30","et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/DbdC56-G7z3/","x":"🌊 As part of the programme that accompanies Elisa Giardina Papa’s solo exhibition, scholar Damon R. Young (@damonyoung) brings together three films: L’Hippocampe, L’Atalante, and Moon’s Pool.\n\n“Together, these films trace an alternative history of the moving image below the surface. In dialogue with Giardina Papa’s exhibition, Aqua-cinema explores the queer resonances of the camera submerged in a translucent medium whose refractions loosen the hold of colonial narration and allow other lifeworlds, temporalities, and forms of relation to shimmer into view.” — Damon R. Young\n\n📍 Book @icalondon link in bio\n🗓 Wed 12 Aug, 6:30pm\n\n#Aquacinema #LHippocampe #LAtalante #MoonsPool #JeanVigo #Screening #ICA #Exhibitions","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-31","ld":12,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"We are delighted to announce our gallery summer project, ΠΝΕΥΜΑ PNEVMA, opening at The ...","k":"exhibition","s":"2026-08-12","e":"2026-08-24","st":"19:00","et":"22:00","u":"hannahbarrygallery","c":"Patmos","co":"Greece","p":"https://www.instagram.com/p/DaM2M8UAs2x/","x":"We are delighted to announce our gallery summer project, ΠΝΕΥΜΑ PNEVMA, opening at The Stavrakas House, The Patmos Trust, Patmos, 12–24 August 2026\n\nFollowing No Rush, the last show of Norman Hyams’ works at Hannah Barry Gallery and the first since his death in the Autumn of 2024, ΠΝΕΥΜΑ PNEVMA is the first international exhibition of Hyams’ work.\n\nTranslating as breath or spirit – a life-giving essence, ΠΝΕΥΜΑ PNEVMA presents a series of paintings depicting the Dodecanese and surrounding sea, many selected from Hyams’ studio in Shepherds Bush and previously unseen.\n\nThe exhibition will be open at The Stavrakas House, The Patmos Trust, Patmos, 7–10pm each day. Free entry, all welcome.\n\nNorman Hyams\nUntitled, 2024\nOil & acrylic ink on board\nTitled, signed and dated on verso\n42 x 46.5 cm\n\nNorman Hyams Summer studio, Patmos 2022 at the house of Michael and Marina of Greece \n\nNorman Hyams\nUntitled, date unknown\nOil on canvas on board\nStamped on verso\n20 x 24.9 x 0.2 cm","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-30","ld":43,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"From 12 August ΠΝΕΥΜΑ PNEVMA will open at the Stavrakas Mansion. Situated on Patmos, a ...","k":"exhibition","s":"2026-08-12","e":null,"st":null,"et":null,"u":"hannahbarrygallery","c":"Patmos","co":"Greece","p":"https://www.instagram.com/p/DbYhZN2CjH-/","x":"From 12 August ΠΝΕΥΜΑ PNEVMA will open at the Stavrakas Mansion. Situated on Patmos, a remote Greek island 8 hours from Athens, the exhibition presents a series of paintings depicting the Dodecanese and surrounding sea, many selected from Norman Hyams’ studio in Shepherds Bush and previously unseen. \n\nSave for the repeated silhouette of a diver, perhaps a self-portrait, the sea and the islands are the sole subjects of the exhibition. Painting on a range of materials available to him: dried paint palettes, fruit crates, sponges and plates, a number of the works present as halfway between object and painting, the rough surfaces mimicking the rugged landscape and changeable sea.\n\nNorman Hyams\nUntitled, date unknown\nStamped on verso\nOil on canvas\n20 x 15 x 1.8 cm","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":14,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Four weeks til the opening of Norman Hyams ΠΝΕΥΜΑ PNEVMA, our summer exhibition at the ...","k":"exhibition","s":"2026-08-12","e":"2026-08-24","st":null,"et":null,"u":"hannahbarrygallery","c":"Patmos","co":"Greece","p":"https://www.instagram.com/p/Da53n4uC2qO/","x":"Four weeks til the opening of Norman Hyams ΠΝΕΥΜΑ PNEVMA, our summer exhibition at the Stavrakas Mansion, The Patmos Trust, Patmos, Greece. The exhibition will run 12-24 August 2026.\n\nNorman Hyams \nUntitled, date unknown\nStamped on verso\nMixed media on paper on correx\n31.7 x 37.7 x 0.5 cm","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-20","ld":23,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Join us on Thursday, August 13 for the @octaviaprojnyc Summer Showcase, hosted at CARA ...","k":"other","s":"2026-08-13","e":null,"st":"17:30","et":null,"u":"cara_the_org","c":"New York","co":"","p":"https://www.instagram.com/p/Dbbl5epmKyT/","x":"Join us on Thursday, August 13 for the @octaviaprojnyc Summer Showcase, hosted at CARA for the fourth year!\n\n5:30pm | Doors\n6pm | Performances Begin\n\nThe Octavia Project uses speculative fiction as a lens through which to envision new futures and greater possibilities for our world; blending creative writing, art, science, and technology, their programming increases confidence and skills in a myriad of subjects while fostering leadership and community. The organization's inspiration and namesake is Octavia E. Butler, who broke barriers in writing and science fiction to become an award-winning and internationally recognized author.\n\nInspired by Octavia E. Butler's explorations of alternate futures and commitment to social justice, the Octavia Project offers summer programs which encourage imagination and community building. Their free summer camp for middle schoolers and summer institute for high schoolers bring together young women and trans and nonbinary youth to build new worlds.\n\nWhether you're a returning guest or joining for the first time, the Summer Showcase promises to leave you encouraged, inspired, and excited for the future. Join us to engage with student projects and hear student work performed by participants from across the Octavia Project’s multiple programs.\n\nRSVP encouraged via link in bio.\n\nPhotos from Octavia Project’s 2025 Summer Showcase: Ariel Portillo","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-30","ld":14,"dl":"2026-08-13","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"KYOKO KAGAWA RARITIES: LITTLE PEACH / ANZUKKO","k":"screening","s":"2026-08-13","e":null,"st":null,"et":null,"u":"anthologyfilmarchives","c":"New York","co":"","p":"https://www.instagram.com/p/DbLwO6okZeq/","x":"KYOKO KAGAWA RARITIES: LITTLE PEACH / ANZUKKO\nAugust 13\n\nThis summer Anthology, Asia Society, and The Japan Foundation, New York, join forces for a celebration of the career of actress Kyoko Kagawa, who for the past 75 years has been one of the shining lights of Japanese cinema.\n\nSpotlighting underseen and unseen works, “Kyoko Kagawa Rarities” begins with an opening night event at Anthology, featuring an exceedingly rare 35mm screening of Mikio Naruse’s LITTLE PEACH. Chris Fujiwara has described the film as both “a masterpiece of Naruse’s elliptical and unemphatic fifties style” and “one of the harshest of Naruse’s female melodramas.” Known for her iconic roles as the little sister or the enduring daughter, in LITTLE PEACH, Kagawa lends her tenderness to the beleaguered adult role of wife to a would-be novelist in perpetual collapse. Echoing SOUND OF THE MOUNTAIN in the many walks and talks with the great So Yamamura as paternal figure, with its buoyant bike rides and painful vision of marriage as social fate, the film also gestures at a spiritual afterlife for Ozu’s LATE SPRING.\n\nFollowing this opening night event, “Kyoko Kagawa Rarities” continues uptown at Asia Society through Sunday, August 16, with screenings of FAREWELL TO THE HIGHLAND STATION (Nobuo Nakagawa, 1951), TOKYO RENDEZVOUS (Chihiro Ikeda, 2008), FIVE SISTERS (Seiji Hisamatsu, 1954), and SHOZO, A CAT AND TWO WOMEN (Shiro Toyoda, 1956), all on imported 35mm prints and featuring newly translated subtitles.\n\n“Kyoko Kagawa Rarities” is programmed by Joseph Eusebio and Akinaru Rokkaku and is a co-presentation of Asia Society, Anthology Film Archives, and The Japan Foundation, New York.\n\nSee our website for full program details.\n\nAnd see @asiasociety's website for details for August 14-16, 2026.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":20,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Asia Society presents Kyoko Kagawa Rarities, a series of five remarkable films starring...","k":"screening","s":"2026-08-13","e":"2026-08-16","st":null,"et":null,"u":"asiasociety","c":"New York","co":"","p":"https://www.instagram.com/p/DbG6EUUEmkp/","x":"Asia Society presents Kyoko Kagawa Rarities, a series of five remarkable films starring the beloved Japanese actress, in partnership with @anthologyfilmarchives, screening in New York from August 13-16, 2026.\n\nA staple of Japanese cinema’s Golden Age, Kagawa had the distinction of working with all of Japan’s “Big Four” directors and her filmography reads like a roadmap to Japanese cinema; her characters meaningful guides in its living history.\n\nComprised entirely of imported celluloid, Kyoko Kagawa Rarities highlights discovery and revelation, and looks to give fresh color to a dear and familiar face. \n\nLearn more and grab tickets at the link in our bio 🎞️ \n\nNote: The first film in this series, Mikio Naruse’s Little Peach (Anzukko), will screen at Anthology Film Archives on August 13, 2026. \n\nGuest curated by Joseph Eusebio (@jsphsb) and Akinaru Rokkaku.\n\nProgrammed with support from the Japan Foundation, New York (@jf_newyork).","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-22","ld":22,"dl":"2026-08-16","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"PREPARATORY COURSE - EXTENTED DEADLINE 13 AUGUST","k":"exhibition","s":"2026-08-13","e":null,"st":null,"et":null,"u":"rietveldacademie","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DasuGl9j-8C/","x":"PREPARATORY COURSE - EXTENTED DEADLINE 13 AUGUST\n\nThese 3 graduates all started as preparatory students and there are still some spots left for the upcoming programme! \n\nThe Preparatory Course offers an intensive 25-week programme for young makers looking to develop their artistic practice and portfolio before applying to the academy, or for those who are curious about what studying at the Rietveld would be like.\n\nParticipants work on a wide range of assignments in art and design during three to four half-day classes each week. Throughout the course, you develop your portfolio and experiment with different approaches that can help you prepare for admission to the Basicyear – the first year of the Bachelor programme.\n\n📌 Open to applicants aged 17–25\n📌 Application deadline: 13 August 2026\n📌 More information via the link in bio\n\n--\nPhotos:\n1. Charlotte Dijkgraaf (@charlottedijkgraaf), Fine Arts\n2. Karina Kalantajevska (@kkalantajevska), designLAB\n3. Jorge Herrero Alberquilla (@loc0.xti), Graphic Design","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-12","ld":32,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"[LAUNCH PARTY] Join House House Magazine at Night Club \"101\" (101 Avenue A, NYC) on Fri...","k":"exhibition","s":"2026-08-14","e":null,"st":"19:30","et":null,"u":"househousemagazine","c":"New York","co":"","p":"https://www.instagram.com/p/DbGJQe5x27z/","x":"[LAUNCH PARTY] Join House House Magazine at Night Club \"101\" (101 Avenue A, NYC) on Friday, August 14 for the readings and party to celebrate the release of our forthcoming issue No. 3.\n\n100 FREE MAGAZINE COPIES, FIRST COME FIRST SERVED.\nFriday, August 14\n7:30 PM - Doors\n7:30-8:30 - Readings\n8:30-11:00 - Jazz alongside cocktail hours and party\nNight Club \"101\"\n101 Avenue A, New York, NY 10009\n-\nFeaturing readings by:\nJack Halberstam\nGrace Byron\nGeoffrey Nutter\nLaura Kolbe\n-\nCompletely free, open to everyone.","r":false,"b":"limited","af":true,"so":false,"pd":"2026-07-22","ld":23,"dl":"2026-07-22","ds":"capacity","ap":false,"rel":false,"q":false},{"now":false,"t":"Katažyna Jankovska (@kat.jankovska) yra „Rupert“ 2026 m. kuratorystės programos „Abipus...","k":"exhibition","s":"2026-08-14","e":null,"st":null,"et":null,"u":"rupert.vilnius","c":"Rotterdam","co":"","p":"https://www.instagram.com/p/DbU4l2jDmYU/","x":"Katažyna Jankovska (@kat.jankovska) yra „Rupert“ 2026 m. kuratorystės programos „Abipusės empatijos“ tyrėja, programoje bendradarbiaujanti su menininkais Maithu Bùi ir Saule Suleimenova. Programos metu ji kartu su menininkais Maithu Bùi ir Saule Suleimenova kuria kuratorinį tyrimą, kuriame nagrinėja, kaip menas gali atverti naujus požiūrius į kolektyvinę atmintį, smurto istorijas ir jų materialius pėdsakus. Šio tyrimo rezultatai bus pristatyti baigiamojoje viešoje programoje, kuri atsidarys rugpjūčio 14 d.\n\nKatažyna Jankovska – kuratorė, rašytoja ir tyrėja, gyvenanti tarp Roterdamo ir Vilniaus. Savo veikloje ji tyrinėja nuolat kintančius žmonių, technologijų, gamtinių sistemų ir infrastruktūrų santykius, ypatingą dėmesį skirdama eksperimentinėms meninėms praktikoms, nagrinėjančioms juslinį suvokimą, skaitmeninę kultūrą ir technologijų įtaką šiuolaikinei visuomenei. Ji yra leidinių If a Tree Falls in a Forest (2023) ir Off-Grid (2026) sudarytoja. Savo praktikoje ji jungia tyrimus, kuratorystę, rašymą, leidybą ir viešųjų programų kūrimą.\n\nEN\n\nKatažyna Jankovska (@kat.jankovska) is the Curatorial Fellow for Rupert’s 2026 Mutual Empathies programme, where she works alongside artists Maithu Bùi and Saule Suleimenova. Through the programme, she develops curatorial research in dialogue with the artists, exploring how contemporary artistic practices rethink collective memory, histories of violence, and their material traces, leading to the final public presentation opening on 14 August.\n\nKatažyna Jankovska is a curator, writer, and researcher based between Rotterdam and Vilnius. Her work explores the ever-evolving relationships between humans, technologies, natural systems, and infrastructures. She is particularly interested in experimental artistic practices that engage with sensory perception, digital culture, and the influence of technology on contemporary society. She is the editor of If a Tree Falls in a Forest (2023) and Off-Grid (2026). Her practice brings togethe
