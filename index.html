bers of Exterra XX – Künstlerinnengruppe Erfurt, Gabriele Stötzer was also a participating in the 13th Berlin Biennale last year. For more than five decades, she has been exploring themes such as justice, self-determination, and gender, and has been one of the most important critical voices in the art world of the GDR.\n\nAt the Berlin Biennale some of the performance-based fashion objects were presented that are now part of the exhibition at Gropius Bau. At runway shows, designs based on the artists’ dreams and traumas were presented to a public of supporters, fellow artists, and creatives from Erfurt’s largely underground scene.\n\nThe solo exhibition, curated by Julia Grosse, highlights the diversity of Stötzer’s œuvre – encompassing painting, literature, photography, textile art, Super 8 film, performance, and public interventions.\n\nGabriele Stötzer: Dabei sein und nicht schweigen\n19.6.–6.12.2026\n@gropiusbau\n\nCredits in den Kommentaren / in the comments","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-02","ld":157,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Princeton Arts Fellowship & Hodder Fellowship 2027-2028","k":"performance","s":"2026-12-07","e":null,"st":"23:59","et":null,"u":"opencallpalette","c":"","co":"USA","p":"https://www.instagram.com/p/DbmicgIjLH8/","x":"Princeton Arts Fellowship & Hodder Fellowship 2027-2028\nPrinceton University, USA · $93,000/year · International · Free to apply\n\nTwo fellowships:\n\n1️⃣Princeton Arts Fellowship\n24 months (2 academic years) · $93,000/year + $5,000 research + $2,000 classroom expenses annually\nTeaching required: 1 course/semester (or equivalent artistic project with students)\nFor: early career composers, conductors, choreographers, playwrights, designers, directors, performance artists\nOpen this cycle: Dance, Theater and Music Theater, Music - ❌ Visual Arts not included this cycle\n\n2️⃣Hodder Fellowship\n10 months (1 academic year) · $93,000 + $5,000 research funding\nNo teaching required\nFor: artists and writers of exceptional promise pursuing independent projects - “studious leisure” for significant new work\nOpen this cycle: Dance, Theater and Music Theater, Visual Arts, Music\n🎨 This cycle, Visual Arts applicants may only apply to the Hodder Fellowship\n\nWho it’s for:\nNon-US citizens welcome · no age limit\n❌ Princeton PhD holders and cross-fellowship past recipients not eligible\n⚠️ No concurrent teaching elsewhere · work authorization required, no H-1B sponsorship\n⚠️ Hodder: max 2 lifetime applications (pre-2026 submissions don’t count)\nCan apply to both in same cycle\n\nTo apply:\nArts: CV + reference contact + 750-word proposal\nHodder: resume + 500-word proposal - no references required\nWork samples via Interfolio · all materials in English\n\n💡 Palette’s take: Two distinct fellowships from Princeton’s Lewis Center for the Arts, funded partly by the Andrew W. Mellon Foundation. The Arts Fellowship trades a light teaching load for two years of stability; the Hodder is purely for independent work with no teaching obligation. Finalists for the Arts Fellowship attend an in-person interview on campus during the week of December 7, 2026\n\nFellowship period: 2027-2029 (Arts) · 2027-2028 (Hodder)\nResults: spring semester 2027\n⏰ Deadline: September 8, 2026 · 11:59 PM EDT\n\n🔗 arts.princeton.edu/fellowships\n\n#palette_fellowship #palette_funded #palette_usa #palette_performingarts #palette_established","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-04","ld":125,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Our constellation of museums is growing! Guggenheim Abu Dhabi opens December 11, 2026.","k":"exhibition","s":"2026-12-11","e":null,"st":null,"et":null,"u":"guggenheim","c":"New York","co":"","p":"https://www.instagram.com/p/DbVUoGpHF9S/","x":"Our constellation of museums is growing! Guggenheim Abu Dhabi opens December 11, 2026. \n\nGuggenheim Abu Dhabi (@guggenheimabudhabi) will deepen intercultural understanding, expand perspectives, and offer new ways to engage with the art of our time. Its collection spans art from the 1960s to the present, bringing together works from every continent — uniquely local and global, rooted in the region and in dialogue with the world.\n\nLocated in the Saadiyat Cultural District (@saadiyatculturaldistrict), the museum designed by Frank Gehry spans 30 galleries connected by a central atrium and ten sculptural cones that articulate the building’s dynamic skyline, and expands into outdoor exhibition areas.\n\nFrom New York to Venice, Bilbao, and now Abu Dhabi — four distinct museums, one constellation.\n\n#GuggenheimAbuDhabi \n\nImages: Courtesy of Guggenheim Abu Dhabi.\n\nتتوسع كوكبة متاحفنا! يفتتح متحف جوجنهايم أبوظبي أبوابه في 11 ديسمبر 2026.\nيسهم متحف جوجنهايم أبوظبي (@guggenheimabudhabi) في تعميق التفاهم بين الثقافات، وتوسيع الآفاق، وتقديم سبل جديدة للتفاعل مع فنون عصرنا. وتضم مجموعة المتحف أعمالًا فنية من ستينيات القرن الماضي وحتى الوقت الحاضر، تجمع أعمالًا من جميع قارات العالم، في رؤية تجمع بصورة فريدة بين المحلي والعالمي، وتتجذر في المنطقة وتتحاور مع العالم.\nيقع المتحف في المنطقة الثقافية في السعديات (@saadiyatculturaldistrict)، وقد صممه فرانك جيري ليضم 30 صالة عرض تتصل بردهة مركزية، إلى جانب عشرة هياكل مخروطية نحتية ترسم الملامح الديناميكية لأفق المبنى، وتمتد إلى مساحات عرض خارجية.\nمن نيويورك إلى البندقية وبلباو، والآن أبوظبي — أربعة متاحف متفردة، وكوكبة واحدة.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":136,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"We’re thrilled to welcome Dr. Valerie Hillings back to Abu Dhabi and the Guggenheim as ...","k":"exhibition","s":"2026-12-11","e":null,"st":null,"et":null,"u":"guggenheim","c":"Abu Dhabi","co":"","p":"https://www.instagram.com/p/DboJDXiGztR/","x":"We’re thrilled to welcome Dr. Valerie Hillings back to Abu Dhabi and the Guggenheim as the inaugural Director of the Guggenheim Abu Dhabi. \n \nValerie’s appointment marks a milestone as Guggenheim Abu Dhabi prepares to open in the Saadiyat Cultural District on December 11. She will lead the museum’s strategic direction and establish the institution—one that is rooted in Abu Dhabi and connected to the world, brings cultures together, inspires people, and celebrates art from the 1960s to the present. \n \nSince 2018, Valerie has served as Director of the North Carolina Museum of Art, leading a period of remarkable growth, expanded community engagement, and institutional transformation. Valerie is deeply familiar with the Guggenheim Abu Dhabi project, where she played a pivotal role from 2009-2018 by working closely with the Department of Culture and Tourism—Abu Dhabi on behalf of the Guggenheim Foundation, to help shape its collection, curatorial vision, and pre-opening development. \n \nPlease join us in congratulating Valerie and stay tuned as we gear up for the opening! \n\nImage: Justin Kase Conder, courtesy NCMA.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":129,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"\"Neel regarded imperfection not as a flaw, but as the very essence of existence. She re...","k":"exhibition","s":"2027-01-17","e":null,"st":null,"et":null,"u":"davidzwirner","c":"Porto","co":"","p":"https://www.instagram.com/p/DbyDXnqnBRu/","x":"\"Neel regarded imperfection not as a flaw, but as the very essence of existence. She rejected the artificiality of an imposed ideal of beauty, preferring to show what was real, imperfect and human.... [Her] subjects’ looks are laden with layers of history.\" —Inês Grosso (@grosso.ines)\n\nBeautifully Imperfect—an exhibition curated by Grosso celebrating the work of American painter Alice Neel—is now on view at the Serralves Museum (@fundacao_serralves) in Portugal. Learn more and plan your visit through Sunday, January 17, 2027 via the link in bio.\n—\n1/3/5: Nancy, 1968; The Family (Algis, Julie and Bailey), 1968; Alice Neel, Sam   const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
})();
// Going marks are stored by permalink, not by list position: a rebuild
// reorders and renumbers the events, so an index would silently point at a
// different show tomorrow. The permalink is the one identifier that survives.
const GOING_KEY = 'whatson-going-v1';
let store = null;
try {
  localStorage.setItem('__t', '1'); localStorage.removeItem('__t');
  store = localStorage;
} catch (e) {
  store = null;            // private browsing or storage blocked
}

function loadGoing(){
  if(!store) return new Set();
  try { return new Set(JSON.parse(store.getItem(GOING_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function saveGoing(){
  if(!store) return;
  try { store.setItem(GOING_KEY, JSON.stringify([...goingLinks])); }
  catch(e){ /* quota or blocked — marks still work for this session */ }
}

const goingLinks = loadGoing();          // permalinks
const going = {                          // index-facing view, so render() is unchanged
  has: i => goingLinks.has(EV[i] && EV[i].p),
  get size(){ return EV.filter(e => goingLinks.has(e.p)).length; },
};
function toggleGoing(i){
  const link = EV[i] && EV[i].p;
  if(!link) return;
  goingLinks.has(link) ? goingLinks.delete(link) : goingLinks.add(link);
  saveGoing();
  render(); bar();
}
let city = null, kind = null, query = '';
let view = 'month', selDay = null;
const T = new Date(TODAY+'T12:00:00');
let curY = T.getFullYear(), curM = T.getMonth();

const esc = s => String(s??'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col = k => (META[k]||META.other)[1];
const label = k => (META[k]||META.other)[0];

function dayName(iso){
  const d = new Date(iso+'T12:00:00');
  const wd = d.toLocaleDateString('en-US',{weekday:'short'});
  const md = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return {wd, md};
}
function daysOut(iso){
  return Math.round((new Date(iso+'T12:00:00') - new Date(TODAY+'T12:00:00'))/864e5);
}
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ap = h < 12 ? 'am' : 'pm';
  const hh = h % 12 === 0 ? 12 : h % 12;
  return m ? `${hh}:${String(m).padStart(2,'0')}${ap}` : `${hh}${ap}`;
}

function chipRow(el, items, active, onPick, colored){
  el.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'chip'; all.type = 'button';
  all.setAttribute('aria-pressed', String(active === null));
  all.textContent = colored ? 'All types' : 'Everywhere';
  all.onclick = () => onPick(null);
  el.appendChild(all);
  items.forEach(v => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button';
    b.setAttribute('aria-pressed', String(active === v));
    b.innerHTML = colored
      ? `<i class="dot" style="background:${col(v)}"></i>${esc(label(v))}`
      : esc(v);
    b.onclick = () => onPick(v);
    el.appendChild(b);
  });
}

function matches(e){
  // Shipped with a grace window of recently-finished events so a stale page
  // still has context; they are dropped at read time, not build time.
  if((e.e || e.s) < TODAY) return false;
  if(city && e.c !== city) return false;
  if(kind && e.k !== kind) return false;
  if(!query) return true;
  const hay = `${e.t} ${e.u} ${e.c} ${e.co} ${label(e.k)} ${e.x}`.toLowerCase();
  return query.split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}

// A single state per event decides where it appears and how it reads. Computed
// fresh each render rather than baked in at build time, so a page left open
// overnight does not still call tomorrow "today".
const SOON = 7;
// e.now is a build-time flag; recompute against the reader's clock.
function isNow(e){ return e.s <= TODAY; }
function stateOf(e){
  if(e.so) return 'gone';
  const dl = e.dl ? daysOut(e.dl) : null;
  const ends = daysOut(e.e || e.s);
  const starts = daysOut(e.s);
  if(dl !== null && dl <= SOON) return 'act';
  if(ends <= SOON && starts <= 0) return 'closing';
  if(starts > 0 && starts <= SOON) return 'opening';
  if(starts <= 0) return 'running';
  return 'later';
}
const STATE_LABEL = {act:'Act now', closing:'Last chance', opening:'Opening soon',
                     running:'Running', later:'Upcoming', gone:'Sold out'};

function cardFor(idx){
  const e = EV[idx];
  const t = [fmtTime(e.st), fmtTime(e.et)].filter(Boolean).join('\u2013');
  const place = e.c || e.co || 'Location unknown';
  const BK = {rsvp:'RSVP', tickets:'Tickets', register:'Register',
              limited:'Limited', reserve:'Reserve', doors:'Doors'};
  return `<article class="ev${going.has(idx)?' going':''}${e.af?' act':''}${e.so?' gone':''}"
      data-i="${idx}">
    <div class="line1">
      <span class="kind">${esc(label(e.k))}</span>
      ${e.b?`<span class="bk">${esc(BK[e.b]||e.b)}</span>`:''}
      ${e.so?'<span class="run">Sold out</span>':''}
      ${t?`<span class="time">${esc(t)}</span>`:''}
      ${e.e && e.e!==e.s
          ? `<span class="time">${isNow(e)?'Closes':'Until'} ${esc(dayName(e.e).md)}</span>`
          : (isNow(e)?'<span class="run">On now</span>':'')}
    </div>
    <h2 class="ttl">${esc(e.t)}</h2>
    <div class="line2"><b>@${esc(e.u)}</b><span>${esc(place)}${e.q?' ?':''}</span></div>
    <div class="cap">${esc(e.x)}</div>
    <div class="acts">
      <button class="btn go" type="button" aria-pressed="${going.has(idx)}"
        data-go="${idx}">${going.has(idx)?'Going':'Mark going'}</button>
      <a class="btn" href="${esc(e.p)}" target="_blank" rel="noopener">Open post</a>
    </div>
  </article>`;
}

const iso = (y,m,d) =>
  `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

// An event occupies every day between its start and end, the way a run of an
// exhibition actually does. `starts` is what earns a coloured dot; `runs` only
// gets a faint underline, so a month of long shows does not read as solid dots.
function onDay(day){
  const starts = [], runs = [];
  EV.forEach((e,i) => {
    if(!matches(e)) return;
    const end = e.e || e.s;
    if(e.s === day) starts.push(i);
    else if(e.s < day && day <= end) runs.push(i);
  });
  return {starts, runs};
}

function renderMonth(){
  const grid = document.getElementById('grid');
  document.getElementById('mlab').textContent =
    new Date(curY, curM, 1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const first = new Date(curY, curM, 1).getDay();
  const days = new Date(curY, curM+1, 0).getDate();
  let out = '';
  for(let i=0;i<first;i++) out += '<button class="cell pad" disabled></button>';
  for(let d=1;d<=days;d++){
    const day = iso(curY, curM, d);
    const {starts, runs} = onDay(day);
    // Starting count in ink, running count faint beneath it. Both are facts;
    // neither is a decoration standing in for one.
    const a = starts.length ? `<span class="cnt">${starts.length}</span>` : '';
    out += `<button class="cell${day===TODAY?' today':''}" data-day="${day}"
      aria-pressed="${selDay===day}"
      aria-label="${day}, ${starts.length} starting, ${runs.length} running">
      <span>${d}</span>${a}</button>`;
  }
  grid.innerHTML = out;
  const shown = EV.filter(matches).length;
  document.getElementById('sub').textContent =
    shown === EV.length ? `${EV.length} events ahead`
                        : `${shown} of ${EV.length} events match`;
  renderDayPanel();
}

function renderDayPanel(){
  const head = document.getElementById('dayhead');
  const list = document.getElementById('list');
  if(!selDay){
    head.innerHTML = '<span style="font-family:var(--sans);font-size:13px;'
      + 'font-weight:400;color:var(--muted)">Pick a day to see what&rsquo;s on.</span>';
    list.innerHTML = '';
    return;
  }
  const {starts, runs} = onDay(selDay);
  const {wd, md} = dayName(selDay);
  head.innerHTML = `${wd} ${md}<span class="c">${starts.length} starting`
    + (runs.length ? ` &middot; ${runs.length} running` : '') + '</span>';
  if(!starts.length && !runs.length){
    list.innerHTML = '<p class="empty">Nothing on this day.</p>';
    return;
  }
  let out = '';
  if(starts.length) out += starts.map(cardFor).join('');
  if(runs.length){
    out += `<div class="daybar"><span class="n">Also running</span>${runs.length}</div>`;
    out += runs.map(cardFor).join('');
  }
  list.innerHTML = out;
}

function renderBook(){
  const list = document.getElementById('list');
  // Only what is still actionable: upcoming, needs booking, not gone.
  // Sorted by when the chance disappears, soonest first. Running programmes
  // stay in — a film series that opened two days ago still has seats to book.
  const rows = EV.map((e,i) => ({e,i}))
    .filter(({e}) => e.af && !e.so && matches(e))
    .sort((a,b) => (a.e.dl || a.e.s || '').localeCompare(b.e.dl || b.e.s || '')
                   || (a.e.s||'').localeCompare(b.e.s||''));
  document.getElementById('sub').textContent =
    `${rows.length} to book \u00b7 closing soonest first`;
  document.getElementById('dayhead').innerHTML = '';
  if(!rows.length){
    list.innerHTML = '<p class="empty">Nothing waiting on a booking right now.</p>';
    return;
  }
  const band = e => {
    const d = daysOut(e.dl || e.s);
    // A limited-capacity event has its deadline set to the announcement date:
    // there is no cutoff to parse, it is gone when it is gone. So "book now"
    // rather than "today or gone", which would be wrong for one 13 days out.
    return d <= 0 ? 'Book now' : d === 1 ? 'By tomorrow'
         : d <= 3 ? 'Within 3 days' : d <= 7 ? 'This week'
         : d <= 14 ? 'Next two weeks' : 'Later';
  };
  let out = '', lastBand = '';
  rows.forEach(({e,i}) => {
    const b = band(e);
    if(b !== lastBand){
      lastBand = b;
      const urgent = ['Book now','By tomorrow','Within 3 days'].includes(b);
      out += `<div class="daybar${urgent?' soon':''}"><span class="n">${esc(b)}</span></div>`;
    }
    // A programme that has already opened is described by when it ENDS —
    // "happens today, Jul 30" is nonsense for something running since Thursday.
    let lead;
    if(isNow(e)){
      const left = daysOut(e.e || e.s);
      lead = left <= 0 ? 'Last day'
           : left === 1 ? 'Running \u2014 ends tomorrow'
           : `Running \u2014 ${left} days left`;
      lead += ` \u00b7 to ${dayName(e.e || e.s).md}`;
    } else {
      const until = daysOut(e.s);
      lead = (until <= 0 ? 'Happens today'
            : until === 1 ? 'Happens tomorrow'
            : `Happens in ${until} days`) + ` \u00b7 ${dayName(e.s).md}`;
    }
    const ago = -daysOut(e.pd);
    const announced = ago <= 0 ? 'announced today'
                    : ago === 1 ? 'announced yesterday'
                    : `announced ${ago}d ago`;
    out += cardFor(i).replace('</h2>',
      `</h2><div class="line2"><span class="lead">${esc(lead)}</span>`
      + `<span>&middot; ${esc(announced)}</span></div>`);
  });
  list.innerHTML = out;
}

function render(){
  if(view === 'book'){ renderBook(); return; }
  if(view === 'month'){ renderMonth(); return; }
  const list = document.getElementById('list');
  const shown = EV.filter(matches);
  const nNow = shown.filter(isNow).length;
  const nNext = shown.length - nNow;
  document.getElementById('sub').textContent =
    `${nNow} on now \u00b7 ${nNext} coming up` +
    (shown.length === EV.length ? '' : ` (of ${EV.length})`);
  if(!shown.length){
    list.innerHTML = '<p class="empty">Nothing matches. Try clearing a filter.</p>';
    return;
  }
  let out = '', lastDay = '', openedNow = false;
  shown.forEach((e, i) => {
    if(isNow(e) && !openedNow){
      openedNow = true;
      const n = shown.filter(isNow).length;
      out += `<div class="daybar soon"><span class="n">On now</span>${n} running</div>`;
    }
    if(!isNow(e) && e.s !== lastDay){
      lastDay = e.s;
      const {wd, md} = dayName(e.s);
      const out_ = daysOut(e.s);
      const soon = out_ <= 7 ? ' soon' : '';
      let rel = '';
      if(out_ === 0) rel = 'today';
      else if(out_ === 1) rel = 'tomorrow';
      else if(out_ > 1 && out_ <= 13) rel = `in ${out_} days`;
      out += `<div class="daybar${soon}"><span class="n">${wd} ${md}</span>${esc(rel)}</div>`;
    }
    out += cardFor(EV.indexOf(e));
  });
  list.innerHTML = out;
}

// A drag to select text ends in a click, so the naive handler collapsed the
// card the moment you tried to copy an address out of a caption. Remember where
// the press started and ignore anything that moved or left a selection behind.
let pressX = 0, pressY = 0;
document.addEventListener('pointerdown', e => { pressX = e.clientX; pressY = e.clientY; });

document.addEventListener('click', ev => {
  const go = ev.target.closest('[data-go]');
  if(go){
    toggleGoing(+go.dataset.go);
    return;
  }
  if(ev.target.closest('a.btn')) return;

  // Any text selected? The click was the end of a drag, not a tap.
  const sel = window.getSelection();
  if(sel && String(sel).length > 0) return;
  // Moved more than a few pixels? Also a drag — a tap does not travel.
  if(Math.abs(ev.clientX - pressX) > 6 || Math.abs(ev.clientY - pressY) > 6) return;
  // Never collapse when the press landed inside an already-open caption:
  // that is where the details worth copying live.
  if(ev.target.closest('.cap')) return;

  const card = ev.target.closest('.ev');
  if(card) card.classList.toggle('open');
});

function bar(){
  const b = document.getElementById('bar');
  b.classList.toggle('on', going.size > 0);
  document.getElementById('barTxt').textContent =
    `${going.size} marked going`;
}

function ics(){
  const pad = n => String(n).padStart(2,'0');
  const stamp = (d, t) => {
    const [y,m,dd] = d.split('-').map(Number);
    if(!t) return `;VALUE=DATE:${y}${pad(m)}${pad(dd)}`;
    const [h,mi] = t.split(':').map(Number);
    return `:${y}${pad(m)}${pad(dd)}T${pad(h)}${pad(mi)}00`;
  };
  const fold = s => s.replace(/[\\;,]/g, m => '\\'+m).replace(/\n/g,'\\n');
  let out = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//IG Events//EN','CALSCALE:GREGORIAN'];
  EV.map((e,i) => [e,i]).filter(([e]) => goingLinks.has(e.p)).forEach(([e,i]) => {
    out.push('BEGIN:VEVENT',
      `UID:ig-${i}-${(e.p||'').split('/').filter(Boolean).pop()||i}@local`,
      `DTSTART${stamp(e.s, e.st)}`,
      `DTEND${stamp(e.e||e.s, e.et||e.st)}`,
      `SUMMARY:${fold(e.t)}`,
      `LOCATION:${fold([e.c,e.co].filter(Boolean).join(', '))}`,
      `DESCRIPTION:${fold('@'+e.u+'\n\n'+(e.x||'').slice(0,900)+'\n\n'+(e.p||''))}`,
      `URL:${e.p||''}`,
      'END:VEVENT');
  });
  out.push('END:VCALENDAR');
  return out.join('\r\n');
}

document.getElementById('exp').onclick = () => {
  const blob = new Blob([ics()], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'events.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

document.getElementById('q').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase(); filtLabel(); render();
});

// The button has to say what is hidden behind it, or a filter left on becomes
// invisible once the panel is shut and the empty results look like a bug.
function filtLabel(){
  const btn = document.getElementById('filtBtn');
  const bits = [];
  if(city) bits.push(city);
  if(kind) bits.push(label(kind));
  if(query) bits.push(`\u201c${query}\u201d`);
  document.getElementById('filtTxt').textContent =
    bits.length ? bits.join(' \u00b7 ') : 'Filter';
  btn.classList.toggle('on', bits.length > 0);
}

document.getElementById('filtBtn').onclick = function(){
  const panel = document.getElementById('filters');
  const open = panel.hidden;
  panel.hidden = !open;
  this.setAttribute('aria-expanded', String(open));
};

function chips(){
  chipRow(document.getElementById('cityChips'), CITIES, city,
          v => { city = v; chips(); render(); }, false);
  chipRow(document.getElementById('kindChips'), KINDS, kind,
          v => { kind = v; chips(); render(); }, true);
  filtLabel();
}
function setView(v){
  view = v;
  for(const [id,name] of [['vMonth','month'],['vList','list'],['vBook','book']])
    document.getElementById(id).setAttribute('aria-pressed', String(v===name));
  document.getElementById('cal').hidden = (v !== 'month');
  render();
}
document.getElementById('vMonth').onclick = () => setView('month');
document.getElementById('vList').onclick  = () => setView('list');
document.getElementById('vBook').onclick  = () => setView('book');
document.getElementById('prev').onclick = () => {
  if(--curM < 0){ curM = 11; curY--; } renderMonth();
};
document.getElementById('next').onclick = () => {
  if(++curM > 11){ curM = 0; curY++; } renderMonth();
};
document.addEventListener('click', ev => {
  const c = ev.target.closest('[data-day]');
  if(!c) return;
  selDay = (selDay === c.dataset.day) ? null : c.dataset.day;
  renderMonth();
});

// Open on today if anything is happening, so the first screen is never blank.
if(onDay(TODAY).starts.length || onDay(TODAY).runs.length) selDay = TODAY;
chips(); setView('month'); bar();
</script>
</body>
</html>
