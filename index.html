<title>What's On — events from the accounts you follow</title>
<style>
/* ---------------------------------------------------------------------------
   Typographic system, after Experimental Jetset / Stedelijk / Cooper's New
   Public Forum. The rules it follows, so future edits do not erode it:

   1. No containers. Rules divide content; nothing is boxed, rounded or shadowed.
   2. Hierarchy comes from size, weight and position. Never from colour.
   3. One accent, used only for "this needs booking". Everything else is ink.
   4. Every mark carries information. The eleven category colours were removed
      because each event already names its kind in words — the colour restated
      the label. Grid dots became counts for the same reason: a numeral says
      "6 events", four dots said "some".
   5. Uppercase grotesque for structure, the same face for content. One family.
--------------------------------------------------------------------------- */
:root{
  --paper:#FFFFFF; --ink:#0A0A0A; --mid:#767676; --rule:#0A0A0A;
  --hair:rgba(10,10,10,.16); --accent:#E4250B; --sel:#0A0A0A; --sel-ink:#FFFFFF;
  --gut:20px;
  --grotesk:"Helvetica Neue",Helvetica,Inter,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#0A0A0A; --ink:#F2F2F2; --mid:#8A8A8A; --rule:#F2F2F2;
         --hair:rgba(242,242,242,.2); --accent:#FF5C3D;
         --sel:#F2F2F2; --sel-ink:#0A0A0A; }
}
:root[data-theme="dark"]{
  --paper:#0A0A0A; --ink:#F2F2F2; --mid:#8A8A8A; --rule:#F2F2F2;
  --hair:rgba(242,242,242,.2); --accent:#FF5C3D; --sel:#F2F2F2; --sel-ink:#0A0A0A;
}
:root[data-theme="light"]{
  --paper:#FFFFFF; --ink:#0A0A0A; --mid:#767676; --rule:#0A0A0A;
  --hair:rgba(10,10,10,.16); --accent:#E4250B; --sel:#0A0A0A; --sel-ink:#FFFFFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--grotesk);
  font-size:15px;line-height:1.25;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 0 120px}

/* ---- masthead: the name, then the count as a fact ---- */
.title{padding:22px var(--gut) 14px}
h1{margin:0;font-size:34px;line-height:.94;font-weight:700;letter-spacing:-.035em;
  text-transform:uppercase}
.sub{margin-top:8px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--mid);font-variant-numeric:tabular-nums}

/* ---- controls: type, not chrome ---- */
header{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule)}
.bar-row{display:flex;align-items:stretch;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--hair)}
.filt{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px var(--gut);
  font:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink);background:none;border:0;border-right:1px solid var(--hair);
  cursor:pointer;max-width:58%}
.filt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filt .car{color:var(--mid)}
.filt[aria-expanded="true"] .car{transform:rotate(90deg)}
.filt.on{background:var(--sel);color:var(--sel-ink)}
.filt.on .car{color:var(--sel-ink)}
.views{display:flex;margin-left:auto}
.vb{padding:10px 15px;font:inherit;font-size:11px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--mid);background:none;border:0;
  border-left:1px solid var(--hair);cursor:pointer}
.vb[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.filt:focus-visible,.vb:focus-visible,.cell:focus-visible,.btn:focus-visible,
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.panel{border-bottom:1px solid var(--hair)}
.search{width:100%;padding:13px var(--gut);font:inherit;font-size:16px;
  color:var(--ink);background:none;border:0;border-bottom:1px solid var(--hair)}
.search::placeholder{color:var(--mid)}
.chips{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;border-bottom:1px solid var(--hair)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 13px;font:inherit;font-size:11px;
  text-transform:uppercase;letter-spacing:.08em;color:var(--mid);background:none;
  border:0;border-right:1px solid var(--hair);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.chip .dot{display:none}          /* the label is the information */

/* ---- month grid: numerals, not dots ---- */
.monthnav{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--rule)}
.mlab{flex:1;padding:14px var(--gut);font-size:19px;font-weight:700;
  text-transform:uppercase;letter-spacing:-.02em}
.mb{width:52px;padding:14px 0;font:inherit;font-size:17px;color:var(--ink);
  background:none;border:0;border-left:1px solid var(--hair);cursor:pointer}
.dows{display:grid;grid-template-columns:repeat(7,1fr);
  border-bottom:1px solid var(--hair)}
.dows b{padding:7px 0;text-align:center;font-size:10px;font-weight:400;
  letter-spacing:.1em;color:var(--mid)}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{position:relative;aspect-ratio:1/.92;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:space-between;padding:6px 7px;
  font:inherit;font-size:13px;color:var(--ink);background:none;
  border:0;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
  cursor:pointer;font-variant-numeric:tabular-nums;text-align:left}
.cell:nth-child(7n){border-right:0}
.cell.pad{color:var(--mid);opacity:.3;cursor:default}
.cell.today{font-weight:700}
.cell.today::before{content:"";position:absolute;left:0;top:0;right:0;
  height:2px;background:var(--accent)}
.cell[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.cnt{font-size:11px;color:var(--mid);font-variant-numeric:tabular-nums}
.cell[aria-pressed="true"] .cnt{color:var(--sel-ink)}
.cnt.run{color:var(--mid);opacity:.6}
.pips,.pip,.run-u{display:none}   /* replaced by counts */

/* ---- section headings: a rule and a word ---- */
.daybar{display:flex;align-items:baseline;gap:10px;padding:26px var(--gut) 7px;
  border-bottom:1px solid var(--rule);background:var(--paper);
  font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mid)}
.daybar .n{font-size:17px;letter-spacing:-.02em;text-transform:uppercase;
  color:var(--ink);font-weight:700}
.daybar.soon .n{color:var(--accent)}
.dayhead{padding:22px var(--gut) 7px;border-bottom:1px solid var(--rule);
  font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:-.02em}
.dayhead .c{font-size:11px;font-weight:400;letter-spacing:.09em;color:var(--mid);
  margin-left:10px;text-transform:uppercase}

/* ---- the event row: status at left, title at right ---- */
.ev{display:grid;grid-template-columns:78px 1fr;gap:0 16px;
  padding:14px var(--gut);border-bottom:1px solid var(--hair);
  background:none;border-radius:0;box-shadow:none;position:static}
.ev::before,.ev::after{display:none}
.line1{grid-column:1;display:flex;flex-direction:column;gap:3px;
  font-size:9px;line-height:1.4;text-transform:uppercase;letter-spacing:.02em;
  color:var(--mid);font-variant-numeric:tabular-nums;
  /* Never break a word: the column is sized to hold the longest kind name
     ("PERFORMANCE") whole. Wrapping happens between items, not inside them. */
  overflow-wrap:normal;word-break:keep-all;hyphens:none;min-width:0}
.kind{color:var(--mid);font-weight:400}
.ev.act .kind{color:var(--accent)}
.bk{color:var(--accent);font-weight:700;border:0;padding:0;font-size:10px;
  letter-spacing:.08em}
.run{color:var(--mid);border:0;padding:0;font-size:10px}
.time{font-variant-numeric:tabular-nums}
.ttl{grid-column:2;margin:0;font-size:20px;line-height:1.12;font-weight:500;
  letter-spacing:-.022em;text-wrap:balance}
.line2{grid-column:2;margin-top:6px;font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--mid);display:flex;gap:12px;flex-wrap:wrap}
.line2 b{font-weight:400;color:var(--ink)}
.lead{font-variant-numeric:tabular-nums}
.ev.going{background:none}
.ev.going .ttl{text-decoration:underline;text-decoration-thickness:2px;
  text-underline-offset:4px}
.ev.gone{opacity:.42}
.cap{grid-column:2;display:none;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--hair);font-size:14px;line-height:1.45;
  letter-spacing:0;white-space:pre-wrap;word-break:break-word;color:var(--ink);
  text-transform:none}
.ev.open .cap{display:block}
.acts{grid-column:2;display:flex;gap:20px;margin-top:11px}
.btn{padding:0;font:inherit;font-size:11px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--ink);background:none;border:0;
  border-bottom:1px solid var(--ink);cursor:pointer;text-align:left;flex:0 0 auto}
.btn.go[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent);
  font-weight:700}
a.btn{text-decoration:none}

/* ---- the going bar ---- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);
  border-top:1px solid var(--rule);padding:12px var(--gut)
  calc(12px + env(safe-area-inset-bottom));display:none;gap:14px;align-items:center}
.bar.on{display:flex}
.bar span{font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--mid);font-variant-numeric:tabular-nums}
.bar button{margin-left:auto;padding:9px 16px;font:inherit;font-size:11px;
  font-weight:700;text-transform:uppercase;letter-spacing:.09em;border:0;
  border-radius:0;background:var(--accent);color:#fff;cursor:pointer}
.empty{padding:60px var(--gut);color:var(--mid);font-size:12px;
  text-transform:uppercase;letter-spacing:.09em}
.note{padding:22px var(--gut);border-top:1px solid var(--rule);font-size:11px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--mid);line-height:1.7}

@media (max-width:430px){
  :root{ --gut:13px; }
  h1{font-size:27px}
  .ev{grid-template-columns:74px 1fr;gap:0 11px;padding:12px var(--gut)}
  .ttl{font-size:17px}
  .cell{aspect-ratio:1/1;padding:5px}
  .vb{padding:10px 11px}
}
@media (prefers-reduced-motion:no-preference){
  .filt .car{transition:transform .12s ease}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="title">
    <h1>What&rsquo;s On</h1>
    <div class="sub" id="sub">402 events ahead</div>
  </div>
  <header>
    <div class="bar-row">
      <button class="filt" id="filtBtn" type="button" aria-expanded="false"
              aria-controls="filters">
        <span id="filtTxt">Filter</span><span class="car" aria-hidden="true">&rsaquo;</span>
      </button>
      <div class="views">
        <button class="vb" id="vMonth" type="button" aria-pressed="true">Month</button>
        <button class="vb" id="vList" type="button" aria-pressed="false">List</button>
        <button class="vb" id="vBook" type="button" aria-pressed="false">Book</button>
      </div>
    </div>
    <div class="panel" id="filters" hidden>
      <input class="search" id="q" type="search" placeholder="Search title, space, city&hellip;"
             autocomplete="off" aria-label="Search events">
      <div class="chips" id="cityChips"></div>
      <div class="chips" id="kindChips"></div>
    </div>
  </header>
  <section id="cal" hidden>
    <div class="monthnav">
      <button class="mb" id="prev" type="button" aria-label="Previous month">&lsaquo;</button>
      <span class="mlab" id="mlab"></span>
      <button class="mb" id="next" type="button" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="dows"><b>S</b><b>M</b><b>T</b><b>W</b><b>T</b><b>F</b><b>S</b></div>
    <div class="grid" id="grid"></div>
    <div class="dayhead" id="dayhead"></div>
  </section>
  <main id="list"></main>
  <p class="note">Marks are kept only while this page is open — export before you
     close it. Every event links back to the original post.</p>
</div>

<div class="bar" id="bar">
  <span id="barTxt"></span>
  <button id="exp" type="button">Export to calendar</button>
</div>

:"https://www.instagram.com/p/DbLraZXIXcj/","x":"#SuolediVento\n\nMarzia Migliora will take part in Suole di Vento, the research and educational project promoted by Teatro Koreja as part of the Teatro dei Luoghi International Festival. Her artistic practice investigates themes such as labour, memory, landscape, and the relationship between human beings and the environment, combining historical, social, and anthropological research.\n\nSuole di Vento is a platform for dialogue bringing together artists, scholars, and cultural practitioners from different disciplines to share experiences, research methodologies, and critical perspectives. Through talks, discussions, and in-depth encounters, the project encourages collective reflection on the present and on the role of artistic practices in interpreting contemporary transformations.\n\n📍Cantieri Teatrali Koreja, Lecce, Italy \n🗓️From 24 July to 26 July 2026\n\n#MarziaMigliora #liarumma #liarummagallery #teatrokoreja @marziamigliora @teatrokoreja","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"It’s the final weekend of “Demolition/Escape”: Join us this Saturday during our extende...","k":"exhibition","s":"2026-07-25","e":"2026-07-26","st":"19:00","et":null,"u":"fluentumcollection","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbI7-69DeYm/","x":"It’s the final weekend of “Demolition/Escape”: Join us this Saturday during our extended opening hours from 12 to 7 pm, or visit on Friday from 12 to 5 pm for a last opportunity to experience the singular dialogue between the works of Tina Keane, Hilary Lloyd, and James Richards.\n\nDon’t hesitate to ask our guides on-site for an introduction to the works on view by Tina Keane, Hilary Lloyd, and James Richards, or visit our website for more information. We’re looking forward to welcoming you in Berlin-Dahlem! \n\n#fluentum #fluentumcollection #tinakeane #hilarylloyd #jamesrichards @dankidner @raoulklooker @nikkkamikkka\n\nCredit: Tina Keane, Escalator (1988), restored for Demolition/Escape. Installation view at Fluentum, 2026. Photo: Stefan Korte.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":2,"dl":null,"ds":null,"ap":true,"rel":true,"q":false},{"now":true,"t":"Derrick Adams (@derrickadamsny) has created the first façade commission at the Institut...","k":"exhibition","s":"2026-07-26","e":null,"st":null,"et":null,"u":"gagosian","c":"Boston","co":"","p":"https://www.instagram.com/p/DbdqM_jRYR1/","x":"Derrick Adams (@derrickadamsny) has created the first façade commission at the Institute of Contemporary Art, Boston (@icaboston) in conjunction with his first mid-career survey “View Master”! Captured here, the monumental installation wraps the exterior of the building with Adams’s bold reimagining of the Society of Motion Picture and Television Engineers test pattern, also known as TV color bars.\n\nIn a segment that aired on “CBS Sunday Morning” on July 26, correspondent Nancy Giles (@ngilesny) speaks with the artist inside the exhibition about leaving his mark with his depictions of joyous scenes of everyday life. Head to the link in our bio to watch the conversation in full! \n__________\n#DerrickAdams #Gagosian \nDerrick Adams’s façade commission at the Institute of Contemporary Art, Boston, April 14, 2026–April 2027. Artwork © Derrick Adams Studio. Video: Alex Pickering, Pick Studios (@pick_studios), courtesy ICA/Boston","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":-5,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Today we say a fond farewell to 𝘔𝘢𝘨𝘪𝘤 𝘚𝘩𝘰𝘸, Rosamunde Bordo's captivating solo exhibiti...","k":"exhibition","s":"2026-07-26","e":null,"st":null,"et":null,"u":"western_front","c":"","co":"","p":"https://www.instagram.com/p/DbPSB2CFIk1/","x":"Today we say a fond farewell to 𝘔𝘢𝘨𝘪𝘤 𝘚𝘩𝘰𝘸, Rosamunde Bordo's captivating solo exhibition, which has filled Western Front's gallery over the past three months.\n\nBringing together new metal-cast, woodworked, glass-blown, and sewn objects alongside video, 𝘔𝘢𝘨𝘪𝘤 𝘚𝘩𝘰𝘸 invited audiences into a world of intuition, association, and transformation. Through forms that resembled clues or magical instruments, the exhibition drew connections between the detective, the magician, and the artist as kindred figures searching for meaning.\n\nIt has been a pleasure to work with Rosamunde in bringing this exhibition to life. We extend our sincere thanks to Kiel Torres, our Assistant Curator, for their invaluable support throughout the project, and to the Audain Foundation for their generous support of Western Front's exhibition and visual arts residency program.\n\nThank you to everyone who visited 𝘔𝘢𝘨𝘪𝘤 𝘚𝘩𝘰𝘸—we're excited to share what's coming next soon.\n\n@rrosa_moon \n@kielllingmesoftly \n@audainprize \n—\nImage: Rosamunde Bordo, 𝘉𝘶𝘳𝘯𝘵 𝘖𝘧𝘧𝘦𝘳𝘪𝘯𝘨 (2022-2026), bronze organic burnout casting of salt dough. Photo by @dennisha.photo","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-26","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"New York: Sunday, July 26th","k":"screening","s":"2026-07-26","e":null,"st":"19:30","et":null,"u":"earth__net","c":"New York","co":"","p":"https://www.instagram.com/p/DbQwUR7x4Mj/","x":"New York: Sunday, July 26th\nIncest Movie Night: a monthly cinema series \nVOL. 3\n\nPola X (1999) dir. Leos Carax\n\nCreated by Ada Antoinette (@lady_ada_erasmus) & Rafael Amadeo Foster (@ruffruffraff) \nHosted by Julia Cooke (@juuliacooke) & Jakob Hegewisch-Allen (@jakaflockaflame)\n\nDoors open 7pm, screening begins at 7:30pm\nEARTH, 49 Orchard St","r":false,"b":"doors","af":true,"so":false,"pd":"2026-07-26","ld":0,"dl":"2026-07-26","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"Inside many of Toshiko Takaezu’s sculptures lies a hidden soundscape.","k":"exhibition","s":"2026-07-26","e":"2026-07-26","st":null,"et":null,"u":"moca_newyork","c":"New York","co":"","p":"https://www.instagram.com/p/Da3KEFrRKir/","x":"Inside many of Toshiko Takaezu’s sculptures lies a hidden soundscape.\n\nBeginning in the 1960s, Takaezu placed small pieces of clay inside her closed ceramic forms, creating hidden rattles that only revealed themselves through touch. Describing these sounds as “sending messages,” Takaezu invited viewers to engage with the unseen interior life of her work.\n\nThis reel features “closed form etudes,” demonstrations of hidden sonic landscapes within Takaezu’s closed forms as well as the physicality required to sound them, from the exhibition’s sound guide by composer and multimedia artist Leilehua Lanzilotti (@leilehualanzilotti).\n\nInspired by Takaezu’s deep connection to Hawaiʻi, Lanzilotti’s compositions illuminate the wonder, intimacy, and sense of place embedded in the artist’s multisensory practice, encouraging viewers to experience these works beyond sight alone.\n\nMany thanks to the Toshiko Takaezu foundation (@toshikotakaezufoundation) for supporting this feature. Read it in full at moca-ny.org or the link in bio. \n\n———\nThere are 10 days left to experience Worlds Within: The Art of Toshiko Takaezu at its final tour stop, the Honolulu Museum of Art (@honolulumuseum), before the exhibition closes on July 26.\n\n———\n#toshikotakaezu #contemporaryceramics #soundscapes #ceramicsculpture #globalceramics","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Mein Polaroid Zine - Welche Farbe bist du heute? Ein Workshop mit Künstlerin @denise_ri...","k":"workshop","s":"2026-07-26","e":null,"st":"10:00","et":null,"u":"kulturrucksackdortmund","c":"Dortmund","co":"","p":"https://www.instagram.com/p/DaP3Ap8iogv/","x":"Mein Polaroid Zine - Welche Farbe bist du heute? Ein Workshop mit Künstlerin @denise_ritter_gegenort \n\n🗓️🕒 Datum & Uhrzeit\n25.07. und 26.07.2026\n10:00-15:00 Uhr\n\n⚠️ Der Kurs beginnt am Samstag, dem wir empfehlen die Teilnahme an beiden Tagen, Samstag und Sonntag!\n\nBitte bringt Verpflegung für die Mittagspause mit \n\n📍 Wo\nKünstler*innenhaus Dortmund\nSunderweg 1\n44147 Dortmund\n\n📩 Anmeldung\nDenise Ritter\nritter@gegenort.com\n0151 - 23073374\n\nGefördert durch den Kulturrucksack NRW und das Kulturbüro Dortmund\n\n#kulturellebildung #kreativindortmund #kulturrucksacknrw #kunstindortmund #kulturrucksackdortmund #jugendkultur #fotoworkshopdortmund #kulturindortmund","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-01","ld":25,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Diesen Sonntag, 26. Juli, um 16 Uhr findet unsere Sonntagsführung „Special + Guest“ statt.","k":"exhibition","s":"2026-07-26","e":null,"st":"17:30","et":null,"u":"kunsthalleosnabrueck","c":"Osnabrück","co":"","p":"https://www.instagram.com/p/DbIN3MKo6vS/","x":"Diesen Sonntag, 26. Juli, um 16 Uhr findet unsere Sonntagsführung „Special + Guest“ statt.\n\nIm Rahmen des Jahresprogramms „Raumordnung“ lädt die Kunsthalle Osnabrück zu drei Sonntagsführungen unterschiedliche Expert:innen ein, ihre jeweiligen Perspektiven auf das Jahresthema einzubringen. Für diese erste Ausgabe ist Merle Dickopp zu Gast.\n \nMerle Dickopp ist Fanbeauftragte des VfL Osnabrück @vflosnabrueck und die direkte Ansprechpartnerin für alle, die sich dem Verein verbunden fühlen. Ob als langjährige Fans oder die, die es noch werden möchten. \n\nIn der öffentlichen Führung wirft sie einen Blick auf die Austellung „Tribute to Bicce“ von Aleen Solari @xoulari , und bringt dazu ihre eigenen Geschichten und Erfahrungen aus dem Vereinsalltag mit.\n \nSonntag, 26. Juli 2026 von 16­:00 bis 17:30. Alle öffentlichen Führungen sind kostenlos, du zahlst nur den regulären Eintrittspreis. Keine Anmeldung nötig.\n \nWir freuen uns auf deinen Besuch!\n\n//\n\nThis Sunday, 26 July, at 4 pm, our Sunday Guided Tour “Special + Guest” will take place. \n\nAs part of the annual programme “Spatial Orders”, Kunsthalle Osnabrück is inviting various experts to three guided tours on Sunday to share their respective perspectives on the annual theme. Merle Dickopp will be our guest for this first edition.\n\nMerle Dickopp is the fan representative for VfL Osnabrück and the direct contact for everyone who feels connected to the club. Whether they are long-standing fans or those who would like to become one. \n\nDuring the public tour, she will take a look at the exhibition “Tribute to Bicce” by Aleen Solari, sharing her own stories and experiences from everyday club life.\n\nSunday, 26 July 2026, from 4 pm to 5:30 pm. All public guided tours are free of charge, you only pay the standard admission fee. No booking is required.\n\nWe look forward to seeing you there!\n.\n.\n.\n📸: VfL Osnabrück","r":false,"b":"reserve","af":true,"so":false,"pd":"2026-07-23","ld":3,"dl":"2026-07-26","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"We are in the final days of ‘Yvette Mayorga: Magic Grasshopper’ on view at the Museum o...","k":"exhibition","s":"2026-07-26","e":"2026-07-27","st":null,"et":null,"u":"moniquemeloche","c":"New York","co":"","p":"https://www.instagram.com/p/DbLgzOBDhl6/","x":"We are in the final days of ‘Yvette Mayorga: Magic Grasshopper’ on view at the Museum of Fine Arts St. Petersburg through Sunday, July 26! 🩷\n\n‘Magic Grasshopper’ traveled all the way from New York City with Times Square Arts to the MFA St. Pete! The installation is filled with 90’s nostalgia and is designed to metaphorical transport viewers across borders and historical eras. 🎠🎀\n\nFear not, ‘Yvette Mayorga: Goddesses of the Great Hall’ is on view through early 2027! 🤗💝🦩\n\n‘Goddesses of the Great Hall’ is an immersive installation that activates the museum’s historic 1965 entrance hall. It is the first exhibition in a brand new curatorial initiative designed to engage the MFA’s spaces through contemporary art interventions. \n\nImages 1 and 5-7by Paula MacDonald\nImages 2-4 by Jimmy Faschner\n\n@yvettemayorga \n@mfastpete","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":2,"dl":null,"ds":null,"ap":true,"rel":false,"q":false},{"now":true,"t":"Sanya Kantarovsky is a painter of faces, its boredom, confusion, mischief, dizziness, p...","k":"exhibition","s":"2026-07-27","e":null,"st":null,"et":null,"u":"spike_art_magazine","c":"Venice","co":"","p":"https://www.instagram.com/p/DbS9UVujQ6G/","x":"Sanya Kantarovsky is a painter of faces, its boredom, confusion, mischief, dizziness, pain, melancholy – and most lately, of its metamorphosis. In Spike 88 – SPIRITUALITY, Spike editor Patrick Kurth reviewed his latest solo exhibition, “Basic Failure,” at the Venice Institute of Sciences, Letters, and Arts. \n\nPrint copies are on sale in our online shop (link in bio) and select book and magazine stores around Europe.  Need to step into the Zone today? Try an e-paper >>> https://shop.spikeartmagazine.com/products/spike-epaper-issue-88-spirituality\n\n#spikeartmagazine #spirituality #painting #roadsidepicnic #stalker","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"24 PRELUDES, OP. 34: NO. 22 IN G MINOR (ADAGIO) BY FRANCESCO MUGGETTI AND YONGBIN LEE","k":"exhibition","s":"2026-07-10","e":"2026-07-28","st":null,"et":null,"u":"findart.platform","c":"Seoul","co":"","p":"https://www.instagram.com/p/DbdVRgniJ2E/","x":"24 PRELUDES, OP. 34: NO. 22 IN G MINOR (ADAGIO) BY FRANCESCO MUGGETTI AND YONGBIN LEE\n\nThe two practices do not translate one another. Muggetti’s sound does not explain Lee’s sculpture, and Lee’s sculpture does not reduce Muggetti’s sound to image. What matters is not combination, but the interval between them, where each materiality becomes more distinct.\n\nWhat is heard remains unresolved, and what is seen never fully gives itself away. What lingers between them is not a single meaning, but a condition still left open. There, silence becomes the longest lingering note.\n\n~ Full exhibition documentation is available on findartplatform.com\n\nArtists: @francescomuggetti @leeyongbin_ \nCurator: @chevv0n \n\n@studiya.gallery, Seoul, South Korea, 10 July – 28 July 2026","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":-21,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The final evening of Leap of Faith, our summer screening series takes place tomorrow, T...","k":"screening","s":"2026-07-28","e":null,"st":"20:30","et":null,"u":"efluxscreeningroom","c":"New York","co":"","p":"https://www.instagram.com/p/DbUeKDmjDh3/","x":"The final evening of Leap of Faith, our summer screening series takes place tomorrow, Tuesday, July 28, at 8:30pm.\n\n𝘈𝘧𝘵𝘦𝘳𝘭𝘪𝘧𝘦 𝘪𝘯 𝘐𝘮𝘢𝘨𝘦𝘴 brings together 𝗖𝗼𝗹𝗲𝗺𝗮𝗻 𝗖𝗼𝗹𝗹𝗶𝗻𝘀’𝘀 𝘚𝘱𝘦𝘤𝘶𝘭𝘢𝘳 𝘍𝘪𝘤𝘵𝘪𝘰𝘯 (2024) and 𝗛𝗶𝗿𝗼𝗸𝗮𝘇𝘂 𝗞𝗼𝗿𝗲-𝗲𝗱𝗮’𝘀 𝘈𝘧𝘵𝘦𝘳 𝘓𝘪𝘧𝘦 (1998). The program reflects on what remains when life gives way to images, and whether those images hold only the memory of what has vanished or some promise of what might follow.\n\n🌧️☀️: in case of rain, we will move indoors.\n\nTickets and more information: e-flux.com/events","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-28","ld":0,"dl":"2026-07-28","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"Abdulladzhan, or Dedicated to Steven Spielberg, Zulfiqor Musaqov, 1991, 89 mins","k":"screening","s":"2026-07-28","e":null,"st":"19:00","et":null,"u":"lightindustry","c":"New York","co":"","p":"https://www.instagram.com/p/DbOwMUwILaD/","x":"Abdulladzhan, or Dedicated to Steven Spielberg, Zulfiqor Musaqov, 1991, 89 mins\nIntroduced by Collin Leitch\nTuesday, July 28, 2026, 7pm\nLight Industry, 361 Stagg St, Ste 407, Brooklyn\n\nThe first film by Zulfiqor Musaqov, pioneer of post-independence cinema in Uzbekistan, Abdulladzhan, or Dedicated to Steven Spielberg is widely regarded as the first film released in the then-new Central Asian state following the break-up of the Soviet Union. Abdulladzhan is framed as a letter to the American director from an Uzbek security guard, informing him that the plot of E.T. bears an uncanny resemblance to recent events in his village. When a blond-haired alien boy crash lands on a collective farm and is taken in by a local man, who names him Abdulladzhan after his grandfather, the residents at first assume the boy is his illegitimate son by a Russian woman. Stranded without the keys to his ship, Abdulladzhan is consigned to a life of hard labor as a farmer’s son, but soon he begins to perform miracles which ease the fortunes of the kolkhozniks.\n\nMusoqov’s narrator offers musings on Soviet science fiction, like Andrei Tarkovsky’s Stalker (“I understood nothing, but I liked it”). Abdulladzhan’s own contribution to the genre features humble, home-spun special effects, but also set pieces where columns of Soviet armor and numerous air assets are deployed on location. Filming was completed in 1991, a most chaotic year in the collapsing USSR, and Abdulladzhan was first screened in Tashkent just days before the formal December 26th dissolution of the state. Events like the August Coup, or Gorbachev’s failure to secure a new union treaty feel oddly sublimated in the onscreen scrambling of jets, the procession of tanks, and the tears of the security official in Moscow pursuing Abdulladzhan, who is unable to control what is rapidly unfolding in a distant republic.\n\n- CL\n\nTickets - Pay what you can ($10 suggested donation), available at door.\n\nPlease note: seating is limited. First-come, first-served, except for members subscribed at $8/month or more, who may reserve a seat by emailing information@lightindustry.org at least two hours prior to showtime. Box office opens","r":false,"b":"limited","af":true,"so":false,"pd":"2026-07-25","ld":3,"dl":"2026-07-25","ds":"capacity","ap":false,"rel":false,"q":false},{"now":true,"t":"Monica Bonvicini's works 'Silence' (2022), 'Who Uses It Where It Comes From And How To ...","k":"exhibition","s":"2026-07-28","e":null,"st":null,"et":null,"u":"capitainpetzel","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbV0LgtDEBa/","x":"Monica Bonvicini's works 'Silence' (2022), 'Who Uses It Where It Comes From And How To Tie It' (2022), 'Black Chain Grid #4' (2020), and 'Power Joy Humor Resistance' (2021) are part of 'Power Is Fragile' at Schaudepot Sammlung Wemhöner, Herford, on view through November 1, 2027.\n\nMarking the first time the Wemhöner Collection's Viewing Depot opens to the public, 'Power Is Fragile' brings together thirteen artists exploring how power takes shape through images, symbols, social roles, political structures, and human relationships. The exhibition reveals power's many forms–alongside the vulnerabilities and fractures within seemingly stable systems.\n\nCurated by Philipp Bollmann.\n\nImages: Installation views, 'Power is Fragile', Schaudepot Sammlung Wemhöner, Herford, 2026-2027. Courtesy of Schaudepot Wemhöner. Ph: def image.\n\n#studiomonicabonvicini #powerisfragile #wemhönercollection #herford","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"𝗦𝗔𝗧, 𝗔𝗨𝗚 𝟭, Our final free outdoor screening in Ridgewood for the summer is upon us! Jo...","k":"screening","s":"2026-07-28","e":null,"st":null,"et":null,"u":"uniondocs","c":"New York","co":"","p":"https://www.instagram.com/p/DbWHK2zksqG/","x":"𝗦𝗔𝗧, 𝗔𝗨𝗚 𝟭, Our final free outdoor screening in Ridgewood for the summer is upon us! Join us under open skies at the Handball Courts opposite UNDO💫\n\nJoin us for an extra special FREE screening of 애국소녀 𝘒-𝘍𝘈𝘔𝘐𝘓𝘠 𝘈𝘍𝘍𝘈𝘐𝘙𝘚 [ @k_family_affairs ]! We’re delighted to co-present this evening with 𝗡𝗼𝗼𝗸𝘀 & 𝗖𝗿𝗮𝗻𝗻𝗶𝗲𝘀 犄角旮旯 [ @nooksncrannies_nyc ]!\n\nSet almost entirely within the filmmaker’s family living room, 애국소녀 𝘒-𝘍𝘈𝘔𝘐𝘓𝘠 𝘈𝘍𝘍𝘈𝘐𝘙𝘚 invites us into a home where political convictions, generational ideals, and personal histories collide. What unfolds is by turns funny, intimate, frustrating, and deeply moving, as filmmaker 𝗔𝗿𝘂𝗺 𝗡𝗮𝗺 남아름 [ @arum_jenny ] turns the camera toward the people closest to her while tracing her own political coming of age.\n\nMoving between the 2014 Sewol ferry disaster, the impeachment movement, #MeToo, and South Korea’s recent presidential election, the film navigates the country’s contemporary political history through the shifting dynamics of a single family. Rather than offering easy answers, it asks what it means to inherit democracy, question the values of a previous generation, and find your own place in an increasingly polarized world.\n\nRSVP at the 🔗 𝗜𝗡 𝗕𝗜𝗢!","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-28","ld":0,"dl":"2026-07-28","ds":"event start","ap":false,"rel":true,"q":false},{"now":true,"t":"TOMORROW, JUL 28, we are back with a new slate of projects for our annual 𝗦𝗨𝗠𝗠𝗘𝗥 𝗟𝗔𝗕 𝗣𝗜...","k":"exhibition","s":"2026-07-28","e":null,"st":"07:30","et":null,"u":"uniondocs","c":"New York","co":"","p":"https://www.instagram.com/p/DbTtLHjEh-D/","x":"TOMORROW, JUL 28, we are back with a new slate of projects for our annual 𝗦𝗨𝗠𝗠𝗘𝗥 𝗟𝗔𝗕 𝗣𝗜𝗧𝗖𝗛 𝗕𝗜𝗡𝗚𝗢 𝗡𝗜𝗚𝗛𝗧! This is a FREE event, 𝗥𝗦𝗩𝗣 𝗮𝘁 𝘁𝗵𝗲 🔗 𝗜𝗡 𝗕𝗜𝗢!\n\nCome through to catch a sneak peek from our brilliant Summer Doc Lab artists as they take a moment to practice their project pitches with a supportive audience.\n\nFolks often ask what exactly goes on in these labs at UNDO? Here’s your chance to find out what’s going on inside. Each artist and project was selected from an incredibly competitive pool of applicants and are coming to the program from places around the world — from China to London to Australia, Berlin, New Zealand, Italy, Marseilles and some from right here in NYC!\n\nAfter weeks of deep focus and work, we’re inviting you to meet and celebrate this wonderful group for how far they’ve come. Pitching a doc is usually a scary, competitive business, but does it have to be?\n\nTo make things extra fun, we decided to turn the tables just a little: Grab a bingo card at the bar to engage in a friendly competition with fellow audience members. We’ll see who can listen along keenly enough to circle their way to Bingo stardom and win some grand prizes!\n\nCome on out to learn about this work and get the chance for a first look at a group of documentary projects in early phases of development that span continents, histories, forms and modes of inquiry. Through personal archives, overlooked memorials, endangered ecosystems, underground networks of care, experimental music, family histories, aging bodies, and rapidly transforming urban landscapes, these filmmakers investigate the forces that shape memory, identity, health, migration, belonging and beyond!\n\nDoors open at 7:30, show starts ~8:00 with celebratory festivities to follow! 𝗥𝗦𝗩𝗣 𝗮𝘁 𝘁𝗵𝗲 🔗 𝗜𝗡 𝗕𝗜𝗢!","r":false,"b":"doors","af":true,"so":false,"pd":"2026-07-27","ld":1,"dl":"2026-07-28","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Our signature BPMF tote bags have been selling so well at SFABF—only a few are left, an...","k":"fair","s":"2026-07-26","e":"2026-07-29","st":null,"et":null,"u":"bo.p0.mofo","c":"San Francisco","co":"","p":"https://www.instagram.com/p/DbQy5qcmzFg/","x":"Our signature BPMF tote bags have been selling so well at SFABF—only a few are left, and the same goes for our publications!\n\nToday is the final day of the San Francisco Art Book Fair, so come by and say hi. We’re flying back to China tonight, so see you next year ❤️@mspfoundation @sfartbookfair \n\n#artbook #artbookfair #artbookshop #publishing #sfartbookfair","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-26","ld":0,"dl":null,"ds":null,"ap":true,"rel":true,"q":false},{"now":true,"t":"Opening on Wednesday, July 29th at Capsule","k":"exhibition","s":"2026-07-29","e":null,"st":"15:00","et":"20:00","u":"capsuleshanghai","c":"Shanghai","co":"","p":"https://www.instagram.com/p/DbIMmPypt_e/","x":"Opening on Wednesday, July 29th at Capsule\n.\nOPENING: 3-8 PM\n.\nGIGAS by Kyle Coniglio (b. 1988 in New Jersey, USA) debuts a new body of paintings and drawings set within a fictional world inhabited by monumental giants—simultaneously seductive and menacing figures that embody the consuming forces of capitalism and ideals of masculinity.\n.\n@kyleconiglio_","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"𝒕𝒆𝒋𝒊𝒆𝒏𝒅𝒐 𝒂 𝒔𝒂𝒏 𝒃𝒆𝒏𝒊𝒕𝒐-","k":"other","s":"2026-07-29","e":null,"st":"13:00","et":null,"u":"gmtc.nyc","c":"New York","co":"","p":"https://www.instagram.com/p/DbMC9KTnHp5/","x":"𝒕𝒆𝒋𝒊𝒆𝒏𝒅𝒐 𝒂 𝒔𝒂𝒏 𝒃𝒆𝒏𝒊𝒕𝒐-\n\n𝖆𝖈𝖙𝖎𝖔𝖓 3: 𝖚𝖓𝖙𝖆𝖓𝖌𝖑𝖎𝖓𝖌 & 𝖘𝖚𝖘𝖕𝖊𝖓𝖉𝖎𝖓𝖌\n\njuly 29, wednesday, 1pm-5pm \nrsvp link in bio \n\nduring san benito celebrations in cabimas, rum flies through the air as it is poured and thrown over the procession. in this action, the rum yarns and shapes formed during 𝖆𝖈𝖙𝖎𝖔𝖓 2 will be untangled and suspended throughout the gmtc space, reimagining this characteristic landscape. \n\n🫧 visitors are invited to join and participate at any point.\n\ngraphic by @binvin.hrs\nphotos by @fragmentario_","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-24","ld":5,"dl":"2026-07-29","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Michael Dumontier & Neil Farber","k":"fair","s":"2026-07-29","e":null,"st":"18:00","et":null,"u":"patelbrowngallery","c":"","co":"","p":"https://www.instagram.com/p/DbWagyHEZV5/","x":"Michael Dumontier & Neil Farber\nMountain after mountain after mountain after mountain, 2026\nacrylic on MDF\n\n˚.⛰️⋆☁️\n\nThe Aspen Art Fair opens tomorrow! \n\nJoin us at the AAF tomorrow for the opening preview day, between 11 and 6 pm at the Hotel Jerome. \n\nThe Patel Brown presentation is located in room 134. \n\nSee you soon! \n\n˚.⛰️⋆☁️˚.⛰️⋆☁️˚.⛰️⋆☁️˚.⛰️⋆☁️˚.⛰️⋆☁️˚.⛰️⋆☁️\n#AspenArtFair #PatelBrown #ContemporaryArt #CanadianArt #AspenArt","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":1,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Today’s program is part of the 82nd Whitney Biennial, curated by @marcelacguerrero and ...","k":"launch","s":"2026-07-29","e":null,"st":null,"et":null,"u":"joshuacitarella","c":"New York","co":"","p":"https://www.instagram.com/p/DbYZY32OgI6/","x":"Today’s program is part of the 82nd Whitney Biennial, curated by @marcelacguerrero and @drewmsawyer at the @whitneymuseum in New York City. Welcome to Doomscroll. My guest is David Harvey, a scholar, geographer and social theorist. He is a Distinguished Professor of Anthropology and Geography at the Graduate Center of the City University of New York. He has served on the faculty of Johns Hopkins University and held the Halford Mackinder Chair in Geography at the University of Oxford.\n\nOur conversation explores the inequality and economic crises of the 21st century. What are the defining features of this new era? What forces might intervene to correct our faltering economic systems?\n\nDavid Harvey has received the Vautrin Lud International Prize in Geography, the Anders Retzius Gold Medal of the Swedish Society for Anthropology and Geography, the Patron’s Medal of the Royal Geographical Society and many other awards. In 1998, he became a fellow of the British Academy and was elected to the American Academy of Arts and Sciences in 2007.\n\nThe full video interview is out now.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"What is your ’doel’ today? 🎯","k":"performance","s":"2026-07-29","e":null,"st":null,"et":null,"u":"differentclass.be","c":"Antwerp","co":"","p":"https://www.instagram.com/p/DbXieWAMnOC/","x":"What is your ’doel’ today? 🎯\n\nWe hit the pavement at @doelfestival to ask the real questions. From good underwear to fantastically intoxicated dancing: this is what peak festival performance looks like.\n\n📹 @boranovich 💅\n\n#DifferentClass #DoelFestival #FestivalStyle #Doel #belgianfestivalsummer","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":true},{"now":true,"t":"MANDOS又有著數俾大家🎉","k":"other","s":"2026-07-29","e":null,"st":null,"et":null,"u":"mandos.app","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbS2StfGvcw/","x":"MANDOS又有著數俾大家🎉\n\n宜家經MANDOS購買[G]RAVERS — SESSION 001 RAVE ’TIL THE GRAVE 活動，輸入”MANDOS20”優惠碼即減HKD20😍👏🏻\n\n*優惠碼有效期至7月29日星期三\n\nMANDOS has another deal for you 🎉\n\nPurchase [G]RAVERS — SESSION 001 RAVE ‘TIL THE GRAVE through MANDOS now and enter promo code “MANDOS20” for an instant HKD20 off 😍👏🏻\n\n*Promo code valid until Wednesday, July 29\n\n—\nDownload MANDOS\nPlan your nightlife route tonight 🍊\n\n#MANDOS","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This Wednesday from 6p to 8p, @richardvine1478 and I are moderating a fun & spontaneous...","k":"exhibition","s":"2026-07-29","e":null,"st":null,"et":null,"u":"x_jenny_wang","c":"","co":"","p":"https://www.instagram.com/p/DbPUmuIx1rg/","x":"📝📝\nThis Wednesday from 6p to 8p, @richardvine1478 and I are moderating a fun & spontaneous conversation at @alisanfineartsnyc. My friends, fam, and Asian art scholars & enthusiasts, we need you to join!!!!\n\n— \n\nIt’s really chill and unscripted but here’s the blurb:\n\nContemporary art often arrives trailing language behind it: press releases, wall texts, exhibition essays, and reviews. For artists working across Asia and its diasporas, this act of interpretation carries a set of questions: How much context is necessary for a work to be understood? At what point does contextualization become reduction? Who assumes the role of providing context, and what can remain unexplained?\n\nOn the occasion of Alisan Fine Arts’ 45th anniversary show, “Home and Abroad,” Richard Vine, former managing editor of Art in America, and Jenny Wang, editor-in-chief of IMPULSE Magazine, will lead an intimate roundtable discussion investigating the politics and generative possibilities of writing about Asian art in a transnational context. By reflecting on the language that surrounds contemporary Asian art, the conversation asks how writing might move beyond inherited frameworks of cultural legibility to make space for more nuanced and artist-centered ways of seeing.\n\n—\n\nThank you @danchen_afa xx","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-26","ld":3,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Tina Kim Gallery is excited to announce Pio Abad’s participation in the 2026 ArtCrush A...","k":"exhibition","s":"2026-07-21","e":"2026-07-30","st":null,"et":null,"u":"tinakimgallery","c":"Aspen","co":"","p":"https://www.instagram.com/p/DbDktAJFnOp/","x":"Tina Kim Gallery is excited to announce Pio Abad’s participation in the 2026 ArtCrush Auction at the Aspen Art Museum (@aspenartmuseum).\n\nNow open for bidding, Pio Abad’s 𝘛𝘩𝘰𝘶𝘨𝘩𝘵𝘧𝘶𝘭 𝘎𝘪𝘧𝘵𝘴 (2019) draws from Abad’s research at the Ronald Reagan Presidential Library in California. The work is a large-scale ink drawing depicting a sequined gown gifted to Nancy Reagan by Imelda Marcos when she and her husband were welcomed to the White House in 1982. Abad’s work exposes the friendship between the Reagans and the Marcoses as an alliance of political convenience driven by US military interest in the Philippines. The drawing’s intricate detail and line work recovers the object from its archival obscurity, making visible Imelda Marcos’s notoriously lavish lifestyle during her husband’s dictatorship. \n\nAvailable lots are on view at the Aspen Art Museum through July 30th. Visit the link in our bio for more information. \n\nShown here: Pio Abad, 𝘛𝘩𝘰𝘶𝘨𝘩𝘵𝘧𝘶𝘭 𝘎𝘪𝘧𝘵𝘴, 2019. Photo: Hyunjung Rhee. \n\n#artcrush2026","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"To celebrate the final weeks of \"New Humans: Memories of the Future,\" we're screening f...","k":"screening","s":"2026-07-30","e":null,"st":null,"et":null,"u":"newmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/DbbtesMDdJn/","x":"To celebrate the final weeks of \"New Humans: Memories of the Future,\" we're screening films by \"New Humans\" artists in the Museum's Forum. New Museum Videodrome is a unique opportunity to experience artwork in the architectural gem of our amphitheater in the sky designed as part of the Museum's OMA expansion!\n\nJoin us this weekend for a presentation of artist Sidsel Meineche Hansen’s “Maintenancer” (2018) and “Baby Jesus” (2023) made in collaboration with Therese Henningsen. \n\nThis experience is included with admission into the Museum. No additional RSVP is required. Plan your visit and get tickets today using the link in bio 🔗\n\n—\n📸: (1) Photo: Jason O'Rear (2-3) Sidsel Meineche Hansen & Therese Henningsen, “Maintenancer,” 2018 (still). Video, color, sound; 13:05min; Sidsel Meineche Hansen & Therese Henningsen, “Baby Jesus,” 2023 (still). Video, color, sound; 15:00min. Images courtesy the artists","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-30","ld":0,"dl":"2026-07-30","ds":"event start","ap":false,"rel":true,"q":false},{"now":true,"t":"What motivates Savannah’s most influential leaders?","k":"screening","s":"2026-07-30","e":null,"st":null,"et":null,"u":"scadmoa","c":"Savannah","co":"","p":"https://www.instagram.com/p/DbTjdkaRJ_t/","x":"What motivates Savannah’s most influential leaders?\n\nJoin us for a special screening of “Etched in History,” an original @scaddotedu film illuminating the Savannah Women of Vision.\n\n📍Thursday, July 30, 6 p.m., at Arnold Hall\n\nNarrated by acclaimed actor @phyliciarashad, the film explores the accomplishments and legacies of distinguished women and the stories behind their valor. Also represented in the commissioned portraits by Michael Porten (M.F.A., painting, 2012; B.F.A., illustration, 2004) on display in Arnold Hall, this inspiring group of vanguards continues to impact the Savannah community, SCAD, and beyond.\n\nThis event is free and open to the public. Email Andreia Wardlaw at awardlaw@scad.edu to reserve your seat.","r":false,"b":"reserve","af":true,"so":false,"pd":"2026-07-27","ld":3,"dl":"2026-07-30","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"VENICE — Adam Linder will present the Italian premiere of Drip Tekhne as part of Bienna...","k":"launch","s":"2026-07-30","e":null,"st":"21:00","et":null,"u":"hoffman.donahue","c":"Venice","co":"","p":"https://www.instagram.com/p/DbYOrVflOGu/","x":"VENICE — Adam Linder will present the Italian premiere of Drip Tekhne as part of Biennale Danza 2026, with performances on July 30 and 31 at Teatro alle Tese.\n\nCreated in close collaboration with the dancers of Dansk Danseteater, the four-part work considers how the human body becomes a technical apparatus for dance. Moving from primordial creatures to hybrid mechanical forms and, finally, a collective of thinking bodies, Drip Tekhne reflects on how physicality is shaped by digital technology while celebrating movement as an extraordinary capacity of human biology. Developed with architect Deniz Celtek, its flexible modular set continually transforms and reshapes the stage alongside the dancers.\n\nAdam Linder: Drip Tekhne\nJuly 30, 9 PM\nJuly 31, 7 PM\nTeatro alle Tese\nVenice, Italy\n\nPhotography by Jubal Battisti\n\n#AdamLinder #DripTekhne #BiennaleDanza #LaBiennaleDiVenezia @labiennale @danskdanseteater","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-29","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Thursday","k":"screening","s":"2026-07-30","e":null,"st":"07:30","et":null,"u":"juliastoschekfoundation","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbSw18hiKYV/","x":"Thursday \n\n30 July 2026 \nInternet Cinema selected by Dana Dawud\n8 p.m. (doors 7:30 p.m.)\n\nThis week, JSF presents the screening program „Internet Cinema selected by Dana Dawud.“ Bringing together new works by artists working across moving image, AI, and internet culture, the evening features films by Matt Chan (@objectivelyterrible), Linn Phyllis Seeger (@linnphyllisseeger), Benjamin Orlow (@benjaminorlow), Anna Mikkola (@anna_mikkola), Poorspigga (@poorspigga), Safiya Hawwa (@safiyahawwa), Demonlovers Inc. (@daemonlovers), Dana Dawud (@dansdansrev) and angelicism01 (@angelicism01). Linn Phyllis Seeger will be introducing the program on site. \n \nDana Dawud is an artist and writer whose work moves between cinema, the archive, sound, and the internet. Working across film, AI, and online culture, she explores memory, technology, and the changing life of images. She is the founder of “Open Secret,“ an international touring screening series for emerging and post-internet artists, and creates music as pleasure helmet and AI works as angelvapemp3. Her ongoing film project Monad unfolds as an evolving cinematic archive, changing with each presentation. Dawud’s work is interested in how images travel, mutate, and create new forms of intimacy beyond the gallery, the nation, and the institution.","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-27","ld":3,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"JSF is pleased to present the screening program „Internet Cinema selected by Dana Dawud.“","k":"screening","s":"2026-07-30","e":null,"st":"07:30","et":null,"u":"juliastoschekfoundation","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbBOu_aiDKn/","x":"JSF is pleased to present the screening program „Internet Cinema selected by Dana Dawud.“\n\n30 July 2026 \nInternet Cinema selected by Dana Dawud\n8 p.m. (doors 7:30 p.m.)\n \nBringing together new works by artists working across moving image, AI, and internet culture, the evening features films by Matt Chan (@objectivelyterrible), Linn Phyllis Seeger (@linnphyllisseeger), Benjamin Orlow (@benjaminorlow), Anna Mikkola (@anna_mikkola), Poorspigga (@poorspigga), Safiya Hawwa (@safiyahawwa), Demonlovers Inc. (@daemonlovers), Dana Dawud (@dansdansrev) and angelicism01 (@angelicism01). Linn Phyllis Seeger will be introducing the program on site.\n \nDana Dawud is an artist and writer whose work moves between cinema, the archive, sound, and the internet. Working across film, AI, and online culture, she explores memory, technology, and the changing life of images. She is the founder of “Open Secret,“ an international touring screening series for emerging and post-internet artists, and creates music as pleasure helmet and AI works as angelvapemp3. Her ongoing film project Monad unfolds as an evolving cinematic archive, changing with each presentation. Dawud’s work is interested in how images travel, mutate, and create new forms of intimacy beyond the gallery, the nation, and the institution.","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-20","ld":10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Tomorrow! Internet cineaste Dana Dawud brings her screening series “Open Secret” to Jul...","k":"screening","s":"2026-07-30","e":null,"st":"20:00","et":null,"u":"spike_art_magazine","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbXt5twjRyP/","x":"Tomorrow! Internet cineaste Dana Dawud brings her screening series “Open Secret” to Julia Stoschek Foundation Berlin at 8pm. Get briefed with her conversation with Persis Bekkering, “The Internet Is Already Cinema,” in Spike 87 – EVERYTHING’S COMPUTER – on sale in our webshop (🔗 in bio).\n\nFeaturing films by Matt Chan (@objectivelyterrible), Linn Phyllis Seeger (@linnphyllisseeger), Benjamin Orlow (@benjaminorlow), Anna Mikkola (@anna_mikkola), Poorspigga (@poorspigga), Safiya Hawwa (@safiyahawwa), Demonlovers Inc. (@daemonlovers), Dana Dawud (@dansdansrev) and angelicism01 (@angelicism01).\n\nImages\n1. Still from Safiya Hawwa, Wunsch Zwei (2), 2024\n2. Still from poorspigga, “Wait Please Don’t Skip | Love Affirmationw | Reprogram Your Mind,” 2023\n3. Still from Dana Dawud, Monad +, 2024 – \n\n#spikeartmagazine #internetcinema #everythingscomputer","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-29","ld":1,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"The MAK Center is pleased to present a book launch celebrating \"At the Edge of Where Go...","k":"reading","s":"2026-07-30","e":null,"st":"18:00","et":null,"u":"makcenter","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DaybKBNAfwy/","x":"The MAK Center is pleased to present a book launch celebrating \"At the Edge of Where God Built: Language. Concepts. Islamic Architecture.\" Join us on Thursday, July 30 at the MAK Center at the Schindler House for a conversation between Ziad Jamaleddine of L.E.FT Architects and architect and urban designer Maryam Eskandari.\n\nThe book undertakes a critical examination of L.E.FT Architects’ work from the past decade, reorganizing their designs, research, and pedagogy around five key Arabic spatial terms: mataf (circumambulation space), jami (mosque space), riwaq (a courtyard’s colonnade), dar (domestic space), and khirba (a ruin). Rooted in Arab-speaking, Islamic geographies of the Middle East and North Africa, these concepts offer a framework for understanding contemporary architecture beyond fixed typologies, revealing its fluid and multifaceted possibilities.\n\nCopies of At the Edge of Where God Built will be available for purchase during the event. For more information and to RSVP, please visit the link in our bio.\n\n@leftarchitects @ziad_jamaleddine @miim_esk @_miimdesigns\n\n---\n\nAt the Edge of Where God Built Book Launch\nMAK Center at the Schindler House\n835 N. Kings Road, West Hollywood\nJuly 30, 2026, 6:00 PM","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-14","ld":16,"dl":"2026-07-30","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"This 𝗦𝗔𝗧, 𝗔𝗨𝗚 𝟭, Our final free outdoor screening in Ridgewood for the summer is upon u...","k":"screening","s":"2026-07-30","e":null,"st":null,"et":null,"u":"uniondocs","c":"New York","co":"","p":"https://www.instagram.com/p/DbbJJCHywnF/","x":"This 𝗦𝗔𝗧, 𝗔𝗨𝗚 𝟭, Our final free outdoor screening in Ridgewood for the summer is upon us! Join us under open skies at the Handball Courts opposite UNDO💫\n\nJoin us for an extra special FREE screening of 애국소녀 𝘒-𝘍𝘈𝘔𝘐𝘓𝘠 𝘈𝘍𝘍𝘈𝘐𝘙𝘚 [ @k_family_affairs ]! We’re delighted to co-present this evening with 𝗡𝗼𝗼𝗸𝘀 & 𝗖𝗿𝗮𝗻𝗻𝗶𝗲𝘀 犄角旮旯 [ @nooksncrannies_nyc ]!\n\nSet almost entirely within the filmmaker’s family living room, 애국소녀 𝘒-𝘍𝘈𝘔𝘐𝘓𝘠 𝘈𝘍𝘍𝘈𝘐𝘙𝘚 invites us into a home where political convictions, generational ideals, and personal histories collide. What unfolds is by turns funny, intimate, frustrating, and deeply moving, as filmmaker 𝗔𝗿𝘂𝗺 𝗡𝗮𝗺 남아름 [ @arum_jenny ] turns the camera toward the people closest to her while tracing her own political coming of age.\n\nMoving between the 2014 Sewol ferry disaster, the impeachment movement, #MeToo, and South Korea’s recent presidential election, the film navigates the country’s contemporary political history through the shifting dynamics of a single family. Rather than offering easy answers, it asks what it means to inherit democracy, question the values of a previous generation, and find your own place in an increasingly polarized world.\n\nRSVP at the 🔗 𝗜𝗡 𝗕𝗜𝗢!","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-30","ld":0,"dl":"2026-07-30","ds":"event start","ap":false,"rel":true,"q":false},{"now":true,"t":"Please join us on July 30th for an evening with artists Christy Chan (@christychanart) ...","k":"screening","s":"2026-07-30","e":null,"st":null,"et":null,"u":"asiaartarchiveinamerica","c":"New York","co":"","p":"https://www.instagram.com/p/Da0f4xMGbiO/","x":"Please join us on July 30th for an evening with artists Christy Chan (@christychanart) and Amanda Phingbodhipakkiya (@alonglastname). This event will begin with a short screening of films by Chan followed by an artist talk by Phingbodhipakkiya. Afterwards, the two artists will join for a conversation moderated by Lisa Kim, Gallery Director of Ford Foundation. ⁠\n⁠\nPlease note that RSVPs are mandatory. Be sure to follow the link in our bio to secure your spot! ⁠\n⁠\nContent Warning: Films contain depictions of the Ku Klux Klan and addresses themes of white supremacy.","r":false,"b":"reserve","af":true,"so":false,"pd":"2026-07-15","ld":15,"dl":"2026-07-30","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"Meet the cast of the Commedia dell’arte…","k":"performance","s":"2026-07-30","e":null,"st":null,"et":null,"u":"aspenartmuseum","c":"Aspen","co":"","p":"https://www.instagram.com/p/Dba8Lt5jmD3/","x":"Meet the cast of the Commedia dell’arte… \n\nCommedia dell’arte is directed by Camille Henrot, with a script by Camille Henrot, Estelle Hoy, and Justine Gelfman, and original music composed and performed by Mauro Hertig and Aaron David Ross. It features set design by Adam Charlap Hyman of Charlap Hyman & Herrero in collaboration with Camille Henrot, choreography and rehearsal direction by Sigrid Lauren, costume design by Sandra Berrebi, and lighting design by Dan Stearns. The work is performed by Samori Etienne, Maya Margarita, Christina Catherine Martinez, Bobbi Salvör Menuez, Isa Spector, and Alex Tatarsky. It is curated by RoseLee Goldberg, founding Director and Chief Curator of Performa and Eliza Ryan, Curator-at-Large, Aspen Art Museum, produced by Eliza Ryan and Julia Simpson with Dria Brown, technical direction by Ryan Jenkins and Theresa Tomi Faison, and stage management by Philip Trevino along with many others...\n\nView the full schedule and learn more about how to register at airaspen.org. Commedia dell’arte’s world premiere is at the Wheeler Opera House July 30, 2026.\n\nCo-commissioned by Performa, Aspen Art Museum / Wheeler Opera House, and LYRA Art Foundation.\n\nLYRA Art Foundation acts as a catalyst to fund curatorial projects and productions, supporting artists to realize ambitious works and drive cultural change.\n\nSupport for this performance is generously provided by the Arison Arts Foundation.\n\nPresented as part of The Tisch Discovery Series, made possible through a generous gift from Steve Tisch and Jamie Tisch. \n—\nPhotos: Charlie Rubin @charlierubin","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-30","ld":0,"dl":"2026-07-30","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"The Aspen Art Fair 2026 is officially open! 🏔️🧗‍♂️","k":"fair","s":"2026-07-30","e":null,"st":"11:00","et":null,"u":"moniquemeloche","c":"Aspen","co":"United States","p":"https://www.instagram.com/p/DbbDm6AjpCJ/","x":"The Aspen Art Fair 2026 is officially open! 🏔️🧗‍♂️\n\nWe are thrilled to be in Aspen with a booth that features the works of Luke Agada, Cheryl Pope, and Brendan Fernandes, all of whom are offer distinct meditations on the body and its enduring presence throughout abstraction, surrealism, and sculptural intervention. \n\nAll with color schemes that are complimented by both the Aspen Mountains and the Hotel Jerome’s ballroom! 🌅🌄🌌\n\nJoin us at \nBooth B14\nHotel Jerome\n330 E Main St, Aspen, CO\n\nPublic Dates: \nThursday, July 30: 11 am–6 pm\nFriday, July 31: 11 am–6 pm\nSaturday, August 1: 11 am–4 pm\n\nBooth photos by Dawn Blackman","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Dear friends,","k":"screening","s":"2026-07-30","e":null,"st":"19:00","et":"22:00","u":"loomisaspace","c":"New York","co":"","p":"https://www.instagram.com/p/DbDjwSsDGbc/","x":"Dear friends, \nCome and join us for the last layer of the exhibition ‘Have you seen Amelia?’ by Tomáš Hlava. ❤️‍🔥 \n\n📍Closing reception\nThursday, 30 July, 7–10 PM\n\nHave you seen Amelia? expands on Dear Amelia, a series of letters written by Tomáš Hlava to a typeface designed by Stanley Davis in 1963. Bringing together the Turn On #2’ for Midnight Moment pres...","k":"exhibition","s":"2026-07-31","e":null,"st":"23:57","et":null,"u":"thekitchen_nyc","c":"London","co":"","p":"https://www.instagram.com/p/DbY8eOIk3iu/","x":"The Kitchen celebrates Tromarama’s new commission ‘Turn On #2’ for Midnight Moment presented by @tsqarts and @thekitchen, on view night in Times Square from 11:57pm-12:00am through this Friday, July 31.⁠\n⁠\nThis past spring, the artist collective Tromarama—comprising Febie Babyrose, Herbert Hans, and Ruddy Hatumena— and curator and critic Barbara London sat down for a conversation about the artists’ 20 year collaboration. Hosted at The Kitchen and broadcast by Montez Press Radio, the discussion explores “Upon a Machine,” the collective’s first US institutional exhibition (April 23 - June 12, 2026). ⁠\n⁠\n🔗The conversation is now available to read On Mind, link in bio ⁠\n⁠\n(Credit: 1: Photo by Walter Wlodarczyk; 2: Photo by Michael Hull. Courtesy of Times Square Arts; 3: Photo by Camille Farrah Lenain; 4: Photo by Robyn Farrell.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"À l’occasion de la Fête nationale, Edelweiss Pirates revient pour la deuxième fois au @...","k":"workshop","s":"2026-07-31","e":null,"st":"15:00","et":null,"u":"brutuslabiche","c":"Lausanne","co":"","p":"https://www.instagram.com/p/DbBuQloDFW-/","x":"FR\nÀ l’occasion de la Fête nationale, Edelweiss Pirates revient pour la deuxième fois au @circuit.lausanne .\n\nCe workshop propose de se réapproprier les symboles suisses. Les participant·e·x•s composeront une série de collages mêlant souvenirs, paysages et imaginaires. Les créations pourront intégrer des références locales, tout en laissant une place aux récits individuels et aux représentations intimes de l’appartenance.\n\nC’est également l’occasion pour l’artiste de partager sa pratique.\n\nRendez-vous le 31 juillet à 15 h @circuit.lausanne.\n\nÉvénement gratuit, places limitées. \nRéservation avant le 28 juillet 2026 par mail\ninfo.brutuslabiche@gmail.com\n\nPoster by @vnus_milo \n\nENG \nOn the occasion of the Swiss National Day, Edelweiss Pirates returns to @circuit.lausanne for a second time.\n\nThis workshop invites participants to reclaim and reinterpret Swiss symbols. Through a series of collages combining memories, landscapes, and imagined worlds, participants will create works that can incorporate local references while leaving room for personal narratives and intimate representations of belonging.\n\nIt is also an opportunity to discover the artist’s creative practice and approach.\n\nJoin us on 31 July at 3:00 PM at @circuit.lausanne.\n\nFree event, limited capacity.\nPlease reserve your spot by 28 July 2026 via email: info.brutuslabiche@gmail.com\n\nposter by @vnus_milo","r":false,"b":"limited","af":true,"so":false,"pd":"2026-07-20","ld":11,"dl":"2026-07-20","ds":"capacity","ap":false,"rel":false,"q":false},{"now":true,"t":"👁️🌀🌙Save the date—ArtCrush returns Friday, July 31, 2026","k":"exhibition","s":"2026-07-31","e":null,"st":null,"et":null,"u":"aspenartmuseum","c":"Aspen","co":"","p":"https://www.instagram.com/p/DWPIcGDkxnm/","x":"👁️🌀🌙Save the date—ArtCrush returns Friday, July 31, 2026 \n\nAt the base of Buttermilk, the Aspen Art Museum’s annual summer gala is shaped this year by Surrealism. The evening honors Adrián Villar Rojas, recipient of the 2026 Lewis Family Art Award, alongside the artist’s major solo exhibition on view at the Museum. \n\nArtCrush will feature a live auction of works by leading international artists, continuing a two-decade tradition as the Museum’s largest fundraiser in support of exhibitions and education programs. \n\nThe gala will also mark the culminating celebration of the museum’s annual AIR Festival.\n\nWith gratitude to our co-chairs:\nSarah Arison (@saraharison)\nCharlie Pohlad (@charliepohlad)\nMade possible through the generous support of @zegna.\n\nTap the link in our bio to learn more about ArtCrush.","r":false,"b":null,"af":false,"so":false,"pd":"2026-03-23","ld":130,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"AIR DAY 5","k":"other","s":"2026-07-31","e":null,"st":"12:00","et":null,"u":"aspenartmuseum","c":"Aspen","co":"","p":"https://www.instagram.com/p/DbdMrtzFbzv/","x":"AIR DAY 5\n\nRegistration is required for all events. Swipe through for today's schedule and head to the link in our bio to learn more.\n\n__\n\nEVENTS:\nMatthew Barney: Bluhm-Kaul Keynote\nMatthew Barney: ZONE DEFENSE: Old Snowmass Parallax sculpture viewing\n\n__\n\nSculpture viewing is by shuttle access only. Complimentary shuttle service will run from the Museum and Paepcke Auditorium beginning 12:00 PM.","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-31","ld":0,"dl":"2026-07-31","ds":"run closes","ap":false,"rel":true,"q":false},{"now":true,"t":"CHAPTER 9: STERLING SILVER BARBELL","k":"other","s":"2026-07-31","e":null,"st":null,"et":null,"u":"currentobsessionmag","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/Dbc5mMCDAeb/","x":"CHAPTER 9: STERLING SILVER BARBELL\n#10 UNDERWORLD ISSUE \r\nBY CURRENT OBSESSION MAGAZINE\n\n~ In the gym, a man once told me I was wearing ‘faggy’ earrings.\n\n~ writes Brendton Steele @brendton.steele in his essay, tracing metal through the queer gym lens: from the clanking of iron plates to the thick Cuban chain caught inside the mouth of a man squatting twice his body weight. \n\nThe essay considers how metal’s ability to change and shift mirrors that of the body. The writing oscillates between internal dialogue, personal observations and the up-close examination of the works of two queer artists – Nicolo Gentile @nicologentile and Marc-Aurèle Debut @marcaureledebut (an exclusive interview with Debut also features in the chapter). \n\nAs a visual counterpart, we have asked photographer Leroy Verbeet @leroyverbeet to create a sweaty and bejewelled queer gym story featuring a group of models and artists at Het Gymlokaal in Amsterdam West. \n\nThose present were asked to show up as themselves – a reflection of the breadth of character and expression that defines queer gym culture today. Each person wore jewellery by up-and-coming contemporary jewellers alongside their own – family heirlooms, keepsakes and charms.\n\nModels\nCHERRY / VEIN AGENCY @vein.agency \rMEES @mees.vanzanten / APL MODELS @aplmodelmanagement \rVINCE / LET IT GO MGMT @letitgomgmt \n\nCommunity\nYOTAM BAHAT @yotambahat \rJENTE FLEERACKERS @fleerackersjente \rJÚLIA KEMP @het_gymlokaal \rINTO NIILO @in2into \n\nStyling\nLEAH LI @myfriendleah \n\nFeatured Jewellery\nYOTAM BAHAT @yotambahat \rNHẬT-VŨ ĐẶNG @nhatvudang \rJENTE FLEERACKERS @fleerackersjente \rKAYS MASOOD @kays.mass \rHANSEL TAI @hansel_tai \rLIISBETH KIRSS @celestialvirgin \rINTO NIILO @in2into \n\nGraphic Design and Art Direction \nIEVA JAKUSA @ieshulis \n\nEditors\nVERONIKA MURÁRIKOVÁ @mura.jewelry.studio \nDOMINIKA SZMIDT @dszmidt0320 \rISABEL WANG PONTOPPIDAN @isabelwangpontoppidan \n\nSpecial Thanks\nRené Darmont and Karin De Buysere of Galerie Beyond @galeriebeyond | Leendert Sonnevelt @leendertcs | Benedikt Fischer @bennnedikt \n\nSupported by\nCreative Industries Fund NL @stimuleringsfonds","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"[SUMMER ISSUE PREVIEW] \"For me, the possibilities of personal narrative also reside in ...","k":"reading","s":"2026-07-31","e":null,"st":null,"et":null,"u":"househousemagazine","c":"New York","co":"","p":"https://www.instagram.com/p/DbdUldXDk4n/","x":"[SUMMER ISSUE PREVIEW] \"For me, the possibilities of personal narrative also reside in its multiplicity—personal narrative often gets associated with solipsism, but if you really believe in it, you're advocating for something closer to the opposite of solipsism. A reading culture in which we are constantly getting outside of ourselves by reading the stories of others.\"\n\nLeslie Jamison is an essayist and novelist based in New York City, although she is originally from Los Angeles. She is the author of two novels (The Gin Closet; The Daughters), two memoirs (The Recovering; Splinters), two essay collections (The Empathy Exams; Make It Scream, Make It Burn), and is a contributing writer at The New Yorker. Jamison is a graduate of the Yale PhD program in English, the Iowa Writers’ Workshop, and Harvard College, and is now Associate Professor of Writing at Columbia University. Her newest novel The Daughters comes out in February 2027. Read this interview on our website today without paywall.\n-\nPhoto credit: @hengzhiyanghimself","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"🎬 New films this week","k":"screening","s":"2026-07-31","e":null,"st":null,"et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/DbduWFZETwE/","x":"🎬 New films this week\n\nFrom today: Andrei Tarkovsky’s The Sacrifice returns in a newly restored 4K edition. His visionary final film, set in the hours before nuclear catastrophe, won the Grand Prix at Cannes in 1986 – the year of Tarkovsky’s death in Paris, aged 54.\n\nAlso screening: Ish by Imran Perretta. Set in Luton’s South Asian and Middle Eastern communities, this striking black-and-white drama follows two 12-year-old friends whose bond is tested after a police stop-and-search, recalling The Apu Trilogy, Kes and Ratcatcher.\n\nComing soon: Bouchra by Orian Barki and Meriem Bennani\n\n#NewReleases #NewFilms  #AndreiTarkovsky #Bouchra #Ish #TheSacrifice #Cinema #Film #ICA #London #AndreiTarkovsky","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"[G]RAVERS — SESSION 001","k":"concert","s":"2026-07-31","e":null,"st":"23:59","et":null,"u":"indulgence.852","c":"Hong Kong","co":
