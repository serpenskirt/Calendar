use’s newly renovated kitchen, featuring a special seated dinner, alongside an exclusive preview of the lighting auction. \n\nOn Saturday, September 26, join a broader community of MAK Center supporters for a cocktail reception and a curated auction of collectible lighting by leading designers. Together, we’ll celebrate the future of the Fitzpatrick-Leland House and the MAK Center’s work across our three Schindler-designed sites.\n\nGLOW UP HOST COMMITTEE\nSpencer Velasquez and Taylor Robitaille, Honorary Chairs\nBrian Butterfield\nMarc Covitz\nFrank Escher\nIlana Gafni\nBlake Greenbaum\nDaria Greenbaum\nBetsy Greenberg\nRavi GuneWardena\nRandall S. Kroszner\nTyler Dean Larson\nAndrea Lenardin Madden\nLouis Magnano\nAndy Meyers\nDavid L. Nelson\nKali Nikitas\nSteve NyBlom\nLaila Taslimi\nMehran Taslimi\nSeverine Tatangelo\n\nWith gratitude to our sponsors and partners:\n\nVisionary Partner (@fisherpaykel)\nSensorial Partner (@aesop)\n\nSound by (@cometa.sound)\nCulinary & Hospitality Partner (@stircrazy.la)\nChocolates by (@and.sons)\nBeverage Partner (@aplos.world)\nCommunications Partner (@roxiestories)\nPlants by (@thehausplant)\n\nAttendance is limited—secure your ticket for one or both nights! Visit the link in our bio to purchase tickets.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-05","ld":51,"dl":"2026-09-25","ds":"run closes","ap":false,"rel":false,"q":true},{"now":false,"t":"What if you are an artist or a maker that does not fit the traditional mould of making,...","k":"screening","s":"2026-09-26","e":null,"st":null,"et":null,"u":"estafet_denhaag","c":"The Hague","co":"","p":"https://www.instagram.com/p/DaxgnL6gCxh/","x":"What if you are an artist or a maker that does not fit the traditional mould of making, distributing and presenting?\n\nFor ESTAFET’s third edition, @wysiwygcinema invites you to reflect and discuss how we could redefine the filmmaker. For a city truly dedicated to film, it is essential that these different practices find a roof, network and community.\n\nJoin for a keynote, panel talk, a screening and a roundtable session where we discuss with you different themes that explore practice and possibilities for makers. Expect an afternoon of inspiring ideas, thought-provoking questions by you and others, and encounters with a plurality of makers and film professionals.\n\nEdition 3: Redefining the filmmaker\nDate: Saturday, September 26, 2026\nTime: 13.00 - 15.15, followed by networking drinks \nLocation: West Den Haag @westdenhaag \nProgramme & tickets: claim your spot from August 18 via www.westdenhaag.nl","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-14","ld":74,"dl":"2026-09-26","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Godzilla is coming. We'll be ready.","k":"launch","s":"2026-09-26","e":null,"st":null,"et":null,"u":"thenyff","c":"New York","co":"","p":"https://www.instagram.com/p/Dboo76CpOkH/","x":"Godzilla is coming. We'll be ready.\n\nWe're thrilled to be hosting the highly anticipated world premiere of Takashi Yamazaki’s GODZILLA MINUS ZERO as the #NYFF64 Spotlight Gala selection on Saturday, September 26 with Yamazaki and members of the cast and crew in attendance.\n\n#NYFF64 is presented in partnership with @ROLEX.\n\nLearn more: filmlinc.org/godzilla","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":53,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":false,"t":"Eine formgebende Stille, ebenso wie die künstlerische Geste, Abwesenheiten körperlich e...","k":"exhibition","s":"2026-09-27","e":null,"st":null,"et":null,"u":"hausamwaldsee","c":"Vienna","co":"","p":"https://www.instagram.com/p/DbaA00PCGUZ/","x":"Eine formgebende Stille, ebenso wie die künstlerische Geste, Abwesenheiten körperlich erfahrbar zu machen, durchziehen die Ausstellung ,Wo ich wohne‘. Der Fotograf Robert Haas dokumentierte zwischen 1937 und 1938 auf Anfrage das Inventar jüdischer Familien in Wien kurz vor deren erzwungener Emigration. Entstanden sind Wohnungsaufnahmen, in denen vor allem die Abwesenheit von Leben spürbar ist. \n\nIn ihrem Buch ,Traumaland‘ (Rowohlt, 2025) schreibt die Autorin Asal Dardan über die Fotografien: „Das Wissen, mit dem wir heute auf sie schauen, macht sie zu historischen Dokumenten der Gewalt. Doch sie halten nicht den Täterblick fest, sondern das, was den betroffenen Menschen selbst wichtig war. Sie halten fest, dass sie hier waren und sein wollten – in diesen Zimmern, in diesen Wohnungen, in dieser Nachbarschaft.“ \n\nA form-giving silence and the artistic gesture of making absences tangible permeate the exhibition ‘Wo ich wohne’. Between 1937 and 1938, the photographer Robert Haas was commissioned to document the household inventories of Jewish families in Vienna shortly before their forced emigration. The result is a series of photographs in which the absence of life is particularly palpable. \n\nIn her book ‘Traumaland’ (Rowohlt, 2025), Asal Dardan writes about the photographs: “The knowledge with which we look at them today turns them into historical documents of violence. Yet they do not capture the perpetrator’s gaze, but rather what mattered to the people affected. They record that these people were here and wanted to be here – in these rooms, in these apartments, in this neighbourhood.”\n\nRobert Haas, Wohnung Szabo, Wien, 1938. Courtesy Wien Museum \n\nWo ich wohne\n14.6 .– 27.9.2026\n#80jahrehausamwaldsee #roberthaas @ad.a.g @piamremmers\n\nZitiert nach / Quote cited and translated to English from: Asal Dardan (@asaldardan), Traumaland, Rowohlt Verlag (@rowohltverlag), 2025","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":59,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Richard Venlet has analysed in depth the architecture of Haus am Waldsee for the exhibi...","k":"screening","s":"2026-09-27","e":null,"st":null,"et":null,"u":"hausamwaldsee","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbU6ejUAmA9/","x":"Richard Venlet has analysed in depth the architecture of Haus am Waldsee for the exhibition ‘Wo ich wohne’. The result is a construction, in which the relation between the history of the place as a private residence and the local practice of exhibiting are explored. He takes the early twentieth-century architectural form of the wall-panel and presents it as a minimalist art form, loosening the reference to its bourgeois origins. The work functions as free-standing screens and room dividers that enable new configurations and ways of moving through the space.\n\nFür die Ausstellung ,Wo ich wohne‘ unterzog Richard Venlet die Architektur des Haus am Waldsee einer Tiefenanalyse. Das Ergebnis ist eine Konstruktion, in der sowohl die Geschichte des Ortes als Wohnraum als auch die lokale Praxis des Ausstellens befragt wird. Auf die architektonische Tradition der Wandpaneele des frühen 20. Jahrhunderts zurückgreifend, nutzt er diese, um sie aus ihrer bürgerlichen Verankerung zu lösen. Er strukturiert sie als reduzierte Formen, von der Wand losgelöste Paravents und Raumteiler, die neue Wegführungen und Bespielungen der Räume ermöglichen.\n\nWo ich wohne\n14.6 .– 27.9.2026\n#80jahrehausamwaldsee #richardvenlet @ad.a.g @piamremmers\n\nInstallation views / Installationsansichten, Wo ich wohne, Haus am Waldsee, 2026, photos / Fotos: Frank Sperling","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":61,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"The current exhibition in our café, Green Sanctuary (C.O.T.B) by Veit Laurent Kurz, ent...","k":"exhibition","s":"2026-09-27","e":null,"st":null,"et":null,"u":"hausamwaldsee","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbFxVtnglfX/","x":"The current exhibition in our café, Green Sanctuary (C.O.T.B) by Veit Laurent Kurz, enters into a dialogue with the history of Haus am Waldsee and its natural surroundings by bringing together observations of ecology, psychological reflection, and historical enquiry with the imagined perspective of the bee. The works propose a speculative shift in perception, inviting reflection on how environments, behaviours, and sensory worlds might appear if the human viewpoint was displaced – as seen in the hybrid, surreal forms of the ceramic water troughs and beehives in the series ‘Bee Fountain’.\n\nDie aktuelle Ausstellung in unserem Café, Green Sanctuary (C.O.T.B) von Veit Laurent Kurz, tritt in Dialog mit der Geschichte des Haus am Waldsee und seiner natürlichen Umgebung, indem sie ökologische Beobachtung, psychologische Reflexion und historische Recherche mit der imaginierten Perspektive von Bienen verwebt. Die Werke laden ein zu überlegen, wie Umgebungen, Bewegungen und sensorische Welten erscheinen könnten, wenn der menschliche Blickpunkt verschoben wird – etwa in den Keramiken der Serie ,Bee Fountain‘, die Wassertränken und Bienenstöcke zu hybriden, surrealen Formen zusammenführen.\n\nVeit Laurent Kurz. Green Sanctuary (C.O.T.B)\n14.6. – 27.9.2026\nPart of Since… / Teil von Seit…\n#80jahrehausamwaldsee @die_kette_moabit @piamremmers @cafe.imhausamwaldsee \n\nImages / Bilder: Installation views / Installationsansichten Veit Laurent Kurz. Green Sanctuary (C.O.T.B), part of Since… / Teil von Seit…, Haus am Waldsee, 2026, photos / Fotos: Robert Hamacher","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":67,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"\"From a Faraway Meadow (Desde un prado lejano)\"","k":"exhibition","s":"2026-09-27","e":null,"st":null,"et":null,"u":"lowgroundpressure","c":"Guadalajara","co":"","p":"https://www.instagram.com/p/DbctJKRF4VQ/","x":"\"From a Faraway Meadow (Desde un prado lejano)\"\nArtist: María Enríquez @maria.e.m\nCurated by: Diego González Gómez / Marco Valtierra @_iego_ @marcovaltierra\n📍Espacio Cabeza, Simón Bolívar 181, Col Americana, Lafayette, 44160 Guadalajara, Jal. @espaciocabeza\n14.05-27.09.2026\n\nRead the complete text on lowgroundpressure.blog web platform (🔗 in stories) and find the exhibition on the offseen map (@offseen_official).\n\n📸 Agustín Arce Figueroa @agusarcefigueroa, courtesy the artist and the gallery;\n\n#contemporaryart #artisttoday #lowgroundpressure #arttoday #artist","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":58,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Nigin Beck’s porcelain and glass works created especially for the exhibition ‘Wo ich wo...","k":"exhibition","s":"2026-09-27","e":null,"st":null,"et":null,"u":"hausamwaldsee","c":"Berlin","co":"","p":"https://www.instagram.com/p/Dbqan-wAoCQ/","x":"Nigin Beck’s porcelain and glass works created especially for the exhibition ‘Wo ich wohne’ – majolica pieces, lamps on the facade, balconies, and a bird bath in the garden – combine the figure of the Arabian djinn with comic-like references, thereby exploring the violent dimensions of upbringing and social discipline, as well as the lingering presence of the spirits of the former inhabitants of Haus am Waldsee.\n\nNigin Becks eigens für die Ausstellung ‚Wo ich wohne’ entstandenen Porzellan- und Glasarbeiten, Majolikas und Lampen an Fassade, Balkonen und eine Vogeltränke im Garten, vereinen die Figur des arabischen Dschinn mit comichaften Referenzen und fragen so nach der gewaltsamen Dimension von Erziehung, gesellschaftlicher Disziplinierung aber auch dem Nachleben der Geister der einstigen Bewohnung des Haus am Waldsee.\n\nWo ich wohne\n14.6. – 27.9.2026\n#80jahrehausamwaldsee\n@niginthekid @ad.a.g @piamremmers @n0s3rvice\n\nImages / Bilder: Installation views / Installationsansichten, Wo ich wohne, Haus am Waldsee, 2026. Photos / Fotos: Frank Sperling","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":53,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Martin Parr’s Small World is going to @Fotofest_Hawkes_Bay_NZ 📸 This is the first Marti...","k":"exhibition","s":"2026-09-28","e":"2026-10-22","st":null,"et":null,"u":"martinparrstudio","c":"Paris","co":"","p":"https://www.instagram.com/p/DbaDmlamcHG/","x":"Martin Parr’s Small World is going to @Fotofest_Hawkes_Bay_NZ 📸 This is the first Martin Parr exhibition in New Zealand for over 25 years, which will be on display at @CreativeArtsNapier 28 SEPT to 22 OCT 2026 / FREE ENTRY 🙌\n\nSmall World is one of Martin's longest running series, which documents tourism across the globe over a period of more than four decades 🌎\n\n“It’s incredible to be able to share the work of a photographer of Martin Parr’s calibre with our city and New Zealand. His images are thought-provoking and instantly recognisable, and we’re thrilled people will be able to experience them here in Hawke’s Bay.” - Shayne Jeffares, FOTOFEST founder\n\nThis exhibition, presented by Milford, is one of more than 60 free exhibitions taking place across Hawke’s Bay during FOTOFEST 2026, celebrating photography in galleries, public spaces and unexpected locations throughout the region.\n\nThis week we're looking at a selection of images from Small World featuring in the show 👀\n\nPhoto - Louvre, Paris, France, 2012 © Martin Parr / Magnum Photos","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":60,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Te zien t/m 28 september: Anna Moreno in het MACBA (Barcelona)","k":"exhibition","s":"2026-09-28","e":null,"st":null,"et":null,"u":"stroom_den_haag","c":"Barcelona","co":"","p":"https://www.instagram.com/p/DbasW71oQCd/","x":"Te zien t/m 28 september: Anna Moreno in het MACBA (Barcelona)\nThe Third Twist brengt Anna Moreno’s onderzoek naar tijdelijkheid, utopische architectuur en speculatieve verbeelding samen in één solotentoonstelling. Centraal staat The Terminal Beach, een roadmovie over een onvoltooide nomadische nederzetting in de Algerijnse Sahara. Met de film verbeeldt ze samen met co-regisseur Bernardo Zanotta het spanningsveld tussen koloniale erfenissen en modernistische idealen.  \n\nReageer met ‘LINK’ in de comments en ontvang het HKNL profiel van Anna Moreno direct in je inbox!\n\n[ENG]\nOn show until 28 September: Anna Moreno at MACBA (Barcelona) \nThe Third Twist brings together Anna Moreno’s exploration of temporality, utopian architecture and speculative imagination in a single solo exhibition. The central piece is The Terminal Beach, a road movie about an unfinished nomadic settlement in the Algerian Sahara. Through this film, she and co-director Bernardo Zanotta depict the tension between colonial legacies and modernist ideals. \n\nDrop “LINK” in the comments and Anna Moreno’s profile will land straight in your inbox!\n\n#StroomDenHaag #Stroom #HKNL #Haagsekunstenaars @aa_oeo @macba_barcelona","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":60,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"it’s finally time 💓 we’re taking our album to you (some of you) tickets are on sale now...","k":"other","s":"2026-09-28","e":null,"st":null,"et":null,"u":"segabodega","c":"London","co":"","p":"https://www.instagram.com/p/DaDCFTxNcQ7/","x":"it’s finally time 💓 we’re taking our album to you (some of you) tickets are on sale now come meet us as the show - tickets on @kissfacility page \n\n- 28th Sep – Warsaw, Niebo\n- 29th Sep – Berlin, HAU Theatre\n- 30th Sep – Prague, Fuchs2\n- 7th Oct – Paris, Main Room\n- 8th Oct – Amsterdam, Paradiso\n- 9th Oct – Brussels, Botanique\n- 15th Oct – Ankara, 6.45KK\n- 16th Oct – Istanbul, Salon IKSV\n- 22nd Oct – Oslo, BLÅ\n- 23rd Oct – Copenhagen, Alice\n- 2nd Nov – Porto, Mouco\n- 3rd Nov – Madrid, Sala Uni\n- 4th Nov – Barcelona, Sala Upload\n- 13th Nov – London, ICA\n- 14th Nov – Manchester, The Abbey\n- 15th Nov – Bristol, Strange Brew\n- 16th Nov – Dublin, The Grand Social","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-06-26","ld":94,"dl":"2026-09-28","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"We're pleased to present, for the se Debut 🔥 Berlin Schranz Queen NIKOLINA First-Ever Takeover】\n\nInternational underground powerhouse BLAK ROOM lands at House Studio on Oct 1 — delivering Hong Kong’s most relentless underground Hard Techno experience ⚡️\n\nHeadliner NIKOLINA: ruler of Berlin’s underground, creator of the signature “Schroove” sound, and stage destroyer at Verknipt, Face2Face, and her own All Night Long sessions. Non-stop, high-octane energy fusing Hard Techno and Neo Rave — fresh off a three-continent tour and finally touching down in Hong Kong.\n\nJoining her: Hong Kong’s finest — Athena, Jesyka, Kontomo, Telesummie.\n\nThis isn’t just a party. It’s the beginning of a new chapter.\n\nDownload MANDOS to purchase the ticket!!!❤️‍🔥","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-04","ld":58,"dl":"2026-10-01","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"𝐍𝐢𝐞𝐮𝐰𝐞 𝐬𝐞𝐧𝐢𝐨𝐫 𝐜𝐮𝐫𝐚𝐭𝐨𝐫 𝐯𝐨𝐨𝐫 𝐃𝐞 𝐏𝐨𝐧𝐭 𝐌𝐮𝐬𝐞𝐮𝐦","k":"exhibition","s":"2026-10-01","e":null,"st":null,"et":null,"u":"de_pont_museum","c":"Brussels","co":"","p":"https://www.instagram.com/p/DaCwVASo2OI/","x":"𝐍𝐢𝐞𝐮𝐰𝐞 𝐬𝐞𝐧𝐢𝐨𝐫 𝐜𝐮𝐫𝐚𝐭𝐨𝐫 𝐯𝐨𝐨𝐫 𝐃𝐞 𝐏𝐨𝐧𝐭 𝐌𝐮𝐬𝐞𝐮𝐦\n\nBas Hendrikx treedt per 1 oktober aan als nieuwe senior curator. In deze functie zal hij, in nauwe samenwerking met de toekomstige directeur en hoofdconservator Maria Schnyder, verantwoordelijk zijn voor de verdere ontwikkeling van het tentoonstellingsprogramma en de collectie van het museum.\n\n𝐌𝐚𝐫𝐢𝐚 𝐒𝐜𝐡𝐧𝐲𝐝𝐞𝐫: “Bas Hendrikx’ grote betrokkenheid bij kunstenaars sluit naadloos aan bij de 𝘢𝘳𝘵𝘪𝘴𝘵 𝘧𝘪𝘳𝘴𝘵-benadering van De Pont Museum. Hij onderscheidt zich door zijn vermogen om een uitgesproken kunstenaarsgerichte werkwijze te verbinden met een scherp gevoel voor publiek en participatie. Vertrekkend vanuit de praktijk van de kunstenaar weet hij op vanzelfsprekende wijze verbinding te leggen met uiteenlopende publieksgroepen en kunst voor hen relevant te maken. Ik kijk ernaar uit om samen met hem verder vorm te geven aan de artistieke koers van het museum.”\n\nHendrikx werkt momenteel als curator bij Kanal-Centre Pompidou in Brussel.\n\n𝐍𝐞𝐰 𝐬𝐞𝐧𝐢𝐨𝐫 𝐜𝐮𝐫𝐚𝐭𝐨𝐫 𝐟𝐨𝐫 𝐃𝐞 𝐏𝐨𝐧𝐭 𝐌𝐮𝐬𝐞𝐮𝐦\n\nBas Hendrikx will join us as senior curator on 1 October. He will be responsible for the further development of the museum’s exhibition programme and collection in close collaboration with Maria Schnyder, who will assume the position of director and chief curator on the same date. \n\n𝐌𝐚𝐫𝐢𝐚 𝐒𝐜𝐡𝐧𝐲𝐝𝐞𝐫 “Bas Hendrikx’s deep commitment to artists aligns perfectly with De Pont Museum’s artist-first approach. He stands out for his ability to combine a distinctly artist-centred way of working with a keen understanding of audiences and participation. I look forward to working with him to further develop the museum’s artistic profile.”\n\nHendrikx is currently a curator at Kanal-Centre Pompidou in Brussels.\n\nPortrait by Roos Pierson","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-29","ld":94,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"OCTOBER 2 @roulette_intermedium","k":"other","s":"2026-10-02","e":null,"st":null,"et":null,"u":"fiery_furnaces","c":"New York","co":"","p":"https://www.instagram.com/p/DbdnnyxRqR3/","x":"OCTOBER 2 @roulette_intermedium \nGuitar bass and drums show\nTickets in the bio","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-31","ld":63,"dl":"2026-10-02","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"On Friday 2 October, the long-running concert series Rewire x Korzo, organised in colla...","k":"performance","s":"2026-10-02","e":null,"st":null,"et":null,"u":"rewirefestival","c":"The Hague","co":"Netherlands","p":"https://www.instagram.com/p/DbXzxGsiJus/","x":"On Friday 2 October, the long-running concert series Rewire x Korzo, organised in collaboration with @korzotheater, presents its 25th edition at one of The Hague's most cherished performing arts venues. ⁠\n⁠\nOne of the most engaging albums released so far this year, 'Duori' is a collaborative album from Heith – artist and musician Daniele Guerrini, a co-founder of adored Italian underground label @haunter.records – and Tarawangsawelas, a duo from Bandung who reenvision a contemporary version of Tarawangsa, a form of sacred music from Sundanese West Java.⁠\n⁠\nThe illusory music of musician, home-recorder, and NTS Radio resident Dagmar Zuniga projects a ghostly picture. Zuniga joins the lineage of softly sung folk musicians building dark, mysterious worlds through very stripped back means. Awash with tape hiss, her hypnagogic folk hallucinations sound as if they emerge from some plane between this world and the next – from some place between the conscious world and what awaits in dreams.⁠\n⁠\nAfter a beautiful performance at Rewire 2026, Paris-Based Egyptian composer, writer, and singer Abdullah Miniawy returns to The Hague for Rewire x Korzo #25. Performing as part of a trio, made up of him and trombonists Robinson Khoury and Jules Boittin, Miniawy brings his multidimensional music to life, inspired by jazz elements and Egyptian soundscapes.⁠\n⁠\nRewire x Korzo #25 on Friday, 2 October presents Abdullah Miniawy Trio (@abdullahminiawyofficial), @heith___ & @tarawangsawelas, and Dagmar Zuniga (@dagmarzuni).⁠ Read more and book tickets via the 🔗 in bio.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-29","ld":65,"dl":"2026-10-02","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Last year, Rewire x Korzo brought together Brìghde Chaimbeul (@brichaimbeul), Farzané (...","k":"other","s":"2026-10-02","e":null,"st":null,"et":null,"u":"rewirefestival","c":"The Hague","co":"","p":"https://www.instagram.com/p/Dbxa7BeG6c4/","x":"Last year, Rewire x Korzo brought together Brìghde Chaimbeul (@brichaimbeul), Farzané (@phernouri), and Kara-Lis Coverdale (@k__lc) for an evening that unfolded across hypnotic drones, digital-sensory improvisations, and luminous, spectral soundscapes. Revisit the evening through @theparcifal’s photo series. This autumn, the series continues:⁠\n⁠\nRewire x Korzo #25 on Friday, 2 October presents Abdullah Miniawy Trio (@abdullahminiawyofficial), @heith___ & @tarawangsawelas, and Dagmar Zuniga (@dagmarzuni).⁠\n⁠\nRewire x Korzo #26 on Friday, 4 December presents @raulrefree & @ninodeelche, @visiblecloaks, and Diamanda Dramm 'Chimp' (@diamandalbd).⁠\n⁠\nMore info & tickets via the 🔗 in bio.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-08","ld":55,"dl":"2026-10-02","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Jungmyung Lee (NL) at REDO","k":"other","s":"2026-10-02","e":"2026-10-04","st":null,"et":null,"u":"redoprishtina","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbvCGbPiH18/","x":"Jungmyung Lee (NL) at REDO\nOctober 2–4, 2026\nPrishtina, Kosovo\n \nJungmyung Lee runs Jung-Lee Type Foundry in Amsterdam, the Netherlands. The foundry not only creates retail typefaces for everyday use but also researches how the anatomical details of letterforms influence the emotional qualities of type. Based on this research, she expands her visual practice beyond typography to encompass language. She has published a book titled Real-Time Realist (2017-present), which explores typography, design, visual art, and writing through the lens of emotion. She also teaches at the Gerrit Rietveld Academie and Werkplaats Typografie in the Netherlands.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":56,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"On view","k":"performance","s":"2026-10-03","e":null,"st":null,"et":null,"u":"projets.media","c":"Paris","co":"","p":"https://www.instagram.com/p/DbTVLB8Demo/","x":"On view \n↘ Nefeli Papadimouli, « Garden of Commons », Le Grand Café, Saint-Nazaire\n\nLe Grand Café - centre d’art contemporain d’intérêt national (@legrandcafe_saintnazaire) présente un projet de l’artiste grecque Nefeli Papadimouli (@nefeliepd), déployé sur deux sites : le centre d’art puis le Radôme, sur le toit de la base sous-marine, avec une performance commune le 3 octobre. Architecte de formation, l’artiste travaille le textile comme matériau d’espace commun, entre corps et usages, en écho au jardin en mouvement de Gilles Clément installé juste à côté. Au programme : un rideau de patrons de couture manipulables par le public (« Lignes de désir »), des façades textiles inspirées des luttes en Pays de la Loire, et la performance « Blowing the Whistle » reliant les deux expositions.\n\n•\nAs part of its 2026 program, Le Grand Café - centre d’art contemporain d’intérêt national (@legrandcafe_saintnazaire) presents a project by Greek artist Nefeli Papadimouli (@nefeliepd), unfolding across two sites: the art centre and the Radôme, on the roof of the submarine base, with a performance linking both venues on October 3. Trained as an architect, the artist works with textile as a material for common space, between bodies and uses, echoing Gilles Clément’s neighboring « jardin en mouvement. » On the program: a curtain of sewing patterns visitors can handle (« Lignes de désir »), textile facades inspired by uprisings in the Pays de la Loire, and the performance « Blowing the Whistle, » linking both exhibitions.\n\n📍 Le Grand Café, Saint-Nazaire \nOuvert dès maintenant jusqu’au 4 octobre 2026 \n\n📍 Le Radôme, Saint-Nazaire \nOuverture le 23 septembre, jusqu’au 18 octobre 2026\n\n@legrandcafe_saintnazaire\n\nImages : Vue de l’exposition au Grand Café, 2026. Courtesy Nefeli Papadimouli. Photo ©️ Fanny Trichet.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":68,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":false,"t":"Michael Craig-Martin’s first solo exhibition in Taiwan, “The Language of the Everyday,”...","k":"exhibition","s":"2026-10-03","e":null,"st":null,"et":null,"u":"gagosian","c":"London","co":"","p":"https://www.instagram.com/p/DbwDTa-ukLR/","x":"Michael Craig-Martin’s first solo exhibition in Taiwan, “The Language of the Everyday,” opens on October 3 at Kaohsiung Museum of Fine Arts (@kmfa_tw). In this new “Gagosian Quarterly” video, the artist sits down in his London studio to discuss the works featured in the show. Follow the link in our bio to watch more! \n\nThe retrospective explores the development of the artist’s visual language over the past five decades, tracing its evolution from early Conceptual art to immersive digital installations. In his work, Craig-Martin reduces the complexity of the material world to a basic graphic vocabulary, prompting philosophical reflection while challenging and redefining our habitual ways of seeing.\n__________\n#MichaelCraigMartin #GagosianQuarterly #Gagosian \nArtwork © Michael Craig-Martin; Video: Studio Fifteen (@studiofifteen_post, @emmacolours_)","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":57,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"The Invisible Collection 🗣️","k":"exhibition","s":"2026-10-03","e":"2027-01-03","st":null,"et":null,"u":"marres_maastricht","c":"Buenos Aires","co":"","p":"https://www.instagram.com/p/DbpmT_VqPTD/","x":"The Invisible Collection 🗣️\nCelina Eceiza lives and works in Buenos Aires. From October 3, 2026 through January 3, 2027, her solo exhibition Rubyfruit Jungle will be on view at Marres: immersive, tactile environment that unfolds like a pleasure garden filled with textile delights. Created in collaboration with a broad network of craftspeople, the exhibition brings together murals, drawings, garments, sculptures, and textile works into one large-scale installation. \n \nInspired by a number of works from the Limburg Biënnale 2026, she explains her ideas behind Wonne's work Lieve Moeder (translated as Dear Mother) in relation to MABA's work Nieuwe Verlangens (New Desires). The Limburg Biënnale can be seen through August 23, 2026 at Marres in Maastricht and Odapark in Venray. \n\n👀 The Invisible Collection focuses on people's stories about their favorite artwork. It is an online art collection that you cannot see but can hear. Marres harvests stories in which people of all ages and backgrounds share their art experiences.\n \n// \n\nDe Onzichtbare Collectie 🗣️\nCelina Eceiza woont en werkt in Buenos Aires. Vanaf 3 oktober 2026 t/m 3 januari 2027 is haar solotentoonstelling Rubyfruit Jungle te zien bij Marres: een meeslepende, tactiele omgeving die zich ontvouwt als een lusthof vol textiele verrassingen. In samenwerking met een breed netwerk van textielhandwerkers brengt de tentoonstelling muurschilderingen, tekeningen, kledingstukken, sculpturen en textielwerken samen tot één grote installatie.  \n\nGeïnspireerd door een aantal werken uit de Limburg Biënnale 2026, vertelt ze over haar idee bij het werk Lieve Moeder van Wonne, in relatie tot het werk Nieuwe Verlangens van MABA. De Limburg Biënnale is nog te zien tot en met 23 augustus 2026 bij Marres in Maastricht en Odapark in Venray. \n \n👀 De Onzichtbare Collectie richt zich op verhalen van mensen over hun favoriete kunstwerk. Het is een online kunstcollectie die je niet kan zien, maar wel kunt horen. Marres oogst verhalen waarin mensen van alle leeftijden en en achtergronden hun kunstervaring delen.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":59,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Das Team der Berlin Biennale hat die Manifesta 16 während der Eröffnungstage besucht. D...","k":"exhibition","s":"2026-10-04","e":null,"st":null,"et":null,"u":"berlinbiennale","c":"Berlin","co":"","p":"https://www.instagram.com/p/DaNqdFciD55/","x":"Das Team der Berlin Biennale hat die Manifesta 16 während der Eröffnungstage besucht. Die 16. Ausgabe der nomadischen europäischen Biennale findet in vier Städten im Ruhrgebiet statt. Wir möchten gerne einige Eindrücke mit euch teilen, da unsere Organisationen viele künstlerische Werte verbinden:\n\n1) ,Aus der Serie 29‘ von Małgorzata Mirga-Tas, Künstlerin der 11. Berlin Biennale\n2) Der St Bonifatius-Ferdane Satır Teegarten vorgestellt von Gürsoy Doğtaş als Hommage an den ersten Garten deutscher „Gastarbeiter*innen“ mit den Arbeiten ,You Are What You Hold‘ von Özlem Altın, Künstler der 10. Berlin Biennale, sowie ,Tea Garden‘ von Bureau Baubotanik\n3) Die aufblasbare Installation ,Kein Geläut‘ von Marina Naprushkina, Teilnehmerin der 7. Berlin Biennale\n4) Die von CaboSanRoque mit FLEXO ARQUITECTURA Kollektiv als Klanginstallation und wettbewerbsfreier Sportraum konzipierte Arbeit ,FAIL LOUDER‘\n5) Die monumentale Installation ,Möglich Unvorhersehbar‘ von Penique Productions\n\nThe Berlin Biennale team visited Manifesta 16 during the opening days. The 16th edition of the nomadic European biennial is taking place in four cities across the Ruhr Area. We’d like to share some of our impressions with you, as our organizations share many artistic values:\n\n1) ‘From the series 29’ by Małgorzata Mirga-Tas, a participating artist of the 11th Berlin Biennale\n2) The St Bonifatius – Ferdane Satır Tea Garden presented by Gürsoy Doğtaş as a tribute to the first garden created by German “guest workers“, featuring the works ‘You Are What You Hold’ by Özlem Altın, who was also part of the 10th Berlin Biennale, as well as ‘Tea Garden’ by Bureau Baubotanik\n3) The inflatable installation ‘Kein Geläut’ by Marina Naprushkina, who was part of the 7th Berlin Biennale\n4) The work ‘FAIL LOUDER’, conceived as a sound installation and non-competitive sports space by CaboSanRoque in collaboration with the FLEXO ARQUITECTURA collective\n5) The monumental installation ‘Möglich Unvorhersehbar (Possibly Unpredictable)’ by Penique Productions\n\nManifesta 16 Ruhr\n21.06–04.10.2026\n@manifestabiennial","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-30","ld":96,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"𝗢𝘂𝘁 𝗡𝗼𝘄 ✨ 𝘿𝙚𝙖𝙧 𝙈𝙖𝙯𝙞𝙚,: 𝙎𝙖𝙣𝙘𝙩𝙪𝙖𝙧𝙮, 𝙎𝙥𝙚𝙘𝙪𝙡𝙖𝙩𝙞𝙤𝙣, 𝙖𝙣𝙙 𝙎𝙠𝙮","k":"exhibition","s":"2026-10-04","e":"2026-12-27","st":null,"et":null,"u":"cara_the_org","c":"New York","co":"","p":"https://www.instagram.com/p/DaxpdwtDlRl/","x":"𝗢𝘂𝘁 𝗡𝗼𝘄 ✨ 𝘿𝙚𝙖𝙧 𝙈𝙖𝙯𝙞𝙚,: 𝙎𝙖𝙣𝙘𝙩𝙪𝙖𝙧𝙮, 𝙎𝙥𝙚𝙘𝙪𝙡𝙖𝙩𝙞𝙤𝙣, 𝙖𝙣𝙙 𝙎𝙠𝙮\n\nWe are pleased to announce the release of 𝘋𝘦𝘢𝘳 𝘔𝘢𝘻𝘪𝘦,: 𝘚𝘢𝘯𝘤𝘵𝘶𝘢𝘳𝘺, 𝘚𝘱𝘦𝘤𝘶𝘭𝘢𝘵𝘪𝘰𝘯, 𝘢𝘯𝘥 𝘚𝘬𝘺, an experimental reader that explores the legacy of artist and educator Amaza Lee Meredith (1895–1984), the first known Black queer woman to practice as an architect in the United States. Through essays, conversations, and artistic interventions, the publication situates Meredith’s life and work within broader histories of placemaking, gender, sexuality, and Black love.\n\nFeaturing previously unpublished photos, blueprints, letters, and scrapbooks from Meredith’s archives, the publication accompanies a group exhibition of the same name, which originated at the Institute for Contemporary Art at Virginia Commonwealth University (@icavcu) and traveled to the California African American Museum (@caaminla). From October 4 to December 27, 2026, it will be on view at The Church, Sag Harbor (@thechurchsagharbor)—not far from Azurest North, a community founded by Black families with instrumental contributions from Meredith and her sister Maude Terry. Both the exhibition and publication take Meredith’s expansive letter-writing practice as a conceptual framework for epistolary responses in the present.\n\n🔗 Order via link in bio. \n\nEdited with text by Amber Esseiva (@amberesseiva)\n\nForeword by Jessica Bell Brown, ICA at VCU Executive Director (@teacherbell)\n\nInterviews with AD-WO (Emanuel Admassu and Jen Wood) (@ad__wo) and Alexis Pauline Gumbs (@alexispauline)\n\nOral Histories by Joel Howard, Regenia Perry, Reverend Grady Powell, and Steve Williams\n\nContributions by Mario Gooden, Anne Spencer, Colson Whitehead, Mabel O. Wilson (@studio_and), Charisse Pearlina Weston, and Craig Wilkins\n\nDesigned by @practisetheory \n\nArtwork by Lukaza Branfman-Verissimo (@bluekaza), Abigail Lucien (@abigaillucien), Tschabalala Self (@tschabalalaself), Cauleen Smith (@cauleensmith), The Black School (Joseph Cuillier and Shani Peters) (@theblackschool), and Kapwani Kiwanga (@kapwanikiwanga)\n\nCo-published with the Institute for Contemporary Art at Virginia Commonwealth University","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":82,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"'COWARD' by @lukasdhont is the opening film of Film Fest Gent 2026! 💥","k":"opening","s":"2026-10-07","e":null,"st":null,"et":null,"u":"filmfestgent","c":"Ghent","co":"","p":"https://www.instagram.com/p/DaxAMzeDJIB/","x":"'COWARD' by @lukasdhont is the opening film of Film Fest Gent 2026! 💥\n\nOn Wednesday 7 October, Dhont will kick off Film Fest Gent for the third time. His new film follows young soldiers trying to keep up their morale in the trenches during the First World War.\n\nIt's 1917 when Pierre (Emmanuel Macchia) meets Francis (Valentin Campagne), who decides to lift the spirits of his comrades by putting together a theatre show. While the violence continues, both men try to find ways to escape the brutality of war, even if only for a moment.\n\nMake sure you don't miss the opening night and buy your tickets for 'COWARD' at VIERNULVIER on our website or via the link in bio. 📅🎞️ \n\n-----------------------------------------------------\n\n'COWARD' van Lukas Dhont is de officiële openingsfilm van Film Fest Gent 2026! 💥\n\nOp woensdag 7 oktober geeft Dhont voor de derde keer het startschot van het internationale filmfestival. Zijn nieuwste film volgt jonge soldaten die tijdens de Eerste Wereldoorlog hun moraal proberen hooghouden in de loopgraven.\n\nIn 1917 ontmoet Pierre (Emmanuel Macchia) Francis (Valentin Campagne), die met geïmproviseerde shows de moraal van de troepen probeert hoog te houden. Terwijl de oorlog onverbiddelijk voortwoedt, proberen ze allebei aan de realiteit te ontsnappen, al is het maar voor even.\n\nMis de openingsvertoning niet en koop je tickets voor 'COWARD' in VIERNULVIER op onze website of via de link in bio. 📅🎞️","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-14","ld":85,"dl":"2026-10-07","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"‘Nothing Personal’ is a solo show by Alex Margo Arden at the Nicoletta Fiorucci Foundat...","k":"exhibition","s":"2026-10-09","e":"2027-01-23","st":null,"et":null,"u":"nicolettafioruccifoundation","c":"London","co":"United Kingdom","p":"https://www.instagram.com/p/DZmqWZziiLj/","x":"‘Nothing Personal’ is a solo show by Alex Margo Arden at the Nicoletta Fiorucci Foundation in London from 9 October 2026 to 23 January 2027, curated by Vittoria de Franchis. \n\nThe presentation follows Arden’s award of the inaugural Nicoletta Fiorucci Foundation Prize at Frieze London 2025.\n\nAlex Margo Arden is an artist whose work interrogates value, authorship, and the process of historicisation. Through research-led reenactments of specific cultural artefacts, her practice exposes how images and narratives are reconstructed over time.\n\nIn ‘Nothing Personal’, Arden restages the personal property of Amy Winehouse. Installed across all rooms of the Foundation, the exhibition examines the effects of celebrity ownership and death on the circulation of everyday objects, transforming them into sites of fetishisation and speculation.\n\nThe exhibition will be accompanied by a public programme and a publication.\n\nAlex Margo Arden ‘Nothing Personal’ \n9 October 2026 - 23 January 2027\n\nNicoletta Fiorucci Foundation\n8 Chelsea Embankment \nSW3 4LE London \n\nPhoto: Eva Herzog\n\n@olddrag @nicoletta_fiorucci_london @vittoria.totale @tommounapress @friezeofficial @ginnyonfrederick @eva_herzog_","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-15","ld":116,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Calling all Mainers - applications are now live for Open Door 2026! 🍂","k":"workshop","s":"2026-10-09","e":null,"st":null,"et":null,"u":"haystack_school","c":"Deer Isle","co":"United States","p":"https://www.instagram.com/p/DbTUl7kxZtY/","x":"Calling all Mainers - applications are now live for Open Door 2026! 🍂\n\nRunning from Friday, October 9 - Monday, October 12, Open Door offers Maine residents seven incredible workshops with established artists from across the country, designed for all skill levels and backgrounds. \n\nWhether you’re a beginner or an experienced craftsperson, this is a great opportunity to learn craft at Haystack to close out our 75th season!\n\n⚒️ BLACKSMITHING\nShawn Lovell (she/her) @Slmetalworks | Forging Kitchen Tools: Spoons, Spatulas + Hooks\n\n🏺 CERAMICS\nFrank Zhu (he/him) @frankzhuceramicist | Breaking the Confines of the Wheel\n\n🤖 FAB LAB\nKimberly Lyle (she/her) @kimber.lyle | 3D Printing with Bio-Based Materials\n\n🪡 FIBER\nCarly Owens Weiss (she/her) @carlyowensweiss | Encrusted: Explorations in Contemporary Bead Embroidery\n\n🖼️ GRAPHICS\nAshley Page (she/her) @ashleypage.studio | Papercoated: Sculptural Papermaking\n\n💠 METALS\nVenetia Dale (she/her) @venetiadale | Fiber Techniques and Metal\n\n🪵 WOOD\nFredy Huaman Mallqui (he/him) @fredyartworkrestoration| Hand Wood Carving\n\nThe application deadline is Friday, August 14, so don’t wait! For full workshop descriptions and info on how to apply, click the 🔗 in our bio.\n\n*NOTE: Given the interest in this program, Haystack accepts people based on a lottery system and is open to Maine residents age 18 and over who reside in the state for more than 9 months of the year.*","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":74,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"REVERSED VIEW, 2026","k":"exhibition","s":"2026-10-11","e":null,"st":null,"et":null,"u":"lenamemrich","c":"Osnabrück","co":"","p":"https://www.instagram.com/p/Da4uaS-jAF0/","x":"REVERSED VIEW, 2026 \n\nWithin a window bay at Kunsthalle Osnabrück, Lena Marie Emrich installs an ornamental window grille. Displaced from exterior to interior, it becomes both threshold and barrier, rendering protection visible as an ambivalent spatial condition.\n\nAt its centre, a natural acrylic stone inlay depicts a turning female figure whose skin and ribs appear to peel away. A bronze mirror occupies the opening of the body, folding the viewer into the image.\n\nLena Marie Emrich\nI left the window open for you\n27.06.–11.10.2026\nCurated by @nina_diel \nPhotos by @luciemarsmann","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-17","ld":86,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Das war unser Juli: Sommer, Sonne und großartige Gäste.","k":"concert","s":"2026-10-11","e":null,"st":null,"et":null,"u":"kunsthalleosnabrueck","c":"Osnabrück","co":"","p":"https://www.instagram.com/p/DbxmuzTo0R-/","x":"Das war unser Juli: Sommer, Sonne und großartige Gäste. \n\nLos ging’s mit der letzten Ausgabe des Live-Sport-Studios SAINT FLESH, mit Duygu Ağal (@duyguagal) und Ricarda Hillermann (@ricarda.hn), in der Ausstellung von Aleen Solari (@xoulari). Die Band KIND gab ein Jazzkonzert inmitten von Julia Miorins (@julia.miorin) „Träumen von Räumen”. Im Kreuzgang spielten Licht und Schatten in den Mobiles von Lena Marie Emrich (@lenamemrich). Ausserdem eröffnete Maximilian Gerber (@gerber_art_) seine Pop-up-Ausstellung „Wie geht’s dir?“ im Vermittlungsraum. \n\nNoch bis Sonntag, 11. Oktober 2026, kannst du dir die drei Einzelausstellungen von „Raumordnung” bei uns ansehen. Dazu gibt es ein spannendes Begleitprogramm mit Lesungen, Talks, Workshops und vielem mehr. Unser Programmheft findest du in der Kunsthalle oder online auf der Website. Link in Bio 🔗\n\nWir freuen uns auf deinen Besuch im August!\n\nKIND sind:\nShannon Barnett (@shannonkbarnett)\nBruna Cabral (@thebrunacabral)\nDavid Helm (@marek__johnson)\nJan Klare (@jan_klare)\nShabnam Parvaresh (@shabnamparvaresh)\nEmily Wittbrodt (@emily_wittbrodt)\n\n//\n\nThis was our July: summer, sun, and wonderful guests.\n\nWe kicked off with the final edition of the live sports studio SAINT FLESH, with Duygu Ağal and Ricarda Hillermann, set within Aleen Solari’s exhibition. The band KIND gave a jazz concert in the midst of Julia Miorin’s “Träumen von Räumen.” In the corridor, light and shadow played across Lena Marie Emrich’s mobiles. Maximilian Gerber also opened his pop-up exhibition “Wie geht’s dir?” in the education space.\n\nUntil Sunday, October 11, 2026, you can visit all three solo exhibitions of “Spatial Orders”. Alongside the exhibitions, there’s an exciting programme with readings, talks, workshops, and much more. \nYou can find our programme booklet at the Kunsthalle or online on our website. Link in bio 🔗\n\nLooking forward to your visit in August!","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":64,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"GRANT RECIPIENT: Billy Bultheel (*1987) / Studio Grant 2026/27: New York City","k":"performance","s":"2026-10-15","e":null,"st":null,"et":null,"u":"hessischekulturstiftung","c":"New York","co":"","p":"https://www.instagram.com/p/DbuuC0GIoiW/","x":"GRANT RECIPIENT: Billy Bultheel (*1987) / Studio Grant 2026/27: New York City\n\n@billyjohnbultheel verbindet zeitgenössische Kompositionen mit den Traditionen der europäischen Musik des Mittelalters und der Renaissance. In seinen Aufführungen und Installationen erkundet er die Beziehung zwischen Musik, Körper, Bewegung und Raum: Die Musiker:innen spielen mit eigens entwickelten Instrumenten und werden zu Performenden, die mit Skulpturen und der umgebenden Architektur interagieren.\n\nVor einigen Wochen hat er seine Residenz im New Yorker Atelier der Hessischen Kulturstiftung angetreten. Dort setzt er sich unter anderem mit dem experimentellen Cellisten Arthur Russell auseinander, um eine zeitgenössische Antwort in Form einer LP und einer Performance zu erarbeiten.\n\nWir wünschen ihm eine produktive Zeit in New York, voller inspirierender Eindrücke und Begegnungen!\n\nNoch bis zum 15. Oktober 2026 können sich bildende Künstler:innen mit biografischem Bezug zu Hessen bei uns für Stipendien für 2027 und 2028 bewerben, unter anderem für Residenzen in New York!\n\n📅 Open Call: 1.8. – 15.10.2026\n👉 Link zum Bewerbungsportal in Bio!\n \n***\n\n@billyjohnbultheel bridges contemporary composition with the traditions of European Medieval and Renaissance music. Through performances and installations, he explores the relationship between music, body, movement, and space: Musicians perform on custom-made instruments, engaging with sculptures and the surrounding architecture as integral elements of the performance.\n\nA few weeks ago, he began his residency at the Foundation’s New York studio. There, he is conducting research on the experimental cellist Arthur Russell, seeking to develop a contemporary artistic response in the form of an LP and a live performance.\n\nWe wish him a productive time in New York, filled with inspiring encounters and new impressions!\n\nApplications are open until 15 October for our 2027 and 2028 grants, including residencies in New York!\n\n📅 Open Call: 1 Aug – 15 Oct 2026\n👉 Application portal link in bio!\n\n📷 1: Billy Bultheel, photo: @thyagosainte\n\n#BillyBultheel #HessischeKulturstiftung #StudioGrant #NewYorkCity #ContemporaryArt","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":69,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Playing BARBICAN, LONDON October 15 2026","k":"other","s":"2026-10-15","e":null,"st":null,"et":null,"u":"smerz_","c":"London","co":"","p":"https://www.instagram.com/p/DZ1tCDuCnYy/","x":"Playing BARBICAN, LONDON October 15 2026 \n\nTickets: https://tickets.barbican.org.uk/choose-seats/3555201\n\nsmerz + special guest \nC2C Festival | 25 years of \n\nVideos from Paris by @llouiselm\nBand: @villadstyr @runekielsgaard @roxie_o_ @waxse","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-06-21","ld":116,"dl":"2026-10-15","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Set in a facsimile rendering of the V&A East Storehouse’s conservation studios A and B,...","k":"other","s":"2026-10-18","e":null,"st":null,"et":null,"u":"sidequest.osp","c":"London","co":"","p":"https://www.instagram.com/p/DY_t8duCM3r/","x":"Set in a facsimile rendering of the V&A East Storehouse’s conservation studios A and B, 𝘎𝘶𝘢𝘯𝘺𝘪𝘯 𝘐𝘐: 𝘛𝘩𝘦 𝘊𝘢𝘳𝘦𝘵𝘢𝘬𝘦𝘳 (2026) by Lawrence Lek with Xin Song, is a third person platforming adventure whose gameplay masks subtle dialogues about excessive AI automation and burn out rates in the arts sector. \n\nCurrently on show as part of the New Work: Making East London programme, Lek’s game drops players into the slender framed Guanyin carebot C-0181 on their first day on the job, with no colleagues to turn to for advice.\n\nSearching for scattered fragments of an ArcelorMittel Orbit architectural model, “C-0181 must negotiate the human proportions of the environment, clambering up boxes and through air vents, before crossing the network of ceiling mounted cable trays and descending to the shop floor by means of a miniature goods lift.”\n\nRead more about the piece in the latest 𝘚𝘐𝘋𝘌 𝘘𝘜𝘌𝘚𝘛 𝗢𝗯𝘀𝗲𝗿𝘃𝗮𝘁𝗶𝗼𝗻 𝗤𝘂𝗲𝘀𝘁 article.\n\nVisit 𝘎𝘶𝘢𝘯𝘺𝘪𝘯 𝘐𝘐: 𝘛𝘩𝘦 𝘊𝘢𝘳𝘦𝘵𝘢𝘬𝘦𝘳 at V&A East Storehouse until Sunday 18th October, 2026.\n\n#SideQuest\n#LawrenceLek\n#VAMEast\n@lawrencelek\n@songxin.xin\n@vam_east\n@sadiecoleshq\n@katiegdelamere","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-31","ld":140,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"“Pumpkins have been a great comfort to me since my childhood; they speak to me of the j...","k":"exhibition","s":"2026-10-18","e":null,"st":null,"et":null,"u":"davidzwirner","c":"","co":"","p":"https://www.instagram.com/p/Dbn6FrYlZZL/","x":"“Pumpkins have been a great comfort to me since my childhood; they speak to me of the joy of living. They are humble and amusing at the same time, and I have and always will celebrate them in my art.” —Yayoi Kusama\n\nYayoi Kusama: All the Eternal Love I Have for the Pumpkins (2016) is now on view at the Cincinnati Art Museum (@cincyartmuseum) through Sunday, October 18. Plan your visit via the link in bio.\n\nThe installation features an array of yellow gourds of various sizes adorned with black polka dots and surrounded by mirrors, creating an immersive experience in which the viewer becomes part of the artwork as they enter an infinite field of glowing pumpkins.\n—\nYayoi Kusama, All the Eternal Love I Have for the Pumpkins, 2016. © YAYOI KUSAMA","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":75,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Fotografisk Center is proud to present a new exhibition on the digital platform On The ...","k":"exhibition","s":"2026-10-18","e":null,"st":null,"et":null,"u":"fotografiskcenter","c":"Paris","co":"","p":"https://www.instagram.com/p/DbYCbkpIU5f/","x":"Fotografisk Center is proud to present a new exhibition on the digital platform On The Go with the Taiwanese-Vietnamese visual artist Tsai Ting Bang. The exhibition “Born from the Same Root” is centered around family life, with a point of departure in the relationship between Bang and his older brother Hsien. Only one year apart in age, their childhood was shaped by both closeness and confusion. Their lives began to diverge early on being separated from their parents. This early separation becomes a quiet but decisive force within the work, shaping the emotional distance that gradually emerges between them. \n\nIn this way “Born from the Same Root” unfolds as a dual visual narrative. Two parallel sequences of images - one following Bang, the other Hsien. \n\nThe project “Born from the Same Root” presents itself as a photobook and has received several awards. Among them are the First PhotoBook Award at the Paris Photo-Aperture Foundation PhotoBook Awards and the Singapore International Photography Festival Dummy Book Award, both in 2024.\n\nThis digital exhibition is presenting a selection of images from the book.\n\nExhibition period: 03.08. - 18.10.2026\nFind the exhibition at: fotografiskcenter.dk\nImage credit: Tsai Ting Bang\n\n@tsaitingbang @moom.bookshop \n\n#documentaryphotographer #photographybook #artphotographer #onlineexhibition #photoexhibition","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":76,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"How do people actually navigate a space — and how can designers make that journey clear...","k":"workshop","s":"2026-10-21","e":null,"st":"13:00","et":"17:00","u":"segddesign","c":"Kansas City","co":"","p":"https://www.instagram.com/p/DbyZ9mkGtIb/","x":"How do people actually navigate a space — and how can designers make that journey clearer, more intuitive, and more accessible?\n\nStart your SEGD Conference experience in Kansas City with Wayfinding, Planning, and Design, a four-hour, hands-on Bootcamp on Wednesday, October 21 from 1:00–5:00 PM CT.\n\nThis bootcamp is focused on how people navigate complex environments and how designers can create clearer, more intuitive systems.\n\nLed by Jonathan Mugmon (@jonathan_mugmon), Ashley Wysong, Ezz Osman (@dezzi9ner), and Pan Hu of Populous (@wearepopulous), the workshop moves from ethnographic research and strategy to sign-location planning, information hierarchies, design systems, and typography — with hands-on exercises throughout.\n\nComplete the session and receive an SEGD Certificate of Completion.\n\n📍 Kansas City 📅 Wednesday, October 21 ⏰ 1:00–5:00 PM CT | Check-in at 12:30 PM\nTo register, click on the link in our bio.\n\nThank you to our Presenting Sponsors, Color-Ad, Inc. (@color_ad_inc) and Nanolumens (@nanolumens_led).\n\n#SEGD #Wayfinding #WayfindingDesign #ExperientialDesign #DesignEducation","r":false,"b":"register","af":true,"so":false,"pd":"2026-08-08","ld":74,"dl":"2026-10-21","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Lo Brutto Stahl is excited to announce its participation at Art Basel Paris in the Emer...","k":"other","s":"2026-10-21","e":"2026-10-25","st":null,"et":null,"u":"lobruttostahl","c":"New York","co":"","p":"https://www.instagram.com/p/DY5DhbbxmGU/","x":"Lo Brutto Stahl is excited to announce its participation at Art Basel Paris in the Emergence sector with a solo presentation by Clémentine Adou.\n\nArt Basel Paris\nEmergence  October 21–25, 2026\n\nClémentine Adou (b. 1988, Paris, France) lives and works in Paris. Adou’s work is characterized by an economy of production and means, using processes of subtraction and recovery that incorporate everyday objects and materials. Contemporary conditions are diffused throughout her work through spatial and contextual forms that foreground processes of visibility and constraint.\n\nSolo and duo exhibitions include Spare Room, Paris (with Wojciech Bąkowski, 2026); Tunnel Tunnel, Lausanne (2025); Les Bains-Douches, Alençon (2024); Tonus, Paris (2023); DOC, Paris (with Julien Monnerie, 2021); Palette Terre, Paris (2020); and 76,4, Brussels (2019). Her work has been shown in group exhibitions such as Café des Glaces, Tonnerre (2026); Derosia, New York (2025); Bel Ami, Los Angeles (2025, 2020); Lo Brutto Stahl, Basel (2025); Kunstverein Freiburg, Freiburg (2025); Super Super Markt, Berlin (2025); Fondation Pernod Ricard, Paris (2024); Balice Hertling, Paris (2024); Lagune Ouest, Copenhagen (2024); La Salle de Bains, Lyon (2023); Treize, Paris (2023); Florence Loewy, Paris (2022); Shivers Only, Paris (2021); High Art, Paris (2020). Upcoming solo and group exhibitions include Lodovico Corsini, Brussels (2026); Lo Brutto Stahl, Basel (2026); Kunstverein Kevin, Vienna (2026); Kunstwerke Techne Sphere, Leipzig (2026); Center for Maine Contemporary Art, Maine (2026); and Keijiban, Kanazawa, Japan (solo, 2027).\nShe was one of the recipients of the 25th Fondation Pernod Ricard Prize in 2024. Her work is held in permanent collections including Centre Pompidou; FRAC Île-de-France; and FRAC Corse.\n\nDaddy long legs’ hands, 2023 (details)\nUmbrella structure, aluminum, inox, steel, wire \n215 × 110 × 25 cm (84 5/8 × 43 1/4 × 9 7/8 in)\n\nPhoto: Jade Fourès-Varnier; Courtesy of the artist and Tonus, Paris\n\n@clementineadou @artbasel","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-28","ld":146,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"The middle gets a bad reputation.","k":"exhibition","s":"2026-10-22","e":"2026-10-24","st":null,"et":null,"u":"segddesign","c":"Kansas City","co":"","p":"https://www.instagram.com/p/DaBAirqBU7u/","x":"The middle gets a bad reputation.\n\nBut as designers of experiences, we’ve always known something critical: the middle is not a compromise. The middle is where meaning is made.\n\nThe most meaningful work doesn’t happen at the extremes. It’s where ideas converge. Where client vision meets user need. Where culture meets place. Where technology meets humanity. Where competing priorities sharpen our thinking—and where creativity emerges when we resist easy answers.\n\nThat’s why this year’s SEGD Conference Experience theme is Meet Me in the Middle.\n\nThis October 22–24, we’re gathering in Kansas City—not just because it’s the geographic heart of the country, but because it embodies convergence. It’s a place where craft meets innovation, history meets reinvention, and local stories create global impact. \n\nTogether, we’ll explore how experiential design helps us navigate complexity, embrace productive tension, and create meaningful connections through inspiring speakers, immersive tours, hands-on workshops, NEXPO, and the conversations that only happen when this community comes together.\n\nWe’re honored to have this year’s conference guided by an extraordinary leadership team:\n\n• Rick Smith, Vice President of Experiential Design, Dimensional Innovations\n• Wendy Manning, Managing Principal, Demeter Strategy Design\n• Jackie Berra, Founder & Brand Experience Director, JBerra Consulting & Design\n\nAlong with the support of Kansas City Chapter Chairs Kate Schmidt and Sarah Onken.\n\nA special thank you to our brand design partner, Studio Loutsis (@studio_loutsis) for bringing this year’s theme to life, and to our Presenting Sponsors, Color-Ad, Inc. (@color_ad_inc) and Nanolumens (@nanolumens_led), for helping make this experience possible.\n\nThis is where our profession comes together to challenge one another, sharpen our thinking, and imagine what’s next.\n\nEarly registration is now open. Lock in the best rate, reserve your hotel, and start planning your trip to Kansas City. We’ll see you in October!!\n\nRegister now at our link in bio","r":false,"b":"register","af":true,"so":false,"pd":"2026-06-25","ld":119,"dl":"2026-10-24","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"📅 Mark your calendars. This October, we're meeting in the middle.","k":"exhibition","s":"2026-10-22","e":"2026-10-24","st":null,"et":null,"u":"segddesign","c":"Kansas City","co":"","p":"https://www.instagram.com/p/DboVlEqlCr4/","x":"📅 Mark your calendars. This October, we're meeting in the middle.\n\nAs experience designers, we've always worked there. Between vision and need. Between story and data. Between what exists and what could be.\n\nThat's the idea behind Meet Me in the Middle, the theme for the 2026 SEGD Conference Experience in Kansas City.\n\nFrom October 22–24, experience designers, wayfinding specialists, brand strategists, makers, and placemakers will gather in the geographic heart of the country to explore the tensions that define our work—and the opportunities that emerge when we embrace them. Through sessions, tours, and conversations organized around four pillars of \"the middle,\" we'll examine how design bridges divides, builds belonging, and creates meaning.\n\n📍Geographic Middle: a true center of gravity, where routes converge and ideas travel through. Not fly-over country, but a place that's earned its design legacy across sports architecture, museums, transit, and brand identity.\n\n🤝Collaborative Middle: between budget and vision, between what's commissioned and what's actually needed. This is where great experience design happens: holding the tension and finding the third option nobody saw coming.\n\n🌉Social Middle: urban and rural, familiar and foreign, us and them. These fractures live in the spaces we design every day. Design won't erase that tension, but it can build something that bridges it.\n\n❤️Emotional Middle: craft that knows not just how to make something, but why it matters. This conference is part professional development and part homecoming for the designers who want their work to feel seen and connected to something bigger.\n\nMeet Me in the Middle at the 2026 SEGD Conference Experience Kansas City, October 22- 24.\n\nRegistration is open—register by August 31 for early rates!\n\nLink in bio for details.\n\nThank you to our Presenting Sponsors, Color-ad (@color_ad_inc) and Nanolumens (@nanolumens_led)\n\n#SEGD #MeetMeInTheMiddle #DesignersofExperiences #KansasCity #DesignConference2026","r":false,"b":"register","af":true,"so":false,"pd":"2026-08-04","ld":79,"dl":"2026-08-31","ds":"stated","ap":false,"rel":false,"q":false},{"now":false,"t":"For T Magazine’s list of the 25 most important works of sculpture made since 1945, M.H....","k":"exhibition","s":"2026-10-22","e":null,"st":null,"et":null,"u":"paulacoopergallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbyGauXoLBy/","x":"For T Magazine’s list of the 25 most important works of sculpture made since 1945, M.H. Miller moderated a conversation between artists Firelei Báez, Charles Gaines, Adam Pendleton, Arlene Shechet and curator Ruba Katrib on the works that have shaped sculpture since the end of the Second World War.\n\nTheir selection included the gallery’s inaugural 1968 exhibition, ’Benefit for the Student Mobilization Committee to End the War in Vietnam.’ The entry highlighted Sol LeWitt, Donald Judd, and Dan Flavin as “artists who would go on to transform sculpture.” The exhibition featured sculptures by Judd and Flavin, and LeWitt’s first wall drawings.\n\nThe article also featured Oldenburg’s ‘The Store’ (1961) as an early example of installation art and interactive sculpture where “the artist’s lumpy, gloopy approximations of the wares on sale at neighboring bodegas and hardware stores collapsed not only the line between painting and sculpture but also that between consumer culture and high art.”\n\nVisit the link in our bio to read the full article. \n\n#PaulaCooperGallery #ClaesOldenburg @lewittstudio @tmagazine \n-\n[1-3] Installation view, ‘Benefit For The Student Mobilization Committee To End The War in Vietnam’, Paula Cooper Gallery, 96-100 Prince Street, New York, October 22 – October 31, 1968. Works by Carl Andre, Jo Baer, Bob Barry, Bill Bollinger, Dan Flavin, Robert Huot, Will Insley, Donald Judd, David Lee, Sol LeWitt, Robert Mangold, Robert Murray, Doug Ohlson, Robert Ryman. Courtesy Paula Cooper Gallery, New York.\n[4] Claes Oldenburg in ‘The Store,’ 107 East Second Street, New York, 1961. © Claes Oldenburg. Courtesy Paula Cooper Gallery, New York. Photo: Robert R. McElroy","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":75,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"“With her savage embrace of what can only be called by that 20th-century word 'primitiv...","k":"exhibition","s":"2026-10-31","e":null,"st":null,"et":null,"u":"davidzwirner","c":"Paris","co":"","p":"https://www.instagram.com/p/DbbAadEmMOk/","x":"“With her savage embrace of what can only be called by that 20th-century word 'primitivism', her mixing of beauty and revulsion, her pastiches, her awe at the mystery of human existence, she is today’s Picasso.\" —Jonathan Jones, critic, on Huma Bhabha\n\nWishing a very happy birthday to Huma Bhabha! Earlier this year, the Institut Giacometti presented an exhibition bringing Bhabha's work into dialogue with that of Alberto Giacometti (@Fondation_Giacometti), highlighting their shared exploration of the human figure somewhere between strength and fragility.\n\nBhabha's work can now be seen in TURANDOT: To the Daughters of the East, presented by @ParasolUnit at @ACPPalazzoFranchetti in Venice through Saturday, October 31, where eleven significant female artists engage with themes as diverse as existence, myth, and history. Learn more and plan your visit via the link in bio.\n—\n1: Huma Bhabha in her studio. Photo by Jason Schmidt\n2/4: Installation views, Alberto Giacometti/ Huma Bhabha. Dénoue, boucle à boucle, les cheveux d’une idole – avant que tes articulations se détachent…, Institut Giacometti, Paris, 2026. © Succession Alberto Giacometti / ADAGP\n3/5: Huma Bhabha, Untitled, 2023 (detail); So Am I, 2025 (detail) \n6: Installation views of works by Huma Bhabha in TURANDOT: To the Daughters of the East, Palazzo Franchetti, Venice, 2026","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":93,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Speaking about his collaborations with Tolia Astakhishvili, artist James Richards said:","k":"exhibition","s":"2026-11-01","e":null,"st":"10:00","et":null,"u":"mumok_vienna","c":"Vienna","co":"","p":"https://www.instagram.com/p/Danl4DSAw4u/","x":"Speaking about his collaborations with Tolia Astakhishvili, artist James Richards said:\n“There’s no real boundary between the research for a work and the work itself, or between documentation and raw material. That’s generally true of both of our methodologies: practice as an ongoing enquiry.”\n\nIn their video ‘Wild Thing’ (2026), a central work in Tolia Astakhishvili, ‘Figure of the Child’, collages are created by blending materials that were shared between Richards and Astakhishvili during the exhibition’s preparation process.\n\nTolia Astakhishvili, ‘Figure of the Child’ at mumok (20.6.–1.11.2026), is the artist’s first solo museum exhibition. Now open: Visit us Tuesday–Sunday, 10 am–6 pm.\n____\n\nÜber seine Zusammenarbeit mit Tolia Astakhishvili sagt der Künstler James Richards:\n„Es gibt keine wirkliche Grenze zwischen der Recherche für ein Werk und dem Werk selbst oder zwischen Dokumentation und Rohmaterial. Das gilt generell für unsere beiden Arbeitsweisen: künstlerische Praxis als fortlaufende Untersuchung.“\n\nIn ihrem Video ‚Wild Thing‘ (2026), einer zentralen Arbeit in Tolia Astakhishvilis Ausstellung ‚Figure of the Child‘, entstehen Collagen durch die Verschmelzung von Materialien, die Richards und Astakhishvili während der Vorbereitungen zur Ausstellung miteinander geteilt haben.\n\nTolia Astakhishvili, ‚Figure of the Child‘ im mumok (20.6.–1.11.2026) ist die erste museale Einzelausstellung der Künstlerin. Jetzt geöffnet: Dienstag bis Sonntag, jeweils von 10 bis 18 Uhr.\n____\n\n@toliaasta, #jamesrichards\n@fatimahellberg, #manuelammer","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-10","ld":114,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Tokyo Jazz Club","k":"performance","s":"2026-11-01","e":"2026-11-08","st":null,"et":null,"u":"tokyo.jazz.club","c":"Tokyo","co":"","p":"https://www.instagram.com/p/DbnMabRATmn/","x":"Tokyo Jazz Club\n\nA new initiative.\n\nFrom the legacy of @basel.social.club \n\nA former capsule hotel. \n\nJimbōchō, Tokyo.\n\nEight floors.\n\nNovember 1–8, 2026. \n\nArt Week Tokyo.\n\nArt. Performance. Music. Gathering.\n\nImprovisation. Listening. Collective presence.\n\nProgram coming soon.\n\ntokyojazzclub.jp\n\nVideo: @mattdinner @m_lyd_ Audio: @l_y_d_o \n\n#tokyojazzclub #artweektokyo #tokyo #jimbocho","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":89,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Throughout Tolia Astakhishvili’s exhibition at mumok, that special condition, the “figu...","k":"exhibition","s":"2026-11-01","e":null,"st":null,"et":null,"u":"mumok_vienna","c":"Vienna","co":"","p":"https://www.instagram.com/p/DagB39uDRVM/","x":"Throughout Tolia Astakhishvili’s exhibition at mumok, that special condition, the “figure of the child” emerges through shifting scales, precarious structures, and a sustained sense of perceptual uncertainty. Tolia Astakhishvili eschews the conventions of museum display in order to insist on the primacy of artistic experience. Grounded in bodily movement and haptic perception, the exhibition pushes sensation beyond preconceived meanings, striving toward a state of openness and immediacy that the artist describes as akin to a child’s “first encounter.”\n____\n\nIn Tolia Astakhishvilis Ausstellung im mumok erfährt man jenen besonderen Zustand, den die „Figur des Kindes“ beschreibt, durch wechselnde Maßstäbe, prekäre Strukturen und ein Gefühl unsteter Wahrnehmung. Astakhishvili verzichtet auf die Konventionen der musealen Präsentation und setzt stattdessen auf die unmittelbare Erfahrung von Kunst an sich. Von körperlicher Bewegung und haptischer Erfahrung ausgehend, stellt die Ausstellung gängige Sinneswahrnehmungen und ihre Bedeutung auf die Probe. Dabei eröffnet sie einen Zustand der Offenheit und Direktheit, den die Künstlerin mit jener „ersten Begegnung“ vergleicht, die Kinder im erstmaligen Erleben von einem Phänomen erfahren.\n____\n\nTolia Astakhishvili, ‚Figure of the Child‘\n20.6.–1.11.2026\n\nWith works by / Mit Arbeiten von Vito Acconci, Zurab Astakhishvili, Aurel, Ştefan Bertalan, Karl Blossfeldt, Kaucyila Brooke, Veronica Brovall, Günter Brus, Elene Chantladze, James Ensor, Nan Goldin, Yaryna Fedoriv, Irma Gubeladze, Ull Hohn, Joe Jones, Paul Joostens, Louise Lawler, Charlotte Moorman & Nam June Paik, Dylan Peirce, Pablo Picasso, Charlotte Posenenske, Alexandra Ranner, James Richards, Irena Rosc, Medardo Rosso, Dieter Roth, Maka Sanadze, Stefan Wewerka, Heimo Zobernig\n____\n\n@toliaasta, @fatimahellberg, #manuelaammer\nPhotos/Fotos: Tolia Astakhishvili Studio","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-07","ld":117,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🎤Save the date for Triple Canopy’s 2026 Symposium! Join us November 9–15 in Downtown Br...","k":"talk","s":"2026-11-09","e":"2026-11-15","st":null,"et":null,"u":"triple_canopy","c":"New York","co":"","p":"https://www.instagram.com/p/Dbbbm2fzWq6/","x":"🎤Save the date for Triple Canopy’s 2026 Symposium! Join us November 9–15 in Downtown Brooklyn.\n\nTriple Canopy’s annual symposium is a manifestation of the magazine’s concerns and collaborations, in person and in real time. The multiday gathering brings together artists, writers, performers, and researchers to address the role of culture in responding (or contributing) to a range of critical issues. \n\nThe full lineup will be announced soon. We’re excited to partner with Roulette (@roulette_intermedium), Public Records (@publicrecordsnyc), and Critical Minded (@criticalminded_community) this year to present programs over the course of five days. Keep an eye on our newsletter (and Instagram) to be the first to know when registration opens.\n\nThe 2026 Triple Canopy Symposium is supported by Critical Minded and hosted by Roulette and Public Records. Programs on November 9, 10, and 15 are presented in partnership with Public Records’s Durations (@durations.world) festival. The visual identity was created by Kevin Dong (@kevin.dong).\n\n🔗Read more through the link in our profile.","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-30","ld":102,"dl":"2026-11-15","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"GLUE Book Fair returns in September, and we're spotlighting some of the independent pub...","k":"performance","s":"2026-11-13","e":"2026-11-15","st":null,"et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/DbiYIPYlpDY/","x":"GLUE Book Fair returns in September, and we're spotlighting some of the independent publishers who will be there 💘 \n\nFounded in 2024 by photographer Jack Davison, HELIONS (@helions_print) began as a self-published annual newspaper and has since expanded into artist-led books that extend photographic practice, including A is for Ant (2024) and 13–15 November. Portraits: London (2026).\n\nGranta Magazine (@granta_magazine) is the UK's leading quarterly journal of new writing and long-form non-fiction, publishing emerging and established voices from around the world.\n\nWorking between Brussels and London, Divided (@dividedpublish) is an independent publisher producing books that bring together contemporary art, visual culture and critical practice.\n\nThe Toe Rag (@thetoerag) is a print magazine published three times a year (February, June and October). The magazine is concerned with contemporary culture, particularly visual art, performance, politics, philosophy and literature.\n\nTheir issues feature essays, reviews, interviews, fiction, poetry and artists’ projects. Their back pages include event listings, puzzles, games, an agony aunt and a Page 3.\n\nGLUE 2026, 12 & 13 Sep 📚 \nFree entry, find out more in bio 🔗 \n\n#GLUE2026 #Bookfair #GLUE #Publishers #ContemporaryPublishing #ICA #London #Talks","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-02","ld":103,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Rudely Alive: Mire Lee in conversation with Maggie Kuzan (@maggie_kuzan) in Contemporar...","k":"talk","s":"2026-11-13","e":null,"st":null,"et":null,"u":"tinakimgallery","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/Dbl0yw0Fu93/","x":"Rudely Alive: Mire Lee in conversation with Maggie Kuzan (@maggie_kuzan) in Contemporary Lynx (@contemporarylynx)\n\nMire Lee reflects on her colossal, seemingly living and breathing machines in her recent installations at IAC Villeurbanne/Rhone-Alpes and newly opened exhibition at Secession, Vienna. Lee’s machines are sensorially abrasive, dripping mechanisms that uncannily mirror the human body—as Kuzan writes, “rudely alive.” In this interview, Lee considers the relationship between her art and her sense of self: “Every artist develops patterns in their work based on things that are deeply rooted in who they are… I was trying to work a little bit more with myself, with my patterns, shapes and forms, even though it’s uncomfortable because those are the parts of myself I dislike.”\n\n𝘛𝘩𝘦 𝘏𝘦𝘢𝘳𝘵 𝘰𝘧 𝘔𝘺 𝘔𝘢𝘤𝘩𝘪𝘯𝘦 𝘪𝘴 𝘎𝘰𝘭𝘥𝘦𝘯 𝘓𝘦𝘢𝘥 is on view at Secession, Vienna, through August 26th. Following this exhibition, elements of the installation will be on view at the Oude Kerk, Amsterdam, opening November 13.\n\nRead more at the link in our bio. \n#이미래","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":102,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Excited to announce a new body of work and film, “Overt Listening,” to be shown at @kun...","k":"exhibition","s":"2026-11-13","e":"2027-01-31","st":null,"et":null,"u":"t1ffany4scal3","c":"Berlin","co":"","p":"https://www.instagram.com/p/DSQIBF_DmNC/","x":"Excited to announce a new body of work and film, “Overt Listening,” to be shown at @kunsthallewien in collaboration with @kwinstitutefcontemporaryart. Honored to work with Michelle Cotton @michellecottton, Liberty Adrien @liberty.adrien and Emma Enderby @emenderby.\n\nTiffany Sia: Overt Listening \nNovember 13, 2026 - January 31, 2027 \n\nA new film entitled Overt Listening forms the focus for Tiffany Sia’s (b. 1988, Hong Kong) first institutional solo exhibition in Austria. Set on the Kinmen Islands in Taiwan, just a few kilometers off the Chinese coast, the film critically examines the aftermath of the Cold War, highlighting the history of difficult and often imperceptible geopolitical tensions in the region of the Pacific Theater. Sia combines footage of historical sites such as military bunkers with landscape scenes of deserted beaches. This is accompanied by the sound of radio broadcasts and military exercises. Unfolding in a series of chapters in a spatial installation across the ground floor of Kunsthalle Wien Museumsquartier, the work mixes collected oral narratives, official histories and popular culture in an expansive, filmic essay.\n\nThe exhibition is organised in collaboration with KW – Institute for Contemporary Art, Berlin.","r":false,"b":null,"af":false,"so":false,"pd":"2025-12-14","ld":334,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Catherine Christer Hennix: Cosmological Critique","k":"exhibition","s":"2026-11-15","e":null,"st":"19:00","et":null,"u":"badischer_kunstverein","c":"New York","co":"","p":"https://www.instagram.com/p/DZxJ8UOI6jE/","x":"Catherine Christer Hennix: Cosmological Critique\n\nBadischer Kunstverein\n10.7.–15.11.2026\n\nEröffnung / Opening\n9.7.2026, 19 Uhr / 7 pm\n\nKuratiert von / Curated by\nAnja Casser, Lawrence Kumpf, Moritz Nebenführ\n\nIn Zusammenarbeit mit / In collaboration with @malmokonsthall, The Etymon Foundation (New York), @emptygallery.hk sowie / as well as Marcus Pal als künstlerischem Berater / as artistic advisor\n\nGefördert durch / Funded by @kulturstiftungdesbundes \n\nFoto / Photo\n@ari_marcopoulos_official","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-19","ld":149,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Save the Date","k":"exhibition","s":"2026-11-15","e":null,"st":"19:00","et":null,"u":"kestner_gesellschaft","c":"London","co":"","p":"https://www.instagram.com/p/Dbxff49j2D4/","x":"Save the Date\n\nKarimah Ashadu \nCrystalline\n29.8.–15.11.2026\n\nEröffnung / Opening\nFr, 28.8.2026, 19 Uhr / 7 pm\n\nKuratiert von Alexander Wilmschen, kuratorische Assistenz Berenike Arbeiter / Curated by Alexander Wilmschen, Curatorial Assistance Berenike Arbeiter\n\n@karimahashadu @alexander.wilmschen @eva_birkenstock \n\nDanke an / Thanks to\n@sadiecoleshq\n@trautweinherleth\n\nUnterstützt von / Supported by\nFörderkreis Kestner Gesellschaft\n@mwk.niedersachsen\n@stiftungniedersachsen \n@kultur.stiften \n@
