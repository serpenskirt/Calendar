e to reveal the sounds behind each one ➡️\n \n📣 See “Musical Bodies” on view at The Met through September 27.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Er komt een nieuwe tentoonstelling naar TROEF! Sluit op 7 augustus aan bij de opening v...","k":"exhibition","s":"2026-08-07","e":"2026-09-27","st":"17:30","et":null,"u":"troefleiden","c":"Leiden","co":"","p":"https://www.instagram.com/p/DbFd-jDtm0I/","x":"Er komt een nieuwe tentoonstelling naar TROEF! Sluit op 7 augustus aan bij de opening van To Orient before Sunset, vanaf 17:30\n\n(English below)\n\nIn deze tentoonstelling brengt curator Augustina Cai de artistieke onderzoeksprojecten samen van Andong Zheng, Dakota Guo en het duo Lou Kim en Jiyoung Yim.\n\nTo Orient before Sunset is geworteld in archeologie, botanische taxonomie en cartografie. De tentoonstelling stelt de vraag hoe moderne kennissystemen gesitueerde relaties omzetten in vaste categorieën, waardoor ze kenbare en beheersbare entiteiten worden.\n\nAls reactie op het Leidse erfgoed van Oriëntaalse kennisproductie, reflecteert de tentoonstelling op de manieren waarop ‘het Oosten’ is verzameld, bestudeerd en esthetisch gewaardeerd. Ook laat het zien hoe hedendaagse Oost-Aziatische kunstpraktijken in Europa worden ontvangen.\n\n🇬🇧A new exhibition is coming to TROEF! Join us August 7th at the opening of To Orient before Sunset, from 17:30\n\nIn this exhibition, curator Augustina Cai brings together artistic research projects by Andong Zheng, Dakota Guo and the duo Lou Kim and Jiyoung Yim.\n\nTo Orient before Sunset is anchored in archaeology, botanical taxonomy and cartography. The exhibition questions how modern knowledge systems turn situated relations into fixed categories, rendering them into knowable and governable entities.\n\nResponding to Leiden’s heritage of Oriental knowledge production, the exhibition reflects on the ways ‘the Orient’ has been collected, studied and aesthetically appreciated. It also points to how contemporary East Asian artistic practices are received in Europe.\n\n🌄To Orient before Sunset: Digging, Naming, Mapping is on show from August 7th to September 27th, every Friday, Saturday and Sunday. More info is available on our Instagram page and website.\n\nCurated by Augustina Cai @augustina.cai\n\nParticipating artists:\n🌐 Dakota Guo (@kotaiwas___)\n🌐 Andong Zheng (@andongzheng)\n🌐 Lou Kim (@loulou.zip) & Jiyoung Yim (@jiji.the.busy)\n\nThis exhibition is part of TROEF’s In Shared Air series. Supported by taxpayers, @pictoright, @cultuurfonds, @gemeenteleiden, @mondriaanfonds\n\n#artopening #contemporaryart #leiden #hedendaagsekunst","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":16,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Maak kennis met de kunstenaars van To Orient before Sunset! Vandaag stellen we Andong Z...","k":"exhibition","s":"2026-08-07","e":"2026-09-27","st":null,"et":null,"u":"troefleiden","c":"Leiden","co":"","p":"https://www.instagram.com/p/DbxfUkmtung/","x":"Maak kennis met de kunstenaars van To Orient before Sunset! Vandaag stellen we Andong Zheng (@andongzheng) aan je voor, die zijn werk How to (Un)Name a Tree (2022-) presenteert.\n\n(English below)\n\nAndong’s werk ontvouwt zich door middel van fotografie, video en installatie. Hij is richt zich op de verstrengelde relaties tussen geografieën en geschiedenis, en op hoe betekenis wordt gevormd.\n\nIn How to (Un)Name a Tree onderzoekt Andong de verstrengelde relatie tussen naamgeving, waarneming en kennisproductie. Dit doet hij aan de hand van drie nauw verwante soorten dennenbomen. Deze zijn al lange tijd onderwerp van controverse, wat onthult hoe naamgevingssystemen de overblijfselen van imperiale geschiedenissen en geopolitieke sedimenten vasthouden.\n\n🇬🇧Meet the artists of To Orient Before Sunset!\nToday, we introduce Andong Zheng, who is showcasing his work How to (Un)Name a Tree (2022-)\n\nAndong’s work unfolds through photography, video and installation. He focuses on the entangled relations across geographies and histories, as well as on the production of meaning.\n\nIn How to (Un)Name a Tree, Andong examines the entangled relationship between naming, seeing, and knowledge production. He does this through three closely related pine species. These species have long been subject of controversy, revealing how systems of naming retain the residues of imperial history and geopolitical sediment.\n\n🌄To Orient before Sunset: Digging, Naming, Mapping is on show from August 7th to September 27th, every Friday, Saturday and Sunday. More info is available on our Instagram page and website.\n\nCurated by Augustina Cai (@augustina.cai)\n\nParticipating artists:\n🌐 Dakota Guo (@kotaiwas___)\n🌐 Andong Zheng (@andongzheng)\n🌐 Lou Kim (@loulou.zip) & Jiyoung Yim (@jiji.the.busy)\n\nThis exhibition is part of TROEF’s In Shared Air series.\n\nSupported by taxpayers, @pictoright, @cultuurfonds, @gemeenteleiden, @mondriaanfonds\n\n📷: @mp_tycho \n\n#contemporaryart #meettheartist #hedendaagsekunst #leiden #artgallery","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":-1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Onze nieuwe tentoonstelling To Orient before Sunset opent over twee dagen!","k":"performance","s":"2026-08-07","e":"2026-09-27","st":null,"et":null,"u":"troefleiden","c":"Leiden","co":"","p":"https://www.instagram.com/p/DbqknP2I-yY/","x":"Onze nieuwe tentoonstelling To Orient before Sunset opent over twee dagen!\n\n(English below)\n\nMaar deze tentoonstelling is niet het enige dat naar TROEF komt. Naast de performance van Hui Lin (@hui.lin.compressed) in juli, die de ruimte voorbereidde op de installatie van de nieuwe werken, staan er verschillende evenementen op de planning voor augustus en september. Sluit gratis aan bij de opening, de paneldiscussie en de lecture performances.\n\nWe delen in de toekomst meer details over elk evenement, dus houd onze Instagram en website in de gaten!\n\n🇬🇧Our new exhibition To Orient before Sunset opens in two days!\n\nBut the exhibition is not the only thing coming to TROEF. Besides Hui Lin’s performance in July, which prepared the space for the installation of the new works, several events are coming your way in August and September. Join our opening, panel discussion and lecture performances for free.\n\nWe will share more details about every event closer to date, so keep an eye on our Instagram and website! \n\n🌄 To Orient before Sunset: Digging, Naming, Mapping is on show from August 7th to September 27th, every Friday, Saturday and Sunday. More info is available on our Instagram page and website.\n\nCurated by Augustina Cai (@augustina.cai)\n\nParticipating artists:\n🌐 Dakota Guo (@kotaiwas___)\n🌐 Andong Zheng (@andongzheng)\n🌐 Lou Kim (@loulou.zip) & Jiyoung Yim (@jiji.the.busy)\n\nThis exhibition is part of TROEF’s In Shared Air series.\nSupported by taxpayers, @pictoright, @cultuurfonds, @gemeenteleiden, @mondriaanfonds\n\n#ToOrientBeforeSunset #TROEFExhibitions #galleryopening #artevents #leiden","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Ontmoet de kunstenaars die deel uit zullen maken van To Orient before Sunset 🌅","k":"exhibition","s":"2026-08-07","e":"2026-09-27","st":null,"et":null,"u":"troefleiden","c":"Leiden","co":"","p":"https://www.instagram.com/p/DboHOqVNZK5/","x":"Ontmoet de kunstenaars die deel uit zullen maken van To Orient before Sunset 🌅\nWe beginnen met het kunstenaarsduo Lou Kim en Jiyoung Yim\n\n(English below)\n\nLou Kim (@loulou.zip) en Jiyoung Yim (@jiji.the.busy) vormen sinds 2022 een artistiek duo. In hun werk Certain Lives Become Buoys onderzoeken zij het in kaart brengen en documenteren van diasporische ervaringen. Hierbij putten zij uit hun gedeelde Zuid-Koreaanse identiteit. \n\nHun werk brengt de geluidsinstallaties van Kim samen met met de academische onderzoeksachtergrond van Yim. Het krijgt vorm via archiefonderzoek en video-installaties. \n\nOntdek hun werk bij TROEF in de nieuwe tentoonstelling To Orient before Sunset, die opent op 7 augustus.\n\n🇬🇧Meet the artists who will be part of To Orient before Sunset 🌅\nStarting with the collaborative duo Lou Kim and Jiyoung Yim.\n\nLou Kim and Jiyoung Yim have worked together as a duo since 2022. In their work Certain Lives Become Buoys, they explore how diasporic experiences can be documented and mapped, drawing from their shared South Korean identity. \n\nTheir artistic work merges Kim’s sound installations and Yim’s academic research background. It takes shape through archival research and video installations.\n\nDiscover their work at TROEF in the new exhibition To Orient before Sunset, opening on August 7th.\n\n🌄 To Orient before Sunset: Digging, Naming, Mapping is on show from August 7th to September 27th, every Friday, Saturday and Sunday. More info is available on our Instagram page and website.\n\nCurated by Augustina Cai (@augustina.cai)\n\nParticipating artists:\n🌐Dakota Guo (@kotaiwas___)\n🌐Andong Zheng (@andongzheng)\n🌐Lou Kim (@loulou.zip) & Jiyoung Yim (@jiji.the.busy)\n\nThis exhibition is part of TROEF’s In Shared Air series. Supported by taxpayers, @pictoright, @cultuurfonds, @gemeenteleiden, @mondriaanfonds\n\n📷: @mp_tycho \n\n#ToOrientBeforeSunset #TROEFExhibitions #ArtOpening #LeidenEvents","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":3,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Plan your visit to the Modern this August!","k":"screening","s":"2026-08-07","e":"2026-09-27","st":"17:00","et":"20:00","u":"themodernfw","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DbjvbGjE0qn/","x":"Plan your visit to the Modern this August! \n \n▪️ “Rashid Johnson: A Poem for Deep Thinkers” is on view now through September 27 \n\n▪️ Wednesdays at 2 pm: @CowtownMovieClassics is partnering with the Modern’s My Favorite Films series to showcase Hollywood classic thrillers. Tickets are $5 and free for members. \n \n▪️ Friday, August 7 from 5–8 pm: Free First Friday at the Modern featuring music by the First Friday House Band and food and drink by Café Modern (@CafeModernFW) available for purchase. A free 20-minute spotlight tour in the galleries is available at 6:30 pm. \n\n▪️ Saturday, August 8 at noon: “Charlotte’s Web” screens as part of the Family Film Series presented by the @ReelHouseFoundation, followed by a kid-centric docent tour. Tickets are $5 (free for members and children under 16). \n\n▪️ Saturday, August 8 at 2 pm: Special Exhibition Tour focusing on “Rashid Johnson: A Poem for Deep Thinkers” \n\n▪️ Thursday, August 13 at 7 pm: @JubileeTheatre presents “Four Voices, One Humanity,” a free theatrical performance, part of Rashid Johnson, “Stage,” 2026 \n\n▪️ Friday, August 14 at 6 pm: Recluse Books (@recluse_books) presents an Evening with P.C. Verrone (@pat.the.carroll), a free literary lecture, part of Rashid Johnson, “Stage,” 2026 \n \n▪️ Friday, August 21 at 6 pm: @SwanStrings presents Jess Garland, part of Rashid Johnson, “Stage,” 2026 \n \n▪️ Saturday, August 22 at noon: “TCB - The Toni Cade Bambara School of Organizing,” a free film screening and discussion presented by The Communiversity Village (@communiversity.village) and BOB of DFW (@bobofdfw) \n\nVisit themodern.org/calendar to learn more about all our upcoming events and programs.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-03","ld":4,"dl":"2026-09-27","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Miks on näitusel „Kristi Kongi. Kromaatiline triiv“ nii palju treppe? Vaata videost, ku...","k":"exhibition","s":"2026-05-25","e":"2026-09-30","st":"01:00","et":null,"u":"kumukunstimuuseum","c":"Tallinn","co":"","p":"https://www.instagram.com/p/Da2Dl9jFY-l/","x":"Miks on näitusel „Kristi Kongi. Kromaatiline triiv“ nii palju treppe? Vaata videost, kuidas kunstnik nende tähendust avab.\n\nSeoses Kumu juubelisuvega on Kristi Kongi näitus ja muuseumi siseõu 25. maist kuni 30. septembrini avatud ka esmaspäevadel, kui ülejäänud muuseum on suletud. Igal esmaspäeval kell 15.00 toimub muuseumitöötaja lühitutvustus näitusel.\n\n/\n\nWhy are there so many stairs in the exhibition “Kristi Kongi. Chromatic Drift”? Watch the video to hear the artist explain their meaning.\n\nIn connection with Kumu’s 20th anniversary summer, Kristi Kongi’s exhibition Chromatic Drift and the museum’s inner courtyard will also be open on Mondays, when the rest of the museum is closed, from 25 May through 30 September. Every Monday at 1:00 p.m., a museum staff member gives a brief introduction at the exhibition. \n\n@kristikongi @annmirjam @marihuntarchitects @kogogallery #kumu #kumuartmuseum #kumuexhibition #kristikongi #chromaticdrift","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":-52,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"#CANMadrid ¡Abrimos aplicaciones para CAN Art Fair Madrid 2027!⁠ Plazo de aplicación: 9...","k":"fair","s":"2026-06-09","e":"2026-09-30","st":null,"et":null,"u":"canartfair","c":"Madrid","co":"","p":"https://www.instagram.com/p/DZXAHGoE7iS/","x":"#CANMadrid ¡Abrimos aplicaciones para CAN Art Fair Madrid 2027!⁠ Plazo de aplicación: 9 de junio a 30 de septiembre de 2026⁠.⁠\n⁠\nApplications are now open for CAN Art Fair Madrid 2027!⁠ Application period: June 9 to September 30, 2026⁠.⁠\n⁠\nTras más de una década de historia en Madrid, y después de consolidar CAN Art Fair como una de las citas imprescindibles del calendario de la Semana del Arte madrileña, seguimos mirando hacia adelante. ⁠\nEn Contemporary Art Now creemos en el arte que nace del ahora, en los nuevos lenguajes, en las estéticas que rompen moldes.⁠\n⁠\nTe esperamos del 4 al 7 de marzo de 2027 en @mataderomadrid para celebrar la 11ª edición de CAN Art Fair Madrid.⁠\n⁠\n⁠\nAfter a decade of history in Madrid, and having established CAN Art Fair as one of the must-attend events on Madrid Art Week’s calendar, we continue looking forward.⁠ At Contemporary Art Now, we believe in art that emerges from the present moment, in new languages, in aesthetics that break the mold.⁠ ⁠\n⁠\nWe look forward to seeing you from March 4 to 7 2027, at @mataderomadrid to celebrate the 11th edition of CAN Art Fair Madrid.⁠\n⁠\nAplicaciones en el link de nuestra bio⁠.⁠\nApply in the link of our bio⁠.⁠\n⁠\n#CANArtFairMadrid #CANMadrid2027⁠","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-09","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This summer in the Hamptons, discover works by Robert Nava (@robertnava7), Robert India...","k":"talk","s":"2026-08-01","e":"2026-10-03","st":"11:00","et":null,"u":"pacegallery","c":"Southampton","co":"United States","p":"https://www.instagram.com/p/Dbbdxh1CbEV/","x":"This summer in the Hamptons, discover works by Robert Nava (@robertnava7), Robert Indiana (@robertindiana), Arlene Shechet (@arleneshechet), and Paul Thek at Peter Marino Art Foundation (@petermarinoartfoundation), The Parrish Art Museum (@parrishartmuseum), and The Watermill Center (@watermillcenter).\n-\n\"Robert Nava\"\nthrough October 3\nBrunch with Bob: Robert Nava in conversation with Bob Colacello and Peter Marino\nSaturday, August 1 at 11 AM\nPeter Marino Art Foundation\nSouthampton\n\nRobert Indiana\n\"ONE Through ZERO (The Ten Numbers)\" (1980–2003)\nthrough January 13, 2027\nThe Parrish Art Museum\nWater Mill\n\nArlene Shechet, \"Dawn\" (2024)\nthrough March 2027\nThe Watermill Center\nWater Mill\n\nPaul Thek in the exhibition:\n\"The Disappearance of Landscape:\nOakleyville, 1964–2022\"\nAugust 29, 2026 – March 20, 2027\nThe Watermill Center\nWater Mill\n-\nAdd these to our your itineraries when going out east.\n\n#RobertNava #RobertIndiana #ArleneShechet #PaulThek #Sculpture #ContemporaryArt","r":false,"b":null,"af":fals modernesalzburg \nJuly 3 - October 4, 2026\nOpens July 3\n\nGeorgia Gardner Gray, Flock, 2026, Oil on canvas, 120 × 160 cm, Photo by kunstdokumentation.com\n\n@_g_g_g_ \n@sadiecoleshq \n@regenprojects \n@croynielsen","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-01","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Still on view at the SCAD Museum of Art until October 4, “The Sky I Keep”, Othiana Roff...","k":"exhibition","s":"2026-07-14","e":"2026-10-04","st":null,"et":null,"u":"khgaleria","c":"Mexico City","co":"","p":"https://www.instagram.com/p/DayDfiqIE4B/","x":"Still on view at the SCAD Museum of Art until October 4, “The Sky I Keep”, Othiana Roffiel’s first solo museum exhibition in the United States, curated by Brittany Richmond.\n\n@othianar\n@scadmoa\n\n“Mexico City–based artist Othiana Roffiel (SCAD B.F.A., painting, 2012) presents luminous paintings exploring the interconnectedness of the human body and the cosmos. Rather than relying on direct references, Roffiel allows her mind–body connection to guide the work. Forms emerge from subconscious memory and imagination, creating a visual language that is both playful and profound. The works’ surfaces vary like terrain on a map: brushstrokes glint with oil, as choppy as sea currents, while other areas are raw and chalky, with the pigment’s grit leveled like topsoil. These horizonless compositions evoke epic and intimate views. Floating forms, reminiscent of moons or limbs, are surrounded by stippling marks recalling sand, raindrops, or stars, while soft gradients suggest transitions, whether cellular or planetary in scale.\n\nRoffiel’s paintings bear witness to the spectacle of nature, capturing both its vastness and the intimate impression it leaves on the individual. By embracing the abstract and symbolic, Roffiel channels ambiguity as a generative force, inviting viewers to freely associate. Her paintings bridge landscape and self, transforming the act of looking into a meditation on moments we hold close and images that linger in our minds.”\n\n— Curatorial text by Brittany Richmond\n@b_rich___\n\nExhibition views courtesy of SCAD Museum of Art.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"If in Warsaw: Imran Perretta's FVU-commissioned work '15 days' features as part of the ...","k":"exhibition","s":"2026-07-17","e":"2026-10-04","st":null,"et":null,"u":"filmvidumbrella","c":"Warsaw","co":"","p":"https://www.instagram.com/p/DbS6-2wGiCS/","x":"If in Warsaw: Imran Perretta's FVU-commissioned work '15 days' features as part of the artists' first solo exhibition in Poland, \"All of Us or None\", at Ujazdowski Castle Centre for Contemporary Art 🎬\n\n'15 days' is rooted in the artist’s time spent in northern France with people displaced after the dismantling of the migrant camp near Calais – known as the ‘Jungle’ – in 2016. The camp had provided temporary shelter for thousands of people from Sudan, Afghanistan, Eritrea and Syria, fleeing war, persecution and economic instability. Perretta focuses on the experience of prolonged suspension, placing fragile temporariness at the centre and emphasising the dignity of those living on the margins of Europe’s political reality. @imranperretta \n\n🎟 £9 / 45 PLN\n📆 17 July 2026 – 4 October 2026 \n📍 Ujazdowski Castle Centre for Contemporary Art\n🔗 Find out more on our website under 'What's On', link in bio!\n\n--\n\n'15 days' was commissioned for the Jerwood/FVU Awards 2018: Unintended Consequences, a collaboration between Jerwood Arts and Film and Video Umbrella. FVU is supported by Arts Council England. \n\n#fvu #filmvidumbrella #imranperretta #warsaw #movingimage #filmandvideoumbrella","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":-10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Co-produced by Fluentum on the occasion of Manifesta 16 Ruhr, Julian Irlinger’s “Chrono...","k":"exhibition","s":"2026-07-22","e":"2026-10-04","st":null,"et":null,"u":"fluentumcollection","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbGLIJXjfyQ/","x":"Co-produced by Fluentum on the occasion of Manifesta 16 Ruhr, Julian Irlinger’s “Chronotopia” (2026) takes the history of Kulturkirche Liebfrauen as its point of departure. It uses the style of mid-century modern animation to portray architects who seem to have no control over the drawings and environments that change around them. \n\nTake a trip to the Ruhr area, to see Irlinger’s film in full length. “This is not a church”, the 16th edition of the nomadic biennal is running through October 4, 2026, across various locations in Essen, Gelsenkirchen, Bochum, and Duisburg. \n\n@manifestabiennal \n\nCredit: Julian Irlinger, Chronotopia, 2026, Manifesta 16 Ruhr, Kulturkirche Liebfrauen, Duisburg, installation view. Courtesy the artist. Photo: Manifesta 16 Ruhr / Ivan Erofeev","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"While many artists are crafting their work, they tend to forget how they’re evolving an...","k":"exhibition","s":"2026-08-05","e":"2026-10-04","st":null,"et":null,"u":"1202magazine","c":"","co":"","p":"https://www.instagram.com/p/Dbq2zqsiTzU/","x":"While many artists are crafting their work, they tend to forget how they’re evolving and transitioning in their lives as they complete different pieces. For @othianar, The Sky I Keep, which is on view at @scadmoa until October 4, is a body of work that has helped shape her visual language and identity today.\n\nMany of the pieces have been exhibited together, but never all of them in the space, as they are artworks created between 2021 and 2025. Seeing them in one space made Roffiel realize that, regardless of where she was in her life, the pieces in The Sky I Keep show the connections between before—recurring forms, gestures, and ideas that always remained constant.\n\nWords by @marisakalilbarrino \nPhoto Courtesy of @scadmoa \n\nRead more about the exhibition at the link in our bio and 1202magazine.com!","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"VIENNA – Tony Cokes, Lynn Hershman Leeson, and Ulrike Müller are included in ‘Stellprob...","k":"exhibition","s":"2026-08-06","e":"2026-10-04","st":null,"et":null,"u":"hoffman.donahue","c":"Vienna","co":"","p":"https://www.instagram.com/p/DbsqAicljtv/","x":"VIENNA – Tony Cokes, Lynn Hershman Leeson, and Ulrike Müller are included in ‘Stellprobe: Collection Acquisitions from the Last Decade’ at the Belvedere Museum – On view through October 4\n\nBringing together more than 150 works acquired or donated to the Belvedere over the past decade, STELLPROBE presents the museum’s collection as an open-ended structure, with works from different periods placed in new and unexpected relation.\n\nThe exhibition includes Cokes’ Could you visit me in dreams? (2018), Hershman Leeson’s The Electronic Diaries of Lynn Hershman Leeson (1984–2019), and Müller’s Rug (por ahora) (2022).\n\nOrganized by Stella Rollig and Luisa Ziaja, with exhibition architecture by Heimo Zobernig.\n\nInstallation view “STELLPROBE: Collection Acquisitions from the Last Decade, in a Display by Heimo Zobernig” Photo: Johannes Stoll / Belvedere, Vienna\n\n#LynnHershmanLeeson #UlrikeMuller #TonyCokes #Stellprobe #Belvedere21 @belvederemuseum @lynn.l.leeson @cokes_tony","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"#onview","k":"exhibition","s":"2026-07-09","e":"2026-10-05","st":null,"et":null,"u":"liarummagallery","c":"Naples","co":"","p":"https://www.instagram.com/p/DbJHlXrIZVX/","x":"#onview \n\n“Gli anni. Capitolo 3” is on view at the Madre Museum, Naples, featuring works by Ilya and Emilia Kabakov.\n\nPart of an evolving exhibition exploring key moments in Naples’ recent art history, the show brings together works from the Madre Collection and important public and private collections.\n\nInspired by Annie Ernaux’s “The Years”, Gli anni reflects on art as a lasting form of memory, preserving the stories and experiences of its time.\n\nCurated by Eva Fabbris in collaboration with Marta Federici, Laura Mariano, and Alberta Romano.\n\n“Gli anni. Capitolo 3”\n📍Madre Museum, Naples.\n🗓️9 July - 5 October, 2026\n\n📷 Ilya e Emilia Kabakov, Gli anni. Cap. 3. Episodi di storia dell’arte a Napoli, a cura di Eva Fabbris con Marta Federici, Laura Mariano e Alberta Romano, installation view, museo Madre, Napoli 2026. Courtesy museo Madre, foto Amedeo Benestante.\n\n#liarumma #liarummagallery #IlyaandEmiliaKabakov @ilyaemiliakabakov @museomadre @eva.fabbris @marta.federici @alberta_romano_","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":-14,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The idea of wind has surfaced a few times in the imageries we have made throughout the ...","k":"exhibition","s":"2026-08-08","e":"2026-10-09","st":"13:30","et":null,"u":"infoandupdates","c":"Shenzhen","co":"","p":"https://www.instagram.com/p/DbYa4cjDmXa/","x":"The idea of wind has surfaced a few times in the imageries we have made throughout the years. In 2020, for the exhibition identity of “Study of Things” at Guangdong Times Museum, we depicted wind as a current of air weaving through curtains as it crossed a house from one windowsill to another. Hopefully, the viewer would almost feel the summer breeze just by looking at the image. In many residential towers across Southern China, apartments are oriented to capture prevailing winds, allowing natural ventilation to soften the region’s scorching summers. Wind is always present, yet we rarely take notice, unless exaggerated. Instead, we perceive it through the movement of other things. We look to objects around us to confirm its presence.\n\nThe air-conditioning unit is an emblematic feature of these parts of China (the South). When we first visited Shenzhen’s Nantou Old City’s space in May 2026, one of the first things that caught our attention was how the heat pump motors of two air-conditioning units disrupted the otherwise pristine wall of the temple that would become one of the exhibition venue for the fifth iteration of the award. Because we wanted this edition of the visual identity to reflect the physicality of the site, we decided to incorporate the same elements that define the built environment of the Nantou district: tiled façades, air-conditioning units, and suspended structures. As we all experience increasingly warmer summers, the act of “temperature conditioning”has become a recurring theme across contemporary art and design. A notable example is the recent Tromarama’s “Turn On #2”, presented as July’s Midnight Moment in Times Square.\n\nAWARD360° BEST 100 EXHIBITION\nOpening: August 8, 13:30\nPublic Opening: August 8 – October 9 (Closed on Mondays; open as usual during public holidays.)\nVenue: No.83 & RE-Gallery, Nantou City, Nanshan District, Shenzhen\nExhibition Design: Studio Pianpian He and Max Harvey and the design360 team \n@infoandupdates @aoaooooooooo_ @design360magazine \n3D modeling: @seagull_wzz and Feng Junjie\n\n#深圳 #广东","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"D-Day 開門迎客！","k":"exhibition","s":"2026-08-08","e":"2026-10-09","st":null,"et":null,"u":"award360","c":"Shenzhen","co":"","p":"https://www.instagram.com/p/DbyU41pm6b1/","x":"D-Day 開門迎客！\n\nAward360° BEST 100展於今天正式開幕，感謝今天前來的大家。展覽將在深圳南頭古城持續開放至10月9日。\n\nAward360° BEST 100 Exhibition officially opened today.\nThank you to everyone who joined us for the opening!\nThe exhibition will remain open at Nantou Ancient City in Shenzhen until October 9.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Soothsayer III, 2024","k":"other","s":"2026-06-26","e":"2026-10-11","st":null,"et":null,"u":"litokattou","c":"Nantes","co":"","p":"https://www.instagram.com/p/Dbfd5VQgYh2/","x":"Soothsayer III, 2024\n\nSoothsayers at @fracdespaysdelaloire \n26 June - 11 October\ncurated by @ludovic_delalande \n\nPhoto: @fanny.trichet \n\n🍂","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":-36,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"Installation views of ‘South Eastern South’, 2025 under the perpetual look of ‘Soothsay...","k":"exhibition","s":"2026-06-26","e":"2026-10-11","st":null,"et":null,"u":"litokattou","c":"Nantes","co":"","p":"https://www.instagram.com/p/DbNVW4_gBFm/","x":"Installation views of ‘South Eastern South’, 2025 under the perpetual look of ‘Soothsayers I, II, III’ at @fracdespaysdelaloire 🌘\n\n‘Soothsayers’ 26 June - October 11 on view at FRAC des Pays de la Loire in Nantes-Carquefou curated by @ludovic_delalande \n\nPhotos: Fanny Trichet\n\n*South Eastern South, 2025 4k software based real-time algorithmic video, HD sound, commissioned and produced by @pcai_polygreen","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-25","ld":-29,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"‘Soothsayers’ my solo exhibition at @fracdespaysdelaloire curated by @ludovic_delalande","k":"exhibition","s":"2026-06-26","e":"2026-10-11","st":null,"et":null,"u":"litokattou","c":"Nantes","co":"","p":"https://www.instagram.com/p/DbDHLB9gFzS/","x":"‘Soothsayers’ my solo exhibition at @fracdespaysdelaloire curated by @ludovic_delalande\non view from June 26th to October 11th \n\nSouth Eastern South, 2025, 4K software based real-time algorithmic video, HD sound \nComissioned and produced by @pcai_polygreen \n\nSoothsayers I, II & III, 2024/25\n\nPhotos: Fanny Trichet","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":-25,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"“Drops of sweat, shiny pearls, the most honest jewellery.”","k":"exhibition","s":"2026-06-27","e":"2026-10-11","st":null,"et":null,"u":"lenamemrich","c":"Osnabrück","co":"","p":"https://www.instagram.com/p/Da1-znysjwt/","x":"“Drops of sweat, shiny pearls, the most honest jewellery.”\n\nLena Marie Emrich transforms the cloister of the former monastery at Kunsthalle Osnabrück into a sensuous parcour of mirrors, bronzed light, fragmented, laughter and exposed interiors. The hallway becomes more than a passage. It becomes a body, a spine, a threshold. Across kinetic sculptures, translucent surfaces, bronze reflections and a poem moving through twelve windows, the exhibition opens a space between protection and vulnerability, touch and hesitation, architecture and skin.\n\nLena Marie Emrich\nI left the window open for you\n27.06.2026–11.10.2026\nKunsthalle Osnabrück\nCurated by Nina Diel\n\n@kunsthalleosnabrueck @nina_diel @kunstforum_international","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":-19,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Installation view at Crash, Crush @ioam_beijing","k":"performance","s":"2026-07-11","e":"2026-10-11","st":null,"et":null,"u":"smugh.uker","c":"Shanghai","co":"","p":"https://www.instagram.com/p/DbXPV0kCD4t/","x":"Installation view at Crash, Crush @ioam_beijing \n\nOn view from 11th Jul to 11th Oct 2026\n\nThrilled to finally present 10 selected works and archives from 駱駝祥子 Luò Tuó Xiáng Zi, a long-term mobile project that I have been curating, creating artwork for, and developing together with the one and only Didi driver Laochen inside his e-hailing car in Shanghai since 2023.\n\nThe selected part of the project at ioam unfolds across videos, sound, coding, installations, window film, folding book, performance documentation, and an Itasha car makeover, exploring the car as both a personal space and a moving site of social encounters.\n\nTo bring the exhibition closer to the experience of an actual car ride, and with the generous help of curators Lea @caoliyao_lea and Huiyi @deepairline , we collected multiple car wrecks and components from crashed vehicles around Beijing, incorporating these traces of damaged mobility into the exhibition space.\n\nHuge thanks to all the artists who made this project possible, including those whose works could not be presented this time. Special thanks to the curators and Inside-Out Art Museum for inviting me to bring this project, which has been growing outside institutional spaces, into the white cube and encounter a new audience.\n\nHopefully, we can continue developing 駱駝祥子 Luò Tuó Xiáng Zi further. Today, ride-hailing drivers have become a new form of mobile workers shaped by the platform economy, forming a vast yet largely invisible infrastructure of contemporary urban life.\n\nPhoto credit: Fang Yongfa","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":-18,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Mari Hunt räägib arhitekti rollist näituse kujundamisel. Kuidas sünnib ruum ja millise ...","k":"exhibition","s":"2026-07-30","e":"2026-10-11","st":null,"et":null,"u":"kumukunstimuuseum","c":"Tallinn","co":"","p":"https://www.instagram.com/p/DbaGnXfDQij/","x":"Mari Hunt räägib arhitekti rollist näituse kujundamisel. Kuidas sünnib ruum ja millise loogika järgi külastaja selles liigub?\n\nNäitus „Kristi Kongi. Kromaatiline triiv“ ootab külastajaid 11. oktoobrini.\n\n/\n\nMari Hunt talks about the role of the architect in designing an exhibition. How does a space come into being and according to what logic does a visitor move through it?\n\nThe exhibition “Kristi Kongi: Chromatic Drift” is open to visitors until October 11.\n\n@marihuntarchitects @marihunt_ @kristikongi #kumu #kumuartmuseum #kumuexhibition #kristikongi #chromaticdrift","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Avasta näitust kunstniku ja kuraatori pilgu läbi!","k":"exhibition","s":"2026-08-07","e":"2026-10-11","st":null,"et":null,"u":"kumukunstimuuseum","c":"Tallinn","co":"","p":"https://www.instagram.com/p/Dbus8bTiBRd/","x":"Avasta näitust kunstniku ja kuraatori pilgu läbi!\n\nKuula audiogiidi ning liigu näitusel koos kunstnik Kristi Kongi ja kuraator Ann Mirjam Vaiklaga, kes avavad teoste tausta ja värvide maailma.\n\n🎧 Parima kogemuse saamiseks soovitame kasutada kõrvaklappe.\n\nNäitus \"Kristi Kongi. Kromaatiline triiv\" on Kumu kunstimuuseumis avatud 11. oktoobrini 2026.\n\nAudiogiidi leiad QR koodi abil või Eesti Kunstimuuseumi Youtube kanalilt.\n\n/\n\nDiscover the exhibition through the eyes of the artist and curator!\n\nListen to the audio guide and explore the exhibition together with artist Kristi Kongi and curator Ann Mirjam Vaikla, who share the stories behind the works and invite you into Kongi's vibrant world of colour.\n\n🎧 For the best listening experience, we recommend using headphones.\n\nThe exhibition “Kristi Kongi. Chromatic Drift“ is on view at Kumu Art Museum until 11 October 2026.\n\nYou can access the audio guide by scanning the QR code or on the Art Museum of Estonia's YouTube channel.\n\n@kristikongi @annmirjam @marihuntarchitects @kogogallery #kumu #kumuartmuseum #kumuexhibition #kristikongi #chromaticdrift","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"My films Why Look at Animals and The Hybrid Between a Wolf, Dog and Human are screening...","k":"screening","s":"2026-07-03","e":"2026-10-17","st":null,"et":null,"u":"mmmaya_","c":"","co":"France","p":"https://www.instagram.com/p/DaVqkJWlpy3/","x":"My films Why Look at Animals and The Hybrid Between a Wolf, Dog and Human are screening as part of DRAW at Passerelle Centre d’art contemporain in Brest, France from July 3 through October 17 📽️🎞️✨ Thank you @soniak.jpg for the invitation and putting everything together and curating such a beautiful show ! \n\nGrateful to be included in this exhibition alongside so many incredible artists making time-based media in relationship to drawing.\n\nSiyu Chen - Ben Clement - Jordan James Kaye - Sonia Rosa Kahn - Hasabie Kidanu - Justine Lai - Nicola López - Jennifer Nuss - Maya Perry - Christine Rebet - Jessica Segall - Stipan Tadić -Sun Xun\n\n@cacpasserelle \n\nI’ll be leading two animation workshops this summer at @ctstategatewaygallery as part of my artist in residence. If interested please send me a dm and I’ll share more with you:)","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-03","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Ever found a 90s family photo next to a proud new refrigerator in the living room? A bl...","k":"exhibition","s":"2026-06-23","e":"2026-10-18","st":null,"et":null,"u":"fotografiska.shanghai","c":"Shanghai","co":"","p":"https://www.instagram.com/p/DZ7ASwOmwqA/","x":"Ever found a 90s family photo next to a proud new refrigerator in the living room? A blurry snapshot with Uncle McDonald, or a monitor glowing with Windows 97?\n\nLong before social media, these raw moments captured the collective optimism of a generation stepping into a brand-new world, all shot by everyday people.\n\nArtist and archivist Thomas Sauvin (@thomas_sauvin) has spent more than 15 years rescuing these memories from oblivion, which is known as the project \"Beijing Silvermine\" (@beijing_silvermine): “What I love most is participating in the life of the image. To give it an unexpected experience and purpose - one that takes it off the path it was destined for”.\n\nBy breathing new life into salvaged negatives, this exhibition highlights photography’s changing role in society. It shows how ordinary snapshots can acquire profound new meanings through artistic creation and cultural reflection.\n\nCurated by Holly Roussell (@rongsiyu), presenting projects developed with artists including Lei Lei (@leilei_animation), Kensuke Koike (@kensukekoike), Melinda Gibson (@melindajgibson), and Klara Källström (@klara_kallstrom) & Thobias Fäldt (@thobiasfaldt). “Beijing Silvermine: Archive Anthology” is on show now at Fotografiska Shanghai till 18 Oct, 2026. Come and reboot your memory storage with us.\n\n#fotografiska #fotografiskashanghai #beijingsilvermine #shanghaiexhibition #familyalbum\n\nEver found a 90s family photo next to a proud new refrigerator in the living room? A blurry snapshot with Uncle McDonald, or a monitor glowing with Windows 97?\n\nLong before social media, these raw moments captured the collective optimism of a generation stepping into a brand-new world, all shot by everyday people.\n\nArtist and archivist Thomas Sauvin (@thomas_sauvin) has spent more than 15 years rescuing these memories from oblivion, which is known as the project \"Beijing Silvermine\" (@beijing_silvermine): “What I love most is participating in the life of the image. To give it an unexpected experience and purpose - one that takes it off the path it was destined for”.\n\nBy breathing new life into salvaged negatives, this exhibition highlights photography’s changing role in society. It shows h","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-23","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"🏙️ Die Fotocollagen von Onorato & Krebs in der Ausstellung „Heimatflimmern“ zeigen irri...","k":"exhibition","s":"2026-07-20","e":"2026-10-18","st":null,"et":null,"u":"kunstmuseumsg","c":"Zurich","co":"","p":"https://www.instagram.com/p/DbA_LVUCDFu/","x":"🏙️ Die Fotocollagen von Onorato & Krebs in der Ausstellung „Heimatflimmern“ zeigen irritierende Architekturszenarien und thematisieren eine Gegenwart voller Widersprüche, Umbrüche und Spannungen.\n\n👉🏼 Erfahren Sie mehr über die verschiedenen Aspekte von „Heimat“ in der Ausstellung „Heimatflimmern“. Die Ausstellung ist bis zum 18. Oktober 2026 im Kunstmuseum St.Gallen Stadtpark zu sehen.\n\n//\n\n🏙️ The photo collages by Onorato & Krebs in the exhibition “Heimatflimmern“ (“Glimmers of Home“) depict unsettling architectural scenarios, addressing a contemporary reality full of contradictions, upheaval, and tension.\n\n👉🏼 Learn more about the different aspects of “home“ in “Heimatflimmern“ (“Glimmers of Home“). The exhibition is on view until 18 October 2026 at the Kunstmuseum St.Gallen Stadtpark.\n\n#kunstmuseumsg #kunstmuseum #swisspost #stadtpark #heimatflimmern\n\n📸 Taiyo Onorato (b. 1979, Zurich) & Nico Krebs (b. 1979, Winterthur), W11 and W5 (from the series ‘Futures’), 2020, Swiss Post Art Collection, photo: Sebastian Stadler","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-20","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"finally got my hands on one of those vintage vibrating “weight loss” belt machines 😤 in...","k":"exhibition","s":"2026-07-25","e":"2026-10-18","st":null,"et":null,"u":"rachelyoun","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DbOV0yVIIT4/","x":"finally got my hands on one of those vintage vibrating “weight loss” belt machines 😤 inspired by religious iconography and preachers sermonizing fire and brimstone at the podium with arms outstretched, this work cycles through bouts of writhing and vibrating with ecstasy \n\nI chastise my body, 2026\nmodified vibrating belt machine, modified neck massager, artificial orchids and leaves, artificial anthurium, steel cable, hardware, cycle timer\n\nas part of “Unruly Vessel” on view at @scuolapiccolazattere thru october 18\n\nslide 3 by Riccardo Banfi\nslides 4–5 by @g.i.a.c.o.m.o.b.i.a.n.c.o","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-25","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"‘It’s good to be reminded you’re part of the world’ 🌀","k":"performance","s":"2026-07-28","e":"2026-10-18","st":null,"et":null,"u":"differentclass.be","c":"Antwerp","co":"","p":"https://www.instagram.com/p/DbU9i4KM_-J/","x":"‘It’s good to be reminded you’re part of the world’ 🌀\n\nWe joined artist and performer Stine Sampers (@stine_diana) at @mhkamuseum to wander through Nicola L.’s exhibition, ‘When the Earth Turned the Other Way’.\n\nSpanning writing, performance, sound, and photography, Stine’s own practice deeply connects with Nicola L.’s intuitive and boundlessly collaborative spirit. She reflects on the freedom of making things together, the politics of ‘doing’, and what happens when we gather beneath a single cloak.\n\n📸 Video by @anaiskabore 🫰🏼\n\nNicola L. – ‘When the Earth Turned the Other Way’ is on view at @mhkamuseum until 18.10.2026.\n\n#differentclass #stinesampers #nicolal #mhka #antwerp","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"🏠 Mit „Heimatflimmern” zeigt das Kunstmuseum St.Gallen eine gemeinsame Ausstellung mit ...","k":"exhibition","s":"2026-07-30","e":"2026-10-18","st":null,"et":null,"u":"kunstmuseumsg","c":"Zurich","co":"","p":"https://www.instagram.com/p/Dba7fhsgjgz/","x":"🏠 Mit „Heimatflimmern” zeigt das Kunstmuseum St.Gallen eine gemeinsame Ausstellung mit der Kunstsammlung der Schweizerischen Post. Werke aus der Museumssammlung treten dabei in einen Dialog mit Werken aus der Sammlung der Post. \n\nMit 27 künstlerischen Positionen – vor allem aus der Schweizer Gegenwartskunst, ergänzt durch ausgewählte internationale sowie einzelne historische Werke – geht die Ausstellung einer ebenso aktuellen wie offenen Frage nach: Was kann „Heimat“ heute bedeuten? Die Kooperation steht im Zusammenhang mit der hundertjährigen Fördertradition der Schweizerischen Post.\n\n👉Entdecken Sie jetzt die Ausstellung „Heimatflimmern“ bis zum 18. Oktober 2026 im Kunstmuseum St.Gallen Stadtpark.\n\n//\n\n🏠 The Kunstmuseum St.Gallen presents “Heimatflimmern” (“Glimmers of Home”), a joint exhibition produced in collaboration with Swiss Post that sees works held by the museum entered into dialogue with works from the Swiss Post’s art collection. \n\nFeaturing 27 artistic positions, primarily from contemporary Swiss art but also including selected international works and a small number of historical works, the exhibition explores a question that is both timely and open ended: What can “home” mean today? With this collaboration, the Swiss Post is continuing its century-long tradition of supporting the arts.\n\n👉Discover the exhibition “Heimatflimmern” until 18 October 2026 at Kunstmuseum St.Gallen Stadtpark.\n\n#kunstmuseumsg #kunstmuseum #swisspost #heimatflimmern #stadtpark\n\n📸 Sebastian Stadler","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"Lucy Knight profiles Del LaGrace Volcano in today’s Guardian ahead of their exhibitions...","k":"exhibition","s":"2026-07-16","e":"2026-10-25","st":"18:00","et":"20:00","u":"autoitalialondon","c":"San Francisco","co":"","p":"https://www.instagram.com/p/Da0RLIfs9U3/","x":"Lucy Knight profiles Del LaGrace Volcano in today’s Guardian ahead of their exhibitions ‘Sensual / Mutual’ at Auto Italia, opening tomorrow, Thursday 16th July, 6-8pm, and ‘Love Bites Back’ at Edinburgh Arts Festival later this summer.\n\n“Back at the flat after our walk, they pull more of their prints out of drawers which are stickered with enticing labels such as “trans portraits”, “femmes of power” and “precious”. They roll back to lie on the living room rug as they share stories of their encounters with famous queer people, from selling a print to The Matrix co-creator Lilly Wachowski and rejecting lauded feminist Judith Butler’s request to have their portrait taken for free, to their brief Romeo & Juliet-esque love affair with a well-known journalist and activist (neither of their friendship groups approved of the relationship because of Volcano’s involvement in the S&M scene, which the journalist was very much not part of)”\n\n‘Sensual / Mutual’ continues until 25 October 2026, Thursday to Sunday, 12 - 5pm.⁠ Free entry.\n\n@trulydellagrace\n@lucyeleanorknight \n@guardian \n@aceagrams\n\nImage: Del LaGrace Volcano, ‘Scott’s Bar, Dykes on Bikes (from left, Gayle, Juanita, Della Grace (me) Barb, Kimo and Kath), San Francisco’, 1982.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This summer, Auto Italia presents ‘Sensual / Mutual’, the first major institutional sol...","k":"exhibition","s":"2026-07-16","e":"2026-10-25","st":"18:00","et":"20:00","u":"autoitalialondon","c":"San Francisco","co":"","p":"https://www.instagram.com/p/DaN0CNQDJWY/","x":"This summer, Auto Italia presents ‘Sensual / Mutual’, the first major institutional solo exhibition in the UK by Del LaGrace Volcano, and the 2026 Participation Artist Residency by Rose Nordin.\n\nSurfacing unseen bodies of work from the 1970s and 80s, ‘Sensual / Mutual’ focuses on Volcano’s time in San Francisco and Santa Fe, tracing queer, feminist, leather dyke, gender-variant and land-based communities in the process of making themselves visible.\n\nAcross June–November 2026, in partnership with Praxis for migrants and refugees and Kazzum Arts, Rose Nordin will collaborate with young migrants as co-authors, developing new artworks and a programme of talks and events exploring cultural memory and ancestral knowledge.\n\nFollow Auto Italia for further information and announcements relating to the residency.\n\nBoth projects are featured in Whitechapel Gallery’s Backyard Biennial: East, a free summer festival taking place across East London.\n\nSensual/Mutual\nDel LaGrace Volcano\n16 July – 25 October 2026\nPreview: Thursday 16 July, 6–8pm\n\n2026 Participation Artist Residency\nRose Nordin\nJune – November 2026\n\nAuto Italia\nFree and open to all.\n\nMore information via the link in our bio.\n\n@trulydellagrace \n@amokamok \n@whitechapelgallery","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-30","ld":16,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"👀 Now Open","k":"exhibition","s":"2026-07-26","e":"2026-10-25","st":null,"et":null,"u":"aranyaartcenter","c":"Qinhuangdao","co":"China","p":"https://www.instagram.com/p/DbS2LjIkl3x/","x":"👀 Now Open\nXu Zhen: Planetary Ease \n2026.7.26 – 10.25\nUpper Cloister, Aranya Jinshanling\n\n“Planetary Ease,” a solo exhibition by Chinese artist Xu Zhen at the Upper Cloister, Aranya Jinshanling, features the artist’s latest works from his “Planetary Shan Shui” and “Enlightenment” series. As technology reshapes reality, the artist turns instead to ink painting, a traditional system of perception, inviting us to view both the world and the self at a “planetary” scale, and to probe the possibilities of the state of ease.\n\nThis exhibition is organized by Associate Curator Wu Yiyang and Curatorial Assistant He Liqun.\n\n📷\nInstallation views, “Xu Zhen: Planetary Ease,” Upper Cloister, Aranya Jinshanling, July 26, 2026 - October 25, 2026.\nPhotography Yang Hao\n\n#aranya\n#xuzhen\n#aranyaartcenter\n#aranyajinshanling\n#uppercloister","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":-1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Zoe Whitfield interviews Del LaGrace Volcano for Wallpaper* about their current exhibit...","k":"exhibition","s":"2026-08-05","e":"2026-10-25","st":"12:00","et":"17:00","u":"autoitalialondon","c":"San Francisco","co":"","p":"https://www.instagram.com/p/DbqauAyMsbw/","x":"Zoe Whitfield interviews Del LaGrace Volcano for Wallpaper* about their current exhibition ‘Sensual / Mutual’ at Auto Italia, and sister exhibition ‘Love Bites Back’ at Edinburgh Arts Festival.\n\n‘It’s not lost on Volcano that the new shows concentrate on their early work, despite their career straddling five decades. ‘It does seem like there’s been a renaissance. The time I was most active doing this work – the ‘80s, ‘90s, early 2000s – is really resonating with people now,’ they note, negotiating the cycle of generational nostalgia aloud. [...] how the politics of those core decades correlates with the contemporary landscape, from the homophobia encouraged by Section 28 and the AIDS crisis, to today’s growing confidence in anti-trans and far right ideology. Volcano’s work, with its depictions of queer sex and attention to lesbians and gender-non conforming people specifically, has largely failed to break into the mainstream.’\n\n‘Sensual / Mutual’ continues until 25 October 2026, open Thursday to Sunday, 12 - 5pm.⁠ Free entry.\n\nImage: Del LaGrace Volcano, ‘S/M The Ultimate Gift, Rose & Devra, Scott’s, San Francisco’, 1981.\n\n@zoemaywhitfield \n@wallpapermag \n@trulydellagrace","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Carla Arocha and Stéphane Schraenen - ‘Segue’ is currently on view at the Marnix Galler...","k":"exhibition","s":"2026-07-23","e":"2026-10-30","st":null,"et":null,"u":"moniquemeloche","c":"Chicago","co":"","p":"https://www.instagram.com/p/DbI7_oCDumy/","x":"Carla Arocha and Stéphane Schraenen - ‘Segue’ is currently on view at the Marnix Gallery at ING Belgium through October 30, 2026. \n\nTheir practice is defined by a formal and dynamic reflection on the environments their artwork is installed in, both indoors and outdoors. In an environment marked by constant movement, Arocha-Schraenen has introduced a moiré effect, mirrored surfaces, and subtle environmental shifts to the gallery. \n\nThroughout all aspects of the exhibition, the viewer and artworks interact through physical experience, optical play, and subtly shifting perception. \n\n@arocha.schraenen","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"\"Architects of Being,\" an exhibition placing the work of Louise Nevelson and Esphyr Slo...","k":"exhibition","s":"2026-07-30","e":"2026-11-01","st":null,"et":null,"u":"pacegallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbjVJCeD2l0/","x":"\"Architects of Being,\" an exhibition placing the work of Louise Nevelson and Esphyr Slobodkina in dialogue, is open now at the New Britain Museum of American Art (@nbmaa56).\n-\nThrough their multimedia practices, Nevelson and Slobodkina challenged conventional definitions of art, abstraction, and architecture in mid-century America. Spanning the 1930s to the 1970s, \"Architects of Being\" foregrounds women who, undaunted by the challenges of a male-dominated art world, embraced interdisciplinary and experimental approaches to art and architecture as modes of self-fashioning and creative agency.\n-\nArchitects of Being: Louise Nevelson and Esphyr Slobodkina\nThrough November 1\nNew Britain Museum of American Art\nNew Britain, Connecticut\n-\nArtwork: Installation view: \"Architects of Being: Louise Nevelson and Esphyr Slobodkina\" at the New Britain Museum of American Art. July 30 - November 1, 2026. Organized by the Arkansas Museum of Fine Arts (@arkmfa). Photos Courtesy of the New Britain Museum of American Art.\n\nFollow the link in bio to learn more about #LouiseNevelson.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-02","ld":-3,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Carrying” is open at Museum Brandhorst (@museumbrandhorst) in Munich thru November 8, ...","k":"screening","s":"2026-05-14","e":"2026-11-08","st":null,"et":null,"u":"t1ffany4scal3","c":"Munich","co":"","p":"https://www.instagram.com/p/DYujYEVjvyH/","x":"“Carrying” is open at Museum Brandhorst (@museumbrandhorst) in Munich thru November 8, curated by Franziska Linhardt (@f_li). Scroll Figures # 1, # 4, # 7 and # 8 are visible through the museum window at all times of the day—from outside, to anyone passing, and most vivid after hours.\n\nScroll Figure 7 and 8, both new works, begin where that conversation with Franziska Linhardt began almost a year ago, drawing me into a comparative historical and political context I could not have arrived at alone. The thinking these works do is what that dialogue made possible 🖤📺\n\nThe child is a load-bearing figure. Every structure that needs one—the state, the family, the nation, the future—recruits her. “Scroll Figure 7” moves between East German “Sandmännchen” and a 1983 NDR “Tatort”: one putting the child to sleep inside a particular version of the world, the other organizing adult anxiety about disorder through the procedural form of the crime investigation.\n\n“Scroll Figure 8” takes addresses the figure of the Turk in German imaginary in television. Against a 1972 NDR \"Tatort,” the apparatus of West German television runs parallel to \"lmanya Acı Vatan\" (Şerif Gören, 1979), made for and shown within the Turkish-German community as a counter-image to the Germany broadcast. Ertem Eğilmez’s “Hababam Sınıfı” (1975) as a third: comedy, warmth, belonging performed as a joke not yet admitted as tragedy.\n\nFacing Türkenstraße, the monitors use privacy screens. From the side, the screen appears dead.\n\nMay 14, 2026 - November 8, 2026\nArtists: Hêlîn Alas, Cana Bilir-Meier, Louise Lawler, Kate Newby, Tiffany Sia, Jaune Quick-to-See Smith, and Leyla Yenirce\n\n© Photo: Bojan Ritan. Museum Brandhorst, Bayerische Staatsgemäldesammlungen, Munich","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-24","ld":-10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Our new exhibition “Reframing the Slasher: Teenage Sex and Death at Camp Miasma” is now...","k":"exhibition","s":"2026-08-07","e":"2026-11-08","st":null,"et":null,"u":"movingimagenyc","c":"New York","co":"","p":"https://www.instagram.com/p/DbbhYUCQtw4/","x":"Our new exhibition “Reframing the Slasher: Teenage Sex and Death at Camp Miasma” is now open! It features material related to Jane Schoenbrun’s acclaimed new horror comedy, pairing screen-used props from the fictional Camp Miasma franchise—VHS tapes, posters, merchandise, and a costume—with a series of movie posters selected by the director. \n\nFree admission. On view through November 8 at @movingimagenyc, presented by @mubi \n\nTeenage Sex and Death at Camp Miasma is in theaters August 7.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":8,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Before spoken language, there was mud, minerals, and microbial life in their slow chemi...","k":"exhibition","s":"2026-06-09","e":"2026-11-09","st":null,"et":null,"u":"anickayi_studio","c":"New York","co":"","p":"https://www.instagram.com/p/DZYOrHQkqG5/","x":"Before spoken language, there was mud, minerals, and microbial life in their slow chemical intermixing, wordless messages began to form. The mud has much to tell us and teach us. With my newest installation at Storm King, we’ve simply created the conditions for it to speak.\n\nMessage From the Mud is on view now @stormkingartcenter until November 9th, 2026.\n\nA big thank you to Nora Lawrence, Adela Goldsmith, and the entire team at Storm King for realizing this project.\n\nPhoto by Jason Lowrie & Matt Borkowski/BFA.com\n\n1: Algae-chic at the installation site\n2: Winogradsky columns emerging from the archaeological dig site\n3-4: Leading a grounding meditation session\n5: Some important members of the team that made Message From the Mud possible - Peter Pak, Adela Goldsmith, and Nora Lawrence","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-09","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The Online Marketplace of Ideas (2026) is an expansive survey of Internet culture. Toda...","k":"exhibition","s":"2026-05-04","e":"2026-11-22","st":null,"et":null,"u":"joshuacitarella","c":"Venice","co":"","p":"https://www.instagram.com/p/DZaMttPAHm0/","x":"The Online Marketplace of Ideas (2026) is an expansive survey of Internet culture. Today, alt-media has become quantitatively larger than legacy publications. As a result, any consensus or “mainstream” has fragmented into a chaotic digital landscape. With few exceptions, all items exhibited as part of the bazaar were selected and purchased online without the knowledge of their creators. Shown together, these objects convey the cultural and political incoherence of the present moment: infinite consumer choices with limited or no political agency.\n\nCreated by @joshuacitarella & @newmodels_io ( @cbcb2000 & @lilinternet ) with spatial design by @sub.global the installation includes more than 400 pieces of creator merch (t-shirts, hats, and other drop-ship basics), printed matter (books, journals, zines), and ephemera (nicotine pouches, Modafinil blister packs, mewing gum, etc), plus a few artworks (@sden023 @tibor.dieters @jennnital & @felstead.daniel Brad Troemel and others).\n\nThe exhibition is part of “Strange Rules,” curated by @matdryhurst @holly_herndon and @hansulrichobrist with @adrianarispoli_curator for @berggruendiedo | Venice, Italy. (May 4 - Nov 22, 2026)\n\nPhotography by @stemattea special thanks to sub (@bilbelingham Giulia Domenicioni Christopher Blohm @niklas.bildstein.zaar ) @666ultracorpo999 Maria Cecilia Belis and Elena Estratti. Thank you to the @do.not.research & NEW MODELS communities for inspiring and authoring many of these items.","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-10","ld":-37,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"We live in an era of growing anxiety regarding the exploitation of personal data by dig...","k":"exhibition","s":"2026-05-04","e":"2026-11-22","st":null,"et":null,"u":"berggruendiedo","c":"Venice","co":"","p":"https://www.instagram.com/p/DZINzMmImiJ/","x":"We live in an era of growing anxiety regarding the exploitation of personal data by digital platforms. And yet, is it truly a disadvantage for us?\n\nCo-curators Mat Dryhurst and Holly Herndon use this provocation as a starting point to create their artwork: an installation designed to subvert our negative perception toward personal data collection, embracing that very fear to generate a shared, collective benefit.\n\n📹 Watch the full interview on Berggruen Arts&Culture Youtube Channel\n\n🏛️ “Strange Rules”, curated by Mat Dryhurst, Holly Herndon, Hans Ulrich Obrist with Adriana Rispoli\n📆 4 May – 22 November 2026\n📍 Palazzo Diedo, Venice\n\n#berggruendiedo #berggruenarts #StrangeRules #Venice #ProtocolArt","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-03","ld":-30,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Lydia Ourahmane will present a solo exhibition, ‘5 Works’, at the Nicoletta Fiorucci Fo...","k":"exhibition","s":"2026-05-05","e":"2026-11-22","st":"16:00","et":"20:00","u":"nicolettafioruccifoundation","c":"Venice","co":"","p":"https://www.instagram.com/p/DWliuHtjtbJ/","x":"Lydia Ourahmane will present a solo exhibition, ‘5 Works’, at the Nicoletta Fiorucci Foundation in Venice from 5 May to 22 November 2026, curated by Polly Staple. The exhibition will coincide with the 61st International Art Exhibition – La Biennale di Venezia.\n \nOurahmane’s new commission follows a residency at the Nicoletta Fiorucci Foundation in Venice. ‘5 Works’ is the direct result of negotiations, transactions and exchanges specific to historic sites and activist associations in Venice.\n \nOurahmane’s practice is focused on the real politics of daily life as much as exploring how art itself is valued and produced, distributed and displayed. We are living in a new world order in which waste collapses into sublime abstraction for many but remains a brutal reality for others. This requires a shift in perspective. What then is the form for our present moment? At what point does art insert itself into reality? In ‘5 Works’, matter is always negotiating its terms.\n \nLydia Ourahmane ‘5 Works’\n5 May – 22 November 2026\nOpening: Monday 4 May, 4-8pm\n \nNicoletta Fiorucci Foundation\nDorsoduro 2829\nVenice, Italy\n \n@nicoletta_fiorucci_london @emogirl4 @polly.staple @vittoria.totale @giorgiomastinu","r":false,"b":null,"af":false,"so":false,"pd":"2026-04-01","ld":34,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"« The machine comes from the church San Giovanni Crisostomo in Venice. In its previous ...","k":"exhibition","s":"2026-05-05","e":"2026-11-22","st":"11:00","et":null,"u":"nicolettafioruccifoundation","c":"Venice","co":"","p":"https://www.instagram.com/p/DaNWXi8AmAv/","x":"« The machine comes from the church San Giovanni Crisostomo in Venice. In its previous life this machine was used to illuminate a painting installed in the church by Giovanni Bellini ‘Saints Christopher, Jerome and Louis of Toulouse’, 1513. Saint Christopher is the patron saint of travellers. Apparently, he was very tall and is often depicted carrying a child on his shoulder ensuring safe passage across water. When I started working in Venice ‘passage’ became a focus for how matter moves between the spiritual and material world. Where does a form get caught in the net of perception? How does it become visible? Much like the light turning on, it is through an offering. And what we offer becomes the means for illumination. »\n\n‘5 Works’by Lydia Ourahmane is on view in Venice. \n\nFriday, Saturday, Sunday, 11am - 6pm (in July and August).\n\n5 May – 22 November 2026\n \nNicoletta Fiorucci Foundation\nDorsoduro 2829\nVenice, Italy\n \n@nicoletta_fiorucci_london @emogirl4 @polly.staple @giorgiomastinu @vittoria.totale \nPh @_marcocappelletti @marcocappellettistudio","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-30","ld":-56,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"‘5 Works’ by Lydia Ourahmane is now on view in Venice.","k":"exhibition","s":"2026-05-05","e":"2026-11-22","st":null,"et":null,"u":"nicolettafioruccifoundation","c":"Venice","co":"","p":"https://www.instagram.com/p/DX_zjpEAkkS/","x":"‘5 Works’ by Lydia Ourahmane is now on view in Venice.\n\nThe exhibition, curated by Polly Staple, follows Ourahmane’s residency at the Nicoletta Fiorucci Foundation, living and working in Venice since January 2026. One of the exhibition’s central premises is that many of the artworks are created in Venice. The artist has worked with Venetian craftspeople and technicians but also collaborated with organisations in the city of Venice and the surrounding region. These individuals and collectives continue to offer extraordinary expertise and comprise a thriving community, providing a concrete alternative to popular images of Venice as a city of tourism and in decline.\n\n‘5 Works’ operates as a series of encounters that unfold across the rooms of the Foundation’s building. The dormant void, contained energy, and its potential are concepts that Ourahmane uses as a dynamic within her work but also as a motif within the staging of the exhibition. In seemingly empty rooms the lights turn on and off or the aroma of cooking greets you. Towers of industrially processed bed linen contrast with a delicately handmade bead curtain.\n\nPh @_marcocappelletti @marcocappellettistudio \n\n5 May – 22 November 2026\n \nNicoletta Fiorucci Foundation\nDorsoduro 2829\nVenice, Italy\n \n@nicoletta_fiorucci_london @emogirl4 @polly.staple @vittoria.totale @giorgiomastinu","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-06","ld":-1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Opening next week in Venice: ‘5 Works’ by Lydia Ourahmane.","k":"exhibition","s":"2026-05-05","e":"2026-11-22","st":"16:00","et":"20:00","u":"nicolettafioruccifoundation","c":"Venice","co":"","p":"https://www.instagram.com/p/DXtpW9xgiSc/","x":"Opening next week in Venice: ‘5 Works’ by Lydia Ourahmane. \n\nThe exhibition, curated by Polly Staple, coincides with the 61st International Art Exhibition – La Biennale di Venezia.\n\nOurahmane’s practice is focused on the real politics of daily life as much as exploring how art itself is valued and produced, distributed and displayed. We are living in a new world order in which waste collapses into sublime abstraction for many but remains a brutal reality for others. This requires a shift in perspective. What then is the form for our present moment? At what point does art insert itself into reality? In ‘5 Works’, matter is always negotiating its terms.\n\nLydia Ourahmane ‘5 Works’\n5 May – 22 November 2026\nOpening: Monday 4 May, 4-8pm\n \nNicoletta Fiorucci Foundation\nDorsoduro 2829\nVenice, Italy\n \n@nicoletta_fiorucci_london @emogirl4 @polly.staple @vittoria.totale @giorgiomastinu","r":false,"b":null,"af":false,"so":false,"pd":"2026-04-29","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"’Things to Come’ by Maja Malou Lyse opens to the public tomorrow ★","k":"exhibition","s":"2026-05-09","e":"2026-11-22","st":null,"et":null,"u":"danishpavilion","c":"Venice","co":"","p":"https://www.instagram.com/p/DYFAz6_jHsk/","x":"’Things to Come’ by Maja Malou Lyse opens to the public tomorrow ★\n\nIn the exhibition, @habitual_body_monitoring2 draws on science and technology to stage the looming fertility crisis and a surprising study showing how erotic imagery can affect not only human senses but our very biology—questioning the power of the image and its significance for us as a species in an entirely new way.\n\nThe exhibition is curated by @the_chus_martinez and developed in collaboration with the architects @commonaccounts and the art collective @dis.\n\nExperience 'Things to Come' at @labiennale from May 9th to November 22nd 2026.\n\nPhotos: Ugo Carmeni.","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-08","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The Silence of the Mole","k":"exhibition","s":"2026-05-09","e":"2026-11-22","st":null,"et":null,"u":"sssitdownnn","c":"Venice","co":"","p":"https://www.instagram.com/p/DYeFcELjGbu/","x":"The Silence of the Mole\n\nJakub Jansa, Selmeci Kocka Jusko\n@jakub.jansa @selmecikockajusko\n\nCurated by Peter Sit @sssitdownnn\n\nCzech and Slovak Pavilion\n61st International Art Exhibition\nLa Biennale di Venezia @labiennale\n\nMay 9 – November 22, 2026\n\nCommissioner – Michal Novotný @michail_novotny \nVisual Identity – Jan Brož @imageneered\nExhibition views – Jan Kolský @jankolsky\n\nOrganized by: NGP @ngprague\nIn collaboration with: SNG sng_gallery\nSupported by: Ministry of Culture of the Czech Republic @minusterstvokultury,\nMinistry of Culture of the Slovak Republic ministerstvo_kultury.sk\nPartner of the pavilion: J&T Banka\n@jtbanka_cz @jtbanka_art","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-18","ld":-9,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Our Artist at the Venice Biennale 2026","k":"other","s":"2026-05-09","e":"2026-11-22","st":null,"et":null,"u":"kodlcontemporary","c":"Venice","co":"","p":"https://www.instagram.com/p/DX9lIT1iGWo/","x":"Our Artist at the Venice Biennale 2026\n\nJakub Jansa – The Silence of the Mole\n\nCzech and Slovak Pavilion at the 61st Venice Biennale\n\nWe are pleased to announce that Jakub Jansa, represented by KodlContemporary, is participating in this year’s Venice Art Biennale. Together with the Slovak artistic duo Selmeci Kocka Jusko (Alex Selmeci and Tomáš Kocka Jusko), he presents the contemporary Czech and Slovak art scene in the national pavilion.\n\nCurated by Peter Sit @sssitdownnn , the project forms a cohesive whole that reaches beyond the Central European context\n\n9 May - 22 November 2026","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-05","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"We handed a camera to the curator of the French Pavilion at the Venice Biennale. This i...","k":"exhibition","s":"2026-07-21","e":"2026-11-22","st":null,"et":null,"u":"artdrunk","c":"Venice","co":"","p":"https://www.instagram.com/p/DbEpX4vjQjP/","x":"We handed a camera to the curator of the French Pavilion at the Venice Biennale. This is Myriam Ben Salah's (@myriambensalah) POV of Yto Barrada's (@ytobarrada) exhibition. Let us know in the comments what you think of this new format! \n\n\"Comme Saturne\" emerges through a process of experimentation rooted in association and constraint: one word evokes another, a technique opens the door to a myth, a color refers to a material history, and an error becomes a gesture. Watch on to discover more. \n\nYto Barrada: \"Comme Saturne\"\nCurated by Myriam Ben Salah\nUntil November 22\nGiardini della Biennale\nVenice 🇮🇹","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Time, repetition, and labour lie at the heart of Maria Taniguchi's practice.","k":"exhibition","s":"2026-07-24","e":"2026-11-22","st":null,"et":null,"u":"singaporeartmuseum","c":"Singapore","co":"","p":"https://www.instagram.com/p/DbpO4IjD32d/","x":"Time, repetition, and labour lie at the heart of Maria Taniguchi's practice. \n\nHear from the acclaimed artist as she reflects on the ideas, memories, and processes that shape her work, presented in her first solo museum exhibition in Singapore. \n\n🎨 𝘔𝘢𝘳𝘪𝘢 𝘛𝘢𝘯𝘪𝘨𝘶𝘤𝘩𝘪: 𝘈𝘧𝘵𝘦𝘳𝘪𝘮𝘢𝘨𝘦 \n📅 24 July – 22 November 2026 \n📍 Level 3, Gallery 3, SAM at Tanjong Pagar Distripark \n🔗 Link in bio to plan your visit \n\n#SingaporeArtMuseum #MariaTaniguchiAfterimage","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":-12,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"13 untitled paintings. Thousands of hand-painted cells. Nearly two decades of artistic ...","k":"exhibition","s":"2026-07-24","e":"2026-11-22","st":null,"et":null,"u":"singaporeartmuseum","c":"Singapore","co":"","p":"https://www.instagram.com/p/DbhSorYEZJ2/","x":"13 untitled paintings. Thousands of hand-painted cells. Nearly two decades of artistic practice.\n\nExperience 𝘔𝘢𝘳𝘪𝘢 𝘛𝘢𝘯𝘪𝘨𝘶𝘤𝘩𝘪: 𝘈𝘧𝘵𝘦𝘳𝘪𝘮𝘢𝘨𝘦, the acclaimed Filipino artist’s debut solo museum exhibition in Singapore.\n\nFor the first time at SAM, Taniguchi’s paintings, sculptures and moving-image works are brought together at scale, offering a fuller view of how she explores time, repetition, labour, memory and space.\n\nLook closely at the subtle variations within her iconic “brick paintings”. Walk among sculptures created in response to the gallery. Pause with four video works that introduce a rhythm to the exhibition.\n\nPresented within an open gallery layout, the works shift as you move between them, revealing Taniguchi’s enduring explorations of time, repetition, labour and space.\n\n𝘔𝘢𝘳𝘪𝘢 𝘛𝘢𝘯𝘪𝘨𝘶𝘤𝘩𝘪: 𝘈𝘧𝘵𝘦𝘳𝘪𝘮𝘢𝘨𝘦\n📅 24 July - 22 November 2026\n📍 Level 3, Gallery 3, SAM at Tanjong Pagar Distripark\n\nPlan your visit via the link in our bio.\n\n#SingaporeArtMuseum #ContemporaryArt #MariaTaniguchiAfterimage","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-02","ld":-9,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Amid this frenetic early twentieth-century referencing, his style morphs while heavily...","k":"exhibition","s":"2026-07-28","e":"2026-11-22","st":null,"et":null,"u":"flashartmagazine","c":"Venice","co":"","p":"https://www.instagram.com/p/DbVlzCDI-GP/","x":"“Amid this frenetic early twentieth-century referencing, his style morphs while heavily alluding to classical mythology. In this way, Kantarovsky becomes a kind of necromancer of artistic movements, conjuring and reconjuring the past into contemporary compositions, refusing to let them fade to time.” \n \nHit the link in the bio to read Sanya Kantarovsky “Basic Failure” at Istituto Veneto di Scienze, Lettere ed Arti, Palazzo Loredan, Venice, reviewed by @annalisejune. \n \nKantarovsky’s show “Basic Failure” is currently on view at Istituto Veneto di Scienze, Lettere ed Arti, Palazzo Loredan, Venice until November 22, 2026. \n \n#SanyaKantarovsky \n#AnnaliseJuneKamegawa \n#FlashArt355 \n#FlashArtMagazine","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Koch Gallery ’Stars in My Pocket’, Sculptural Installation, Sperm containers and mixed ...","k":"exhibition","s":"2026-07-28","e":"2026-11-22","st":null,"et":null,"u":"danishpavilion","c":"Venice","co":"","p":"https://www.instagram.com/p/DbVcb2ejD55/","x":"Koch Gallery ’Stars in My Pocket’, Sculptural Installation, Sperm containers and mixed media.\n\nIn the Koch Gallery, one can encounter a series of containers used for the transportation of sperm. Images of sperm-racing encounters are attached to the transportation containers, which have been placed in wall niches in the room almost in the manner of religious relics.\n\nExperience THINGS TO COME at @labiennale until November 22nd.\n\n@habitual_body_monitoring2 , @the_chus_martinez, @dis, @commonaccounts\n\n📷 Ugo Carmeni\n\n#labiennale #danishartsfoundation","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Rose Salane’s film “Mercurial New York,” pursues a near rite of passage for American ar...","k":"talk","s":"2026-07-30","e":"2026-11-22","st":null,"et":null,"u":"flashartmagazine","c":"New York","co":"","p":"https://www.instagram.com/p/DbaWaS_iIre/","x":"Rose Salane’s film “Mercurial New York,” pursues a near rite of passage for American artists: create a picture of New York, capturing its capricious, yet hopeful energy through the lens of the current generation. In conversation with Chiara Siravo, the artist talks the creation of the work for the Venice Biennale following Koyo Kouoh’s passing, philosopher and anthropologist Ernesto de Martino’s conception of loss, and the proximity of her work to Duchamp’s \n“Box in a Valise.” \n \nHit the link in the bio to read, “Mercurial New York,” a conversation between @rose.salane and @chiara_clarke from 355 Summer 2026. \n \nSalane’s
