 programme — drawing attention to the ordinary tools, formats and infrastructures through which cultural production comes into being.\n⠀\n⠀\n⚑ Apply to the open call: Kakilang is commissioning one artist with a conceptual or visual arts practice to develop a new body of work. The artist will receive £2,500 and a production budget. Open call deadline is 10 August 2026. \n⠀⠀\n☛ For full details, visit the link in bio:\nwww.kakilang.org.uk/2026-open-call-zero-material\n⠀\n⠀\n#zeromaterial #canyang @can.grafik","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":25,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"⚑ Open Call: Kakilang is commissioning one ESEA artist with a conceptual or visual arts...","k":"talk","s":"2026-08-10","e":null,"st":null,"et":null,"u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/Daf-B2Kjn9b/","x":"⠀\n⚑ Open Call: Kakilang is commissioning one ESEA artist with a conceptual or visual arts practice to develop a new body of work, with a public presentation in spring 2027. \n⠀\n𒀭zero material manifesto: \nIn an age of scarcity and excess, what forms of art making remain relevant? zero material recognises that each material, whether tangible or intangible, carries its own agency that awaits to be exercised creatively — informed by diasporic experience, it proposes unorthodox approaches like hacking, smuggling and piggybacking as artistic practice.\n⠀\n❥ Artist fee: £2,500 + production budget \n⛸︎ Open call deadline: 10 August 2026 \n⠀\n☛ For full details, visit the link in bio:\nwww.kakilang.org.uk/2026-open-call-zero-material\n⠀\n❛ Programme developed by Liang-Jung Chen @chen_liangjung \n❛ Visual identity designed by Can Yang @can.grafik \n⠀\n✤ With thanks to Rhine Bernardino @rhineandshine for joining the selection panel","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-07","ld":34,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"𒀭 Introducing our zero material open call selection panel: Chen Liang-Jung","k":"talk","s":"2026-08-10","e":null,"st":null,"et":null,"u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/DbYpuA_jsp9/","x":"𒀭 Introducing our zero material open call selection panel: Chen Liang-Jung\n\n@chen_liangjung is an artist and researcher interested in how artefacts and interface can be observed, redirected and reconfigured as creative material. Her practice creates intervention in the infrastructures that quietly shape everyday life.\n\nIn her project UK Indefinite Leave to Remain Application Fee (2025), Liang-Jung smuggles her own immigration process as artwork — treating bureaucratic experience and administrative labour as artistic media.\n\n⚑ zero material is the perfect opportunity for an artist with a conceptual or visual arts practice looking to develop a new body of work alongside a public presentation in Spring 2027.\n\n❥ Artist fee: £2,500 + production budget \n⛸︎ Open call deadline: 10 August 2026 \n⠀⠀\n☛ For full details, visit the link in bio\n⠀\n#zeromaterial #chenliangjung","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":12,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"𒀭Our Artistic Director Howl Yuan will be part of our zero material programme selection ...","k":"performance","s":"2026-08-10","e":null,"st":null,"et":null,"u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/DbI-Tmtq62m/","x":"𒀭Our Artistic Director Howl Yuan will be part of our zero material programme selection panel!\n\nHowl Yuan 原承伯 @howlyuan is a performance maker and cultural organiser. Working across live, site-responsive performance, installation and participatory practice, he creates intimate experiences that invite audiences to navigate memory, migration and belonging through walking, objects, conversation and shared encounters.\n\nThe image above is from [Waiting Between…], a constructed visual work using debris washed ashore to symbolise the experience of waiting as a condition of life on a border island. Rather than representing borders as sites of movement or transition, it explores the suspended temporality of a place shaped by stillness, repetition, and the slow passage of time.\n\n⚑ zero material is the perfect opportunity for an artist with a conceptual or visual arts practice looking to develop a new body of work alongside a public presentation in Spring 2027.\n\n❥ Artist fee: £2,500 + production budget \n⛸︎ Open call deadline: 10 August 2026 \n⠀⠀\n☛ For full details, visit the link in bio\n⠀\n#zeromaterial #howlyuan","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":18,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🎟️ TICKET GIVEAWAY 🎟️⁠","k":"exhibition","s":"2026-08-11","e":"2026-09-13","st":null,"et":null,"u":"berlinartlink","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbcrbwjEwIY/","x":"🎟️ TICKET GIVEAWAY 🎟️⁠\n⁠\nPresented at KW, 'Kyiv Biennial – A Bird That Cannot Land' is an exhibition centered on how we experience belonging in times marked by war, uncertainty and estrangement. Featuring over 40 intergenerational and international artistic positions, post-Soviet Eastern Europe is linked with Central and Southwest Asia and the Mediterranean; the contemporary condition of exile being their unifying thread. ⁠\n⁠\nThe works featured, including those by artists Neda Saeedi, Flaka Haliti and Geta Brătescu, are shaped by lived experiences echoing rupture, migrant memories, their affective architectures, and the historical traces that persist both in bodies and in the spaces we inhabit.⁠\n⁠\nWe’re giving away 1 x 2 tickets to ‘A Bird That Cannot Land.’ To enter the giveaway, follow @berlinartlink and @kwinstitutefcontemporaryart on Instagram, like this post, and tag a friend in the comments. The winner will be drawn on Tuesday, August 11 and contacted via DM.⁠\n⁠\nTo read more about the exhibition, on view until September 13, go to the link in bio.⁠\n⁠\nImage 1: Neda Saeedi: ‘Abyssal Zone,’ 2026. Installation view of the exhibition ‘Kyiv Biennial – A Bird That Cannot Land’ at KW Institute for Contemporary Art, Berlin 2026 // Courtesy the artist, photo by Frank Sperling⁠\n⁠\nImage 2: Flaka Haliti: ‘I SHOUT, YOUR ECHO BOUNCE, WHAT AM I?,’ 2023. Installation view of the exhibition ‘Kyiv Biennial – A Bird That Cannot Land’ at KW Institute for Contemporary Art, Berlin 2026 // Courtesy Christine König Gallery, Vienna, Deborah Schamoni, Munich and the artist, photo by Frank Sperling⁠\n⁠\nImage 3: Geta Brătescu: ‘The Traveler,’ 1970. Installation view of the exhibition ‘Kyiv Biennial – A Bird That Cannot Land’ at KW Institute for Contemporary Art, Berlin 2026 // Courtesy Collection of the Museum of Modern Art in Warsaw, photo by Frank Sperling⁠\n⁠\n@kwinstitutefcontemporaryart @kyivbiennial @neda_saeedi @flakahaliti_ @getabratescu.apparitions @christinekoenigchapter3 @deborahschamoni @msnwarszawa⁠\n#ticketgiveaway #ticketraffle #biennial #intergenerational #kwinstituteforcontemporaryart","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-31","ld":11,"dl":"2026-09-13","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Book Now: Join us on Wednesday 12th August, 6:30–8:30pm for ‘The Feminist Texts We Can’...","k":"reading","s":"2026-08-12","e":null,"st":"18:30","et":"20:30","u":"autoitalialondon","c":"London","co":"","p":"https://www.instagram.com/p/Da5YVBdjFl2/","x":"Book Now: Join us on Wednesday 12th August, 6:30–8:30pm for ‘The Feminist Texts We Can’t Read: How Non-Translation Silences East Asian Movements’, a reading and discussion group with artists Soo Hyun Lee and Riley Tu.\n\nThis session explores East Asian feminist thought that remains largely unavailable to English-speaking audiences.\n\nDrawing on key texts from Japan and South Korea, the session asks how translation shapes the circulation of feminist knowledge, and what is lost when influential writing remains untranslated. Through excerpts from works by Ueno Chizuko, Jinsook Kim and Soo Hyun Lee, participants will consider how colonial histories, linguistic hierarchies and publishing structures shape which feminist ideas, histories and political struggles become visible in global conversations.\n\nThe session also introduces feminist organising in South Korea following the 2016 Gangnam Station murder, including the sticky-note memorials that transformed public space into a site of collective testimony and protest.\n\nAlongside these texts and case studies, participants will examine the geopolitics of translating both fiction and non-fiction, exploring how different forms of writing carry cultural, political and emotional meaning across languages. Together, these materials offer insight into feminist resistance in East Asian contexts while opening broader questions about translation, visibility and transnational solidarity.\n\nStructured as a collective reading and discussion, the event invites participants to read, reflect and exchange ideas. No prior knowledge is required. All reading materials will be provided and introduced during the session.\n\nThis event is free to attend and will take place at Auto Italia. To register, follow the link in our bio.\n\n@riileytu\n@todayisoohyun\n\nImage 1: Soo Hyun Lee, ‘My Soft Hands Became a Sword One Day’, 2025 \nImage 2: Riley Tu, ‘Quantised Bits of Light till It Added to a Whole’, 2024","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-17","ld":26,"dl":"2026-08-12","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"🌊 As part of the programme that accompanies Elisa Giardina Papa’s solo exhibition, scho...","k":"screening","s":"2026-08-12","e":null,"st":"18:30","et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/DbdC56-G7z3/","x":"🌊 As part of the programme that accompanies Elisa Giardina Papa’s solo exhibition, scholar Damon R. Young (@damonyoung) brings together three films: L’Hippocampe, L’Atalante, and Moon’s Pool.\n\n“Together, these films trace an alternative history of the moving image below the surface. In dialogue with Giardina Papa’s exhibition, Aqua-cinema explores the queer resonances of the camera submerged in a translucent medium whose refractions loosen the hold of colonial narration and allow other lifeworlds, temporalities, and forms of relation to shimmer into view.” — Damon R. Young\n\n📍 Book @icalondon link in bio\n🗓 Wed 12 Aug, 6:30pm\n\n#Aquacinema #LHippocampe #LAtalante #MoonsPool #JeanVigo #Screening #ICA #Exhibitions","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-31","ld":12,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"We are delighted to announce our gallery summer project, ΠΝΕΥΜΑ PNEVMA, opening at The ...","k":"exhibition","s":"2026-08-12","e":"2026-08-24","st":"19:00","et":"22:00","u":"hannahbarrygallery","c":"Patmos","co":"Greece","p":"https://www.instagram.com/p/DaM2M8UAs2x/","x":"We are delighted to announce our gallery summer project, ΠΝΕΥΜΑ PNEVMA, opening at The Stavrakas House, The Patmos Trust, Patmos, 12–24 August 2026\n\nFollowing No Rush, the last show of Norman Hyams’ works at Hannah Barry Gallery and the first since his death in the Autumn of 2024, ΠΝΕΥΜΑ PNEVMA is the first international exhibition of Hyams’ work.\n\nTranslating as breath or spirit – a life-giving essence, ΠΝΕΥΜΑ PNEVMA presents a series of paintings depicting the Dodecanese and surrounding sea, many selected from Hyams’ studio in Shepherds Bush and previously unseen.\n\nThe exhibition will be open at The Stavrakas House, The Patmos Trust, Patmos, 7–10pm each day. Free entry, all welcome.\n\nNorman Hyams\nUntitled, 2024\nOil & acrylic ink on board\nTitled, signed and dated on verso\n42 x 46.5 cm\n\nNorman Hyams Summer studio, Patmos 2022 at the house of Michael and Marina of Greece \n\nNorman Hyams\nUntitled, date unknown\nOil on canvas on board\nStamped on verso\n20 x 24.9 x 0.2 cm","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-30","ld":43,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"From 12 August ΠΝΕΥΜΑ PNEVMA will open at the Stavrakas Mansion. Situated on Patmos, a ...","k":"exhibition","s":"2026-08-12","e":null,"st":null,"et":null,"u":"hannahbarrygallery","c":"Patmos","co":"Greece","p":"https://www.instagram.com/p/DbYhZN2CjH-/","x":"From 12 August ΠΝΕΥΜΑ PNEVMA will open at the Stavrakas Mansion. Situated on Patmos, a remote Greek island 8 hours from Athens, the exhibition presents a series of paintings depicting the Dodecanese and surrounding sea, many selected from Norman Hyams’ studio in Shepherds Bush and previously unseen. \n\nSave for the repeated silhouette of a diver, perhaps a self-portrait, the sea and the islands are the sole subjects of the exhibition. Painting on a range of materials available to him: dried paint palettes, fruit crates, sponges and plates, a number of the works present as halfway between object and painting, the rough surfaces mimicking the rugged landscape and changeable sea.\n\nNorman Hyams\nUntitled, date unknown\nStamped on verso\nOil on canvas\n20 x 15 x 1.8 cm","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":14,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Four weeks til the opening of Norman Hyams ΠΝΕΥΜΑ PNEVMA, our summer exhibition at the ...","k":"exhibition","s":"2026-08-12","e":"2026-08-24","st":null,"et":null,"u":"hannahbarrygallery","c":"Patmos","co":"Greece","p":"https://www.instagram.com/p/Da53n4uC2qO/","x":"Four weeks til the opening of Norman Hyams ΠΝΕΥΜΑ PNEVMA, our summer exhibition at the Stavrakas Mansion, The Patmos Trust, Patmos, Greece. The exhibition will run 12-24 August 2026.\n\nNorman Hyams \nUntitled, date unknown\nStamped on verso\nMixed media on paper on correx\n31.7 x 37.7 x 0.5 cm","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-20","ld":23,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Join us on Thursday, August 13 for the @octaviaprojnyc Summer Showcase, hosted at CARA ...","k":"other","s":"2026-08-13","e":null,"st":"17:30","et":null,"u":"cara_the_org","c":"New York","co":"","p":"https://www.instagram.com/p/Dbbl5epmKyT/","x":"Join us on Thursday, August 13 for the @octaviaprojnyc Summer Showcase, hosted at CARA for the fourth year!\n\n5:30pm | Doors\n6pm | Performances Begin\n\nThe Octavia Project uses speculative fiction as a lens through which to envision new futures and greater possibilities for our world; blending creative writing, art, science, and technology, their programming increases confidence and skills in a myriad of subjects while fostering leadership and community. The organization's inspiration and namesake is Octavia E. Butler, who broke barriers in writing and science fiction to become an award-winning and internationally recognized author.\n\nInspired by Octavia E. Butler's explorations of alternate futures and commitment to social justice, the Octavia Project offers summer programs which encourage imagination and community building. Their free summer camp for middle schoolers and summer institute for high schoolers bring together young women and trans and nonbinary youth to build new worlds.\n\nWhether you're a returning guest or joining for the first time, the Summer Showcase promises to leave you encouraged, inspired, and excited for the future. Join us to engage with student projects and hear student work performed by participants from across the Octavia Project’s multiple programs.\n\nRSVP encouraged via link in bio.\n\nPhotos from Octavia Project’s 2025 Summer Showcase: Ariel Portillo","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-30","ld":14,"dl":"2026-08-13","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"KYOKO KAGAWA RARITIES: LITTLE PEACH / ANZUKKO","k":"screening","s":"2026-08-13","e":null,"st":null,"et":null,"u":"anthologyfilmarchives","c":"New York","co":"","p":"https://www.instagram.com/p/DbLwO6okZeq/","x":"KYOKO KAGAWA RARITIES: LITTLE PEACH / ANZUKKO\nAugust 13\n\nThis summer Anthology, Asia Society, and The Japan Foundation, New York, join forces for a celebration of the career of actress Kyoko Kagawa, who for the past 75 years has been one of the shining lights of Japanese cinema.\n\nSpotlighting underseen and unseen works, “Kyoko Kagawa Rarities” begins with an opening night event at Anthology, featuring an exceedingly rare 35mm screening of Mikio Naruse’s LITTLE PEACH. Chris Fujiwara has described the film as both “a masterpiece of Naruse’s elliptical and unemphatic fifties style” and “one of the harshest of Naruse’s female melodramas.” Known for her iconic roles as the little sister or the enduring daughter, in LITTLE PEACH, Kagawa lends her tenderness to the beleaguered adult role of wife to a would-be novelist in perpetual collapse. Echoing SOUND OF THE MOUNTAIN in the many walks and talks with the great So Yamamura as paternal figure, with its buoyant bike rides and painful vision of marriage as social fate, the film also gestures at a spiritual afterlife for Ozu’s LATE SPRING.\n\nFollowing this opening night event, “Kyoko Kagawa Rarities” continues uptown at Asia Society through Sunday, August 16, with screenings of FAREWELL TO THE HIGHLAND STATION (Nobuo Nakagawa, 1951), TOKYO RENDEZVOUS (Chihiro Ikeda, 2008), FIVE SISTERS (Seiji Hisamatsu, 1954), and SHOZO, A CAT AND TWO WOMEN (Shiro Toyoda, 1956), all on imported 35mm prints and featuring newly translated subtitles.\n\n“Kyoko Kagawa Rarities” is programmed by Joseph Eusebio and Akinaru Rokkaku and is a co-presentation of Asia Society, Anthology Film Archives, and The Japan Foundation, New York.\n\nSee our website for full program details.\n\nAnd see @asiasociety's website for details for August 14-16, 2026.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":20,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Asia Society presents Kyoko Kagawa Rarities, a series of five remarkable films starring...","k":"screening","s":"2026-08-13","e":"2026-08-16","st":null,"et":null,"u":"asiasociety","c":"New York","co":"","p":"https://www.instagram.com/p/DbG6EUUEmkp/","x":"Asia Society presents Kyoko Kagawa Rarities, a series of five remarkable films starring the beloved Japanese actress, in partnership with @anthologyfilmarchives, screening in New York from August 13-16, 2026.\n\nA staple of Japanese cinema’s Golden Age, Kagawa had the distinction of working with all of Japan’s “Big Four” directors and her filmography reads like a roadmap to Japanese cinema; her characters meaningful guides in its living history.\n\nComprised entirely of imported celluloid, Kyoko Kagawa Rarities highlights discovery and revelation, and looks to give fresh color to a dear and familiar face. \n\nLearn more and grab tickets at the link in our bio 🎞️ \n\nNote: The first film in this series, Mikio Naruse’s Little Peach (Anzukko), will screen at Anthology Film Archives on August 13, 2026. \n\nGuest curated by Joseph Eusebio (@jsphsb) and Akinaru Rokkaku.\n\nProgrammed with support from the Japan Foundation, New York (@jf_newyork).","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-22","ld":22,"dl":"2026-08-16","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"PREPARATORY COURSE - EXTENTED DEADLINE 13 AUGUST","k":"exhibition","s":"2026-08-13","e":null,"st":null,"et":null,"u":"rietveldacademie","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DasuGl9j-8C/","x":"PREPARATORY COURSE - EXTENTED DEADLINE 13 AUGUST\n\nThese 3 graduates all started as preparatory students and there are still some spots left for the upcoming programme! \n\nThe Preparatory Course offers an intensive 25-week programme for young makers looking to develop their artistic practice and portfolio before applying to the academy, or for those who are curious about what studying at the Rietveld would be like.\n\nParticipants work on a wide range of assignments in art and design during three to four half-day classes each week. Throughout the course, you develop your portfolio and experiment with different approaches that can help you prepare for admission to the Basicyear – the first year of the Bachelor programme.\n\n📌 Open to applicants aged 17–25\n📌 Application deadline: 13 August 2026\n📌 More information via the link in bio\n\n--\nPhotos:\n1. Charlotte Dijkgraaf (@charlottedijkgraaf), Fine Arts\n2. Karina Kalantajevska (@kkalantajevska), designLAB\n3. Jorge Herrero Alberquilla (@loc0.xti), Graphic Design","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-12","ld":32,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"[LAUNCH PARTY] Join House House Magazine at Night Club \"101\" (101 Avenue A, NYC) on Fri...","k":"exhibition","s":"2026-08-14","e":null,"st":"19:30","et":null,"u":"househousemagazine","c":"New York","co":"","p":"https://www.instagram.com/p/DbGJQe5x27z/","x":"[LAUNCH PARTY] Join House House Magazine at Night Club \"101\" (101 Avenue A, NYC) on Friday, August 14 for the readings and party to celebrate the release of our forthcoming issue No. 3.\n\n100 FREE MAGAZINE COPIES, FIRST COME FIRST SERVED.\nFriday, August 14\n7:30 PM - Doors\n7:30-8:30 - Readings\n8:30-11:00 - Jazz alongside cocktail hours and party\nNight Club \"101\"\n101 Avenue A, New York, NY 10009\n-\nFeaturing readings by:\nJack Halberstam\nGrace Byron\nGeoffrey Nutter\nLaura Kolbe\n-\nCompletely free, open to everyone.","r":false,"b":"limited","af":true,"so":false,"pd":"2026-07-22","ld":23,"dl":"2026-07-22","ds":"capacity","ap":false,"rel":false,"q":false},{"now":false,"t":"Katažyna Jankovska (@kat.jankovska) yra „Rupert“ 2026 m. kuratorystės programos „Abipus...","k":"exhibition","s":"2026-08-14","e":null,"st":null,"et":null,"u":"rupert.vilnius","c":"Rotterdam","co":"","p":"https://www.instagram.com/p/DbU4l2jDmYU/","x":"Katažyna Jankovska (@kat.jankovska) yra „Rupert“ 2026 m. kuratorystės programos „Abipusės empatijos“ tyrėja, programoje bendradarbiaujanti su menininkais Maithu Bùi ir Saule Suleimenova. Programos metu ji kartu su menininkais Maithu Bùi ir Saule Suleimenova kuria kuratorinį tyrimą, kuriame nagrinėja, kaip menas gali atverti naujus požiūrius į kolektyvinę atmintį, smurto istorijas ir jų materialius pėdsakus. Šio tyrimo rezultatai bus pristatyti baigiamojoje viešoje programoje, kuri atsidarys rugpjūčio 14 d.\n\nKatažyna Jankovska – kuratorė, rašytoja ir tyrėja, gyvenanti tarp Roterdamo ir Vilniaus. Savo veikloje ji tyrinėja nuolat kintančius žmonių, technologijų, gamtinių sistemų ir infrastruktūrų santykius, ypatingą dėmesį skirdama eksperimentinėms meninėms praktikoms, nagrinėjančioms juslinį suvokimą, skaitmeninę kultūrą ir technologijų įtaką šiuolaikinei visuomenei. Ji yra leidinių If a Tree Falls in a Forest (2023) ir Off-Grid (2026) sudarytoja. Savo praktikoje ji jungia tyrimus, kuratorystę, rašymą, leidybą ir viešųjų programų kūrimą.\n\nEN\n\nKatažyna Jankovska (@kat.jankovska) is the Curatorial Fellow for Rupert’s 2026 Mutual Empathies programme, where she works alongside artists Maithu Bùi and Saule Suleimenova. Through the programme, she develops curatorial research in dialogue with the artists, exploring how contemporary artistic practices rethink collective memory, histories of violence, and their material traces, leading to the final public presentation opening on 14 August.\n\nKatažyna Jankovska is a curator, writer, and researcher based between Rotterdam and Vilnius. Her work explores the ever-evolving relationships between humans, technologies, natural systems, and infrastructures. She is particularly interested in experimental artistic practices that engage with sensory perception, digital culture, and the influence of technology on contemporary society. She is the editor of If a Tree Falls in a Forest (2023) and Off-Grid (2026). Her practice brings together research, curating, writing, publishing, and public programming.","r":fa u":"sharjahart","c":"Sharjah","co":"","p":"https://www.instagram.com/p/DbaqtH7IXZm/","x":"How do our perspectives shape the way we interpret images?\n\nThis August, join our Book Club Meetup as we explore how photographs are produced, perceived and understood. \n\nOur discussion will draw from books such as Susan Sontag’s ‘On Photography’, Tina M. Campt’s ‘Listening to Images’ and Ali Behdad’s and Luke Gartlan’s ‘Photography’s Orientalism’. You are  welcome to bring along other texts or references you think can enrich the conversation.\n\n📚 SAF Book Club Meetup: Theories of Photography\n📅 15 August 2026\n🕗 5:00 pm–7:00 pm\n📍 Photography Gallery, Al Manakh, Sharjah\n\nWhether you’ve read the featured books or are simply curious about the theme, you’re welcome to join the conversation.\n\nFree admission. Register now through the link in our bio.\n\nكيف تؤثر وجهات نظرنا في الطريقة التي نفسّر بها الصور؟\nانضموا إلينا في جلسة ملتقى نادي الكتاب لشهر أغسطس، لنناقش كيف تُنتَج الصور الفوتوغرافية، وكيف نتلقاها ونفهمها.\n\nتناقش الجلسة مجموعة من الكتب، من بينها «حول الفوتوغراف» لسوزان سونتاغ، و«الإنصات للصور» لتينا م. كامبت، و«الاستشراق في الفوتوغراف» لعلي بهداد ولوك غارتلان. كما يمكنكم إحضار نصوص أو مراجع أخرى تثري الحوار.\n\n📚 ملتقى نادي الكتاب في مؤسسة الشارقة للفنون: نظريات الفوتوغراف\n📅  15 أغسطس 2026\n🕗 5:00 – 7:00 مساءً\n📍 رواق الفوتوغراف، المناخ، الشارقة\n\nسواء قرأتم الكتب المختارة أو كنتم مهتمين بموضوع اللقاء، ندعوكم للحضور ومشاركتنا الجلسة.\n\nالدخول مجاني. سجّلوا الآن عبر الرابط الموجود في الوصف.","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-30","ld":16,"dl":"2026-08-15","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"BUCKLE UP LUBBOCK 🤠🔥","k":"launch","s":"2026-08-15","e":null,"st":"19:30","et":null,"u":"hullabaloocomedyco","c":"Lubbock","co":"","p":"https://www.instagram.com/p/DbLy3snSpKb/","x":"BUCKLE UP LUBBOCK 🤠🔥\nIMPROV MANIA IS BACK AND BETTER THAN EVER\nLubbock’s premiere comedy experience is back again. For fans of Whose Line Is It Anyway? Come watch the competitive improv comedy show where everything is made up on the spot.\nWho determines the winner?\nTHE AUDIENCE!\n\n📍Saturday, August 15th, 2026 at 7:30 PM\nShow info on HullabalooComedy.com\n\n#hullabaloocomedy #comedy  #lubbock #visitlubbock #lubbockintheloop","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-24","ld":22,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"It's almost time for the last Storm King concert of the summer!","k":"concert","s":"2026-08-15","e":null,"st":null,"et":null,"u":"stormkingartcenter","c":"New York","co":"","p":"https://www.instagram.com/p/DbV0TGFkQv0/","x":"It's almost time for the last Storm King concert of the summer!\n\nOn August 15, Sun Ra Arkestra (@sunraarkestraofficial) will take the stage with their blend of big-band swing, space-age jazz, singing, dancing, chanting, and Afro-pageantry. Since 1995 it has been led by alto saxophonist Marshall Allen—now 102—whose leadership continues as the Arkestra tours internationally. This ensemble has performed worldwide for more than 60 years, and now's your chance to see them in our art-filled landscape!\n\nKicking off the evening's festivities is DJ Ephraim Asili (@ephraimasili). Asili is an African American artist, filmmaker, DJ, and traveler whose work focuses on the African diaspora as a cultural force. \n\nGet ready for an unforgettable night or art and music! Tickets are available at the link in our bio.\n\nSun Ra Arkestra with DJ Ephraim Asili is co-produced by Storm King Art Center & Chosen Family Presents (@chosenfamilypresents)\n\nPhotos by Olivia Gloffke\nPhotos courtesy Sun Ra Arkestra and Ephraim Asili","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-28","ld":18,"dl":"2026-08-15","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Helena Uambembes Installation „How to Make a Mud Cake“, die erstmals im vergangenen Jah...","k":"exhibition","s":"2026-08-16","e":null,"st":null,"et":null,"u":"berlinbiennale","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbBRnY8iLr0/","x":"Helena Uambembes Installation „How to Make a Mud Cake“, die erstmals im vergangenen Jahr im Rahmen der 13. Berlin Biennale präsentiert wurde, ist aktuell in der Gruppenausstellung „Mémoires voyageuses“ im Kunsthaus Baselland zu sehen. In ihrem Video verbindet Uambembe ein Kinderspiel mit einem Kochtutorial und schlüpft in die Rolle einer Social-Media-Köchin, um sich dem anhaltenden Trauma des Kolonialismus zu stellen.\n\nHelena Uambembe’s installation “How to Make a Mud Cake”, first presented on the occasion of last year’s 13th Berlin Biennale, is part of the current group show “Mémoires voyageuses” at Kunsthaus Baselland. The video conflates a children’s game with an online cooking tutorial, as the artist assumes the persona of a social media chef to tackle the lingering trauma of colonialism.\n\nMémoires voyageuses\n22.05.–16.08.2026\n@kunsthausbaselland @uambembe \n\nCredit: Helena Uambembe, How To Make a Mud Cake, 2021/2026; May contain traces of… , 2025. Courtesy of the artist and Jahmek Contemporary, Ausstellungsansicht / Installation view Kunsthaus Baselland 2026. Foto / Photo: Gina Folly © Kunsthaus Baselland\n\nAls spielerischer und zugleich bissiger Kommentar zu Themen wie Verlust und Abrechnung verweist die Arbeit darauf, dass Trauma mehr ist als die Bürde Einzelner – es kann in den Boden einsickern und eine ganze Kultur durchziehen. Vervollständigt wird das Video durch eine Serie Küchentücher, die mit Warnhinweisen bedruckt sind. Hier ist ein direkter Humor am Werk, hinter dem sich jedoch eine tiefergreifende Wahrheit verbirgt. \n\nA playful but biting commentary on loss and reckoning, the work suggests that trauma is more than one person’s burden, that it can seep into the soil and permeate a culture. The video is rounded out with a series of ink prints on kitchen rags, listing out package warnings. Their humor is immediate, but their truth registers more deeply.\n\nCredit: Helena Uambembe, How To Make a Mud Cake, 2021/2025, Installationsansicht / installation view, 13. Berlin Biennale, Ehemaliges Gerichtsgebäude / Former Courthouse Lehrter Straße, 2025. © Helena Uambembe; Foto / photo: Marvin Systermans","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-20","ld":27,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Did you know that in the Netherlands, around a quarter (!) of all food is wasted every ...","k":"workshop","s":"2026-08-16","e":null,"st":null,"et":null,"u":"reparatieremise","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbVnE0NIvQ4/","x":"Did you know that in the Netherlands, around a quarter (!) of all food is wasted every year? This happens throughout the entire food chain, from production to consumption 🐌🍽️ In Amsterdam alone, households generate around 60 million kg’s of organic waste (fruit and vegetable scraps, food leftovers, and garden waste) every year 🍴🌽\n\nThat’s why we’re so excited for our next RR workshop: Considering Food Scraps with @the__land, hosted at de Pannenlikker’s kitchen space @wwp_tetterode.\n\nIn this workshop we will use commonly found dutch vegetables that are often only partially used, such as radishes, carrots, beets, leek and fennel, to create a meal using the entirety of the plants to create a simple, delicious and waste free meal. Participants do not need to bring anything except maybe a small tupperware in the chance that there are leftovers to take home :)  \n\n🍽️ Sunday, 16 August\n🐌 Pannenlikker Studio, Tetterode\n🌽 Registration opens on 6 August via the link in our bio.","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-30","ld":17,"dl":"2026-08-16","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Our video installation Tour Life opened the 30th of May 2026 at Fotografisk Center’s Br...","k":"exhibition","s":"2026-08-16","e":null,"st":null,"et":null,"u":"nellibabetti","c":"Berlin","co":"","p":"https://www.instagram.com/p/DZpH4mNAHBp/","x":"Our video installation Tour Life opened the 30th of May 2026 at Fotografisk Center’s Breaking platform. \n\n31.05 – 16.08.2026\nTour Life\nFotografisk Center, Copenhagen\n\nTour Life, 2026, Freja Sofie Kirk and Nellie Lindquist\n3’30” loop, HD video with sound, curtains\nScore: Oliver Nehammer @crunchy_influencer \nSound mix: Severin Black @severinblack \n\nThanks to Platzhirsch Event, whose stage brought us on a roadtrip in search of the backend of collective feeling. Driving super fast from Berlin to Düsseldorf hunting their hydraulic stage to make a work together was like a little tour in itself\n\nTour Life will stay open through summer, go see this special work, lastly thank you @fotografiskcenter for having us <3","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-16","ld":61,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Our Lost & Found: Cine(ma)s Latinoamericanos Re-Unidos series returns on Wednesday, Aug...","k":"launch","s":"2026-08-19","e":null,"st":null,"et":null,"u":"cinematropical","c":"New York","co":"","p":"https://www.instagram.com/p/DbbQ2b0FtEE/","x":"Our Lost & Found: Cine(ma)s Latinoamericanos Re-Unidos series returns on Wednesday, August 19 with the New York premiere of FUTURE FUTURE / FUTURO FUTURO, the visionary new feature by acclaimed Brazilian filmmaker Davi Pretto.\n\nSet in a haunting near-future Brazil where artificial intelligence has triggered a mysterious neurological crisis, FUTURE FUTURE follows a man adrift in a world of collapsing memory, deepening inequality, and technological control. \n\nBlending science fiction with political allegory, Pretto crafts a formally daring and hypnotic vision of a society on the brink.\n\n🎟️ Tickets and more information available at the link in bio.\n\n#FutureFuture #FuturoFuturo #DaviPretto #BrazilianCinema #AnthologyFilmArchives #NYCPremiere #CinemaTropical #LatinAmericanCinema","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-30","ld":20,"dl":"2026-08-19","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"𝓞𝓟𝓔𝓝 𝓒𝓐𝓛𝓛 ࣪ ˖₊˚⊹⋆ ౨ৎ ⋆. ࿐࿔ (ENG below)","k":"exhibition","s":"2026-08-20","e":"2026-09-06","st":"10:00","et":null,"u":"angelpuff_","c":"Elbląg","co":"","p":"https://www.instagram.com/p/DauQUTKAAI6/","x":"𝓞𝓟𝓔𝓝 𝓒𝓐𝓛𝓛 ࣪ ˖₊˚⊹⋆ ౨ৎ ⋆. ࿐࿔ (ENG below)\n\nSerdecznie zapraszam Cię do podzielenia się swoją historią i/lub przekazania kosmyka włosów. Włosy zostaną doczepione do instalacji, a fragmenty listów zostaną przeczytane podczas audycji @_carewaves_ we współpracy z @kingamolinska w Radio Kapitał 20.08.26 o godzinie 10:00.\n\nListy do audycji zbieram do 16.08.26. Sam projekt jest jednak otwarty i bezterminowy, listy i kosmyki włosów można przekazywać również po tej dacie.\n\nList i/lub kosmyk włosów możesz zostawić bezpośrednio w galerii, wrzucając je prosto do „Skrzynki na listy” lub przesłać do mnie @angelpuff_ lub do @kingamolinska. \n\nENG ˖₊˚⊹⋆ ౨ৎ ⋆. ࿐࿔ \n\nYou are warmly invited to share your story and/or offer a lock of your hair. The hair will be attached to the installation, and excerpts from the letters will be read during the @_carewaves_ radio in collab with @kingamolinska broadcast on Radio Kapitał on 20 August 2026 at 10:00 AM.\n\nI am collecting letters for the broadcast until 16 August 2026. However, the project itself remains open and ongoing, letters and locks of hair can also be contributed after this date.\n\nYou can leave your letter and/or lock of hair directly at the gallery by placing them in the “Mailbox” or send them to me @angelpuff_ or to @kingamolinska.\n\nCentrum Sztuki Galeria EL\nul. Kuśnierska 6\n82-300 Elbląg\nPoland\n\n˖₊˚⊹⋆ ౨ৎ ⋆. ࿐࿔ \n\nHairline, on view at @galeriael in Elbląg until September 6, 2026.\nCurated by @em_aku \n\n“Bird Cage”\n2025\nmetal, hair\n325 x 200 x 151 cm \n\n“Mail Box”\n2025\nmetal\n119 x 58 x 58 cm \n\nPhotos @pawelsobcza","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-13","ld":38,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"POST Nijmegen is looking for new hosts!","k":"exhibition","s":"2026-08-20","e":null,"st":null,"et":null,"u":"platform_post","c":"Nijmegen","co":"Netherlands","p":"https://www.instagram.com/p/Da4vK-8DDMq/","x":"POST Nijmegen is looking for new hosts!\n\nStarting 20 August, we're looking for volunteers to host our current exhibition Claiming The City: A Squatters' Allegory, and future exhibitions.\n\nSpend your late-summer days in an art space, chat with visitors, meet new people, and help welcome everyone to the exhibition. For now, we're at the Paraplufabriek, and from October we'll move to the NYMA Watertower.\n\nInterested? Swipe for more information!","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-17","ld":34,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"American experimental composer Stephen O’Malley @stephenomalley74 announces Avaeken, tw...","k":"exhibition","s":"2026-08-21","e":null,"st":"21:13","et":null,"u":"daisrecords","c":"New York","co":"","p":"https://www.instagram.com/p/DbDyIXOmyhU/","x":"American experimental composer Stephen O’Malley @stephenomalley74 announces Avaeken, two sides of immense, immersive, self-annihilating music, in collaboration with artist @banks_violette_616 - out August 21st. Listen to “21:13 (take 4)” now streaming, and preorder the album in gorgeous silver foil packaging. Link in bio. \n\nAvaeken preserves site-specific work: O’Malley installed Avaeken as part of Wish You Were Here, the exhibition by renowned American artist Banks Violette, underscoring the tension between presence and absence, life and loss. O’Malley and Violette have developed a distinct language of sound, space, and sculpture over the past two decades, reverberating the walls of world-class institutions from The Guggenheim and Centre Pompidou to prominent galleries such as Maureen Paley in London, Gladstone Gallery in NYC, and Antwerp’s TICK TACK, the brutalist space where Wish You Were Here unfolded in early 2026. Emerging now as an LP, Avaeken presents power and phenomena: low-frequency vibrations, deep oscillations, and phase cancellations that translate as innately effective in any environment. Violette’s visual expression — the impossibility of locating yourself within the loss of a friend and the broader decay of culture — now fills the LP sleeve and feels inextricable from O’Malley’s sound, both still without resolution.\n\nPhoto by Iris Delafortry","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":31,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Leaving the office early or looking for something to do on Fridays? 😎💼 Take advantage o...","k":"other","s":"2026-08-21","e":null,"st":null,"et":null,"u":"newmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/DZ5vXOtT5Ca/","x":"Leaving the office early or looking for something to do on Fridays? 😎💼 Take advantage of our Summer Fridays $10 ticket through Friday August 21.\n \nBook your tickets now using the link in bio 🔗","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-06-22","ld":60,"dl":"2026-08-21","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"𝗖𝗢𝗠𝗜𝗡𝗚 𝗨𝗣:  𝗡𝗘𝗫𝗧 𝗘𝗫𝗛𝗜𝗕𝗜𝗧𝗜𝗢𝗡 >>>","k":"exhibition","s":"2026-08-22","e":"2026-11-22","st":"16:00","et":null,"u":"kunstplatformlink","c":"Tilburg","co":"","p":"https://www.instagram.com/p/DbXgWGuM1sy/","x":"𝗖𝗢𝗠𝗜𝗡𝗚 𝗨𝗣:  𝗡𝗘𝗫𝗧 𝗘𝗫𝗛𝗜𝗕𝗜𝗧𝗜𝗢𝗡 >>>\n\nMemory keeps changing its mind and truth loses its value.\n\nSometimes I make things bigger just to see when they stop feeling familiar, sometimes I make art just because the pain makes me feel alive.\n\nYou are losing your mind\n\nDid I ask you?\n\nWe ended up making this exhibition together.\n\n𝙋𝙡𝙖𝙮𝙞𝙣𝙜 𝙬𝙞𝙩𝙝 𝘿𝙚𝙖𝙙 𝙏𝙝𝙞𝙣𝙜𝙨\nFolkert de Jong, Elle van Baaren, Max Onink\nOpening 22 August, 16:00\nOn view until 22 November\nLINK / Fratersteeg 1 / Zwolle\n\ndesign: @ellevanbaaren","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":24,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Now Open—‘Christian Marclay: The Clock’ at Los Angeles County Museum of Art, California","k":"screening","s":"2026-08-22","e":"2026-08-23","st":null,"et":null,"u":"paulacoopergallery","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DbTM6DzjnOX/","x":"Now Open—‘Christian Marclay: The Clock’ at Los Angeles County Museum of Art, California\n\nReturning to Los Angeles for the first time since 2015, Christian Marclay’s ‘The Clock’ is a 24-hour single-channel montage constructed from thousands of moments of cinema and television history depicting the passage of time, excerpted and edited together to create a functioning timepiece synchronized to local time wherever it is shown. ‘The Clock’ is on view until August 23 and LACMA will host a 24-Hour screening on Saturday, August 22. \n\nLearn more @lacma \n#ChristianMarclay #PaulaCooperGallery\n_\n[1] Christian Marclay, ‘The Clock’ (still), 2010, Single-channel video with sound, 24 hours © Christian Marclay. Courtesy Paula Cooper Gallery, New York and White Cube, London.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":26,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Playing with dead things","k":"exhibition","s":"2026-08-22","e":null,"st":null,"et":null,"u":"max_onink","c":"Tilburg","co":"","p":"https://www.instagram.com/p/Dak3ZpLIpoU/","x":"Playing with dead things \nopening 22 Aug at @kunstplatformlink with @folkert.dejong & @ellevanbaaren","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-09","ld":44,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🪩 寶島夜總會 強勢動感回歸 🇹🇼","k":"other","s":"2026-08-23","e":null,"st":"15:00","et":null,"u":"formosa.extravaganza","c":"New York","co":"","p":"https://www.instagram.com/p/Da6ExQ3BVE6/","x":"🪩 寶島夜總會 強勢動感回歸 🇹🇼\n⚡️FORMOSA EXTRAVAGANZA we so backkkk 🔥 8/23/2026 3PM-9PM 🔥🔥\n\n抓住今年夏天尾巴，紐約最盛大、最動感的臺灣人派對回來啦！🎟️ 早鳥票限量搶購中\n\n由 #紐約驕傲遊行台灣隊 🏳️‍🌈 和 #紐約金曲時光機 📀 共同舉辦的「寶島夜總會」被紐約臺灣人們敲碗敲不停，這次在夏天的尾聲將帶來夏日感最強的頂樓夕陽派對\n\n#寶島夜總會 集結紐約最強台味DJ卡司、華麗變裝皇后與專業舞者，帶來視覺與聽覺雙重衝擊，就要大家一起跳進來！尬台味！\n\n寶島夜總會將不只是一場派對，而是一場屬於臺灣魂的夏日盛典！\n\nNYC’s largest, most extravagant Taiwanese dance party you’ve been asking for is finally back back back again!! GRAB YOUR EARLY BIRD TIX NOW!!!\n\nPresented by @taiwanpride.nyc and @gm.timemachine, FORMOSA EXTRAVAGANZA is brining NYC’s Taiwanese community the summer rooftop sunset party experience, featuring the all-star DJ lineup, fierce drag performers, and electrifying dancers, FORMOSA EXTRAVAGANZA is THE PARTYYYY of the year for you to dance and sign like never before!\n\nMore than a party— FORMOSA EXTRAVAGANZA is a celebration of Taiwanese pride and summer vibes!\n\n—\n\n🗓️ 日期 Date: Aug 23, 2026\n⏰ 時間 Time: 3PM - 9PM\n📍 地點 Venue: The Crown (50 Bowery 21st Floor, New York, NY 10013) in Chinatown\n🎟️ 購票連結請查主頁 Tickets link in bio\n\nVisuals by @bellacai_design \n\n#FormosaExtravaganza #TaiwaneseParty","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-17","ld":37,"dl":"2026-08-23","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Introducing DJ @haoranchen_","k":"performance","s":"2026-08-23","e":null,"st":"15:00","et":null,"u":"formosa.extravaganza","c":"New York","co":"","p":"https://www.instagram.com/p/DbefgBvDhCX/","x":"Introducing DJ @haoranchen_\n\nHao 浩然是紐約雞尾酒吧 929 的主理人，這間酒吧以華語與粵語流行音樂為主題，結合創意雞尾酒，打造出獨特的文化體驗。他熱愛收藏實體唱片，致力於在海外推廣華語及粵語音樂文化，特別關注電子元素在華語音樂中的發展，期望讓這些旋律在舞池中也能綻放光芒。\n\nHao 曾於紐約知名場地 Elsewhere、林肯中心以及音樂節Bonnaroo擔任 DJ，播放包括蔡依林經典舞曲在內的多首華語熱門歌曲。他更將這股華語舞曲風潮帶回亞洲，於在上海、香港與台北三地演出，將充滿律動的華語音樂重新帶入亞洲舞池，展現文化的反向輸出與新一代華語音樂的多元樣貌。\n\nHao is the co-founder of 929, a New York cocktail bar themed around Mandopop and Cantopop, blending music and mixology into a one-of-a-kind cultural experience. A passionate record collector, Hao is dedicated to promoting Chinese-language pop music abroad—especially its electronic elements—with the goal of lighting up dance floors with sounds from the Mandarin-speaking world.\n\nHe has DJ at popular New York venues like Elsewhere and Lincoln Center and recently performed at the Bonnaroo Music Festival, spinning everything from Jolin Tsai’s iconic hits to other Mandarin club anthems, turning up the energy all night long.\n\nHao also brought this Mandarin pop wave back to Asia, performing in Shanghai, Hong Kong, and Taipei—reintroducing the dancefloor potential of Mandarin hits and showcasing a reverse cultural export full of fresh sounds and vibrant energy.\n\n—\n\n🪩 寶島夜總會 FORMOSA EXTRAVAGANZA 🇹🇼\n\n抓住今年夏天尾巴，紐約最盛大、最動感的臺灣人派對回來啦！NYC’s largest, most extravagant Taiwanese dance party you’ve been asking for is backkkk!\n\n🗓️ 日期 Date: Aug 23, 2026\n⏰ 時間 Time: 3PM - 9PM\n📍 地點 Venue: The Crown (50 Bowery 21st Floor, New York, NY 10013) in Chinatown\n🎟️ 購票連結請查主頁 Tickets link in bio\n\nPresented by @taiwanpride.nyc @gm_timemachine @eddie_eddwell @shawn_haohsiangli 聯合主辦","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-31","ld":23,"dl":"2026-08-23","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Introducing Presenter @taiwanpride.nyc 🇹🇼🏳️‍🌈🗽","k":"exhibition","s":"2026-08-23","e":null,"st":"15:00","et":null,"u":"formosa.extravaganza","c":"New York","co":"","p":"https://www.instagram.com/p/DbOle8clf3t/","x":"Introducing Presenter @taiwanpride.nyc 🇹🇼🏳️‍🌈🗽\n\nTaiwan Pride in NYC 是在紐約的臺灣人LGBTQ+社群，每年固定參與紐約市驕傲遊行，統籌超吸睛的臺灣花車隊！今年由妮妃雅策展設計的檳榔攤花車更是在紐約驕傲遊行所有隊伍中脫穎而出，以臺灣獨特的「檳榔西施」文化為主題，將傳統的檳榔攤打造為移動式的酷兒裝置藝術，在紐約街頭大放異彩！從 2024 年開始，我們也加入了 PrideFest 的行列，透過「臺灣彩虹攤位」讓更多人看見臺灣的多元、友善與包容。\n\nTaiwan Pride in NYC is a vibrant community of Taiwanese LGBTQ+ individuals based in New York. Every year, we participate in the NYC Pride March, organizing eye-catching floats that showcase Taiwanese culture.\n\nThis year, our float—curated and designed by Nymphia Wind—stood out among all entries in the parade. Centered around Taiwan’s unique “Betel Nut Beauty” culture, it transformed a traditional betel nut stand into a mobile now":false,"t":"Bonjour!🍷✨🍴","k":"other","s":"2026-08-28","e":null,"st":"19:00","et":"22:00","u":"lhucalubbock","c":"Lubbock","co":"","p":"https://www.instagram.com/p/DaNynGguEE2/","x":"Bonjour!🍷✨🍴\n\nLHUCA En Blanc is back! Join us for a French themed picnic on the Plaza & save the date for August 28 from 7-10pm!🧺\n\nMore details on tickets coming soon. 🤍\n\nà bientôt! 👋","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-06-30","ld":59,"dl":"2026-08-28","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"From August 28 til January 31 2027 the @museumrietberg is presenting the exhibition \"Re...","k":"exhibition","s":"2026-08-28","e":"2027-01-31","st":null,"et":null,"u":"sinokultur","c":"Zurich","co":"","p":"https://www.instagram.com/p/DbSZURtiDwe/","x":"From August 28 til January 31 2027 the @museumrietberg is presenting the exhibition \"Red: Masterpieces of Chinese Lacquerware\".\n\nDelicate lines, intense colours, shimmery surfaces: the Chinese lacquerware objects shown in this exhibition speak to a form of art refined and developed over centuries. Carved lacquers featuring as many as 150 layers of lacquer, objects with delicate mother-of-pearl inlays or artworks using the intriguing kuancai technique, revealing a quiet poetry that astonishes the viewer.\n\nWith its rich formal language and symbols, such lacquerwares offer insight into Chinese culture and beliefs. Favoured motifs in Chinese art such as dragons, bats, and winter plum blossom convey good wishes and tidings of joy understood in China without a need for words. The lacquerware displayed here are more than a feast for the eyes, inviting visitors on a journey through the history of Chinese culture.\n\nIn collaboration with LWL Museum of Art and Culture, Münster\n\nDate: August 28 2026 until January 31 2027\n\nLocation: Museum Rietberg, Gablerstrasse 15, 8002 ZURICH\n\n#museumrietberg #chineselacquerware #zurich","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":32,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Our new poster for the 4K restoration of Idrissa Ouedraogo’s classic of West African ci...","k":"exhibition","s":"2026-08-28","e":null,"st":null,"et":null,"u":"filmmovement","c":"New York","co":"","p":"https://www.instagram.com/p/DbTPE-juCcu/","x":"Our new poster for the 4K restoration of Idrissa Ouedraogo’s classic of West African cinema, SAMBA TRAORÉ, opening August 28 at @filmlinc before expanding!\n\nPoster designed by @la_moutique.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":32,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":false,"t":"🎟️ are now on sale for the great Burkinabé director Idrissa Ouédraogo's SAMBA TRAORÉ, w...","k":"exhibition","s":"2026-08-28","e":null,"st":null,"et":null,"u":"filmlinc","c":"New York","co":"","p":"https://www.instagram.com/p/DbY8mprFBe8/","x":"🎟️ are now on sale for the great Burkinabé director Idrissa Ouédraogo's SAMBA TRAORÉ, winner of the Silver Bear at the 1993 Berlinale! Newly restored in 4K, the film remains one of the decisive works of African cinema.\n\nSAMBA TRAORÉ opens at FLC on August 28! 🎟️: filmlinc.org/samba\n\nOuédraogo’s fifth feature begins with a botched service-station robbery and follows its lone survivor home, where a suitcase of stolen cash begins to look, at least from a distance, like providence. Back in his village, Samba (Bakary Sangaré) buys cattle, opens a bar with a childhood friend, marries the woman he once loved (Mariam Kaba) and becomes a father figure to her young son, even as rumor and conscience gradually expose the shaky terms of his new life. Ouédraogo, who in the 1990s began drawing his humanist realism in closer contact to genre stylism, deploys the film’s thriller shape to examine what guilt does to a man once his material life begins to flourish, and how a community comes to share, profit from, and finally question the lie on which that prosperity rests.","r":false,"b":null,"af":false
