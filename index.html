ofessionals.\n\nThis year, our jury of 20 established artists reviewed an impressive number of 2,500 submitted works. Their selection will be on show at Odapark and Marres from June 27 through August 23, 2026.\n \n🟢 Grand opening 🟢\nSaturday, June 27th, 2026\nOdapark: start 2PM (walk-in from 1:30PM, open till 5PM)\nMarres: walk-in from 5PM / 7:30PM doors close / 8PM exhibition closes\n \nLocations:\nOdapark, Merseloseweg 117, Venray \nMarres, Capucijnenstraat 98, Maastricht\n \n//\n\nMet dank aan @elisabeth_strouven_fonds","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-19","ld":39,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"‘I react to what’s happening around me, or within me. I’m just living in the world of t...","k":"exhibition","s":"2026-07-13","e":"2026-08-23","st":null,"et":null,"u":"differentclass.be","c":"Antwerp","co":"","p":"https://www.instagram.com/p/Daue-PAsphM/","x":"‘I react to what’s happening around me, or within me. I’m just living in the world of today, creating constantly’\n\n@yaqine.raw uses photography, text, and drawing to capture her intimate present. Like flipping through pages of a personal diary; fast, intuitive, and honest.\n\nAs part of this year’s .tiff selection, the yearly platform for emerging voices in photography at @fomuantwerp, Yaqine invites you to look closely at the world of today through the work of ten photographers. On view now at @fomuantwerp until 23.08.2026.\n\nFree for @differentclass.be members.\nVideo by @marianamachaado 😘 ⠀ \n\n#tiff2026 #FOMU #BelgianPhotography #YaqineHamzaoui","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-13","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Artist Kelly Akashi (@citizenbong) sits down with stonemason Christian Inga to talk abo...","k":"exhibition","s":"2026-07-24","e":"2026-08-23","st":null,"et":null,"u":"hyundai.artlab","c":"Seoul","co":"","p":"https://www.instagram.com/p/DbLg1mqDVsu/","x":"Artist Kelly Akashi (@citizenbong) sits down with stonemason Christian Inga to talk about how craft shaped the artist’s work presented in \"Hyundai Terrace Commission: Kelly Akashi.\"\n\n“Monument (Altadena)” (2026) is a towering recreation of the artist’s chimney, and Akashi explained that they wanted to “engage a lineage of masonry through craft traditions.” The luminous 6,550 pound (and nearly 3,000 kilogram) structure warps light in a weightless tribute to the home as shelter. \n\nInga told his team: “You have a chance to pay homage to your home.” The result, is a work that embodies what home means to everyone whose hand helped lay those bricks. \n\n“Hyundai Terrace Commission: Kelly Akashi,” is on view through August 23 on the fifth-floor terrace of the Whitney Museum of American Art.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Limburg Biennale making of 🌋Mounir Eddib is een Marokkaans- Belgische schilder en mixed...","k":"exhibition","s":"2026-07-31","e":"2026-08-23","st":null,"et":null,"u":"marres_maastricht","c":"Maastricht","co":"","p":"https://www.instagram.com/p/Dbdh4nsIoOB/","x":"Limburg Biennale making of 🌋Mounir Eddib is een Marokkaans- Belgische schilder en mixed media kunstenaar. Eddib won verschillende prijzen en werd begin dit jaar door NRC geselecteerd als “rijzende ster” in de beeldende kunst.\n\n‘Voor mij is dit een verzameling rijk aan symboliek. Spannende kunstwerken die zowel ondergronds als bovenaards aanvoelen: dat is de sfeer die ik wilde creëren. Mijn selectie heeft een zekere donkerte. Duisternis heeft voor mij een negatieve connotatie, terwijl donkerte een andere lading dekt. Het gaat om een intieme uitstraling, geborgenheid. Maar het is ook rauw. De werken vullen elkaar aan in een onderlinge dialoog.’\n\n🔋 De Limburg Biënnale is te zien t/m 23 augustus 2026 bij Marres & Odapark.\n\n//\n\nLimburg Biennale making of 🌋\nMounir Eddib is a Moroccan- Belgian painter and mixed media artist. Eddib has received several awards and was recently named a “rising star” in contemporary art by NRC.\n\n“For me, this is a collection rich in symbolism. Compelling artworks that feel both underground and otherworldly: that was the atmosphere I wanted to create. My selection carries a certain dimness. To me, darkness has a negative connotation, while dimness or shadow holds a different quality. It speaks to intimacy, to a sense of shelter. But it is also raw. The works complement one another through an ongoing dialogue.”\n\n🔋 The Limburg Biënnale is on view through August 23, 2026.\n\nFeaturing: @teryel.9 @melbosboom @veronica.degiovanelli @nynke_deinema @niekeline_der_kinderen @chrspzs @doeimar @carolinesarneel @iesschute @marjolein_van_veen @ans_verdijk @didianne @helmiebrugma @studiobekkers @judith_naomi__ig @broer","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Step into the studio of Austrian contemporary artist Sarah Bechter.","k":"exhibition","s":"2026-08-01","e":"2026-08-23","st":null,"et":null,"u":"kodlcontemporary","c":"Venice","co":"","p":"https://www.instagram.com/p/Dbfa-7OIlNf/","x":"Step into the studio of Austrian contemporary artist Sarah Bechter.\n\nSarah Bechter’s paintings begin with pigment scattered onto a wet canvas, allowing colour, movement, and intuition to guide the process. Instead of following a fixed composition, her figures gradually emerge, exploring themes of identity and belonging.\n\nBechter’s works are currently on view in the exhibition it’s giving real, on view until 23 August 2026. \n\nThe full studio visit is available on our website.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"‘There’s no answer to what I’m doing. It’s a gesture I’m offering – a gesture to save t...","k":"exhibition","s":"2026-08-04","e":"2026-08-23","st":null,"et":null,"u":"tate","c":"","co":"UK","p":"https://www.instagram.com/p/Dbn_itjiWv2/","x":"‘There’s no answer to what I’m doing. It’s a gesture I’m offering – a gesture to save the energy of the landscape, to move this energy, and to protect it’ – nora chipaumire 🏜️\n\nDrawing on the legends, stones and soil of her native Zimbabwe, nora chipaumire’s ‘gadzi’ is a hand-built environment made from wood, wire and cardboard. The artist describes it as a ‘living and breathing organism’.\n\nYou’re invited to experience the installation from within: look through the rocks, sit on the speakers to feel the vibrations, and move in response.\n\nInfinities Commission: nora chipaumire: Gadzi is free to visit until 23 August 2026 🪨 🌳 🌍 🔊","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"What if the tools we extend our bodies with did not depend on extraction or efficiency?...","k":"exhibition","s":"2026-08-06","e":"2026-08-23","st":null,"et":null,"u":"fomuantwerp","c":"Antwerp","co":"","p":"https://www.instagram.com/p/DbsMk1eCBY1/","x":"What if the tools we extend our bodies with did not depend on extraction or efficiency? In ‘Non Technological Devices’, Chloé Azzopardi (@qlobait) creates a series of imaginative objects: exoskeletons made of twigs, scallop shells turned into headphones, an organic snorkel. They resemble familiar devices, yet they don’t follow the logic of industrial perfection nor have a seamless design. \n\nMade from found natural materials, these fragile devices appear both protective and restrictive. \nThe work playfully invites us to think about why innovation is often seen as progress, even as it comes with an increasing environmental cost. What if progress could also mean imperfection? What if usefulness was not the only way to value something?\n\nThrough an interdisciplinary practice, Azzopardi creates a fictional world in which these devices might exist. Not as a solution, but as an offering to expand our imagination.\n\nThis series is currently on show at FOMU as part of the exhibition .tiff 2026 – Emerging Belgian Photography. \n\nChloé Azzopardi is one of the selected artists to join the Futures program (@futuresphotography). Each year, the FUTURES platform welcomes a dynamic group of emerging artists from around the world into a long-term program. With the support of Creative Europe @creative.eu Programme of the European Union.\n\n.tiff 2026 – Emerging Belgian Photography\nuntil 23.08.2026 at FOMU\nInfo & tickets on fomu.be\n\n.tiff magazine is for sale in the FOMU shop and via shop.fomu.be.\n.tiff is part of @futuresphotography - a collaboration between FOMU and a growing group of European partners\n\nAll images: ©️ Chloé Azzopardi \n\n#FOMUantwerp #tiff2026 #emergingbelgianphotography #Futuresphotography #ChloéAzzopardi\n@futuresphotography @creative.eu","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-08-06","ld":0,"dl":"2026-08-23","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Limburg Biënnale making of 👽 Kunstenaar Henri Jacobs legt uit hoe hij de poortkamer en ...","k":"exhibition","s":"2026-08-08","e":"2026-08-23","st":null,"et":null,"u":"marres_maastricht","c":"Maastricht","co":"","p":"https://www.instagram.com/p/DbxYl3RCNG7/","x":"Limburg Biënnale making of 👽 Kunstenaar Henri Jacobs legt uit hoe hij de poortkamer en het ijshuis cureerde naar aanleiding van het boek De Sirenen van Titan. 'De Tralfamadorianen observeren ons vanaf de maan Titan en wachten af. Want door te maken en kapot te maken heeft de mens een technologische ontwikkeling in gang gezet die de Tralfamadorianen zal helpen om weg te komen van Titan, namelijk het leveren van het reserveonderdeel voor hun ruimteschip… ‘ Het resultaat is een ruimte waar ongelooflijk veel divers werk te zien is. 'De Tralfamadorianen zijn ons dankbaar. \n\n🔋 De Limburg Biënnale is te zien t/m 23 augustus 2026 bij Marres & Odapark. \n\n// \n\nLimburg Biënnale making of 👽 Artist Henri Jacobs explains how he curated the gatehouse and the ice house in response to the book The Sirens of Titan. “The Tralfamadorians are observing us from the moon Titan and waiting. For by creating and destroying, humanity has set in motion a technological development that will help the Tralfamadorians escape from Titan: namely, the supply of spare parts for their spaceship…” The result is a space showcasing an incredible variety of works. The Tralfamadorians warmly thank us all for this achievement. \n\n🔋 The Limburg Biënnale is on view through August 23, 2026. \n\n Featuring: @studiobekkers @eliseberkvens @jordenboulet @deboradehaes @annevincentdijkstra @vincedonders @gaox.xx @aeconcepten @remyfrints @danielladegrood_art @inkwash_bymarvanhaasteren @ingevanheerde @hendricksmarly @ldenhertog @tinekekambier @_merlinkater @michielkluiters @maurien_k._ @kai_kuper @claudiatiliae @maartjemeerman @atelierlesdeuxgarons @antoinette.nausikaa @ralfpaulus72 @margotquaegebeur zealous @renereynders1253 @angelaastekeningen @eriktlaseca @rexytseng @lambertien @cindyvwo @moniquezuyderduin, Marjan Vos, Clemens de Vroome, Olga Schnitker, Cees Elzinga, Toos Nijssen, Henri Jacobs","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"IN CONVERSATION WITH","k":"talk","s":"2026-03-04","e":"2026-08-24","st":null,"et":null,"u":"projets.media","c":"Paris","co":"","p":"https://www.instagram.com/p/DWmGotyDaev/","x":"IN CONVERSATION WITH \n↘ Emma Lavigne (@emmalavigne_)\n\nDirectrice générale de la Collection Pinault (@boursedecommerce), Emma Lavigne présente l’exposition « Clair-obscur », réunissant une centaine d’œuvres qui interrogent, à partir de l’héritage du chiaroscuro, les enjeux du temps présent.\n\nSous le dôme de la Rotonde, Camata (2024) de Pierre Huyghe déploie un rituel funéraire filmé dans le désert d’Atacama. Laura Lamiel investit, quant à elle, les vingt-quatre vitrines du Passage.\nLes galeries accueillent des accrochages monographiques consacrés à Sigmar Polke, James Lee Byars et Victor Man, ainsi que des sections thématiques — brouillard, incandescence, ombre — qui mettent en dialogue des artistes modernes et contemporains de la Collection Pinault parmi lesquels Bill Viola, Bruce Nauman, Alina Szapocznikow, Yves Tanguy, Alberto Giacometti, Germaine Richier et Wolfgang Tillmans.\n\n•\n\nDirector of the Pinault Collection (@boursedecommerce), Emma Lavigne presents the exhibition “Clair-obscur”, bringing together around one hundred works that, drawing on the legacy of chiaroscuro, explore the issues of our present time.\nBeneath the dome of the Rotunda, Camata (2024) by Pierre Huyghe unfolds a funerary ritual filmed in the Atacama Desert. Meanwhile, Laura Lamiel takes over the twenty-four display cases of the Passage.\nThe galleries host monographic presentations dedicated to Sigmar Polke, James Lee Byars, and Victor Man, alongside thematic sections — fog, incandescence, shadow — that create dialogues between modern and contemporary artists from the Pinault Collection, including Bill Viola, Bruce Nauman, Alina Szapocznikow, Yves Tanguy, Alberto Giacometti, Germaine Richier, and Wolfgang Tillmans.\n\n📍 Bourse de Commerce — Pinault Collection \n2 rue de Viarmes, Paris 1er\n📆04.03.26 — 24.08.26\n\n@anaelpigeat\n@boursedecommerce \n@projets.media\n\nPRODUCTION & RÉALISATION\n@marcbeyneysonier\n@helloangels\n@cha_simon\ngongau\n@lucie.jpg\n@emma.brisot\n@instant.prod\n\n#ClaireObscur #PinaultCollection #BoursedeCommerce","r":false,"b":null,"af":false,"so":false,"pd":"2026-04-01","ld":-28,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"July 12 to August 24, 2026⁠","k":"exhibition","s":"2026-07-12","e":"2026-08-24","st":null,"et":null,"u":"oscamonline","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbD4RKkMjx3/","x":"July 12 to August 24, 2026⁠\nOSCAM Summer closure ⁠\n⁠\nOSCAM is currently closed for our summer break. From Sunday, July 12, 2026, until Friday, August 21, 2026, our team is taking some time to rest and recharge.⁠\n⁠\nWe look forward to welcoming you back on Saturday, August 22, 2026. When we reopen, our current exhibitions ‘Joy Soldiers: The Language’ and ‘Where We Land’ will still be on view.⁠\n⁠\nWishing everyone a wonderful summer, and we’re excited to welcome you again soon.⁠\n⁠\nClosed from: Sunday, July 12, 2026⁠\nReopening on: Saturday, August 25, 2026⁠\n@ OSCAM","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":-9,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"𝑳𝒆𝒔𝒔 𝑻𝒂𝒔𝒕𝒆, 𝑴𝒐𝒓𝒆 𝑺𝒑𝒊𝒓𝒊𝒕, an experimental exhibition of the work of long standing member...","k":"opening","s":"2026-07-24","e":"2026-08-24","st":"18:00","et":"21:00","u":"s_o_p_h_i_e_","c":"New York","co":"","p":"https://www.instagram.com/p/DbGVY_YEblj/","x":"𝑳𝒆𝒔𝒔 𝑻𝒂𝒔𝒕𝒆, 𝑴𝒐𝒓𝒆 𝑺𝒑𝒊𝒓𝒊𝒕, an experimental exhibition of the work of long standing members of Rubylith Darkroom, opens this Friday! I’m so proud of the work that’s gone into this show and what the exhibition reveals. How seven members share more than a darkroom; they share a curiosity about what photography becomes when they move beyond the expected and traditional, and start making decisions from the gut. \n \nFeaturing the work of:\nSara Danniu Beck \nZoe Elefterin\nTyler Guillen\nOlivia Harrison\nFran Kula\nSophie Schwartz\nCalli Westra\n\nThank you Calli, Fran, Lily, Olivia, Oz, Ruby, and Walker, and Zoe for putting this together !\n\nAnd shout out to Robert Frank ❤️\n\nJuly 24 - August 24, 2026\n130 Palmetto Street, Ground Floor, Brooklyn, NY\n(Follow the driveway on the left side of the building)\nOpening reception: Friday, July 24 from 6-9 pm\nOpen hours: Sundays 1-4 pm and by appointment (via DM or email rubylith@godspeedarts.org)","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Collisions of flesh and machine, revolving turbines and kinetic metal, #MireLee’s insta...","k":"exhibition","s":"2026-08-04","e":"2026-08-26","st":null,"et":null,"u":"contemporarylynx","c":"Vienna","co":"","p":"https://www.instagram.com/p/DbnOAY8jrMV/","x":"Collisions of flesh and machine, revolving turbines and kinetic metal, #MireLee’s installations can be described as rudely alive. Sonically abrasive and visually jarring, they cough up everything we strive to keep hidden. Rubber cables resemble intestinal tracts — the horrific proof of a body cut open, a body in pain. Unknown milky secretions drip from metallic crevices — surface arousal, a body in pleasure.\n\nWe talked to the artist following her new exhibition ‘The Heart of My Machine is Golden Lead’ at @viennasecession — on view until 26 August.\n\nRead more in the interview by @maggie_kuzan in the new issue of #MINDSCAPES 👉 click the link in our bio!\n\n.\n\nAll photos: Mire Lee, Installation view of The (PSYCHO)SOMATIC ZONE, Institut d’art contemporain Villeurbanne Rhône-Alpes, 2026. Courtesy of the artist and IAC. Photo: Thomas Lannes.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"That’s Hot – Summer 2026 at Kunsthalle Basel and S AM.","k":"exhibition","s":"2026-07-01","e":"2026-08-28","st":null,"et":null,"u":"kunsthallebasel","c":"Basel","co":"","p":"https://www.instagram.com/p/DbiCtZ-jUe7/","x":"That’s Hot – Summer 2026 at Kunsthalle Basel and S AM.\n\nSummer is back, and so are our summer opening hours. From July through August, Kunsthalle Basel and S AM open their doors until 10 p.m. Coming late pays off: admission is free in the last hour.\n\nOpening hours from July 01 to August 28, 2026:\nMon closed\nTue–Sun 4–10 p.m.\nFree admission 9–10 p.m.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-02","ld":-32,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This summer M+ is introducing special extended ho :"","p":"https://www.instagram.com/p/Da5mitVkszu/","x":"Warm Up starts next Friday, July 24. Join us to ring in summer the only way we know how. \n\nThe full lineup is now revealed, with @teedeejayyy closing out the season. Tickets are available for all dates. You know where to find us b2b Fridays, 4–10 p.m. through August 28.\n\n📸: @j.arbaje, @ryanmuir, @marissaalper","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-17","ld":7,"dl":"2026-08-28","ds":"run closes","ap":false,"rel":false,"q":true},{"now":true,"t":"The first Warm Up of the season starts tonight. It's sure to bring the heat.","k":"other","s":"2026-07-24","e":"2026-08-28","st":null,"et":null,"u":"momaps1","c":"New York","co":"","p":"https://www.instagram.com/p/DbLfYgfD4Bp/","x":"The first Warm Up of the season starts tonight. It's sure to bring the heat. \n\nThe lucky first 100 people in the courtyard will get an exclusive Warm Up 2026 fan. After that, you're on your own, thermally.\n\nSwing by Fridays through August 28, 4–10 p.m.\n\nGrab your tickets now at the link in bio, before prices go up at the door.","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-07-24","ld":0,"dl":"2026-08-28","ds":"run closes","ap":false,"rel":false,"q":true},{"now":true,"t":"Peter Bradley’s ‘Burning On’ in the Brooklyn Rail (@brooklynrail).","k":"exhibition","s":"2026-08-06","e":"2026-08-28","st":null,"et":null,"u":"karmakarma9","c":"New York","co":"","p":"https://www.instagram.com/p/DbtFmNDgC4T/","x":"Peter Bradley’s ‘Burning On’ in the Brooklyn Rail (@brooklynrail).\n\nAlfred Mac Adam writes: “The dazzler in the show is ‘Callisto,’ and 80 by 80-inch acrylic and pumice on canvas. In Greek mythology, Zeus morphed the nymph Callisto into the stars that compose the Great Bear constellation. Callisto is also a moon revolving, appropriately, around the planet Jupiter, Zeus’s Roman equivalent. Bradley replicates neither the nymph nor the moon but instead captures the explosive presence of a deity as a golden nebula. As we gaze into the painting’s myriad depths, we find color after color, a reconstituted universe where we may temporarily lose our identities.”\n\n‘Burning On’ is on view through August 28 at 549 West 26th Street. Read the full article linked in bio.\n\nAbove: Peter Bradley, ‘Callisto,’ 2026. Acrylic and pumice on canvas, 80 × 80 in.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This is your sign to save your best outfit for Warm Up tonight. Or repeat, we don't care.","k":"other","s":"2026-08-07","e":"2026-08-28","st":null,"et":null,"u":"momaps1","c":"New York","co":"","p":"https://www.instagram.com/p/Dbvy1EhDtud/","x":"This is your sign to save your best outfit for Warm Up tonight. Or repeat, we don't care.\n\nYou know where to be, Fridays through August 28. See you in the courtyard. \n\n—\n📸: Sam Wachs (@schmoomer) & Marissa Alper (@marissaalper)","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"Empty Gallery is pleased to present our first solo show with Shanghai based artist Ann ...","k":"opening","s":"2026-07-04","e":"2026-08-29","st":"18:00","et":"20:00","u":"emptygallery.hk","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DaFWO0UpPVY/","x":"Empty Gallery is pleased to present our first solo show with Shanghai based artist Ann Zhao. Both intimate meditation and trenchant diagnosis, Zhao’s exhibition attempts to grapple with what might be called the use and abuse of art for life.  Opening reception: Saturday, July 4, 6–8PM with a performance by MAI Mai at 7PM  Ann Zhao | Spillover July 4 - August 29, 2026","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-27","ld":7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Soldier Study, 2026","k":"exhibition","s":"2026-07-22","e":"2026-08-29","st":null,"et":null,"u":"beforehouses","c":"New York","co":"","p":"https://www.instagram.com/p/DbGn3oTzlON/","x":"Soldier Study, 2026\nInk on tracing paper\n13 x 17 inches \nThis work is included in the group exhibition Total Eclipse organized by @dezyemeseye open by appointment through August 29th \n\nCourtesy of Interrobang","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"„Clair de lune“ (Moonlight) is a series of sculptures realized by Éric Baudelaire in co...","k":"screening","s":"2026-07-22","e":"2026-08-29","st":null,"et":null,"u":"ccaberlin","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbGR-bwG4uV/","x":"„Clair de lune“ (Moonlight) is a series of sculptures realized by Éric Baudelaire in collaboration with Crystal Lau Chang, Kadiatou Diakhité, Mèï Jendoubi, Jade Ebara Ossebi, Iris Fontanella, and Astrid Plouchart, all students from the National Institute for Blind Youth in Paris. Conceived site-specifically for the ground floor of CCA Berlin the sculptures mark a step into an unfamiliar medium for the artist. Twice a month for the past year, he met the students at the school to create forms together, guided by a simple rule—to make something they consider beautiful. Each work begins as a 15 × 15 cm sculpture made by a pupil from plasticine, toy pieces, jewelry, and other found objects. These were then 3D-scanned, enlarged, carved in cherry wood, and hand-finished at the workshop of Lafayette Anticipations. The sculptures each bear a plaque with their titles in Braille. They are made to be touched.\n\nIn this collaborative, open-ended process, a new relationship takes hold, different from the one between filmmaker, filmed subjects, and audience. Watching the children’s lives unfold on the high-resolution screens, one becomes conscious of how documentary film sees—its logic of capture and comprehension, its always incomplete access to reality. The sculptures, meanwhile, bear another kind of presence, redirecting our attention to the textures of what we hold in common and what holds us in the common. These imaginary terrains, as expressions of beauty and survival, invite us to experience form through touch, and to reconsider the receptivity of being in this world. Through them, perhaps, we could feel our way toward a blurred, irreducible sociality of the senses, as darkness settles in. (Text: @nanxi.southwest )\n\nThe exhibition by Éric Baudelaire runs until 29 Aug 2026! We look forward to welcoming you! \n\nThe series „Clair de Lune“ has been realized with the support of @lafayetteanticipations 🥰 Production and woodwork: Olivier Magnier and Raphaël Raynaud\n\nThe exhibition is supported by Stiftung Kunstfonds; and Trampoline, Association in support of the French art scene, Paris.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"FORTHCOMING_","k":"exhibition","s":"2026-07-25","e":"2026-08-29","st":null,"et":null,"u":"galleryvacancy","c":"Shanghai","co":"","p":"https://www.instagram.com/p/DbF24kYERF1/","x":"FORTHCOMING_\n\nGallery Vacancy is pleased to present The Stillness of Life, a solo exhibition by Natalia González Martín, on view from July 25 to August 29, 2026.\n\n“Still life negates the whole process of constructing and asserting human beings as the primary focus of  depiction.”\n\n  Norman Bryson, Looking at the Overlooked: Four Essays on Still Life Painting\n\nNatalia González Martín often takes art history as a starting point. In this new body of work, she brings still life, a genre historically placed below narrative painting, to the foreground. By shifting attention away from the exceptional and toward the unassuming, this body of work brings the eventless into focus. Charles Sterling distinguished between “megalography,” the depiction of great or elevated subjects, and “rhopography,” the representation of trivial or seemingly insignificant things. Norman Bryson later takes up and develops this distinction, understanding rhopography as a mode of attention directed toward the material basis of life that conventional ideas of importance routinely overlook.\n\nFor this exhibition, González Martín borrows elements from historical still-life compositions. Yet unlike conventional still lifes, these works do not fully remove the human presence.\n\n📷 @tomcarterldn \n．\n@natalia.gonzalez.martin #nataliagonzalezmartin #thestillnessoflife #galleryvacancy","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":3,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Rita Ackermann & Harmony Korine","k":"exhibition","s":"2026-07-31","e":"2026-08-29","st":null,"et":null,"u":"americanartcatalogues","c":"Paris","co":"","p":"https://www.instagram.com/p/DbdadTqkb62/","x":"Rita Ackermann & Harmony Korine\nSAINT DAINT, 2026\nGraphite and Conté à Paris pencil on paper\n22 ½ × 30 inches (57.2 × 76.2 cm)\n\nOn view through August 29th, 2026\n\nSummer Hours:\nTuesday - Friday \n12 to 6p.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"[Upcoming]","k":"opening","s":"2026-07-31","e":"2026-08-29","st":"17:00","et":"18:00","u":"a_lounge_contemporary","c":"Seoul","co":"","p":"https://www.instagram.com/p/DbNFkojkqdv/","x":"[Upcoming]\n\n에이라운지는 2026년 7월 31일부터 8월 29일까지 황선영 개인전 《Susurrus》를 개최합니다. ‘Susurrus’는 보이지 않지만 분명히 존재하는 비가시적 영역의 목소리에 대한 이야기입니다(작가노트). 작가는 시선 밖에 남겨진 존재들의 내면과 목소리를 섬세한 회화적 언어로 풀어내며, 잊힌 존재를 향한 애도와 존중의 시선을 제안합니다. \n\n*오프닝 리셉션은 7월 31일 오후 5시부터 6시까지 갤러리에서 진행됩니다.\n\nA-Lounge Contemporary is pleased to present 𝘚𝘶𝘴𝘶𝘳𝘳𝘶𝘴, a solo exhibition by Hwang Sunyoung, on view from July 31 to August 29, 2026. 𝘚𝘶𝘴𝘶𝘳𝘳𝘶𝘴 explores an unseen realm that remains invisible yet undeniably present (Artist’s statement). Through delicate painterly gestures, the exhibition gives form to the inner worlds and voices of those who exist beyond the reach of our gaze, inviting viewers to reflect on remembrance, mourning, and quiet acts of recognition. \n\n*Join us for opening reception on July 31th, 5-6 PM.\n\n——————\n\nArtworks\n- 𝘊𝘰𝘶𝘯𝘵𝘪𝘯𝘨 𝘊𝘶𝘳𝘳𝘦𝘯𝘵𝘴, 2026, Oil on canvas, 180 × 150 cm (detail)\n- 𝘚𝘶𝘴𝘶𝘳𝘳𝘶𝘴, 2026, Oil on canvas, 132 × 112 cm (detail)\n- 𝘚𝘵𝘪𝘭𝘭 𝘋𝘳𝘦𝘢𝘮 𝘈𝘣𝘰𝘶𝘵 𝘚𝘸𝘪𝘮𝘮𝘪𝘯𝘨 𝘈𝘭𝘭 𝘛𝘩𝘳𝘰𝘶𝘨𝘩 𝘵𝘩𝘦 𝘕𝘪𝘨𝘩𝘵, 2026, Oil on canvas, 180 × 210 cm (detail)\n\n——————\n\n황선영 Hwang Sunyoung\n𝙎𝙪𝙨𝙪𝙧𝙧𝙪𝙨\n2026. 7. 31. - 8. 29.\n\nA——L\n서울 종로구 백석동 1가길 45\nTUE - SAT\n11:00 - 18:00","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-25","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Natalia González Martín’s exhibition ‘The Stillness of Life’ is now open at Gallery Vac...","k":"exhibition","s":"2026-08-06","e":"2026-08-29","st":null,"et":null,"u":"hannahbarrygallery","c":"Shanghai","co":"","p":"https://www.instagram.com/p/DbtECXvgnOu/","x":"Natalia González Martín’s exhibition ‘The Stillness of Life’ is now open at Gallery Vacancy in Shanghai. Congratulations Natalia, Lucien, Rachael and everyone at the gallery.  Exhibition runs through 29 August. \n\n@galleryvacancy @natalia.gonzalez.martin \n\nPhotos: Ling. Courtesy of the Artist and Gallery Vacancy.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"[News]","k":"opening","s":"2026-08-09","e":"2026-08-29","st":"12:00","et":null,"u":"a_lounge_contemporary","c":"Seoul","co":"","p":"https://www.instagram.com/p/DbnES8_Shj8/","x":"[News]\n\n에이라운지의 한성우 작가가 인천아트 플랫폼에서 진행되는 단체전 《Landscape Literacy》에 참여합니다. 이번 전시는 오늘날 디지털 환경과 함께 변화한 이미지의 선택 및 분류 방식을 바탕으로, 추상회화를 단순한 감각을 넘어선 작동 방식으로 바라보는 새로운 읽기를 제안합니다. 한성우 작가는 축적된 경험을 화면 위에 자동으로 출력하며, 류재성 작가와 함께 세계를 읽고 조직하는 서로 다른 회화적 문법을 보여줍니다.\n\n전시기간 | 2026. 8. 9. - 8. 29. (차 스튜디오)\n전시기간 | 2026. 8. 11. - 8. 16. (인천 아트플랫폼 E1, 12:00 - 18:00 휴관일 없음, 오프닝 8. 14. 17:00) \n전시공간 | 차 스튜디오 · 인천 아트플랫폼 E1 \n후원 | 인천광역시, 인천문화재단\n\nOur artist Han Sungwoo participate in a group show, 𝙇𝙖𝙣𝙙𝙨𝙘𝙖𝙥𝙚 𝙇𝙞𝙩𝙚𝙧𝙖𝙘𝙮. The exhibition proposes a new way of reading abstract painting as a mechanism beyond mere sensation, based on how the selection and classification of images have changed alongside today‘s digital environment. Han Sungwoo automatically outputs accumulated experiences onto the screen, and together with Ryu Jaesung, they present distinct grammars of painting that read, choose, and organize the world.\n\nExhibition Period | August 9, 2026 - August 29, 2026 (Cha Studio) \nExhibition Period | August 11, 2026 - August 16, 2026 (Incheon Art Platform E1, 12:00 - 18:00 Open Daily, Opening Reception Aug 14 at 17:00) \nVenue | Cha Studio · Incheon Art Platform E1, South Korea \nSupported by | Incheon Metropolitan City, Incheon Foundation for Arts & Culture","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":5,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The Studio, 2026, Oil on Linen, 109 x 207 inches","k":"other","s":"2026-05-18","e":"2026-08-30","st":null,"et":null,"u":"salman.toor","c":"Stockholm","co":"","p":"https://www.instagram.com/p/DYfbQfKlQuy/","x":"The Studio, 2026, Oil on Linen, 109 x 207 inches\n\nHonored to have this work in ‘House of Nisaba: New Stories of Painting’ curated by @hendrik_folkerts 🙏✨ @modernamuseet , Stockholm with some amazing artists. Show runs through Aug 30 ⭐️ Special thanks to @luhringaugustine @johnson_montenegro for all the support 👏🏽","r":true,"b":null,"af":false,"so":false,"pd":"2026-05-18","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"With 𝗨𝗻𝘁𝗶𝘁­𝗹𝗲𝗱 (𝗽𝗹𝗼𝘁 𝗳𝗼𝗿 𝗱𝗶𝗮­𝗹𝗼­𝗴𝘂𝗲), New York/Berlin-based artist 𝗔𝘀𝗮𝗱 𝗥𝗮𝘇𝗮 @asaaddo t...","k":"performance","s":"2026-05-29","e":"2026-08-30","st":"11:00","et":null,"u":"kunsthalgent","c":"New York","co":"","p":"https://www.instagram.com/p/DZo_leLjeeQ/","x":"With 𝗨𝗻𝘁𝗶𝘁­𝗹𝗲𝗱 (𝗽𝗹𝗼𝘁 𝗳𝗼𝗿 𝗱𝗶𝗮­𝗹𝗼­𝗴𝘂𝗲), New York/Berlin-based artist 𝗔𝘀𝗮𝗱 𝗥𝗮𝘇𝗮 @asaaddo transforms our hall church into a tennis court, not just to be looked at, but to be experienced firsthand. On-site tennis coaches will invite visitors to play a game. The meaning of the work lies in a sensory experience that goes beyond seeing and hearing; it is about feeling, smelling, and tasting, as well as the meditative, repetitive act of playing tennis.   With this installation, Asad Raza focuses on the participatory and performative aspects of art. He invites the audience to hit a ball with the tennis coaches on-site as a form of meditation. The competitive element of the game is deliberately ignored to serve as a counterweight to our performance-driven society. \n\nThe church, traditionally a place of one-way communication and higher authority, thus becomes a space for reciprocity, play, and relaxation. \n••••••••••••  𝗔𝘀𝗮𝗱 𝗥𝗮𝘇𝗮 — ‘𝗨𝗻𝘁𝗶𝘁­𝗹𝗲𝗱 (𝗽𝗹𝗼𝘁 𝗳𝗼𝗿 𝗱𝗶𝗮­𝗹𝗼­𝗴𝘂𝗲)’ 29.05.2026 — 30.08.2026 Weekends: 11:00 — 18:00\nEvery day during Gentse Feesten: 11:00 — 18:00\n\n📷 @michieldecleene","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-16","ld":-18,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Mercedes Llanos‘s artworks are currently on view at the Balice Hertling Gallery, as par...","k":"exhibition","s":"2026-06-25","e":"2026-08-30","st":null,"et":null,"u":"balicehertling","c":"New York","co":"","p":"https://www.instagram.com/p/DaA0S_XjCiz/","x":"Mercedes Llanos‘s artworks are currently on view at the Balice Hertling Gallery, as part of the exhibition “Entresueños”, until August 30th 2026.\n\nMercedes Llanos (b. 1992, Mar del Plata, Argentina) lives and works in New York, USA. Her first solo exhibition with Balice Hertling took place in 2022. Recent exhibitions include Amanita, New York (2024); Espacio Tacuarí, Buenos Aires (2023); and Balice Hertling, Paris (2025, 2022), among others.\n\nMercedes Llanos\nBed #4, red spiral signifies past trauma, 2026\nOil and graphite on canvas\n195.6 x 264.2 cm\n77 x 104 in\n\nMercedes Llanos\nBed #7, codependencia radioactive, 2026\nOil and graphite on canvas\n195.6 x 264.2 cm\n77 x 104 in\n\n@mercedesllanosart #balicehertling","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-25","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This summer, Sundays are for cinema. 🍿","k":"screening","s":"2026-07-05","e":"2026-08-30","st":null,"et":null,"u":"sharjahart","c":"Sharjah","co":"","p":"https://www.instagram.com/p/DZ7kh_OhFmw/","x":"This summer, Sundays are for cinema. 🍿\n\nJoin us at Sunday Cinema Club, a new weekly film programme featuring animated fantasies, sci-fi classics and works of Arab cinema.\n\nFrom magical journeys and lunar expeditions to stories of identity and belonging, each screening is accompanied by a talk or workshop that explores the film’s cinematic language or social background.\n\n🎬 Sunday Cinema Club\n📅 5 July–30 August 2026\n📍 Photography Gallery, Al Manakh, Sharjah\n\nFree admission. Discover the full programme and book your tickets through the link in our bio.\n\nهذا الصيف.. موعدنا مع السينما كل يوم أحد. 🍿\n\nانضموا إلينا في «نادي سينما الأحد»، وهو برنامج سينمائي أسبوعي جديد يقدّم لكم أفلام تحريك، وكلاسيكيات الخيال العلمي، وأفلاماً عربية مميزة.\n\nمن عوالم التحريك الساحرة ومغامرات الفضاء ورحلات القمر إلى حكايات الهوية والانتماء، يصاحب كل عرض نقاش أو ورشة تستكشف اللغة السينمائية للفيلم وخلفيته الاجتماعية.\n\n🎬نادي سينما الأحد\n📅 5 يوليو - 30 أغسطس 2026\n📍رواق الفوتوغراف، المناخ، الشارقة\n\nالدخول مجاني. استكشفوا البرنامج كاملاً واحجزوا تذاكركم عبر الرابط الموجود في الوصف.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-06-23","ld":12,"dl":"2026-08-30","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"~ UPCOMING EXHIBITION","k":"opening","s":"2026-07-05","e":"2026-08-30","st":"17:00","et":null,"u":"shimmer__shimmer","c":"Bangkok","co":"","p":"https://www.instagram.com/p/DaCdVZ-oYD4/","x":"~ UPCOMING EXHIBITION\n\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned with Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nCurated by Shimmer\nEloise Sweetman and Jason Hendrik Hansma\n\n5 July - 30 August, 2026\n\nOpening reception:\nSunday 5 July, 17:00 - 21:00\n\n_\n\nSTORAGE\n3rd Fl. 469 Phra Sumen Rd. Bangkok, Thailand\nopening hours:\n\n14:00 - 19:00, Thu-Sun","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-26","ld":9,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"All the works in this show are in precarious states of change. Unfinished is not the sa...","k":"other","s":"2026-07-05","e":"2026-08-30","st":"14:00","et":null,"u":"storage.bkk","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbaOp-mgq7x/","x":"All the works in this show are in precarious states of change. Unfinished is not the same as abandoned. Unfinished means we are bound into a relationship with change. “Be ahead of all parting, as if it had already happened,” Rilke told us. “The non-being inside you allows you to vibrate, in full resonance with your world. Use it for once.” That blue memory, the last hue to fade, that invitation to move.\n\n~\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned with Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nCurated by Shimmer @shimmer__shimmer  Eloise Sweetman and Jason Hendrik Hansma\n@eloise_sweetman @jason_hendrik_hansma \n5 July - 30 August, 2026\n\nผลงานทั้งหมดในนิทรรศการครั้งนี้ต่างตกอยู่ในสภาวะอันเปราะบางของการเปลี่ยนแปลง ความไม่เสร็จสิ้นมิใช่สิ่งเดียวกับการถูกละทิ้ง หากแต่ความไม่เสร็จสิ้นนั้นหมายถึงการที่พวกเราได้ผูกพันตนเองเข้ากับความสัมพันธ์แห่งความแปรเปลี่ยน “จงก้าวไปข้างหน้าก่อนการพรากจากทั้งปวง ราวกับว่ามันได้เกิดขึ้นแล้ว” Rainer Maria Rilke เคยบอกพวกเราไว้ “ความไม่มีตัวตนภายในตัวคุณ จะอนุญาตให้คุณได้สั่นสะเทือน และสะท้อนก้องอย่างเต็มเปี่ยมไปพร้อมกับโลกของคุณ จงใช้มันดูสักครั้ง” ความทรงจำสีฟ้าสีนั้น เฉดสีสุดท้ายที่จะเลือนหายไป และคำเชื้อเชิญให้พวกเราได้ออกเดินทางและเคลื่อนต่อไป\n\n~\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned \nwith Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nคิวเรท โดย Shimmer\nEloise Sweetman และ Jason Hendrik Hansma\n5 กรกฎาคม - 30 สิงหาคม 2569\n\nขอขอบคุณ Mondriaan Fonds, The Felix Gonzalez-Torres Foundation, Alejandra Rios and Mercedes Saenz (Mexico City), BQ (Berlin)\nนิทรรศการและกิจกรรมของ STORAGE ได้รับการสนับสนุนจากเงินอุดหนุนการพัฒนาและส่งเสริมศิลปะร่วมสมัย ประจำปีงบประมาณ พ.ศ. ๒๕๖๙ โดยสำนักงานศิลปวัฒนธรรมร่วมสมัย กระทรวงวัฒนธรรม\n\nรูปถ่าย: Atelier 247 \n_\nSTORAGE \nชั้น 3 บ้านเลขที่ 469 ถนนพระสุเมรุ กรุงเทพฯ\nเปิดทุกวันพฤหัสบดี - วันอาทิตย์\nเวลา: 14:00 - 19:00 น.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":-25,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"…continue from the previous post","k":"exhibition","s":"2026-07-05","e":"2026-08-30","st":"14:00","et":null,"u":"storage.bkk","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbIKmldAIOc/","x":"…continue from the previous post\n\nWe are not only concerned with Mia’s eyes themselves, but with the cyan ink, which relies on a negative trace to appear on the surface of the paper. That trace, that tired surface, here today, slowly gone tomorrow.\n\nGone tomorrow is deeply embedded in Jochen Lempert’s work. Presented here are two images, both featuring what appear to be two bicycles photographed 15 years apart. Small beetles cluster on a gear shifter; in the other image, a lepidopteran in flight centres itself in the frame. Seasonality shifts us into movement. As you might remember, the flight of a lepidopteran is an invitation for us, as children, to chase and leap up high. Schmetterling! ผีเสื้อ! Butterfly! With giggles that fall back into nature, and into that space at STORAGE too, where the windows are left open and Bangkok comes in: her bugs, her emeralds, rubies, sapphires, her polished beetles as lures for us to move outwards, over borders, into both memory and future.\n\n~\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned with Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nCurated by Shimmer Eloise Sweetman and Jason Hendrik Hansma\n5 July - 30 August, 2026\n\nSpecial thanks to Mondriaan Fonds, The Felix Gonzalez-Torres Foundation, Alejandra Rios and Mercedes Saenz (Mexico City), BQ, Berlin @bq_berlin \n\nSTORAGE programme is supported by the Office of Contemporary Art and Culture, Ministry of Culture (Fiscal Year 2026)\n\nPhoto: Atelier 247 \n_\nSTORAGE\n3rd Fl. 469 Phra Sumen Rd. Bangkok, Thailand\nopening hours: \n14:00 - 19:00, Thu-Sun\n\nสามารถอ่านภาษาไทยได้ที่คอมเมนต์ด้านล่าง\n\nJOCHEN LEMPERT\n“Ohne Titel” 2020\nSilver gelatin print\n29.7 x 23.3 cm\nEdition of 5\nCourtesy of BQ, Berlin\n\nJOCHEN LEMPERT “Ohne Titel (Harmonia, Hamburg, 2005)” 2005\nSilver gelatin print\n37.2 x 24.7 cm\nEdition of 5\nCourtesy of BQ, Berlin","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":-18,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"In response to the context of STORAGE, Bangkok, an art space in a former printing house...","k":"exhibition","s":"2026-07-05","e":"2026-08-30","st":"14:00","et":null,"u":"storage.bkk","c":"Berlin","co":"","p":"https://www.instagram.com/p/DapLMc7AEOo/","x":"In response to the context of STORAGE, Bangkok, an art space in a former printing house that specialised in Buddhist texts, the exhibition begins with “Untitled”, 1991 by Felix Gonzalez-Torres. This work enacts rhythm, multiplicity, and the dispersal of material into the world. We are drawn to the paper stack because of its shifting, changing mass, as well as Gonzalez-Torres’s instruction to choose a blue. He once said, “For me, if a beautiful memory could have a color, that color would be light blue.”\n\n~\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned with Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nCurated by Shimmer Eloise Sweetman and Jason Hendrik Hansma\n5 July - 30 August, 2026\n\nเพื่อตอบรับกับบริบทเฉพาะของ STORAGE พื้นที่ศิลปะซึ่งตั้งอยู่ในอาคารโรงพิมพ์เก่าที่ผลิตสิ่งพิมพ์ที่เกี่ยวข้องกับพุทธศาสนาเป็นส่วนใหญ่ นิทรรศการจึงเริ่มต้นด้วยผลงาน “Untitled”, 2534 โดย Felix Gonzalez-Torres ผลงานที่เผยให้เห็นจังหวะ การทวีคูณ และการกระจายตัวออกสู่โลกกว้าง สิ่งที่ดึงดูดพวกเราให้เข้าหากองกระดาษนี้ ไม่เพียงเป็นเพราะมวลที่เปลี่ยนแปลงและแปรผันอยู่ตลอดเวลา หากยังรวมถึงคำกำหนดของ Gonzalez-Torres ที่ระบุให้เราสามารถเลือกเฉดของสีฟ้าเองด้วย เขาเคยกล่าวไว้ว่า “สำหรับผม หากความทรงจำอันงดงามมีสีได้ สีนั้นก็คงเป็นสีฟ้าอ่อน”\n\n~\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned \nwith Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nคิวเรท โดย Shimmer\nEloise Sweetman และ Jason Hendrik Hansma\n5 กรกฎาคม - 30 สิงหาคม 2569\n\n——\n\nSpecial thanks to Mondriaan Fonds, The Felix Gonzalez-Torres Foundation @felixgonzaleztorres.foundation , Alejandra Rios and Mercedes Saenz (Mexico City), BQ (Berlin)\n\nSTORAGE programme is supported by the Office of Contemporary Art and Culture, Ministry of Culture (Fiscal Year 2026)\n\nPhoto: Atelier 247\n\n_\nSTORAGE\n3rd Fl. 469 Phra Sumen Rd. Bangkok, Thailand\nopening hours: \n14:00 - 19:00, Thu-Sun\n\nFELIX GONZALEZ-TORRES “Untitled” 1991\nPrint on paper, endless copies\n3 1/4 inches at ideal height x 11 x 8 1/2 inches (, original paper size)\nEdition of 1, 1 AP\nCourtesy of Collection of Alejandra Rios and Mercedes Saenz, Mexico City","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-11","ld":-6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"FELIX GONZALEZ-TORRES “Untitled”, 1991","k":"exhibition","s":"2026-07-05","e":"2026-08-30","st":"14:00","et":null,"u":"storage.bkk","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbstjdfAIwm/","x":"FELIX GONZALEZ-TORRES “Untitled”, 1991\nPrint on paper, endless copies\nCourtesy of the Collection of Alejandra Rios and Mercedes Saenz, Mexico City\n\n and \n\nMELVIN MOTI Miamilism, 2010\nPaper, magazine\nCourtesy of the artist\n\n~\nAgeless, Ageless: Unfinished Is Not the Same as Abandoned with Felix Gonzalez-Torres, Jochen Lempert, and Melvin Moti\n\nCurated by Shimmer Eloise Sweetman and Jason Hendrik Hansma\n5 July - 30 August, 2026\n\nSpecial thanks to Mondriaan Fonds, The Felix Gonzalez-Torres Foundation, Alejandra Rios and Mercedes Saenz (Mexico City), BQ (Berlin)\n\nSTORAGE programme is supported by the Office of Contemporary Art and Culture, Ministry of Culture (Fiscal Year 2026)\n\nPhoto: Atelier 247 \n_\nSTORAGE\n3rd Fl. 469 Phra Sumen Rd. Bangkok, Thailand\nopening hours: \n14:00 - 19:00, Thu-Sun","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":-32,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Kunsthal Gent heads to 𝗞𝘂𝗻𝘀𝘁𝗲𝗻𝗳𝗲𝘀𝘁𝗶𝘃𝗮𝗹 𝗪𝗮𝘁𝗼𝘂 @kunstenfestivalwatou from 15 July to 30 A...","k":"screening","s":"2026-07-15","e":"2026-08-30","st":null,"et":null,"u":"kunsthalgent","c":"Dublin","co":"","p":"https://www.instagram.com/p/DaNFAK1DUzW/","x":"Kunsthal Gent heads to 𝗞𝘂𝗻𝘀𝘁𝗲𝗻𝗳𝗲𝘀𝘁𝗶𝘃𝗮𝗹 𝗪𝗮𝘁𝗼𝘂 @kunstenfestivalwatou from 15 July to 30 August! \n\nCurated by Danielle van Zuijlen @daniellevanzuijlen alongside @bart.lodewijks and @michaelvandebril this year’s edition is titled “Gemene Wegen” (Common Ways), inspired by a border road shared between Belgium and France: a pla­ce of dif­fe­ren­ce, con­flict and con­nec­ti­on at once. \n•••••••\n\n𝗪𝗵𝗮𝘁 𝘄𝗲 𝗮𝗿𝗲 𝗯𝗿𝗶𝗻𝗴𝗶𝗻𝗴 𝘁𝗼 𝘁𝗵𝗲 𝗳𝗲𝘀𝘁𝗶𝘃𝗮𝗹: \n• 𝗗𝗲𝘃𝗲𝗹𝗼𝗽𝗺𝗲𝗻𝘁 𝗽𝗿𝗼𝗴𝗿𝗮𝗺𝗺𝗲: Seasonal Neighbours @seasonalneighbours explores the relationship between residents and seasonal workers, while Volksdansen* reclaims Flemish folk dance traditions with a participatory “Harvest Festival.” With @sphinxcinema we are also supporting Marie Vanderauwera’s Cinema Watou, featuring low-stimulus film screenings every Sunday evening.\n\n• 𝗧𝗵𝗲 𝗣𝗶𝗿𝗮𝘁𝗲 𝗣𝗮𝘃𝗶𝗹𝗶𝗼𝗻: Together with @bepart_platform we present Nico Dockx’s artwork hosting events by S.M.A.K., @extra_city and collectives @m_a_n_o_e_u_v_r_e and Shif_t*, alongside local neighborhood activities. \n\n• 𝗙𝗲𝗮𝘁𝘂𝗿𝗲𝗱 𝗔𝗿𝘁𝗶𝘀𝘁𝘀: Discover works by Diego Herman, Şengül Özdemir, Elke Uitentuis, and De Ambulanten.\n\n• 𝗘𝗻𝗱𝗹𝗲𝘀𝘀 𝗘𝘅𝗵𝗶𝗯𝗶𝘁𝗶𝗼𝗻: Fiona Hallinan’s “Fragment Mediation” @fink_ (a long table made from a demolished Dublin church) travels to the Watou church. Jesse Jones’s “Syllabus” @jessepresleyjones is also present as a large flag and contract, inviting you to explore the work before the curtain returns to Kunsthal Gent. \n𝗘𝗹𝘀𝗲𝘄𝗵𝗲𝗿𝗲 𝗮𝘁 𝘁𝗵𝗲 𝗳𝗲𝘀𝘁𝗶𝘃𝗮𝗹: \nAt the Douviehoeve, we delve into ‘the commons’ and our relationship with the landscape. This location features work by Johan Grimonprez, Wim Cuyvers and Marjolijn Dijkman.  \n• Suzanne Treister showcases tarot cards exploring technology and power, alongside AIAI Poetry, an algorithm generating new language from forty years of Watou poets.\n\n• The fictional civilization of ANT Collective incorporates collection pieces from @smakgent , while @019ghent constructs a wheelchair-accessible ramp zigzagging through the landscape at De Lovie Castle. \n••• Visit the Watou website for more info","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-30","ld":15,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"AGNES PELOTON","k":"opening","s":"2026-07-18","e":"2026-08-30","st":"15:00","et":null,"u":"joanjonasbrothers","c":"Houston","co":"","p":"https://www.instagram.com/p/DaosldHCXPQ/","x":"AGNES PELOTON\nJuly 18-August 30, 2026\n@basketbooksandart \nHouston, Texas\n\nOpening Reception: \nJuly 18, 2026 \n3 PM-5 PM\n\n…In a “post-Peloton” era, why should we bother to listen to the spiritual fabric of energy when sheer survival feels more urgent?  The fact is that – in its fundamental ineffability – the mystical and the spiritual constitutes that which cannot be reduced to a data point. This metric-less stuff is vital to cultivate amid a dystopian, data-driven culture in which mass surveillance of the individual (from social behavior to bodily function) is deeply interwoven into the fabric of existence. The neurological frontier is upon us, and it is essential that, if able, we disconnect and dive deep into our own interiority. There are urgent lessons to be learned in that exploration – contemplation and psychedelia, spirituality and energetic transmission, cosmology and scale.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-11","ld":7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Jochem Mestriner is part of Wild Summer of Art 2026: The Treasure Hunt Edition, open no...","k":"exhibition","s":"2026-07-19","e":"2026-08-30","st":null,"et":null,"u":"diez.gallery","c":"Rotterdam","co":"Netherlands","p":"https://www.instagram.com/p/Da-M0xvsOMy/","x":"Jochem Mestriner is part of Wild Summer of Art 2026: The Treasure Hunt Edition, open now at Brutus in Rotterdam.\n\nCurated by Hajo Doorn and Cokkie Snoei, this year's edition gathers fifty Rotterdam based artists, each asked to show a side of their work that doesn't usually surface. \n\nThe show is on view until August 30.\n\n@jochem.mestriner\n@brutus.rotterdam\n@cokkiesnoei\n\nAd Hoc Hypothesis, 2024\nOil, oil stick, oil pastel, colour pencil and oil scrapings on canvas\n30 x 40 cm (11 3/4 x 15 3/4 in)","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-19","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"There is still time to experience 'Maria Lassnig and Edvard Munch. Flow of Paint = Flow...","k":"exhibition","s":"2026-07-25","e":"2026-08-30","st":null,"et":null,"u":"capitainpetzel","c":"","co":"","p":"https://www.instagram.com/p/DbN_Dt3jFRW/","x":"There is still time to experience 'Maria Lassnig and Edvard Munch. Flow of Paint = Flow of Life' at the Hamburger Kunsthalle, on view through 30 August 2026.\n\nBringing together two artists who transformed the representation of the human body into a profound exploration of psychological and emotional experience, the exhibition places Lassnig’s groundbreaking concept of Körperbewusstseinsmalerei (body awareness painting) in dialogue with Edvard Munch’s deeply introspective practice. \n\nAcross generations, both artists developed a radically subjective visual language that continues to resonate today.\n\nImages: Installation views, 'Maria Lassnig and Edvard Munch. Flow of Paint = Flow of Life', Hamburger Kunsthalle, 2026, Ph: Fred Dott.\n\n#MariaLassnig #EdvardMunch #HamburgerKunsthalle #ContemporaryArt #Painting #Exhibition","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-25","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Now open at @arnolfiniarts: Don't miss 'I'll Still Be Here When You Return' by Jameisha...","k":"screening","s":"2026-07-28","e":"2026-08-30","st":null,"et":null,"u":"filmvidumbrella","c":"Bristol","co":"","p":"https://www.instagram.com/p/DbVfx8LmiR9/","x":"Now open at @arnolfiniarts: Don't miss 'I'll Still Be Here When You Return' by Jameisha Prescod, one of six new moving image works commissioned as part of FVU New Takes, screening in Arnolfini's Dark Studio (Level 2) until 26 July ✨\n\n'I’ll Still Be Here When You Return' is a moving image work that explores the space between sleeping and wakefulness during a chronic illness flare-up. Inspired by the artist’s personal experience with illness and disability, this film questions the emotional impact of living under systems that place great importance on the ‘productive’ bodies whilst ignoring and even demonising the sick ones. @youlookokaytome\n\n📝 You can also pick up a copy of a newly commissioned text by @celestinefraser, reflecting on a journey through isolation, recovery, intimacy and relapse before arriving at the unexpected forms of connection and meaning that emerge from living ‘in between’.\n\n🎟 Free entry!\n📆 Until 30 August 2026\n🔗 Find out more on our website under 'What's On', link in bio!\n🎬 Not in Bristol? Watch and read for free on #FVUWatch, link in bio!\n\n--\n\nHave you watched or engaged with any of the works commissioned as part of FVU New Takes on FVU Watch? Fill out our Audience Survey to be in with a chance of winning a £50 Gift Card for Everyman Cinemas (UK-wide). Link in bio!\n\n'I'll Still Be Here When You Return' (2026) has been commissioned as part of FVU New Takes, an FVU initiative supported by @jerwood_foundation. FVU is supported using public funding by Arts Council England.\n\n#fvu #filmvidumbrella #filmandvideoumbrella #jameishaprescod #movingimage","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"To accompany our current feature on #FVUWatch, 'I'll Still Be Here When You Return' (20...","k":"exhibition","s":"2026-07-28","e":"2026-08-30","st":null,"et":null,"u":"filmvidumbrella","c":"","co":"UK","p":"https://www.instagram.com/p/DbLMSA0mnw8/","x":"To accompany our current feature on #FVUWatch, 'I'll Still Be Here When You Return' (2026) by Jameisha Prescod, you can read a newly commissioned text by writer, editor and filmmaker @celestinefraser ✨\n\n'I’ll Still Be Here When You Return' is a moving image work that explores the space between sleeping and wakefulness during a chronic illness flare-up. Inspired by the artist’s personal experience with illness and disability, this film questions the emotional impact of living under systems that place great importance on the ‘productive’ bodies whilst ignoring and even demonising the sick ones. Point cloud animations made from 3D scans of the artist’s bedroom during a post-surgery recovery period dissolve into one another while a deceivingly calm and meditative voice-over drifts between thoughts of pain, memory, isolation and mortality. @youlookokaytome\n\n📝 Celestine reflects on 'I'll Still Be Here When You Return' and a journey through isolation, recovery, intimacy and relapse; before arriving at the unexpected forms of connection and meaning that emerge from living ‘in between’. \n\n🔗 Read and watch for free via the link in bio!\n\n--\n\n'I’ll Still Be Here When You Return' (2026) will be on view at @arnolfiniarts from 28 July — 30 August 2026.\n\nHave you watched or engaged with any of the works commissioned as part of FVU New Takes on FVU Watch? Fill out our Audience Survey to be in with a chance of winning a £50 Gift Card for Everyman Cinemas (UK-wide). Link in bio!\n\n'I’ll Still Be Here When You Return' (2026) has been commissioned as part of FVU New Takes, an FVU initiative supported by @jerwood_foundation. FVU is supported using public funding by Arts Council England.\n\n#fvu #filmvidumbrella #filmandvideoumbrella #jameishaprescod #movingimage #celestinefraser","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"We inhabit an era where the swipe of a thumb has successfully collapsed the distance be...","k":"exhibition","s":"2026-07-30","e":"2026-08-30","st":null,"et":null,"u":"contemporarylynx","c":"Vilnius","co":"Lithuania","p":"https://www.instagram.com/p/DbaZo8BDsua/","x":"We inhabit an era where the swipe of a thumb has successfully collapsed the distance between historical tragedy and consumerist desire. What once seemed irreconcilable — intimacy and exposure, grief and distraction, the historical weight of a region and the frictionless speed of the algorithm — now coexist in a state of permanent, vibrating suspension. \n\nThis is the psychological and material terrain of the exhibition 'Gen Z. All at Once' held at @momuziejus in Vilnius until August 30 2026. \n\nRead more in the review by @rosanalukauskaite 👉 click the link in our bio!\n\n.\n\nPhotos: (1) Gen Z. All at Once, exhibition view at MO Museum Vilnius. Photo by Rytis Šeškaitis; (2) Works by Olga Krykun, exhibition view of 'Gen Z. All at Once' at MO Museum Vilnius. Photo by Rytis Šeškaitis; (3) Works by Helena Parys, exhibition view of 'Gen Z. All at Once' at MO Museum Vilnius. Photo by Rytis Šeškaitis; (4) Works by Katrīna Biksone, exhibition view of 'Gen Z. All at Once' at MO Museum Vilnius. Photo by Rytis Šeškaitis; (5) Nikola Balberčáková, r/ForeverAlone, 2024, exhibition view of “Gen Z. All at Once” at MO Museum Vilnius. Photo by Jonas Balsevičius.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"MADRID – Talia Chetrit’s Red, 2026 is included in Bunny, curated by Stella Bottai and p...","k":"exhibition","s":"2026-07-31","e":"2026-08-30","st":null,"et":null,"u":"hoffman.donahue","c":"Madrid","co":"","p":"https://www.instagram.com/p/DbdWEM-lLIX/","x":"MADRID – Talia Chetrit’s Red, 2026 is included in Bunny, curated by Stella Bottai and presented by the LOEWE Foundation on the occasion of PHotoEspaña 2026, at the Lázaro Galdiano Museum through August 30\n\nThe exhibition’s title, Bunny, reflects the sensibility of her images: raw, seductive, and playfully performative. In her work, the line between truth and fiction remains open to negotiation between artist and viewer. Photography becomes both medium and object, highlighted as a material condition through which images are layered, extended, and transformed. The works vary in scale: intimate black-and-white prints invite close observation, while large-format color photographs assert a physical presence and engage the viewer’s body.\n\nImages: Talia Chetrit, Bad Bunny, 2026. installation views, Museo Lázaro Galdiano, Madrid. Photography by Álvaro Tomé.\n\n#TaliaChetrit #Bunny #LOEWEFoundation #MuseoLázaroGaldiano @taliachetrit @stellabottai @loewefoundation @photoespana_ @museolazarogaldiano","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Jack O'Brien and Leyla Yenirce will be part of 'SOUND BIESENTHAL – Art Biesenthal 2026'...","k":"exhibition","s":"2026-08-01","e":"2026-08-30","st":null,"et":null,"u":"capitainpetzel","c":"Biesenthal","co":"Germany","p":"https://www.instagram.com/p/Dba5pyfDP69/","x":"Jack O'Brien and Leyla Yenirce will be part of 'SOUND BIESENTHAL – Art Biesenthal 2026', opening on Saturday, August 1, 2026, at Wehrmühle, Biesenthal, and running through August 30, 2026.\n\nAt the heart of the exhibition is sound–not only as a medium, but as a conceptual tool for exploring perception, space, memory, and social relations.\n\nCurated by Domenico Positano and Tjioe Meyer Hecken.\n\nImages: 1. Jack O’Brien, 'Interlude', 2025. Ph: GRAYSC; 2. Leyla Yenirce, 'Falsett', 2026. Courtesy the artist and Capitain Petzel. Ph: Robert Glowacki; 3-4. Posters © Art Biesenthal 2026.\n\n#soundbiesenthal #artbiesenthal #artbiesenthal2026 #groupexhibition #jackobrien #leylayernice","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"\"Painting by Numbers\" (2011), a work by Charles Atlas, is opening at the Barclays Cente...","k":"exhibition","s":"2026-08-01","e":"2026-08-30","st":null,"et":null,"u":"luhringaugustine","c":"New York","co":"","p":"https://www.instagram.com/p/DboDyVGmSOY/","x":"\"Painting by Numbers\" (2011), a work by Charles Atlas, is opening at the Barclays Center's Oculus, New York, on August 1st and will remain on view through August 30th. ⁠\n⁠\nPresented as part of \"Art on the Hour\" on the Barclays Center’s Oculus, this presentation is adapted from a three-channel installation for the Oculus screen, with the numbers moving in unison, split apart, and regrouped in a graphic study of order and chaos. ⁠\n⁠\n\"Painting by Numbers\" (2011) is part of Charles Atlas’s trilogy of digital artworks, The Illusion of Democracy. The work treats the numbers 1 through 6 as characters, choreographing them in intricate patterns across the screen. Its title plays on popular paint-by-number kits, with digits swirling like brushstrokes as they expand and contract into geometric and abstract forms.⁠\n⁠\nLearn more about the project at the link in our bio. ⁠\n–⁠\n#CharlesAtlas @BarclaysCenter #ArtontheHour #LuhringAugustine","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":-3,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Make sure to check out ‘I’ll Still Be Here When You Return’ by Jameisha Prescod, one of...","k":"screening","s":"2026-08-05","e":"2026-08-30","st":null,"et":null,"u":"filmvidumbrella","c":"Bristol","co":"","p":"https://www.instagram.com/p/Dbqnho6Nvu5/","x":"Make sure to check out ‘I’ll Still Be Here When You Return’ by Jameisha Prescod, one of six new moving image works commissioned as part of FVU New Takes, currently featuring on #FVUWatch and screening in Bristol at @arnolfiniarts ✨\n\n‘I’ll Still Be Here When You Return’ is a moving image work that explores the space between sleeping and wakefulness during a chronic illness flare-up. Inspired by the artist’s personal experience with illness and disability, this film questions the emotional impact of living under systems that place great importance on the ‘productive’ bodies whilst ignoring and even demonising the sick ones. @youlookokaytome\n\n📝 You can also read a newly commissioned text by @celestinefraser, reflecting on a journey through isolation, recovery, intimacy and relapse before arriving at the unexpected forms of connection and meaning that emerge from living ‘in between’.\n\nThinking of visiting in person?\n🎟 Free entry!\n📆 Until 30 August 2026\n📍 Arnolfini, Bristol. Dark Studio (Level 2).\n🔗 Find out more on our website under ‘What’s On’, link in bio!\n\n—\n\nHave you watched or engaged with any of the works commissioned as part of FVU New Takes on FVU Watch? Fill out our Audience Survey to be in with a chance of winning a £50 Gift Card for Everyman Cinemas (UK-wide). Link in bio!\n\n‘I’ll Still Be Here When You Return’ (2026) has been commissioned as part of FVU New Takes, an FVU initiative supported by @jerwood_foundation. FVU is supported using public funding by Arts Council England.\n\n#fvu #filmvidumbrella #filmandvideoumbrella #jameishaprescod","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Whisperer IX at sangmonori.\n\ndon’t miss your chance to get discounted tickets through August 31 with code EARLYBIRDER at checkout. link in bio!","r":true,"b":"tickets","af":true,"so":false,"pd":"2026-07-29","ld":0,"dl":"2026-08-31","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Selected images of #karenkilimnik installed at @lomexlasvegas on view through August 31","k":"exhibition","s":"2026-07-30","e":"2026-08-31","st":null,"et":null,"u":"lomexlasvegas","c":"Las Vegas","co":"","p":"https://www.instagram.com/p/DbbRTcblJI-/","x":"Selected images of #karenkilimnik installed at @lomexlasvegas on view through August 31\nPhotos @chasethepicture","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"At a moment when ancient epics are again becoming material for large-scale cinematic sp...","k":"other","s":"2026-08-04","e":"2026-08-31","st":null,"et":null,"u":"e_flux","c":"Berlin","co":"","p":"https://www.instagram.com/p/Dbn1hpjjYNm/","x":"At a moment when ancient epics are again becoming material for large-scale cinematic spectacle, Film Notes publishes a conversation with Pelin Tan and Anton Vidokle about their film Gilgamesh: She Who Saw the Deep (2022), featured in the August 2026 online edition of e-flux Film’s Staff Picks. \n\nRather than reconstructing the ancient world, the film approaches The Epic of Gilgamesh, whose earliest versions predate Homer by more than a millennium, as an unfinished work resonating in the present. Speaking with Lukas Brasiskis @lukasbrasiskis, Tan and Vidokle discuss the film’s making, its dialogue with Cosmism, and the cultural and political realities of southeastern Turkey.\n\nWatch Gilgamesh: She Who Saw the Deep on e-flux.com/film, through August 31.\n\nLink in bio.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"We're looking for a Programmes Intern to help bring our 2026 Awards Week to life.","k":"exhibition","s":"2026-08-04","e":"2026-08-31","st":null,"et":null,"u":"princeclausfund","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbnMVT2OTOl/","x":"We're looking for a Programmes Intern to help bring our 2026 Awards Week to life.\n\nJoin us in celebrating the Prince Claus Fund Impact Award and our 30th anniversary while supporting the production of a multidisciplinary programme of events, coordinating international guests, and contributing to the work of our Programmes Team.\n\n📍 Hybrid (Amsterdam office)\n📅 Start: Mid-September (4–6 months)\n💶 Internship allowance: €500/month (32 hours/week)\n\nApplications are open until 31 August 2026. Send your CV and motivation letter (in English) to v.harari@princeclausfund.nl with the subject line \"Internship Programmes\".\n\nPlease note that applicants must possess a valid BSN number and be based in the Netherlands, as this is not a remote position.\n\nLearn more and apply via link in our bio.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"ACID + INTERNATIONAL WESTERNS","k":"screening","s":"2026-08-06","e":"2026-08-31","st":null,"et":null,"u":"anthologyfilmarchives","c":"New York","co":"","p":"https://www.instagram.com/p/DbJGGLzEcVI/","x":"ACID + INTERNATIONAL WESTERNS\nAugust 6 – 31\n\nFollowing the final screenings of \"Experimental Westerns, Part 1: Avant-Garde Westerns,\" taking place through this Sunday, we'll shift our focus to films made in a more conventional narrative-fictional mode, but that are nonetheless formally radical, politically subversive, concertedly revisionist in their approach to the genre, or just flat-out bizarre.\n\nMore international in scope (but looking beyond the more celebrated and often-screened realm of the Spaghetti Western), the August selection encompasses Acid Westerns (such as Monte Hellman’s RIDE IN THE WHIRLWIND, George Englund’s ZACHARIAH, Roland Klick’s DEADLOCK, and Jim Jarmusch’s DEAD MAN), feminist Westerns, Black Westerns, Indigenous Westerns, Osterns, Goulash Westerns, and much more. These films demonstrate the degree to which the Western has proven fruitful even to filmmakers motivated by a desire to question and subvert its foundational myths.\n\nSee our website for full program details.\n\nThis project is supported in part by the National Endowment for the Arts.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":14,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"🎬 Coming up in our In Focus on Nagisa Ōshima","k":"screening","s":"2026-08-08","e":"2026-09-01","st":null,"et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/DblegUMFacD/","x":"🎬 Coming up in our In Focus on Nagisa Ōshima\n\nOn Wednesday, the first screening of Death by Hanging + Yunbogi's Diary (repeats Sat 8 Aug), Ōshima's macabre farce about a man who survives his own execution, confronting capital punishment and the treatment of Korean immigrants in Japan.\n\nAnd on Sunday, Diary of a Shinjuku Thief (repeats Wed 12 Aug), a radical blend of cinema verité and underground kabuki set against the student-led riots of the late 1960s.\n\nNext week: Boy, based on a shocking true story and among Ōshima's most beautiful and restrained work.\n\n🎟️ Tickets via the link in bio\n📅 In Focus: Nagisa Ōshima runs until 1 September\n\n#NagisaOshima #ICALondon #InFocus #JapaneseCinema #IndependentCinema","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-03","ld":5,"dl":"2026-09-01","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"The exhibition is structured around a 10 page transcript of recorded and translated mee...","k":"exhibition","s":"2026-07-14","e":"2026-09-03","st":null,"et":null,"u":"larmagar","c":"","co":"","p":"https://www.instagram.com/p/DayD3ypGgsK/","x":"The exhibition is structured around a 10 page transcript of recorded and translated meetings during my study at La Casa de Las Almas. Most notably, a conversation about a stabbing that occurred between two young women with both their mothers present. This text is included in the gallery with the bougainvillea genetic anomaly of bicolor petals.\n\nspirit of discrimination is on view at women and their work until September 3.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"untitled .26","k":"exhibition","s":"2026-07-31","e":"2026-09-03","st":null,"et":null,"u":"larmagar","c":"","co":"","p":"https://www.instagram.com/p/DbeRfdamgDW/","x":"untitled .26\ncopper, polyurethane, steel, acrylic, glycerin, condom, bermudagrass\n\nspirit of discrimination is on view at Women & Their Work until September 3.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"casted-resin, a-frame shirts, florida bermundagrass, peapods","k":"exhibition","s":"2026-08-03","e":"2026-09-03","st":null,"et":null,"u":"larmagar","c":"","co":"","p":"https://www.instagram.com/p/DblMAumEe2A/","x":"casted-resin, a-frame shirts, florida bermundagrass, peapods\n\nincluded in the exhibition, spirit of discrimination at WTW up until September 3, 2026.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This video tours “Upside Down,” an exhibition of new fin sculptures by Alex Israel, whi...","k":"exhibition","s":"2026-06-12","e":"2026-09-05","st":null,"et":null,"u":"gagosian","c":"London","co":"","p":"https://www.instagram.com/p/Dbqoe3HRF-V/","x":"This video tours “Upside Down,” an exhibition of new fin sculptures by Alex Israel, which is currently on view at Gagosian’s Davies Street gallery in London! \n\nRelated to those first exhibited at Gagosian Rome in 2023, the new fins are here inverted and suspended from the gallery ceiling. The installation lends the gallery, with its street-facing windows, a fish tank–like appearance, positioning viewers at an “underwater” vantage. To learn more, follow the link in our bio. \n__________\n#AlexIsrael #Gagosian\nInstallation video, “Alex Israel: Upside Down,” Gagosian, Davies Street, London, June 12–September 5, 2026. Artwork © Alex Israel. Video: Pushpin Films (@pushpinfilms). Music: “First Wave” by Sven Lindvall, Daniel Fridell, courtesy Epidemic Sound","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":-54,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"𝐋𝐮𝐧𝐚 𝐌𝐚𝐡𝐨𝐮𝐱: 𝑾𝒉𝒆𝒓𝒆 𝑾𝒐𝒖𝒍𝒅 𝑰 𝑩𝒆?","k":"exhibition","s":"2026-06-19","e":"2026-09-05","st":null,"et":null,"u":"c_o_r_d_o_v_a_","c":"Barcelona","co":"","p":"https://www.instagram.com/p/DbL1VfzjCMd/","x":"𝐋𝐮𝐧𝐚 𝐌𝐚𝐡𝐨𝐮𝐱: 𝑾𝒉𝒆𝒓𝒆 𝑾𝒐𝒖𝒍𝒅 𝑰 𝑩𝒆?\nOn display from 19.06.2026 until 05.09.2026.\n\nLuna Mahoux es una artista, cineasta y curadora belga de origen etíope cuya práctica se desarrolla a través del cine, la fotografía y la instalación. Su obra explora narrativas afrodiaspóricas invisibilizadas mediante un diálogo entre archivos personales, imágenes vernáculas y la cultura pop de internet para deconstruir, recontextualizar y reinventar historias olvidadas, cuestionando los mecanismos de reapropiación de la identidad en un mundo saturado de imágenes.\n\n. ݁₊ ⊹ . ݁˖ . ݁˙⋆✮⋆｡𖦹°⭒˚｡\n\nLuna Mahoux is a Belgian artist, filmmaker, and curator of Ethiopian origin whose practice spans film, photography, and installation. Her work explores invisibilised Afro-diasporic narratives through a dialogue between personal archives, vernacular images, and internet pop culture, deconstructing, recontextualising, and reinventing forgotten histories while questioning the mechanisms of identity reappropriation in an image-saturated world.\n\n. ݁₊ ⊹ . ݁˖ . ݁˙⋆✮⋆｡𖦹°⭒˚｡\n\nLuna Mahoux és una artista, cineasta i comissària belga d'origen etíop la pràctica de la qual s'estén a través del cinema, la fotografia i la instal·lació. La seva obra explora narratives afrodiaspòriques invisibilitzades mitjançant un diàleg entre arxius personals, imatges vernacles i la cultura pop d'internet, deconstruint, recontextualitzant i reinventant històries oblidades, tot qüestionant els mecanismes de reapropiació de la identitat en un món saturat d'imatges.\n\nPhotos by Roberto Ruiz","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":-35,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"A GENTLE KISS ON A DOUBLE FOREHEAD BY JAN BASZAK","k":"exhibition","s":"2026-06-20","e":"2026-09-05","st":null,"et":null,"u":"findart.platform","c":"","co":"","p":"https://www.instagram.com/p/DbxtwOLCOYN/","x":"A GENTLE KISS ON A DOUBLE FOREHEAD BY JAN BASZAK\n\n«Attention is the rarest and purest form of generosity. It does not entail working out a subtext or categorising things to your liking, but persistence in being with what is there. Its significance grows whenever it encounters what has been harmed or deprived of a voice of its own, allowing us to take a pause and survey the traces of a vanished whole…»\n\n~ Full documentation exhibition is available on findartplatform.com\n\nArtist: @baszakjan \nCurator: @kamilmizgala \nPhoto: #BartoszZalewski\n\nBGSW / Baszta, Słupsk, Poland, 20 June – 5 September 2026","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":-49,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Justin Ming Yong Sun in Eyes, 2023 scrap cotton, polyester, yarn and thread","k":"other","s":"2026-06-25","e":"2026-09-05","st":null,"et":null,"u":"patelbrowngallery","c":"Toronto","co":"","p":"https://www.instagram.com/p/DbeDfnFkSKy/","x":"Justin Ming Yong Sun in Eyes, 2023 scrap cotton, polyester, yarn and thread\n\n⋆˚࿔ 🌞 ༄\n\nJustin Ming Yong is a visual artist who currently lives and works in Toronto, Canada. Yong explores modern abstractions of quiltmaking and improvised textile compositions that destabilize the fictional boundaries between traditional craft and contemporary art.\n\nApproaching quilting as a process of repetition, intuition, and material response, Justin Ming Yong’s enables the textiles to register labour, chance, and the shifting logic of the hand. In Sun In Eyes, layered appliqué builds outward from a central line, producing a sense of movement while revealing underlying colour through uneven strips and repetition. \n\n⋆˚࿔ 🌞 ༄\n\nSlip, Stitch | 25 June to 5 September  21 Wade Ave, Unit 2  Tuesday - Saturday | 10 - 6 \n\n⋆˚࿔ 🌞 ༄ ⋆˚࿔ 🌞 ༄ ⋆˚࿔ 🌞 ༄ ⋆˚࿔ 🌞 ༄ ⋆˚࿔ 🌞 ༄\n#JustinMingYong #TextileArts #Quilting #PatelBrown #ContemporaryArt","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-31","ld":-36,"dl":"2026-09-05","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Holly Chang","k":"exhibition","s":"2026-06-25","e":"2026-09-05","st":null,"et":null,"u":"patelbrowngallery","c":"Toronto","co":"","p":"https://www.instagram.com/p/DbMQmulEU2n/","x":"Holly Chang\nA Thousand Cuts, from a Thousand Caterpillars, 2026\ncyanotypes toned with walnuts and black tea, quilting techniques, naturally dyed textiles\n\n₊˚ʚ 🐛 ₊˚✧ ﾟ.\n\nHolly Chang is an interdisciplinary artist based in Toronto, Canada, working across photography, ceramics, textiles, sculpture, natural dyeing, collage, and installation.  Drawing from found and discarded textiles, archives, and images, Chang repurposes materials to explore identity, hybridity, transformation, race, gender, ecology, history, and alternative ways of existing. \n\nIn Holly Chang’s works, the garden becomes a site for witnessing how life sustains life, as plants support emotional survival while continuing to nourish surrounding ecologies through cycles of growth, decay, and return to soil. Using gardening as a way to move through grief, Chang observes both cultivated and self-seeded plants, questioning hierarchies that privilege certain forms of life over others. \n\n₊˚ʚ 🐛 ₊˚✧ ﾟ.\n\nSlip, Stitch | 25 June to 5 September\n21 Wade Ave, Unit 2\nTuesday - Saturday | 10 - 6\n\n₊˚ʚ 🐛 ₊˚✧ ﾟ.🌱🌱₊˚ʚ 🐛 ₊˚✧ ﾟ.₊˚ʚ 🐛 ₊˚✧ ﾟ.🌱 🌱#HollyChang #Cyanotype #textileart #PatelBrown #ContemporaryArt","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":-29,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Muriel Ahmarani Jaouich Vigil, 2026 oil on canvas","k":"other","s":"2026-06-25","e":"2026-09-05","st":null,"et":null,"u":"patelbrowngallery","c":"Montreal","co":"","p":"https://www.instagram.com/p/Dbv1_x5EY-S/","x":"Muriel Ahmarani Jaouich Vigil, 2026 oil on canvas\n\n🌑 ⋆˚࿔\n\nMuriel Ahmarani Jaouich is a Canadian artist of Armenian, Egyptian, and Lebanese descent based in Tiohtià/Montréal, Canada. Through painting, Ahmarani Jaouich explores genealogy, intergenerational trauma, historical violence, and ancestral grief, drawing from oral histories, photographic archives, and inherited objects to consider how family histories of diaspora, immigration, and genocide move between memory and imagination.\n\nThrough fading, sandblasting, and partial erasure, her layered surfaces become fragile spaces where distant voices and figures re-emerge. In Vigil, watchful beings inhabit the space between memory, protection, and longing. Suspended between appearance and disappearance, they evoke ancestral presences and fleeting recollections. \n\n🕯️⋆˚࿔\n\nSlip, Stitch | 25 June to 5 September  21 Wade Ave, Unit 2  Tuesday - Saturday | 10 - 6 \n\nFor more information on Muriel Ahmarani Jaouich visit patelbrown.com\n\n🕯️⋆˚࿔ 🌑 ⋆˚࿔ 🕯️⋆˚࿔ 🌑 ⋆˚࿔ 🕯️⋆˚࿔ 🌑 ⋆˚࿔ 🕯️⋆˚࿔ 🌑 ⋆\n#MurielAhmaraniJaouich #Vigil #ContemporaryPainting #SlipStitch #PatelBrown","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":-43,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Slip, Stitch | 25 June to 5 September","k":"exhibition","s":"2026-06-25","e":"2026-09-05","st":"10:00","et":null,"u":"patelbrowngallery","c":"Toronto","co":"","p":"https://www.instagram.com/p/DbrIhCtRlgg/","x":"Slip, Stitch | 25 June to 5 September \n\nRooted in reflections on growth and propagation, cultural heritage and belonging, the exhibition traces the threads that bind us to one another and the worlds we inhabit. Through acts of care and exchange, new forms emerge at the seams. \n\n🍦｡𖦹°‧\n\nMuriel Ahmarani Jaouich \nHolly Chang\nLaïla Mestari\nJustin Ming Yong\nJess Riva Cooper\nSwapnaa Tamhane \n\n🍨｡𖦹°‧\n\nPatel Brown is open Tuesday through Saturday, 10 AM to 6 PM.\n\nVisit us before the summer season and our summer showcase comes to a close!\n\n🍦‧˚ʚ🍦🍨ɞ˚‧｡⋆⋆｡‧˚ʚ🍦🍨ɞ˚‧｡⋆⋆｡‧˚ʚ🍦🍨ɞ˚‧｡⋆🍦\n#canadianartist #torontogallery #SLIPSTITCH#contemporaryart #patelbrown","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":-41,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Ann Zhao’s “Spillover” is now on view through September 5, 2026.  Zhao’s title referenc...","k":"exhibition","s":"2026-07-12","e":"2026-09-05","st":null,"et":null,"u":"emptygallery.hk","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DarPg1dCXZ3/","x":"Ann Zhao’s “Spillover” is now on view through September 5, 2026.  Zhao’s title references a passage from Zhuangzi which classifies and ranks different modes of speech according to their ability to communicate the Dao. In this rarefied context, the term “spillover” refers to the indeterminacy of everyday speech in contrast to more fixed or formal modes—a self-renewing flexibility which allows plain words to keep pace with an underlying reality that is never static, but always dynamically changing.1 However, the term might refer equally to the chaotic breach of containment between one category and another—the inevitable pollution (or collateral damage) which occurs when the innate messiness of the subject spills over—as when the dissolution of a single relationship threatens the social coherence of a larger group or when illness or injury (the state of the body) compromise the supposed purity of an intellectual position.\n\nThe heart of Z
