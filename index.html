Pm2jqkQ/","x":"\"Haruspex,\" a solo exhibition of new paintings by Kraków-based artist Krzysztof Grzybacz (@krzysztofgrzybacz), opens soon at #PaceLondon.\n-\nMarking Grzybacz's first solo exhibition in the UK, the presentation will feature new work that explores the body as a construct, how it holds memories of past selves, and how those selves remain visible as we age.\n-\nKrzysztof Grzybacz: Haruspex\nSeptember 3 – October 3\nOpening reception:\nThursday, September 3, 6 – 8 PM\n5 Hanover Square, London\n-\nFollow the link in bio to learn more about the exhibition.\n-\nArtwork: Krzysztof Grzybacz, \"Torso,\" 2026 © Krzysztof Grzybacz\n\n#KrzysztofGrzybacz #PaceLondon #ContemporaryArt #Painting","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":36,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🗓️ SAVE THE DATE !!!","k":"exhibition","s":"2026-09-03","e":null,"st":null,"et":null,"u":"travesiacuatro","c":"Mexico City","co":"","p":"https://www.instagram.com/p/DbNjSoEDIe9/","x":"🗓️ SAVE THE DATE !!!\n\n❗️Travesía Cuatro tiene el placer de anunciar la inauguración de la primera exposición individual de Asunción Molinos Gordo (@asuncionmolinosgordo) en Ciudad de México, \"De aquellos barros, estos lodos\", que inaugurará en el marco de GAMA Week (@gamamx.art) del 3 al 6 de septiembre en Travesía Cuatro CDMX.\n\n—\n\n❗️Travesía Cuatro is pleased to announce the opening of the first solo exhibition by Asunción Molinos Gordo (@asuncionmolinosgordo) in Mexico City, \"De aquellos barros, estos lodos\", which will open as part of GAMA Week (@gamamx.art) from September 3 to 6 at Travesía Cuatro CDMX.\n\n📸 Retrato de la artista by Ángela Suárez","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-25","ld":40,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Woolala (≧▽≦) heres the announcement of our lineup next episode 65 happening this Thurs...","k":"other","s":"2026-09-04","e":"2026-09-06","st":"17:00","et":null,"u":"bigtoilet.radio","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbDKu7nDuZ1/","x":"Woolala (≧▽≦) heres the announcement of our lineup next episode 65 happening this Thursday 23rd livestream at our cosy studio!! Remember to tune in from 5pm and enjoy this toilet ride:\n\n17:00-19:00 DARKMATTER invites Kajol Singh & AMARI\n19:00-20:00 Meis Vranken\n20:00-22:00 Dj STEVE\n\n- @darkmatter.collective invites @amariskingdom @kajariii__ for Auto Erotic Visual Space @uscpresents .\nThis broadcast explores the visual cultures of digital intimacy, asking how online image-making has become an inherently auto-erotic space.\n\n- @macymeissie Ahead of her debut theatre show “Flat News” at Amsterdam Fringe Festival, which takes place at Perdu between 4–6 September, Meis Vranken joins Big Toilet radio for a special episode of home-related radio. She will enter the DJ booth with an eclectic mix of songs, interviews and audio fragments addressing one of the most important spaces of our lives: home.\n\n-and we end with the legend Dj Steve analog punk spinning for 2 hours\n\nstay tune to www.bigtoilet.radio and flush with us:)","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":45,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"📣 This September, Page Not Found reopens its doors after the summer break with a new ex...","k":"exhibition","s":"2026-09-04","e":"2026-10-04","st":"17:00","et":null,"u":"____page_not_found____","c":"The Hague","co":"","p":"https://www.instagram.com/p/DbVV1_0Aiu7/","x":"📣 This September, Page Not Found reopens its doors after the summer break with a new exhibition.\n\nWe are honoured to present “A mouthful of Palestine / لقمة فلسطين “ — the first solo exhibition in The Hague by Palestinian artist Susanne Khalil Yusef.\n\nA mouthful of Palestine / لقمة فلسطين continues Page Not Found's ongoing commitment to artistic practices that confront colonialism, displacement, cultural erasure and the politics of memory.\n\n🗓️ The exhibition opens on Friday 4 September at 17:00 and runs until 4 October 2026.\n\nFor the opening, Susanne Khalil Yusef has invited anthropologist Dina Zbeidy for a discussion. Alongside the exhibition, we are organising a book presentation and additional public events. More details will follow soon.\n\nWe look forward to welcoming you back after the summer.\n\nSusanne Khalil Yusef (1984) is a Palestinian artist based in the Netherlands. She creates vibrant, multidisciplinary installations that combine mural painting, video, ceramics, and participatory practices. While her colorful and playful work appears lighthearted, it critically explores themes of homeland and displacement, identity, and the social and geographical dynamics of power. Her practice seeks to keep memory alive and resist erasure.\n\nDina Zbeidy is an anthropologist based in the Netherlands. Her research focuses on nationalism, social movements, and refugees in the Middle East. She has worked at various human rights organisations in Palestine and the Netherlands.\n\nDesign by @kochi_studio \n\n#SusanneKhalilYusef #soloexhibition #thehague","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":38,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Olete oodatud näitusele avamisele järgmisel kolmapäpäeval, 5. augustil kl 17 Raegalerii...","k":"exhibition","s":"2026-09-05","e":null,"st":"17:00","et":null,"u":"raegalerii","c":"Kuressaare","co":"","p":"https://www.instagram.com/p/DbVExuhiKiL/","x":"Olete oodatud näitusele avamisele järgmisel kolmapäpäeval, 5. augustil kl 17 Raegaleriisse! ☀️\n\n**Ei talu karmi päikese kapriisi / Can’t Do Hard Sun Whim**\n\n🗓 5.08–5.09.2026\n📍 Kuressaare Raegalerii\n🕔 Avamine 5. augustil kell 17.00\n\nKureerinud Anu Vahtra ja Lieven Lahaye.\n\n“Ei talu karmi päikese kapriisi” toob kokku kunstnikud ja disainerid, kelle looming käsitleb valgust ja kulumist nii materiaalsete protsesside kui ka kontseptuaalsete seisunditena. Näitus uurib, kuidas materjalid, kehad ja kujutised aja, kokkupuute ning keskkonna mõjul muutuvad.\n\nPealkiri pärineb Duncan Smithi esseest *Australis*, kus tema nime tähtedest moodustub anagramm *Can’t Do Hard Sun Whim*.\n\nOsalevad: Junny Chun Au Yeung, Sophie Durand, Sandra Ernits, Kasia Fudakowski, Elisabeth Klement, Sandra Kosorotova, Lieven Lahaye, Katja Mater, Laura Pappa, Hanna Samoson, Mall Tomberg ja Anu Vahtra.\n\nPildil: Mall Tomberg, *Päike*, vaibakavand, 1963–1964, Eesti Tarbekunsti- ja Disainimuuseum.\n\nNäituse avamine on osa Merepäevade programmist.\n\nToetajad: Eesti Kultuurkapital, Mondriaan Fonds\n—\n\n**ENG**\n\n**Can’t Do Hard Sun Whim**\n\n📍 Kuressaare Raegalerii\n🗓 August 5 – September 5, 2026\n🕔 Opening: August 5, 17:00\n\nCurated by Lieven Lahaye and Anu Vahtra.\n\n*Can’t Do Hard Sun Whim* brings together artists and designers whose work explores light and wear as material processes and conceptual conditions. The exhibition examines how materials, bodies and images are transformed through time, contact and environmental conditions.\n\nThe title is drawn from Duncan Smith’s essay *Australis*, in which his name becomes the anagram *Can’t Do Hard Sun Whim*.\n\nParticipating artists: Junny Chun Au Yeung, Sophie Durand, Sandra Ernits, Kasia Fudakowski, Elisabeth Klement, Sandra Kosorotova, Lieven Lahaye, Katja Mater, Laura Pappa, Hanna Samoson, Mall Tomberg and Anu Vahtra.\n\nOpening as part of the Kuressaare Maritime Days programme.\n\n Supported by Estonian Cultural Endowment, Mondriaan Fonds","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":39,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Katherine Bernhardt: models, musicians, Morocco, magic, mauve, monsters and magenta is ...","k":"exhibition","s":"2026-09-06","e":null,"st":null,"et":null,"u":"davidzwirner","c":"","co":"Korea","p":"https://www.instagram.com/p/DbV2QmtDRzA/","x":"Katherine Bernhardt: models, musicians, Morocco, magic, mauve, monsters and magenta is on view at the @Seongnam_ArtsCenter in Korea through Sunday, September 6. Following presentations at Gangneung Art Museum Sorol and the @Seoul_Arts_Center, this major retrospective brings together more than 120 original works spanning the artist's career—from paintings made in 1997 to new works created especially for the exhibition.\n\nFeaturing vibrant paintings that transform familiar images—from Pink Panther, Garfield, and E.T. to Nike sneakers, hamburgers, and Coca-Cola—through bold color and energetic brushwork, the exhibition also includes a recreation of @kbernhardt2014’s studio, inviting visitors into the environment where her paintings come to life. Learn more and plan your visit via the link in bio.\n—\n1/2/3/4/6: Installation views, Katherine Bernhardt: models, musicians, Morocco, magic, mauve, monsters and magenta, Seongnam Cultural Foundation, Seongnam, Korea, 2026. Photos by Choi Jae Woo\n5: Photo by Soy Lee, Yun Gyu Ham","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":40,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"this past january i went back to puerto rico for the first time in 7 years without the ...","k":"exhibition","s":"2026-09-06","e":null,"st":null,"et":null,"u":"andinamarieosorio","c":"New York","co":"","p":"https://www.instagram.com/p/DX49DybEXh4/","x":"this past january i went back to puerto rico for the first time in 7 years without the company of my family shepherding me around the island. i think of this work less as my homecoming and more of an investigation around who has the right to return. i focused on landscapes because i felt an ongoing tension between myself, native islanders, and the neo-colonialists that now occupy many parts of this land. my family no longer lives in puerto rico because of land theft and issues with land transference. \n\nthis time showed me so much. the sea presented a friend. green palm trees danced in the courtyard on día del los reyes. entangled mangroves taught me about form. and my collaborator, the caribbean sun, showed up as my ancestors in disguise. most importantly, this time taught me that this land does not belong to me, i belong to this land. \n\nkept thinking about sankofa and its meaning: “go back and get it.” this is one of many more returns back home, and i am so happy I borrowed a little piece of puerto rico to share with harlem. \n\nfade is now open to the public and closes on september 6th.","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-03","ld":126,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Design meets contemporary art 🔎","k":"exhibition","s":"2026-09-08","e":"2026-09-13","st":"11:00","et":null,"u":"lafayetteanticipations","c":"Paris","co":"","p":"https://www.instagram.com/p/DbTBY02jYiE/","x":"Design meets contemporary art 🔎\n\nThis September, as part of @ParisDesignWeek 2026, discover ‘Life of Forms’, an exhibition presented by @LafayetteAnticipations, @artsalula, @designspacealula & AFALULA (@horizonalula) curated by @clement_delepine and @arnaud__morand.\n\nBringing together works from the Collection Lafayette Anticipations (The Moulin Family Endowement Fund) and new creations developed through AlUla’s Design Residency Programme, ‘Life of Forms’ explores the shared territories between contemporary art and design.\n\nMore than a dialogue between disciplines, the exhibition unfolds as a landscape of materials, gestures and narratives - a space where forms reveal new ways of inhabiting and imagining the world.\n\n📍 Lafayette Anticipations l 9 rue du Plâtre, Paris 4\n🆓 Free admission for all\n\n🗓️ 8-13 September\n🕚 Opening hours:\n• Tuesday to Saturday: 11am – 7pm\n• Sunday: 11am – 6pm\n\n💡Curatorial team : @clement_delepine ; @arnaud__morand assisted by @ali.alghazzawi, @studiomarant et @audreychazal.\n\n🖌️ Participating artists & designers: a_l_t_i_n__s_t_u_d_i_o ; @aseelaoa; @xavierantin ; @bahrainidanish ; @meriembennani ; Camille Blatrix ; Katinka Bock ; Etienne Bossut ; Ève Gabriel Chabanon (@macaronic_cheese) ; @gaellechoisne ; @raphael.emine ; Matthew Angelo Harrison ;  @paul.ledron ; @paul.marchesseau ; @ori_orisun\n ; @mathieu_mercier_studio ; Lydia Ourahmane @emogirl4 ; @studiorawmaterial ; @studiothusthat ; @markus_schinwald\n\n🖍️ Graphic design by @40mustaqel \n___________________⁣⁣\n#ParisDesignWeek #Design #ContemporaryArts\n\nQuand les formes deviennent des façons de penser 🔎\n\nEn septembre, à l’occasion de la @ParisDesignWeek 2026, découvrez ‘Vie des Formes’, une exposition présentée par @LafayetteAnticipations, @artsalula, @designspacealula & AFALULA (@horizonalula) sous le commissariat de @clement_delepine et d’@arnaud__morand.\n\nRéunissant des œuvres de la Collection Lafayette Anticipations (Fonds de dotation Famille Moulin) et de nouvelles créations développées dans le cadre du programme de résidence en design d’AlUla, ‘Vie des Formes’ explore les territoires communs entre art contemporain et design.\n\nPlus qu’un dialogue entre disciplines, l’exposit","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":43,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"We’re excited to announce “A Bug’s Life” by Arash Nassiri, the first institutional solo...","k":"exhibition","s":"2026-09-09","e":null,"st":null,"et":null,"u":"fluentumcollection","c":"Berlin","co":"","p":"https://www.instagram.com/p/Dbc1ZC1tiAJ/","x":"We’re excited to announce “A Bug’s Life” by Arash Nassiri, the first institutional solo exhibition by the Berlin-based artist in Germany.\n\nThe eponymous film at its center offers a surreal journey through an opulent Beverly Hills mansion, from the point of view of a wooden insect. As it moves through the palatial interior amid echoing conversations, Nassiri frames the home as a site of aspiration and erasure, where personal and architectural histories intersect.\n\n“A Bug’s Life” opens on September 9, on the occasion of Berlin Art Week. More to come soon!\n\n@arash.nassiri @raoulklooker @nikkkamikkka @berlinartweek","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":40,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"“Abandon the search for Truth; settle for a good fantasy.” - Fran Lebowitz⁠","k":"exhibition","s":"2026-09-10","e":null,"st":"18:00","et":"20:00","u":"luhringaugustine","c":"New York","co":"","p":"https://www.instagram.com/p/DbTISnXEq2L/","x":"“Abandon the search for Truth; settle for a good fantasy.” - Fran Lebowitz⁠\n⁠\nLuhring Augustine is delighted to announce an exhibition entitled “settle for a good fantasy,” showcasing the work of four photographers, Janice Guy, Joe Mama-Nitzberg, Shaun Pierson, and David Seidner. The exhibition will open at our Chelsea gallery on Thursday, September 10 from 6–8pm. ⁠\n⁠\nOther than Pierson, who was included in “Tiptoeing through the Kitchen: Recent Photography” (April 2024), this will be the first presentation of these artist’s works at Luhring Augustine. ⁠\n⁠\nSharing an approach to portraiture that rejects notions of idealization, these artists embrace strategies of patchworking in which the “puzzle pieces” will not, and should not, fit together seamlessly. Eschewing the classical approach of emphasizing a cohesive ideal, they each weave a picture of their subjects from disparate sources of information to create nuanced and multi-faceted impressions. For these artists, the imperfect and the unresolved are paramount: fracturing, then reintegration becomes a pathway towards image-building, slippages erode archetypal portrayals, and questions dominate over answers.⁠\n⁠\nLearn more at the link in our bio.⁠\n–⁠\n#settleforagoodfantasy @JaniceGuyNYC @Shaun_Pierson @JoeMamaNitzberg #DavidSeidner #LuhringAugustine⁠\n⁠\nPhoto: Shaun Pierson, “Untitled (Strawberry on Lace),” 2026, Archival pigment print.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":45,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Save the Date!","k":"opening","s":"2026-09-10","e":"2026-10-17","st":"18:00","et":"22:00","u":"capitainpetzel","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbLk0BvDMIX/","x":"Save the Date!\n\nCapitain Petzel is pleased to announce Austin Martin White's second solo exhibition with the gallery, coinciding with Berlin Art Week.\n\nAustin Martin White\n'T̶h̶e̶ ̶l̶i̶e̶,̶ ̶t̶h̶e̶ ̶l̶a̶r̶p̶ ̶a̶n̶d̶ the lusophile'\n10 September – 17 October 2026\nOpening reception: 10 September, 6–10 PM\n\nImage: © Austin Martin White\n\n#austinmartinwhite #capitainpetzel #berlinartweek #berlinart","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":48,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"🗓️ SAVE THE DATE","k":"exhibition","s":"2026-09-10","e":null,"st":null,"et":null,"u":"travesiacuatro","c":"Madrid","co":"","p":"https://www.instagram.com/p/Dbdpw0fDDSV/","x":"🗓️ SAVE THE DATE \n\n❗️Travesía Cuatro tiene el placer de anunciar \"Bajo el Mango\", una exposición individual de Vivian Suter, organizada en colaboración con GAGA Ciudad de México (@la_houseofgaga). La muestra se inaugurará el 10 de septiembre en Travesía Cuatro Madrid, coincidiendo con Apertura Gallery Weekend (@arte_madrid).\n\n—\n\n❗️Travesía Cuatro is pleased to announce \"Bajo el Mango\", a Vivian Suter’s solo exhibition, organized in collaboration with GAGA Mexico City (@la_houseofgaga). The show will open on September 10 at Travesía Cuatro Madrid, as part of Apertura Gallery Weekend (@arte_madrid).\n\n📸 \n1) Vivian Suter, “Untitled”, n.d. Photograph by Flavio Karrer. \n2)Portrait of the artist. Photograph by Flavio Karrer.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":41,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Unbelievably excited to be in this magical show organized by @laurenwittels + @sashahel...","k":"exhibition","s":"2026-09-10","e":null,"st":null,"et":null,"u":"shaun_pierson","c":"New York","co":"","p":"https://www.instagram.com/p/DbBj1keRQbY/","x":"Unbelievably excited to be in this magical show organized by @laurenwittels + @sashahelinski \n\n“settle for a good fantasy” opens on September 10 and includes myself, Janice Guy, Joe Mama-Nitzberg, and David Seidner. \n\nMark your calendars now! \n\n“Untitled (Strawberry on Lace)”, 2026\n8x10 archival pigment print in 20x24 artist frame \nEdition of 3 + 2AP","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-20","ld":52,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"On September 13th, JVP Houston and Houston DSA will host a reading group on Molly Craba...","k":"reading","s":"2026-09-13","e":null,"st":"15:00","et":"17:00","u":"jvphouston","c":"Houston","co":"","p":"https://www.instagram.com/p/DbT7KukPRb2/","x":"On September 13th, JVP Houston and Houston DSA will host a reading group on Molly Crabapple’s new book Here Where We Live Is Our Country, a popular history of the Jewish Bund, a secular, anti-Zionist labor movement in Eastern Europe at the turn of the 20th Century. Join us to share your thoughts on the work and discuss how Bundist analysis resonates with the contemporary Jewish left and what lessons this story offers to socialist, anti-imperialist struggles today.\n\nOur conversation will be graciously hosted by Basket Books + Art. If you’d like to purchase a copy of Here Where We Live Is Our Country, we suggest visiting Basket where you’ll receive a 10% discount on the book if you mention the JVP/DSA reading group.\n\nWHAT: Here Where We Live Is Our Country reading group discussion\nWHEN: Sunday September 13th, 3-5pm\nWHERE: Basket Books + Art, 115 Hyde Park Blvd\n\nPlease RSVP at bit.ly/jvphouston-readinggroup (select the month September from the dropdown menu). \n\nLooking forward to seeing you there for an insightful and generative discussion!","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-27","ld":48,"dl":"2026-09-13","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"OPENING TODAY: ANNA EHRENSTEIN & HIWA K at @kwinstitutefcontemporaryart KYIV BIENNIAL —...","k":"performance","s":"2026-09-13","e":null,"st":"19:00","et":null,"u":"kowberlin","c":"Berlin","co":"","p":"https://www.instagram.com/p/DZZ5E1Rl7-B/","x":"OPENING TODAY: ANNA EHRENSTEIN & HIWA K at @kwinstitutefcontemporaryart KYIV BIENNIAL — A Bird That Cannot Land\n11.06–13.09.2026\n\nThe Kyiv Biennial is a nomadic, international project that interweaves artistic, political, and social issues. A Bird That Cannot Land, its chapter at KW, takes shape as an extensive live and discursive program and a large-scale exhibition spanning the entire building, contributing to the biennial’s reflections through contemporary art, sound, and exchange. \n\nPUBLIC PROGRAMME:\n\nFRIDAY, JUN 12 at 7 PM\n@hiwakhiwa \nFROM HERE TO THERE: PRACTICE, DISTANCE AND SELF-POSITIONING\nTalk with Julia Ciamafiejeva and Farahnaz Sharifi\nModerated by Azar Mahmoudian \n\nThe panel brings together artists and authors to reflect on personal experiences of resettlement and the continuation of artistic practice across changing contexts. Rather than approaching the topic abstractly, the discussion centres on lived experience: how relocation is perceived, processed, and translated into creative work.\n\nSUNDAY, JUN 14 at 6 PM\n@annaehrenstein \nTHE CLOUD IS STILL BALKANIZED\nPerformance with Yara Mekawei\n\nDuring the Kyiv Biennial, Anna Ehrenstein will host a hybrid lecture-performance combining video, sound, and hypnotic techniques with Yara Mekawei. Building on The 'Balkanization of the Cloud' (2022), one of Ehrenstein’s earlier works, the performance reflects on how nation-state logics continue to reassert themselves within supposedly borderless digital infrastructures.\n\nKW Curatorial Team:\nSofie Krogh Christensen (Curator)\nLinda Franken (Assistant Curator)\nRadia Soukni (Exhibition Assistant)\n\nIf you are in Berlin, join us for the public events at KW Institute for Contemporary Art with Hiwa K and Anna Ehrenstein.\n____\nImages:\n1) Lesia Vasylchenko, Night Without Shadows and Light Without Rippling of Waves, 2025, courtesy the artist and KW Institute for Contemporary Art.\n\n2) Hiwa K, Julia Ciamafiejeva & Farahnaz Sharifi, courtesy the artists and KW Institute for Contemporary Art.\n\n3) Ehrenstein, Katragjini & Mizarahi, 2022, Nationstate As Instagram Influencer, video still, courtesy the artists and KW Institute for Contemporary Art, and KOW, Berlin.","r":false,"b":null,"af":true,"so":false,"pd":"2026-06-10","ld":95,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Bei unserer Ausstellungstour mit Kuratorin Sofie Krogh Christensen (@skchris_ ) und Ass...","k":"exhibition","s":"2026-09-13","e":null,"st":null,"et":null,"u":"berlinbiennale","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbD3kzliNja/","x":"Bei unserer Ausstellungstour mit Kuratorin Sofie Krogh Christensen (@skchris_ ) und Assistenzkuratorin Linda Franken (@lin__d.a) durch die KW Institute for Contemporary Art haben wir als Team der Berlin Biennale ganz besondere Einblicke in die künstlerischen Positionen der Kyiv Biennial gewonnen. Ein erstes Highlight ist die Arbeit 1991 (2026) von Aykan Safoğlu. Auf den folgenden Slides findet ihr einige unserer Lieblingswerke.\n\nAt the exhibition tour with curator Sofie Krogh Christensen and assistant curator Linda Franken, the Berlin Biennale team got insights into the artistic positions of the Kyiv Biennial at KW Institute for Contemporary Art. A first highlight is the work 1991 (2026) by Aykan Safoğlu. You can find some of our favourite works on the following slides.\n\nKyiv Biennial – A Bird That Cannot Land\n11.06.–13.09.26\n@kwinstitutefcontemporaryart @kyivbiennial \n\nBild / Image: Aykan Safoğlu, 1991, 2026. Courtesy der Künstler / the artist. Installationsansicht / Installation view, Kyiv Biennial – A Bird That Cannot Land, KW Institute for Contemporary Art, Berlin 2026. Foto / photo: Frank Sperling\n\nMona Hatoum, Misbah, 2006–07\n\nCredits: Courtesy Mona Hatoum Foundation. Installationsansicht / Installation view, Kyiv Biennial – A Bird That Cannot Land, KW Institute for Contemporary Art, Berlin 2026\n\nGulnur Mukazhanova, Material as Memory, 2026\n\nCredits: Courtesy die Künstlerin / the artist. Installationsansicht / Installation view, Kyiv Biennial – A Bird That Cannot Land, KW Institute for Contemporary Art, Berlin 2026. Foto / photo: Frank Sperling\n\nLesia Vasylchenko, Night Without Shadows and Light Without Rippling of Waves, 2025\n\nCredits: Courtesy die Künstlerin / the artist. Installationsansicht / Installation view, Kyiv Biennial – A Bird That Cannot Land, KW Institute for Contemporary Art, Berlin 2026. Foto / photo: Frank Sperling\n\nSaodat Ismailova, As We Fade, 2024\n\nCredits: Courtesy die Künstlerin / the artist. Installationsansicht / Installation view, Kyiv Biennial – A Bird That Cannot Land, KW Institute for Contemporary Art, Berlin 2026\n\nHito Steyerl & Philipp Goll, Trassniki, 2026\n\nCredits: Courtesy die Künstler*innen / the artists. Installationsansic","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":54,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Submissions for our 2027 exhibition season are open! 🖼️","k":"exhibition","s":"2026-09-13","e":null,"st":null,"et":null,"u":"lhucalubbock","c":"Lubbock","co":"","p":"https://www.instagram.com/p/DZC7zvOlskh/","x":"Submissions for our 2027 exhibition season are open! 🖼️\n\nPlease visit the link in our bio for submission details, full guidelines, and requirements. \n\nGet your proposal in by September 13, 2026! ✨","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-01","ld":104,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"We are thrilled to announce our fall exhibition, “Zine* Together.” Please join us on Th...","k":"opening","s":"2026-09-17","e":null,"st":"17:00","et":"20:00","u":"asiaartarchiveinamerica","c":"New York","co":"","p":"https://www.instagram.com/p/DbYUeI2OSnP/","x":"We are thrilled to announce our fall exhibition, “Zine* Together.” Please join us on Thursday, September 17th from 5-8pm for the opening reception.\n\nZine* Together is the first exhibition of its kind to examine Asian American zines not only as objects, but as actions—creative, collective, and relational. Drawing from AAAinA’s Reading Room collection, this exhibition highlights collaboratively produced zines from 2010 to the present, alongside newly commissioned projects and prompts that trace zine-making as a mode of shared authorship and community building.\n\nZine* Together, itself a collaborative project, is organized by Claire Kim (@mediumrareclaire), Susanna Chang (@soup.sanna), Sarula Bao (@bao___haus), Michelle Yee (@michelleyeephd), Elizabeth Chung, Mary Y. Yang (@marukie) (@openrehearsal), Chen Luo (@chenluo_101), and Tasnima Tanzim (@an_amateurartist).\n\nFor more information and to RSVP, please follow the link in our bio.","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-29","ld":50,"dl":"2026-09-17","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"BOOK FAIR","k":"workshop","s":"2026-09-17","e":"2026-09-20","st":null,"et":null,"u":"rietveldacademie","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/Da3BQ34jAPp/","x":"BOOK FAIR\n\nThe different GRA publishing initiatives and hubs are coming together to join the first edition of 'Dear Books,', a new Amsterdam book fair taking place from 17 - 20 September 2026. \n\nAt the table you will find a selection of publications by PUB Sandberg, Rietveld Journal, Graphic Design department, Public and Project Rietveld and BB (Bookbinding Workshop).\n\nWe look forward to be part of this new BBBBBook community and hope to see you there!!!!!\n\n-- \n@bbbbgrabb \n@pub_sandberg \n@rietveld.journal\n@rietveldgraphicdesign","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":63,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Opening this September: Simone Fattal “Des villes au fond d’un lac” - Musée d’Art Moder...","k":"exhibition","s":"2026-09-18","e":"2027-01-24","st":null,"et":null,"u":"balicehertling","c":"Paris","co":"","p":"https://www.instagram.com/p/DanglF_iERb/","x":"Opening this September: Simone Fattal “Des villes au fond d’un lac” - Musée d’Art Moderne de la Ville de Paris.\n\nOpening on 18 September 2026, this major retrospective spans more than fifty years of Simone Fattal's artistic practice. Born in Syria and raised in Lebanon, Fattal studied in Paris before spending many years in exile in the United States. She now lives and works between Paris, Lebanon, and the United States.\n\nThe exhibition follows the evolution of her practice, from her early landscape paintings of the 1970s, through the decisive shift to sculpture after a ten-year hiatus from making art, to her collages, photographs, and works on paper, culminating in her return to painting in recent years.\n\nOn view 18 September 2026 – 24 January 2027. #SimoneFattal @museedartmodernedeparis","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-10","ld":70,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Opening September 19","k":"exhibition","s":"2026-09-19","e":null,"st":"16:00","et":"19:00","u":"cara_the_org","c":"New York","co":"","p":"https://www.instagram.com/p/DbVzn9BuBhR/","x":"Opening September 19\n𝘑𝘰𝘩𝘢𝘯𝘯𝘢 𝘏𝘦𝘥𝘷𝘢: 𝘎𝘳𝘢𝘷𝘪𝘵𝘺, 𝘔𝘺 / 𝘍𝘢𝘷𝘰𝘳𝘪𝘵𝘦 𝘌𝘯𝘦𝘮𝘺\n\n𝘎𝘳𝘢𝘷𝘪𝘵𝘺, 𝘔𝘺 / 𝘍𝘢𝘷𝘰𝘳𝘪𝘵𝘦 𝘌𝘯𝘦𝘮𝘺 is Johanna Hedva’s (@bighedva) first institutional exhibition in New York. Devoted to deviant forms of knowledge, Hedva’s practice moves between sculpture, installation, video, writing, and sound. \n\nTime functions as a primary material in the exhibition—from a mouthblown glass vessel that slowly drains black goo until it is empty, to a new 20-foot robotic sculpture that spins and tangles ribbon. Works take shape through duration: leaking, sagging, knotting, and giving way. Together they compose an erotics of gravity, asking what beauty becomes when decay is not resisted but allowed to run its course.\n\nSave the date for the opening celebration on Saturday, September 19 from 4–7pm! \n\n𝘎𝘳𝘢𝘷𝘪𝘵𝘺, 𝘔𝘺 / 𝘍𝘢𝘷𝘰𝘳𝘪𝘵𝘦 𝘌𝘯𝘦𝘮𝘺 is curated by Pablo José Ramírez (@pablojoseramirez).\n\n——\n\nGraphic: The Rodina (@therodina)","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":53,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Catherine Nichols (@catherinenichols567) on curating, place and collective imagination.","k":"other","s":"2026-09-19","e":"2026-12-13","st":null,"et":null,"u":"arterritory_com","c":"Berlin","co":"","p":"https://www.instagram.com/p/DavPR00jPmj/","x":"Catherine Nichols (@catherinenichols567) on curating, place and collective imagination.\n\nAustralian-born and Berlin-based, Catherine Nichols is an arts and literary scholar, curator and writer working at the intersection of contemporary art, cultural history and interdisciplinary research.\n\nHer major projects include exhibitions at Hamburger Bahnhof – Nationalgalerie der Gegenwart, the long-term programme “Beuys 2021”, and “Manifesta 14” in Prishtina in 2022 – a biennial unfolding across 25 locations in the city that consolidated Nichols’s understanding of the curator not as a singular author, but as a “creative mediator”.\n\nShe is currently a curator at Hamburger Bahnhof (@hamburger_bahnhof) and is preparing the 18th Lyon Biennale of Contemporary Art, “Passer d’un rêve à l’autre / To Pass from One Dream to Another”, which will run from 19 September to 13 December 2026.\n\nNichols came to Riga during Riga Art Week 2026 (@rigaartweek) as one of the international guests of the VV Foundation Visitors Programme (@vvfoundationlv), which introduces invited art professionals to Latvia’s contemporary art scene through encounters with artists, museums, galleries and artist-run spaces.\n\n-\n\nTo read more, visit us here: arterritory.com","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-13","ld":68,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Really looking forward to this one: Steffani Jemison’s new exhibition Augur opens soon ...","k":"reading","s":"2026-09-20","e":null,"st":"18:00","et":null,"u":"hey.hans","c":"","co":"Germany","p":"https://www.instagram.com/p/DY2A0RYof-j/","x":"Really looking forward to this one: Steffani Jemison’s new exhibition Augur opens soon at @westfaelischerkunstverein. What I love about her work is how it moves between sound, movement, sculpture, drawing, and video, but still feels very grounded and present. The show is about ideas of escape, resistance, listening, and finding ways to move through difficult spaces…not in an abstract way, but in a very physical, human one.\n\nAt the center is this poetic idea of “reading” signs in the world around us, especially through birds, voices, and movement. There’s something quiet but powerful in the way Jemison turns those gestures into a whole exhibition that you can move through.\n\nSteffani Jemison: Augur\nWestfälischer Kunstverein, Münster\n27.6.–20.9.2026\nOpening: Fri, 26 June, 6 pm\n\nPress tour: Thu, 25 June, 11 am (or by appointment)\n\nPerformance Flight Theater: Sun, 6 September, tbd\nRothenburg 30, 48143 Münster, Germany\n\nCurator: @theresaroessler \nAssistant Curator: Vivien Kämpf\nProject Assistant: Ellen Feldmann\n\nChloé Magdelaine / @chloemgde \n\n#SteffaniJemison","r":false,"b":null,"af":true,"so":false,"pd":"2026-05-27","ld":116,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Dit najaar: 𝐒𝐢𝐠𝐦𝐚𝐫 𝐏𝐨𝐥𝐤𝐞 – 𝐇𝐞𝐭 𝐰𝐞𝐭𝐞𝐧 𝐯𝐚𝐧 𝐝𝐞 𝐤𝐥𝐞𝐮𝐫𝐞𝐧","k":"exhibition","s":"2026-09-20","e":null,"st":null,"et":null,"u":"de_pont_museum","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DYPCHMskwno/","x":"Dit najaar: 𝐒𝐢𝐠𝐦𝐚𝐫 𝐏𝐨𝐥𝐤𝐞 – 𝐇𝐞𝐭 𝐰𝐞𝐭𝐞𝐧 𝐯𝐚𝐧 𝐝𝐞 𝐤𝐥𝐞𝐮𝐫𝐞𝐧 \n\nVanaf 20 september 2026 presenteert De Pont Museum de eerste grote tentoonstelling in Nederland van Sigmar Polke sinds zijn retrospectief in het Stedelijk Museum in 1992.\n\nMet meer dan vijftig werken uit de jaren tachtig tot en met de late jaren 2000 staat Polkes experimentele omgang met kleur, pigment en onconventionele schildersmaterialen centraal. 🎨\n\nVan kleurproeven en lakschilderijen tot monumentale ensembles uit Nederlandse museale collecties: de tentoonstelling laat zien hoe Polke de schilderkunst steeds opnieuw bevroeg en uitvond.\n\nNoteer in je agenda!\n\n----\n\nThis autumn: 𝐒𝐢𝐠𝐦𝐚𝐫 𝐏𝐨𝐥𝐤𝐞 – 𝐓𝐡𝐞 𝐊𝐧𝐨𝐰𝐥𝐞𝐝𝐠𝐞 𝐨𝐟 𝐂𝐨𝐥𝐨𝐮𝐫𝐬\n\nFrom 20 September 2026, De Pont Museum presents the first major exhibition in the Netherlands devoted to Sigmar Polke since his retrospective at the Stedelijk Museum in 1992.\n\nBringing together more than fifty works from the 1980s through to the late 2000s, the exhibition focuses on Polke’s experimental approach to colour, pigment and unconventional painting materials. 🎨\n\nFrom colour experiments and lacquer paintings to monumental ensembles from Dutch museum collections, it reveals how Polke continually questioned and reinvented painting.\n\nA joint exhibition by De Pont Museum and Anna Polke Foundation @annapolkestiftung . Curators: Kathrin Barutzki (Anna Polke Foundation), Martijn van Nieuwenhuyzen and Maria Schnyder (De Pont Museum). This exhibition is part of the project Sigmar Polke: Athanor NOW @athanor_now, organized by the Anna Polke Foundation and financially supported by the Thomas and Doris Ammann Foundation, Zurich.\n\nImage 1: Sigmar Polke, Lapis Lazuli II (1994). Picture: David Huguenin. Collection Carré d’Art - Musée d’art contemporain, Nîmes. © The Estate of Sigmar Polke, Cologne / Pictoright Amsterdam 2026\n\nImage 2-4: Sigmar Polke, Hermes Trismegistos I-IV (1995). Pictures: Antoine van Kaam. Collection De Pont Museum, Tilburg NL. © The Estate of Sigmar Polke, Cologne / Pictoright Amsterdam 2026\n\n#SigmarPolke #DePontMuseum #HetWetenVanDeKleuren #AthanorNOW #ContemporaryArt #HedendaagseKunst #Kunst #Art #Paintings","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-12","ld":131,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Opening September 24, 2026—“Arthur Jafa: I Am Tony”","k":"exhibition","s":"2026-09-24","e":null,"st":null,"et":null,"u":"newmuseum","c":"New York","co":"","p":"https://www.instagram.com/p/DbTMADQmGhu/","x":"Opening September 24, 2026—“Arthur Jafa: I Am Tony”\n\nThe largest museum survey exhibition to date of the work of Arthur Jafa (@anamibia) will span two floors of the newly expanded New Museum to encompass the full breadth of the artist’s practice. Alongside the premiere of new work, \"I Am Tony\" will feature Jafa’s most celebrated films, including \"Love is the Message, The Message is Death\" (2016) and the Golden Lion-winning \"The White Album\" (2019), as well as recent paintings, large-scale video and film installations, and a range of sculptural and photographic objects.\n\nPreorder the catalog co-published by the New Museum and @phaidonpress now using the link in bio 🔗\n—\nArthur Jafa, Monster, 1988, printed 2017. Courtesy the artist and Gladstone","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":59,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"This September, join us for two evenings celebrating architecture, design, food, and co...","k":"other","s":"2026-09-25","e":null,"st":null,"et":null,"u":"makcenter","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/Dan5yX6AQcR/","x":"This September, join us for two evenings celebrating architecture, design, food, and community at the Fitzpatrick-Leland House.\n\nGLOW UP marks the first spark in the revitalization of the MAK Center’s Fitzpatrick-Leland House (R.M. Schindler, 1936). Over two evenings, these MAK Center Benefit events celebrate the first phase of a brighter vision for the Fitzpatrick-Leland as a site for research, cultural exchange, culinary programs, and public engagement. \n\nSeptember 25 | SEATED DINNER & AUCTION PREVIEW features an intimate seated dinner and preview of the lighting auction and the Fitzpatrick-Leland House kitchen renovation.\n\nSeptember 26 | COCKTAIL RECEPTION & AUCTION brings together a broader community for a cocktail reception and benefit auction celebrating design, architecture, and the next chapter of the Fitzpatrick-Leland House.\n\nSave the date(s)! Join us for one night, or come for both!\n\n---\n\nGLOW UP\nMAK Center Benefit & Auction\nSeptember 25 & 26, 2026\n\n---\nLearn more, including sponsorship and auction opportunities, via the link in our bio.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-10","ld":77,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":false,"t":"An incredible exhibition featuring 60 years of Ha Chong-Hyun’s work will be on display ...","k":"exhibition","s":"2026-09-25","e":null,"st":null,"et":null,"u":"alexandria.masse","c":"San Francisco","co":"","p":"https://www.instagram.com/p/DbWDve7RseF/","x":"An incredible exhibition featuring 60 years of Ha Chong-Hyun’s work will be on display at the\n@asianartmuseum in San Francisco starting September 25th #hachonghyun #asianartmuseumpartner #ad","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":59,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"What if you are an artist or a maker that does not fit the traditional mould of making,...","k":"screening","s":"2026-09-26","e":null,"st":null,"et":null,"u":"estafet_denhaag","c":"The Hague","co":"","p":"https://www.instagram.com/p/DaxgnL6gCxh/","x":"What if you are an artist or a maker that does not fit the traditional mould of making, distributing and presenting?\n\nFor ESTAFET’s third edition, @wysiwygcinema invites you to reflect and discuss how we could redefine the filmmaker. For a city truly dedicated to film, it is essential that these different practices find a roof, network and community.\n\nJoin for a keynote, panel talk, a screening and a roundtable session where we discuss with you different themes that explore practice and possibilities for makers. Expect an afternoon of inspiring ideas, thought-provoking questions by you and others, and encounters with a plurality of makers and film professionals.\n\nEdition 3: Redefining the filmmaker\nDate: Saturday, September 26, 2026\nTime: 13.00 - 15.15, followed by networking drinks \nLocation: West Den Haag @westdenhaag \nProgramme & tickets: claim your spot from August 18 via www.westdenhaag.nl","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-14","ld":74,"dl":"2026-09-26","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Eine formgebende Stille, ebenso wie die künstlerische Geste, Abwesenheiten körperlich e...","k":"exhibition","s":"2026-09-27","e":null,"st":null,"et":null,"u":"hausamwaldsee","c":"Vienna","co":"","p":"https://www.instagram.com/p/DbaA00PCGUZ/","x":"Eine formgebende Stille, ebenso wie die künstlerische Geste, Abwesenheiten körperlich erfahrbar zu machen, durchziehen die Ausstellung ,Wo ich wohne‘. Der Fotograf Robert Haas dokumentierte zwischen 1937 und 1938 auf Anfrage das Inventar jüdischer Familien in Wien kurz vor deren erzwungener Emigration. Entstanden sind Wohnungsaufnahmen, in denen vor allem die Abwesenheit von Leben spürbar ist. \n\nIn ihrem Buch ,Traumaland‘ (Rowohlt, 2025) schreibt die Autorin Asal Dardan über die Fotografien: „Das Wissen, mit dem wir heute auf sie schauen, macht sie zu historischen Dokumenten der Gewalt. Doch sie halten nicht den Täterblick fest, sondern das, was den betroffenen Menschen selbst wichtig war. Sie halten fest, dass sie hier waren und sein wollten – in diesen Zimmern, in diesen Wohnungen, in dieser Nachbarschaft.“ \n\nA form-giving silence and the artistic gesture of making absences tangible permeate the exhibition ‘Wo ich wohne’. Between 1937 and 1938, the photographer Robert Haas was commissioned to document the household inventories of Jewish families in Vienna shortly before their forced emigration. The result is a series of photographs in which the absence of life is particularly palpable. \n\nIn her book ‘Traumaland’ (Rowohlt, 2025), Asal Dardan writes about the photographs: “The knowledge with which we look at them today turns them into historical documents of violence. Yet they do not capture the perpetrator’s gaze, but rather what mattered to the people affected. They record that these people were here and wanted to be here – in these rooms, in these apartments, in this neighbourhood.”\n\nRobert Haas, Wohnung Szabo, Wien, 1938. Courtesy Wien Museum \n\nWo ich wohne\n14.6 .– 27.9.2026\n#80jahrehausamwaldsee #roberthaas @ad.a.g @piamremmers\n\nZitiert nach / Quote cited and translated to English from: Asal Dardan (@asaldardan), Traumaland, Rowohlt Verlag (@rowohltverlag), 2025","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":59,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Richard Venlet has analysed in depth the architecture of Haus am Waldsee for the exhibi...","k":"screening","s":"2026-09-27","e":null,"st":null,"et":null,"u":"hausamwaldsee","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbU6ejUAmA9/","x":"Richard Venlet has analysed in depth the architecture of Haus am Waldsee for the exhibition ‘Wo ich wohne’. The result is a construction, in which the relation between the history of the place as a private residence and the local practice of exhibiting are explored. He takes the early twentieth-century architectural form of the wall-panel and presents it as a minimalist art form, loosening the reference to its bourgeois origins. The work functions as free-standing screens and room dividers that enable new configurations and ways of moving through the space.\n\nFür die Ausstellung ,Wo ich wohne‘ unterzog Richard Venlet die Architektur des Haus am Waldsee einer Tiefenanalyse. Das Ergebnis ist eine Konstruktion, in der sowohl die Geschichte des Ortes als Wohnraum als auch die lokale Praxis des Ausstellens befragt wird. Auf die architektonische Tradition der Wandpaneele des frühen 20. Jahrhunderts zurückgreifend, nutzt er diese, um sie aus ihrer bürgerlichen Verankerung zu lösen. Er strukturiert sie als reduzierte Formen, von der Wand losgelöste Paravents und Raumteiler, die neue Wegführungen und Bespielungen der Räume ermöglichen.\n\nWo ich wohne\n14.6 .– 27.9.2026\n#80jahrehausamwaldsee #richardvenlet @ad.a.g @piamremmers\n\nInstallation views / Installationsansichten, Wo ich wohne, Haus am Waldsee, 2026, photos / Fotos: Frank Sperling","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":61,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"The current exhibition in our café, Green Sanctuary (C.O.T.B) by Veit Laurent Kurz, ent...","k":"exhibition","s":"2026-09-27","e":null,"st":null,"et":null,"u":"hausamwaldsee","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbFxVtnglfX/","x":"The current exhibition in our café, Green Sanctuary (C.O.T.B) by Veit Laurent Kurz, enters into a dialogue with the history of Haus am Waldsee and its natural surroundings by bringing together observations of ecology, psychological reflection, and historical enquiry with the imagined perspective of the bee. The works propose a speculative shift in perception, inviting reflection on how environments, behaviours, and sensory worlds might appear if the human viewpoint was displaced – as seen in the hybrid, surreal forms of the ceramic water troughs and beehives in the series ‘Bee Fountain’.\n\nDie aktuelle Ausstellung in unserem Café, Green Sanctuary (C.O.T.B) von Veit Laurent Kurz, tritt in Dialog mit der Geschichte des Haus am Waldsee und seiner natürlichen Umgebung, indem sie ökologische Beobachtung, psychologische Reflexion und historische Recherche mit der imaginierten Perspektive von Bienen verwebt. Die Werke laden ein zu überlegen, wie Umgebungen, Bewegungen und sensorische Welten erscheinen könnten, wenn der menschliche Blickpunkt verschoben wird – etwa in den Keramiken der Serie ,Bee Fountain‘, die Wassertränken und Bienenstöcke zu hybriden, surrealen Formen zusammenführen.\n\nVeit Laurent Kurz. Green Sanctuary (C.O.T.B)\n14.6. – 27.9.2026\nPart of Since… / Teil von Seit…\n#80jahrehausamwaldsee @die_kette_moabit @piamremmers @cafe.imhausamwaldsee \n\nImages / Bilder: Installation views / Installationsansichten Veit Laurent Kurz. Green Sanctuary (C.O.T.B), part of Since… / Teil von Seit…, Haus am Waldsee, 2026, photos / Fotos: Robert Hamacher","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":67,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"\"From a Faraway Meadow (Desde un prado lejano)\"","k":"exhibition","s":"2026-09-27","e":null,"st":null,"et":null,"u":"lowgroundpressure","c":"Paris","co":"","p":"https://www.instagram.com/p/DbctJKRF4VQ/","x":"\"From a Faraway Meadow (Desde un prado lejano)\"\nArtist: María Enríquez @maria.e.m\nCurated by: Diego González Gómez / Marco Valtierra @_iego_ @marcovaltierra\n📍Espacio Cabeza, Simón Bolívar 181, Col Americana, Lafayette, 44160 Guadalajara, Jal. @espaciocabeza\n14.05-27.09.2026\n\nRead the complete text on lowgroundpressure.blog web platform (🔗 in stories) and find the exhibition on the offseen map (@offseen_official).\n\n📸 Agustín Arce Figueroa @agusarcefigueroa, courtesy the artist and the gallery;\n\n#contemporaryart #artisttoday #lowgroundpressure #arttoday #artist","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":58,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":false,"t":"Martin Parr’s Small World is going to @Fotofest_Hawkes_Bay_NZ 📸 This is the first Marti...","k":"exhibition","s":"2026-09-28","e":"2026-10-22","st":null,"et":null,"u":"martinparrstudio","c":"Paris","co":"","p":"https://www.instagram.com/p/DbaDmlamcHG/","x":"Martin Parr’s Small World is going to @Fotofest_Hawkes_Bay_NZ 📸 This is the first Martin Parr exhibition in New Zealand for over 25 years, which will be on display at @CreativeArtsNapier 28 SEPT to 22 OCT 2026 / FREE ENTRY 🙌\n\nSmall World is one of Martin's longest running series, which documents tourism across the globe over a period of more than four decades 🌎\n\n“It’s incredible to be able to share the work of a photographer of Martin Parr’s calibre with our city and New Zealand. His images are thought-provoking and instantly recognisable, and we’re thrilled people will be able to experience them here in Hawke’s Bay.” - Shayne Jeffares, FOTOFEST founder\n\nThis exhibition, presented by Milford, is one of more than 60 free exhibitions taking place across Hawke’s Bay during FOTOFEST 2026, celebrating photography in galleries, public spaces and unexpected locations throughout the region.\n\nThis week we're looking at a selection of images from Small World featuring in the show 👀\n\nPhoto - Louvre, Paris, France, 2012 © Martin Parr / Magnum Photos","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":60,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Te zien t/m 28 september: Anna Moreno in het MACBA (Barcelona)","k":"exhibition","s":"2026-09-28","e":null,"st":null,"et":null,"u":"stroom_den_haag","c":"Barcelona","co":"","p":"https://www.instagram.com/p/DbasW71oQCd/","x":"Te zien t/m 28 september: Anna Moreno in het MACBA (Barcelona)\nThe Third Twist brengt Anna Moreno’s onderzoek naar tijdelijkheid, utopische architectuur en speculatieve verbeelding samen in één solotentoonstelling. Centraal staat The Terminal Beach, een roadmovie over een onvoltooide nomadische nederzetting in de Algerijnse Sahara. Met de film verbeeldt ze samen met co-regisseur Bernardo Zanotta het spanningsveld tussen koloniale erfenissen en modernistische idealen.  \n\nReageer met ‘LINK’ in de comments en ontvang het HKNL profiel van Anna Moreno direct in je inbox!\n\n[ENG]\nOn show until 28 September: Anna Moreno at MACBA (Barcelona) \nThe Third Twist brings together Anna Moreno’s exploration of temporality, utopian architecture and speculative imagination in a single solo exhibition. The central piece is The Terminal Beach, a road movie about an unfinished nomadic settlement in the Algerian Sahara. Through this film, she and co-director Bernardo Zanotta depict the tension between colonial legacies and modernist ideals. \n\nDrop “LINK” in the comments and Anna Moreno’s profile will land straight in your inbox!\n\n#StroomDenHaag #Stroom #HKNL #Haagsekunstenaars @aa_oeo @macba_barcelona","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":60,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"it’s finally time 💓 we’re taking our album to you (some of you) tickets are on sale now...","k":"other","s":"2026-09-28","e":null,"st":null,"et":null,"u":"segabodega","c":"London","co":"","p":"https://www.instagram.com/p/DaDCFTxNcQ7/","x":"it’s finally time 💓 we’re taking our album to you (some of you) tickets are on sale now come meet us as the show - tickets on @kissfacility page \n\n- 28th Sep – Warsaw, Niebo\n- 29th Sep – Berlin, HAU Theatre\n- 30th Sep – Prague, Fuchs2\n- 7th Oct – Paris, Main Room\n- 8th Oct – Amsterdam, Paradiso\n- 9th Oct – Brussels, Botanique\n- 15th Oct – Ankara, 6.45KK\n- 16th Oct – Istanbul, Salon IKSV\n- 22nd Oct – Oslo, BLÅ\n- 23rd Oct – Copenhagen, Alice\n- 2nd Nov – Porto, Mouco\n- 3rd Nov – Madrid, Sala Uni\n- 4th Nov – Barcelona, Sala Upload\n- 13th Nov – London, ICA\n- 14th Nov – Manchester, The Abbey\n- 15th Nov – Bristol, Strange Brew\n- 16th Nov – Dublin, The Grand Social","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-06-26","ld":94,"dl":"2026-09-28","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Announcing MIT Future Fest (@mitmuseum): a new five-day festival this Fall, opening MIT...","k":"exhibition","s":"2026-09-30","e":"2026-10-04","st":null,"et":null,"u":"digitalcounsel.xyz","c":"Cambridge","co":"United States","p":"https://www.instagram.com/p/DYADJeOu0pr/","x":"Announcing MIT Future Fest (@mitmuseum): a new five-day festival this Fall, opening MIT’s doors to the world, inviting you to participate in the next era of science, technology, and human understanding. Join us September 30–October 4, 2026, on MIT’s campus in Cambridge, MA.\n\nTickets go live in June. Sign up now at MITFutureFest.org to be first in line and unlock an early-access discount.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-05-06","ld":147,"dl":"2026-10-04","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"OCTOBER 2 @roulette_intermedium","k":"other","s":"2026-10-02","e":null,"st":null,"et":null,"u":"fiery_furnaces","c":"New York","co":"","p":"https://www.instagram.com/p/DbdnnyxRqR3/","x":"OCTOBER 2 @roulette_intermedium \nGuitar bass and drums show\nTickets in the bio","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-31","ld":63,"dl":"2026-10-02","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"On Friday 2 October, the long-running concert series Rewire x Korzo, organised in colla...","k":"performance","s":"2026-10-02","e":null,"st":null,"et":null,"u":"rewirefestival","c":"The Hague","co":"Netherlands","p":"https://www.instagram.com/p/DbXzxGsiJus/","x":"On Friday 2 October, the long-running concert series Rewire x Korzo, organised in collaboration with @korzotheater, presents its 25th edition at one of The Hague's most cherished performing arts venues. ⁠\n⁠\nOne of the most engaging albums released so far this year, 'Duori' is a collaborative album from Heith – artist and musician Daniele Guerrini, a co-founder of adored Italian underground label @haunter.records – and Tarawangsawelas, a duo from Bandung who reenvision a contemporary version of Tarawangsa, a form of sacred music from Sundanese West Java.⁠\n⁠\nThe illusory music of musician, home-recorder, and NTS Radio resident Dagmar Zuniga projects a ghostly picture. Zuniga joins the lineage of softly sung folk musicians building dark, mysterious worlds through very stripped back means. Awash with tape hiss, her hypnagogic folk hallucinations sound as if they emerge from some plane between this world and the next – from some place between the conscious world and what awaits in dreams.⁠\n⁠\nAfter a beautiful performance at Rewire 2026, Paris-Based Egyptian composer, writer, and singer Abdullah Miniawy returns to The Hague for Rewire x Korzo #25. Performing as part of a trio, made up of him and trombonists Robinson Khoury and Jules Boittin, Miniawy brings his multidimensional music to life, inspired by jazz elements and Egyptian soundscapes.⁠\n⁠\nRewire x Korzo #25 on Friday, 2 October presents Abdullah Miniawy Trio (@abdullahminiawyofficial), @heith___ & @tarawangsawelas, and Dagmar Zuniga (@dagmarzuni).⁠ Read more and book tickets via the 🔗 in bio.","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-29","ld":65,"dl":"2026-10-02","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"On view","k":"performance","s":"2026-10-03","e":null,"st":null,"et":null,"u":"projets.media","c":"Paris","co":"","p":"https://www.instagram.com/p/DbTVLB8Demo/","x":"On view \n↘ Nefeli Papadimouli, « Garden of Commons », Le Grand Café, Saint-Nazaire\n\nLe Grand Café - centre d’art contemporain d’intérêt national (@legrandcafe_saintnazaire) présente un projet de l’artiste grecque Nefeli Papadimouli (@nefeliepd), déployé sur deux sites : le centre d’art puis le Radôme, sur le toit de la base sous-marine, avec une performance commune le 3 octobre. Architecte de formation, l’artiste travaille le textile comme matériau d’espace commun, entre corps et usages, en écho au jardin en mouvement de Gilles Clément installé juste à côté. Au programme : un rideau de patrons de couture manipulables par le public (« Lignes de désir »), des façades textiles inspirées des luttes en Pays de la Loire, et la performance « Blowing the Whistle » reliant les deux expositions.\n\n•\nAs part of its 2026 program, Le Grand Café - centre d’art contemporain d’intérêt national (@legrandcafe_saintnazaire) presents a project by Greek artist Nefeli Papadimouli (@nefeliepd), unfolding across two sites: the art centre and the Radôme, on the roof of the submarine base, with a performance linking both venues on October 3. Trained as an architect, the artist works with textile as a material for common space, between bodies and uses, echoing Gilles Clément’s neighboring « jardin en mouvement. » On the program: a curtain of sewing patterns visitors can handle (« Lignes de désir »), textile facades inspired by uprisings in the Pays de la Loire, and the performance « Blowing the Whistle, » linking both exhibitions.\n\n📍 Le Grand Café, Saint-Nazaire \nOuvert dès maintenant jusqu’au 4 octobre 2026 \n\n📍 Le Radôme, Saint-Nazaire \nOuverture le 23 septembre, jusqu’au 18 octobre 2026\n\n@legrandcafe_saintnazaire\n\nImages : Vue de l’exposition au Grand Café, 2026. Courtesy Nefeli Papadimouli. Photo ©️ Fanny Trichet.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":68,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":false,"t":"Das Team der Berlin Biennale hat die Manifesta 16 während der Eröffnungstage besucht. D...","k":"exhibition","s":"2026-10-04","e":null,"st":null,"et":null,"u":"berlinbiennale","c":"Berlin","co":"","p":"https://www.instagram.com/p/DaNqdFciD55/","x":"Das Team der Berlin Biennale hat die Manifesta 16 während der Eröffnungstage besucht. Die 16. Ausgabe der nomadischen europäischen Biennale findet in vier Städten im Ruhrgebiet statt. Wir möchten gerne einige Eindrücke mit euch teilen, da unsere Organisationen viele künstlerische Werte verbinden:\n\n1) ,Aus der Serie 29‘ von Małgorzata Mirga-Tas, Künstlerin der 11. Berlin Biennale\n2) Der St Bonifatius-Ferdane Satır Teegarten vorgestellt von Gürsoy Doğtaş als Hommage an den ersten Garten deutscher „Gastarbeiter*innen“ mit den Arbeiten ,You Are What You Hold‘ von Özlem Altın, Künstler der 10. Berlin Biennale, sowie ,Tea Garden‘ von Bureau Baubotanik\n3) Die aufblasbare Installation ,Kein Geläut‘ von Marina Naprushkina, Teilnehmerin der 7. Berlin Biennale\n4) Die von CaboSanRoque mit FLEXO ARQUITECTURA Kollektiv als Klanginstallation und wettbewerbsfreier Sportraum konzipierte Arbeit ,FAIL LOUDER‘\n5) Die monumentale Installation ,Möglich Unvorhersehbar‘ von Penique Productions\n\nThe Berlin Biennale team visited Manifesta 16 during the opening days. The 16th edition of the nomadic European biennial is taking place in four cities across the Ruhr Area. We’d like to share some of our impressions with you, as our organizations share many artistic values:\n\n1) ‘From the series 29’ by Małgorzata Mirga-Tas, a participating artist of the 11th Berlin Biennale\n2) The St Bonifatius – Ferdane Satır Tea Garden presented by Gürsoy Doğtaş as a tribute to the first garden created by German “guest workers“, featuring the works ‘You Are What You Hold’ by Özlem Altın, who was also part of the 10th Berlin Biennale, as well as ‘Tea Garden’ by Bureau Baubotanik\n3) The inflatable installation ‘Kein Geläut’ by Marina Naprushkina, who was part of the 7th Berlin Biennale\n4) The work ‘FAIL LOUDER’, conceived as a sound installation and non-competitive sports space by CaboSanRoque in collaboration with the FLEXO ARQUITECTURA collective\n5) The monumental installation ‘Möglich Unvorhersehbar (Possibly Unpredictable)’ by Penique Productions\n\nManifesta 16 Ruhr\n21.06–04.10.2026\n@manifestabiennial","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-30","ld":96,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"𝗢𝘂𝘁 𝗡𝗼𝘄 ✨ 𝘿𝙚𝙖𝙧 𝙈𝙖𝙯𝙞𝙚,: 𝙎𝙖𝙣𝙘𝙩𝙪𝙖𝙧𝙮, 𝙎𝙥𝙚𝙘𝙪𝙡𝙖𝙩𝙞𝙤𝙣, 𝙖𝙣𝙙 𝙎𝙠𝙮","k":"exhibition","s":"2026-10-04","e":"2026-12-27","st":null,"et":null,"u":"cara_the_org","c":"New York","co":"","p":"https://www.instagram.com/p/DaxpdwtDlRl/","x":"𝗢𝘂𝘁 𝗡𝗼𝘄 ✨ 𝘿𝙚𝙖𝙧 𝙈𝙖𝙯𝙞𝙚,: 𝙎𝙖𝙣𝙘𝙩𝙪𝙖𝙧𝙮, 𝙎𝙥𝙚𝙘𝙪𝙡𝙖𝙩𝙞𝙤𝙣, 𝙖𝙣𝙙 𝙎𝙠𝙮\n\nWe are pleased to announce the release of 𝘋𝘦𝘢𝘳 𝘔𝘢𝘻𝘪𝘦,: 𝘚𝘢𝘯𝘤𝘵𝘶𝘢𝘳𝘺, 𝘚𝘱𝘦𝘤𝘶𝘭𝘢𝘵𝘪𝘰𝘯, 𝘢𝘯𝘥 𝘚𝘬𝘺, an experimental reader that explores the legacy of artist and educator Amaza Lee Meredith (1895–1984), the first known Black queer woman to practice as an architect in the United States. Through essays, conversations, and artistic interventions, the publication situates Meredith’s life and work within broader histories of placemaking, gender, sexuality, and Black love.\n\nFeaturing previously unpublished photos, blueprints, letters, and scrapbooks from Meredith’s archives, the publication accompanies a group exhibition of the same name, which originated at the Institute for Contemporary Art at Virginia Commonwealth University (@icavcu) and traveled to the California African American Museum (@caaminla). From October 4 to December 27, 2026, it will be on view at The Church, Sag Harbor (@thechurchsagharbor)—not far from Azurest North, a community founded by Black families with instrumental contributions from Meredith and her sister Maude Terry. Both the exhibition and publication take Meredith’s expansive letter-writing practice as a conceptual framework for epistolary responses in the present.\n\n🔗 Order via link in bio. \n\nEdited with text by Amber Esseiva (@amberesseiva)\n\nForeword by Jessica Bell Brown, ICA at VCU Executive Director (@teacherbell)\n\nInterviews with AD-WO (Emanuel Admassu and Jen Wood) (@ad__wo) and Alexis Pauline Gumbs (@alexispauline)\n\nOral Histories by Joel Howard, Regenia Perry, Reverend Grady Powell, and Steve Williams\n\nContributions by Mario Gooden, Anne Spencer, Colson Whitehead, Mabel O. Wilson (@studio_and), Charisse Pearlina Weston, and Craig Wilkins\n\nDesigned by @practisetheory \n\nArtwork by Lukaza Branfman-Verissimo (@bluekaza), Abigail Lucien (@abigaillucien), Tschabalala Self (@tschabalalaself), Cauleen Smith (@cauleensmith), The Black School (Joseph Cuillier and Shani Peters) (@theblackschool), and Kapwani Kiwanga (@kapwanikiwanga)\n\nCo-published with the Institute for Contemporary Art at Virginia Commonwealth University","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":82,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"‘Nothing Personal’ is a solo show by Alex Margo Arden at the Nicoletta Fiorucci Foundat...","k":"exhibition","s":"2026-10-09","e":"2027-01-23","st":null,"et":null,"u":"nicolettafioruccifoundation","c":"London","co":"United Kingdom","p":"https://www.instagram.com/p/DZmqWZziiLj/","x":"‘Nothing Personal’ is a solo show by Alex Margo Arden at the Nicoletta Fiorucci Foundation in London from 9 October 2026 to 23 January 2027, curated by Vittoria de Franchis. \n\nThe presentation follows Arden’s award of the inaugural Nicoletta Fiorucci Foundation Prize at Frieze London 2025.\n\nAlex Margo Arden is an artist whose work interrogates value, authorship, and the process of historicisation. Through research-led reenactments of specific cultural artefacts, her practice exposes how images and narratives are reconstructed over time.\n\nIn ‘Nothing Personal’, Arden restages the personal property of Amy Winehouse. Installed across all rooms of the Foundation, the exhibition examines the effects of celebrity ownership and death on the circulation of everyday objects, transforming them into sites of fetishisation and speculation.\n\nThe exhibition will be accompanied by a public programme and a publication.\n\nAlex Margo Arden ‘Nothing Personal’ \n9 October 2026 - 23 January 2027\n\nNicoletta Fiorucci Foundation\n8 Chelsea Embankment \nSW3 4LE London \n\nPhoto: Eva Herzog\n\n@olddrag @nicoletta_fiorucci_london @vittoria.totale @tommounapress @friezeofficial @ginnyonfrederick @eva_herzog_","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-15","ld":116,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Calling all Mainers - applications are now live for Open Door 2026! 🍂","k":"workshop","s":"2026-10-09","e":null,"st":null,"et":null,"u":"haystack_school","c":"Deer Isle","co":"United States","p":"https://www.instagram.com/p/DbTUl7kxZtY/","x":"Calling all Mainers - applications are now live for Open Door 2026! 🍂\n\nRunning from Friday, October 9 - Monday, October 12, Open Door offers Maine residents seven incredible workshops with established artists from across the country, designed for all skill levels and backgrounds. \n\nWhether you’re a beginner or an experienced craftsperson, this is a great opportunity to learn craft at Haystack to close out our 75th season!\n\n⚒️ BLACKSMITHING\nShawn Lovell (she/her) @Slmetalworks | Forging Kitchen Tools: Spoons, Spatulas + Hooks\n\n🏺 CERAMICS\nFrank Zhu (he/him) @frankzhuceramicist | Breaking the Confines of the Wheel\n\n🤖 FAB LAB\nKimberly Lyle (she/her) @kimber.lyle | 3D Printing with Bio-Based Materials\n\n🪡 FIBER\nCarly Owens Weiss (she/her) @carlyowensweiss | Encrusted: Explorations in Contemporary Bead Embroidery\n\n🖼️ GRAPHICS\nAshley Page (she/her) @ashleypage.studio | Papercoated: Sculptural Papermaking\n\n💠 METALS\nVenetia Dale (she/her) @venetiadale | Fiber Techniques and Metal\n\n🪵 WOOD\nFredy Huaman Mallqui (he/him) @fredyartworkrestoration| Hand Wood Carving\n\nThe application deadline is Friday, August 14, so don’t wait! For full workshop descriptions and info on how to apply, click the 🔗 in our bio.\n\n*NOTE: Given the interest in this program, Haystack accepts people based on a lottery system and is open to Maine residents age 18 and over who reside in the state for more than 9 months of the year.*","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":74,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"REVERSED VIEW, 2026","k":"exhibition","s":"2026-10-11","e":null,"st":null,"et":null,"u":"lenamemrich","c":"Osnabrück","co":"","p":"https://www.instagram.com/p/Da4uaS-jAF0/","x":"REVERSED VIEW, 2026 \n\nWithin a window bay at Kunsthalle Osnabrück, Lena Marie Emrich installs an ornamental window grille. Displaced from exterior to interior, it becomes both threshold and barrier, rendering protection visible as an ambivalent spatial condition.\n\nAt its centre, a natural acrylic stone inlay depicts a turning female figure whose skin and ribs appear to peel away. A bronze mirror occupies the opening of the body, folding the viewer into the image.\n\nLena Marie Emrich\nI left the window open for you\n27.06.–11.10.2026\nCurated by @nina_diel \nPhotos by @luciemarsmann","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-17","ld":86,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Set in a facsimile rendering of the V&A East Storehouse’s conservation studios A and B,...","k":"other","s":"2026-10-18","e":null,"st":null,"et":null,"u":"sidequest.osp","c":"London","co":"","p":"https://www.instagram.com/p/DY_t8duCM3r/","x":"Set in a facsimile rendering of the V&A East Storehouse’s conservation studios A and B, 𝘎𝘶𝘢𝘯𝘺𝘪𝘯 𝘐𝘐: 𝘛𝘩𝘦 𝘊𝘢𝘳𝘦𝘵𝘢𝘬𝘦𝘳 (2026) by Lawrence Lek with Xin Song, is a third person platforming adventure whose gameplay masks subtle dialogues about excessive AI automation and burn out rates in the arts sector. \n\nCurrently on show as part of the New Work: Making East London programme, Lek’s game drops players into the slender framed Guanyin carebot C-0181 on their first day on the job, with no colleagues to turn to for advice.\n\nSearching for scattered fragments of an ArcelorMittel Orbit architectural model, “C-0181 must negotiate the human proportions of the environment, clambering up boxes and through air vents, before crossing the network of ceiling mounted cable trays and descending to the shop floor by means of a miniature goods lift.”\n\nRead more about the piece in the latest 𝘚𝘐𝘋𝘌 𝘘𝘜𝘌𝘚𝘛 𝗢𝗯𝘀𝗲𝗿𝘃𝗮𝘁𝗶𝗼𝗻 𝗤𝘂𝗲𝘀𝘁 article.\n\nVisit 𝘎𝘶𝘢𝘯𝘺𝘪𝘯 𝘐𝘐: 𝘛𝘩𝘦 𝘊𝘢𝘳𝘦𝘵𝘢𝘬𝘦𝘳 at V&A East Storehouse until Sunday 18th October, 2026.\n\n#SideQuest\n#LawrenceLek\n#VAMEast\n@lawrencelek\n@songxin.xin\n@vam_east\n@sadiecoleshq\n@katiegdelamere","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-31","ld":140,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"The middle gets a bad reputation.","k":"exhibition","s":"2026-10-22","e":"2026-10-24","st":null,"et":null,"u":"segddesign","c":"New York","co":"","p":"https://www.instagram.com/p/DaBAirqBU7u/","x":"The middle gets a bad reputation.\n\nBut as designers of experiences, we’ve always known something critical: the middle is not a compromise. The middle is where meaning is made.\n\nThe most meaningful work doesn’t happen at the extremes. It’s where ideas converge. Where client vision meets user need. Where culture meets place. Where technology meets humanity. Where competing priorities sharpen our thinking—and where creativity emerges when we resist easy answers.\n\nThat’s why this year’s SEGD Conference Experience theme is Meet Me in the Middle.\n\nThis October 22–24, we’re gathering in Kansas City—not just because it’s the geographic heart of the country, but because it embodies convergence. It’s a place where craft meets innovation, history meets reinvention, and local stories create global impact. \n\nTogether, we’ll explore how experiential design helps us navigate complexity, embrace productive tension, and create meaningful connections through inspiring speakers, immersive tours, hands-on workshops, NEXPO, and the conversations that only happen when this community comes together.\n\nWe’re honored to have this year’s conference guided by an extraordinary leadership team:\n\n• Rick Smith, Vice President of Experiential Design, Dimensional Innovations\n• Wendy Manning, Managing Principal, Demeter Strategy Design\n• Jackie Berra, Founder & Brand Experience Director, JBerra Consulting & Design\n\nAlong with the support of Kansas City Chapter Chairs Kate Schmidt and Sarah Onken.\n\nA special thank you to our brand design partner, Studio Loutsis (@studio_loutsis) for bringing this year’s theme to life, and to our Presenting Sponsors, Color-Ad, Inc. (@color_ad_inc) and Nanolumens (@nanolumens_led), for helping make this experience possible.\n\nThis is where our profession comes together to challenge one another, sharpen our thinking, and imagine what’s next.\n\nEarly registration is now open. Lock in the best rate, reserve your hotel, and start planning your trip to Kansas City. We’ll see you in October!!\n\nRegister now at our link in bio","r":false,"b":"register","af":true,"so":false,"pd":"2026-06-25","ld":119,"dl":"2026-10-24","ds":"run closes","ap":false,"rel":false,"q":true},{"now":false,"t":"“With her savage embrace of what can only be called by that 20th-century word 'primitiv...","k":"exhibition","s":"2026-10-31","e":null,"st":null,"et":null,"u":"davidzwirner","c":"Paris","co":"","p":"https://www.instagram.com/p/DbbAadEmMOk/","x":"“With her savage embrace of what can only be called by that 20th-century word 'primitivism', her mixing of beauty and revulsion, her pastiches, her awe at the mystery of human existence, she is today’s Picasso.\" —Jonathan Jones, critic, on Huma Bhabha\n\nWishing a very happy birthday to Huma Bhabha! Earlier this year, the Institut Giacometti presented an exhibition bringing Bhabha's work into dialogue with that of Alberto Giacometti (@Fondation_Giacometti), highlighting their shared exploration of the human figure somewhere between strength and fragility.\n\nBhabha's work can now be seen in TURANDOT: To the Daughters of the East, presented by @ParasolUnit at @ACPPalazzoFranchetti in Venice through Saturday, October 31, where eleven significant female artists engage with themes as diverse as existence, myth, and history. Learn more and plan your visit via the link in bio.\n—\n1: Huma Bhabha in her studio. Photo by Jason Schmidt\n2/4: Installation views, Alberto Giacometti/ Huma Bhabha. Dénoue, boucle à boucle, les cheveux d’une idole – avant que tes articulations se détachent…, Institut Giacometti, Paris, 2026. © Succession Alberto Giacometti / ADAGP\n3/5: Huma Bhabha, Untitled, 2023 (detail); So Am I, 2025 (detail) \n6: Installation views of works by Huma Bhabha in TURANDOT: To the Daughters of the East, Palazzo Franchetti, Venice, 2026","r":false,"b":null,"af":false,"so":f , Dolomites, Italy\n \nExposición colectiva | Group show\n31.05 — 13.09.2026\n\nPetrit Halilaj & Álvaro Urbano\n\"Bloom up! The Language of Flowers\"\nKunsthalle, Baden-Baden, Germany\n \nExposición colectiva | Group show\n13.06 — 10.01.202\n\nJorge Méndez Blake\n\"Bricks Reloaded\"\nGewerbemuseum Winterthur, Switzerland\n \nExposición colectiva | Group show\n12.06 — 01.11.2026\n\nSara Ramo\n\"Mire Veja: MAM São Paulo visita o SESC Bom Retiro\"\nSESC Bom Retiro, São Paulo, Brazi","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-22","ld":123,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Derzeit ist im Gropius Bau die lang erwartete Einzelausstellung „Dabei sein und nicht s...","k":"performance","s":"2026-12-06","e":null,"st":null,"et":null,"u":"berlinbiennale","c":"Berlin","co":"","p":"https://www.instagram.com/p/DaST_pgiKs-/","x":"Derzeit ist im Gropius Bau die lang erwartete Einzelausstellung „Dabei sein und nicht schweigen“ von Gabriele Stötzer zu sehen. Als ein Kernmitglied von Exterra XX – Künstlerinnengruppe Erfurt war Gabriele Stötzer im letzten Jahr auch bei der 13. Berlin Biennale vertreten. Seit über fünf Jahrzehnten setzt Stötzer sich mit Themen wie Gerechtigkeit, Selbstbestimmung und Geschlecht auseinander und war eine der wichtigen, kritischen Stimmen im Kunstbetrieb der DDR.\n\nBei der Berlin Biennale wurden unter anderem Performance-Modeobjekte gezeigt, die nun erneut auch im Gropius Bau ausgestellt werden. Bei Modenschauen präsentierten die Künstlerinnen ihre selbst entworfenen, auf Träumen und Traumata basierenden Kostüme einem Publikum aus Unterstützer*innen, anderen Künstler*innen und Kreativen aus der weitgehend im Untergrund agierenden Erfurter Szene.\n\nDie von Julia Grosse kuratierte Ausstellung untersucht die Vielfalt von Stötzers experimentellem Schaffen zwischen Performance, Textilkunst, Aktionen im öffentlichen Raum, Malerei, Literatur, Fotografie, Textilkunst und Super-8-Film.\n\nGropius Bau is currently showing Gabriele Stötzer’s long-awaited solo exhibition “Dabei sein und nicht schweigen”. As one of the core members of Exterra XX – Künstlerinnengruppe Erfurt, Gabriele Stötzer was also a participating in the 13th Berlin Biennale last year. For more than five decades, she has been exploring themes such as justice, self-determination, and gender, and has been one of the most important critical voices in the art world of the GDR.\n\nAt the Berlin Biennale some of the performance-based fashion objects were presented that are now part of the exhibition at Gropius Bau. At runway shows, designs based on the artists’ dreams and traumas were presented to a public of supporters, fellow artists, and creatives from Erfurt’s largely underground scene.\n\nThe solo exhibition, curated by Julia Grosse, highlights the diversity of Stötzer’s œuvre – encompassing painting, literature, photography, textile art, Super 8 film, performance, and public interventions.\n\nGabriele Stötzer: Dabei sein und nicht schweigen\n19.6.–6.12.2026\n@gropiusbau\n\nCredits in den Kommentaren / in the comments","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-02","ld":157,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Our constellation of museums is growing! Guggenheim Abu Dhabi opens December 11, 2026.","k":"exhibition","s":"2026-12-11","e":null,"st":null,"et":null,"u":"guggenheim","c":"New York","co":"","p":"https://www.instagram.com/p/DbVUoGpHF9S/","x":"Our constellation of museums is growing! Guggenheim Abu Dhabi opens December 11, 2026. \n\nGuggenheim Abu Dhabi (@guggenheimabudhabi) will deepen intercultural understanding, expand perspectives, and offer new ways to engage with the art of our time. Its collection spans art from the 1960s to the present, bringing together works from every continent — uniquely local and global, rooted in the region and in dialogue with the world.\n\nLocated in the Saadiyat Cultural District (@saadiyatculturaldistrict), the museum design
