Space: Fortress/Nest,” to convey a feeling of time that is recurring and continuous, as “not historically closed, but as a space of ongoing movement.”\n\nThe Korean Pavilion is supported by Hyundai Motor through its longstanding partnership with Arts Council Korea since 2015. Building on this continuous commitment through 2034, the partnership fosters a sustainable foundation for artists to present experimental and thought-provoking practices on an international platform.\n\n“Liberation Space: Fortress/Nest” is on view through November 22, 2026 at the 61st International Art Exhibition of La Biennale di Venezia. Watch the full film on artlab.hyundai.com/editorial/watch\n\n#KoreanPavilion #LiberationSpace #BiennaleArte2026 #InMinorKeys","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Something new is taking shape outside the ICA! We are excited to unveil Pond Theater by...","k":"performance","s":"2026-06-05","e":"2026-11-29","st":null,"et":null,"u":"icavcu","c":"Rotterdam","co":"","p":"https://www.instagram.com/p/DZD-OEGx2jn/","x":"Something new is taking shape outside the ICA! We are excited to unveil Pond Theater by @studio_ossidiana opening this First Friday, June 5. Pond Theater by Rotterdam-based design duo Studio Ossidiana transforms the Thinking Field’s Martha Daniel Newell Reflecting Pool into something new: a floating stage for gathering, play, and quiet contemplation. Boat-like platforms drift across the water, inviting visitors to sit, linger, and connect with the building, the city, and each other.\n\nOpening this First Friday, June 5, Pond Theater inaugurates Broad Signals, the ICA’s new public art commissioning series along side Abigail DeVille: Deo Vindice (Orion’s Cabinet) and FERTILE RESISTANCE: @kadistkadist Collection-in-Residence. Free and open to all!\n\nPond Theater will be on view June 5 – Nov 29, 2026. The ICA will be hosting Studio Ossidiana on August 15 for a special performance and talk with local experimental music ensemble Forced Resonance. To learn more about our summer exhibitions and programs click the link in bio","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-01","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Opening on 8 August 2026, Vantage Point 13 presents newly commissioned works that refle...","k":"exhibition","s":"2026-08-08","e":"2026-11-29","st":null,"et":null,"u":"sharjahart","c":"Sharjah","co":"","p":"https://www.instagram.com/p/DbA_BF7INAH/","x":"Opening on 8 August 2026, Vantage Point 13 presents newly commissioned works that reflect on the evolving possibilities of documentary photography.\n\nDeveloped in close collaboration with six artists, the exhibition considers documentary photography as a field shaped through continuous observation, negotiation and interpretation. \n\nFeaturing works by Adam Rouhana, Guanyu Xu, Latifa AlBokhari, Luisa Dörr, Maheder Haileselassie and Sathish Kumar, the 13th edition of the open-call photography exhibition will be on view at our Photography Gallery—Vantage Point’s new permanent home. \n\nThe exhibition is curated by Sara Al Mheiri, Assistant Curator, and Osemudiamen Ekore, Curatorial Assistant, Sharjah Art Foundation.\n\n📍 Gallery 2, Photography Gallery, Al Manakh, Sharjah\n🗓️ 8 August–29 November 2026\n\nBook now through our link in the bio.\n\nImage: Luisa Dörr, Zoila and Iuzkani, Teuchitlán, Jalisco, Mexico, 2024. From ‘Escaramuzas’, 2024–ongoing. Image courtesy of the artist \n\nيُفتتح معرض «الشارقة، وجهة نظر 13» في 8 أغسطس 2026، مقدماً أعمالاً جديدة أُنتجت بتكليف من مؤسسة الشارقة للفنون، وتستكشف إمكانيات التصوير الفوتوغرافي الوثائقي وتطوره الدائم.\n\nطُوّر المعرض بالتعاون مع ستة فنانين يقاربون التصوير الوثائقي باعتباره مجالاً متحولاً، لا تحدده حقائق ثابتة، وإنما بصيرة متواصلة لا تتوقف.\n\nيضم المعرض أعمالاً لكل من آدم روحانا، غوانيو شو، لطيفة البخاري، لويزا دور، ماهيدر هايليسيلاسي، وساتيش كومار، وتُقام نسخته الثالثة عشرة في رواق الفوتوغراف، المقر الدائم الجديد لمعرض «الشارقة، وجهة نظر».\n\nيقيّم المعرض كلٌّ من سارة المهيري، وأوسيموديمن إيكوري، القيّمين المساعدين في مؤسسة الشارقة للفنون.\n\n📍  رواق الفوتوغراف، المناخ، الشارقة\n🗓️ 8 أغسطس - 29 نوفمبر 2026\n\nاحجزوا الآن عبر الرابط الموجود في الوصف.\n\nالصورة: \nلويزا دور، زويلا وإيوزكاني، تيوتشيتلان، خاليسكو، المكسيك، 2024. من “فريق إسكاراموزاس\"، 2024-لتاريخه. الصورة بإذن من الفنانة","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-20","ld":19,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Can science and spirituality coexist?","k":"exhibition","s":"2026-08-04","e":"2026-12-13","st":null,"et":null,"u":"hyundai.artlab","c":"Beijing","co":"","p":"https://www.instagram.com/p/Dbn257xiUsf/","x":"Can science and spirituality coexist? \n\nTake a look inside \"Prayers to Fornax: Science, Technology, and Spirituality\" and hear from curators Yifeng Wei & Penny Dan Xu, the Hyundai Blue Prize+ 2025 awardees, as they reflect on the constellation at the heart of the exhibition and how it shaped their exploration of different ways of understanding the world.\n\n\"Prayers to Fornax: Science, Technology, and Spirituality\" is on view at Hyundai Motorstudio Beijing through December 13.\n\n#HyundaiBluePrize #HyundaiMotorstudio","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"IMPOTENZA BY UFFE ISOLOTTO","k":"exhibition","s":"2026-06-13","e":"2026-12-18","st":null,"et":null,"u":"artcnomads","c":"","co":"Italy","p":"https://www.instagram.com/p/DbiU1N7guNw/","x":"IMPOTENZA BY UFFE ISOLOTTO\n\nFour years after representing Denmark at the Venice Biennale, Uffe Isolotto turns away from technically complex production toward direct, vulnerable making. Created with minimal external intervention, the sculptures expose uncertainty and the gap between artistic intention and execution. Installed within Palazzo Monti’s historic interiors, the works present impotence not as failure, but as a productive condition in which artistic ambition persists despite limitation.\n\n~ Full exhibition documentation is available on findartplatform.com\n\nArtist: @uffeisolotto \nCurator: #EdoardoMonti\nPhoto: @palazzomonti \n\n@palazzomonti, Brescia, Italy, 13 June - 18 December 2026","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-02","ld":-50,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"A week and a half ago, the exhibition Sonsbeek 2026: I Don’t Need a Backyard, I Share a...","k":"exhibition","s":"2026-07-15","e":"2026-12-20","st":"11:00","et":null,"u":"platform_post","c":"Arnhem","co":"","p":"https://www.instagram.com/p/Da0MrL3Cd-R/","x":"A week and a half ago, the exhibition Sonsbeek 2026: I Don’t Need a Backyard, I Share a Park opened at POST Arnhem.\n\nTogether with Sonsbeek director @orlandomaaike , curators Christina Li and @miragad, and our own team, we celebrated the opening of POST as a partner venue for Sonsbeek 2026 @sonsbeek_artprojects \n\nThe evening concluded with a late-night opening of the exhibition, featuring works by Korakrit Arunonandchai and Forensic Architecture. The exhibition remains on view until 20 December.\n\nPlease note that our opening hours have changed. We are now open Tuesday to Sunday, from 11:00 AM to 6:00 PM.\n\nPhoto's by @djangovanardenne","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“When we play, we follow rules, but we also test them and understand them physically. I...","k":"performance","s":"2026-07-31","e":"2027-01-01","st":null,"et":null,"u":"berlinartlink","c":"Madrid","co":"","p":"https://www.instagram.com/p/DbdGSlHmsgj/","x":"“When we play, we follow rules, but we also test them and understand them physically. I do not work with the element of play because it relates to childhood or triviality, but rather because it constitutes a form of bodily knowledge.”⁠\n⁠\nAndrea Canepa’s artistic practice has long reflected on, reimagined and engaged with the concept of play. As part of our Play feature topic, Juan José Santos interviews the artist, particularly discussing her two recent concurrent exhibitions in Madrid; ‘Salto, giro, cadencia, trance’ at Galería Crisis and ‘Fardo,’ which temporarily envelops the facade of Palacio de Cristal in the city’s Retiro Park. ⁠\n⁠\nIn the interview, Canepa talks through how movement in her works draws out the fragility in playfulness and how small actions, such as crouching, leaning against or simply touching, can completely alter one’s relationship with a piece.⁠\n⁠\nA further exhibition of Canepa’s ‘Bundle’ is on view at Museo Reina Sofia until January 1, 2027. ⁠\n⁠\nRead the full interview at the link in bio. ⁠\n⁠\nImage 1: Andrea Canepa: ‘Fardo,’ 2026 // Photo by Roberto Ruiz, courtesy of Galería Crisis⁠\n⁠\nImage 2: Andrea Canepa: ‘Salto, giro, cadencia, trance,’ 2026 // Photo by Roberto Ruiz, courtesy of Galería Crisis⁠\n⁠\nImage 3: Andrea Canepa: ‘Until it lives in the muscle,’ performance at ICPNA, Lima // Courtesy of the artist, photo by Alban Naffrechoux⁠\n⁠\n@canepapa @museoreinasofia @galeria.rosa.santos @crisis.galeria @palaciodecristalpetropolis @roberto_ruiz_fotografo_de_arte\n#play #featuretopic #bodilyknowledge #engagement #touch","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"THE STASIS GARDEN (OR PIXIES MEMORIES) by FLORYAN VARENNES","k":"exhibition","s":"2026-07-04","e":"2027-01-03","st":null,"et":null,"u":"findart.platform","c":"","co":"France","p":"https://www.instagram.com/p/DbgH-GLiGm6/","x":"THE STASIS GARDEN (OR PIXIES MEMORIES) by FLORYAN VARENNES\n\nThe installation is presented as part of a group exhibition «Respawn in Heroic».\n\nMade up of a series of suspended modular elements, The Stasis Garden unfolds across the space as a collection of 7 hybrid forms reminiscent of armour, medical braces and floral corollas. Crafted from opalescent PVC, stainless steel and flexible tubing, these structures appear to derive from a single original model that repeats itself without ever being an exact duplicate.\n\nEach element appears as a variation on a prototype, an attempt to adapt to changing conditions. Somewhere between organism and apparatus, they evoke absent bodies of which only the supporting structures or adaptive envelopes remain.\n\n~ Full exhibition documentation is available on findartplatform.com\n\nArtist: @floryanvarennes \nCurator: #chateaudangers\nPhoto: @antoine.denoual\n\n@ville_d_angers, Angers, France, 04 July 2026 - 03 January 2027","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":-28,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Peggy Ahwesh’s “The Third Body” is discussed in this review @e_flux of the exhibition “...","k":"exhibition","s":"2026-07-09","e":"2027-01-03","st":null,"et":null,"u":"microscope_gallery","c":"New York","co":"","p":"https://www.instagram.com/p/Dak-SZEkU8q/","x":"Peggy Ahwesh’s “The Third Body” is discussed in this review @e_flux of the exhibition “Overexposed: Art, Technology, and the Body” on view @movingimagenyc and curated by @sonia_s_e \n\nGo see the show! It runs through January 3rd, 2027.\n\n#peggyahwesh #thethirdbody #videoart #overexposed #momi","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-09","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"‘To go on is hard sometimes’","k":"exhibition","s":"2026-07-14","e":"2027-01-03","st":null,"et":null,"u":"differentclass.be","c":"Antwerp","co":"","p":"https://www.instagram.com/p/DaxCf07sM3R/","x":"‘To go on is hard sometimes’\n\nArt historian @rosaweis takes us inside @mhkamuseum in Antwerp. She explores the museum’s new collection presentation: Doorgaan (Ongoing).\n\nFor Rosa, being at M HKA is also deeply personal; it’s the exact place where her lifelong fascination with contemporary art began as a seven-year-old.\n\nWhat is your earliest memory of a museum visit? Let us know in the comments below! 👇\n\n✨ Doorgaan (Ongoing) is on view until 03.01.2027 at M HKA.\n\n#differentclass #mhka #contemporaryart #antwerp #belgianart","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Guggenheim Pop: 1960 to Now” traces the enduring influence of the Pop art movement thr...","k":"exhibition","s":"2026-07-14","e":"2027-01-10","st":null,"et":null,"u":"artnews","c":"New York","co":"","p":"https://www.instagram.com/p/DayY3pHirGr/","x":"“Guggenheim Pop: 1960 to Now” traces the enduring influence of the Pop art movement through a selection of landmark works from the 1960s to today, featuring artists including Andy Warhol, Roy Lichtenstein, Maurizio Cattelan, and Alex Da Corte.⁠\n⁠\nBringing historical and contemporary perspectives into conversation, the exhibition shows how Pop continues to push and redefine the boundaries of art.⁠\n⁠\nFollow ARTnews for more exhibition coverage, and visit \"Guggenheim Pop: 1960 to Now,\" on view through January 10, 2027.⁠","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"#HaimSteinbach","k":"opening","s":"2026-07-27","e":"2027-01-10","st":null,"et":null,"u":"liarummagallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbTbyMECPW5/","x":"#HaimSteinbach\n\nChambres d’Amis turns 40\n📍S.M.A.K. Ghent, 2026\n🗓️Until 10 January 2027\n📷Haim Steinbach, Opening night, Chambres d’Amis turns 40, S.M.A.K. Ghent, 2026. Photo Martin Corlazzoli\n\nTerminal Piece\n📍Museum moderner Kunst Stiftung Ludwig Wien, Vienna, Austria\n🗓️ Until 7 February 2027\n📷 Haim Steinbach, Terminal Piece\n\nIdentity, Culture, and Community: Stories from the Collection of the Jewish Museum and Pruzan Family Center for Learning\n📍The Jewish Museum, New York, NY, USA\n🗓️ Ongoing\n📷 Installation view of “Identity, Culture, and Community: Stories from the Collection of the Jewish Museum.” Photo: Kris Graves/The Jewish Museum. \n\n700 Years of Art\n📍Städel Museum, Frankfurt, Germany\n🗓️ Ongoing\n📷 Städel Museum, Frankfurt am Main, Eigentum des Städelschen Museums-Vereins e.V. ©️ Haim Steinbach\n\n#liarumma #liarummagallery #exhibition #contemporaryart","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The exhibition 'In the Very Bowels of Changes: Surrealism and Antifascism', held until ...","k":"exhibition","s":"2026-07-30","e":"2027-01-10","st":null,"et":null,"u":"contemporarylynx","c":"Warsaw","co":"","p":"https://www.instagram.com/p/DbbG9vjlZz5/","x":"The exhibition 'In the Very Bowels of Changes: Surrealism and Antifascism', held until 10 January 2027 at @msnwarszawa, offers a distinct perspective on Surrealism. Instead of highlighting avant-garde aesthetics, it explores the movement as political imagination and examines artists’ responses to fascism, war and violence. \n\nAlthough the exhibition covers events up to the 1960s and 1970s, its relevance to current political tensions, conflicts and threats to democracy is clear. Many Surrealist goals remain relevant and, in many ways, unrealised. The exhibition serves not only as a historical account but also as a timely reflection on contemporary challenges.\n\nRead more in the interview by @kulajula 👉 click the link in our bio!\n.\n\nPhotos: Opening of the exhibition “In the Very Bowels of Changes: Surrealism and Antifascism” at the Museum of Modern Art in Warsaw. Photo by Alicja Szulc.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-30","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Stop what you're doing: this is a scroll break! 🪄 ✨ 😌","k":"exhibition","s":"2026-08-08","e":"2027-01-10","st":null,"et":null,"u":"artbasel","c":"Basel","co":"","p":"https://www.instagram.com/p/DbyEUtEiiKG/","x":"Stop what you're doing: this is a scroll break! 🪄 ✨ 😌 \n\n🪞 💡 Now on view at @guggenheim is Yayoi Kusama's 'INFINITY MIRRORED ROOM – DANCING LIGHTS THAT FLEW UP TO THE UNIVERSE' (2019), a serene installation of mirrored walls and flickering colored lights reflecting onto each other, creating a sense of infinity in the space of just four walls. \n\nExperience this work on view through January 10, 2027.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"MMG artist Dan Gunn is currently included in ‘The Aldrich Decennial: I am What is Aroun...","k":"exhibition","s":"2026-08-08","e":"2027-01-10","st":null,"et":null,"u":"moniquemeloche","c":"Chicago","co":"","p":"https://www.instagram.com/p/DbtrtHgCUiO/","x":"MMG artist Dan Gunn is currently included in ‘The Aldrich Decennial: I am What is Around Me’ with several artworks including ‘Middle Scenery (after the ride)’ and selections from his ‘Ungrateful Son’ series. \n\n‘Middle Scenery (after the ride)’ is inspired by a walk in a small town at dusk and takes inspiration from Grant Woods and Roger Brown. \n\nThe ‘Ungrateful Son’ series is inspired by the tale of the same name by the Brothers Grimm. The artworks become a tale of caution related to selfishness, familial duty, and a broader reflection of Gunn’s Midwest upbringing. \n\nThe Aldrich Decennial is the debut of a recurring survey taking place every ten years of artists whom live and work in Connecticut. The exhibition is on view through January 10, 2027. \n\nDan Gunn\nMiddle Scenery (after the ride)\n2026\nAcrylic, milk paint, light stable metalized acid dye, and polyurethane on birch plywood, and poplar with nylon cord\n50 x 114 x 3 in\n\nUngrateful Son \n2026\nGlazed stoneware, marbles, light fixture\nVarious dimensions \n\n@dangunn7 \n@thealdrich","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Amy Sillman's 'Untitled #8' (2014) is part of 'HOUSE OF BALAGAN' at Philara Collection,...","k":"exhibition","s":"2026-08-04","e":"2027-02-14","st":null,"et":null,"u":"capitainpetzel","c":"Düsseldorf","co":"","p":"https://www.instagram.com/p/Dbnx93EDIn2/","x":"Amy Sillman's 'Untitled #8' (2014) is part of 'HOUSE OF BALAGAN' at Philara Collection, Düsseldorf, on view through February 14, 2027.\n\nPresented to mark the Philara Collection's tenth anniversary in Düsseldorf-Flingern, 'HOUSE OF BALAGAN' brings together more than 100 works by over 80 artists in a sweeping survey of Gil Bronner's collection. Spanning the museum's exhibition spaces, the show explores unexpected connections across generations, media, and themes—from large-scale installations and intimate works on paper to paintings, photography, and sculpture.\n\nThe exhibition also includes selected works from the collections of Bronner's parents and his children, Philip and Lara, offering a personal perspective on the evolution of one family's passion for collecting.\n\nCurated by Hannah Niemeier.\n\nImages: 1. Amy Sillman, 'Untitled #8', 2014. Ph: Jens Ziehe; 2. Installation view, 'HOUSE OG BALAGAN', Sammlung Philara, Düsseldorf, 2026-2027. Ph: Kai Werner Schmidt.\n\n#sammlungphilara #houseofbalgan #philaradüsseldorf #düsseldorfart #amysillman","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Dean Sameshima is currently included in Dire Straits, a group exhibition curated by Ben...","k":"exhibition","s":"2026-07-25","e":"2027-04-11","st":null,"et":null,"u":"soft_opening","c":"Stockholm","co":"","p":"https://www.instagram.com/p/DbN0IDTiHh5/","x":"Dean Sameshima is currently included in Dire Straits, a group exhibition curated by Benjamin Godsill at Carl Kostyál, Stockholm. The exhibition is drawn from the Gullringsbo Konstsamling as well as several loans from simpatico collections and continues until 11 April 2027.\n\nDean Sameshima\nUntitled (Penis), 2005\nFuji-flex print\n31 × 24 cm\n\nDean Sameshima\nUntitled (Impotent), 2005\nFuji-flex print\n31 × 24 cm\n\nDean Sameshima\nUntitled (Screwing), 2005\nFuji-flex print\n31 × 24 cm","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-25","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Book Now: Join us on Wednesday 12th August, 6:30–8:30pm for ‘The Feminist Texts We Can’...","k":"reading","s":"2026-08-12","e":null,"st":"18:30","et":"20:30","u":"autoitalialondon","c":"London","co":"","p":"https://www.instagram.com/p/Da5YVBdjFl2/","x":"Book Now: Join us on Wednesday 12th August, 6:30–8:30pm for ‘The Feminist Texts We Can’t Read: How Non-Translation Silences East Asian Movements’, a reading and discussion group with artists Soo Hyun Lee and Riley Tu.\n\nThis session explores East Asian feminist thought that remains largely unavailable to English-speaking audiences.\n\nDrawing on key texts from Japan and South Korea, the session asks how translation shapes the circulation of feminist knowledge, and what is lost when influential writing remains untranslated. Through excerpts from works by Ueno Chizuko, Jinsook Kim and Soo Hyun Lee, participants will consider how colonial histories, linguistic hierarchies and publishing structures shape which feminist ideas, histories and political struggles become visible in global conversations.\n\nThe session also introduces feminist organising in South Korea following the 2016 Gangnam Station murder, including the sticky-note memorials that transformed public space into a site of collective testimony and protest.\n\nAlongside these texts and case studies, participants will examine the geopolitics of translating both fiction and non-fiction, exploring how different forms of writing carry cultural, political and emotional meaning across languages. Together, these materials offer insight into feminist resistance in East Asian contexts while opening broader questions about translation, visibility and transnational solidarity.\n\nStructured as a collective reading and discussion, the event invites participants to read, reflect and exchange ideas. No prior knowledge is required. All reading materials will be provided and introduced during the session.\n\nThis event is free to attend and will take place at Auto Italia. To register, follow the link in our bio.\n\n@riileytu\n@todayisoohyun\n\nImage 1: Soo Hyun Lee, ‘My Soft Hands Became a Sword One Day’, 2025 \nImage 2: Riley Tu, ‘Quantised Bits of Light till It Added to a Whole’, 2024","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-17","ld":26,"dl":"2026-08-12","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"🌊 As part of the programme that accompanies Elisa Giardina Papa’s solo exhibition, scho...","k":"screening","s":"2026-08-12","e":null,"st":"18:30","et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/DbdC56-G7z3/","x":"🌊 As part of the programme that accompanies Elisa Giardina Papa’s solo exhibition, scholar Damon R. Young (@damonyoung) brings together three films: L’Hippocampe, L’Atalante, and Moon’s Pool.\n\n“Together, these films trace an alternative history of the moving image below the surface. In dialogue with Giardina Papa’s exhibition, Aqua-cinema explores the queer resonances of the camera submerged in a translucent medium whose refractions loosen the hold of colonial narration and allow other lifeworlds, temporalities, and forms of relation to shimmer into view.” — Damon R. Young\n\n📍 Book @icalondon link in bio\n🗓 Wed 12 Aug, 6:30pm\n\n#Aquacinema #LHippocampe #LAtalante #MoonsPool #JeanVigo #Screening #ICA #Exhibitions","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-31","ld":12,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"💧As part of the film programme that accompanies Elisa Giardina Papa’s solo exhibition, ...","k":"exhibition","s":"2026-08-12","e":null,"st":"18:30","et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/Dbx0crJoD2z/","x":"💧As part of the film programme that accompanies Elisa Giardina Papa’s solo exhibition, academic and writer Damon R. Young (@damonyoung) presents three films that explore an alternative history of the moving image beneath the water’s surface: L’Hippocampe, L’Atalante and Moon’s Pool.\n\n🔗 Limited tickets remain – book via the link in bio\n🗓 Wed 12 Aug, 6:30pm\n\n#Aquacinema #LHippocampe #LAtalante #MoonsPool #JeanVigo","r":false,"b":"limited","af":true,"so":false,"pd":"2026-08-08","ld":4,"dl":"2026-08-08","ds":"capacity","ap":false,"rel":false,"q":false},{"now":false,"t":"We are delighted to announce our gallery summer project, ΠΝΕΥΜΑ PNEVMA, opening at The ...","k":"exhibition","s":"2026-08-12","e":"2026-08-24","st":"19:00","et":"22:00","u":"hannahbarrygallery","c":"Patmos","co":"Greece","p":"https://www.instagram.com/p/DaM2M8UAs2x/","x":"We are delighted to announce our gallery summer project, ΠΝΕΥΜΑ PNEVMA, opening at The Stavrakas House, The Patmos Trust, Patmos, 12–24 August 2026\n\nFollowing No Rush, the last show of Norman Hyams’ works at Hannah Barry Gallery and the first since his death in the Autumn of 2024, ΠΝΕΥΜΑ PNEVMA is the first international exhibition of Hyams’ work.\n\nTranslating as breath or spirit – a life-giving essence, ΠΝΕΥΜΑ PNEVMA presents a series of paintings depicting the Dodecanese and surrounding sea, many selected from Hyams’ studio in Shepherds Bush and previously unseen.\n\nThe exhibition will be open at The Stavrakas House, The Patmos Trust, Patmos, 7–10pm each day. Free entry, all welcome.\n\nNorman Hyams\nUntitled, 2024\nOil & acrylic ink on board\nTitled, signed and dated on verso\n42 x 46.5 cm\n\nNorman Hyams Summer studio, Patmos 2022 at the house of Michael and Marina of Greece \n\nNorman Hyams\nUntitled, date unknown\nOil on canvas on board\nStamped on verso\n20 x 24.9 x 0.2 cm","r":false,"b":nul rit that defines his cinema.\n\n#NagisaOshima #InFocus #Boy1969 #JapaneseCinema #FilmScreening","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-06","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"From 12 August ΠΝΕΥΜΑ PNEVMA will open at the Stavrakas Mansion. Situated on Patmos, a ...","k":"exhibition","s":"2026-08-12","e":null,"st":null,"et":null,"u":"hannahbarrygallery","c":"Patmos","co":"Greece","p":"https://www.instagram.com/p/DbYhZN2CjH-/","x":"From 12 August ΠΝΕΥΜΑ PNEVMA will open at the Stavrakas Mansion. Situated on Patmos, a remote Greek island 8 hours from Athens, the exhibition presents a series of paintings depicting the Dodecanese and surrounding sea, many selected from Norman Hyams’ studio in Shepherds Bush and previously unseen. \n\nSave for the repeated silhouette of a diver, perhaps a self-portrait, the sea and the islands are the sole subjects of the exhibition. Painting on a range of materials available to him: dried paint palettes, fruit crates, sponges and plates, a number of the works present as halfway between object and painting, the rough surfaces mimicking the rugged landscape and changeable sea.\n\nNorman Hyams\nUntitled, date unknown\nStamped on verso\nOil on canvas\n20 x 15 x 1.8 cm","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":14,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Four weeks til the opening of Norman Hyams ΠΝΕΥΜΑ PNEVMA, our summer exhibition at the ...","k":"exhibition","s":"2026-08-12","e":"2026-08-24","st":null,"et":null,"u":"hannahbarrygallery","c":"Patmos","co":"Greece","p":"https://www.instagram.com/p/Da53n4uC2qO/","x":"Four weeks til the opening of Norman Hyams ΠΝΕΥΜΑ PNEVMA, our summer exhibition at the Stavrakas Mansion, The Patmos Trust, Patmos, Greece. The exhibition will run 12-24 August 2026.\n\nNorman Hyams \nUntitled, date unknown\nStamped on verso\nMixed media on paper on correx\n31.7 x 37.7 x 0.5 cm","r":false,"b":null,"af":fa That Cannot Land' with curator Sofie Krogh Christensen @skchris_. Explore the exhibition through its curatorial framework, ask questions, and gain a deeper understanding of the ideas and connections that shape the works on view.\n\nCurator's Tour\n'Kyiv Biennial – A Bird That Cannot Land'\nThu, 13.08.26\n16:00–17:00 (en)\nFree admission\nRegistration via mediation@kw-berlin.de\n\n_____________________\n\n#contemporaryartberlin #kunstwerkeberlin #kwberlin #kwinstituteforcontemporaryart #kyivbiennial #curatorstour \n\nImage: Gulnur Mukazhanova, 'Material as Memory', 2026. Courtesy the artist. Installation view of the exhibition 'Kyiv Biennial – A Bird That Cannot Land' at KW Institute for Contemporary Art, Berlin 2026. Photo: Frank Sperling.","r":false,"b":"register","af":true,"so":false,"pd":"2026-08-07","ld":6,"dl":"2026-08-13","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Free Thursday at KW! 💚","k":"concert","s":"2026-08-13","e":null,"st":"16:00","et":null,"u":"kwinstitutefcontemporaryart","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbsV4zzjx_v/","x":"Free Thursday at KW! 💚\n\nJoin us on Thu, 13.08.26, from 16:00–21:00 for free admission and extended opening hours.\n\nExplore our current exhibition, the 'Kyiv Biennial – A Bird That Cannot Land', then relax in the courtyard with food and drinks from the newly reopened Bravo @bravoberlin.\n\nDuring Free Thursday from 16:00–17:00, visitors can also join a Curator's Tour of the exhibition with Sofie Krogh Christensen @skchris_ – register now via our website!\n\nFor more information, visit the 🔗 link in our bio.\n__________\n\n#kwinstituteforcontemporaryart #kwberlin #artinberlin #contemporaryart\n\nImage 1: 'Kyiv Biennial Concert Week' at KW Institute for Contemporary Art, Berlin 2026. Photo: Eva Luise Hoppe.\nImage 2: Opening of the exhibition 'Kyiv Biennial – A Bird That Cannot' Land at KW Institute for Contemporary Art, Berlin 2026. Photo: David von Becker.","r":false,"b":"register","af":true,"so":false,"pd":"2026-08-06","ld":7,"dl":"2026-08-13","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"Join us on Thursday, August 13 for the @octaviaprojnyc Summer Showcase, hosted at CARA ...","k":"other","s":"2026-08-13","e":null,"st":"17:30","et":null,"u":"cara_the_org","c":"New York","co":"","p":"https://www.instagram.com/p/Dbbl5epmKyT/","x":"Join us on Thursday, August 13 for the @octaviaprojnyc Summer Showcase, hosted at CARA for the fourth year!\n\n5:30pm | Doors\n6pm | Performances Begin\n\nThe Octavia Project uses speculative fiction as a lens through which to envision new futures and greater possibilities for our world; blending creative writing, art, science, and technology, their programming increases confidence and skills in a myriad of subjects while fostering leadership and community. The organization's inspiration and namesake is Octavia E. Butler, who broke barriers in writing and science fiction to become an award-winning and internationally recognized author.\n\nInspired by Octavia E. Butler's explorations of alternate futures and commitment to social justice, the Octavia Project offers summer programs which encourage imagination and community building. Their free summer camp for middle schoolers and summer institute for high schoolers bring together young women and trans and nonbinary youth to build new worlds.\n\nWhether you're a returning guest or joining for the first time, the Summer Showcase promises to leave you encouraged, inspired, and excited for the future. Join us to engage with student projects and hear student work performed by participants from across the Octavia Project’s multiple programs.\n\nRSVP encouraged via link in bio.\n\nPhotos from Octavia Project’s 2025 Summer Showcase: Ariel Portillo","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-30","ld":14,"dl":"2026-08-13","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"The MAK Center for Art and Architecture and the SOM Foundation are pleased to present “...","k":"other","s":"2026-08-13","e":null,"st":"18:00","et":null,"u":"makcenter","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DborhGQvlyz/","x":"The MAK Center for Art and Architecture and the SOM Foundation are pleased to present “Sixth Street Viaduct as Next Generation Infrastructure” with Researcher-in-Residence Linda C. Samuels, marking the culmination of her residency.\n\nSamuels’s research project utilizes a combination of data-based analysis and empirical, qualitative explorations, intentionally combining quantitative information with lived experience. Revisiting the project four years after the bridge first opened, and just months before the unveiling of the park below, her analysis asks how the project lives up to its promise as next generation infrastructure.\n\nJoin us at the MAK Center at the Mackey Apartments on August 13 at 6:00 PM as Samuels shares observations from her month in residence and introduces her body of research that examines the Sixth Street Viaduct as a mobility conduit, public space, and prototype for next generation infrastructure.\n\nVisit the link in our bio to RSVP.\n\n---\n\nSixth Street Viaduct as Next Generation Infrastructure\nMAK Center at the Mackey Apartments Garage Top\n1137 S. Cochran Ave, Los Angeles\nAugust 13, 2025, 6:00 PM\n\n---\nImage: Photography by Iwan Baan, Courtesy Michael Maltzan Architecture","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-08-04","ld":9,"dl":"2026-08-13","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"Artists take on L.A. ↑","k":"other","s":"2026-08-13","e":null,"st":"19:00","et":null,"u":"lacma","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DbtHex_G0Ba/","x":"Artists take on L.A. ↑ \n\nHear from artists rafa esparza (@elrafaesparza), Susan Silton (@susan_silton), and Shizu Saldamando (@shizutattoo), moderated by Lindsay Preston Zappas (@prestochango), as they discuss how Los Angeles shapes their work and communities\n\nAug 13 | 7 PM | Tickets at the 🔗 in bio","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-06","ld":7,"dl":"2026-08-13","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"🏔️ Die Ausstellung „Heimatflimmern“ widmet sich verschiedenen Aspekten von „Heimat“ jen...","k":"exhibition","s":"2026-08-13","e":null,"st":"19:00","et":null,"u":"kunstmuseumsg","c":"Zurich","co":"","p":"https://www.instagram.com/p/DbkgTPVuiwe/","x":"🏔️ Die Ausstellung „Heimatflimmern“ widmet sich verschiedenen Aspekten von „Heimat“ jenseits nationalistischer oder identitärer Vorstellungen. Der Begriff ist seit jeher offen und vieldeutig. Als Projektionsfläche und Resonanzraum wird „Heimat“ immer wieder neu mit persönlichen Erfahrungen, gemeinsamen Bildern und politischen Zuschreibungen verbunden. \n\nIn einer global vernetzten Welt, die von technologischem Wandel, Migration und Klimawandel geprägt ist, gerät „Heimat“ zunehmend in Bewegung, ohne an Bedeutung zu verlieren. Im Dialog der Werke wird diese flimmernde Vielschichtigkeit von „Heimat“ zwischen historischen Prägungen, aktuellen Herausforderungen und zukünftigen Perspektiven sichtbar.\n\n👉🏼 In der Kurator*innenführung am 13. August 2026 um 19 Uhr erhalten Sie besondere Hintergrundinformationen zur Ausstellung.\n\n//\n\n🏔️ Each dialogue between collections focuses on a socially relevant theme. The exhibition “Heimatflimmern” (“Glimmers of Home”) is dedicated to addressing various notions of “home” beyond those tied to nationalism or identity. The term’s meaning has always been open and multilayered. As a surface of projection and a space of resonance, “home” is continually redefined through personal experiences, shared imagery, and political attributions. \n\nIn a globally interconnected world shaped by technological change, migration, and climate change, the concept of “home” is increasingly in flux—but has not lost its significance. By putting works into dialogue, the exhibition makes the flickering complexity of “home” visible and situates it among historical influences, contemporary challenges, and future perspectives.\n\n👉🏼 On the curator-led tour on 13 August 2026 at 7 pm, you will be given special background information on the exhibition.\n\n#kunstmuseumsg #kunstmuseum #swisspost #heimatflimmern #stadtpark\n\n📸 Sebastian Stadler","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":8,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":false,"t":"KYOKO KAGAWA RARITIES: LITTLE PEACH / ANZUKKO","k":"screening","s":"2026-08-13","e":null,"st":null,"et":null,"u":"anthologyfilmarchives","c":"New York","co":"","p":"https://www.instagram.com/p/DbLwO6okZeq/","x":"KYOKO KAGAWA RARITIES: LITTLE PEACH / ANZUKKO\nAugust 13\n\nThis summer Anthology, Asia Society, and The Japan Foundation, New York, join forces for a celebration of the career of actress Kyoko Kagawa, who for the past 75 years has been one of the shining lights of Japanese cinema.\n\nSpotlighting underseen and unseen works, “Kyoko Kagawa Rarities” begins with an opening night event at Anthology, featuring an exceedingly rare 35mm screening of Mikio Naruse’s LITTLE PEACH. Chris Fujiwara has described the film as both “a masterpiece of Naruse’s elliptical and unemphatic fifties style” and “one of the harshest of Naruse’s female melodramas.” Known for her iconic roles as the little sister or the enduring daughter, in LITTLE PEACH, Kagawa lends her tenderness to the beleaguered adult role of wife to a would-be novelist in perpetual collapse. Echoing SOUND OF THE MOUNTAIN in the many walks and talks with the great So Yamamura as paternal figure, with its buoyant bike rides and painful vision of marriage as social fate, the film also gestures at a spiritual afterlife for Ozu’s LATE SPRING.\n\nFollowing this opening night event, “Kyoko Kagawa Rarities” continues uptown at Asia Society through Sunday, August 16, with screenings of FAREWELL TO THE HIGHLAND STATION (Nobuo Nakagawa, 1951), TOKYO RENDEZVOUS (Chihiro Ikeda, 2008), FIVE SISTERS (Seiji Hisamatsu, 1954), and SHOZO, A CAT AND TWO WOMEN (Shiro Toyoda, 1956), all on imported 35mm prints and featuring newly translated subtitles.\n\n“Kyoko Kagawa Rarities” is programmed by Joseph Eusebio and Akinaru Rokkaku and is a co-presentation of Asia Society, Anthology Film Archives, and The Japan Foundation, New York.\n\nSee our website for full program details.\n\nAnd see @asiasociety's website for details for August 14-16, 2026.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":20,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Asia Society presents Kyoko Kagawa Rarities, a series of five remarkable films starring...","k":"screening","s":"2026-08-13","e":"2026-08-16","st":null,"et":null,"u":"asiasociety","c":"New York","co":"","p":"https://www.instagram.com/p/DbG6EUUEmkp/","x":"Asia Society presents Kyoko Kagawa Rarities, a series of five remarkable films starring the beloved Japanese actress, in partnership with @anthologyfilmarchives, screening in New York from August 13-16, 2026.\n\nA staple of Japanese cinema’s Golden Age, Kagawa had the distinction of working with all of Japan’s “Big Four” directors and her filmography reads like a roadmap to Japanese cinema; her characters meaningful guides in its living history.\n\nComprised entirely of imported celluloid, Kyoko Kagawa Rarities highlights discovery and revelation, and looks to give fresh color to a dear and familiar face. \n\nLearn more and grab tickets at the link in our bio 🎞️ \n\nNote: The first film in this series, Mikio Naruse’s Little Peach (Anzukko), will screen at Anthology Film Archives on August 13, 2026. \n\nGuest curated by Joseph Eusebio (@jsphsb) and Akinaru Rokkaku.\n\nProgrammed with support from the Japan Foundation, New York (@jf_newyork).","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-22","ld":22,"dl":"2026-08-16","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"PREPARATORY COURSE - EXTENTED DEADLINE 13 AUGUST","k":"exhibition","s":"2026-08-13","e":null,"st":null,"et":null,"u":"rietveldacademie","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DasuGl9j-8C/","x":"PREPARATORY COURSE - EXTENTED DEADLINE 13 AUGUST\n\nThese 3 graduates all started as preparatory students and there are still some spots left for the upcoming programme! \n\nThe Preparatory Course offers an intensive 25-week programme for young makers looking to develop their artistic practice and portfolio before applying to the academy, or for those who are curious about what studying at the Rietveld would be like.\n\nParticipants work on a wide range of assignments in art and design during three to four half-day classes each week. Throughout the course, you develop your portfolio and experiment with different approaches that can help you prepare for admission to the Basicyear – the first year of the Bachelor programme.\n\n📌 Open to applicants aged 17–25\n📌 Application deadline: 13 August 2026\n📌 More information via the link in bio\n\n--\nPhotos:\n1. Charlotte Dijkgraaf (@charlottedijkgraaf), Fine Arts\n2. Karina Kalantajevska (@kkalantajevska), designLAB\n3. Jorge Herrero Alberquilla (@loc0.xti), Graphic Design","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-12","ld":32,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Paying homage to the lo-fi handmade artistry of independent genre fare and riffing on t...","k":"launch","s":"2026-08-13","e":null,"st":null,"et":null,"u":"filmlinc","c":"New York","co":"","p":"https://www.instagram.com/p/DbuHJpsDIXA/","x":"Paying homage to the lo-fi handmade artistry of independent genre fare and riffing on the spooky maritime lore of old, Noah Stratton-Twine and Jake Kuhn’s THE PERIL AT PINCER’S POINT makes its New York premiere on Thursday, August 13 (with in-person Q&A) as part of Scary Movies XIV!\n\n🎟️: filmlinc.org/scary\n\nDispatched to a fog-shrouded isle on a mission to gather audio “unprecedented in film history,” a sound recordist stumbles upon a mysterious missing person’s case that may or may not have something to do with spooky local rumors of a phantom sea captain.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"“As a friend who has known them for years, I read Mei's work as record and score for ho...","k":"other","s":"2026-08-13","e":"2026-09-20","st":null,"et":null,"u":"manyfortunes","c":"New York","co":"","p":"https://www.instagram.com/p/Dbvj-0qkbdL/","x":"“As a friend who has known them for years, I read Mei's work as record and score for how they move through the world as a queer person. In each drawing, detail becomes a devotion to surface — the world noticed at a resolution most of us have lost: the small, the overlooked, the tender edge of a thing. It is less technique than a way of being, surfacing everywhere: not only in the drawings but in how they dress, how they listen, how they arrive.” —Maya Yu Zhang (@bulletsweety), 𝙋𝙤𝙧𝙩𝙖𝙡𝙨 co-curator\n\n𝗠𝗲 𝗮𝗻𝗱 𝗠𝘆 𝗚𝗵𝗼𝘀𝘁 𝟬𝟲\n𝟮𝟬𝟮𝟱\n𝟭𝟭 𝘅 𝟭𝟰 𝗶𝗻𝗰𝗵𝗲𝘀\n𝗚𝗿𝗮𝗽𝗵𝗶𝘁𝗲 𝗼𝗻 𝗽𝗮𝗽𝗲𝗿\n\nMei Kazama (b.1994, New York) @meikazama is an artist from New York City. They investigate the spectral as a realm of simultaneous grief and possibility, with a focus on drawing as both medium and framework. They have exhibited nationally and internationally, including at The Clemente (NY), David Castillo Gallery (FL), Yossi Milo Gallery (NY), and Fuyumedo Gallery (Japan). Their writing has been published through smoke and mold, Cleveland Review of Books, and Routledge. Through their essays, they champion drawing as a rigorous and autonomous field in the arts and connect traditional and expanded notions of drawing with theories around gender and race. Their work extends as an educator, and their teaching brings together art and critical thinking as a way to develop long term self-efficacy. They hold an MFA in Painting and Printmaking from Yale University and BA in Studio Art from Williams College. Currently, they are serving as faculty at Cleveland Institute of Art as an AICAD Fellow.\n\nSpend time with Mei’s work at 𝙋𝙤𝙧𝙩𝙖𝙡𝙨\nAugust 13–September 20, @studio105atray \n\n𝗢𝗽𝗲𝗻𝗶𝗻𝗴 𝗡𝗶𝗴𝗵𝘁: 𝗦𝗲𝗰𝗼𝗻𝗱 𝗧𝗵𝘂𝗿𝘀𝗱𝗮𝘆, 𝗔𝘂𝗴𝘂𝘀𝘁 𝟭𝟯 𝗳𝗿𝗼𝗺 𝟲–𝟵𝗣𝗠\n𝗚𝗮𝗹𝗹𝗲𝗿𝘆 𝗛𝗼𝘂𝗿𝘀: 𝗪𝗲𝗱𝗻𝗲𝘀𝗱𝗮𝘆–𝗦𝘂𝗻𝗱𝗮𝘆, 𝟭𝟮–𝟲𝗣𝗠\n\nImage Descriptions in comments below.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"August 13 - Let's talk, intelligently - Shu Lea Cheang X Kira Xonorika at Leslie Lohman...","k":"other","s":"2026-08-13","e":null,"st":null,"et":null,"u":"shulea2","c":"New York","co":"","p":"https://www.instagram.com/p/DbIPwqhFyXT/","x":"August 13 - Let's talk, intelligently - Shu Lea Cheang X Kira Xonorika at Leslie Lohman Museum of Art. https://shorturl.at/L4KD7","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":21,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":false,"t":"📖📚 What better way to spend a Friday in the summer holidays than celebrating reading fo...","k":"reading","s":"2026-08-14","e":null,"st":"14:00","et":null,"u":"ibraazlondon","c":"London","co":"","p":"https://www.instagram.com/p/DbavHc5I1Zv/","x":"📖📚 What better way to spend a Friday in the summer holidays than celebrating reading for pleasure? On Fri 14 Aug from 2pm, head to Ibraaz for a talk by Blue Peter and Nibbie award-winning author SF Said (@whatsfsaid), organised with Burley Fisher Books (@burleyfisher).\n\n🎟️🔗 Free tickets available at the link in bio. Please note that all children attending must be accompanied by an adult. Bookings can be made with a minimum of two and a maximum of four tickets each.\n\nAlong with the operators of our Maktaba / Bookshop, Burley Fisher Books (@burleyfisher), we invite all young readers to join us for Telling Stories, a programme of events which focuses on storytelling in all its forms. \n\nWe welcome everyone aged 7 and up to come along to this event. SF will tell the story of how he went from being a young person who loved reading to writing books. Find out what inspired him to write about Mesopotamian cats who learn the Way in Varjak Paw and The Outlaw Varjak Paw, humans and aliens who become friends to fight for the galaxy in Phoenix, and young Muslim Londoners who meet a magical tyger in Tyger! \n\nAsk all your questions about how an idea becomes a book, and even how to write one yourself – and after the conversation, join us in the Maktaba to get your books signed by SF.\n\n📸 Image credit: illustration by Dave McKean.\n\n#Ibraaz #IbraazLondon #BurleyFisher","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-30","ld":15,"dl":"2026-08-14","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"📚📚📚 Vrijdag 14 augustus | 14:00 - 18:00","k":"reading","s":"2026-08-14","e":null,"st":"14:00","et":null,"u":"clublokaal_breda","c":"Breda","co":"","p":"https://www.instagram.com/p/DbynezXoAae/","x":"📚📚📚 Vrijdag 14 augustus | 14:00 - 18:00\n\nLeescafé - Boeken die hoop geven\n\nVan 14:00 tot 16:30 is het café geopend om samen (in stilte) te lezen. Neem een boek met je mee dat jou hoop geeft, of simpelweg een boek dat je graag leest, drink een kop koffie of thee en lees op je eigen tempo. \n\nOm 16:30 uur bespreken we de boeken die we aan het lezen zijn. Geen voorbereiding nodig!\n\nDraag ook bij aan Fragments of Hope; een collectieve muur van zinnen, woorden en reflecties die ontstaan vanuit de boeken die we meebrengen.\n\nHet leescafé wordt gehost door Clublokaal vrijwilliger @mariapesteves \n\n—\n\n📚📚📚 Friday, August 14 | 14:00 - 18:00\n\nReading Café - Books that give us hope\n\nFrom 14:00 to 16:30, the café is open for reading together (in silence). Bring a book that gives you hope, or simply a book you enjoy reading, have a cup of coffee or tea, and read at your own pace.\n\nAt 16:30, we will discuss the books we are currently reading. No preparation needed!\n\nYou are also invited to contribute to Fragments of Hope; a collective wall of sentences, words, and reflections created from the books we bring along.\n\nThe reading café is hosted by Clublokaal volunteer @mariapesteves \n\n—\n\n📸 @hussel_zhu","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-08","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"AA.B.B.26","k":"performance","s":"2026-08-14","e":null,"st":"18:00","et":null,"u":"boghaandvaerk","c":"","co":"","p":"https://www.instagram.com/p/DbpT0y3s3Be/","x":"AA.B.B.26\nFriday, 14 August 2026\n18:00\n\nYou are invited to the opening of Best Danish Book Design 2026 at O-Overgaden. The award ceremony begins at 18:00, followed by the exhibition opening, performance, DJs, and a bar open until midnight.\n\nPerformance: Zahna Siham Benamor @beast_from_the_msee\nExhibition design: Oliver Sundqvist @o.sundqvist\nExhibition curation and catalogue design: Alexis Mark @office.alexismark\n\nSee you on Friday, August 14th at 6:00 PM! ❤️\n\n_____\n\n(DK)\n\nAA.B.B.26\nFredag d. 14. august 2026\nKl 18:00\n\nDu er inviteret til åbning af Årets Bedste Bogarbejde 2026 på O-Overgaden. Prisuddeling fra kl 18:00 og efterfølgende vil der være udstillingsåbning, performance, dj’s og bar til kl 00:00. \n\nVi ses fredag d. 14. aug kl 18:00! ❤️\n\nPerformance: Zahna Siham Benamor @beast_from_the_msee\nUdstillingsdesign: Oliver Sundqvist @o.sundqvist\nKuratering af udstilling og katalogdesign: Alexis Mark @office.alexismark \n\n……\n\nTypeface: @jonathan.bruun !","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-05","ld":9,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"„Abipusės empatijos“ rezidencijų programos baigiamoji paroda","k":"exhibition","s":"2026-08-14","e":"2026-08-30","st":"19:00","et":null,"u":"rupert.vilnius","c":"Vilnius","co":"","p":"https://www.instagram.com/p/DbkxdzZjoBx/","x":"„Abipusės empatijos“ rezidencijų programos baigiamoji paroda\n\nSaule Suleimenova (@saulesuleimenovaart) ir Maithu Bùi (@maithu_bui)\n\n2026 m. rugpjūčio 14–30 d.\n\nAtidarymas – rugpjūčio 14 d., penktadienį, 19:00\n\nKviečiame į „Abipusės empatijos“ baigiamąją parodą, kurioje pristatomi Saule Suleimenovos ir Maithu Bùi darbai.\n\nPer šešių savaičių rezidenciją Rupert sukurta paroda jungia dvi menines praktikas, tyrinėjančias karo ir represijų palikimą per atmintį, istorinius naratyvus, materialias liekanas ir kasdienius objektus.\n\nParodą kuruoja JL Murtaugh (@syndkt) ir Katažyna Jankovska (@kat.jankovska). Atidarymo vakarą lankytojai kviečiami į atviras studijas, kuriose bus galima susipažinti su menininkų tyrimais ir kūrybiniu procesu.\n\n„Abipusės empatijos“ – Rupert meno, rezidencijų ir edukacijos centro bei Goethe’s instituto Lietuvoje inicijuota programa.\n\n2026 m. leidimą finansuoja Lietuvos kultūros taryba ir Goethe’s institutas Lietuvoje. Rupert programas remia Vilniaus miesto savivaldybė, o partneris – INVL Šeimos biuras.\n\n—\n\nMutual Empathies Final Exhibition\n\nSaule Suleimenova (@saulesuleimenovaart) and Maithu Bùi (@maithu_bui)\n\n14–30 August 2026\n\nOpening Friday 14 August, 19:00\n\nRupert invites you to the Mutual Empathies final exhibition presenting the works of Saule Suleimenova and Maithu Bùi.\n\nDeveloped during a six-week residency at Rupert, the exhibition brings together two artistic practices exploring the aftermath of war and repression through memory, historical narratives, material remnants, and everyday objects.\n\nThe exhibition is curated by JL Murtaugh (@syndkt) and Katažyna Jankovska (@kat.jankovska). Visitors are also invited to open studios during the opening evening to explore the artists’ research and creative process.\n\nMutual Empathies is a programme initiated by Rupert Art, Residencies and Education Centre and Goethe-Institut Lithuania.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":11,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Artist Maia Chao [@maia.pologies] explores how public spaces shape the way we move, obs...","k":"performance","s":"2026-08-14","e":"2026-08-31","st":"19:00","et":null,"u":"tsqarts","c":"New York","co":"","p":"https://www.instagram.com/p/Dbtr0_TGlqZ/","x":"Artist Maia Chao [@maia.pologies] explores how public spaces shape the way we move, observe, and relate to one another in her video work, Studies for American Idle. Inspired by her hour-long site-specific performance staged in Times Square, the work draws from everyday pedestrian movement and crowd-simulation software to blur the line between spontaneous action and programmed behavior.\n\nON VIEW nightly in @TimesSquareNYC through August 31.\nExperience Chao’s work on Times Square’s billboards nightly, and join us for the live plaza performance of American Idle on August 14 at 7 PM and 9 PM at Broadway & 46th St.\n\nVisit tsq.org/MaiaChao to learn more!\n\nCinematographer: Ty Burdenski @tbdski \n\n#TimesSquare #TimesSquareArts #NYC #PublicArt","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":8,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"1 year later and artist Maia Chao [@maia.pologies] is set to remount two live performan...","k":"performance","s":"2026-08-14","e":null,"st":"19:00","et":null,"u":"tsqarts","c":"Paris","co":"","p":"https://www.instagram.com/p/DboW7gnmkMd/","x":"1 year later and artist Maia Chao [@maia.pologies] is set to remount two live performances of ‘American Idle’ on the plazas of Times Square on August 14 at 7pm & 9pm at Broadway & 46th St.\n\nTimes Square Arts’ Public Artist-in-Residence Maia Chao spent months shadowing the Times Square Alliance’s\nsanitation and public safety teams, studying how their daily work shapes the rhythms of the district. That\nresearch takes form in ‘American Idle,’ an hour-long, site-specific performance inspired by the choreography\nof archetypal everyday pedestrians and crowd-simulation software.\n\nVisit tsq.org/AmericanIdle2026 to learn more!\n\nLead A į skirdama eksperimentinėms meninėms praktikoms, nagrinėjančioms juslinį suvokimą, skaitmeninę kultūrą ir technologijų įtaką šiuolaikinei visuomenei. Ji yra leidinių If a Tree Falls in a Forest (2023) ir Off-Grid (2026) sudarytoja. Savo praktikoje ji jungia tyrimus, kuratorystę, rašymą, leidybą ir viešųjų programų kūrimą.\n\nEN\n\nKatažyna Jankovska (@kat.jankovska) is the Curatorial Fellow for Rupert’s 2026 Mutual Empathies programme, where she works alongside artists Maithu Bùi and Saule Suleimenova. Through the programme, she develops curatorial research in dialogue with the artists, exploring how contemporary artistic practices rethink collective memory, histories of violence, and their material traces, leading to the final public presentation opening on 14 August.\n\nKatažyna Jankovska is a curator, writer, and researcher based between Rotterdam and Vilnius. Her work explores the ever-evolving relationships between humans, technologies, natural systems, and infrastructures. She is particularly interested in experimental artistic practices that engage with sensory perception, digital culture, and the influence of technology on contemporary society. She is the editor of If a Tree Falls in a Forest (2023) and Off-Grid (2026). Her practice brings together research, curating, writing, publishing, and public programming.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":17,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"upcoming exhibition ‘bittersweet‘","k":"opening","s":"2026-08-14","e":"2026-08-29","st":null,"et":null,"u":"vanished.pop.up","c":"Osnabrück","co":"","p":"https://www.instagram.com/p/DbbCLZkCPsA/","x":"upcoming exhibition ‘bittersweet‘\n10th edition 14-29 august \n@hase29 \n\nvernissage 14 august 19h \nplus Kafka X @serum.kollektiv is playing a set at the opening \n\nfinissage 29 august 18h \nwith @aelfleda plus DJ Sprayson Dafumo \n\nDesign @marlies_wieking","r":false,"b":null,"af":false,"so":false,"pd":"2026-07- emporary art organisation that champions ideas and artists who address the social and political questions of our times. Through a discursive process, we nurture artists’ creative vision and grow ambition towards the development of collaborative projects that are career-defining and lead to new major opportunities around the world. \n\nTo complement and sustain our commissioning work, since 2019 we have established a growing network of spaces in South London dedicated to creative production and community building—developing lasting pathways for artists’ careers. We now offer ongoing support through activities such as creative workspace, residencies, exhibitions, live events and public programming, and professional development. \n\n#ArtsJobs #CuratorJobs #LondonArts #Hiring #ContemporaryArtCareers","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":31,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Meet the next artist duo of the 10th vanished special edition - pt. 2/7","k":"opening","s":"2026-08-14","e":"2026-08-29","st":null,"et":null,"u":"vanished.pop.up","c":"Osnabrück","co":"","p":"https://www.instagram.com/p/DbyMI_piCGR/","x":"Meet the next artist duo of the 10th vanished special edition - pt. 2/7\n\n@henningbischof \n@maltehins \n\n“bittersweet” 14-29 august \nvernissage 14 august 19h\n@hase29 \n\nDesign @marlies_wieking \n\nCredits\n(1) @sinalichtenberg \n(2) Johanna Hins","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Meet the first artist duo of the 10th vanished special edition - pt. 1/7","k":"opening","s":"2026-08-14","e":"2026-08-29","st":null,"et":null,"u":"vanished.pop.up","c":"Osnabrück","co":"","p":"https://www.instagram.com/p/DbvqwBaiEg5/","x":"Meet the first artist duo of the 10th vanished special edition - pt. 1/7 \n\n@azim.f.becker_art \n@ole_winhoff \n\n“bittersweet” 14-29 august \nvernissage 14 august 19h\n@hase29 \n\nD l,"st":"13:00","et":"16:00","u":"luxmovingimage","c":"London","co":"","p":"https://www.instagram.com/p/DbgElXytYyz/","x":"Online Workshop: Distributing your work: Festivals - A practical workshop on getting your moving image work into festivals\n\nAre you an artist looking to screen your moving image work at film festivals, but not sure where to begin? Join this workshop to learn about festival distribution, tailored for artists working with the moving image.\n\nLed by LUX Distribution Director Hanan Coumal, this session will explore how festivals of different scales operate, how distribution supports artists and how you can build a festival strategy that aligns with your work.\n\nWho is this for:\n—Designed for artists who have never shown their work at festivals or have done so fewer than two times.\n\n—As this is an online session, we are prioritising artists based outside London, who have fewer opportunities to access our in-person programming\n\nWhat to expect?\n—Over three hours, the session includes presentations, group discussions, and practical exercises.\n\n—You will take part in a hands-on activity to begin developing your own festival strategy. There will be space to share your current project and receive feedback through group discussion.\n\nDate: Saturday 15 August 2026\nTime: 1-4pm\nLocation: Online, Zoom\n\nImage: ‘The Picture House’, Emily Richardson, 2010.","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-02","ld":13,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Op zaterdag 15 augustus organiseren we van 14:00 tot 22:00 een Block Party: een straatf...","k":"other","s":"2026-08-15","e":null,"st":"14:00","et":null,"u":"nestruimte","c":"The Hague","co":"","p":"https://www.instagram.com/p/DaDZO7SC3Wk/","x":"Op zaterdag 15 augustus organiseren we van 14:00 tot 22:00 een Block Party: een straatfeest voor de hele buurt en voor alle leeftijden, op het grasveld voor het DCR-gebouw. Met eten, drinken en muziek, rondleidingen, workshops met verschillende kunstenaars, tekensessies en een community market. In samenwerking met onder meer filmtheater en restaurant Flora, tekencollectief Nice Flaps, Club Laak, het dooorp en kunstenaar Laura Snijders.\n\nMeer info volgt!\n\nEN:\nSave the date!\n\nOn Saturday August 15th from 14:00 to 22:00 we’re hosting a Block Party: a street party for the entire neighbourhood and for all ages, on the grass pitch in front of the DCR building. With food, drinks and music, guided tours, workshops, drawing sessions and a community market. In collaboration with, among others, the Flora cinema and restaurant, Nice Flaps drawing collective, Club Laak, het dooorp, and artist Laura Snijders.","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-26","ld":50,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Over twee weken is het zover! Op zaterdag 15 augustus organiseren we van 14:00 - 22:00 ...","k":"workshop","s":"2026-08-15","e":null,"st":"14:00","et":null,"u":"nestruimte","c":"The Hague","co":"","p":"https://www.instagram.com/p/DbXpeg8gkiO/","x":"Over twee weken is het zover! Op zaterdag 15 augustus organiseren we van 14:00 - 22:00 een Block Party: een feest voor de hele buurt, op het De Constant Rebecqueplein in Den Haag. Speciaal voor wie thuis blijft of moet blijven in de zomervakantie.\n\nIn deze post introduceren we een paar van onze programma- en foodpartners! Meer info? Check de link in onze bio.\n\n🦐🍷 La Rana\n\nGevestigd aan de Stationsweg in Den Haag en een specialist in Spaanse wijnen, klassieke tapas en spannende, creatieve hapjes. Als er iemand in Den Haag een goede paella op tafel kan zetten zijn het de chefs van La Rana wel.\n\nEN:\n\nIn two weeks, in the middle of the summer, Nest is hosting a Block Party! On Saturday August 15th from 14:00 - 22:00 at the De Constant Rebecqueplein in The Hague. For those who stay at home during the summer. An afternoon and evening full of art, music, good food and drinks, guided tours, workshops and games for all ages.\n\nIn this post we’ll introduce some more of our programme and food partners! Want to know more? Check the link in our bio!\n\n🦐🍷 La Rana\n\nLocated at the Stationsweg in The Hague, La Rana is specialised in Spanish wines, tapas and creative bites. If there’s anyone in The Hague that’s able to make a proper paella and pair it with just the right wines, it’s the chefs of La Rana!\n\n🪩 Museumnacht Den Haag - Lino-printing workshop\n\nLino-wat? Bij lino-printen snijdt je een afbeelding of tekst uit een linoleum plaat, smeer je de plaat in met inkt en druk je de tekening af op een vel papier of een stuk stof. In een handomdraai heb je je eigen met de hand gedrukte kunstwerk voor je neus.\n\nEN:\n\nLino-what? Lino-cutting and printing is a technique where you cut a drawing, image or text from a sheet of linoleum, role in with inkt and print it onto a piece of paper or fabric. From simple designs to intricate colour layering: lino-printing is for everyone!\n\n🍕 Eus Pizza - verse zuurdesempizza’s\n\nDe mobiele pizzabakkerij van Eus Pizza bakt op het plein heerlijke zuurdesempizza’s. Perfect voor een zomermiddag en -avond in augustus\n\nEN:\n\nArmed with a mobile pizza oven, Eus Pizza will settle on the De Constant Rebecqueplein to provide you with the freshest sourdough-pi","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-29","ld":17,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Introducing the Abby Moore Café’s 2026 Chef-in-Residence: VegTable (@vegtable.rva) 🍅","k":"talk","s":"2026-08-15","e":null,"st":"15:00","et":"17:00","u":"icavcu","c":"Richmond","co":"","p":"https://www.instagram.com/p/DbyfAy2mGSf/","x":"Introducing the Abby Moore Café’s 2026 Chef-in-Residence: VegTable (@vegtable.rva) 🍅\n\nJoin us Saturday, August 15th (3–5 PM) at the Abby Moore Cafe as our Chef-in-Residence Program welcomes VegTable, a woman-owned Richmond brand celebrating peak-season Virginia produce! This summertime celebration will coincide with our Studio Ossidiana (@studio_ossidiana) artist talk—the architecture and design practice behind “Pond Theater.”\n\nAt the helm of VegTable is Chef Kathryn Schmitz. A graduate of the Culinary Institute of America with 20 years in hospitality, Kathryn has cooked her way through Richmond, Charlottesville, Italy, and Napa Valley, honing a style rooted in seasonal, ingredient-driven cuisine. Today, that passion lives on through VegTable, her venture championing local farms and showcasing Virginia’s harvest at its peak.\n\nExpect to try dishes such as gazpacho sippers, Virginia ham with whipped goat cheese, and compressed melon with basil, and more. Stay tuned for more Chef-in-Residence events!\n\nSummer Celebration: VegTable\n📍 601 W Broad St.\n🗓️ Saturday, Aug 15\n⏰ 3–5 PM","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-08","ld":7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Happening August 15: Join us for an artist talk with Alessandra Covini and Giovanni Bel...","k":"talk","s":"2026-08-15","e":null,"st":"15:00","et":"17:00","u":"icavcu","c":"Rotterdam","co":"","p":"https://www.instagram.com/p/DbwVmCXmJvb/","x":"Happening August 15: Join us for an artist talk with Alessandra Covini and Giovanni Bellotti of Rotterdam-based architecture and design practice Studio Ossidiana (@studio_ossidiana). Hear directly from the artists as they discuss their outdoor installation, “Pond Theater”, a reimagining of the ICA’s Martha Daniel Newell reflecting pool as a floating third space.\n\nThe afternoon closes with a live outdoor activation featuring The Line in the Sand, a Richmond experimental music ensemble led by Caleb Flood, exploring analog sound through magnetic tape, violin bows, and wire. \n\nTo RSVP click the link in bio. Free and open to the public.\n\n📍 601 W Broad St.\n🗓️ Saturday, Aug 15\n⏰ 3–5 PM | Talk starts at 3:30 PM\n\nImages: \n\nPortrait of Giovanni Bellotti and Alessandra Covini. (Photograph by Marco Cappelletti) \n\nStudio Ossidiana, “Pond Theater”, 2026, expanded polystyrene, epoxy and fiberglass mat composite coating, epoxy sealer with Sherwin-Williams with high-solid marine polyurethane topcoat, installation view, Broad Signals, ICA at VCU, 2026. (artwork @ Studio Ossidiana; photograph by David Hunter Hale)","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-08-07","ld":8,"dl":"2026-08-15","ds":"event start","ap":false,"rel":false,"q":false},{"now":false,"t":"How do our perspectives shape the way we interpret images?","k":"other","s":"2026-08-15","e":null,"st":"17:00","et":null,"u":"sharjahart","c":"Sharjah","co":"","p":"https://www.instagram.com/p/DbaqtH7IXZm/","x":"How do our perspectives shape the way we interpret images?\n\nThis August, join our Book Club Meetup as we explore how photographs are produced, perceived and understood. \n\nOur discussion will draw from books such as Susan Sontag’s ‘On Photography’, Tina M. Campt’s ‘Listening to Images’ and Ali Behdad’s and Luke Gartlan’s ‘Photography’s Orientalism’. You are  welcome to bring along other texts or references you think can enrich the conversation.\n\n📚 SAF Book Club Meetup: Theories of Photography\n📅 15 August 2026\n🕗 5:00 pm–7:00 pm\n📍 Photography Gallery, Al Manakh, Sharjah\n\nWhether you’ve read the featured books or are simply curious about the theme, you’re welcome to join the conversation.\n\nFree admission. Register now through the link in our bio.\n\nكيف تؤثر وجهات نظرنا في الطريقة التي نفسّر بها الصور؟\nانضموا إلينا في جلسة ملتقى نادي الكتاب لشهر أغسطس، لنناقش كيف تُنتَج الصور الفوتوغرافية، وكيف نتلقاها ونفهمها.\n\nتناقش الجلسة مجموعة من الكتب، من بينها «حول الفوتوغراف» لسوزان سونتاغ، و«الإنصات للصور» لتينا م. كامبت، و«الاستشراق في الفوتوغراف» لعلي بهداد ولوك غارتلان. كما يمكنكم إحضار نصوص أو مراجع أخرى تثري الحوار.\n\n📚 ملتقى نادي الكتاب في مؤسسة الشارقة للفنون: نظريات الفوتوغراف\n📅  15 أغسطس 2026\n🕗 5:00 – 7:00 مساءً\n📍 رواق الفوتوغراف، المناخ، الشارقة\n\nسواء قرأتم الكتب المختارة أو كنتم مهتمين بموضوع اللقاء، ندعوكم للحضور ومشاركتنا الجلسة.\n\nالدخول مجاني. سجّلوا الآن عبر الرابط الموجود في الوصف.","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-30","ld":16,"dl":"2026-08-15","ds":"run closes","ap":false,"rel":false,"q":false},{"now":false,"t":"What does it take to shape a lasting cultural legacy?","k":"exhibition","s":"2026-08-15","e":null,"st":"18:00","et":"19:30","u":"sharjahart","c":"Sharjah","co":"","p":"https://www.instagram.com/p/DbvlYPsoB07/","x":"What does it take to shape a lasting cultural legacy?\n\nJoin us for the second session of Dialogues, in which Dr Yousif Aydabi speaks with Ismail Al Rifai about his remarkable journey—from poetry and theatre to journalism and cultural leadership.\n\nDialogues explores the stories and vision behind the institutions and creative initiatives that have shaped Sharjah’s cultural landscape.\n\nDialogues: From the Realm of Poetry to the Oasis of Culture\nWith Dr. Yousif Aydabi and Ismail Al Rifai\n📅 15 August 2026\n🕕 6:00–7:30 pm\n🛸 The Flying Saucer, Dasman, Sharjah\n\nOpen to participants ages 17+. The session will be conducted in Arabic.\n\nFree admission. Register through the link in bio.\n\nانضموا إلينا في الجلسة الثانية من برنامج «حواريّات» والتي تستضيف الدكتور يوسف عيدابي المستشار الثقافي لدارة الدكتور سلطان القاسمي، يحاوره إسماعيل الرفاعي مدير قسم الترجمة والمحتوى العربي في المؤسسة، حول مسيرته الثرية التي امتدت لعقود، وشملت ميادين الشعر والمسرح والصحافة والعمل الثقافي. \n\nيسعى «حواريّات» عبر جلساته لاستكشاف القصص والرؤى والتطلعات التي أسهمت في تشييد ركن الثقافة المكين، وشكلت المشهد الثقافي في الشارقة.\n\nحواريّات: من ناصية الشعر إلى واحة الثقافة\nمع الدكتور يوسف عيدابي وإسماعيل الرفاعي\n15 أغسطس 2026\n6:00 – 7:30 مساءً\nالطبق الطائر، دسمان، الشارقة\n\nتقام هذه الجلسة باللغة العربية، وهي متاحةٌ للحضور ممن هم فوق 17 عاماً.\n\nالدخول مجاني. سجلوا الآن عبر الرابط الموجود في الوصف.","r":false,"b":"register","af":true,"so":false,"pd":"2026-08-07","ld":8,"dl":"2026-08-15","ds":"run closes","ap":false, ll,"et":null,"u":"hoffman.donahue","c":"","co":"","p":"https://www.instagram.com/p/DbnrD6-lFul/","x":"LINCOLN, NE — Rochelle Feinstein is included in Gender, Genre, Generation: Women Painting Abstraction, opening Saturday, August 15 at Sheldon Museum of Art.\n\nBringing together Feinstein with Candida Alvarez, Carrie Moyer, and Amy Sillman, the exhibition explores the lasting potency of abstraction to address critical issues in both aesthetics and politics through recent work of four female painters, the artists who offer the most consequential proposition for abstract painting today.\n\nOperating with deep understanding of — though not necessarily full respect towards — established formats of twentieth-century modernisms, these painters construct their own visual languages for the contemporary moment, grounded in their lived experience of gendered and political beings in American society. In their paintings, material experimentation and a wide variety of techniques go hand in hand with intellectual commitment, demonstrating full dedication to the formal as well as the social.\n\nGender, Genre, Generation is organized by Magdalena Moskalewicz, PhD, chief curator and associate director for curatorial affairs at Sheldon Museum of Art, and will remain on view through January 3, 2027.\n\nImage: Rochelle Feinstein, Someone Else’s Country, 2022. Acrylic, cotton drop cloth, rainbow thread. 60 x 58 inches (152.4 x 147.32 cm).\n\n@rochellefeinstein @sheldonmuseum @candida_alvarez_studio @amysillman #RochelleFeinstein #GenderGenreGeneration #SheldonMuseumOfArt","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":11,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Met de zomer in volle gang is het alweer tijd voor de laatste weken van de tentoonstell...","k":"exhibition","s":"2026-08-15","e":null,"st":null,"et":null,"u":"nestruimte","c":"The Hague","co":"","p":"https://www.instagram.com/p/DbsVqHTAoxv/","x":"Met de zomer in volle gang is het alweer tijd voor de laatste weken van de tentoonstelling 𝘖𝘶𝘵 𝘰𝘧 𝘖𝘧𝘧𝘪𝘤𝘦 (𝘚𝘵𝘪𝘭𝘭 𝘏𝘦𝘳𝘦). Speciaal voor alle thuisblijvers is deze tentoonstelling over ongelijkheid tijdens de zomervakantie extra lang open geweest. Nu is de laatste kans voor een bezoek! Onderweg terug van het strand, op weg naar een barbeque van vrienden of voor je filmbezoek bij onze buren van @florafilmtheater, van donderdag tot en met zondag.\n\nVolgende week sluiten we de tentoonstelling feestelijk af met een Block Party op zaterdag 15 augustus. Out of Office (Still Here) is nog open tot en met zondag 16 augustus.\n\n📸 by Kyle Tryhorn\n\n➡️ swipe for English \n\nWith the summer in full effect we’re reaching the last few weeks of the exhibition 𝘖𝘶𝘵 𝘰𝘧 𝘖𝘧𝘧𝘪𝘤𝘦 (𝘚𝘵𝘪𝘭𝘭 𝘏𝘦𝘳𝘦). For everyone staying at home in The Hague during the summer the exhibition was open throughout the whole summer. Now is your last chance to visit! On your way (back) to/from the beach, or before your visit to our neighbours at @florafilmtheater. From Thursday till Sunday.\n\nWe’re festively closing the exhibition on Saturday August 15th with our Block Party, but you can still visit the exhibition until Sunday August 16th.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":9,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Heb je ons Nest-biertje al geproefd? Speciaal voor Nest maakte Haagse brouwerij Kompaan...","k":"exhibition","s":"2026-08-15","e":null,"st":null,"et":null,"u":"nestruimte","c":"The Hague","co":"","p":"https://www.instagram.com/p/DbqIDdOAkhk/","x":"Heb je ons Nest-biertje al geproefd? Speciaal voor Nest maakte Haagse brouwerij Kompaan 𝓕𝓾𝓷𝓮𝓼𝓽. Een fruitig witbier met een lichte bite, en een prachtig label van ontwerper Bart de Baets. Perfect voor in de zon, tijdens een opening of een lezing. Kom proven tijdens onze Block Party op zaterdag 15 augustus!\n\nEN:\n\nHave you tried our Nest beer yet? For Nest, The Hague’s finest brewery Kompaan created 𝓕𝓾𝓷𝓮𝓼𝓽: a fruity white bear with a slight bite and a gorgeous label designed by Bart de Baets. Perfect for sunny summer days, an opening or other get-togethers. Come and taste funest during our Block Party on August 15th!","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":10,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"𝘼 𝙉𝙚𝙬 𝙁𝙪𝙩𝙪𝙧𝙚 𝙍𝙚𝙨𝙞𝙙𝙚𝙣𝙘𝙮 𝙀𝙭𝙘𝙝𝙖𝙣𝙜𝙚","k":"exhibition","s":"2026-08-15","e":null,"st":null,"et":null,"u":"flux_factory","c":"","co":"","p":"https://www.instagram.com/p/Da0o2wMpTKm/","x":"𝘼 𝙉𝙚𝙬 𝙁𝙪𝙩𝙪𝙧𝙚 𝙍𝙚𝙨𝙞𝙙𝙚𝙣𝙘𝙮 𝙀𝙭𝙘𝙝𝙖𝙣𝙜𝙚\nResidency Dates: November 2026 - July 2027\nDeadline: August 15, 2026\n\nFlux Factory is excited to announce an open call for New York City-based artists and curators to participate in 𝘼 𝙉𝙚𝙬 𝙁𝙪𝙩𝙪𝙧𝙚 𝙍𝙚𝙨𝙞𝙙𝙚𝙣𝙘𝙮 𝙀𝙭𝙘𝙝𝙖𝙣𝙜𝙚, a new initiative to strengthen collaboration and build relationships between the US and 9 post-Soviet countries: Armenia, Azerbaijan, Belarus, Georgia, Kazakhstan, Kyrgyzstan, Moldova, Ukraine, and Uzbekistan.\n\nThrough this open call, seven New York City-based artists and curators will be in residence at host organizations in post-Soviet countries from November 2026 – July 2027. 𝘼 𝙉𝙚𝙬 𝙁𝙪𝙩𝙪𝙧𝙚 builds a long-term, artist-driven network connecting artists and cultural practitioners in the US and post-Soviet countries. These exchanges provide artists with time, space, and a collaborative environment to develop new work while engaging directly with local communities and cultural contexts.\n\nEach residency will be tailored to the interests and needs of the participating resident and host organization. Residents will have the opportunity to conduct research, create new work, and share their work with the local community. \n\nRead full details at the link in our bio 🔗","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":31,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":false,"t":"Let's sketch in the sculpture garden!","k":"other","s":"2026-08-16","e":null,"st":"11:00","et":null,"u":"lacma","c":"Los Ang
