<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Upcoming art and film events from the Instagram accounts you follow.">
<title>What's On — events from the accounts you follow</title>
<style>
/* ---------------------------------------------------------------------------
   Typographic system, after Experimental Jetset / Stedelijk / Cooper's New
   Public Forum. The rules it follows, so future edits do not erode it:

   1. No containers. Rules divide content; nothing is boxed, rounded or shadowed.
   2. Hierarchy comes from size, weight and position. Never from colour.
   3. One accent, used only for "this needs booking". Everything else is ink.
   4. Every mark carries information. The eleven category colours were removed
      because each event already names its kind in words — the colour restated
      the label. Grid dots became counts for the same reason: a numeral says
      "6 events", four dots said "some".
   5. Uppercase grotesque for structure, the same face for content. One family.
--------------------------------------------------------------------------- */
:root{
  --paper:#FFFFFF; --ink:#0A0A0A; --mid:#767676; --rule:#0A0A0A;
  --hair:rgba(10,10,10,.16); --accent:#E4250B; --sel:#0A0A0A; --sel-ink:#FFFFFF;
  --gut:20px;
  --grotesk:"Helvetica Neue",Helvetica,Inter,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#0A0A0A; --ink:#F2F2F2; --mid:#8A8A8A; --rule:#F2F2F2;
         --hair:rgba(242,242,242,.2); --accent:#FF5C3D;
         --sel:#F2F2F2; --sel-ink:#0A0A0A; }
}
:root[data-theme="dark"]{
  --paper:#0A0A0A; --ink:#F2F2F2; --mid:#8A8A8A; --rule:#F2F2F2;
  --hair:rgba(242,242,242,.2); --accent:#FF5C3D; --sel:#F2F2F2; --sel-ink:#0A0A0A;
}
:root[data-theme="light"]{
  --paper:#FFFFFF; --ink:#0A0A0A; --mid:#767676; --rule:#0A0A0A;
  --hair:rgba(10,10,10,.16); --accent:#E4250B; --sel:#0A0A0A; --sel-ink:#FFFFFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--grotesk);
  font-size:15px;line-height:1.25;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 0 120px}

/* ---- masthead: the name, then the count as a fact ---- */
.title{padding:22px var(--gut) 14px}
h1{margin:0;font-size:34px;line-height:.94;font-weight:700;letter-spacing:-.035em;
  text-transform:uppercase}
.sub{margin-top:8px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--mid);font-variant-numeric:tabular-nums}

/* ---- controls: type, not chrome ---- */
header{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule)}
.bar-row{display:flex;align-items:stretch;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--hair)}
.filt{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px var(--gut);
  font:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink);background:none;border:0;border-right:1px solid var(--hair);
  cursor:pointer;max-width:58%}
.filt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filt .car{color:var(--mid)}
.filt[aria-expanded="true"] .car{transform:rotate(90deg)}
.filt.on{background:var(--sel);color:var(--sel-ink)}
.filt.on .car{color:var(--sel-ink)}
.views{display:flex;margin-left:auto}
.vb{padding:10px 15px;font:inherit;font-size:11px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--mid);background:none;border:0;
  border-left:1px solid var(--hair);cursor:pointer}
.vb[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.filt:focus-visible,.vb:focus-visible,.cell:focus-visible,.btn:focus-visible,
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.panel{border-bottom:1px solid var(--hair)}
.search{width:100%;padding:13px var(--gut);font:inherit;font-size:16px;
  color:var(--ink);background:none;border:0;border-bottom:1px solid var(--hair)}
.search::placeholder{color:var(--mid)}
.chips{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;border-bottom:1px solid var(--hair)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 13px;font:inherit;font-size:11px;
  text-transform:uppercase;letter-spacing:.08em;color:var(--mid);background:none;
  border:0;border-right:1px solid var(--hair);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.chip .dot{display:none}          /* the label is the information */

/* ---- month grid: numerals, not dots ---- */
.monthnav{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--rule)}
.mlab{flex:1;padding:14px var(--gut);font-size:19px;font-weight:700;
  text-transform:uppercase;letter-spacing:-.02em}
.mb{width:52px;padding:14px 0;font:inherit;font-size:17px;color:var(--ink);
  background:none;border:0;border-left:1px solid var(--hair);cursor:pointer}
.dows{display:grid;grid-template-columns:repeat(7,1fr);
  border-bottom:1px solid var(--hair)}
.dows b{padding:7px 0;text-align:center;font-size:10px;font-weight:400;
  letter-spacing:.1em;color:var(--mid)}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{position:relative;aspect-ratio:1/.92;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:space-between;padding:6px 7px;
  font:inherit;font-size:13px;color:var(--ink);background:none;
  border:0;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
  cursor:pointer;font-variant-numeric:tabular-nums;text-align:left}
.cell:nth-child(7n){border-right:0}
.cell.pad{color:var(--mid);opacity:.3;cursor:default}
.cell.today{font-weight:700}
.cell.today::before{content:"";position:absolute;left:0;top:0;right:0;
  height:2px;background:var(--accent)}
.cell[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.cnt{font-size:11px;color:var(--mid);font-variant-numeric:tabular-nums}
.cell[aria-pressed="true"] .cnt{color:var(--sel-ink)}
.cnt.run{color:var(--mid);opacity:.6}
.pips,.pip,.run-u{display:none}   /* replaced by counts */

/* ---- section headings: a rule and a word ---- */
.daybar{display:flex;align-items:baseline;gap:10px;padding:26px var(--gut) 7px;
  border-bottom:1px solid var(--rule);background:var(--paper);
  font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mid)}
.daybar .n{font-size:17px;letter-spacing:-.02em;text-transform:uppercase;
  color:var(--ink);font-weight:700}
.daybar.soon .n{color:var(--accent)}
.dayhead{padding:22px var(--gut) 7px;border-bottom:1px solid var(--rule);
  font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:-.02em}
.dayhead .c{font-size:11px;font-weight:400;letter-spacing:.09em;color:var(--mid);
  margin-left:10px;text-transform:uppercase}

/* ---- the event row: status at left, title at right ---- */
.ev{display:grid;grid-template-columns:78px 1fr;gap:0 16px;
  padding:14px var(--gut);border-bottom:1px solid var(--hair);
  background:none;border-radius:0;box-shadow:none;position:static}
.ev::before,.ev::after{display:none}
.line1{grid-column:1;display:flex;flex-direction:column;gap:3px;
  font-size:9px;line-height:1.4;text-transform:uppercase;letter-spacing:.02em;
  color:var(--mid);font-variant-numeric:tabular-nums;
  /* Never break a word: the column is sized to hold the longest kind name
     ("PERFORMANCE") whole. Wrapping happens between items, not inside them. */
  overflow-wrap:normal;word-break:keep-all;hyphens:none;min-width:0}
.kind{color:var(--mid);font-weight:400}
.ev.act .kind{color:var(--accent)}
.bk{color:var(--accent);font-weight:700;border:0;padding:0;font-size:10px;
  letter-spacing:.08em}
.run{color:var(--mid);border:0;padding:0;font-size:10px}
.time{font-variant-numeric:tabular-nums}
.ttl{grid-column:2;margin:0;font-size:20px;line-height:1.12;font-weight:500;
  letter-spacing:-.022em;text-wrap:balance}
.line2{grid-column:2;margin-top:6px;font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--mid);display:flex;gap:12px;flex-wrap:wrap}
.line2 b{font-weight:400;color:var(--ink)}
.lead{font-variant-numeric:tabular-nums}
.ev.going{background:none}
.ev.going .ttl{text-decoration:underline;text-decoration-thickness:2px;
  text-underline-offset:4px}
.ev.gone{opacity:.42}
.cap{grid-column:2;display:none;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--hair);font-size:14px;line-height:1.45;
  letter-spacing:0;white-space:pre-wrap;word-break:break-word;color:var(--ink);
  text-transform:none}
.ev.open .cap{display:block}
.acts{grid-column:2;display:flex;gap:20px;margin-top:11px}
.btn{padding:0;font:inherit;font-size:11px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--ink);background:none;border:0;
  border-bottom:1px solid var(--ink);cursor:pointer;text-align:left;flex:0 0 auto}
.btn.go[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent);
  font-weight:700}
a.btn{text-decoration:none}

/* ---- the going bar ---- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);
  border-top:1px solid var(--rule);padding:12px var(--gut)
  calc(12px + env(safe-area-inset-bottom));display:none;gap:14px;align-items:center}
.bar.on{display:flex}
.bar span{font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--mid);font-variant-numeric:tabular-nums}
.bar button{margin-left:auto;padding:9px 16px;font:inherit;font-size:11px;
  font-weight:700;text-transform:uppercase;letter-spacing:.09em;border:0;
  border-radius:0;background:var(--accent);color:#fff;cursor:pointer}
.empty{padding:60px var(--gut);color:var(--mid);font-size:12px;
  text-transform:uppercase;letter-spacing:.09em}
.note{padding:22px var(--gut);border-top:1px solid var(--rule);font-size:11px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--mid);line-height:1.7}

@media (max-width:430px){
  :root{ --gut:13px; }
  h1{font-size:27px}
  .ev{grid-template-columns:74px 1fr;gap:0 11px;padding:12px var(--gut)}
  .ttl{font-size:17px}
  .cell{aspect-ratio:1/1;padding:5px}
  .vb{padding:10px 11px}
}
@media (prefers-reduced-motion:no-preference){
  .filt .car{transition:transform .12s ease}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="title">
    <h1>What&rsquo;s On</h1>
    <div class="sub" id="sub">709 events ahead</div>
  </div>
  <header>
    <div class="bar-row">
      <button class="filt" id="filtBtn" type="button" aria-expanded="false"
              aria-controls="filters">
        <span id="filtTxt">Filter</span><span class="car" aria-hidden="true">&rsaquo;</span>
      </button>
      <div class="views">
        <button class="vb" id="vMonth" type="button" aria-pressed="true">Month</button>
        <button class="vb" id="vList" type="button" aria-pressed="false">List</button>
        <button class="vb" id="vBook" type="button" aria-pressed="false">Book</button>
      </div>
    </div>
    <div class="panel" id="filters" hidden>
      <input class="search" id="q" type="search" placeholder="Search title, space, city&hellip;"
             autocomplete="off" aria-label="Search events">
      <div class="chips" id="cityChips"></div>
      <div class="chips" id="kindChips"></div>
    </div>
  </header>
  <section id="cal" hidden>
    <div class="monthnav">
      <button class="mb" id="prev" type="button" aria-label="Previous month">&lsaquo;</button>
      <span class="mlab" id="mlab"></span>
      <button class="mb" id="next" type="button" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="dows"><b>S</b><b>M</b><b>T</b><b>W</b><b>T</b><b>F</b><b>S</b></div>
    <div class="grid" id="grid"></div>
    <div class="dayhead" id="dayhead"></div>
  </section>
  <main id="list"></main>
  <p class="note">Marks are kept only while this page is open — export before you
     close it. Every event links back to the original post.</p>
</div>

<div class="bar" id="bar">
  <span id="barTxt"></span>
  <button id="exp" type="button">Export to calendar</button>
</div>

tialities\", die Einzelaus...","k":"exhibition","s":"2026-08-02","e":"2026-08-04","st":null,"et":null,"u":"kestner_gesellschaft","c":"Hannover","co":"","p":"https://www.instagram.com/p/Dbf18u0jKcP/","x":"Nur noch wenige Tage: Am Sonntag, 2. August 2026, endet \"Potentialities\", die Einzelausstellung des US-amerikanischen Künstlers Richard Hawkins in der Kestner Gesellschaft.\n\nNutzt die Gelegenheit, die Ausstellung noch einmal zu besuchen – und vielleicht auch ein Stück davon mit nach Hause zu nehmen.\n\nPassend zur Ausstellung gibt es den gleichnamigen Katalog, unsere burgunderrote Tasche mit dem Ausstellungsschriftzug sowie Patches mit Motiven aus zwei Werken von Richard Hawkins. Wer hat die beiden Details in der Ausstellung schon entdeckt?\n\nAußerdem sind zwei limitierte Editionen erhältlich: das pinke T-Shirt mit einem Siebdruck des Gesichts von Mike Kelley sowie der Giclée-Druck „Mystery Cult of Harpocrates (Hannover Version)”, 2026.\n\nWir freuen uns auf euren Besuch!\n_____\nOnly a few days left: \"Potentialities\", the solo exhibition by American artist Richard Hawkins at Kestner Gesellschaft, closes on Sunday, August 2, 2026.\n\nTake the opportunity to visit the exhibition one last time—and perhaps take a piece of it home with you.\n\nAlongside the exhibition, you’ll find the accompanying catalogue, our burgundy tote bag featuring the exhibition title, and patches based on details from two of Richard Hawkins’ works. Have you spotted both details in the exhibition yet?\n\nTwo limited editions are also available: a pink T-shirt featuring a silkscreen print of Mike Kelley’s face, and the Giclée print \"Mystery Cult of Harpocrates (Hannover Version)\", 2026.\n\nWe look forward to welcoming you!","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":1,"dl":null,"ds":null,"ap":true,"rel":false,"q":false},{"now":true,"t":"Sidney Meyers’s The Quiet One + Herbert Marshall’s Tinker","k":"screening","s":"2026-08-04","e":null,"st":"20:30","et":null,"u":"lightindustry","c":"New York","co":"","p":"https://www.instagram.com/p/DbYFYagEbBN/","x":"Sidney Meyers’s The Quiet One + Herbert Marshall’s Tinker\nTuesday, August 4, 2026 at 7pm\nLight Industry, 361 Stagg Street, Suite 407, Brooklyn\n\n7pm\nThe Quiet One, Sidney Meyers, 1948, 16mm, 65 mins\n\n8:30pm\nTinker, Herbert Marshall, 1949, 16mm, 69 mins\n\nA foundational work of American independent cinema, and a noted influence on directors like Charles Burnett and Billy Woodberry, Sidney Meyers’s The Quiet One helped inaugurate a realist idiom for film in the US. It’s an intimate study of an impoverished and neglected Harlem youth (Donald Thompson) who is sent upstate to attend the Wiltwyck School for Boys, a progressive center for the treatment of “juvenile delinquents.” Though shot on a shoestring, the moody docufiction brought together a remarkable array of mid-century talents. The project had been inspired by Helen Levitt, Janice Loeb, and James Agee’s film In the Street and, for The Quiet One, Levitt and Loeb provided cinematography, while Agee penned the dialogue. Their fellow WPA alum Sidney Meyers, who directed, would go on to helm the mondo Los Angeles classic The Savage Eye. Upon its release, The Quiet One was immediately and widely celebrated; “a new group of local film-makers has fashioned a genuine masterpiece,” the New York Times’s reviewer declared, comparing it to “those stark film dramas which we have had from Italy since the war.” Even Tallulah Bankhead was an admirer. At a preview screening, the star turned to a surprised Meyers and blurted: “It doesn't matter if you never direct another film. This is your epitaph. You can die now.”\n\nThe early British independent feature Tinker, from the same period, likewise mingles documentary and fiction in the service of an outsider’s coming-of-age tale. In this case it’s a young Traveler (Derek Smith) who abandons his family’s itinerant existence to live at a residential training center in Durham for prospective coal miners. Also parallel to The Quiet One is the use of nonprofessional actors. “This film has no stars,” Tinker explains in its opening titles. “Unknown people largely play their real life parts in their real surroundings.”\n\nFull announcement: lightindustry.org/thequietone","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-29","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Sadly, we are saying farewell to our Development Director, Jamison Driskill, as he step...","k":"other","s":"2026-08-04","e":null,"st":"04:30","et":null,"u":"lhucalubbock","c":"Santa Fe","co":"","p":"https://www.instagram.com/p/Dbd0t8JFtU5/","x":"Sadly, we are saying farewell to our Development Director, Jamison Driskill, as he steps into a pivotal role as Managing Director for Santa Fe Playhouse. Nonetheless, we are proud to see him take this next big step Westward!\n\nJamison’s approachable, kind, and memorable energy will be missed dearly! We know he will bring amazing things to our friends in Santa Fe and wish him all the best as he embarks on this journey.\n\nPlease join us to say congrats and farewell to Jamison on Tuesday, August 4th from 4:30 - 6:00 p.m. in the LHUCA Galleries. 🤎","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Tomorrow, Torkwase Dyson (@torkwasedyson) will join Odili Donald Odita (@odiliodita) in...","k":"talk","s":"2026-08-04","e":null,"st":"18:00","et":"19:00","u":"pacegallery","c":"New York","co":"","p":"https://www.instagram.com/p/DblwJ6nGpsI/","x":"Tomorrow, Torkwase Dyson (@torkwasedyson) will join Odili Donald Odita (@odiliodita) in a conversation at the Nevada Museum of Art (@nevadaart).\n-\nDrawing on Africanist approaches to pattern and international political contexts that position color as a form of communication, their dialogue will journey through their practices and coalesce in Odita’s current presentation at the museum.\n-\nWork in Progress: Odili Donald Odita in Conversation with Torkwase Dyson\nAugust 4, 6 – 7 PM\nNevada Museum of Art, Reno\n-\nTap the link in bio to learn more about #TorkwaseDyson, who will present new paintings at #PaceNewYork in September.\n-\nArtwork: Composite of Odili Donald Odita and Torkwase Dyson.\n#ContemporaryArt","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-03","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The first great success of renowned Swiss filmmaker Alain Tanner, The Salamander also r...","k":"screening","s":"2026-08-04","e":null,"st":null,"et":null,"u":"filmcommentmagazine","c":"New York","co":"","p":"https://www.instagram.com/p/DboKHODE32u/","x":"The first great success of renowned Swiss filmmaker Alain Tanner, The Salamander also represents one of his many collaborations with John Berger: between 1966-76 the pair made four films together (including Tanner’s most famous, the 1976 feature, Jonah Who Will Be 25 in the Year 2000). The Salamander begins with a succession of enigmatic images: a man is shown cleaning his gun; the gun goes off; furtively, a woman’s face appears. From this mysterious opening, Tanner and Berger build a metaphorical scenario: two men, a journalist and a writer, are determined to discover the truth about this woman. Each uses his own weapons: documentary research in one case, boundless imagination in the other. But gradually, both courses of action prove futile. ⁠\n⁠\nThe beauty of the film lies in its capacity to develop a theme without ever belaboring its message: that reality outruns all efforts to grasp it. ⁠\n⁠\nThe Salamander screens tonight at Anthology Film Archives (@anthologyfilmarchives).⁠\n⁠\nThere are still a few more screenings of Hold Everything Dear – John Berger and Cinema: A multi-venue Film Comment: Live series celebrating the writer’s centennial. Learn more at Film Comment (@filmcommentmagazine)’s website now.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Impressions from the weekly Kids' Gardening Club at KW! 🪴","k":"workshop","s":"2026-08-04","e":null,"st":"16:00","et":null,"u":"kwinstitutefcontemporaryart","c":"Berlin","co":"","p":"https://www.instagram.com/p/Dbknhe1ifUK/","x":"Impressions from the weekly Kids' Gardening Club at KW! 🪴\n\nJoin us tomorrow and every Tuesday in '2075', artist Asad Raza's @asaaddo  commissioned garden in the KW backyard, for an afternoon of gardening, learning, and creative activities. Together with community gardener and horticulturist Max Kanter @maxwellkan and landscape architect Lauren Hamer, children and families can explore plant life, discover the power of soil, care for the garden, and enjoy a drawing and painting corner.\n\nWorkshop, Kids & Families\nKids' Gardening Club\nTue, 04.08.26\nTue, 11.08.26\nTue, 18.08.26\nTue, 25.08.26\nTue, 01.09.26\n16:00–18:00 (DE, EN)\n\nRegistration via mediation@kw-berlin.de, limited capacity.\n\nMore info 🔗 link in bio.\n____________________\n\n#contemporaryartberlin #kw #kwinstituteforcontemporaryart #kwberlin #kidsgardeningclub\n\nImages: Kids’ Gardening Club at KW Institute for Contemporary Art, Berlin 2026. Photos: Max Kanter.","r":false,"b":"limited","af":true,"so":false,"pd":"2026-08-03","ld":1,"dl":"2026-08-03","ds":"capacity","ap":false,"rel":false,"q":false},{"now":true,"t":"𝟭 𝗞𝗲𝘆𝘄𝗼𝗿𝗱, 𝟮 𝗤𝘂𝗲𝘀𝘁𝗶𝗼𝗻𝘀, 𝟯 𝗣𝗲𝗼𝗽𝗹𝗲, 𝟰 𝗠𝗶𝗻𝘂𝘁𝗲𝘀","k":"exhibition","s":"2026-08-04","e":null,"st":"16:30","et":null,"u":"qlim_","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbSYNa-iDJc/","x":"𝟭 𝗞𝗲𝘆𝘄𝗼𝗿𝗱, 𝟮 𝗤𝘂𝗲𝘀𝘁𝗶𝗼𝗻𝘀, 𝟯 𝗣𝗲𝗼𝗽𝗹𝗲, 𝟰 𝗠𝗶𝗻𝘂𝘁𝗲𝘀\n𝙂𝙧𝙖𝙞𝙣, 𝙎𝙘𝙧𝙚𝙚𝙣, 𝙎𝙩𝙧𝙪𝙘𝙩𝙪𝙧𝙚\n\nTuesday, August 4, 2026\n16:30-17:45\nBuurtsalon Jeltje, Grote Zaal\nEerste Helmersstraat 106-N\n1054 EG Amsterdam\n\n𝟭 𝗞𝗲𝘆𝘄𝗼𝗿𝗱, 𝟮 𝗤𝘂𝗲𝘀𝘁𝗶𝗼𝗻𝘀, 𝟯 𝗣𝗲𝗼𝗽𝗹𝗲, 𝟰 𝗠𝗶𝗻𝘂𝘁𝗲𝘀 is a series of public conversations on keywords drawn from time-based practices. Organized by artists Min Oh and Kyulim Kim, the series opens a dialogue across July and August by inviting a different artist each week, creating a space where distinct practices, disciplines, and ways of thinking encounter one another.\n\nThe format is straightforward:\n – 1 keyword: each participant introduces one keyword in 4 minutes.\n – 2 questions: each participant asks one question to each of the other two speakers.\n – 3 people: each session features Min Oh, Kyulim Kim, and a weekly guest.\n – 4 minutes: every question-and-answer exchange is limited to four minutes.\n – After 36 minutes, the conversation opens to the audience.\n\nMin Oh explores the superposition of heterogeneous genres, media, and roles, as well as how time is perceived, consumed, or generated in that encounter. @min___oh___ \n\nKyulim Kim investigates damage, loss, restoration, and movement through imaging technologies that reveal what usually remains unseen. @qlim_\n\nGuest: Pam Virada engages the cinematic and the temporal through site-relational works that attune to atmospheric and spatial conditions. @_pamvirada \n\nAugust guests:\nAugust 4 Pam Virada @_pamvirada\nAugust 11 Fransisca Angela @fransiscangela\nAugust 18 Luis Lecea Romera @luislecea","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":8,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"QUEER RESILIENCE SUMMIT 2026","k":"other","s":"2026-08-04","e":null,"st":"09:30","et":null,"u":"encourager.nl","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbbZbOcCht4/","x":"QUEER RESILIENCE SUMMIT 2026\n\nJoin us for a day of inspiring conversations, powerful performances and meaningful connections as we explore what queer resilience means in today's world.\n\nTogether with activists, policymakers, researchers, professionals and community members, we'll dive into digital rights, community care, disability justice, artistic expression and collective action.\n\n📅 Tuesday, August 4, 2026\n🕤 Registration & coffee: 09:30–10:00\n🕙 Programme: 10:00–16:00\n🛍️ Queer Market: 12:30–19:00\n📍 WestWeelde, Amsterdam\n\nThe programme is free to attend and will be held entirely in English.\n\nRegister via the QR code or the link in our bio.\n\nWe look forward to welcoming you! 🌈\n\n#QueerResilienceSummit #QueerResilience #LGBTQIA #Amsterdam #CommunityCare","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-30","ld":5,"dl":"2026-08-04","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Performance & Collective Reflection on Queer Resilience","k":"reading","s":"2026-08-04","e":null,"st":"10:00","et":null,"u":"encourager.nl","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbS4JNGCiSA/","x":"Performance & Collective Reflection on Queer Resilience\n\nHow do we tell stories of resilience through art?\nJoin a reflective reading on Queer Resilience by Ghaith Kween Qoutainy, a live performance by Brazilian trans artist Mavi Veloso, and an inspiring conversation between these two queer voices. Together, they explore what resilience means in a time of growing backlash, reflecting on resistance, collective care and the futures we are building together\n.\n📅 Tuesday, August 4, 2026\n🕙 10:00 AM – 4:00 PM (Queer Market until 7:00 PM)\n📍 WestWeelde, Amsterdam\n🎟️ Free admission – registration required.\n🔗 Register now via the link in our bio.\n\nJoin artists, activists, policymakers, researchers, professionals and community members for a day of inspiring conversations, performances and collective action exploring the power of queer resilience.\n\nKeynote: Digital Rights, Big Tech & Queer Resistance\n\nHow do we protect queer communities in an increasingly digital world?\n\nWe're proud to welcome Lotje Beek, policy advisor at Bits of Freedom, the leading Dutch digital rights organisation, as the keynote speaker for the Queer Resilience Summit 2026.\nBits of Freedom advocates for internet freedom through policy, research, campaigning and strategic litigation, ensuring that technology serves people—not corporate interests. Earlier, the organisation successfully challenged Meta in court over its profiling-based feeds and continues to advocate for greater transparency and accountability around the removal of queer organisations from social media platforms.\n\nIn this keynote, Lotje will explore the growing influence of Big Tech on our digital lives, what recent developments mean for LGBTQIA+ communities, and how we can strengthen our digital rights and resilience in an increasingly complex online landscape.\n\n📅 Tuesday, August 4, 2026\n🕙 10:00 AM – 4:00 PM (Queer Market until 7:00 PM)\n📍 WestWeelde, Amsterdam\n🎟️ Free admission – registration required.\n🔗 Register now via the link in our bio.\n\nJoin artists, activists, policymakers, researchers, professionals and community members for a day of inspiring conversations, performances and collective action exploring the power of queer","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-27","ld":8,"dl":"2026-08-04","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"MEET YOUR HOST ✨","k":"other","s":"2026-08-04","e":null,"st":null,"et":null,"u":"encourager.nl","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DaVWsqTK5iE/","x":"MEET YOUR HOST ✨\n\nWe’re honoured to welcome Zaïre Krieger as the host of the Queer Resilience Summit.\n\nPoet, spoken word artist and interdisciplinary creator, Zaïre’s work is a powerful call for justice and love. Through layered storytelling and captivating performances, she creates space for reflection, connection and collective strength.\n\nAn award winning spoken word artist and author of the debut poetry collection Chameleon, Zaïre will guide us through a day of meaningful conversations, inspiring voices and shared experiences.\n\n📅 August 4, 2026\n📍 @westweelde, Amsterdam\n\nJoin us for a day of community, creativity and resilience. Sign up through the link in our bio and secure your spot. 🌈","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-03","ld":32,"dl":"2026-08-04","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"QUEER RESILIENCE SUMMIT IS LOADING...","k":"other","s":"2026-08-04","e":null,"st":null,"et":null,"u":"encourager.nl","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DZXqfv-qsBn/","x":"QUEER RESILIENCE SUMMIT IS LOADING... \n\nCommunity. Connection. Creativity. Resistance. Joy.\n\nOn August 4, we're bringing together queer communities from across Amsterdam and beyond for a full day of conversations, networking, inspiration, and collective care.\n\nBecause resilience isn't something we build alone.\n\n🌈 Meet new people\n🛠️ Join interactive sessions curated by @nolimitsartcastle, @queer_is_not_a_manifesto and @encourager.nl\n🛍️ Explore the Queer Market by @blackpride.nl\n✨ Connect, reflect and celebrate\n\n📅 August 4, 2026\n📍 @westweelde, Amsterdam\n\nSign up now through the link in our bio and be among the first to secure your spot.\n\nThis is only the beginning. Stay tuned. 👀🔥\n\n#QueerResilienceSummit #QueerJoy #CommunityCare #QueerPower #Amsterdam","r":false,"b":"register","af":true,"so":false,"pd":"2026-06-09","ld":56,"dl":"2026-08-04","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Happy to share that I am a 2026 NYFA/NYSCA Artist Fellow for “Craft/Sculpture” 💫","k":"exhibition","s":"2026-08-04","e":null,"st":null,"et":null,"u":"aaaaito","c":"New York","co":"","p":"https://www.instagram.com/p/Dbn0piDjgTz/","x":"Happy to share that I am a 2026 NYFA/NYSCA Artist Fellow for “Craft/Sculpture” 💫\n\nThis grant/fellowship has me reflecting a lot on my 17+ years in New York after originally coming here for my undergraduate studies at Pratt. Ever since I graduated, I applied to NYFA opportunities with no luck and I know many other New Yorkers have experience similarly, lol. As someone who’s never won any merit-based awards/open calls before this, I found much needed support through friends, artist-run spaces, curatorial projects, mentors, studio manager jobs, and good people who gave me opportunities to experiment in their spaces. \n\nNY has shaped my practice in so many ways beyond the studio. From seeing undergrad friends grow in new exciting ways, grinding at internships and odd jobs, learning from older heads, seeing waves of new artists/galleries come and go, experimenting/failing, watching friends thrive, and watching friends disappear— im grateful for everything this city has given me over the years. Here’s just a small fraction of memorable moments/community from 2012-2025 that shaped me from freshly graduated Pratt student to whatever I am today.\n\nBig thanks to @nyfacurrent @nyscouncilonthearts and the panelists. Big congrats to the other fellows. And special thanks to everyone that’s been along for the ride 🫶","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Introducing Hold Everything Dear – John Berger and Cinema: A multi-venue Film Comment: ...","k":"other","s":"2026-07-29","e":"2026-08-05","st":null,"et":null,"u":"filmcommentmagazine","c":"New York","co":"","p":"https://www.instagram.com/p/Daic0kYlK_y/","x":"Introducing Hold Everything Dear – John Berger and Cinema: A multi-venue Film Comment: Live series celebrating the writer’s centennial.\n\nPerhaps best known as the host of Ways of Seeing, the 1972 BBC program that introduced a generation to the ideological analysis of visual art, John Berger was one of the most important writers of the last century. Across an oeuvre comprising modernist novels, breathtaking analyses of painting and photography, reports on life in Palestine, correspondences with revolutionaries like Subcomandante Marcos, and much else, Berger’s generosity, intelligence, and uncompromising integrity made him an exemplary left-wing public intellectual. A committed Marxist all his life, he was the rare critic for whom art was, always and necessarily, a site of both power and beauty; he was proud of being called a political propagandist, he said, “but my heart and eye have remained that of a painter.”\n\n2026 marks Berger’s centennial, and at a moment when the faculty of vision has been exploited, standardized, and wedded to atrocity like never before, Film Comment (@filmcommentmagazine) will shine a light on a lesser-known dimension of his work and legacy: its affinity with cinema. \n\nTaking place from July 29 to August 5 at Film at Lincoln Center (@filmlinc), Brooklyn Academy of Music (@bamfilmbrooklyn), Anthology Film Archives (@anthologyfilmarchives), the Museum of the Moving Image (@movingimagenyc), and Metrograph (@metrograph), this series will feature a selection of films that Berger worked on, wrote about, or inspired, along with talks that reinvigorate his intellectual and political legacy for contemporary film culture.\n\nProgrammed by Film Comment editor Devika Girish (@devikagirgayi). \nSpecial thanks to curatorial advisors Benjamin Crais (@bnjmncrs) and Brett Story (@brettpstory), and to Yves Berger and the estate of John Berger for their support.\n\nExplore the full program and get your tickets now! Additional special guests will be announced soon.\n\nTaking place from July 29 to August 5 at Film at Lincoln Center (@filmlinc), Brooklyn Academy of Music (@bamfilmbrooklyn), Anthology Film Archives (@anthologyfilmarchives), the Museum of the Moving I","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-08","ld":21,"dl":"2026-08-05","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"On July 29, we kicked off our Film Comment Live series \"Hold Everything Dear – John Ber...","k":"screening","s":"2026-07-29","e":"2026-08-05","st":null,"et":null,"u":"filmcommentmagazine","c":"New York","co":"","p":"https://www.instagram.com/p/DbeFgAqj4PP/","x":"On July 29, we kicked off our Film Comment Live series \"Hold Everything Dear – John Berger and Cinema\" at Film at Lincoln Center. The series celebrates the renowned critic by shining a light on a lesser-known dimension of his work and legacy: its connection with cinema.\n\nOur friends @nyrbooks and @versobooks were on hand with copies of Berger's books for sale before our screening of Pasolini's La rabbia on 35mm and the North American premiere of Timothy Neat's Walk Me Home in the Walter Reade Theater. The evening also featured in-person introductions from Film Comment Editor Devika Girish (@devikagirgayi) and actor Paul McIsaac, as well as a video introduction by Neat. \n\nThe series continues through August 5, with more screenings at @anthologyfilmarchives, @movingimagenyc, and @metrograph. Head to filmcomment.com to learn more, buy tickets, and read a collection of essays exploring Berger's connection with cinema.\n\nAnd, if you haven't already, subscribe to Film Comment today! Subscribers get advance discounted tickets to all of our events at Film at Lincoln Center, among many other benefits!","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-07-31","ld":-2,"dl":"2026-08-05","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Morgen in de Volkskrant: een portret van Stadstekenaar 2026 Philip Akkerman! Journalist...","k":"workshop","s":"2026-08-05","e":null,"st":null,"et":null,"u":"nestruimte","c":"The Hague","co":"","p":"https://www.instagram.com/p/DbntBk5grSF/","x":"Morgen in de Volkskrant: een portret van Stadstekenaar 2026 Philip Akkerman! Journalist Anke Verbeek en fotograaf Sabine Rovers waren onlangs bij Nest voor Akkerman’s workshop tijdens de tentoonstelling Out of Office (Still Here). Ze spraken met Akkerman over zijn stadstekenaarschap en hoe hij te werk gaat in wat hij ‘zijn rotstad’ noemt. \n\nLees het volledige artikel via de link in onze bio! Foto’s: Sabine Rover.\n\nEN: Tomorrow in de Volkskrant: a portrait of city illustrator Philip Akkerman! Journalist Anke Verbeek and photographer Sabine Rovers came by at Nest during Akkerman’s workshop in the exhibition Out of Office (Still Here). They spoke about Akkerman’s role and view as a city illustrator, and how he get’s to work in what he refers to as ‘his damn city’. \n\nRead the full article through the link in our bio. Photos by Sabine Rover.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":1,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"💌 this is your sign to check your mailbox! 💌","k":"other","s":"2026-08-05","e":null,"st":null,"et":null,"u":"lhucalubbock","c":"Lubbock","co":"","p":"https://www.instagram.com/p/DbqoDpqO1dE/","x":"💌 this is your sign to check your mailbox! 💌\n\nWe’re excited for en Blanc coming up at the end of the month! What better way to spread the word than through snail mail? 📨\n\nReserve your spot today before they fill up! For more information please visit https://lhuca.org/get-involved/lhuca-en-blanc/ or reach out to marketing@lhuca.org 💌✨🍷","r":false,"b":"reserve","af":true,"so":false,"pd":"2026-08-05","ld":0,"dl":"2026-08-05","ds":"run closes","ap":false,"rel":true,"q":false},{"now":true,"t":"Join us this Wednesday, August 5, for a special artist talk by Paraguayan filmmaker Jua...","k":"talk","s":"2026-08-05","e":null,"st":"19:00","et":null,"u":"daad_artists","c":"Berlin","co":"","p":"https://www.instagram.com/p/DblKMWbDFMf/","x":"Join us this Wednesday, August 5, for a special artist talk by Paraguayan filmmaker Juanjo Pereira — @daad_artists Film Fellow 2026.\n\nNotes on the Jaguar\n\nTwo desks: images, sounds, words, and maps. Juanjo Pereira (Fellow Film 2026) and Julián Galay activate an archive that spans centuries—from the Jesuit missions to the present day—to trace the real and imaginary footprints of the jaguar, the King of America. Between geography and philosophy, historical chronicles and soundscapes, these materials interweave  to reveal another cartography of memory, territory, and myth.\n\nAugust 5, 7 pm\n\ndaadgalerie\nOranienstraße 161\n10969 Berlin\n\nAdmission free 🐆 \nIn English\n\nPhoto: @dianapfammatter","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-03","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Softer Hards – Queer Functional Training","k":"exhibition","s":"2026-08-05","e":null,"st":"18:30","et":"20:00","u":"vorspiel_qsv_berlin","c":"Berlin","co":"","p":"https://www.instagram.com/p/Dbkd9Y6DKVX/","x":"Softer Hards – Queer Functional Training\n\nSofter Hards @sportimpark_berlin\n\n––– ENGLISH BELOW –––\n\nWichtige Info zu unseren Terminen im August:\n\nIm August finden unsere Trainings nur an folgenden Tagen statt:\n\nMittwoch, 5. August, 18:30–20:00 Uhr\nMittwoch, 26. August, 18:30–20:00 Uhr\nDonnerstag, 27. August, 08:00–09:30 Uhr\n\nAlle anderen Termine müssen im August leider entfallen.\n\n📍 Hasenheide – Calisthenics-Parcours\nDie Teilnahme ist kostenlos und ohne Anmeldung möglich.\n\nVon Mai bis September sind wir wieder Teil von Sport im Park mit kostenlosen, inklusiven und queerfreundlichen Sportangeboten in Berliner Parks.\n\nSofter Hards ist mehr als ein Workout. Das Angebot verbindet funktionelles Training mit künstlerischen und reflexiven Impulsen und lädt dazu ein, Kraft, Körperkontrolle und Beweglichkeit zu stärken. Mit Übungen im Calisthenics-Parcours und kreativen Zugängen entsteht ein Raum, in dem Körper nicht nur trainiert, sondern auch neu erfahren werden können. Offen, queerfreundlich und unterstützend.\n\n––– ENGLISH –––\n\nImportant information about our August schedule:\n\nIn August, our training sessions will only take place on the following dates:\n\nWednesday, August 5, 6:30–8:00 pm\nWednesday, August 26, 6:30–8:00 pm\nThursday, August 27, 8:00–9:30 am\n\nUnfortunately, all other sessions in August are cancelled.\n\n📍 Hasenheide – calisthenics park\nParticipation is free and no registration is required.\n\nFrom May to September, we are once again part of Sport im Park, offering free, inclusive, and queer-friendly sports sessions in Berlin’s parks.\n\nSofter Hards is more than a workout. This session combines functional training with artistic and reflective impulses, inviting participants to build strength, body control, and mobility. Through exercises in the calisthenics park and creative approaches, it opens up a space where bodies are not only trained, but also experienced in new ways. Open, queer-friendly, and supportive.\n\nPhoto: @queermoments_fotografie_film\n\n#vorspielberlin #queerfunctionaltraining #sportimparkberlin","r":false,"b":"register","af":true,"so":false,"pd":"2026-08-03","ld":2,"dl":"2026-08-05","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"💫 Film in the Sculpture Garden is almost here!","k":"screening","s":"2026-08-05","e":null,"st":"08:00","et":null,"u":"themuseumofmodernart","c":"New York","co":"","p":"https://www.instagram.com/p/DboKJKfGuSK/","x":"💫 Film in the Sculpture Garden is almost here!\n\nEnjoy cinema under the stars with a series of open-air screenings in the Sculpture Garden. What better way to spend a summer night in the heart of the city? \n\n⭐ Aug 5: “Mississippi Masala” screens at 8:00 p.m, with an introduction by Mira Nair\n⭐ Aug 19: “Our Latin Thing” screens at 8:00 p.m.\n⭐ Sep 2: “Le Havre” screens at 8:00 p.m.\n\nLearn more and get your tickets at the link in the bio!\n\n—\nA screening in the Sculpture Garden, 2021. Photo: Rajendra Roy","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-04","ld":1,"dl":"2026-08-05","ds":"event start","ap":false,"rel":false,"q":true},{"now":true,"t":"@ctstategateway is honored to be hosting Maya Perry @mmmaya_ as our Artist in Residence...","k":"screening","s":"2026-07-06","e":"2026-08-06","st":"12:00","et":"15:00","u":"ctstategatewaygallery","c":"New Haven","co":"","p":"https://www.instagram.com/p/DaS6HWeHMFO/","x":"@ctstategateway is honored to be hosting Maya Perry @mmmaya_ as our Artist in Residence from July 6-August 6, 2026. \n\nMaya Perry spent her formative years as a drummer/singer in the experimental duo “Laila” and lives as a painter/performer. Her goal is to create sources of light where the internal and external can exist simultaneously and forgotten, repressed, and/or present experiences can come to the surface. She centers moments of contemplation, repetition, passivity and rest. Her practice oscillates from mediums and techniques such as painting to 16mm film to stop-motion animation, writing, sound, and performance. She is recently incorporating themes of looping, record-making and recording into her practice and wishes to highlight the Nurodivergent perspective in relation to time, space and experience. Maya recently graduated from the Yale University MFA program\nin Painting/Printmaking and has performed/exhibited internationally. \n\nJoin us, Thursday, July 23 + 30, 12:00-3:00pm for two FREE animation workshops. Maya will instruct participants on basics of stop motion and slide painting. No experience needed, light snacks provided. Please RSVP noe.jimenez@ctstate.edu\n\n2/4- Excerpt from animated film “Why Look at Animals?”(2023)\n\n1/4- “Mothing” Pastel on Paper (2023)","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-07-02","ld":4,"dl":"2026-08-06","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Meet Mickey Palima @mickey_palima — your K-Pop Dance workshop leader ٩(˃̶͈̀௰˂̶͈́)و","k":"performance","s":"2026-08-04","e":"2026-08-06","st":"18:00","et":"20:00","u":"kakilangarts","c":"London","co":"","p":"https://www.instagram.com/p/Da5cWajqXlt/","x":"Meet Mickey Palima @mickey_palima — your K-Pop Dance workshop leader ٩(˃̶͈̀௰˂̶͈́)و\n⠀\nBorn in the Philippines, Mickey trained in traditional folk dance before moving to the UK to study contemporary, ballet and jazz. He holds an MA in Dance Performance from Trinity Laban. \n⠀\nA lifelong K-Pop fan, Mickey’s workshops are high-energy and focus on musicality, clarity of movement and body rhythm — breaking down the details that make K-Pop choreography so exciting to dance. Open to young people between the ages of 12 and 16 — sign up now!\n\n🗓️ 4–6 August, 6–8pm\n📍 Wac Arts, Camden @wacarts \n🎟️ Free — link in bio","r":false,"b":"register","af":true,"so":false,"pd":"2026-07-17","ld":18,"dl":"2026-08-06","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Ahead of Mickey’s workshop tomorrow, we wanted to celebrate his practice. ✨","k":"workshop","s":"2026-08-04","e":"2026-08-06","st":"18:00","et":"20:00","u":"kakilangarts","c":"Edinburgh","co":"","p":"https://www.instagram.com/p/Dbky43iDsMm/","x":"Ahead of Mickey’s workshop tomorrow, we wanted to celebrate his practice. ✨\n⠀\nMickey Palima @mickey_palima is an openly queer dance artist from the Philippines, trained in Filipino folk dance, gymnastics and contemporary dance. Growing up in Devon, his work has always grappled with gender and Asian identity — questioning whether movement is masculine or feminine, or something that bridges both. He foregrounds the vulnerability and physical strength of the poetic body.\n⠀\nOne of his favourite creative tools is improvisation — moving and thinking at the same time, reacting in real time. It‘s where he finds absolute freedom. Dancing. Being human.\n⠀\n🧼 K-Pop workshop for young people aged 12–16 \n⠀\n🗓️ 4–6 August, 6–8pm\n📍 Wac Arts @wacarts \n🎟️ Free — link in bio\n⠀\nPartnered with Wac Arts, the programme is supported by Camden Council @love.camden \n⠀","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"Join us to celebrate the book launch for Happy Baby by JJ Pálka Johnson, featuring a pl...","k":"reading","s":"2026-08-06","e":null,"st":"19:30","et":null,"u":"montezpress","c":"London","co":"United Kingdom","p":"https://www.instagram.com/p/DbTPMHvDCEz/","x":"Join us to celebrate the book launch for Happy Baby by JJ Pálka Johnson, featuring a play reading performed by Daisy Bevan, Helen Pearson, EM Williams and Leo Wan and directed by Jess Edwards at FormaHQ 140 Great Dover St, London, SE1 4GW, Thursday 6 August, doors at 7:30pm for a prompt 8pm start. \n\n ‘Unflinching and tender, Happy Baby confronts the barriers queer people face in becoming parents. Full of grief and rapture, fury and sass, JJ’s writing sparkles with theory and experience: love, pain, sex, friendship.’ – Izabella Scott, author of The Bed Trick\n\n \nDaisy Bevan is a London based actor. Who was most recently in Lena Dunham’s Too Much.\n \nEM Williams (They/Them) is a nonbinary theatremaker & activist from the midlands. Credits include: After The Act (New Diorama/Traverse Theatre), BodyJob (Criptic Arts - Bristol Old Vic), Sherlock Holmes and The Poison Wood (Watermill Theatre), My Brilliant Friend (National Theatre), Captain Corelli’s Mandolin (Rose Kingston & West End), Dream (RSC).\n\nHelen Pearson is an actor who has worked extensively in theatre – repertory, the London fringe and the West End – as well as in film and television. She is best known for playing Frankie in Hollyoaks for 15 years. TV includes: Emmerdale, Eastenders, Attachments, Inspector Morse. Theatre includes: Book of Will, Calendar Girls and Blood Brothers.\n\nJess Edwards is a director and writer represented by Curtis Brown. Recent directing: Are You Watching? (Royal Court); Elephant (Bush Theatre / Menier); Conversations After Sex (Park); Hotter/Fitter (Soho). Jess is also a visiting lecturer at LAMDA, NSCD, Central, and Oxford University. Writing: Private View (Soho Theatre), published by Bloomsbury.\n \nLeo Wan theatre includes: Man and Boy, The Great Wave (National Theatre); The Mirror and the Light, As You Like It, The Taming of the Shrew (RSC); Chariots of Fire, The Good Person of Szechwan, Rock/Paper Scissors (Sheffield Theatres); Macbeth (ETT); Miss Julie (Chester Storyhouse). TV includes: Big Mood (Channel 4); Bridgerton (Netflix); Crashing (Big Talk).","r":false,"b":"doors","af":true,"so":false,"pd":"2026-07-27","ld":10,"dl":"2026-08-06","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"Join us on August 6 for “Counter-Occupation,” an evening of performance and conversatio...","k":"performance","s":"2026-08-06","e":null,"st":null,"et":null,"u":"asiaartarchiveinamerica","c":"Singapore","co":"","p":"https://www.instagram.com/p/DbEN3eZCRaQ/","x":"Join us on August 6 for “Counter-Occupation,” an evening of performance and conversation with artists Herdimas Anggara (@herdimas.anggara) and Chia Amisola. This program is presented in conjunction with “Prototypes for Alternative Power,” an online exhibition curated by Celine Wong Katzman (@rojakgirl) for the Singapore Art Museum.⁠\n⁠\nFollowing presentations by Anggara and Amisola, the artists will join Celine in conversation to address issues around occupation, improvisation, and resistance across technological and social infrastructures. Please note that RSVPs are required. Be sure to follow the link in our bio to secure your spot!","r":false,"b":"reserve","af":true,"so":false,"pd":"2026-07-21","ld":16,"dl":"2026-08-06","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"Do, 6.8.2026, 19 Uhr","k":"reading","s":"2026-08-06","e":null,"st":"19:00","et":null,"u":"kestner_gesellschaft","c":"Hannover","co":"","p":"https://www.instagram.com/p/DbanNuPjBCJ/","x":"Do, 6.8.2026, 19 Uhr\nBook-Launch: Anna K.E. — If You Smell Like A Garlic I Will Love You Even More \nmit Anna K.E. & Alexander Wilmschen\n\nDie Kestner Gesellschaft freut sich, das neue Künstler:innenbuch von Anna K.E. vorzustellen: „If You Smell Like A Garlic I Will Love You Even More“, erschienen im DISTANZ Verlag anlässlich der Ausstellungen „Dolorem Ipsum“ (2024) in der Kestner Gesellschaft und „For Our Parents“ (2024/25) im Haus Esters, Kunstmuseen Krefeld.\n\nAnna K.E. und Kurator Alexander Wilmschen blicken in einem gemeinsamen Video-Call auf die Ausstellungen zurück und sprechen über die Publikation. Diese widmet sich Anna K.E.s vielgestaltiger Praxis, die sich keinem einzelnen Medium zuordnen lässt, und versammelt Textbeiträge von Estelle Hoy, Sylvia Martin, Alexander Wilmschen sowie der Künstlerin selbst.\n\n Im Anschluss an den Book-Launch kann die Publikation vor Ort (38 Euro) erworben werden. Wein und Backwaren werden gereicht.\n\nAnna K.E. — „If You Smell Like A Garlic I Will Love You Even More“ ist im Buchladen der Kestner Gesellschaft erhältlich.\n___\nThu, 6.8.2026, 7 pm\nBook-Launch: Anna K.E. — If You Smell Like A Garlic I Will Love You Even More \nWith Anna K.E. & Alexander Wilmschen\n\nKestner Gesellschaft is pleased to present the new artist’s book by Anna K.E., “If You Smell Like A Garlic I Will Love You Even More”, published by DISTANZ Verlag on the occasion of the exhibitions “Dolorem Ipsum” (2024) at Kestner Gesellschaft and ”For Our Parents” (2024/25) at Haus Esters, Kunstmuseen Krefeld.\n\nIn a video call, Anna K.E. and curator Alexander Wilmschen will reflect on the exhibitions and discuss the publication. Dedicated to Anna K.E. ‚s multifaceted practice, which resists categorization within a single medium, the book brings together texts by Estelle Hoy, Sylvia Martin, Alexander Wilmschen, and the artist herself.\n\nFollowing the book launch, the publication will be available for purchase on site. Wine and pastries will be served.\n\nAnna K.E. — If You Smell Like A Garlic I Will Love You Even More is available (38 Euro) from the Kestner Gesellschaft Bookshop.\n\nFoto / Photo: DISTANZ Verlag; Dirk Rose","r":false,"b":null,"af":true,"so":false,"pd":"2026-07-30","ld":7,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Earlier this summer we gathered in Berlin, at @spore.initiative, to launch the ninth is...","k":"launch","s":"2026-08-06","e":null,"st":null,"et":null,"u":"e_flux","c":"Berlin","co":"","p":"https://www.instagram.com/p/DbtZIxLjTJk/","x":"Earlier this summer we gathered in Berlin, at @spore.initiative, to launch the ninth issue of e-flux Index.\n\nThis special issue gathers 92 artists, writers, architects, poets, psychoanalysts, filmmakers, educators, and theorists to take stock of the relationship between art and theory today. How have these two practices informed one another? Where has their relationship proved liberatory, and where has it become stultifying?\n\nThe evening brought into conversation artists Sung Tieu @sungtieu, Hiwa K @hiwakhiwa, and Oraib Toukan; artist and editor of e-flux Anton Vidokle; film and media scholar Elena Vogman; editor-in-chief of e-flux Criticism Ben Eastham @eastham_ben; and George MacBeth @neo_grg, editor of e-flux Index.\n\nIndex 9 is out now in print and for digital download. Link in bio.\n\nphotos: @ah_ogo","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"On the occasion of Rewire’s 15th festival edition, @____page_not_found____ and @rewiref...","k":"exhibition","s":"2026-08-06","e":null,"st":null,"et":null,"u":"rewirefestival","c":"The Hague","co":"","p":"https://www.instagram.com/p/DbskfA2CITV/","x":"On the occasion of Rewire’s 15th festival edition, @____page_not_found____ and @rewirefestival share the book ‘Further Listening. On Adventurous Music and Sound’, bringing together myriad artistic voices that have and continue to shape adventurous music and sound practices today.⁠\n⁠\nOrganised around four “filters,” the book speaks about infrastructures for adventurous music (Staging Sound); music technologies, instruments, and environmental listening (Instrumental Ecologies); exchanges across geographies and generations (Times and Territories); and speculative, critical, and forward-thinking listening practices (Further Listening).⁠\n⁠\nThe third chapter Times and Territories opens with an essay by @budha.chatto, followed by a conversation between @notajpeg and @lilianechlela, Robin van der Heijden, @joeriwoudstra, @annamosza and @cisbdegendt. @mayssajallad writes about local echoes in relation to her album, and @p.a.medvedeva and @andreaskuhne_ write about feedback improvisation and their work Facing the Spills. @golmati speaks with @pantearm, Cristina Cochior and @mekdad.yamen about archiving everyday sound and resonances of change, while @theempireisfragile and @nkariuki_ share voice messages across time zones. @zahrammm writes about sound as the primary medium for grief, and @gi.di.bi, @maya_al_khaldi and @sarounamusic exchange about reworking musical tradition as a form of resistance. It is designed by @jonacthan. ⁠\n⁠\nThe book is available through Rewire and Page Not Found, order via the 🔗 in bio.⁠\n⁠\nEdited by @katiatruijen, designed by @bdebaets @jim_kuehnel @dayna.casey @jonacthan @therodina, published by Page Not Found and Rewire.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"𝗦𝗘𝗣𝗧 𝟮–𝟭𝟯, Join us for 𝗪𝗜𝗦𝗘𝗠𝗔𝗡’𝗦 𝗡𝗘𝗪 𝗬𝗢𝗥𝗞!","k":"screening","s":"2026-08-06","e":null,"st":null,"et":null,"u":"uniondocs","c":"New York","co":"","p":"https://www.instagram.com/p/DbtRC3Vkrb0/","x":"𝗦𝗘𝗣𝗧 𝟮–𝟭𝟯, Join us for 𝗪𝗜𝗦𝗘𝗠𝗔𝗡’𝗦 𝗡𝗘𝗪 𝗬𝗢𝗥𝗞!\n\nMeet workshop lead, 𝗚𝗲𝗻𝗲𝘃𝗶𝗲𝘃𝗲 𝗬𝘂𝗲 [ @genevieveyue ]! Genevieve is an acclaimed film scholar, independent programmer, and Associate Professor of Culture and Media at The New School. She is co-editor of the Cutaways book series at Fordham University Press, a contributing editor to Film Comment, and a member of the October advisory board.\n\nHer revelatory @filmcommentmagazine essay Public Domains inspired this program. SWIPE through to read about why Wiseman disliked the term “documentary”!\n\nWe couldn’t be more thrilled to have her lead this one of a kind offering where participants will journey through Wiseman’s New York films, including Welfare, Hospital, High School II, Central Park, Racetrack, In Jackson Heights, and Ex Libris. Across screenings, close readings, seminars, guest conversations, and visits to the neighborhoods and institutions these films document, participants will trace Wiseman’s singular way of observing public life and consider how his attention to place, labor, and civic institutions continues to shape documentary practice today.\n\nPublic screenings of all nine of Wiseman’s New York films will take place across the city at some of its finest cinemas and cultural institutions, including @anthologyfilmarchives, @movingimagenyc, @spectaclenyc, @metrograph, \n@low_cinema, and @mayslesdocumentarycenter!\n\nGenevieve will be joined by an incredible lineup of filmmakers, critics, artists, and writers including 𝗦𝗵𝗮𝘄𝗻 𝗚𝗹𝗶𝗻𝗶𝘀 [ @mrglinis ], 𝗔𝗿𝗹𝗶𝗻 𝗚𝗼𝗹𝗱𝗲𝗻 [ @dffoakland ], 𝗖𝗼𝘂𝗿𝘁𝗻𝗲𝘆 𝗦𝘁𝗲𝗽𝗵𝗲𝗻𝘀 [ @courtcolt ], 𝗡𝗲𝗹𝗹𝗶𝗲 𝗞𝗹𝘂𝘇 [ @kluzkluz ], 𝗔𝗻𝗱𝗿𝗲́ 𝗥𝗼𝗯𝗲𝗿𝘁 𝗟𝗲𝗲 [ @andrerobertlee89 ], 𝗞𝗮𝗺𝗲𝗿𝗼𝗻 𝗔𝘂𝘀𝘁𝗶𝗻 𝗖𝗼𝗹𝗹𝗶𝗻𝘀, John Wilson and 𝗠𝗮𝗿𝗶𝗮𝗻𝗮 𝗠𝗼𝗴𝗶𝗹𝗲𝘃𝗶𝗰𝗵! \n\nWe’re grateful to community partners and institutions supporting our field trips including: @maketheroadn, @urbanomnibus, @abtofficial, #metropolitanhospital and more!\n\nJoin us for this singular opportunity to experience New York through the eyes of one of documentary cinema’s greatest observers. 𝗥𝗘𝗚𝗜𝗦𝗧𝗘𝗥 🔗 𝗜𝗡 𝗕𝗜𝗢","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Happy Birthday, Andy Warhol!","k":"exhibition","s":"2026-08-06","e":null,"st":null,"et":null,"u":"petermarinoartfoundation","c":"Southampton","co":"","p":"https://www.instagram.com/p/Dbtm1SPFvhM/","x":"Happy Birthday, Andy Warhol!\n\nToday we celebrate Andy Warhol's (1928-1987) 98th birthday. \n\nWorks by the influential artist currently on view at the Peter Marino Art Foundation include:\n\nElectric Chair, 1971\nAlexander the Great (Red), 1982\nElectric Chair, 1971\n\n#AndyWarhol #Warhol","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"In Memory (2025) filmmaker Vladlena Sandu (@vladlena_sandu) revisits her childhood to c...","k":"screening","s":"2026-08-06","e":null,"st":null,"et":null,"u":"icalondon","c":"London","co":"","p":"https://www.instagram.com/p/Dbfy0-NEg1R/","x":"In Memory (2025) filmmaker Vladlena Sandu (@vladlena_sandu) revisits her childhood to confront a haunting question: how is the cycle of violence that shapes children and passes through generations broken? \n\nSix-year-old Vladlena moves from Crimea to Grozny after her parents' divorce, as the Soviet Union collapses and the Chechen Republic fractures around her. War erupts – neighbours are murdered, her family targeted, Grozny turned to battlefield. After four years, her mother is gravely wounded and an attack forces Vladlena to flee, becoming a displaced person in Russia.\n\n🎞️ From 6 August\n🔗 Book tickets at link in bio\n\nOff-Circuit brings this generation's defining films to the big screen for the first time.\n\n#Memory #VladlenaSandu #OffCircuit #Screening #Film #ICA #London","r":false,"b":"tickets","af":true,"so":false,"pd":"2026-08-01","ld":5,"dl":"2026-08-06","ds":"event start","ap":false,"rel":false,"q":false},{"now":true,"t":"Marigold Santos shroud sitter (Rhacophorus rizali and epiphytes), 2026 acrylic, pigment...","k":"opening","s":"2026-08-06","e":null,"st":"18:00","et":"20:00","u":"patelbrowngallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbtifisOGuc/","x":"Marigold Santos shroud sitter (Rhacophorus rizali and epiphytes), 2026 acrylic, pigment, gesso on canvas\n\nIn shroud sitter (Rhacophorus rizali and epiphytes) (2026), a tree frog identified by Philippine national hero José Rizal while in exile, crowns a woven aswang figure. Adorned with orchids indigenous to the Philippines, the figure embodies the persistence of cultural memory. \n\n– Excerpt from exhibition text by Dr. Marissa Largo\n\n₊˚ʚ 🪷₊˚✧ ﾟ.\n\nNo Place opens tonight at Silverlens New York!\n\nFeaturing a new body of work by Marigold Santos, alongside works by Daniel Cabrillos Jacobsen, iris yirei hu, and Raya Simpao.\n\n₊˚ʚ 🐸₊˚✧ ﾟ.\n\nArtist Walkthrough with Dr. Marissa Largo | 5:30 PM\nOpening Reception | 6–8 PM\n\nCongrats Marigold! \n\n🐸₊˚ʚ 🪷₊˚✧ ﾟ.🐸 ₊˚ʚ 🪷₊˚✧ ﾟ.🐸 ₊˚ʚ 🪷₊˚✧ ﾟ.🐸\n#MarigoldSantos #NoPlace #SilverlensNewYork #ContemporaryArt #PatelBrown","r":false,"b":null,"af":true,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":true,"q":false},{"now":true,"t":"Today we’re featuring the exhibition “International Exhibition of Leather Forms”, a gro...","k":"workshop","s":"2026-08-06","e":null,"st":null,"et":null,"u":"mostmagazine__","c":"","co":"","p":"https://www.instagram.com/p/DbsRG6WDEIW/","x":"Today we’re featuring the exhibition “International Exhibition of Leather Forms”, a group show held in two venues of the Baltic Gallery of Contemporary Art (Słupsk) - Podgrodzie and Ustka - curated by Tomek Pawłowski-Jarmołajew @jarmolaev and Romuald Demidenko @romualddem .\n \nThe “International Exhibition of Leather Forms” contains two chapters that can be read independently. “Recorded in Leather”, on display in Słupsk, looks back at the workshops in Krzynia (Ogólnopolski Eksperymentalny Plener Graficzny „Zapis graficzny w skórze” / National Experimental Graphic Workshop “Graphic Record in Leather”, 1977–1989) within the context of the history of the region’s leather industry and the mythology of the local art community.\n\n“Metabolism and Fetish”, to be seen in Ustka, takes the form of a speculative workshop embedded in the present, providing a pretext for reflecting on ecological, ethical, psychological and cultural aspects of leather. This chapter includes works by contemporary artists addressing such themes as exploration of bodies and resources, speciesism and the mechanisms of desire.\n\nFeatured Artists include: Jan Baszak, Agnieszka Grodzińska, Katarzyna Górna, Wojciech Dada, Rafał Jakubowicz, Lukas Hofmann, Eszter Metzing, Hanna Nowicka, Przemysław Piniak, Cezary Poniatowski, Virginia Russolo, Janina Sabaliauskaitė, Dominik Styk, Karolina Wysocka, Paweł Żukowski\n\n@bgsw.slupsk\n#mostmagazine #cee #artculturepolitics #balticgalleryofcontemporaryart","r":false,"b":null,"af":false,"so":false,"pd":"2
