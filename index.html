","s":"2026-08-05","e":"2026-08-14","st":"11:00","et":null,"u":"hesse_flatow","c":"New York","co":"","p":"https://www.instagram.com/p/DbqTe9_iTft/","x":"✂️✂️⁠\n⁠\nPauline-Rose Dumas's solo exhibition \"A Rose is a rose\", is on view at the gallery's Tribeca through August 14. Summer hours are Monday - Friday 11am-6pm.⁠\n⁠\nImages: 1) Pauline-Rose Dumas, \"Portable Object - Big Scissors\", 2026. Forged steel, black patina, digital print on fabric and embroideries, 61 x 30 x 27 inches (154 x 76 x 68 cm). 2) Pauline-Rose Dumas, \"Portable Object - Small Scissors\", 2026. Forged steel, black patina, digital print on fabric and embroideries, 35 x 21 x 17 inches (88 x 53 x 43 cm). Courtesy of the artist and HESSE FLATOW. Photo: Jenny Gorman.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Egg tempera, with its luminous matte surface and capacity for subtle tonal layering, al...","k":"talk","s":"2026-08-06","e":"2026-08-14","st":"11:00","et":null,"u":"hesse_flatow","c":"New York","co":"","p":"https://www.instagram.com/p/Dbs4TtBjxyw/","x":"Egg tempera, with its luminous matte surface and capacity for subtle tonal layering, allows Mason Owens to capture light as something both fragile and enduring, flickering across walls, fields, and sky. His compositions hold the rhythm of lived time: shadows lengthen, daylight dilates, and thresholds between states - day and night, inside and outside, memory and presence - become perceptible. The result is a body of work that feels precise yet emotionally charged, offering moments of stillness in which attention itself becomes a devotional act.⁠\n⁠\nOur project room presentation of new paintings by our 2026 summer residents, Bix Archer and Mason Owens, is on view at the gallery's Tribeca location through August 14. Summer hours are Monday-Friday 11am-6pm.⁠\n⁠\nImages: Mason Owens, \"lots of books and a little bed\", 2026. Egg tempera on linen wrapped panel, 10 x 8 inches (25 x 20 cm). Mason Owens, \"a painter's shadow on the sand\", 2026. Egg tempera on linen wrapped panel, 8 x 6 inches (20 x 15 cm). Courtesy of the artist and HESSE FLATOW. Photo: Jenny Gorman.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Opening Friday, June 12 from 6-8pm, Artists Space presents Everything Must Be Returned,...","k":"exhibition","s":"2026-06-12","e":"2026-08-15","st":"18:00","et":"20:00","u":"artistsspace","c":"New York","co":"","p":"https://www.instagram.com/p/DY0LiIpiU4g/","x":"Opening Friday, June 12 from 6-8pm, Artists Space presents Everything Must Be Returned, the first New York institutional solo exhibition by multidisciplinary artist Shani Strand (b. 1995). Through her work, Strand weaves culturally inscribed materials and practices to examine how the visible—objects, architectures, and social performances—operate as a metonym for the invisible: ghosts, infrastructure, and history. For Artists Space, Strand has produced an immersive installation including a newly commissioned film and sculptures that gather materials that bear the residue of historical encounter and entanglement.\n\nThe show runs from June 12 - August 15. \n\nImages:\nShani Strand, Duppy (Don’t Wait for Karma), 2024\n\nShani Strand, R.I.P. He Deserves It, 2026\n\nShani Strand, R.I.P. He Deserves It, 2026","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-26","ld":17,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"If you are in London, join us to celebrate Ian Waelder's solo exhibition, insert, at Mo...","k":"exhibition","s":"2026-07-16","e":"2026-08-15","st":"20:00","et":null,"u":"diez.gallery","c":"London","co":"United Kingdom","p":"https://www.instagram.com/p/Da2emHyMhMT/","x":"If you are in London, join us to celebrate Ian Waelder's solo exhibition, insert, at Modern Art. \n\nThe opening is tonight from 6 to 8pm, and the exhibition remains on view until August 15th.\n\n@ianwaelder\n@stuartshavemodernart\n\nParallel (Lurking), 2026\nPlotter print on canvas with oil paint and acrylic paint, marker, covered with a layer of raw linen with stains of oil, detergent, glue, marker, pencil, glued tissue paper, and air-dry porcelain\n\n245 x 195 cm (96 1/2 x 76 3/4 in)\n\nPhoto: Modern Art\nCourtesy the artist, diez, Amsterdam and Modern Art\n© Ian Waelder","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"If you’re in London! I’m opening today a solo show at Modern Art @stuartshavemodernart ...","k":"exhibition","s":"2026-07-16","e":"2026-08-15","st":null,"et":null,"u":"ianwaelder","c":"London","co":"","p":"https://www.instagram.com/p/Da2h7jcje-U/","x":"If you’re in London! I’m opening today a solo show at Modern Art @stuartshavemodernart in Bennet Street, together with the group show with works by Kate Mosher Hall, Hanna Hur and Beaux Mendes. Very happy if you visit. The exhibitions will be on view until August 15th. Massive thank you for all the help and support to Stuart, Rob, Clément, Kirk & install team, Ashley & each member of the team at the gallery, & Diego/diez 🫶","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-16","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"space in between","k":"talk","s":"2026-07-24","e":"2026-08-15","st":null,"et":null,"u":"one_artcollection","c":"","co":"","p":"https://www.instagram.com/p/DbK1_DgsvBs/","x":"space in between \none.voice x Ian Waelder \nIn the new episode of one.voice, Fabian is in conversation with artist @ianwaelder. \nIan‘s artistic practice explores memory and trace by connecting archival histories, language, and personal biography. Working across photography, sculpture, sound, and installation, he uses everyday materials to reflect on what remains undocumented and to question the conditions and politics of memory formation.\nWe discuss several of his exhibitions, his relationship to his own biography, the construction of spaces within spaces, and exhibitions that function differently depending on the time of day. We also talk about the struggles of being a young artist, both during art school and in the years that follow.\n\nIan‘s show “insert” is on view at @stuartshavemodernart until August 15. \n\nThe conversation is in English.\n\n🔗 Link in Bio!\n\nAvailable on Spotify, Apple Podcasts and Amazon Music. \n\nPhoto by @eikewalkenhorst \n\n#one. #ianwaelder","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-24","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Our group exhibition Love and Friendship is now on view in NYC, Monday to Friday, throu...","k":"exhibition","s":"2026-07-29","e":"2026-08-15","st":null,"et":null,"u":"afternoonprojects","c":"New York","co":"","p":"https://www.instagram.com/p/DbZDKgyJ5Nr/","x":"Our group exhibition Love and Friendship is now on view in NYC, Monday to Friday, through August 15th. Dm us to schedule an appointment. We would love to see you! \n\nPictured:\n\nHelen Shu\n\nBubbles, 2025\rMixed media collage on linen\r9” x 12”\n\n#HelenShu\n#afternoonprojects\n@uhsneleh","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Ian Waelder’s solo exhibition insert is on view at Modern Art in London until August 15...","k":"exhibition","s":"2026-07-31","e":"2026-08-15","st":null,"et":null,"u":"diez.gallery","c":"London","co":"United Kingdom","p":"https://www.instagram.com/p/Dbd1ZnTjIel/","x":"Ian Waelder’s solo exhibition insert is on view at Modern Art in London until August 15, do not miss if you visit this Summer!\n\nConceived as a site-responsive environment, this presentation is centered on three large-scale works first encountered from behind. Together, they form a dividing wall and makeshift corridor bisecting the space, a passage that acts much like an insert in a book, a separate, partial layer interrupting the whole.\n\nThis show is composed by his latest works to date, made during his last term at the Stiftung Laurenz-Haus one-year residency in Basel\n\n@ianwaelder @stuartshavemodernart @information_art","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“insert” opened at Modern Art, Bennet Street in London @stuartshavemodernart a few week...","k":"exhibition","s":"2026-08-01","e":"2026-08-15","st":null,"et":null,"u":"ianwaelder","c":"London","co":"","p":"https://www.instagram.com/p/DbgnxSIDRuU/","x":"“insert” opened at Modern Art, Bennet Street in London @stuartshavemodernart a few weeks ago and is still on view until August 15!\n\nPictured:\nBreather (Insert), 2026\nAir-dry porcelain, cardboard shoe inserts, glued tissue paper, pencil, 12.5 x 10 x 22 cm\n\n@stuartshavemodernart \n\n@information_art_ \n@clement.raveu \n@diegodp \n\nPhotos: Modern Art\nCourtesy the artist, diez, Amsterdam and Modern Art","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This year’s Locarno (@filmfestlocarno) lineup brings together bold voices from mainland...","k":"screening","s":"2026-08-05","e":"2026-08-15","st":null,"et":null,"u":"sinokultur","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbkgvIjjxAz/","x":"This year’s Locarno (@filmfestlocarno) lineup brings together bold voices from mainland China, Hong Kong and Taiwan, with films that move between mythology, animation, poetry and experimental cinema. Here are our top Chinese-language and China-related festival picks:\n\nThe House on the Moon《明月共此时》 — Nelson Yeo (99 min)\nInternational Competition, competing for the Golden Leopard\nA dazzling blend of wuxia, science fiction and Chinese mythology inspired by the legend of Chang’e and Hou Yi. Co-produced by Singapore, Taiwan, Germany and Indonesia, it is also notable as Singapore’s first virtual-production feature film. Starring arthouse icon Lee Kang-sheng 李康生, alongside Akira Huang and Harry Chang.\n\nMagic Atlas《魔法星图》 — Sun Xun (@sun__xun) 孙逊 (85 min)\nThe acclaimed Chinese artist and animator transforms his surreal visual universe into cinema, following a magician whose arrival in the isolated coal empire of Luosha sparks fear, myth and rebellion. Developed over more than a decade, the film extends Sun’s signature woodcut-animation style and East Asian allegorical imagery.\n\nThe Wind, One Brilliant Day《风，在明媚的一天》 — Ben Rivers (7 min)\nA poetic miniature featuring Tang Wei 汤唯, whose luminous screen presence makes this one of the standout China-related events of Locarno 2026.\n\nAlready Happened《事后》— Hao Zhou (@_haozhou_) 周豪 (18 min)\nA US–China co-production that moves between Chinese and English while exploring identity and memory through a sharply observed short-film form.\n\nAs a Cure《砂之歌》 — Dorothea Sing Zhang (@dorotheasingzhang) 张馨文 (22 min)\nA China–UK co-production introducing an exciting new voice in contemporary Chinese-language cinema and international collaboration.\n\nThe Human Surge 3 — Eduardo Williams (121 min)\nAn adventurous international experiment involving collaborators from Taiwan and Hong Kong, expanding the festival’s conversation around contemporary Sinophone and transnational cinema.\n\nFrom ancient myth and woodcut animation to poetic shorts and radical experimentation, this selection offers a vivid snapshot of today’s Chinese-language cinema: restless, imaginative and impossible to confine to a single category.\n\nLocarno Film Festival, 5–15 August 2026","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"🚨 RECEPTION TWO THIS THURSDAY AUGUST 6! Pioneer Sq Art Walk 5-8pm","k":"exhibition","s":"2026-08-06","e":"2026-08-15","st":"17:00","et":"20:00","u":"specialist_sea","c":"Seattle","co":"","p":"https://www.instagram.com/p/DbosXpFDyNm/","x":"🚨 RECEPTION TWO THIS THURSDAY AUGUST 6! Pioneer Sq Art Walk 5-8pm \n\nStop by to see Madison Donnelly’s (@madsdonnelly) show GROOMING before it closes August 15!\n\nIf you can't make it on Thursday, you can email specialist.gallery@gmail.com to set up an appointment to view the work through the run of the show! \n\nImage caption: Red queen to b5 (Detail), Brass lipstick tubes, lipstick, oak veneer side table, Dust Bunny I, 2026. Image Courtesy of Jueqian Fang (@everythingtimestudio) \n\nUpdated Show Text: \n\nGROOMING presents new sculptures by Madison Donnelly. \n\nAnimals groom themselves, we groom our domesticated animals, we domesticate ourselves through grooming, and we are groomed by a rigid system that feels so deeply wrong and unnatural that we spew psychically at its seams. How much agency is truly available to us in a world structured by a handful of pedophilic oligarchs? Much like chess, strategy is available to us only within a rigid set of rules for domination and war.\n\nRobert Greene outlines 48 strategies for gaining and maintaining power in his troubling guide to Machiavellianism, ‘The 48 Laws of Power’. The first law, ‘Never Outshine the Master,’ reads as follows:\n\n“Always make those above you feel comfortably superior. In your desire to please and impress them, do not go too far in displaying your talents or you might accomplish the opposite- inspire fear and insecurity. Make your masters appear more brilliant than they are and you will attain the heights of power.”\n\nThough Robert describes intentional submission with the end goal of domination, how do feminized people and children internalize this law as a means of survival rather than of manipulation? I’m interested in the triangulation of desire, safety, authenticity and submission as integral parts to self-preservation within a feminized or vulnerable body. In Red queen to b5, the red queen is one move from checkmate - and it is her turn…\n\nRead more on our website: https://specialist.gallery/ \n\n♟️ 🤍 🐰 🤍 🐎\n\nGROOMING was funded by the 2026 Open 4Culture grant (@kc4culture)\n\nRed queen to b5, Brass lipstick tubes, lipstick, oak veneer side table, Dust Bunny I, 2026. Image Courtesy of Jueqian Fang @ever","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-04","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Our group exhibition Love and Friendship continues through August 15th. We are open by ...","k":"exhibition","s":"2026-08-07","e":"2026-08-15","st":"17:00","et":null,"u":"afternoonprojects","c":"New York","co":"","p":"https://www.instagram.com/p/Dbvs96XnKyk/","x":"Our group exhibition Love and Friendship continues through August 15th. We are open by appointment. 12 to 5 pm, Monday to Friday \n\nPictured:\n\nMegan Mi-Ai Lee\rMore Action, 2026\rEpoxy, foam, enamel paint\r5 ¼”x 1” x 1”\n\n#MeganMiAiLee\n#afternoonprojects\n@meg.miai","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"THE EARTH BENEATH OUR FEET","k":"talk","s":"2026-05-01","e":"2026-08-16","st":"15:00","et":null,"u":"fotografiskcenter","c":"Copenhagen","co":"","p":"https://www.instagram.com/p/DXjx6YACKf2/","x":"THE EARTH BENEATH OUR FEET\n \nEXHIBITION PERIOD\n1 May – 16 August 2026\n \nThe exhibition ”The Earth Beneath Our Feet” explores humanity’s relationship and connection to Danish landscape and nature. The exhibition brings together works by Christina Capetillo/ @christinasofiacapetillo, one of Denmark’s most prominent visual artists within the field of landscape photography, and the award-winning photographers Mathias Svold/ @mathiassvold and Ulrik Hasemann/ @ulrik_hasemann . The exhibition presents works relating to the coast and the water – the sea and the fjords – and the wide-open spaces as well as to the forest and the denser landscapes with thickets and lush vegetation.\n \nThe exhibition is supported by the Danish Arts Foundation, the Augustinus Foundation, the Grosserer L. F. Foghts Fond and Politiken-Fonden.\n \nEVENT PROGRAMME\nIn connection with the exhibition an artist talk will be held in collaboration with Art Matter Festival on June 2 from 4.30-5.15pm featuring Christina Capetillo, Mathias Svold and Ulrik Hasemann where you can learn more about the exhibition and the works. Thursday 7 May and 13 August from 5-5.30pm guided exhibition tours will take place. The tours will be held in Danish and participation is free after paid entrance to the exhibition. \n \nFor further information and opening hours please visit www.fotografiskcenter.dk\n\nImage credit: Christina Capetillo","r":false,"b":null,"af":false,"so":false,"pd":"2026-04-25","ld":6,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Nest is de hele zomer open tot en met 16 augustus. Check hier het programma en de link ...","k":"exhibition","s":"2026-06-05","e":"2026-08-16","st":"12:00","et":null,"u":"nestruimte","c":"The Hague","co":"","p":"https://www.instagram.com/p/DZMmDGSAuvn/","x":"🥵\n\nNest is de hele zomer open tot en met 16 augustus. Check hier het programma en de link in onze bio voor meer info.\n\nNest is open op: Do/Vr: 12:00 – 19:00 Za: 13:00 – 20:00 Zo: 13:00 – 18:00\n\nEN\n\nNest will be open the entire summer, until August 16th. Check our public programmer here and through the link in our bio!\n\nNest is open on: Thu/Fri: 12:00 – 19:00 Sat: 13:00 – 20:00 Sun: 13:00 – 18:00","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-05","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"𝘈𝘬𝘪𝘯𝘴𝘢𝘯𝘺𝘢 𝘒𝘢𝘮𝘣𝘰𝘯: 𝘚𝘰𝘶𝘭 𝘚𝘦𝘴𝘴𝘪𝘰𝘯𝘴 is the first survey exhibition in New York dedicated to...","k":"workshop","s":"2026-06-16","e":"2026-08-16","st":"12:00","et":"18:00","u":"sculpturecenter","c":"New York","co":"","p":"https://www.instagram.com/p/DZpu_odEZhw/","x":"𝘈𝘬𝘪𝘯𝘴𝘢𝘯𝘺𝘢 𝘒𝘢𝘮𝘣𝘰𝘯: 𝘚𝘰𝘶𝘭 𝘚𝘦𝘴𝘴𝘪𝘰𝘯𝘴 is the first survey exhibition in New York dedicated to artist, educator, and organizer Akinsanya Kambon. ⁠\n⁠\nAt SculptureCenter, over ninety of the artist's intricately crafted ceramics are on view, organized into seven “sessions” that each consider recurring themes in his practice. ⁠\n⁠\nPre-colonial and Primordial Time explores African philosophies, cosmologies, and spiritual practices; Thrones of Resistance features kings, queens, priests, and priestesses (Obas, Pharaohs, and Mais) who led their people through adversity, particularly during early colonial encounters; The Middle Passage addresses the forced displacement and transatlantic transportation of enslaved Africans; Captivity and Oppression depicts the violence and dehumanization of slavery in the United States; Rebellion and Uprising highlights the artist’s depictions of revolt and defiance; War and Imperialism reflect the artist’s critiques of imperial power, informed by his experience of combat; and Reverence and Remembrance focuses on spiritual practices of the African diaspora.⁠\n⁠\nThis two-venue exhibition continues at the Center for Art, Research and Alliances (CARA), where Kambon’s expansive practice is foregrounded through a selection of works on paper, paintings, wall plaques, and archival materials that surface stories of oppression, resistance, and spirituality.⁠\n⁠\n𝘚𝘰𝘶𝘭 𝘚𝘦𝘴𝘴𝘪𝘰𝘯𝘴 is on view until Aug 16, 2026. This weekend, SculptureCenter will be open on Juneteenth (6/19) from 12–6pm! While CARA will be closed in observance of the federal holiday, they reopen Saturday (6/20) to host Black Study in Action: Education for Liberation with Sojourners for Justice Press. The public workshop is the first of three planned in dialogue with 𝘚𝘰𝘶𝘭 𝘚𝘦𝘴𝘴𝘪𝘰𝘯𝘴. RSVP encouraged. ⁠\n⁠\nMore info through the 🔗 in our bio.⁠\n⁠","r":true,"b":"rsvp","af":true,"so":false,"pd":"2026-06-16","ld":0,"dl":"2026-08-16","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"@daad_artists is delighted to present ‘Two new books, two new works plus an old one for...","k":"exhibition","s":"2026-06-19","e":"2026-08-16","st":"19:00","et":null,"u":"daad_artists","c":"Berlin","co":"","p":"https://www.instagram.com/p/DY6nHZ0DB75/","x":"@daad_artists is delighted to present ‘Two new books, two new works plus an old one for good measure’, a solo exhibition by Visual Arts Fellow 2024/25 Anup Mathew Thomas, on view from 19 June to 16 August 2026 at daadgalerie. The exhibition opens on Thursday, 18 June. \n\nWith ‘Two new books, two new works plus an old one for good measure’, Anup Mathew Thomas presents, for the first time to audiences in Berlin, a concise yet compelling selection of his work. Bringing together works developed over the last two decades alongside new ones produced during his DAAD Artists-in-Berlin Program fellowship, the exhibition at daadgalerie explores what happens when an unapologetically hyperlocal artistic practice — such as that of Thomas — is transplanted into a different context, and how such a body of work positions itself within it. \n\nAnup Mathew Thomas’s works dwell at the threshold of documentation and fact, and between fiction and fable. They draw their persuasive and imaginative power from tensions between text and image, observation and interpretation, calling into question the status of photographic images and journalistic writing as means of conveying truth or knowledge about the world. What creeps in at the gaps between reporting and storytelling is a space of ambiguity that shifts how we see the familiar and ordinary, reframing the contingencies and uncertainties that shape everyday life—its social norms, customs, traditions, and myths.\n\n‘Two new books, two new works plus and old one for good measure’\nWith works by @anupmathewthomas \nCurated and produced by @raisa.galofre and @malteroloff \n\nExhibition runtime: 19.06 – 16.08.2026\nOpening: 18.06.2026, 7 PM\n\ndaadgalerie\nOranienstraße 161\n10969 Berlin - Kreuzberg\n\nImage: Anup Mathew Thomas, ‘Apparitions’ (detail) 2026\nDesign: @klimaite_klimaite","r":false,"b":null,"af":false,"so":false,"pd":"2026-05-29","ld":21,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"In Hsu Che-Yu's 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔, a dialogue between a performer and a scriptwriter unfol...","k":"exhibition","s":"2026-06-28","e":"2026-08-16","st":null,"et":null,"u":"queenswaytelevision","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DaIrhizEhC5/","x":"In Hsu Che-Yu's 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔, a dialogue between a performer and a scriptwriter unfolds across the video, referencing two historical events at a Taiwanese zoo.\n\n3D-scanned imagery of the zoo and its taxidermy studio accompanies the conversation, with the performer appearing across different scenes with various gestures.\n\nLearn about how the work explores the relationship between ‘gestures’ and ‘horrors’ by catching the video at Queensway Television, on view from now till 16 Aug 2026, opens daily from morning till night.\n\n@hsu__che_yu","r":true,"b":null,"af":false,"so":false,"pd":"2026-06-28","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"“Anup Mathew Thomas’s recently released book ‘Native ball’ (2025) co-published by @reli...","k":"reading","s":"2026-06-28","e":"2026-08-16","st":"12:00","et":"19:00","u":"daad_artists","c":"Berlin","co":"","p":"https://www.instagram.com/p/Dbs61jeDLKP/","x":"“Anup Mathew Thomas’s recently released book ‘Native ball’ (2025) co-published by @reliablecopy and the DAAD Artists-in-Berlin Program, brings together almost a decade of the artist’s work in and around his native Kerala. Within this context, the series ‘View from Conolly’s plot’, ‘Hereinafter’, ‘Native ball and revisions’ and ‘Scene from a wake’ offer a substantial overview of his broader artistic practice and central concerns. \n\n(...) Through the book Native ball, visitors engage with a central aspect of Thomas’s practice, which is working with text. (...) Text not only indirectly inspires and informs the artist’s work with images, it also becomes part of the works themselves. In his practice there is never just an either (image) or (text) but always a conscious ‘and’. The space of this ‘and’ between different levels of assigned meanings and possible interpretations between text and images, offers no simple explanation or abstract conceptualisation of a work, but compels us to look, read, and look again.”*\n\nVisitors are invited to explore this book in the reading area beside the gallery’s front window. The essay ‘How native is the Native ball?’ by George Jose and published in English and German in the exhibition’s booklet offer both a commentary on and an introduction to Thomas’s ‘Native ball’, establishing relations within the compilation and situating each series in its context of origin – Kerala. \n\n*Excerpt from the curatorial text “Going through Anup Mathew Thomas’s list” by Raisa Galofre and Malte Roloff included in the exhibition’s booklet.\n\nNative ball (2025)\nBook, 248 pages\nEnglish and Malayalam\nBook design: Nihaal Faizal \n\nTwo new books, two new works plus an old one for good measure\nWith works by @anupmathewthomas \n\ndaadgalerie\nOranienstraße 161\nBerlin - Kreuzberg\n\nTuesday – Sunday\n12 - 7 PM\n\nOn view until August 16, 2026. \n\nPhoto credits:\n1.Mariam Suhail / BKP\n2, 3, 5 - 9: Courtesy by the artist \n10. Anup Mathew Thomas in conversation with George Jose at daadgalerie. Berlin, June 28, 2026.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":-39,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The simplest gestures often carry the heaviest trauma.","k":"exhibition","s":"2026-07-06","e":"2026-08-16","st":null,"et":null,"u":"queenswaytelevision","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/Dac1uQbSNzo/","x":"The simplest gestures often carry the heaviest trauma. \n\nFollow the conversation in Hsu Che-Yu's 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔 to learn about how the artist explores the relationship between ‘gestures’ and ‘horrors’, by referencing two historical events at a Taiwanese zoo that happened during the World War II. \n\nWatch the work now at Queensway Television, on view daily from morning till night until 16 Aug 2026.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Just a few weeks after opening, Salad Days: Primary Information continues to offer a we...","k":"screening","s":"2026-07-07","e":"2026-08-16","st":"12:00","et":"17:00","u":"carpenter_center_harvard","c":"Cambridge","co":"","p":"https://www.instagram.com/p/DafzM1GnOpf/","x":"Just a few weeks after opening, Salad Days: Primary Information continues to offer a welcoming place to escape the heat, slow down, and explore.\n\nBrowse artist books, settle into the reading room, and catch our film of the week in an exhibition that transforms the gallery into a space for reading, gathering, and discovery.\n\nOpen Thursday–Sunday, 12–5 pm\nOn view through August 16\n\n🔗 Link in bio for exhibition details, upcoming public programs, and the full screening schedule.\n\nInstallation images by Mel Taing.","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Opening Saturday, July 18, 2:00–6:00 PM","k":"exhibition","s":"2026-07-18","e":"2026-08-16","st":"14:00","et":"18:00","u":"ptolemy.world","c":"Glendale","co":"","p":"https://www.instagram.com/p/DaxlJNgDr9S/","x":"Opening Saturday, July 18, 2:00–6:00 PM\n\n“Paragon Park Observatory”\n\nA group exhibition featuring over 35 artists based in New York.\n\nThe exhibition will be on view from July 18–August 16. More information will be announced soon; please contact info@ptolemy.world for any inquiries.","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-14","ld":4,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Hsu Che-Yu's 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔 continues to be on view at Queensway Television. Referencin...","k":"exhibition","s":"2026-07-21","e":"2026-08-16","st":null,"et":null,"u":"queenswaytelevision","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbDoeyVEtc3/","x":"Hsu Che-Yu's 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔 continues to be on view at Queensway Television. Referencing two historical events at a Taiwanese zoo that happened during World War II, the work follows a dialogue between a scriptwriter and a performer.\n\nRendered primarily via 3D-scanned imagery, the scenes constructed are simultaneously staged and real, recreating actual sites of the zoo and the taxidermy studio in an uncanny manner accompanied by the conversation between the scriptwriter and the performer. \n\nLook into the spaces between what we perceive and what we are led to believe within the video work 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔 now at Queensway Television, on view daily from morning to night until 16 Aug 2026.\n\n@hsu__che_yu","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This week, our John R. & Barbara Robinson Family Director, Kate McNamara, recommends: T...","k":"exhibition","s":"2026-07-21","e":"2026-08-16","st":"12:00","et":"17:00","u":"carpenter_center_harvard","c":"Cambridge","co":"","p":"https://www.instagram.com/p/DbEBdNanB_G/","x":"This week, our John R. & Barbara Robinson Family Director, Kate McNamara, recommends: Tom Burr: Torrington Project, edited by Blake Oetting.\n\nTom Burr: Torrington Project documents the artist's three-year occupation of a repurposed nineteenth-century factory in Torrington, Connecticut, where Burr transformed the building into a \"living archive\"—part studio, part exhibition, part gathering space. Bringing together more than ninety works spanning his career alongside performances, conversations, and collaborations with fellow artists, the project challenged conventional distinctions between art and architecture, exhibition and production, memory and making. Richly illustrated with photographs, archival materials, and newly commissioned essays, the publication extends the life of the project beyond its physical site.\n\n\"Tom Burr has long been an artist whose work I return to for the way it thoughtfully weaves together architecture, institutional critique, queer histories, and lived experience. What I love most about Torrington Project is that it isn't simply a publication documenting an exhibition—it becomes an extension of the project itself, asking how artworks continue to evolve through place, community, and time. It's especially meaningful to see an essay by our own David Joselit, art historian and Chair of Harvard's Department of Art, Film, and Visual Studies, whose writing offers another thoughtful entry point into Burr's expansive practice.\" — Kate McNamara\n\nBrowse Kate's selection, along with hundreds of artist books and publications from Primary Information, during Salad Days at the Carpenter Center.\n\nSalad Days: Primary Information is on view through August 16.\nOpen Thursday–Sunday, 12–5pm","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-21","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"As part of Fotografisk Center’s current exhibition The Earth Beneath Our Feet, you can ...","k":"exhibition","s":"2026-07-23","e":"2026-08-16","st":null,"et":null,"u":"fotografiskcenter","c":"Copenhagen","co":"","p":"https://www.instagram.com/p/DbI_axXCAEc/","x":"As part of Fotografisk Center’s current exhibition The Earth Beneath Our Feet, you can experience a collection of works by Christina Capetillo from several different series, spanning the years 1999 to 2026. For more than 25 years the contemporary landscape has been her area of research, understood as the overriding cultural condition, the new nature and the human-made landscape that has emerged as nature and the resources of the Earth have become increasingly depleted and taken over by human activity, intervention and changes.\r\n\r\nCapitillo’s book An Everchanging Monument is currently for sale at Fotografisk Center’s bookshop. \r\n\r\nThe exhibition runs until August 16, 2026.\n\nImage credit: @christinasofiacapetillo \n\n#photobooks #contemporayart #contemporaryphotography #naturephotography #natureandculture","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Free admission!","k":"exhibition","s":"2026-07-29","e":"2026-08-16","st":null,"et":null,"u":"fotografiskcenter","c":"Copenhagen","co":"","p":"https://www.instagram.com/p/DbVz88WiM2g/","x":"Free admission!\r\n\r\nAt Fotografisk Center we offer free admission on the last Wednesday of each month. This means on July 29 you may experience the current exhibition The Earth Beneath Our Feet free of charge. \r\n\r\nThe exhibition is bringing together works by Christina Capetillo, one of Denmark’s most influential visual artists within landscape photography, and Mathias Svold and Ulrik Hasemann, award-winning photographers who, over several years, together created the works Kystland (Coastal Land) (2019) and Gennem Øjetræet (Through the Eye Tree) (2023).\r\n\r\nThe exhibition runs until August 16, 2026.\r\n\r\nPlease note: free admission does not apply during exhibition changes, as Fotografisk Center will be closed to the public. \r\n\r\nInstallation images: Troels Jeppe\r\n\nWorks by: @christinasofiacapetillo @mathiassvold @ulrik_hasemann \n\n#fotografiskcenter #copenhagen🇩🇰 #artphotographer #contemporaryart #landscape","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-28","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Final few weeks to see Rae-Yen Song 宋瑞渊's exhibition •~𝘛𝘜𝘈~• 大眼 •~𝘔𝘈𝘒~• at @glasgowtram...","k":"exhibition","s":"2026-07-31","e":"2026-08-16","st":null,"et":null,"u":"filmvidumbrella","c":"Glasgow","co":"","p":"https://www.instagram.com/p/DbdONPUD3Fu/","x":"Final few weeks to see Rae-Yen Song 宋瑞渊's exhibition •~𝘛𝘜𝘈~• 大眼 •~𝘔𝘈𝘒~• at @glasgowtramway ✨\n\n•~𝘛𝘜𝘈~• 大眼 •~𝘔𝘈𝘒~• is an ambitious new multimedia exhibition transforming Tramway’s vast gallery space into a sub-aquatic world shaped according to the ancestral logics of the Song family, which serves simultaneously as spectacle, memorial and refuge. Film and Video Umbrella commissioned eight new digital animations for the exhibition titled •~𝘨𝘩𝘰𝘴𝘵𝘴~• (𝘴𝘰𝘯𝘨~𝘹𝘪𝘢𝘯). @raeyensong\n\n🎟 Free entry\n📆 Until 16 August 2026\n🔗 Find out more on our website under 'What's On', link in bio!\n\n--\n\nA Tramway co-commission with @fact_liverpool and Film and Video Umbrella with support from @uofglasgow and @creativefstone. Funders @creativescotland, @aceagrams, @henrymoorefdn_grants.\n\n📸 Keith Hunter\n\n#FVU #filmvidumbrella #filmandvideoumbrella #artistsmovingimage #raeyensong","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"LE PARTI IMAGINAIRE @gdl_525","k":"performance","s":"2026-07-31","e":"2026-08-16","st":"17:00","et":"20:00","u":"sophieserber","c":"Amsterdam","co":"","p":"https://www.instagram.com/p/DbXnMs3oMM9/","x":"LE PARTI IMAGINAIRE @gdl_525 \nJuly 31 - August 16 2026\nopening Friday July 31st, 5-8 pm\nOn appointment until August 16th\n\nT.A DÉCOR\nWERNER DELMONT\nCHRIS KORDA\nDAN MITCHELL\nKEN OKIISHI\nPAT SCULL\nSOPHIE SERBER\n\n\"Animation might be considered as the transformation of static, two dimensional images or objects into motion, the illusion of life or abstract rhythm, the exploitation of the possibilities of such process - fantasy, making the impossible imaginable.\n\nLE PARTI IMAGINAIRE brings together works by T.A Décor with Jette Loona Hermanis and Eric Lotraine, Werner von Delmont, Chris Korda, Ken Okiishi, Dan Mitchell, Pat Scull, Sophie Serber that occupy the televisual and its physical manifestation – performance television, magazines, software, film, pornography, music, and fiction - tracing the remodeling and (re)animation of society as an entertainment complex. The work presented adopts the forms of mass media entertainment – its images, personae, rhythms, fantasies, vulgarities, technologies, and modes of circulation, staging their occupation of the world at large. The exhibition considers the exploded conditions of selfhood and subjectivity, their ongoing negotiations and precipitation in today's networked image regime.\n\nThe exhibition is made possible with the support of Amsterdam Fonds voor de Kunst, Cultuurfonds, Mondriaan Fonds and Gemeente Amsterdam. With the technical support of Alex Walker, Brian Mckenna, Pablo Bongcam Rezzonico, Viktor Eichler. Thanks to the artists, Michael Stevenson & Goswell Road.\"","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":2,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Catch 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔 by Hsu Che-Yu now to see how the artist explores the relationship ...","k":"exhibition","s":"2026-08-01","e":"2026-08-16","st":null,"et":null,"u":"queenswaytelevision","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbfBFcJkp7C/","x":"Catch 𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔 by Hsu Che-Yu now to see how the artist explores the relationship between ‘gestures’ and ‘horrors’ through the idea of recreation and control.\n\n3D scanning of the zoo and its taxidermy studio reveal a recurring compulsion to replicate and recreate, with scenes threaded together by a conversation that are simultaneously staged and real. \n\n𝒁𝒐𝒐 𝑯𝒚𝒑𝒐𝒕𝒉𝒆𝒔𝒊𝒔 continues to be on view at Queensway Television, opens daily from morning till night through 16 Aug 2026.\n\n@hsu__che_yu","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-01","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"On view until Aug 16, 𝘌𝘭𝘭𝘦𝘯 𝘗𝘢𝘶: 𝘚𝘩𝘦 𝘔𝘰𝘷𝘦𝘴 is the first US survey exhibition of the wor...","k":"exhibition","s":"2026-08-03","e":"2026-08-16","st":null,"et":null,"u":"sculpturecenter","c":"New York","co":"","p":"https://www.instagram.com/p/DblZa7KnD4K/","x":"On view until Aug 16, 𝘌𝘭𝘭𝘦𝘯 𝘗𝘢𝘶: 𝘚𝘩𝘦 𝘔𝘰𝘷𝘦𝘴 is the first US survey exhibition of the work of Ellen Pau, one of Hong Kong’s most influential and pioneering artists. ⁠\n⁠\nCreated in 1996 in Copenhagen, 𝘗𝘭𝘦𝘥𝘨𝘦: 𝘐 𝘊𝘢𝘯 𝘖𝘯𝘭𝘺 𝘛𝘦𝘭𝘭 𝘐𝘵 𝘵𝘰 𝘚𝘵𝘳𝘢𝘯𝘨𝘦𝘳𝘴 碧麗珠系列：我只跟不相識的說 refers to China’s assurance to Hong Kong that legal, social, and economic systems would be unchanged after the handover. Pau’s work from this period often responded to the psychological strain of not knowing how such a promise would land. “I am some kind of barometer,” Pau once said of her relationship to the city.⁠\n⁠\nAcross the years, the cultural milieu of Hong Kong has been a recurring touchstone for Pau, with the city’s colonial history and present struggles informing what can be understood as the artist’s highly personal modes of expression. Pau addresses the contemporary political context of Hong Kong without falling into nostalgia or offering direct commentary; rather, she alludes to shared experiences through emotion, harnessing the capacity of sound and image to preserve collective memory. ⁠\n⁠\n📸: Ellen Pau, 𝘗𝘭𝘦𝘥𝘨𝘦: 𝘐 𝘊𝘢𝘯 𝘖𝘯𝘭𝘺 𝘛𝘦𝘭𝘭 𝘐𝘵 𝘵𝘰 𝘚𝘵𝘳𝘢𝘯𝘨𝘦𝘳𝘴 碧麗珠系列：我只跟不相識的說, 1996/2018, detail, 𝘌𝘭𝘭𝘦𝘯 𝘗𝘢𝘶: 𝘚𝘩𝘦 𝘔𝘰𝘷𝘦𝘴, SculptureCenter, New York, 2026. Single-channel video installation; found object, mirror, latex, string. Courtesy the artist. Photo: Charles Benton","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"For this week’s staff pick, Gallery & Bookshop Attendant Maria Gonzalez recommends: THI...","k":"exhibition","s":"2026-08-03","e":"2026-08-16","st":"12:00","et":"17:00","u":"carpenter_center_harvard","c":"Cambridge","co":"","p":"https://www.instagram.com/p/Dblk3C_nE_h/","x":"For this week’s staff pick, Gallery & Bookshop Attendant Maria Gonzalez recommends: THING, edited by Robert Ford, Trent Adkins, and Lawrence Warren.\n\nStarted in 1989, THING magazine was the voice of the Queer Black music and art scene in the early 1990s. Capturing the multidisciplinary nature of the thriving House music scene that Ford and his editors were part of, THING opened its pages to a wide range of subjects: poetry and gossip, fiction and art, interviews and polemics. Publishing ten issues from 1989-1993, before it was cut short by Ford’s death from AIDS-related illness. \nTHING was a publication by and for its community and understood the fleetingness of its moment. To reencounter this work today is to reinstate the Black voices who were so central to the history of HIV/AIDS activism and Queer and club culture, but which were often sidelined by white Queer discourse.\n\n“Feeling the weight of the 10 issues of THING bound together really gives you a tangible sense of its undeniable impact and legacy. I love that the book is next to having the original issues spread out in front of you. Its true essence remains in these pages, allowing you to jump right back into that time. You almost feel you’ve just received your latest copy in the mail, like if you call the numbers in the ads someone will pick up.” — Maria \n\nSalad Days: Primary Information is on view for two more weeks, through August 16.\nOpen Thursday–Sunday, 12–5pm","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"@cj_hendry walks ARTnews through \"Pastel,\" her installation at @salon94design in New Yo...","k":"exhibition","s":"2026-08-06","e":"2026-08-16","st":null,"et":null,"u":"artnews","c":"New York","co":"","p":"https://www.instagram.com/p/DbtyWnmjghn/","x":"@cj_hendry walks ARTnews through \"Pastel,\" her installation at @salon94design in New York, which features a swimming-pool sized pit filled to the brim with plastic beads. For a dollar per bead, the exhibition invites people to string their own necklaces, bracelets, or charms.⁠\n⁠\nUpstairs holds just four small original works, evidence of a practice moving further from the drawing table and toward built environments.⁠\n⁠\n\"I think the word that best describes this exhibition is exaggerated,\" Hendry says. \"Some of my works are so unattainable, hundreds and thousands of dollars. I'm far more interested in a more accessible concept where people can really play and have fun and interact in some way.\"⁠\n⁠\nHer installations in the past have drawn criticism and questions over consumption, resale and use of AI. Others argue that it's a genuine alternative to the traditional gallery system.⁠\n⁠\n\"Pastel\" is on view at Salon 94 Design, through August 16.⁠\n⁠\nAdditional footage courtesy CJ Hendry.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"This new work “American Theaters of Suspension, Pt. 1: Ashokan” (and two other, older w...","k":"screening","s":"2026-04-19","e":"2026-08-17","st":null,"et":null,"u":"t1ffany4scal3","c":"New York","co":"","p":"https://www.instagram.com/p/DXUWG-aDtD_/","x":"This new work “American Theaters of Suspension, Pt. 1: Ashokan” (and two other, older works “Scroll Figure #2” and “Scroll Figure #3”) on view at MoMA PS1 (@momaps1) in the Greater New York 2026 show until August 17.\n\nHuge thanks to Jody Graf (@jody_graf), Kari Rittenbach (@krittenbach), Ruba Katrib and many others of the PS1 team. What a pleasure to work together on this. Thank you especially for placing my works beside one of my heroes’, Arlan Huang (@orlandonofly)—a placement made all the more remarkable because the curators were unaware of our personal connection: it goes back to 2022, a panel at the IMU UR2 Symposium with Howie Chen (@mistermisterchen) and Gordon H Chang, a conversation that has so profoundly shaped my practice since. A very special kismet, and a testament to a real attunement to the work.​​​​​​​​​\n\nAmerican Theaters of Suspension, Pt. 1: Ashokan\n2026\nVideo (color, silent); monitors on a suspended bar\n360 min.\n\n“Tiffany Sia reconfigures tropes from road movies, cartoons, reportage, and surveillance footage. She often engages the absences latent in filmic representation: that which remains unseen or illegible, whether by design, prohibition, or breaching the limits of the form itself.\n\nThis video installation is the first in a new series mapping spaces of jurisdictional ambiguity—“lumpy” territories, as coined by legal historian Lauren Benton—which Sia defines as “enclaves where the state detaches from contiguous geography to follow strategic resources: watersheds, military corridors, disputed maritime zones.” These monitors stream footage of Ashokan Reservoir. Located in the Catskill Mountains north of New York City, the reservoir provides roughly forty percent of municipal drinking water. Restricted to the public and policed by a special arm of the NYPD, even though it sits one hundred miles from the city, the reservoir embodies the fragile codependencies and hidden infrastructures that sustain urban life.”","r":true,"b":null,"af":false,"so":false,"pd":"2026-04-19","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Untitled (Fall), archival pigment print, 24 x 84 inches, 2023","k":"exhibition","s":"2026-07-23","e":"2026-08-17","st":null,"et":null,"u":"buckellison","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbJDQb4lZEl/","x":"Untitled (Fall), archival pigment print, 24 x 84 inches, 2023\n\n\"Untitled (Fall) depicts cut melons, transferware plates, Florentine greeting cards, spilled tea, and images of a boy at Eton College's Fourth of June celebration. An explicit pipeline for imperial administration, Eton's education was designed to produce a ruling class confident in its right to govern — at home and abroad — and its boater hat traveled with it. Hong Kong schools established under British rule adopted the hat directly.\"\n\nFeatured in \"Every Good Boy Does Fine\" at @mplusmgallery in Hong Kong, two-person show with @kayodeojo, open through August 17","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-23","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Untitled (Winter), archival pigment print, 24 x 84 inches, 2023","k":"exhibition","s":"2026-07-27","e":"2026-08-17","st":null,"et":null,"u":"buckellison","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DbTWf_ulQn1/","x":"Untitled (Winter), archival pigment print, 24 x 84 inches, 2023\n\n\"Untitled (Winter) depicts tulip petals, black ribbon, two travel alarm clocks set to the time zones of Los Angeles and Boston, hotel stationery, a pair of porcelain ducks, and printouts from John Singleton Copley's A Boy with a Flying Squirrel (1765). The painting shows Copley's half-brother with a pet flying squirrel, a common symbol of refinement, but Ellison was more interested in the silk: in late colonial American portraiture, fabric was far more expensive than the paintings themselves, and enormous attention to detail in a sitter's clothing telegraphed their prosperity. Ellison uses tulip petals to mimic the sitter's pink silk lapel.\"\n\nFeatured in \"Every Good Boy Does Fine\" at @mplusmgallery in Hong Kong, two-person show with @kayodeojo, open through August 17","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-27","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Farah Al Qasimi’s installation in Greater New York 2026 brings together a sprawling con...","k":"exhibition","s":"2026-08-03","e":"2026-08-17","st":null,"et":null,"u":"momaps1","c":"New York","co":"","p":"https://www.instagram.com/p/DblpdafJHWM/","x":"Farah Al Qasimi’s installation in Greater New York 2026 brings together a sprawling constellation of photographs made across Texas, Kuwait, Dearborn, Michigan, and the UAE, alongside research materials, ephemera, and found imagery.  \n\nFramed prints—including a woman lying in bed with her cat, another looking toward an oil refinery, and a chandelier suspended before a storybook waterfall mural—are hung across a large-scale vinyl wallpaper installation. Alongside these images, she’s hidden small cut-outs, YouTube comments, eBay listings, and stickers that offer glimpses into the artist’s process and visual thinking.\n\nDrawing on subjects that range from utopian aspirations and consumer culture to migration, labor, oil, and the circulation of images, Al Qasimi constructs an aesthetic language attentive to the interior life and the global forces that shape everyday experience. Her work reveals an uncanny geography in which seemingly disparate places are linked through shared visual and cultural histories.\n\nSee her work in person in Greater New York before the show closes August 17.\n\n_\n🎥: @sweepthemaru","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"The #1 mirror-selfie spot in Greater New York 🤳","k":"exhibition","s":"2026-08-05","e":"2026-08-17","st":null,"et":null,"u":"momaps1","c":"New York","co":"","p":"https://www.instagram.com/p/Dbq-zRKn3_M/","x":"The #1 mirror-selfie spot in Greater New York 🤳\n\nWin McCarthy's \"Pan-psychic All Seers\" mounts convex security mirrors, like those that flank bodega aisles or subway underpasses, to photographic light stands. The resulting work considers how visibility shapes everyday life in New York City, revealing the ways surveillance and image-making are intertwined. \n\nExperience the work in the final weeks of Greater New York, on view through August 17.\n\n—\nWin McCarthy. \"Pan-psychic All Seers,\" 2026. Half dome security mirrors, c-stands, sandbags. \n📸: @noelwoodford, @cdmd515","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Untitled (Spring), archival pigment print, 24 x 84 inches, 2023","k":"exhibition","s":"2026-08-05","e":"2026-08-17","st":null,"et":null,"u":"buckellison","c":"Hong Kong","co":"","p":"https://www.instagram.com/p/DbozZCSkeTb/","x":"Untitled (Spring), archival pigment print, 24 x 84 inches, 2023\n\n\"Untitled (Untitled (Spring) depicts five vases of peonies (one spilled), wool dryer balls, carbon copies of dry cleaning receipts, a blue card used to ensure symmetrical addressing of thank you notes, a dog leash, a wool school skirt, and printouts of Allan Ramsay's Thomas, 2nd Baron Mansel of Margam with his Blackwood Half-Brothers and Sister (1742). The painting depicts the children of a noted British admiral; Ellison zooms in on the sister, Mary, who was partially sighted and places her hand over a bird's breast, perhaps to demonstrate the importance of touch. Objects related to garment care and comportment invite parallels between the cultivation of crops and the cultivation of children: certain traits are encouraged, while others — like sloppy letter writing — are plucked out like weeds.\"\n\nFeatured in \"Every Good Boy Does Fine\" at @mplusmgallery in Hong Kong, two-person show with @kayodeojo, open through August 17","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-05","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"In 1976, artist Theresa Hak Kyung Cha began filming \"White Dust from Mongolia\" in Seoul...","k":"screening","s":"2026-08-07","e":"2026-08-17","st":null,"et":null,"u":"momaps1","c":"New York","co":"","p":"https://www.instagram.com/p/DbwRbr8iW7E/","x":"In 1976, artist Theresa Hak Kyung Cha began filming \"White Dust from Mongolia\" in Seoul. When she was killed near her SoHo home in 1982, the footage was left unedited. \n\nIn 2017, artist Cici Wu began mining Cha's archive and has spent nearly a decade investigating it. Rather than attempting to complete \"White Dust,\" Wu created a new installation of flickering projections and rice-paper light sculptures that meditates on the material Cha left behind, in close collaboration with the artist's estate.\n\nExperience this luminous installation in the final weeks of Greater New York, on view through August 17.\n\n_ \nCici Wu. \"Upon Leaving the White Dust (go go she and not come back said go and don’t come back),\" 2018/2025. Ink, rice paper, bamboo wire, wheat glue, handmade glass, LED lights, electronics, 16mm transferred to HD video (b/w, no sound), video (light data collected from the screening of unfinished film footage \"White Dust from Mongolia\" by Theresa Hak Kyung Cha, 1980).\n\n📸 : Kyle Knodell.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"NEW YORK – Mary Helena Clark in Greater New York 2026 is now on view at MoMA PS1 throug...","k":"exhibition","s":"2026-08-08","e":"2026-08-17","st":null,"et":null,"u":"hoffman.donahue","c":"New York","co":"","p":"https://www.instagram.com/p/Dbx3QKGFuGl/","x":"NEW YORK – Mary Helena Clark in Greater New York 2026 is now on view at MoMA PS1 through August 17.\n\nAlongside her new video work, ‘Engram Set’, 2025, Greater New York 2026 features Mary Helena Clark’s ‘Ideomotor (Sexing a canary)’, 2025, a trio of photographs capturing the traditional practice of needling. A debated folk practice, needling involves dangling a metal object over a bird’s body. The direction the object swings is said to indicate the animal’s sex. This is an ‘ideomotor response’ — a psychological phenomenon where involuntary muscular movements occur in response to unconscious thoughts, expectations or desires, not unlike a divining rod or a Ouija board.\n\nAlso included in the survey is ‘Decoy 1,2,3’, 2025, steel sculptures made from motorcycle tanks equipped with electric heaters. When powered, the tank’s warmth hovers around 100.4°F (38°C) the average temperature of a human fever. The tank’s warmth signals a sentience that borders on sickness; The switch boxes act as both life source and life support – monitors of care and control.\n\nMary Helena Clark’s background in experimental cinema stimulates her research driven work. Her films and photographs often recreate technical, instructional, or scientific images presumed to be neutral but, in a new context, surface psycho-sexual undertones. Her sculptures subvert and reimagine the function of found objects by creating new hybrid forms that allude to sentience and affect.\n\nForefronting the perspectives of early and mid-career artists, Greater New York 2026 emphasizes the forces that shape daily life in the city today, as well as strategies of resistance and adaptation in the face of increased surveillance, economic precarity, and shifting technologies.\n\nInstallation view: Greater New York, MoMA PS1, New York, NY. Photography by Kris Graves and Charles Benton \n\n#maryhelenaclark @maryhelenaclark @momaps1","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Abigail DeVille’s Deo Vindice (Orion’s Cabinet) is now on view at ICA VCU. Experience t...","k":"exhibition","s":"2026-06-03","e":"2026-08-18","st":null,"et":null,"u":"icavcu","c":"Richmond","co":"","p":"https://www.instagram.com/p/DZIudSrvSyn/","x":"Abigail DeVille’s Deo Vindice (Orion’s Cabinet) is now on view at ICA VCU. Experience the Richmond debut of this immersive installation which was commissioned as part of the acclaimed MOCA exhibition, MONUMENTS.\n\nDeo Vindice (Orion’s Cabinet) will be on view until August 18, 2026.\n\nTo RSVP click the link in bio. To learn more about the exhibit, go to icavcu.\n\nVideo by @98.everafter","r":true,"b":"rsvp","af":true,"so":false,"pd":"2026-06-03","ld":0,"dl":"2026-08-18","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"An anti-monument to the Confederacy comes home.","k":"exhibition","s":"2026-06-05","e":"2026-08-18","st":"21:00","et":null,"u":"icavcu","c":"Richmond","co":"","p":"https://www.instagram.com/p/DYnNDGqGH5H/","x":"An anti-monument to the Confederacy comes home.\n\nThis summer, “Abigail DeVille (@victoriouspurple): Deo Vindice (Orion’s Cabinet)” will travel from the acclaimed @moca MONUMENTS exhibition to be shown here in Richmond at the ICA.\n\nIn early April 1865, fleeing Confederate officials in Richmond, VA, ordered the city burned to prevent its munitions and railway foundry from falling into Union hands, reducing the Confederate capital to ruins. DeVille’s immersive installation meditates on the fall of Richmond at the end of the Civil War. \nInspired by photographs taken in the aftermath of the fire, DeVille constructs clusters of colonial-style curio cabinets—charred, skeletal, and lashed together by monument-restoration scaffolding wrapped in singed fabric. \n\nThe myth of the Lost Cause minimizes the centrality of maintaining slavery to the South’s secession, positing a softer picture of rebellion in the face of tyranny. \n\nDeVille exposes the irony at the heart of this narrative. Cabinets like these are intended to shield heirlooms from dust and decay. Likewise, Lost Cause ideology has attempted to protect a distorted historical memory from the corrections of modern scholarship. Just as the burned cabinets have lost their protective utility, the Confederacy’s claim of defending its people is betrayed by its own leaders setting the city ablaze.\n\nThe cabinet clusters trace the principal stars of the constellation Orion, drawing a parallel between the mythological hunter’s drive to dominate and the Confederacy’s drive to preserve white supremacy. In both cases, their will to power drove them to ruin.\n\nDeo Vindice will open on June 5 and be on view until August 18. Join us for the opening on June 5 from 5 to 9 PM. To  learn more and to RSVP click the link in bio. The ICA is free and open to the public. \n\nThe Richmond debut of Deo Vindice (Orion’s Cabinet) is curated by Amber Esseiva, Senior Curator and Director of Curatorial Affairs at the ICA with research support by Kennedy Jones, Curatorial Assistant\n\nPhoto:\nInstallation view of MONUMENTS, October 23, 2025–May 3, 2026, at The Geffen Contemporary at MOCA. (Photograph by Fredrik Nilsen; courtesy of MOCA and The Brick)","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-05-21","ld":15,"dl":"2026-08-18","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Abigail DeVille: Deo Vindice (Orion’s Cabinet) on view until August 18th at the ICA ❤️","k":"exhibition","s":"2026-07-10","e":"2026-08-18","st":null,"et":null,"u":"amberesseiva","c":"Richmond","co":"","p":"https://www.instagram.com/p/Danz5g2iXtz/","x":"Abigail DeVille: Deo Vindice (Orion’s Cabinet) on view until August 18th at the ICA ❤️\n\n📸 David Hale","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-10","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Let’s make this a summer of creative discoveries! 🌞🎨","k":"other","s":"2026-08-02","e":"2026-08-20","st":null,"et":null,"u":"sharjahart","c":"Sharjah","co":"","p":"https://www.instagram.com/p/DbiiLQIIYGo/","x":"Let’s make this a summer of creative discoveries! 🌞🎨\n\nPacked with fun and memorable moments for children, our Summer Camp offers exciting opportunities to explore and create art every week.\n\nWatch what our campers had to say about their favourite moments so far! \n\nShare your child’s favourite Summer Camp memory in the comments.👇\n\nSummer Camp continues until 20 August. Explore the full programme and register now through the link in our bio.\n\nلنجعل صيفنا مليئاً بالإبداع 🌞🎨\n\nيقدم المخيم الصيفي كل أسبوع فرصة جديدة للأطفال لاستكشاف وصنع الفن، ضمن أجواء ضمن أجواء مليئة بالمرح والذكريات.\n\nشاهدوا ما قاله المشاركون عن أجمل لحظاتهم في المخيم حتى الآن، وشاركونا في التعليقات الذكرى المفضلة لدى أطفالكم👇\n\nيستمر المخيم الصيفي حتى 20 أغسطس. اطلعوا على البرنامج الكامل وسجّلوا الآن عبر الرابط الموجود في الوصف.","r":true,"b":"register","af":true,"so":false,"pd":"2026-08-02","ld":0,"dl":"2026-08-20","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"We're pleased to announce the launch of the inaugural PSSSR Emerging Writers Fund: two ...","k":"exhibition","s":"2026-08-03","e":"2026-08-20","st":null,"et":null,"u":"palmspringsschool","c":"","co":"","p":"https://www.instagram.com/p/Dblv7MSjw5v/","x":"We're pleased to announce the launch of the inaugural PSSSR Emerging Writers Fund: two $2,000 grants and six months of editorial mentorship for writers without access to elite institutions. Open to non-fiction projects across a wide range of subjects. Applications close August 20. Link in bio.","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-03","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Shellie Zhang in the Group Exhibition, No Neutral at YveYANG in NYC!","k":"exhibition","s":"2026-08-08","e":"2026-08-21","st":null,"et":null,"u":"patelbrowngallery","c":"New York","co":"","p":"https://www.instagram.com/p/Dbym5jeEUba/","x":"Shellie Zhang in the Group Exhibition, No Neutral at YveYANG in NYC! \n\n⃝🧚🏻‍♀️ ⊹ ࣪ ˖\n\nNo Neutral presents the sculptural works of Amanda Atria, Taisha Carrington, Cameron Patricia Downey, Joy Li, Abenda Sohn, Josh Rabineau, A.Y. Wang, and Shellie Zhang. In No Neutral, sculpture dances between object and experience; the sudden and the constant; the natural and the unnatural; the multiple and the singular; and the hand and the machine. Through these works, specificity drives cultural materialization, interrogating the ways context adheres to a work, how materials migrate and translate from their points of origin, and what is gained (or lost) in that displacement.\n\nShellie Zhang’s Flush Blush Bruise No. 3 explores how histories of translation, migration, and memory leave traces and impressions.\n\n–Excerpt from exhibition text by by Taisha Carrington and A.Y. Wang\n\n⃝🧚🏻‍♀️ ⊹ ࣪ ˖\n\nNo Neutral is on view through August 21.\n\nIf you’re in New York, be sure to stop by and see the exhibition. \n\nCongratulations Shellie! \n\n⊹ ࣪ ˖🧚‍♀️ ⊹ ࣪ ˖🧚‍♀️ ⊹ ࣪ ˖🧚‍♀️ ⊹ ࣪ ˖🧚‍♀️ ⊹ ࣪ ˖🧚‍♀️ ⊹ ࣪ ˖🧚‍♀️ ⊹ ࣪ ˖🧚‍♀️⊹ ࣪ ˖🧚‍♀️\n#ShellieZhang #NoNeutral #YveYANGGallery #ContemporarySculpture #PatelBrown","r":true,"b":null,"af":false,"so":false,"pd":"2026-08-08","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"SELF TAPE FOR SOAP OPERA","k":"performance","s":"2026-06-21","e":"2026-08-22","st":"12:00","et":"17:00","u":"newtheaterhollywood","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DZXv4pfm6Zw/","x":"SELF TAPE FOR SOAP OPERA\nOrganized by New Theater Hollywood\nat Mariposa LA\n\nWith work by Asher Hartman, Karl Holmqvist, Jasmine Johnson, Klein, Ken Okiishi, Colin Self, and Amalia Ulman\n\nOn view June 21-August 22\nOpen Thursday-Saturday 12-5pm\n2700 N. Beachwood Drive, Los Angeles\n\nMariposa and New Theater Hollywood present SELF TAPE FOR SOAP OPERA, an exhibition of eight videos by seven artists who have staged, or will stage, plays at New Theater Hollywood. Each video work takes the form of a remake or re-representation, often as performance documentation, but they plunge deeper: channeling spirits, historical figures, and grief for what is lost in the capture.\n\nThe show’s title comes from Klein’s eponymous video, in which she re-enacts all roles in a fifteen-second trailer for the British soap opera EastEnders, submitted as an actual audition tape for an acting school. The self tape is a stand in for a body, a promise of more to come - a ghost ready and willing to be plied with narrative.\n\n@mariposa.drive \n@newtheaterhollywood\n@callahead_ \n@kuenstlersozialkasse \n@brexitlefleur \n\n@chickentasteslikewood \n@khqvst \n@jasmine.johnson \n@kenokiishi.info \n@colinself \n@amaliaulman","r":false,"b":null,"af":false,"so":false,"pd":"2026-06-09","ld":12,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Tea-soaked madeleine installation images","k":"exhibition","s":"2026-07-10","e":"2026-08-22","st":"10:00","et":"18:00","u":"oolongallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbvwBT1kfwP/","x":"Tea-soaked madeleine installation images \n\nby Pat Garcia Jr. for\n\nMichael Colletta\nTea-soaked madeleine\nJuly 10–August 22, 2026\n\nOolong Gallery\n4 Cortlandt Alley NYC\nbetween White & Franklin\nMon-Sat 10-6pm\n\nADA and collector elevator access at 368 Broadway upon request by SHRINE gallery.","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-07","ld":-28,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"detail of Colletta — happy summer 2026","k":"exhibition","s":"2026-07-10","e":"2026-08-22","st":"10:00","et":"18:00","u":"oolongallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbtGVwcRRlg/","x":"detail of Colletta — happy summer 2026\n\nfrom:\n\nMichael Colletta\nBeach Walker, 2013\nOil on canvas, artist frame\n41 x 32 in\n\nImage Credit: Philipp Scholz Rittermann\n\nOolong Gallery presents \n\nMichael Colletta\nTea-soaked madeleine\nJuly 10–August 22, 2026\n\n4 Cortlandt Alley NYC\nbetween White & Franklin\nMon-Sat 10-6pm\n\nADA and collector elevator access at 368 Broadway upon request by SHRINE gallery.\n\n“Michael Colletta’s paintings are rooted in the ordinary events that accumulate into a life: gatherings of family, childhood play on suburban streets, garage-band concerts, the watering of plants, the umbrellaing of a beloved, and the solace of remembered places. Echoing the exhibition’s title, Tea-soaked Madeleine, these works arise from a mysterious transformation of memory into universally intimate micro-monuments. Working from memory and invention as much as observation, Colletta pares away incidental detail to arrive at images that feel at once personal and archetypal. His recurring figures and motifs function less as portraits of specific individuals than as a means to convey affection, longing, wonder, and belonging.\n\nColletta’s paintings possess a quiet emotional gravity. Their simplified forms, carefully orchestrated color relationships, and luminous spaces create a world where everyday experience takes on an almost mythic dimension. Colletta reminds us that profound meaning is often found not in extraordinary events, but in the moments that linger in memory long after they have passed, acquiring a significance greater than the events themselves.” \n\n—Larry Groff","r":false,"b":null,"af":false,"so":false,"pd":"2026-08-06","ld":-27,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"For the group exhibition *Tom's Stretch* honouring the legacy of Tom of Finland @davidk...","k":"exhibition","s":"2026-07-10","e":"2026-08-22","st":null,"et":null,"u":"jlnccc","c":"Los Angeles","co":"","p":"https://www.instagram.com/p/DanV94-jk99/","x":"For the group exhibition *Tom's Stretch* honouring the legacy of Tom of Finland @davidkordanskygallery \nOpening today in LA, ends August 22\n📷 Jeff McLane","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-10","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"All My Children.","k":"other","s":"2026-07-10","e":"2026-08-22","st":null,"et":null,"u":"phristoff","c":"","co":"","p":"https://www.instagram.com/p/DanTPF9leqR/","x":"All My Children. \nJoey, Hank and Kayla at Joey’s incredible show @parent.company.gallery \n(Joey Gonnella, “Love will return in a different way”, at \nParent Company, 154 E Bdwy, through August 22 \n#love #friendship #artists #whenthestudentsbecometheteachers @joeygonnella @parent.company.gallery @visualcritical","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-10","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Faith Holland","k":"exhibition","s":"2026-07-16","e":"2026-08-22","st":"18:00","et":"20:00","u":"microscope_gallery","c":"New York","co":"","p":"https://www.instagram.com/p/DayxaR5Ru0n/","x":"Faith Holland\n“Scribble Scrabble Slop”\nJuly 16 – August 22, 2026\nOpening Thursday July 16, 6-8pm\n\nMicroscope is very pleased to present “Scribble Scrabble Slop,” as the second solo exhibition at the gallery by digital media artist Faith Holland.\n\nFor the new animated video, 3D sculptures, digital prints, and interactive wallpaper works on view in “Scribble Scrabble Slop,” Holland attempts to teach AI models to draw in the manner of a young toddler. To do so, the artist retrains them on a homemade data set she created containing scans of hundreds of actual early drawings — or “scribble scrabbles” — made by her child Hildegard Holland Watter (Hildy) between the ages of one and three. \n\nThrough the process, Holland’s’ works reveal scribbling as a blindspot of AI models, exposing intrinsic limitations, bias, and knowledge gaps of the technology to which we are increasingly surrendering control. The artworks on view also advocate for alternative training methods, akin to parenting, than those most commonly used, which the artist describes as “scraping the internet indiscriminately.” Holland notes AI models’ inability to, among others, distinguish between real and inauthentic sources; their insertion of unrelated and adult content in their results; and their creation and regurgitation of low quality AI-generated slop.\n\n“After years of working with generations of AI, which has changed quickly and entirely underneath my feet, I found that it still has a lot to learn.” — Faith Holland\n\n[Image: Faith Holland, “Green (Before the Word),” 2026, single-channel video, 1 hours 40 minutes – Courtesy the artist and Microscope Gallery, New York.]\n\n#faithholland #scribble #ai #toddler #microscopegallery","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-15","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Faith Holland’s exhibition “Scribble Scrabble Slop” is on view and runs through August ...","k":"exhibition","s":"2026-07-17","e":"2026-08-22","st":null,"et":null,"u":"microscope_gallery","c":"New York","co":"","p":"https://www.instagram.com/p/Da5_l7wTnfS/","x":"Faith Holland’s exhibition “Scribble Scrabble Slop” is on view and runs through August 22nd!\n\n[Image: Faith Holland, “Up To Its Limits,” 2026, interactive vinyl wallpaper, dimensions variable, installation view]\n\n#faithholland #ai #scribbles #video #microscopegallery","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-17","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"One month left to experience MUSIC PROJECT.","k":"exhibition","s":"2026-07-29","e":"2026-08-22","st":null,"et":null,"u":"musicproject_mp","c":"Bangkok","co":"","p":"https://www.instagram.com/p/DbXTtZ8OSxH/","x":"One month left to experience MUSIC PROJECT.\nOn view through 22 August 2026 at BANGKOK CITYCITY GALLERY.\n\nAs we enter the exhibition’s final month, we look back on the ideas that have unfolded throughout the program—from music as a means of preserving memory to its capacity to generate narratives, form identities, create communities, adapt through technology, transform bodily experience, and ultimately shape what we understand as the contemporary.\n\nThis exhibition has been made possible by an expanded community gathered around sound. Our sincere thanks to our team, artists, participants, collaborators, and everyone who has been part of this journey.\n\nConceptual diagram: Pongsakorn Yananissorn, adapted from the curatorial framework of MUSIC PROJECT 2026 BANGKOK. Visual design: Pongsakorn Yananissorn & Aekasit Siriratanawit.\n\nWatch program archives: vimeo.com/bangkokcitycity\nFollow our programs: instagram.com/musicproject_mp/\n\nเหลือเวลาอีกหนึ่งเดือนสำหรับ MUSIC PROJECT\nจัดแสดงถึง 22 สิงหาคม 2569 ที่ บางกอก ซิตี้ซิตี้ แกลเลอรี่\n\nก่อนจะเดินทางเข้าสู่เดือนสุดท้ายของนิทรรศการ เราชวนย้อนกลับไปสำรวจเส้นทางของแนวคิดที่ค่อยๆ คลี่คลายตลอดระยะเวลาของโครงการ จากดนตรีในฐานะพื้นที่ของการเก็บรักษาความทรงจำ สู่การสร้างเรื่องเล่า การประกอบสร้างอัตลักษณ์ การก่อรูปของชุมชน การปรับตัวผ่านเทคโนโลยี การเปลี่ยนแปลงประสบการณ์ของร่างกาย และท้ายที่สุด การหล่อหลอมความเข้าใจของเราที่มีต่อช่วงเวลาร่วมสมัย\n\nนิทรรศการนี้เกิดขึ้นได้จากผู้คนที่ขยายขอบเขตของการฟังและการคิดผ่านเสียงไปด้วยกัน ขอบคุณศิลปิน ทีมงาน ผู้เข้าร่วมโครงการ พันธมิตร และทุกคนที่ร่วมเป็นส่วนหนึ่งของ MUSIC PROJECT\n\nแผนภาพเชิงแนวคิด: พงศกรณ์ ญาณะณิสสร จากกรอบแนวคิดภัณฑารักษ์ของ MUSIC PROJECT 2026 BANGKOK ออกแบบภาพ: พงศกรณ์ ญาณะณิสสร และ เอกศิษฐ์ ศิริรัตนวิทย์\n\nชมบันทึกกิจกรรมทั้งหมดได้ที่: vimeo.com/bangkokcitycity\nติดตามโปรแกรมของเรา: instagram.com/musicproject_mp/\n\n#MusicProject #BangkokCityCityGallery","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"Faith Holland","k":"exhibition","s":"2026-07-29","e":"2026-08-22","st":null,"et":null,"u":"microscope_gallery","c":"New York","co":"","p":"https://www.instagram.com/p/DbY7yNHTcxm/","x":"Faith Holland\n“The Twenty Basic Scribbles,” 2026\n4k single-channel video\n4 minutes 39 seconds\n\n “The Twenty Basic Scribbles,” which borrows its name from Rhoda Kellogg’s idea of the 20 fundamental marks made by children, re-introduces the human hand to AI-generated images from the same models trained on my daughter Hildy’s drawings. I carefully retraced the AI’s images so that they appear at first as though they are being drawn in real time. As the video collage progresses, the retracing is sped up and would require more than one hand working simultaneously, pointing to its digital and nonhuman makers.” — FH\n\nFaith Holland’s solo exhibition “Scribble Scrabble Slop” continues through August 22nd!\n\n#faithholland #scribbles #ai #rhodakellogg #microscopegallery","r":true,"b":null,"af":false,"so":false,"pd":"2026-07-29","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"-Summer Group Exhibition-","k":"performance","s":"2026-08-01","e":"2026-08-22","st":null,"et":null,"u":"bonian.space","c":"","co":"","p":"https://www.instagram.com/p/DbdF-yFFGSt/","x":"-Summer Group Exhibition-\nBONIAN SPACE is pleased to announce the group exhibition Almost Transparent Blue, on view from August 1 to August 22, 2026. Curated by Ning Wen, the exhibition will present more than thirty works newly created by eight young female artists: CHENG Xitong, LV Kangyou, HU Xinyue, WANG Qiqi, WANG Zichen, Mitong WANG, XU Faping, and ZHANG Wanyue.\n\nIn 1976, Japanese writer Ryū Murakami’s novel Almost Transparent Blue exposed the spiritual wounds of postwar Japanese youth. Today’s young people no longer confront the ruins of war or the loss of identity in the same way, yet they seem suspended within another, subtler dilemma: sensory numbness caused by information overload, self-performance within social networks, uncertainty after the disappearance of fixed answers, and the anxiety of seeking individual expression within highly regulated social structures.\n\nBringing together eight female artists born in the 1990s and after the 2000s, the exhibition explores shared contemporary experiences through diverse media including painting, mixed-fiber works, and water-based collage. Rather than offering definitive answers, Almost Transparent Blue uses a literary and abstract “blue” as a spiritual container, holding emotions of uncertainty, contradiction, confusion, and self-reconciliation, allowing every form of youthful struggle to find a transparent space for contemplation.\n\n—————————\n‘Almost Transparent Blue’\nArtist: \nCHENG Xitong | HU Xinyue | LV Kangyou | Mitong WANG | WANG Qiqi | WANG Zichen | XU Faping | ZHANG Wanyue\nCurated by Ning Wen \nOn view from August 1-22, 2026\n\n#contemporaryartist \n#artexhibition \n#bonianspace \n@youming_jin @youmingjin","r":false,"b":null,"af":false,"so":false,"pd":"2026-07-31","ld":1,"dl":null,"ds":null,"ap":false,"rel":false,"q":false},{"now":true,"t":"#WhitneyBiennial 2026 is officially open! Join us all day today for Free Second Sundays...","k":"exhibition","s":"2026-03-08","e":"2026-08-23","st":null,"et":null,"u":"whitneymuseum","c":"New York","co":"","p":"https://www.instagram.com/p/DVoH7g9gQyK/","x":"#WhitneyBiennial 2026 is officially open! Join us all day today for Free Second Sundays to see the exhibition for free.\n\nGo behind the scenes with curators @marcelacguerrero and @drewmsawyer as they detail the thought process behind this year’s Biennial.\n\nExperience our signature exhibition now through August 23.","r":true,"b":null,"af":false,"so":false,"pd":"2026-03-08","ld":0,"dl":null,"ds":null,"ap":false,"rel":false,"q":true},{"now":true,"t":"What does it take to remake the world?","k":"screening","s":"2026-06-05","e":"2026-08-23","st":"17:30","et":"21:00","u":"icavcu","c":"Richmond","co":"","p":"https://www.instagram.com/p/DZGIlImCeaQ/","x":"What does it take to remake the world?\n\nFertile Resistance: @kadistkadist Collection-in-Residence gathers six films from across the globe—from Chile, Australia (Aboriginal land), Asia's metropolises, Ukraine, and Guatemala—lush, formally daring works that move across memory, militarization, and ecological precarity, and the many forms resistance takes within each. Across these films, the artists parse precarity, survival, and the capacity of art and collective action to reimagine the world.\n\nFeatured artists include Farah Al Qasimi (@frequentlyaskedquestion), Regina José Galindo (@galindoreginajose), Enrique Ramirez (@enriqueramirezf), Miljohn Ruperto (@miljohnruperto) and Rini Yun Matea, Kaylene Whiskey, and Open Group (Yuriy Biley, Pavlo Kovach, and Anton Varga). (@open_group_ )\n\nFertile Resistance opens June 5, All films will play on a loop from 1 PM to 5 PM through August 23, 2026. \n\nAnd don't miss KADIST: Fertile Resistance Beneath the Surface on Thursday, July 23, 5:30–9 PM,a special evening screening focused on two video works by Miljohn Ruperto, whose films interrogate the boundaries between human perception, historical narrative, and the natural world. The program includes Janus (2013) and Ordinal (SW/NE) (2017, co-created with Rini Yun Matea), followed by a conversation between Ruperto and VCU Cinema professor J.M. Tyree. RSVP here.\n\nThe ICA is free and open to the public. To learn more and RSVP for the opening, click the link in bio.","r":false,"b":"rsvp","af":true,"so":false,"pd":"2026-06-02","ld":3,"dl":"2026-08-23","ds":"run closes","ap":false,"rel":false,"q":false},{"now":true,"t":"Save the date! ✅ Met veel plezier nodigen Odapark en Marres je uit voor de feestelijke ...","k":"exhibition","s":"2026-06-27","e":"2026-08-23","st":"14:00","et":null,"u":"marres_maastricht","c":"Maastricht","co":"","p":"https://www.instagram.com/p/DYh_CyAoruI/","x":"Save the date! ✅ Met veel plezier nodigen Odapark en Marres je uit voor de feestelijke opening van de Limburg Biënnale 2026. Tweejaarlijks verbindt de Limburg Biënnale de professionele en amateurkunsten in een bijzondere groepstentoonstelling naar aanleiding van een open call. Hiermee wordt er aandacht gegeven aan iedereen die zich kunstenaar voelt, van kersverse hobbyist tot ervaren professional.\n\nDit jaar heeft de jury van 20 gevestigde kunstenaars een selectie mogen maken uit maar liefst 2.500 ingezonden werken. Deze is te zien in de door hen samengestelde ruimtes bij Odapark en Marres van 27 juni t/m 23 augustus 2026.\n \n🟢 Feestelijke opening 🟢\nZaterdag 27 juni 2026\nOdapark: start 14:00 (inloop vanaf 13:30, open tot 17:00)\nMarres: inloop vanaf 17:00 / deuren open tot 19:30 / tentoonstelling sluit om 20:00\n\nLocaties:\nOdapark, Merseloseweg 117, Venray \nMarres, Capucijnenstraat 98, Maastricht\n\nJury: Morena Bamberger, Mounir Eddib, Arash Fakhim, Henri Jacobs, Juul Kraijer, Charl Landvreugd, Bodil Ouédraogo, Ilke Paddenburg, Misha de Ridder, Lydia Schouten, Koen Taselaar, Simone Trum, Simone Albers, Sara Bachour, Maarten Bel, Club Lam, Karin Peulen, Puck Verkade\n \n//\n \nSave the date! ✅ With great pleasure, Odapark and Marres invite you to the festive opening of the Limburg Biënnale 2026. Every two years, the Limburg Biënnale connects the professional and amateur arts in a special group exhibition with works selected through an open call. It highlights anyone who feels like an artist, from starting hobbyists to established pr
